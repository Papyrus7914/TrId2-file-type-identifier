name: CI
on: push
jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install PyYAML
      - run: ./build-win.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: build-windows
          if-no-files-found: error
          path: |
            build/TrId2Lib.zip
            build/TrId2Console-windows-x64.zip
  build-linux:
    name: Build Linux
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: ./build-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: build-linux
          if-no-files-found: error
          path: build/TrId2Console-linux-x64.tar.gz
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install PyYAML
      - run: ./build-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: build-macos
          if-no-files-found: error
          path: build/TrId2Console-macos-arm64.tar.gz
  combine-build-results:
    name: Combine build results
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-linux
      - build-macos
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: build-*
          path: build
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          draft: true
          files: |
            build/TrId2Lib.zip
            build/TrId2Console-windows-x64.zip
            build/TrId2Console-linux-x64.tar.gz
            build/TrId2Console-macos-arm64.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: Build artifacts
          if-no-files-found: error
          path: |
            build/TrId2Lib.zip
            build/TrId2Console-windows-x64.zip
            build/TrId2Console-linux-x64.tar.gz
            build/TrId2Console-macos-arm64.tar.gz