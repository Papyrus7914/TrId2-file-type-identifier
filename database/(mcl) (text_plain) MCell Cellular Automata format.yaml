Name: MCell Cellular Automata format
URL: "https://mcell.ca/pages/mcell.html"
FileNameExtensions: ["mcl"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "#MCell "
    CaseSensitive: true
  - Pos: 8
    AsciiString: "."
    CaseSensitive: true
  - Pos: any
    AsciiString: "BOARD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RULE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WRAP"
    CaseSensitive: false
