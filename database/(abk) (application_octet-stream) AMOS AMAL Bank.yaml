Name: AMOS AMAL Bank
Description: Contains instructions in AMOS Animation Language format.
URL: "http://en.wikipedia.org/wiki/AMOS_(programming_language)"
FileNameExtensions: ["abk"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "AmBk"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "Amal"
    CaseSensitive: true
