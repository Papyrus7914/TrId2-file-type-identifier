Name: RenderStar-2 Palette/gradients
Description: DOS AutoCAD renderer by Modern Medium.
FileNameExtensions: ["pal"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "RenderStar-2\r\npalshd_int1"
    CaseSensitive: true
  - Pos: any
    AsciiString: "RENDERSTAR-2"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PALBGR_INT2"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PALSHD_INT1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAL_INT3"
    CaseSensitive: false
