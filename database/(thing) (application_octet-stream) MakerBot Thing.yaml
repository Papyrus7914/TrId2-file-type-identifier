Name: MakerBot Thing
URL: "https://en.wikipedia.org/wiki/MakerBot_Industries"
FileNameExtensions: ["thing"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "MAKERBOT THING FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MANIFEST.JSONPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".STLPK"
    CaseSensitive: false
