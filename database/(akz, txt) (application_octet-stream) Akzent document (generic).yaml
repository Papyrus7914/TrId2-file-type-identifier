Name: Akzent document (generic)
Description: German shareware word processor by Harald Czech and Axel Peter Winkler.
FileNameExtensions: ["akz", "txt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: " AKZENT\r\n"
    CaseSensitive: true
  - Pos: 21
    AsciiString: "\bV "
    CaseSensitive: true
  - Pos: 25
    AsciiString: "."
    CaseSensitive: true
