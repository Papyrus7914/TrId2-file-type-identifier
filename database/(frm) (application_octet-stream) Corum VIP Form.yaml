Name: Corum VIP Form
Description: DOS RDBMS by NovaQuest InfoSystems.
FileNameExtensions: ["frm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x01\xE2\x01\0\xC7\xE2\xE0Corum VIP "
    CaseSensitive: true
  - Pos: any
    AsciiString: "THE VALUE YOU TYPED IS NOT VALID FOR THIS FIELD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUTTON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_CLOS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_DONE"
    CaseSensitive: false
