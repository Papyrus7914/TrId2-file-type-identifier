Name: AllWebMenus project (v3.xx)
URL: "http://www.likno.com/"
FileNameExtensions: ["awm"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "awm300\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ENDPARAMS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MENU TREE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AWM300"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN"
    CaseSensitive: false
