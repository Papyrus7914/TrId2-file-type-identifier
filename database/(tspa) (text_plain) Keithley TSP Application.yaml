Name: Keithley TSP Application
URL: "https://www.tek.com/en/products/keithley"
FileNameExtensions: ["tspa"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "loadscript "
    CaseSensitive: true
  - Pos: any
    AsciiString: "-- $DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-- $PRODUCT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOADSCRIPT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-- $TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENDSCRIPT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-- $ICON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISPLAY."
    CaseSensitive: false
  - Pos: any
    AsciiString: "FUNCTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOCAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_ICON"
    CaseSensitive: false
