Name: Cybertracker module
FileNameExtensions: ["ct"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "CAT "
    CaseSensitive: true
  - Pos: any
    AsciiString: "FORM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PBSO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POSL"
    CaseSensitive: false
