Name: Visual Studio Project build log
URL: "https://en.wikipedia.org/wiki/Visual_Studio"
FileNameExtensions: ["plg"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "--------------------Configuration: "
    CaseSensitive: true
  - Pos: any
    AsciiString: "BEGINING BUILD WITH PROJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ACTIVE CONFIGURATION IS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BROWSER DATABASE MAKER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "C++ COMPILER FOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPONENT 0XA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CUSTOM BUILD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WARNING(S)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WITH FLAGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(BASED ON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOOLS ARE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AT ROOT."
    CaseSensitive: false
  - Pos: any
    AsciiString: "ERROR(S)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NOLOGO"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".BSC"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".DSP"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".LIB"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PCH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LINK"
    CaseSensitive: false
