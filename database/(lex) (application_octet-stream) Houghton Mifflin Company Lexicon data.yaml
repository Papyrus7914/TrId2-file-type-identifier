Name: Houghton Mifflin Company Lexicon data
Description: Used for spell-checking, grammar correction, or hyphenation in 1990s software.
FileNameExtensions: ["lex"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "COPYRIGHT (c) Houghton Mifflin Company"
    CaseSensitive: true
