    AsciiString: "$IAEA_INDEX:"
    CaseSensitive: true
  - Pos: any
    AsciiString: "THIS IS IAEA HEADER AS DEFINED IN THE TECHNICAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$STATISTICAL_INFORMATION_PARTICLES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$STATISTICAL_INFORMATION_GEOMETRY"
    CaseSensitive: false
  - Pos: any
