Name: XML Grammar
FileNameExtensions: ["grxml"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "WWW.W3.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GRAMMAR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RULE ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EN-US"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ITEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LANG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
