Name: Microsoft HTML Help Project (w/o index)
Description: Variant without index.
URL: "http://www.help-info.de/en/Help_Info_HTMLHelp/hh.htm"
FileNameExtensions: ["hhp"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "[OPTIONS]"
    CaseSensitive: true
  - Pos: any
    AsciiString: "COMPILED FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".CHM"
    CaseSensitive: false
