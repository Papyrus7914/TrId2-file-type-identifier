Name: FlightGear Runway Use
URL: "https://wiki.flightgear.org/AI_Traffic"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "SCHEDULE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TIME START"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIND TAIL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LANDING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TAKEOFF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RWYUSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CROSS"
    CaseSensitive: false
