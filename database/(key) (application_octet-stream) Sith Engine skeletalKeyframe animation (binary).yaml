Name: Sith Engine skeletal/Keyframe animation (binary)
URL: "https://starwars.fandom.com/wiki/Sith_Engine"
FileNameExtensions: ["key"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FYEK"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".KEY"
    CaseSensitive: false
