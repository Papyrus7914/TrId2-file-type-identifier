Name: EGrid32 form snippet
Description: SNL files are used with the EGrid32 Form Designer. EGrid32 is a powerfull grid control by Elias Montoya.
URL: "http://sweetheartgames.com/"
FileNameExtensions: ["snl"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "EG32F_SN"
    CaseSensitive: true
  - Pos: any
    AsciiString: "EG32F_SN"
    CaseSensitive: false
