Name: Novastorm Dot Path / coordinates track
URL: "https://www.mobygames.com/game/271/novastorm/"
FileNameExtensions: ["dot"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "DHED"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "EOFL"
    CaseSensitive: false
