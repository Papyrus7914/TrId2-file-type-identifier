Name: Vuforia QCAR Info
URL: "https://en.wikipedia.org/wiki/Vuforia_Augmented_Reality_SDK"
FileNameExtensions: ["info"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<QCARInfo>\n    <TargetSet version=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "UNPADDEDIMAGE SIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TARGETSET VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMAGETARGET NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOOLVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "QCARINFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TARGETID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
