Name: Pegasus SPS encoded audio
URL: "http://www.rjamorim.com/rrw/pegasussps.html"
FileNameExtensions: ["sdb"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "\b\0"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 10
    AsciiString: "\0"
    CaseSensitive: true
