Name: LightWave 3D exported object
URL: "https://en.wikipedia.org/wiki/LightWave_3D"
FileNameExtensions: ["obj"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "#"
    CaseSensitive: true
  - Pos: any
    AsciiString: "OBJ FILE GENERATED BY LIGHTWAVE3D"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LIGHTWAVE3D OBJ EXPORT V"
    CaseSensitive: false
