Name: Visual Studio Extension
URL: "http://en.wikipedia.org/wiki/Microsoft_Visual_Studio"
FileNameExtensions: ["vsix"]
MimeType: application/vsix
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "EXTENSION.VSIXMANIFEST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENT_TYPES"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".XML"
    CaseSensitive: false
