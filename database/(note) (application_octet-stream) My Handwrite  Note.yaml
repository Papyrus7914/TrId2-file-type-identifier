    AsciiString: "\xAC\xED\0\x05sr\0\x1Fmy.handrite.newnote.block.Block"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MY.HANDRITE.NEWNOTE.BLOCK.BLOCK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JAVA.UTIL.ARRAYLISTX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MCHILDRENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MCONTENTT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MTYPEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIZEXP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IDAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IHDR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SBIT"
    CaseSensitive: false
