Name: Casio Loopy ROM (little-endian)
URL: "https://en.wikipedia.org/wiki/Casio_Loopy"
FileNameExtensions: ["bin"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x00, 0x0E, 0x80, 0x00]
  - Pos: 5
    Bytes: [0x0E, 0xFE, 0xFF]
  - Pos: 12
    Bytes: [0xFF, 0xFF, 0xFF, 0xFF, 0x00, 0x02, 0x00, 0x00, 0x00, 0x02, 0xFF]
  - Pos: any
    AsciiString: "C\0G\0K\0P\0U\0Z"
    CaseSensitive: false
