Name: BioForge Skeleton
URL: "https://en.wikipedia.org/wiki/BioForge"
FileNameExtensions: ["skl"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "SKELVERS\0\0\0\x02\x02\0LIMB"
    CaseSensitive: true
  - Pos: 30
    AsciiString: "ROOT\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SKELVERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LIMB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOCK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROOT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SENS"
    CaseSensitive: false
