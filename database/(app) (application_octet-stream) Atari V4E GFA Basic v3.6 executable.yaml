Name: Atari V4E GFA Basic v3.6 executable
URL: "https://en.wikipedia.org/wiki/GFA_BASIC"
FileNameExtensions: ["app"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "`\x1A\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CODED BY FRANK OSTROWSKI\0MODIFIED BY LONNY PURSELL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COPYRIGHT 1986-1991\0GFA SYSTEMTECHNIK GMBH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GFA-BASIC LIBRARY 3.6"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUGFA-BASIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NOT FOUND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ERROR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FREE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "QUIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIZE"
    CaseSensitive: false
