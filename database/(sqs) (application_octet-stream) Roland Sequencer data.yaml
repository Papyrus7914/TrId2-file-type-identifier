Name: Roland Sequencer data
URL: "https://www.roland.com/"
FileNameExtensions: ["sqs"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "CSQS\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "INIT GRP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INIT PTN"
    CaseSensitive: false
