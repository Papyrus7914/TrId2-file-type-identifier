Name: Unreal Music
URL: "https://en.wikipedia.org/wiki/Unreal_Engine"
FileNameExtensions: ["umx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #                    *
    Bytes: [0xC1, 0x83, 0x2A, 0x9E]
  - Pos: any
    AsciiString: "PACKAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENGINE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MUSIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CORE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NONE"
    CaseSensitive: false
