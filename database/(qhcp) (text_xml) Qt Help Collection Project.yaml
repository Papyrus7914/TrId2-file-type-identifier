Name: Qt Help Collection Project
URL: "https://doc.qt.io/qt-5/qthelp-index.html"
FileNameExtensions: ["qhcp"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "QHELPCOLLECTIONPROJECT VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCFILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REGISTER"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".QCH"
    CaseSensitive: false
