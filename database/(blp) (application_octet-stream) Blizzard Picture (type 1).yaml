Name: Blizzard Picture (type 1)
Description: 2D picture files used on Blizzard Entertainment Games (mostly used for textures).
URL: "http://fileformats.archiveteam.org/wiki/BLP"
FileNameExtensions: ["blp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "BLP1"
    CaseSensitive: true
