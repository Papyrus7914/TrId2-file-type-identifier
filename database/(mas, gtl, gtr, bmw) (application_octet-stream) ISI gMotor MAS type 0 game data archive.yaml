Name: ISI gMotor MAS type 0 game data archive
Description: Used in games like GT Legends, BMW M3 Challenge, etc.
URL: "https://en.wikipedia.org/wiki/Image_Space_Incorporated"
FileNameExtensions: ["mas", "gtl", "gtr", "bmw"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "GMOTORMAS10\0"
    CaseSensitive: true
