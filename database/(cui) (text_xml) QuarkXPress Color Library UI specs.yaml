Name: QuarkXPress Color Library UI specs
URL: "http://www.selapa.net/swatches/colors/fileformats.php#quark_qcl"
FileNameExtensions: ["cui"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "EDIT_DIALOG_DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR_UI_PREFIX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LIBRARYUISPECS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROWS_PER_PAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
