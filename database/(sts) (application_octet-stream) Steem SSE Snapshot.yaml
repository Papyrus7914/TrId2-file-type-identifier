Name: Steem SSE Snapshot
URL: "https://sourceforge.net/projects/steemsse/"
FileNameExtensions: ["sts"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "B\0\0\0"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "\0\0\0\0\0D\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "STEEMSSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".IMG"
    CaseSensitive: false
