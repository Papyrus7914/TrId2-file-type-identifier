Name: JasperReports Print
URL: "https://www.jaspersoft.com/"
FileNameExtensions: ["jrprint"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xAC\xED\0\x05sr\0'net.sf.jasperreports.engine.JasperPrint"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NET.SF.JASPERREPORTS.ENGINE.JASPERPRINT$DEFAULTSTYLEPROVIDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NET.SF.JASPERREPORTS.ENGINE.BASE.JRBASEPRINTPAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ORIENTATIONI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRINTELEMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ELEMENTSQ\0~"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EELEMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JRSTYLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FONTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LANG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIZE"
    CaseSensitive: false
