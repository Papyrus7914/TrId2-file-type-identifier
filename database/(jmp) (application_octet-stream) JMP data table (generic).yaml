Name: JMP data table (generic)
URL: "http://fileformats.archiveteam.org/wiki/JMP"
FileNameExtensions: ["jmp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xFF, 0xFF, 0x00, 0x00]
  - Pos: 20
    AsciiString: "\0\0\0\0\0\0\0\0\x06\0\x06\0\0\0utf-8\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
