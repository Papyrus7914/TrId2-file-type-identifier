Name: Sonic Arranger module (alt)
URL: "http://www.exotica.org.uk/wiki/Sonic_Arranger"
FileNameExtensions: ["sa"]
MimeType: audio/x-mod
DetectionPatterns:
  - Pos: 0
    AsciiString: "N\xFA\0"
    CaseSensitive: true
  - Pos: 4
    #        N
    Bytes: [0x4E, 0xFA]
  - Pos: 8
    #        N
    Bytes: [0x4E, 0xFA]
  - Pos: 12
    #        N
    Bytes: [0x4E, 0xFA]
  - Pos: 16
    #        N
    Bytes: [0x4E, 0xFA]
  - Pos: 20
    #        N
    Bytes: [0x4E, 0xFA]
  - Pos: 24
    #        N
    Bytes: [0x4E, 0xFA]
  - Pos: any
    AsciiString: "MUSICIRQ\0CIAB.RESOURCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "X\0Q\0K\0E\0_\0Z\0U\0P\0K\0G\0C"
    CaseSensitive: false
