Name: Cubic IDE References preset
URL: "https://en.wikipedia.org/wiki/Cubic_IDE"
FileNameExtensions: ["references"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "OOP\0X\xFA"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".REFERENCES"
    CaseSensitive: false
