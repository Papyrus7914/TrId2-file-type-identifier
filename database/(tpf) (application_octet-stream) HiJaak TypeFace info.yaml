Name: HiJaak TypeFace info
URL: "https://en.wikipedia.org/wiki/HiJaak"
FileNameExtensions: ["tpf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        i
    Bytes: [0x69, 0x10]
  - Pos: 10
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 13
    Bytes: [0x80]
  - Pos: 15
    AsciiString: "\0"
    CaseSensitive: true
