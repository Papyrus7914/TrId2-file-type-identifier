Name: Sony Ericsson remote control configuration
FileNameExtensions: ["kcf"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SONY_ERICSSON_REMOTE_CONTROL_CONFIGURATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KEYBOARD MODIFIERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USAGEID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ACTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KEYMAP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_DOWN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KEY_"
    CaseSensitive: false
