    CaseSensitive: false
  - Pos: any
    AsciiString: "AMBI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FADE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GLB0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OBSV"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OTRK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SKYC"
    CaseSensitive: false
