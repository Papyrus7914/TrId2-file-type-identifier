Name: Microforum MBMP Multi-Bitmap
Description: Used in some Microforum's games, like Dagger's Rage and Expect No Mercy.
FileNameExtensions: ["mbm", "csf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "RIFF"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "MBMPsize"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MBMPSIZE"
    CaseSensitive: false
