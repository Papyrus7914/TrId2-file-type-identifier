Name: Ichitaro document (v5-6)
URL: "https://en.wikipedia.org/wiki/Ichitaro_(word_processor)"
FileNameExtensions: ["jbw"]
MimeType: application/x-js-taro
DetectionPatterns:
  - Pos: 0
    AsciiString: "DOC\0\0\0\0\0        \0\0\x03\0\x01"
    CaseSensitive: true
  - Pos: 128
    AsciiString: "JXW.JEX"
    CaseSensitive: true
  - Pos: 570
    #                                                        /                 k     S     h
    Bytes: [0xFF, 0xFF, 0xFF, 0xFF, 0x00, 0x00, 0xDF, 0xC5, 0x2F, 0x9C, 0x02, 0x6B, 0x53, 0x68]
  - Pos: any
    AsciiString: "JXW.JEX"
    CaseSensitive: false
