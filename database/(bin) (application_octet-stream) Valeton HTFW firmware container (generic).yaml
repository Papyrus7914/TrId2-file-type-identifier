Name: Valeton HTFW firmware container (generic)
URL: "https://www.valeton.net/firmware"
FileNameExtensions: ["bin"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "HTFW"
    CaseSensitive: true
  - Pos: 11
    AsciiString: "\0GP-"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VALETON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
