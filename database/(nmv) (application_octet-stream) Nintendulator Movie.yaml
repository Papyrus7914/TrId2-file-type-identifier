Name: Nintendulator Movie
URL: "https://www.qmtpro.com/~nes/nintendulator/"
FileNameExtensions: ["nmv"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "NSS\x1A"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "NMOVCPUS"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NMOVCPUS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APUS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAPR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PPUS"
    CaseSensitive: false
