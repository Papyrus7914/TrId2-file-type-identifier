Name: MicroPhone II settings (generic)
Description: Win 3.x communication software by Software Ventures Corp.
FileNameExtensions: ["mdc", "bin", "cd", "md", "mdv"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Microphone Doc"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOCUMENT"
    CaseSensitive: false
