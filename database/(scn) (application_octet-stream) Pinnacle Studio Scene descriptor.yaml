Name: Pinnacle Studio Scene descriptor
URL: "https://www.pinnaclesys.com/"
FileNameExtensions: ["scn"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "c&\x01\0\x04\0"
    CaseSensitive: true
  - Pos: 14
    AsciiString: "SourceTape"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SOURCETAPE"
    CaseSensitive: false
