Name: WINDEV page Template
Description: WINDEV is a RAD tool by PC Soft.
URL: "https://windev.com"
FileNameExtensions: ["wwt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PCS\0\x14\0\0\0"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "\0\x01\0\0\0"
    CaseSensitive: true
  - Pos: 15
    Bytes: [0x1E]
