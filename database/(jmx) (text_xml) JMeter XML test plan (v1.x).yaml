Name: JMeter XML test plan (v1.x)
URL: "https://en.wikipedia.org/wiki/Apache_JMeter"
FileNameExtensions: ["jmx"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<jmeterTestPlan version=\"1."
    CaseSensitive: true
  - Pos: any
    AsciiString: "LOOPCONTROLLER.CONTINUE_FOREVER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TESTPLAN.SERIALIZE_THREADGROUPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TESTPLAN.USER_DEFINED_VARIABLES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TESTPLAN.USER_DEFINE_CLASSPATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THREADGROUP.MAIN_CONTROLLER"
    CaseSensitive: false
