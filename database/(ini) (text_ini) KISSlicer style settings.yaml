Name: KISSlicer style settings
URL: "https://www.kisslicer.com/"
FileNameExtensions: ["ini"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "\r\n["
    CaseSensitive: true
  - Pos: any
    AsciiString: "INFILL_DENSITY_DENOMINATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFILL_EXTRUSION_WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INSET_SURFACE_XY_MM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JOIN_PERIMETER_LOOP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEAM_JITTER_DEGREES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTRUSION_WIDTH_MM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAYER_THICKNESS_MM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "QUALITY_PERCENTAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEAM_ANGLE_DEGREES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFILL_ST_OCT_RND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEAM_DEPTH_SCALER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SKIN_THICKNESS_MM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOOPS_INSIDEOUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEAM_GAP_SCALER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STACKED_LAYERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USE_CORNERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUM_LOOPS"
    CaseSensitive: false
