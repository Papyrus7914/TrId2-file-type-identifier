Name: Xfrog organic 3D model
Description: Xfrog is available as a cross platform plug-in for Maya or Cinema 4D and also as a standalone application.
URL: "http://xfrog.com/"
FileNameExtensions: ["xfr"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "Version "
    CaseSensitive: true
  - Pos: any
    AsciiString: "ATTRACTOR_STRENGTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ATTRACTOR_CENTER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USE_COLOR_SPLINE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ATTRACTOR_MODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHARACTERISTIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRIMITIVE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHILDREN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPECULAR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXTURE_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FRAMES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PHOTO"
    CaseSensitive: false
