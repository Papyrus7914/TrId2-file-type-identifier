Name: PageMaker Device Description File
URL: "https://en.wikipedia.org/wiki/Aldus_PageMaker"
FileNameExtensions: ["ddf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "menulabel="
    CaseSensitive: true
  - Pos: any
    AsciiString: "MANUFACTURER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DRIVERLOAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USESIZES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEVMODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAKEFON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRINTER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEVKEY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USEBCO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USEPFM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HDPI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VDPI"
    CaseSensitive: false
