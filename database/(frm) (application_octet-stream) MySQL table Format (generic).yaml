Name: MySQL table Format (generic)
URL: "https://en.wikipedia.org/wiki/MySQL"
FileNameExtensions: ["frm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xFE, 0x01]
  - Pos: 5
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 39
    AsciiString: "\0"
    CaseSensitive: true
