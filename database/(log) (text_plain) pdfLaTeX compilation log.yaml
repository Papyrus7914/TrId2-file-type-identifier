Name: pdfLaTeX compilation log
URL: "https://en.wikipedia.org/wiki/LaTeX"
FileNameExtensions: ["log"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "This is pdfTeX, Version 3.1415926"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ENTERING EXTENDED MODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HYPHENATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCUMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LATEX2E"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUTPUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STACK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".TEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FONT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USED"
    CaseSensitive: false
