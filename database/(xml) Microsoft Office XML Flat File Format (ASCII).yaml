Name: Microsoft Office XML Flat File Format (ASCII)
URL: "http://en.wikipedia.org/wiki/Microsoft_Office_XML_formats"
FileNameExtensions: ["xml"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "MSO-APPLICATION PROGID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MICROSOFT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCUMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCHEMAS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OFFICE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FONT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
