Name: DAISY book
URL: "http://en.wikipedia.org/wiki/DAISY_Digital_Talking_Book"
FileNameExtensions: ["zip"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "1.SMILPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "2.SMILPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MLPK"
    CaseSensitive: false
