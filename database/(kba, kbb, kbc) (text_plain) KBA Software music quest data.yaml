Name: KBA Software music quest data
FileNameExtensions: ["kba", "kbb", "kbc"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "Don Morris Improved Grid File\r\nDo < NOT > mess with this!!!\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "YES IT IS A LONG FILE IN TEXT FORMAT."
    CaseSensitive: false
  - Pos: any
    AsciiString: "TAMPER WITH IT AND LOSE IT"
    CaseSensitive: false
