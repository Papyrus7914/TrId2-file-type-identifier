Name: CanDo Variables/data container (v1)
Description: Amiga visual programming language.
FileNameExtensions: ["var"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "CDVRANNO\0\0\0\x0ECanDoVar Ver1\0VARS"
    CaseSensitive: true
