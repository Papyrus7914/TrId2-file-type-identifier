Name: Soulcalibur III game data archive
URL: "https://en.wikipedia.org/wiki/Soulcalibur_III"
FileNameExtensions: ["olk"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 4
    AsciiString: "olnk"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "\0\0\0\0"
    CaseSensitive: true
  - Pos: 28
    AsciiString: "\0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "OLNK"
    CaseSensitive: false
