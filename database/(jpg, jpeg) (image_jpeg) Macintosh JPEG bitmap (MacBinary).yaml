Name: Macintosh JPEG bitmap (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer
URL: "http://www.macdisk.com/macsigen.php3"
FileNameExtensions: ["jpg", "jpeg"]
MimeType: image/jpeg
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "JPEG"
    CaseSensitive: true
  - Pos: 74
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 82
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "JPEG"
    CaseSensitive: false
