Name: Winamp 3 Playlist
URL: "http://en.wikipedia.org/wiki/Winamp"
FileNameExtensions: ["b4s"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding='UTF-8' standalone=\"yes\"?>\r\n <WinampXML>\r\n<!-- Generated by: Nullsoft Winamp3 version "
    CaseSensitive: true
  - Pos: any
    AsciiString: "NULLSOFT WINAMP3 VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLAYLIST NUM_ENTRIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENTRY PLAYSTRING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATED BY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STANDALONE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WINAMPXML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LENGTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LABEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
