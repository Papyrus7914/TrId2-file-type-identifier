Name: Okino plugin Run Time Information
URL: "http://www.okino.com/"
FileNameExtensions: ["rti"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "#\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SHOW_FILE_SELECTOR_BEFORE_IMPORTING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ADHEARS_TO_PLUGIN_VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLUGIN_DESCRIPTIVE_NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HAS_OPTIONS_DIALOG_BOX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILEOPEN_FILTER_SPEC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HAS_ABOUT_DIALOG_BOX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REQUIRED_ADDONS_DESC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MENU_DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ASSOCIATED_DLL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEMO_MODE_DESC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLUGIN_TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GUID"
    CaseSensitive: false
