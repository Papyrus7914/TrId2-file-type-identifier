Name: PCjs Project XML machine configuration
URL: "https://github.com/jeffpar/pcjs"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "COMPUTER ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BACKGROUND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MACHINE ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME POS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BORDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CENTER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CPU ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RAM ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ADDR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
