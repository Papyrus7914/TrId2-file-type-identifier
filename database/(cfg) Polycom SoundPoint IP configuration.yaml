Name: Polycom SoundPoint IP configuration
URL: "http://en.wikipedia.org/wiki/Polycom"
FileNameExtensions: ["cfg"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n<!-- Generated "
    CaseSensitive: true
  - Pos: any
    AsciiString: ".CFG CONFIGURATION FILE --"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NONAMESPACESCHEMALOCATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POLYCOMCONFIG XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLSCHEMA-INSTANCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POLYCOMCONFIG.XSD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-- GENERATED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STANDALONE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.W3.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "2001"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
