Name: Facer watch Face
Description: Facer is an app to create and manage watch faces for Android Wear devices.
URL: "https://play.google.com/store/apps/details?id=com.jeremysteckling.facerrel"
FileNameExtensions: ["face"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "DESCRIPTION.JSONPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WATCHFACE.JSONPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PREVIEW.PNGPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMAGES"
    CaseSensitive: false
