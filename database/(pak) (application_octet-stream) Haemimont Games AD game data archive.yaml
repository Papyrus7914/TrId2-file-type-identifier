Name: Haemimont Games AD game data archive
Description: Used for example in Rising Kingdoms, Moving Puzzle serie.
URL: "https://www.mobygames.com/game/rising-kingdoms"
FileNameExtensions: ["pak"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "HMMSYS PackFile\n"
    CaseSensitive: true
