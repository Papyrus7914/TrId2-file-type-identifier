Name: Labeler (v2.0) / Labels Unlimited (v1.0) Job
Description: Labels maker program for Windows 3.x by Softkey.
FileNameExtensions: ["job"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Labeler V2.0 JOB\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".STY"
    CaseSensitive: false
