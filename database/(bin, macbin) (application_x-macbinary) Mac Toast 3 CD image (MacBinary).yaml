Name: Mac Toast 3 CD image (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/Roxio_Toast"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "HImg"
    CaseSensitive: true
  - Pos: any
    AsciiString: "HIMG"
    CaseSensitive: false
