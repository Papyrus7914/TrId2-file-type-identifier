Name: Clarion Topspeed Data file
URL: "http://www.softvelocity.com/"
FileNameExtensions: ["tps"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0\0\0\0\x02\0"
    CaseSensitive: true
  - Pos: 13
    AsciiString: "\0tOpS\0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TOPS"
    CaseSensitive: false
