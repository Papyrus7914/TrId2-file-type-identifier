Name: Q+E Query (generic)
Description: Database utility by Pioneer Software.
FileNameExtensions: ["qef"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "Q+E "
    CaseSensitive: true
  - Pos: 5
    AsciiString: "."
    CaseSensitive: true
  - Pos: any
    AsciiString: "SELECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FROM"
    CaseSensitive: false
