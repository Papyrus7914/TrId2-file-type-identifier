Name: SU2 mesh
URL: "https://en.wikipedia.org/wiki/SU2_code"
FileNameExtensions: ["su2"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "NDIME= "
    CaseSensitive: true
  - Pos: any
    AsciiString: "MARKER_ELEMS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MARKER_TAG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NELEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NMARK"
    CaseSensitive: false
