Name: MATLAB Simulink model Template
URL: "https://en.wikipedia.org/wiki/MATLAB"
FileNameExtensions: ["sltx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "MWCOREPROPERTIESEXTENSION.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILESYSTEMMANIFEST.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEMPLATEPROPERTIES.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEMPLATEPROPERTIES.XMLM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MWCOREPROPERTIES.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MWCOREPROPERTIES.XMLM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THUMBNAIL.PNGPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENT_TYPES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HDLCODER_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "METADATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".RELSPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".SLXPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FSROOT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_RELS"
    CaseSensitive: false
