    AsciiString: "?"
    CaseSensitive: true
  - Pos: 42
    AsciiString: "CNAM"
    CaseSensitive: true
  - Pos: any
    AsciiString: "STARFIELD.ESM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CNAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EDID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FULL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GRUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEDR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAST"
    CaseSensitive: false
