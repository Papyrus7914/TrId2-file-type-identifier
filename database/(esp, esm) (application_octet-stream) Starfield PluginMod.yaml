Name: Starfield Plugin/Mod
URL: "https://en.wikipedia.org/wiki/Starfield_(video_game)"
FileNameExtensions: ["esp", "esm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "TES4"
    CaseSensitive: true
  - Pos: 24
    AsciiString: "HEDR\f"
    CaseSensitive: true
