Name: Visual Studio Internal Program Data Base
URL: "https://en.wikipedia.org/wiki/Microsoft_Visual_Studio"
FileNameExtensions: ["ipdb"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "H.Q\x7F"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\x04\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "__MSCINITIALIZERDUMMYFUNCSYMBOLUNIQUENAME1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "__ISA_AVAILABLE\0DUMMY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DUMMYSAFEGLOBAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "R\0E\0L\0E\0A\0S\0E"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GLOBAL\0DUMMY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DUMMYGLOBAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".\0O\0B\0J"
    CaseSensitive: false
