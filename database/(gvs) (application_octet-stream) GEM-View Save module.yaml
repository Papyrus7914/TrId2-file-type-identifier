Name: GEM-View Save module
URL: "http://www.fiebelkorn.net/"
FileNameExtensions: ["gvs"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "`\x1A\0\0"
    CaseSensitive: true
  - Pos: 26
    AsciiString: "\0\0N\xF9\0\0\0\x90N\xF9\0\0"
    CaseSensitive: true
  - Pos: 40
    AsciiString: "GVWS\x01\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GEM-VIEW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODULE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BGNA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GVWS"
    CaseSensitive: false
