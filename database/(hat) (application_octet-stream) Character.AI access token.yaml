Name: Character.AI access token
Description: Base64-encoded JSON Web Token, "Huge Amount of Text".
URL: "https://character.ai"
FileNameExtensions: ["hat"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "TNJLRhqszpDzQ/GslFOFL1x1qsBMybwNLf5iHoqo3Y"
    CaseSensitive: true
