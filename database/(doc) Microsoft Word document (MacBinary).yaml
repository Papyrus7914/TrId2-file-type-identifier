Name: Microsoft Word document (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer
URL: "http://www.macdisk.com/macsigen.php3"
FileNameExtensions: ["doc"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 67
    AsciiString: "BNMSWD"
    CaseSensitive: true
  - Pos: 74
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 82
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BNMSWD"
    CaseSensitive: false
