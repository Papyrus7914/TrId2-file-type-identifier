    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 21
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 27
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 29
    AsciiString: "\0\0\0\0\0\0\0\0\x10\0\0"
    CaseSensitive: true
