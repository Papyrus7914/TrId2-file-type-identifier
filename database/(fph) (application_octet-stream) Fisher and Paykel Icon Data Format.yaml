Name: Fisher and Paykel Icon Data Format
URL: "https://sleepyhead.jedimark.net/wiki/Fisher_%26_Paykel_Icon_Data_Format"
FileNameExtensions: ["fph"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "0201\r"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".FPH"
    CaseSensitive: false
