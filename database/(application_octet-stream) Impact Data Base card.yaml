Name: Impact Data Base card
Description: RISC OS database.
URL: "http://sinenomine.co.uk/software/impact/"
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "CARD\f\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "T_PREVIOUS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "T_ENTRY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DELETE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "T_NEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "T_SAVE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN"
    CaseSensitive: false
