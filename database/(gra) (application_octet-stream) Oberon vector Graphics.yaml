Name: Oberon vector Graphics
URL: "https://en.wikipedia.org/wiki/Oberon_(operating_system)"
FileNameExtensions: ["gra"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "oB"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".SCN.FNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".GRAPH"
    CaseSensitive: false
