Name: Quartus Memory Initialization File
URL: "https://www.intel.com/content/www/us/en/programmable/quartushelp/17.0/reference/glossary/def_mif.htm"
FileNameExtensions: ["mif"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 3
    AsciiString: "TH"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ADDRESS_RADIX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA_RADIX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BEGIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEPTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIDTH"
    CaseSensitive: false
