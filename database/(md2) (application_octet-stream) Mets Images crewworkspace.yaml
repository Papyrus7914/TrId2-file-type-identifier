Name: Mets Images crew/workspace
Description: Old japanese graphic tool.
FileNameExtensions: ["md2"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MET'S G.CCREW FILE V."
    CaseSensitive: true
  - Pos: any
    AsciiString: "WINSPOOL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLAYER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CPAGE"
    CaseSensitive: false
