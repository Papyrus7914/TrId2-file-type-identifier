Name: Win32 Executable (generic)
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 25
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 27
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 62
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PE\0\0L"
    CaseSensitive: false
