Name: Compiled terminfo entry
URL: "https://en.wikipedia.org/wiki/Terminfo"
MimeType: application/x-terminfo
DetectionPatterns:
  - Pos: 0
    Bytes: [0x1A, 0x01]
  - Pos: 3
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "\0"
    CaseSensitive: true
