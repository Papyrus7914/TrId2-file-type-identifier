Name: Visual Studio wizard
URL: "http://en.wikipedia.org/wiki/Microsoft_Visual_Studio"
FileNameExtensions: ["vsz"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "VSWIZARD 7.0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VSWIZARD.VSWIZARDENGINE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VSWIZARD 7.0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIZARD_NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_PATH"
    CaseSensitive: false
