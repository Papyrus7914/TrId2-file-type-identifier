Name: Rockwell Arena Picture Library
URL: "http://www.rockwellautomation.com/"
FileNameExtensions: ["plb"]
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1, 0x00]
  - Pos: 1024
    AsciiString: "R\0o\0o\0t\0 \0E\0n\0t\0r\0y"
    CaseSensitive: true
  - Pos: 1536
    AsciiString: "R\0o\0o\0t\0 \0E\0n\0t\0r\0y"
    CaseSensitive: true
  - Pos: 1664
    AsciiString: "C\0o\0n\0t\0e\0n\0t\0s"
    CaseSensitive: true
  - Pos: any
    AsciiString: "COPYRIGHT (C) ROCKWELL SOFTWARE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "R\0O\0O\0T\0 \0E\0N\0T\0R\0Y"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCUMENT VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREFERENCEPOINT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATION DATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "C\0O\0N\0T\0E\0N\0T\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRODUCT VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCUMENT TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COBJCONTEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYSTEM TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CSWITCHREF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OBJECT."
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PLB"
    CaseSensitive: false
