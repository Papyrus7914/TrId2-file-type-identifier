Name: a-Pac lossless compressed audio
URL: "http://www.rjamorim.com/rrw/apac.html"
FileNameExtensions: ["apc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "APAC"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "PROFNAD "
    CaseSensitive: true
  - Pos: 20
    AsciiString: "RIFF"
    CaseSensitive: true
  - Pos: 28
    AsciiString: "WAVEfmt "
    CaseSensitive: true
  - Pos: any
    AsciiString: "PFMT"
    CaseSensitive: false
