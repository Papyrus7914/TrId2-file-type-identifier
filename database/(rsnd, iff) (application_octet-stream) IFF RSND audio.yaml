Name: IFF RSND audio
Description: Amiga audio format.
URL: "http://de4.aminet.net/util/dtype/RSND-DT.readme"
FileNameExtensions: ["rsnd", "iff"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "RSND"
    CaseSensitive: true
  - Pos: any
    AsciiString: "RSND"
    CaseSensitive: false
