Name: STNG 'A Final Unity' Sprites
URL: "https://www.mobygames.com/game/957/star-trek-the-next-generation-a-final-unity/"
FileNameExtensions: ["spr", "spt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "TRPS"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "\0\0\x01\0\0TSIL"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TSIL"
    CaseSensitive: false
