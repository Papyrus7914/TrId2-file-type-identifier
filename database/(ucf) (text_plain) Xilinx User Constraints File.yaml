Name: Xilinx User Constraints File
URL: "https://www.xilinx.com/itp/xilinx10/help/platform_studio/ps_d_ucf.htm"
FileNameExtensions: ["ucf"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "#"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PERIOD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NET"
    CaseSensitive: false
