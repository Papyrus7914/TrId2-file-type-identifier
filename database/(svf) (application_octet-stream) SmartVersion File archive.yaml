Name: SmartVersion File archive
Description: A tool for storing multiple files versions.
URL: "http://www.smartversion.com/"
FileNameExtensions: ["svf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "DFS File\r\nhttp://www.difstream.com\r\n"
    CaseSensitive: true
  - Pos: 64
    AsciiString: "GVDF"
    CaseSensitive: true
