Name: Apple IIgs Sampled Instrument File
URL: "http://www.1000bit.it/support/manuali/apple/technotes/ftyp/ftn.d8.0002.html"
FileNameExtensions: ["asif"]
MimeType: application/octet-stream
DetectionPatterns:
