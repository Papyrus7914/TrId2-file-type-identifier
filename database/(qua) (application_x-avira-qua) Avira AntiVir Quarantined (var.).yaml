Name: Avira AntiVir Quarantined (var.)
URL: "https://support.avira.com/hc/en-us/articles/360003070838-Restore-or-delete-quarantined-files"
FileNameExtensions: ["qua"]
MimeType: application/x-avira-qua
DetectionPatterns:
  - Pos: 0
    AsciiString: "{\"engine\":\""
    CaseSensitive: true
  - Pos: 12
    AsciiString: "."
    CaseSensitive: true
  - Pos: any
    AsciiString: "GROUPID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MALWARE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WINDOWS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENGINE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHA256"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
