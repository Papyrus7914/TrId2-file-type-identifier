    AsciiString: "DIMENSION DIM 3"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMAT GENERAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMAT ISERROR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THE STRUCTURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THE FORMATS"
    CaseSensitive: false
  - Pos: any
