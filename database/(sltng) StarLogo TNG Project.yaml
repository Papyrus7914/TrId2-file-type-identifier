Name: StarLogo TNG Project
URL: "http://en.wikipedia.org/wiki/StarLogo"
FileNameExtensions: ["sltng"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "StarLogoTNG \""
    CaseSensitive: true
  - Pos: any
    AsciiString: "SLCODEBLOCKS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGES"
    CaseSensitive: false
