Name: OpenRocket project (zipped)
URL: "https://openrocket.info/"
FileNameExtensions: ["ork"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "rocket.ork"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ROCKET.ORK"
    CaseSensitive: false
