Name: C64 Studio theme
URL: "https://www.georg-rottensteiner.de/c64/C64Studio/manual/main.html"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "HIGHLIGHTED_SEARCH_RESULTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CURRENT_DEBUG_LINE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "C64STUDIOSETTINGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ERROR_UNDERLINE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LITERAL_NUMBER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LITERAL_STRING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR ELEMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EDITORCOLORS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EMPTY_SPACE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PSEUDO_OP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPERATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BGCOLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FGCOLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LABEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NONE"
    CaseSensitive: false
