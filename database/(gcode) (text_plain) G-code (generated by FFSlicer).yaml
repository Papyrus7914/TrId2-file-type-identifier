    CaseSensitive: true
  - Pos: any
    AsciiString: "RIGHT_EXTRUDER_TEMPERATURE_RAFT0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RIGHT_EXTRUDER_TEMPERATURE_RESET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LEFT_EXTRUDER_TEMPERATURE_RAFT0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LEFT_EXTRUDER_TEMPERATURE_RESET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLATFORM_TEMPERATURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BOTTOM_SOLID_LAYERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BASE_PRINT_SPEED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PERIMETER_SHELLS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOP_SOLID_LAYERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILL_DENSITY"
    CaseSensitive: false
