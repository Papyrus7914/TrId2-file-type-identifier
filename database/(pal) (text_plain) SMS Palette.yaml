Name: SMS Palette
Description: Surface-water Modeling System.
URL: "https://www.xmswiki.com/wiki/SMS:SMS"
FileNameExtensions: ["pal"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "PALETTE"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PALETTE1"
    CaseSensitive: false
