Name: PowerISO Direct-Access-Archive image
Description: DAA (Direct-Access-Archive) is an advanced format for image file, which supports some advanced features, such as compression, password protection, and splitting to multiple volumes.
URL: "http://file-extension.net/info/daa-poweriso-direct-access-archive-image-file.html"
FileNameExtensions: ["daa"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "DAA\0\0\0\0\0"
    CaseSensitive: true
