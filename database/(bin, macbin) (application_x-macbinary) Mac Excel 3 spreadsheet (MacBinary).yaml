Name: Mac Excel 3 spreadsheet (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/Microsoft_Excel"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "XLS3"
    CaseSensitive: true
  - Pos: any
    AsciiString: "XLS3"
    CaseSensitive: false
