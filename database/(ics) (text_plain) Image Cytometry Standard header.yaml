Name: Image Cytometry Standard header
URL: "http://fileformats.archiveteam.org/wiki/Image_Cytometry_Standard"
FileNameExtensions: ["ics"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "\t"
    CaseSensitive: true
  - Pos: any
    AsciiString: "REPRESENTATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNCOMPRESSED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPRESSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ICS_VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BYTE_ORDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARAMETERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNSIGNED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INTEGER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAYOUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCALE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIZES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNITS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BITS"
    CaseSensitive: false
