Name: MindView Windows Document
URL: "https://en.wikipedia.org/wiki/MindView"
FileNameExtensions: ["mvdx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "MINDMAP.STYLESUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMON.STYLESUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MINDVIEWDATAUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PREVIEW.PNGUT"
    CaseSensitive: false
