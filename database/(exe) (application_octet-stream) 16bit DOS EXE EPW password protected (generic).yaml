Name: 16bit DOS EXE EPW password protected (generic)
Description: Password encryption utility for executable files by Alan D. Jones.
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0\0\x05\0"
    CaseSensitive: true
  - Pos: 16
    Bytes: [0x02, 0x01]
  - Pos: 20
    #        f
    Bytes: [0x66, 0x01]
  - Pos: 24
    AsciiString: "\x1E\0\0\0\x01\0\0\0"
    CaseSensitive: true
  - Pos: 36
    AsciiString: "Decryptor -Copyright (C) 198"
    CaseSensitive: true
  - Pos: 65
    AsciiString: ", Alan D. JonesMZ"
    CaseSensitive: true
  - Pos: any
    AsciiString: "$PASSWORD IS NOT CORRECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENTER PASSWORD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VURQSP."
    CaseSensitive: false
