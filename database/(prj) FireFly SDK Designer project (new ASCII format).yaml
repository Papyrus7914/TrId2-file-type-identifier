Name: FireFly SDK Designer project (new ASCII format)
URL: "http://www.planetsquires.com/firefly.htm"
FileNameExtensions: ["prj"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "#FireFly_Project#  Version="
    CaseSensitive: true
  - Pos: 28
    AsciiString: "."
    CaseSensitive: true
  - Pos: 31
    AsciiString: "\r\n"
    CaseSensitive: true
