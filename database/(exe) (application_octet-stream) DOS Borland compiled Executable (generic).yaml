Name: DOS Borland compiled Executable (generic)
URL: "https://en.wikipedia.org/wiki/Borland"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: any
    AsciiString: "COPYRIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BORLAND"
    CaseSensitive: false
