Name: CRI FMS text strings data
URL: "https://en.wikipedia.org/wiki/CRI_Middleware"
FileNameExtensions: ["fms"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FMSB"
    CaseSensitive: true
  - Pos: 8
    AsciiString: " "
    CaseSensitive: true
  - Pos: any
    AsciiString: "FEOC"
    CaseSensitive: false
