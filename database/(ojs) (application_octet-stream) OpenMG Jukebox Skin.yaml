Name: OpenMG Jukebox Skin
URL: "https://en.wikipedia.org/wiki/OpenMG"
FileNameExtensions: ["ojs"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "VOLDOWN.BMPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLOSE.BMPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VOLUP.BMPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MENU.BMPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NEXT.BMPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SKIN.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STOP.BMPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CH.BMPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SLIDE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FULL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLAY"
    CaseSensitive: false
