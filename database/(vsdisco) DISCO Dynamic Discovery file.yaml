Name: DISCO Dynamic Discovery file
URL: "http://en.wikipedia.org/wiki/Web_Services_Discovery"
FileNameExtensions: ["vsdisco"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" "
    CaseSensitive: true
  - Pos: any
    AsciiString: "SCHEMAS-DYNAMICDISCOVERY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DYNAMICDISCOVERY XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISCO.2000-03-17"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXCLUDE PATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_VTI_SCRIPT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_VTI_CNF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_VTI_PVT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_VTI_LOG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_VTI_TXT"
    CaseSensitive: false
