Name: TSPLIB Traveling Salesman Problem data
URL: "http://comopt.ifi.uni-heidelberg.de/software/TSPLIB95/tsp95.pdf"
FileNameExtensions: ["tsp"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "NAME"
    CaseSensitive: true
  - Pos: any
    AsciiString: "EDGE_WEIGHT_TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIMENSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_SECTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EOF"
    CaseSensitive: false
