Name: AntiMicro Profile
URL: "https://github.com/AntiMicro"
FileNameExtensions: ["amgp"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CONFIGVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUTTON INDEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SET INDEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KEYBOARD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SDLNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SLOTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SETS"
    CaseSensitive: false
