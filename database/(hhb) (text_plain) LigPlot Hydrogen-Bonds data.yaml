Name: LigPlot Hydrogen-Bonds data
URL: "https://www.ebi.ac.uk/thornton-srv/software/LIGPLOT/manual/manappb.html"
FileNameExtensions: ["hhb"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "ligplot.hhb"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ACCEPTOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISTANCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DONOR"
    CaseSensitive: false
