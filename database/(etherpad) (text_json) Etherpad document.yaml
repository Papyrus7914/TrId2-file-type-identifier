    AsciiString: "{\"pad:"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SAVEDREVISIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PUBLICSTATUS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUMTOATTRIB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHANGESET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TIMESTAMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHATHEAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ATTRIBS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NEXTNUM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTHOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ATEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "META"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NULL"
    CaseSensitive: false
