Name: Fractal Design Painter Session
URL: "https://winworldpc.com/product/fractal-design-painter"
FileNameExtensions: ["ssk"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0\x01\0\0"
    CaseSensitive: true
  - Pos: 80
    AsciiString: "\0\0FSSEFS"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PAINTER BRUSHES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXTURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FSSEFS"
    CaseSensitive: false
