Name: Nyx Image Bank bitmap
URL: "https://xenobiotical.itch.io/cprsoft-nyx-emulator"
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "NBIM"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NBFL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NBPL"
    CaseSensitive: false
