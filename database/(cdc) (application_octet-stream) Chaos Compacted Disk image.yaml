Name: Chaos Compacted Disk image
Description: Atari ST disk image compressor by Miles Vignol.
URL: "http://www.atari-wiki.com/index.php/CDC"
FileNameExtensions: ["cdc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Chaos Compacted Disk\n\r"
    CaseSensitive: true
