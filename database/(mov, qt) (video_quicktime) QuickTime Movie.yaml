Name: QuickTime Movie
URL: "https://en.wikipedia.org/wiki/QuickTime"
FileNameExtensions: ["mov", "qt"]
MimeType: video/quicktime
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 4
    AsciiString: "moov"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MDAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MDHD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MOOV"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAPP"
    CaseSensitive: false
