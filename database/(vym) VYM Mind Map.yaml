Name: VYM Mind Map
URL: "http://www.insilmaril.de/vym/"
FileNameExtensions: ["vym"]
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: ".XMLUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMAGES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FLAGS"
    CaseSensitive: false
