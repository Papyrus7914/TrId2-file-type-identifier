Name: EGrid32 Form properties template
Description: EGP files are created by the EGrid32 Form Designer. EGrid32 is a powerfull grid control by Elias Montoya.
URL: "http://sweetheartgames.com/"
FileNameExtensions: ["egp"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "EGPROP"
    CaseSensitive: true
