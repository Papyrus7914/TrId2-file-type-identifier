Name: Microsoft PhotoDraw drawing
Description: The MIX file format is the Microsoft PhotoDraw master file format. By default, PhotoDraw saves the pictures in this format.
URL: "http://fileformats.archiveteam.org/wiki/MIX_(PhotoDraw)"
FileNameExtensions: ["mix"]
MimeType: image/vnd.mix
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1]
  - Pos: any
    AsciiString: "S\0U\0M\0M\0A\0R\0Y\0I\0N\0F\0O\0R\0M\0A\0T\0I\0O\0N"
    CaseSensitive: false
  - Pos: any
    AsciiString: "D\0A\0T\0A\0 \0O\0B\0J\0E\0C\0T\0 \00\00\00\00"
    CaseSensitive: false
  - Pos: any
    AsciiString: "G\0L\0O\0B\0A\0L\0 \0I\0N\0F\0O"
    CaseSensitive: false
  - Pos: any
    AsciiString: "R\0O\0O\0T\0 \0E\0N\0T\0R\0Y"
    CaseSensitive: false
  - Pos: any
    AsciiString: "C\0O\0M\0P\0O\0B\0J"
    CaseSensitive: false
  - Pos: any
    AsciiString: "0\00\00\00\01"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OAVT"
    CaseSensitive: false
