Name: PowerPoint Microsoft Office Open XML Format document (with Macro)
URL: "http://www.microsoft.com/office/preview/fileguide.mspx"
FileNameExtensions: ["pptm"]
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "PRESENTATION.XML.RELSPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SLIDELAYOUT1.XML.RELSPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SLIDEMASTER1.XML.RELSPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRESENTATION.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SLIDELAYOUT1.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SLIDEMASTER1.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SLIDE1.XML.RELSPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TABLESTYLES.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRESPROPS.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIEWPROPS.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VBAPROJECT.BIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENT_TYPES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SLIDE1.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SLIDELAYOUTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SLIDEMASTERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THEME1.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CORE.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCPROPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APP.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SLIDES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_RELS"
    CaseSensitive: false
