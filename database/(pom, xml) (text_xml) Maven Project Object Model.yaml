Name: Maven Project Object Model
URL: "http://en.wikipedia.org/wiki/Maven"
FileNameExtensions: ["pom", "xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MODELVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ARTIFACTID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GROUPID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAVEN"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ORG."
    CaseSensitive: false
