Name: HTC phone SMS/MMS backup (encrypted with default password)
Description: Created with HTC Sync Manager.
FileNameExtensions: ["hbk"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #                                t           \n                            8           /     q                       h     T     {                 9     a     (     T     C                 0
    Bytes: [0xBF, 0xED, 0xF4, 0xF8, 0x74, 0xDB, 0x0A, 0x8D, 0x8F, 0xA4, 0xA5, 0x38, 0xE7, 0x2F, 0x71, 0x14, 0xB7, 0x89, 0x68, 0x54, 0x7B, 0xA9, 0xE7, 0x39, 0x61, 0x28, 0x54, 0x43, 0xA1, 0xD2, 0x30, 0x96]
