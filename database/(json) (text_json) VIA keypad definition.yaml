Name: VIA keypad definition
URL: "https://www.caniusevia.com/"
FileNameExtensions: ["json"]
MimeType: text/json
DetectionPatterns:
  - Pos: 0
    AsciiString: "{"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PRODUCTID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LIGHTING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VENDORID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAYOUTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KEYMAP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MATRIX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROWS"
    CaseSensitive: false
