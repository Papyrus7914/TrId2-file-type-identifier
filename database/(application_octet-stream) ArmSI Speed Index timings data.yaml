Name: ArmSI Speed Index timings data
Description: Benchmark for Acorn RISC machines by J.Abbott and Nick Smith.
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "ArmSX\x01\0\0\0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "."
    CaseSensitive: true
  - Pos: 14
    AsciiString: " SO CSIR "
    CaseSensitive: true
