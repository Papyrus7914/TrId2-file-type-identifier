Name: Sirius MVI video container
URL: "https://wiki.multimedia.cx/index.php/MVI_Container"
FileNameExtensions: ["mvi"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\a"
    CaseSensitive: true
  - Pos: 15
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 27
    AsciiString: "\0\0\0"
    CaseSensitive: true
