Name: Amiga IFF datatype info
URL: "http://wiki.amigaos.net/wiki/DTYP_IFF_DataType_Identification"
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "DTYP"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DTHD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
