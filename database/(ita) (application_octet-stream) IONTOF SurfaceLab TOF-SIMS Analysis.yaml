Name: IONTOF SurfaceLab TOF-SIMS Analysis
URL: "https://www.iontof.com"
FileNameExtensions: ["ita"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "ITStrF01"
    CaseSensitive: true
  - Pos: 33
    AsciiString: "root"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MASSINTERVALLIST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PEAKLIST"
    CaseSensitive: false
