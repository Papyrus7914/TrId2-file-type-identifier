Name: CorelCAD Material
URL: "https://en.wikipedia.org/wiki/Alludo"
FileNameExtensions: ["mat"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "NEW MATERIAL#\r\nname,"
    CaseSensitive: true
  - Pos: any
    AsciiString: "END MATERIAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONDUCTOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
