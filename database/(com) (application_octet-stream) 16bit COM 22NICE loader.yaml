Name: 16bit COM 22NICE loader
Description: Z-80/8080 CP/M emulator for MS-DOS PCs by Sydex.
FileNameExtensions: ["com"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xE9\xBE\0Copyright 1990 by Sydex.\r\n\aInsufficient memory\r\n$\r\n\aUnknown terminal type\r\n$\r\n\aUnknown key map type\r\n$\r\n\aNo file found\r\n$\r\n\aUnable to load 22NICE resident\r\n$"
    CaseSensitive: true
