Name: Apache Tapestry Markup Language document
URL: "https://en.wikipedia.org/wiki/Apache_Tapestry"
FileNameExtensions: ["tml"]
MimeType: text/html
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TAPESTRY.APACHE.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TAPESTRY_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCHEMA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".XSD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
