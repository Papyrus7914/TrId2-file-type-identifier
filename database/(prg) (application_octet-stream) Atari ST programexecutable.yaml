Name: Atari ST program/executable
URL: "https://en.wikipedia.org/wiki/Atari_ST"
FileNameExtensions: ["prg"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "`\x1A\0"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 10
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 14
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 22
    AsciiString: "\0\0"
    CaseSensitive: true
