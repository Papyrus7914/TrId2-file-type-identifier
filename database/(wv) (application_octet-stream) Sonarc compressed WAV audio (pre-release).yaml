Name: Sonarc compressed WAV audio (pre-release)
URL: "https://www.rarewares.org/rrw/sonarc.php"
FileNameExtensions: ["wv"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "RIFF"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "CWAVfmt "
    CaseSensitive: true
  - Pos: 36
    AsciiString: "data"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CWAVFMT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
