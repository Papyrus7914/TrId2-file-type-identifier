Name: Snapcraft build info
Description: "File name: snapcraft.yaml"
URL: "https://snapcraft.io/docs/snapcraft-schema"
FileNameExtensions: ["yaml"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "name: "
    CaseSensitive: true
  - Pos: any
    AsciiString: "CONFINEMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMAND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLUGIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOURCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUILD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SNAP"
    CaseSensitive: false
