    CaseSensitive: false
  - Pos: any
    AsciiString: "NOISEOFFSET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OCTAVES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIZE"
    CaseSensitive: false
