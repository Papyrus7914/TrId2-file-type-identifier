Name: Pixilang compiled byte-code
Description: Pixilang is a pixel-oriented programming language for small graphics/sound applications and experiments.
URL: "http://www.warmplace.ru/soft/pixilang/"
FileNameExtensions: ["pixicode"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PIXICODE"
    CaseSensitive: true
