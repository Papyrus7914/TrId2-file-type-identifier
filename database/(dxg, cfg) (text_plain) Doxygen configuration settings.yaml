Name: Doxygen configuration settings
URL: "http://en.wikipedia.org/wiki/Doxygen"
FileNameExtensions: ["dxg", "cfg"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "# Doxyfile "
    CaseSensitive: true
  - Pos: 12
    AsciiString: "."
    CaseSensitive: true
  - Pos: any
    AsciiString: "GENERATE_DEPRECATEDLIST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATE_AUTOGEN_DEF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATE_HTMLHELP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATE_TESTLIST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATE_TODOLIST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATE_TREEVIEW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATE_BUGLIST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATE_PERLMOD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATE_TAGFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUTPUT_DIRECTORY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATE_LEGEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATE_LATEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE_PATTERNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATE_CHI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATE_MAN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATE_RTF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATE_XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RECURSIVE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_FILTER"
    CaseSensitive: false
