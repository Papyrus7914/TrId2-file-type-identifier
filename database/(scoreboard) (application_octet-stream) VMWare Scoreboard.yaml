Name: VMWare Scoreboard
Description: VM performance info - usually in VMWare VMs folders.
URL: "https://en.wikipedia.org/wiki/VMware"
FileNameExtensions: ["scoreboard"]
MimeType: application/octet-stream
DetectionPatterns:
