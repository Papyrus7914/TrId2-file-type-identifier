    AsciiString: "_vmxStats/v"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VMX.CONFIGWRITEMINMAXTIME\0US\0MINMAX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VMX.DISKLIBDIGESTFILEDATAGROWTIME"
