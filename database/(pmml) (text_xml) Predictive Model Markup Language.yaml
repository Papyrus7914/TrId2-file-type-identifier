Name: Predictive Model Markup Language
URL: "https://en.wikipedia.org/wiki/Predictive_Model_Markup_Language"
FileNameExtensions: ["pmml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "DATADICTIONARY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.DMG.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATAFIELD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATATYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FUNCTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEADER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PMML-"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
