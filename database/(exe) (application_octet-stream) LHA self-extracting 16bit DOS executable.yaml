Name: LHA self-extracting 16bit DOS executable
URL: "https://en.wikipedia.org/wiki/LHA_(file_format)"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 4
    AsciiString: "\x04\0\0\0\x02\0\0"
    CaseSensitive: true
  - Pos: 14
    AsciiString: "\xF0\xFF\0\x01\0\0\0\x01\xF0\xFF\x1C\0\0\0\0\0\0\0\xEB"
    CaseSensitive: true
  - Pos: 34
    AsciiString: " \0"
    CaseSensitive: true
