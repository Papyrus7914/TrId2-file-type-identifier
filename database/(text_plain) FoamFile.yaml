Name: FoamFile
URL: "https://en.wikipedia.org/wiki/OpenFOAM"
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "FoamFile"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PRESSURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OBJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ASCII"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUE"
    CaseSensitive: false
