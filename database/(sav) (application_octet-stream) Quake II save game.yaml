Name: Quake II save game
URL: "https://en.wikipedia.org/wiki/Quake_II"
FileNameExtensions: ["sav"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "|\x03\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "INFO_PLAYER_INTERMISSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TARGET_CHANGELEVEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFO_PLAYER_START"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLAYER_TRAIL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FUNC_BUTTON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WORLDSPAWN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FUNC_DOOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TARGET_S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NOCLASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODELS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ITEM_"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".MD2"
    CaseSensitive: false
