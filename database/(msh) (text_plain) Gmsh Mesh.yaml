Name: Gmsh Mesh
URL: "http://www.geuz.org/gmsh/"
FileNameExtensions: ["msh"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "$MeshFormat"
    CaseSensitive: true
  - Pos: any
    AsciiString: "$ENDELEMENTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$MESHFORMAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$ELEMENTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$ENDNODES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$NODES"
    CaseSensitive: false
