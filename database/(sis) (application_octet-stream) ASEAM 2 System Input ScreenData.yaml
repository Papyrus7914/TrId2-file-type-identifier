Name: ASEAM 2 System Input Screen/Data
Description: A Simplified Energy Analysis Method, for DOS.
FileNameExtensions: ["sis"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "AS2 SYSTEM INPUT SCREEN"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".SIS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HLP$"
    CaseSensitive: false
