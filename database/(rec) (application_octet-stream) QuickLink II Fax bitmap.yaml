Name: QuickLink II Fax bitmap
URL: "http://fileformats.archiveteam.org/wiki/QuickLink_II"
FileNameExtensions: ["rec"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "II*\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "QLIIFAX\0"
    CaseSensitive: true
  - Pos: 20
    AsciiString: ":"
    CaseSensitive: true
  - Pos: 23
    AsciiString: ":"
    CaseSensitive: true
  - Pos: 26
    AsciiString: " "
    CaseSensitive: true
  - Pos: 29
    AsciiString: ":"
    CaseSensitive: true
  - Pos: 32
    AsciiString: ":"
    CaseSensitive: true
  - Pos: 35
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "QLIIFAX"
    CaseSensitive: false
