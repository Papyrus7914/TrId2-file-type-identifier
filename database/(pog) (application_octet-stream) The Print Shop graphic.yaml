Name: The Print Shop graphic
URL: "http://fileformats.archiveteam.org/wiki/The_Print_Shop"
FileNameExtensions: ["pog"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0\0\x01\0\0\0\0"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "UUUUU"
    CaseSensitive: false
