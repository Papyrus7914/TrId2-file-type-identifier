Name: Scalable Vector Graphics (var.3)
Description: SVG is a language for describing two-dimensional graphics and graphical applications in XML.
URL: "https://en.wikipedia.org/wiki/Scalable_Vector_Graphics"
FileNameExtensions: ["svg"]
MimeType: image/svg+xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml "
    CaseSensitive: true
  - Pos: any
    AsciiString: "WWW.W3.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SVG"
    CaseSensitive: false
