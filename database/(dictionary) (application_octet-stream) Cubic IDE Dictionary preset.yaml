Name: Cubic IDE Dictionary preset
URL: "https://en.wikipedia.org/wiki/Cubic_IDE"
FileNameExtensions: ["dictionary"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "OOP\0Z\xEE"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".DICTIONARY"
    CaseSensitive: false
