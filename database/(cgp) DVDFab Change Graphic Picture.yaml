Name: DVDFab Change Graphic Picture
Description: A file that contains the graphic shown to indicate to change disk.
URL: "http://www.dvdfab.com/"
FileNameExtensions: ["cgp"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "DVDFab3 CGP"
    CaseSensitive: true
  - Pos: 40
    AsciiString: "DVDFab"
    CaseSensitive: true
