Name: Photodex ProShow Workspace
URL: "http://www.photodex.com/"
FileNameExtensions: ["ppr"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "Photodex(R) ProShow(TM) Workspace File Version="
    CaseSensitive: true
  - Pos: any
    AsciiString: "PHOTODEX(R) PROSHOW(TM) WORKSPACE FILE VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHOWS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MENU"
    CaseSensitive: false
