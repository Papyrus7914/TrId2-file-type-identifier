Name: Valve Studiomdl Data (with rem)
URL: "http://developer.valvesoftware.com/wiki/Studiomdl"
FileNameExtensions: ["smd"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "//"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VERSION 1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SKELETON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NODES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TIME"
    CaseSensitive: false
