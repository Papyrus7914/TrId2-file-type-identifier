Name: OS X Flat Package Packageinfo
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "OVERWRITE-PERMISSIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUNDLE-VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMAT-VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POSTINSTALL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IDENTIFIER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INSTALL-"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PKG-INFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOCAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROOT"
    CaseSensitive: false
