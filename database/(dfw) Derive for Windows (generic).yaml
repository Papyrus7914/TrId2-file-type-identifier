Name: Derive for Windows (generic)
URL: "http://www.chartwellyorke.com/dfwind.html"
FileNameExtensions: ["dfw"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "D"
    CaseSensitive: true
  - Pos: 6
    AsciiString: " "
    CaseSensitive: true
  - Pos: 40
    AsciiString: " "
    CaseSensitive: true
  - Pos: any
    AsciiString: "DEFLANG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DERIVE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAVED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
