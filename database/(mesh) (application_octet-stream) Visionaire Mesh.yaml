Name: Visionaire Mesh
Description: Old Amiga morphing software.
URL: "ftp://ftp.uni-potsdam.de/pub/systems/amiga/aminet/biz/demo/VisionaireDemo.readme"
FileNameExtensions: ["mesh"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "MORFFORM"
    CaseSensitive: true
  - Pos: 20
    AsciiString: "MESHHEAD"
    CaseSensitive: true
