Name: GML Feature Class List
URL: "https://en.wikipedia.org/wiki/Geography_Markup_Language"
FileNameExtensions: ["gfs"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<GMLFeatureClassList>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PROPERTYDEFN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ELEMENTPATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
