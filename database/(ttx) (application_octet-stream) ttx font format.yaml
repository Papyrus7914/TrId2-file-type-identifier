Name: ttx font format
URL: "https://linux.die.net/man/1/ttx"
FileNameExtensions: ["ttx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TTFONT SFNTVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TTLIBVERSION"
    CaseSensitive: false
