Name: Imhotep Container
URL: "http://wiki.xentax.com/index.php/Eldos_Solid_File_System_ST_XFS"
FileNameExtensions: ["imexp", "imhwd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\f\0NW \0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "I\0M\0H\0O\0T\0E\0P\0 \0C\0O\0N\0T\0A\0I\0N\0E\0R\0 \0F\0I\0L\0E"
    CaseSensitive: false
