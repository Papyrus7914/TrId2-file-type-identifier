Name: Fractal Image Format bitmap (template-dependent)
Description: Need a corresponding .FTT file to be decoded.
URL: "http://fileformats.archiveteam.org/wiki/FIF_(Fractal_Image_Format)"
FileNameExtensions: ["fif"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FTC\0"
    CaseSensitive: true
