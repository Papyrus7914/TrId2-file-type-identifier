Name: Double Commander history
URL: "https://doublecmd.sourceforge.io/"
FileNameExtensions: ["xml"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SEARCHEXCLUDEDIRECTORIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEARCHEXCLUDEFILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEARCHDIRECTORIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REPLACETEXTPATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEARCHTEXTPATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMANDLINE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAVIGATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOUBLECMD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILEMASK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HISTORY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ITEM"
    CaseSensitive: false
