Name: MultiMedia Movie format video
FileNameExtensions: ["mmm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "RIFF"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "RMMP"
    CaseSensitive: true
  - Pos: any
    AsciiString: "RMMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MCNM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VWCF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VWCR"
    CaseSensitive: false
