Name: VideoMaxe VCR
Description: Amiga video DB by Stephan Surken.
FileNameExtensions: ["vcr"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "VideoMaxe_V"
    CaseSensitive: true
  - Pos: 14
    AsciiString: "_Videorekorder-Datei_\xA9StS_"
    CaseSensitive: true
