Name: Akai AKP format
URL: "https://en.wikipedia.org/wiki/Akai"
FileNameExtensions: ["akp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "RIFF"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "APRGprg "
    CaseSensitive: true
  - Pos: 26
    AsciiString: "out "
    CaseSensitive: true
  - Pos: 42
    AsciiString: "tune"
    CaseSensitive: true
  - Pos: 72
    AsciiString: "lfo "
    CaseSensitive: true
  - Pos: 112
    AsciiString: "mods"
    CaseSensitive: true
