Name: NO$X51 Configuration (v1.x, Win)
URL: "https://problemkaputt.de/x51.htm"
FileNameExtensions: ["ini"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: ";no$x51 1."
    CaseSensitive: true
  - Pos: 11
    AsciiString: " generated config file - do not edit\r\n"
    CaseSensitive: true
