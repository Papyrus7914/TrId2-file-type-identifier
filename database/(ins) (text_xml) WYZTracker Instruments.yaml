Name: WYZTracker Instruments
URL: "https://github.com/AugustoRuiz/WYZTracker"
FileNameExtensions: ["ins"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\"?>\n<ArrayOfInstrument xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\">\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ARRAYOFINSTRUMENT XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLSCHEMA-INSTANCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PITCHMODIFIERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.W3.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOOPSTART"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VOLUMES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOOPED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "2001"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
