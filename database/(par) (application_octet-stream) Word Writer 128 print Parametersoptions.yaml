Name: Word Writer 128 print Parameters/options
Description: Settings file associated with a document (same name with PAR extension).
URL: "https://en.wikipedia.org/wiki/Word_Writer_128"
FileNameExtensions: ["par"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x05\n\x14\x1E(2<F"
    CaseSensitive: true
  - Pos: any
    AsciiString: "0 OPEN                     $"
    CaseSensitive: false
