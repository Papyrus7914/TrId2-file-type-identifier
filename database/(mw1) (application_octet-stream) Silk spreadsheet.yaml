Name: Silk spreadsheet
Description: Old spreadsheet program by Daybreak Technologies, Inc.
FileNameExtensions: ["mw1"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x01, 0x01, 0x03, 0x01, 0xFF, 0xFF, 0x00, 0x00]
  - Pos: 250
    AsciiString: "DOLLARS\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOLLARS"
    CaseSensitive: false
