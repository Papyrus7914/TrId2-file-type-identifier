Name: Manga Studio Page
URL: "https://en.wikipedia.org/wiki/Clip_Studio_Paint"
FileNameExtensions: ["cpg"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "GPSC"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".CTB"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".CRU"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAYER"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".CRA"
    CaseSensitive: false
