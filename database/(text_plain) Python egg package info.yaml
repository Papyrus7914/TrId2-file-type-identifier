Name: Python egg package info
Description: "Filename: PKG-INFO"
URL: "https://en.wikipedia.org/wiki/Python_(programming_language)"
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "Metadata-Version: "
    CaseSensitive: true
  - Pos: 19
    AsciiString: "."
    CaseSensitive: true
  - Pos: any
    AsciiString: "METADATA-VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTHOR-EMAIL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HOME-PAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLATFORM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LICENSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SUMMARY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
