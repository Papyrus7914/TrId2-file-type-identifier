Name: B4J source code
URL: "https://www.b4x.com/"
FileNameExtensions: ["b4j"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xEF, 0xBB, 0xBF]
  - Pos: 10
    AsciiString: "="
    CaseSensitive: true
  - Pos: any
    AsciiString: "SUB PROCESS_GLOBALS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ARGS() AS STRING)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUMBEROFLIBRARIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENDOFDESIGNTEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUMBEROFMODULES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SUB APPSTART ("
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUMBEROFFILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LIBRARY1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "END SUB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUILD1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JCORE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JAVA"
    CaseSensitive: false
