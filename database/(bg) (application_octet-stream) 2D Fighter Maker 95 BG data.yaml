Name: 2D Fighter Maker 95 BG data
URL: "https://archive.org/details/2d-fighter-maker-95"
FileNameExtensions: ["bg"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "2DKGT95"
    CaseSensitive: true
  - Pos: 28
    #              u           a           f
    Bytes: [0x81, 0x75, 0x82, 0x61, 0x82, 0x66, 0x96]
  - Pos: any
    AsciiString: ".MID"
    CaseSensitive: false
