Name: AM-Notebook backup
URL: "https://www.aignes.com/notebook.htm"
FileNameExtensions: ["zip"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "amnotebook_"
    CaseSensitive: true
  - Pos: any
    AsciiString: "AMNOTEBOOK_CONFIG.DAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AMNOTEBOOK_NOTES.DAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTACTS.XML_BAK2"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLANNER.XML_BAK2"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_FOLDER.CFG_BAK2"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPREADSHEET.TBL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ALARM.XML_BAK2"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NOTEBOOK2.INI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TODO.XML_BAK2"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NOTEBOOK.INI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODULES.DGR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UGO.TBL_BAK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTOBACKUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HELLO.RVF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TABS.GRP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GROUPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLIPS"
    CaseSensitive: false
