    CaseSensitive: true
  - Pos: 16
    AsciiString: "IECSdaeH"
    CaseSensitive: true
  - Pos: any
    AsciiString: "IECSDAEH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IECSGORP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IECSIGAV"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IECSLPMS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IECSTESS"
    CaseSensitive: false
