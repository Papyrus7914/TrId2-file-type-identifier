Name: PlayStation 2 BD/HD Audio
URL: "https://wiki.xentax.com/index.php/PlayStation_2_BD_HD_Audio"
FileNameExtensions: ["bd", "hd"]
MimeType: application/octet-stream
DetectionPatterns:
