Name: Traktor Settings
URL: "https://en.wikipedia.org/wiki/Traktor"
FileNameExtensions: ["tsi"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "TRAKTORSETTINGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTROLLER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENTRY NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STANDALONE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEVICE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NIXML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".CON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
