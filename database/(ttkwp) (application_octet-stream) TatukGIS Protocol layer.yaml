Name: TatukGIS Protocol layer
URL: "https://www.tatukgis.com/"
FileNameExtensions: ["ttkwp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "[TatukGIS Layer]"
    CaseSensitive: true
  - Pos: any
    AsciiString: "COPYRIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WEBTILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CAPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STORAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "URL1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "URL2"
    CaseSensitive: false
  - Pos: any
    AsciiString: "URL3"
    CaseSensitive: false
