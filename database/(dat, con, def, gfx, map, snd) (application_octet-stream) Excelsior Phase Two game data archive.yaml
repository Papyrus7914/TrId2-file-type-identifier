Name: Excelsior Phase Two game data archive
Description: The same format was used also for the Win ver. of EP1.
URL: "http://excelsior-rpg.com/"
FileNameExtensions: ["dat", "con", "def", "gfx", "map", "snd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Ex2 Lib v1.0   \0"
    CaseSensitive: true
