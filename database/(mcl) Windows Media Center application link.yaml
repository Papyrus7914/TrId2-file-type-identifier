Name: Windows Media Center application link
URL: "http://msdn2.microsoft.com/en-us/library/ms818124.aspx"
FileNameExtensions: ["mcl"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<application"
    CaseSensitive: true
  - Pos: any
    AsciiString: "APPLICATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
