Name: Singularity Image Format (generic)
FileNameExtensions: ["sif"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "#!/usr/bin/env run-singularity\n\0SIF_MAGIC\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ENV RUN-SINGULARITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIF_MAGIC"
    CaseSensitive: false
