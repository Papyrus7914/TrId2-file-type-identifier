Name: Atom Service info
URL: "https://en.wikipedia.org/wiki/Atom_(Web_standard)"
FileNameExtensions: ["atomsvc"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xEF\xBB\xBF<?xml version=\"1.0\" "
    CaseSensitive: true
  - Pos: any
    AsciiString: "COLLECTION HREF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SERVICE XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STANDALONE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.W3.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WORKSPACE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ATOM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
