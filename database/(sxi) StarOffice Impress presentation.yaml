    AsciiString: "mimetypeapplication/vnd.sun.xml.impressPK"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VND.SUN.XML.IMPRESSPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MIMETYPEAPPLICATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MANIFEST.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SETTINGS.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENT.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STYLES.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "META.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MIMETYPEPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "META-INF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "URATION"
    CaseSensitive: false
  - Pos: any
