Name: Mac OpenType font (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/OpenType"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "sfnt"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SFNT"
    CaseSensitive: false
