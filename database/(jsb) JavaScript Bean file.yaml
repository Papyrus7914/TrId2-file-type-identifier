Name: JavaScript Bean file
URL: "http://thor.info.uaic.ro/~busaco/teach/docs/component/9_jsbref.htm"
FileNameExtensions: ["jsb"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<JSB>\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "JSB_CONSTRUCTOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JSB_DESCRIPTOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISPLAYNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JSB_P"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THIS"
    CaseSensitive: false
