Name: NSIS compressed archive
URL: "https://it.wikipedia.org/wiki/Nullsoft_Scriptable_Install_System"
FileNameExtensions: ["nsis"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 1
    AsciiString: "\0\0\0\xEF\xBE\xAD\xDENullsoftInst"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NULLSOFTINST"
    CaseSensitive: false
