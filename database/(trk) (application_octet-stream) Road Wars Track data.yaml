Name: Road Wars Track data
Description: Russian game by TS Group Entertainment.
FileNameExtensions: ["trk"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "TSLS"
    CaseSensitive: true
  - Pos: 35
    AsciiString: "3tracked 1.0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "3TRACKED 1.0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "START"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".IMG"
    CaseSensitive: false
