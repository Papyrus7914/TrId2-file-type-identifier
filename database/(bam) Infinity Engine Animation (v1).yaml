Name: Infinity Engine Animation (v1)
Description: "Infinity Engine BAM files describe animated graphics. Such files are used for animations (both creature animations, item and spell animations) and interactive GUI elements (e.g. buttons) and for logical collections of images (e.g. fonts). The format supports multiple animation cycles, each containing multiple frames.  Applies to: BG1, BG1:ToSC, BG2, BG2:ToB, PST, IWD, IWD:HoW, IWD:TotL, IWD2"
URL: "http://iesdp.gibberlings3.net/file_formats/ie_formats/bam_v1.htm"
FileNameExtensions: ["bam"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "BAM V1 "
    CaseSensitive: true
