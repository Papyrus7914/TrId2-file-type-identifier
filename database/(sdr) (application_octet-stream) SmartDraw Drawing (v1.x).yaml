Name: SmartDraw Drawing (v1.x)
Description: Drawin app for Windows 3.x.
FileNameExtensions: ["sdr"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x02\0\xFF\xFF\0\0\0\0"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 17
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 20
    AsciiString: "\0\0\0\0\xFF\xFF"
    CaseSensitive: true
  - Pos: 75
    AsciiString: ":\\"
    CaseSensitive: true
