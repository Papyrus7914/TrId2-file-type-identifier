Name: GEDCOM Family History (UTF-16LE without BOM)
Description: The GEDCOM file format is a standard format for family history files.
URL: "http://fileformats.archiveteam.org/wiki/GEDCOM"
FileNameExtensions: ["ged"]
MimeType: text/vnd.familysearch.gedcom
DetectionPatterns:
  - Pos: 0
    AsciiString: "0\0 \0H\0E\0A\0D\0"
    CaseSensitive: true
