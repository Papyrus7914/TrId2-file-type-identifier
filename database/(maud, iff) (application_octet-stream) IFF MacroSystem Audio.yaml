Name: IFF MacroSystem Audio
Description: Amiga format, 16bit extension of IFF-8SVX.
URL: "http://lclevy.free.fr/amiga/MAUDINFO.TXT"
FileNameExtensions: ["maud", "iff"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "MAUD"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MDAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MHDR"
    CaseSensitive: false
