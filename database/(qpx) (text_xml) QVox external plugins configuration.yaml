Name: QVox external plugins configuration
URL: "http://qvox.sourceforge.net/"
FileNameExtensions: ["qpx"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" ?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PARAMETER NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMAND INPUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INPUT-OUTPUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SUBMENU NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ACTION NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ALGORITHM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPTION ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISTANCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCUMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LABELOFF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INTEGER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LABELON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXTOFF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SELECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXTON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FLOAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ORDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RADIO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$1 -"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PAN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MASK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
