Name: CorelSHOW presentation (v4)
URL: "http://fileformats.archiveteam.org/wiki/SHW_(Corel)"
FileNameExtensions: ["shw"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "RIFF"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "shw4LIST"
    CaseSensitive: true
  - Pos: 20
    AsciiString: "INFO"
    CaseSensitive: true
