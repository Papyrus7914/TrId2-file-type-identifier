Name: OpenTTD Language strings
URL: "https://www.openttd.org/"
FileNameExtensions: ["lng"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "LANG"
    CaseSensitive: true
  - Pos: 74
    AsciiString: "_"
    CaseSensitive: true
  - Pos: any
    AsciiString: "OPENTTD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NEWGRF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ZLIB"
    CaseSensitive: false
