Name: Asura engine Resource data (strings) (v5)
Description: Asura is a 3D Game engine.
URL: "https://en.wikipedia.org/wiki/Rebellion_Developments"
FileNameExtensions: ["asr"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
