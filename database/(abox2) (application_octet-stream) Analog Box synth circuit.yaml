Name: Analog Box synth circuit
Description: AKA ABox or ABox2.
URL: "https://sites.google.com/site/analogbox2"
FileNameExtensions: ["abox2"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "ABox"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0\0"
    CaseSensitive: true
