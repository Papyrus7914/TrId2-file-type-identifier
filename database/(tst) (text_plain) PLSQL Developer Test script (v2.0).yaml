Name: PL/SQL Developer Test script (v2.0)
FileNameExtensions: ["tst"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "PL/SQL Developer Test script 2.0\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "RESULT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BEGIN"
    CaseSensitive: false
