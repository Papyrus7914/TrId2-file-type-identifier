Name: VMware supplemental team member configuration
URL: "http://en.wikipedia.org/wiki/Vmware"
FileNameExtensions: ["vmxf"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\"?>\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CLIENTMETADATAATTRIBUTES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HISTORYEVENTLIST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VMXPATHNAME TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VMID TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FOUNDRY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRING"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".VMX"
    CaseSensitive: false
