Name: reWASD config (XML)
URL: "https://www.rewasd.com/"
FileNameExtensions: ["rewasd"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"utf-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MOUSE_SENSITIVITY VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROCESS_NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HORIZONTAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STICK NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BTNRIGHTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APP_NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KEY NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POINT ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERTICAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BTNLEFT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAPPING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTHOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUTTON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONFIG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CURVES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REWASD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRAVEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".EXE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIK_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PADD"
    CaseSensitive: false
