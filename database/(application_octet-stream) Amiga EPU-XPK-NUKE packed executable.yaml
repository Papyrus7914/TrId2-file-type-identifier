Name: Amiga EPU-XPK-NUKE packed executable
Description: https://www.dstoecker.eu/xpklibs.html#NUKE
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #                    c     h           a
    Bytes: [0x01, 0x80, 0x63, 0x68, 0x05, 0x61]
  - Pos: 16
    AsciiString: "xpkNUKE\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "XPKNUKE"
    CaseSensitive: false
