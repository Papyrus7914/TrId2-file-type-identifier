Name: Receiver Independent Exchange Format
Description: RINEX is a data interchange format for raw satellite navigation system data.
URL: "https://en.wikipedia.org/wiki/RINEX"
FileNameExtensions: ["rxo"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "     "
    CaseSensitive: true
  - Pos: 60
    AsciiString: "RINEX VERSION / TYPE\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "END OF HEADER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RINEX VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RUN BY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
