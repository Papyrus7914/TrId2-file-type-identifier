Name: RSLogix Ladder Logic program
URL: "https://www.rockwellautomation.com/en-us/products/software.html"
FileNameExtensions: ["rsl"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "FILE,LAD 2"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SYMBOLS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "0 END"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAD 2"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SBR 3"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SBR 4"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SBR 5"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SBR 6"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SBR 7"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SBR 8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SBR 9"
    CaseSensitive: false
  - Pos: any
    AsciiString: "0 XI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BTBL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FTBL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NTBL"
    CaseSensitive: false
