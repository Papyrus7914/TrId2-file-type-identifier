Name: 16bit DOS EXE X-pack compressed
URL: "http://fileformats.archiveteam.org/wiki/X-pack_for_Executable"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "@\0"
    CaseSensitive: true
  - Pos: 20
    AsciiString: "\0\0\0\0\x01\0jmXE32"
    CaseSensitive: true
  - Pos: any
    AsciiString: "JMXE32"
    CaseSensitive: false
