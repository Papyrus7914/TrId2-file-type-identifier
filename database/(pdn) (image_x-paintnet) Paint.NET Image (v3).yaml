Name: Paint.NET Image (v3)
Description: Paint.NET is an image and photo manipulation tool designed for computers running Windows XP. Paint.NET is jointly developed at Washington State University with additional help from Microsoft, and is meant to be a free replacement for the MS Paint software that comes with all Windows operating systems.
URL: "http://www.eecs.wsu.edu/paint.net/index.html"
FileNameExtensions: ["pdn"]
MimeType: image/x-paintnet
DetectionPatterns:
  - Pos: 0
    AsciiString: "PDN3"
    CaseSensitive: true
