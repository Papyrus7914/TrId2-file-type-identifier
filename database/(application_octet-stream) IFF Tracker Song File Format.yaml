Name: IFF Tracker Song File Format
Description: A proposed Amiga tracker format.
URL: "http://wiki.amigaos.net/wiki/TRKR_IFF_Tracker_Music_Module"
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "TRKR"
    CaseSensitive: true
