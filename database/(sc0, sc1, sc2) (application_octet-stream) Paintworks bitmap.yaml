Name: Paintworks bitmap
URL: "http://fileformats.archiveteam.org/wiki/Paintworks"
FileNameExtensions: ["sc0", "sc1", "sc2"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 42
    AsciiString: "  ."
    CaseSensitive: true
  - Pos: 48
    AsciiString: "\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 54
    AsciiString: "ANvisionA"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ANVISIONA"
    CaseSensitive: false
