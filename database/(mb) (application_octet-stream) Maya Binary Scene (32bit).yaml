Name: Maya Binary Scene (32bit)
URL: "http://fileformats.archiveteam.org/wiki/Maya_scene"
FileNameExtensions: ["mb"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FOR4"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "M"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "FOR4\0\0"
    CaseSensitive: true
  - Pos: 20
    AsciiString: "HEADVERS"
    CaseSensitive: true
