Name: EasyCut project (generic, old)
URL: "https://www.easycut.de"
FileNameExtensions: ["cut"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "EasyCut V"
    CaseSensitive: true
  - Pos: 10
    AsciiString: "."
    CaseSensitive: true
  - Pos: 12
    AsciiString: " Copyright,R. Naujoks,Berlin,Germany 1991"
    CaseSensitive: true
