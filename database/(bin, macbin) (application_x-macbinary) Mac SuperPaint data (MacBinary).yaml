Name: Mac SuperPaint data (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/SuperPaint_(Macintosh)"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "SPn3"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SPN3"
    CaseSensitive: false
