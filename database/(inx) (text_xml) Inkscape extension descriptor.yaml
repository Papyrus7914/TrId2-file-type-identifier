Name: Inkscape extension descriptor
URL: "https://en.wikipedia.org/wiki/Inkscape"
FileNameExtensions: ["inx"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "INKSCAPE-EXTENSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMAND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCRIPT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
