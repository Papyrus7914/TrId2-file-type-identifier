Name: ABB RobotStudio Station
URL: "https://new.abb.com/products/robotics/robotstudio"
FileNameExtensions: ["rsstn"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "PIM.xml"
    CaseSensitive: true
  - Pos: any
    AsciiString: "METADATA.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PREVIEW.PNG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PIM.XML"
    CaseSensitive: false
