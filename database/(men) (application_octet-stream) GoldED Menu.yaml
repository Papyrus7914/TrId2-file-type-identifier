Name: GoldED Menu
Description: Amiga text editor by Dietmar Eilert.
FileNameExtensions: ["men"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MENU1\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GOLDED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MENU"
    CaseSensitive: false
