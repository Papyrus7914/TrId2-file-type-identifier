Name: Shockwave Stream
URL: "https://en.wikipedia.org/wiki/Adobe_Shockwave"
FileNameExtensions: ["stream"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "CTRL"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "SYNC"
    CaseSensitive: true
  - Pos: 24
    AsciiString: "FILM"
    CaseSensitive: true
  - Pos: 40
    AsciiString: "FHDR"
    CaseSensitive: true
  - Pos: 48
    AsciiString: "cvid"
    CaseSensitive: true
  - Pos: 68
    AsciiString: "FILM"
    CaseSensitive: true
  - Pos: 84
    AsciiString: "FRME"
    CaseSensitive: true
