Name: Show Partner mastered show
Description: MS-DOS presentation software by Brightbill-Roberts and Co.
FileNameExtensions: ["pr2"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xF0, 0xF0]
  - Pos: 3
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 13
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".CLEAR"
    CaseSensitive: false
