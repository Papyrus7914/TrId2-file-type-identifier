Name: Animation Magic video/Animation (v1)
URL: "https://wiki.multimedia.cx/index.php/Animation_Magic_ANI"
FileNameExtensions: ["ani"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "ANI "
    CaseSensitive: true
  - Pos: 8
    AsciiString: "hdr \x01\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PAL DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RIFF"
    CaseSensitive: false
