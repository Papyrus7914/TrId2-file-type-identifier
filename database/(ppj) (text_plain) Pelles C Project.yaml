Name: Pelles C Project
URL: "http://www.smorgasbordet.com/pellesc/"
FileNameExtensions: ["ppj"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "# "
    CaseSensitive: true
  - Pos: any
    AsciiString: "$(LINK) $(LINKFLAGS) -OUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT FILE GENERATED BY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DO NOT EDIT THIS FILE."
    CaseSensitive: false
  - Pos: any
    AsciiString: "POC_PROJECT_ARGUMENTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PELLES C FOR WINDOWS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POC_PROJECT_EXECUTOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POC_PROJECT_WORKPATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POC_PROJECT_VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$(CC) $(CCFLAGS)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POC_PROJECT_TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".EXCLUDEDFILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-SUBSYSTEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-MACHINE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".SILENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ASFLAGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RCFLAGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WARNING"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".OBJ."
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUILD"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".LIB"
    CaseSensitive: false
