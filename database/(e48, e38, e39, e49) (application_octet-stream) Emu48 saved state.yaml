Name: Emu48 saved state
URL: "https://hp.giesselink.com/emu48.htm"
FileNameExtensions: ["e48", "e38", "e39", "e49"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Emu48 Document"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".KML"
    CaseSensitive: false
