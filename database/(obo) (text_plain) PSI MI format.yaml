Name: PSI MI format
URL: "http://fileformats.archiveteam.org/wiki/PSI-MI_XML"
FileNameExtensions: ["obo"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "format-version: "
    CaseSensitive: true
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TERM"
    CaseSensitive: false
