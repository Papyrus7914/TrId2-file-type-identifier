    CaseSensitive: false
  - Pos: any
    AsciiString: "EXAMPLE-CODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LESSON-TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SECTION-CODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LESSON-CODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHAPTERS"
    CaseSensitive: false
