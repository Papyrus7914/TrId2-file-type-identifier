    AsciiString: "EXAMPLE-COMMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LESSON-COMMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHAPTER-TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXAMPLE-TITLE"
    CaseSensitive: false
  - Pos: any
