Name: Qt User Interface
URL: "http://en.wikipedia.org/wiki/Qt_%28toolkit%29"
FileNameExtensions: ["ui"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PROPERTY NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIDGET CLASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UI VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GEOMETRY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
