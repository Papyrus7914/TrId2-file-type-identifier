Name: PixiTracker sounds Pack
URL: "https://www.warmplace.ru/soft/pixitracker/"
FileNameExtensions: ["pixipack"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PIXIMOD1SNDN"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CHAN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FINE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RELN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SND1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SVOL"
    CaseSensitive: false
