Name: The Music Studio Sound (PC)
Description: Music editor by Audio Light.
FileNameExtensions: ["snd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x1A, 0x00, 0x01, 0x00]
  - Pos: 13
    #                    *                             ,
    Bytes: [0x00, 0xF8, 0x2A, 0xFF, 0x03, 0xFF, 0xFF, 0x2C]
