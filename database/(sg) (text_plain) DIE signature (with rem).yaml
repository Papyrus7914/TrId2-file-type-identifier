Name: DIE signature (with rem)
URL: "https://github.com/horsicq/DIE-engine"
FileNameExtensions: ["sg"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "// "
    CaseSensitive: true
  - Pos: any
    AsciiString: "FUNCTION DETECT(BSHOWTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RETURN RESULT(BSHOWTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BSHOWOPTIONS)"
    CaseSensitive: false
