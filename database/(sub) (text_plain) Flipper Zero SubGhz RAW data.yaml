Name: Flipper Zero SubGhz RAW data
URL: "https://en.wikipedia.org/wiki/Flipper_Zero"
FileNameExtensions: ["sub"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "Filetype: Flipper SubGhz RAW File"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FURIHALSUBGHZPRESET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FREQUENCY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROTOCOL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RAW_DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ASYNC"
    CaseSensitive: false
