Name: Tilez texture
URL: "http://fileformats.archiveteam.org/wiki/Tilez_texture"
FileNameExtensions: ["til"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "QDB\0"
    CaseSensitive: true
  - Pos: 8
    #                                            J     F     I     F
    Bytes: [0xFF, 0xD8, 0xFF, 0xE0, 0x00, 0x10, 0x4A, 0x46, 0x49, 0x46]
  - Pos: any
    AsciiString: "_STRINGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JFIF"
    CaseSensitive: false
