    #                          <
    Bytes: [0xEF, 0xBB, 0xBF, 0x3C]
  - Pos: any
    AsciiString: "MICROSOFT.FSHARP.TARGETS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONFIGURATION CONDITION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERTYGROUP CONDITION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TARGETFRAMEWORKVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCHEMAS.MICROSOFT.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT TOOLSVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLATFORM CONDITION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REFERENCE INCLUDE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$(CONFIGURATION)"
