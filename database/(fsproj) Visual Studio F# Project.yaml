    AsciiString: "OUTPUTTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEVELOPER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEBUGTYPE"
    CaseSensitive: false
