Name: IncrediMail Image
Description: application/vnd.ms-cab-compressed
URL: "http://www.incredimail.com"
FileNameExtensions: ["imi"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "MSCF\0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CONTENT.INI"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".GIF"
    CaseSensitive: false
