Name: Denise global settings
URL: "https://sourceforge.net/projects/deniseemu/"
FileNameExtensions: ["ini"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "C64_custom_settings:"
    CaseSensitive: true
  - Pos: any
    AsciiString: "AMIGA_CUSTOM_SETTINGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "C64_CUSTOM_SETTINGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FPS_DECIMAL_POINT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIDEO_SCREEN_TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAUSE_FOCUS_LOSS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAST_USED_EMU"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCREEN_HEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HOTKEY_0_ALT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCREEN_WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FPS_UPDATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HOTKEY_0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCREEN_X"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCREEN_Y"
    CaseSensitive: false
