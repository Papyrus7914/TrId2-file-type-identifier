    CaseSensitive: false
  - Pos: any
    AsciiString: "COPYRIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CUTTER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DELORME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-MAP"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".FTB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOPO"
    CaseSensitive: false
