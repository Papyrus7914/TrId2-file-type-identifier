Name: sfArk compressed SoundFont
Description: sfArk is a lossless compression utility for SoundFont files.
URL: "http://fileformats.archiveteam.org/wiki/SfArk"
FileNameExtensions: ["sfark"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 26
    AsciiString: "sfArk"
    CaseSensitive: true
  - Pos: 32
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SFARK"
    CaseSensitive: false
