Name: RELOAD serialization format
Description: Really Efficient List Of Arbitrary Data, used in OHRRPGCE.
URL: "http://fileformats.archiveteam.org/wiki/RELOAD"
FileNameExtensions: ["reld"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "RELD"
    CaseSensitive: true
