Name: Secret Photos puzzle
URL: "http://fileformats.archiveteam.org/wiki/Secret_Photos_puzzle"
FileNameExtensions: ["xp0"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x01\0\0\000/00/00"
    CaseSensitive: true
  - Pos: 1785
    AsciiString: "JFIF"
    CaseSensitive: true
