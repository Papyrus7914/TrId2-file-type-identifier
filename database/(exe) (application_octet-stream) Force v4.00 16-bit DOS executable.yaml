Name: Force v4.00 16-bit DOS executable
Description: Dev environment by ENforce Developments.
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 12
    Bytes: [0xFF, 0xFF]
  - Pos: 16
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 18
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 21
    AsciiString: "\0\0\0\x1E\0\0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FORCE 4.00  COPYRIGHT (C) 1998 BY ENFORCE DEVELOPMENTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PSQR"
    CaseSensitive: false
