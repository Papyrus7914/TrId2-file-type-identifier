Name: LDraw Model
Description: LDraw is an open standard for LEGO CAD programs that allow the user to create virtual LEGO models and scenes.
URL: "http://www.ldraw.org/"
FileNameExtensions: ["ldr"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "0 "
    CaseSensitive: true
  - Pos: any
    AsciiString: "0 AUTHOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "0 NAME"
    CaseSensitive: false
