Name: Progressive Web Application Manifest
FileNameExtensions: ["webmanifest"]
MimeType: text/json
DetectionPatterns:
  - Pos: 0
    AsciiString: "{"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BACKGROUND_COLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THEME_COLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHORT_NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STANDALONE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISPLAY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ICONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIZES"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PNG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
