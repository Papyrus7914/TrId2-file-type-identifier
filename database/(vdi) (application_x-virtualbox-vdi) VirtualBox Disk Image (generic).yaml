Name: VirtualBox Disk Image (generic)
URL: "https://en.wikipedia.org/wiki/VirtualBox#VirtualBox_Disk_Image"
FileNameExtensions: ["vdi"]
MimeType: application/x-virtualbox-vdi
DetectionPatterns:
  - Pos: 0
    AsciiString: "<<< "
    CaseSensitive: true
  - Pos: any
    AsciiString: "DISK IMAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIRTUAL"
    CaseSensitive: false
