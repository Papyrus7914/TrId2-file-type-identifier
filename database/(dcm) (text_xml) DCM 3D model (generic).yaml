Name: DCM 3D model (generic)
FileNameExtensions: ["dcm"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<HPS version=\""
    CaseSensitive: true
  - Pos: 15
    AsciiString: "."
    CaseSensitive: true
  - Pos: any
    AsciiString: "VERTICES VERTEX_COUNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BASE64_ENCODED_BYTES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FACETS FACET_COUNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PACKED_GEOMETRY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BINARY_DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCHEMA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR"
    CaseSensitive: false
