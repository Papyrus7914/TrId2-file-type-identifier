Name: Ableton Live Configuration
URL: "https://en.wikipedia.org/wiki/Ableton_Live"
FileNameExtensions: ["cfg"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #                    V     x
    Bytes: [0xAB, 0x1E, 0x56, 0x78]
  - Pos: 6
    AsciiString: "\x01\0\0\0\x0FLivePreferences"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LIVEPREFERENCES"
    CaseSensitive: false
