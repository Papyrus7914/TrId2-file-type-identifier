Name: Rosegarden note style
URL: "https://www.rosegardenmusic.com/"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOCTYPE ROSEGARDEN-NOTE-STYLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GLOBAL SHAPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VFIXPOINT"
    CaseSensitive: false
