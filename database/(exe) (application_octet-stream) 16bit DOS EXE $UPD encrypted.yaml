Name: 16bit DOS EXE $UPD encrypted
Description: Night $pirit's polymorphic executable files encryptor.
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0\0\x02\0"
    CaseSensitive: true
  - Pos: 12
    Bytes: [0xFF, 0xFF]
  - Pos: 18
    AsciiString: "N$"
    CaseSensitive: true
  - Pos: 21
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 25
    AsciiString: "\0\0\0"
    CaseSensitive: true
