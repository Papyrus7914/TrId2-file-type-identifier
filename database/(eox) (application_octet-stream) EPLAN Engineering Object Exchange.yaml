Name: EPLAN Engineering Object Exchange
URL: "https://www.eplan.com/"
FileNameExtensions: ["eox"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #              S
    Bytes: [0xFE, 0x53, 0x02, 0x02, 0x04, 0x04, 0x0F, 0xFF, 0x00]
  - Pos: any
    AsciiString: "KJSK"
    CaseSensitive: false
