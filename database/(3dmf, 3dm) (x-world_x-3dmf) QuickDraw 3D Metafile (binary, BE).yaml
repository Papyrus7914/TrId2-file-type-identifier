Name: QuickDraw 3D Metafile (binary, BE)
URL: "http://fileformats.archiveteam.org/wiki/3DMF"
FileNameExtensions: ["3dmf", "3dm"]
MimeType: x-world/x-3dmf
DetectionPatterns:
  - Pos: 0
    AsciiString: "3DMF\0\0\0\x10"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ATTR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CNTR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KDIF"
    CaseSensitive: false
