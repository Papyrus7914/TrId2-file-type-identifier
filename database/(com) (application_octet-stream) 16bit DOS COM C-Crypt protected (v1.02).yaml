Name: 16bit DOS COM C-Crypt protected (v1.02)
Description: DOS Protector by De'FeinD/uCT.
FileNameExtensions: ["com"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xE9]
  - Pos: any
    AsciiString: "PROTECTED WITH C-CRYPT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "9Z9LQO9"
    CaseSensitive: false
  - Pos: any
    AsciiString: "2MSDOS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FXFY3"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FXFYS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_XFQF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "0100"
    CaseSensitive: false
  - Pos: any
    AsciiString: "F50O"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FPF."
    CaseSensitive: false
  - Pos: any
    AsciiString: "N 4D"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_FXF"
    CaseSensitive: false
