    AsciiString: "S\0C\0F\0F\0P\0R\0E\0V\0I\0E\0W"
    CaseSensitive: false
  - Pos: any
    AsciiString: "R\0O\0O\0T\0 \0E\0N\0T\0R\0Y"
    CaseSensitive: false
