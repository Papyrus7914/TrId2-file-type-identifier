Name: Q-emuLator Package
Description: A single .qlpak file contains all the QL files and settings needed to run a QDOS program.
URL: "http://www.terdina.net/ql/q-emulator.html"
FileNameExtensions: ["qlpak"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: ".QCFPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".QCFU"
    CaseSensitive: false
