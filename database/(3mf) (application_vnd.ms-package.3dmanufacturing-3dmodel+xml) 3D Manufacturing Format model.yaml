Name: 3D Manufacturing Format model
URL: "http://fileformats.archiveteam.org/wiki/3MF"
FileNameExtensions: ["3mf"]
MimeType: application/vnd.ms-package.3dmanufacturing-3dmodel+xml
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "3DMODEL.MODEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENT_TYPES"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".RELS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_RELS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".XML"
    CaseSensitive: false
