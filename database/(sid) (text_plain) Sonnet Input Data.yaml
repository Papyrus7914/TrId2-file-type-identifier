    CaseSensitive: false
  - Pos: any
    AsciiString: "PLEASE REFER TO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUTPUT FILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "END PARAMS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIDATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HDATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MDATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OTHER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PORTS"
    CaseSensitive: false
