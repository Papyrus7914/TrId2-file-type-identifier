Name: CompROM compressed ROM image
Description: Tool for compressing old BBC 8 bit computers ROMs by Greg Cook.
URL: "http://regregex.bbcmicro.net/"
FileNameExtensions: ["rom"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "LA\x80LB\x80\x82-\vCompressed ROMFS \0"
    CaseSensitive: true
  - Pos: 28
    AsciiString: "."
    CaseSensitive: true
  - Pos: 32
    AsciiString: "("
    CaseSensitive: true
