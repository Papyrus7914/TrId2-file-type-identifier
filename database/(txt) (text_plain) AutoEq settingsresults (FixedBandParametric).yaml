Name: AutoEq settings/results (FixedBand|Parametric)
URL: "https://github.com/jaakkopasanen/AutoEq"
FileNameExtensions: ["txt"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "Preamp: -"
    CaseSensitive: true
  - Pos: any
    AsciiString: "HZ GAIN -"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILTER 1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILTER 2"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILTER 3"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILTER 4"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILTER 5"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ON PK FC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DB Q"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FC 1"
    CaseSensitive: false
