Name: GNU Info document
FileNameExtensions: ["info"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "This is "
    CaseSensitive: true
  - Pos: any
    AsciiString: ".INFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
