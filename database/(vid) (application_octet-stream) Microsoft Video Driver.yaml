Name: Microsoft Video Driver
Description: Used in old Microsoft applications.
FileNameExtensions: ["vid"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x14\0\x02\0\0\0\0\0\0\0\x14\0"
    CaseSensitive: true
  - Pos: 56
    AsciiString: "\0P\x19"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MONOCHROME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DRV0"
    CaseSensitive: false
