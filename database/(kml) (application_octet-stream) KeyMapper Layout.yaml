Name: KeyMapper Layout
Description: Tool by Data-Cal Corp, part of World Fonts for Windows.
FileNameExtensions: ["kml"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "KM"
    CaseSensitive: true
  - Pos: 3
    AsciiString: "\0b"
    CaseSensitive: true
  - Pos: 428
    AsciiString: "**"
    CaseSensitive: true
  - Pos: 566
    AsciiString: "++"
    CaseSensitive: true
