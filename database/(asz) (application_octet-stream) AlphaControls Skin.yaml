Name: AlphaControls Skin
URL: "https://www.alphaskins.com/"
FileNameExtensions: ["asz"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "ASzf"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "Options.dat"
    CaseSensitive: true
  - Pos: 25
    AsciiString: "\0\0x"
    CaseSensitive: true
  - Pos: any
    AsciiString: "OPTIONS.DAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MASTER"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".BMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ASZF"
    CaseSensitive: false
