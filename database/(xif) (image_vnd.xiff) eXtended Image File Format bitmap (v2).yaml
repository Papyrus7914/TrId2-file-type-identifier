Name: eXtended Image File Format bitmap (v2)
Description: AKA DigiPaper/XIF.
URL: "http://fileformats.archiveteam.org/wiki/XIFF"
FileNameExtensions: ["xif"]
MimeType: image/vnd.xiff
DetectionPatterns:
  - Pos: 0
    AsciiString: "II*\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "XEROX DIFF"
    CaseSensitive: true
  - Pos: any
    AsciiString: "XEROX IMAGE FORMAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XEROX DIFF"
    CaseSensitive: false
