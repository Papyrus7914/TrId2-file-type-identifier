Name: ZModeler profile
URL: "http://en.wikipedia.org/wiki/Zmodeler"
FileNameExtensions: ["xml"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "WWW.ZMODELER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROFILE XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FOLDER NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KEY NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
