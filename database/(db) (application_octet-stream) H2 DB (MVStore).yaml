Name: H2 DB (MVStore)
URL: "https://en.wikipedia.org/wiki/H2_(database)"
FileNameExtensions: ["db"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "H:2,block"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BLOCKSIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FLETCHER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREATED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHUNK"
    CaseSensitive: false
