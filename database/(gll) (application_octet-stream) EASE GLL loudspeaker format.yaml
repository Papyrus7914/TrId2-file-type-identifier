Name: EASE GLL loudspeaker format
URL: "http://ease.afmg.eu/index.php/gll-loudspeaker-format.html"
FileNameExtensions: ["gll"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "EGLL"
    CaseSensitive: true
  - Pos: 10
    AsciiString: "EASE_GLL"
    CaseSensitive: true
