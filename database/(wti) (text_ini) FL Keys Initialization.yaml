Name: FL Keys Initialization
URL: "https://www.image-line.com/fl-studio-learning/fl-studio-online-manual/html/plugins/FL%20Keys.htm"
FileNameExtensions: ["wti"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "[info]\r\nname="
    CaseSensitive: true
  - Pos: any
    AsciiString: "VELOCITYLAYERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ISSTANDARD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAMPLEFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAMPLERATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHORTNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILETYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAMPLE0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAMPLES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTHOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COUNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HIGH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROOT"
    CaseSensitive: false
