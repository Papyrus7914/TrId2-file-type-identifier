Name: Nihilistic Object Template
URL: "https://www.mobygames.com/company/1424/nstigate-games/"
FileNameExtensions: ["not"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "NOT\x10\x01\0\0\0"
    CaseSensitive: true
  - Pos: 10
    AsciiString: "\0\0_"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".NAG"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".NOD"
    CaseSensitive: false
