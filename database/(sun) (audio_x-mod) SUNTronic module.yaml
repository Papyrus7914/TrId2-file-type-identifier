Name: SUNTronic module
URL: "http://www.exotica.org.uk/wiki/SUNTronic"
FileNameExtensions: ["sun"]
MimeType: audio/x-mod
DetectionPatterns:
  - Pos: 0
    #        H                       M
    Bytes: [0x48, 0xE7, 0xFF, 0xFE, 0x4D, 0xFA]
  - Pos: any
    AsciiString: "BFJH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NU N"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUJ("
    CaseSensitive: false
