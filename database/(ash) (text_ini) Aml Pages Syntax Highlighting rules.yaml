Name: Aml Pages Syntax Highlighting rules
Description: Tree-structured notes manager for Windows by Mazov Gosha.
URL: "https://web.archive.org/web/20120126045920/http://amlpages.com/download.shtml"
FileNameExtensions: ["ash"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "[General]"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DATELASTMODIFIED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GROUPSCOUNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WHOLEWORD0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMENTS0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COPYRIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MATCHCASE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ADDRESS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR"
    CaseSensitive: false
