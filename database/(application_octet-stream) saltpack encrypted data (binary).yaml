Name: saltpack encrypted data (binary)
URL: "https://saltpack.org/"
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xC5]
  - Pos: 3
    AsciiString: "\x96\xA8saltpack\x92\x01\0\0\xC4 "
    CaseSensitive: true
  - Pos: any
    AsciiString: "SALTPACK"
    CaseSensitive: false
