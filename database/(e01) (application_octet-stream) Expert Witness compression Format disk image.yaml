Name: Expert Witness compression Format disk image
Description: AKA Expert Witness file format.
URL: "http://www.forensicswiki.org/wiki/ASR_Data%27s_Expert_Witness_Compression_Format"
FileNameExtensions: ["e01"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "EVF\t\r\n\xFF\0"
    CaseSensitive: true
