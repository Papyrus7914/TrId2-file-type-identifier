Name: Lightwork Pattern
URL: "https://hohmbody.com/flickerstrip/lightwork"
FileNameExtensions: ["pattern"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "pixels:"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PALETTE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BITMAP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FRAMES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
