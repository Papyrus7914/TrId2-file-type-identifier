Name: 94B sound bank
Description: Used by the Guillemot MaxiSound serie audio boards.
FileNameExtensions: ["94b"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PRIO\n\0\0\0"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "\x01\0IMAP"
    CaseSensitive: true
  - Pos: any
    AsciiString: "IMAP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RLOC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAMP"
    CaseSensitive: false
