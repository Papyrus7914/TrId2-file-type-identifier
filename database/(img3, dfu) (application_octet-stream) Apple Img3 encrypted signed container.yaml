Name: Apple Img3 encrypted signed container
URL: "https://www.theiphonewiki.com/wiki/IMG3_File_Format"
FileNameExtensions: ["img3", "dfu"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "3gmI"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ATAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EPYT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GABK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPES"
    CaseSensitive: false
