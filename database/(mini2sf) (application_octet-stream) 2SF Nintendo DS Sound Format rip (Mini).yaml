    CaseSensitive: false
  - Pos: any
    AsciiString: "LENGTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FADE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PSF$"
    CaseSensitive: false
  - Pos: any
