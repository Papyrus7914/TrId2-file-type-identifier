    AsciiString: "PIXEL_AREA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIRECTORY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ST_FORMAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TAPE_TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTRAST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NON_DROP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TV_TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORCED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR"
    CaseSensitive: false
