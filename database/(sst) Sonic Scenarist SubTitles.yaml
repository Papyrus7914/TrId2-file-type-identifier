    AsciiString: "2\r\nDisplay_Start"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DISPLAY_START"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISPLAY_AREA"
    CaseSensitive: false
