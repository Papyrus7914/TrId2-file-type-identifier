Name: IFF Packed Bitmap
FileNameExtensions: ["pbm", "bbm", "lbm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "PBM BMHD"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PBM BMHD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BODY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CMAP"
    CaseSensitive: false
