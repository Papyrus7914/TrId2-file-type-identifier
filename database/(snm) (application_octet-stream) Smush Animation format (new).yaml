Name: Smush Animation format (new)
Description: A LucasArts file format.
URL: "http://wiki.multimedia.cx/index.php?title=Smush"
FileNameExtensions: ["snm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SANM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "SHDR"
    CaseSensitive: true
