Name: AlgoBox Algorithm
URL: "http://www.xm1math.net/algobox/"
FileNameExtensions: ["alg"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FONCTION FCTCODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FIN_ALGORITHME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ITEM ALGOITEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REPERE REP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VARIABLES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COURANT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FCTETAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REPCODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REPETAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXTE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
