Name: The Settlers 2 Map
URL: "http://en.wikipedia.org/wiki/The_Settlers_II"
FileNameExtensions: ["s2m"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x12\x18\t\x06rc00"
    CaseSensitive: true
  - Pos: 12
    Bytes: [0xF3, 0xA7, 0xE4, 0xD7]
  - Pos: 19
    #              |                 )           i     T                 Z
    Bytes: [0x00, 0x7C, 0x8D, 0xA8, 0x29, 0x87, 0x69, 0x54, 0xCE, 0xEE, 0x5A, 0xC8, 0xE9]
