Name: Black Diamond Full Motion Video
URL: "https://wiki.multimedia.cx/index.php/Black_Diamond_STR"
FileNameExtensions: ["str"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xF8, 0xF8, 0xF7, 0xF7]
  - Pos: 6
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MRFI"
    CaseSensitive: false
