Name: 3D Data Description object
URL: "http://fileformats.archiveteam.org/wiki/TDDD"
FileNameExtensions: ["tdd", "obj", "iob"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "TDDDOBJ "
    CaseSensitive: true
  - Pos: 20
    AsciiString: "DESC\0"
    CaseSensitive: true
