Name: GNOME Timed Wallpaper
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<background>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TRANSITION TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STARTTIME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DURATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OVERLAY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MINUTE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SECOND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MONTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FROM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HOUR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "YEAR"
    CaseSensitive: false
