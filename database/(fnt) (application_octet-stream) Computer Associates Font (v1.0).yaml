Name: Computer Associates Font (v1.0)
FileNameExtensions: ["fnt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Computer Associates Font File Ver 1.0    "
    CaseSensitive: true
  - Pos: 55
    Bytes: [0x1A]
  - Pos: any
    AsciiString: ".STF"
    CaseSensitive: false
