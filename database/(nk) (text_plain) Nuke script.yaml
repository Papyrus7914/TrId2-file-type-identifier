Name: Nuke script
URL: "https://en.wikipedia.org/wiki/Nuke_(software)"
FileNameExtensions: ["nk"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "#! "
    CaseSensitive: true
  - Pos: any
    AsciiString: "DEFINE_WINDOW_LAYOUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INPUTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROOT {"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUKE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XPOS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "YPOS"
    CaseSensitive: false
