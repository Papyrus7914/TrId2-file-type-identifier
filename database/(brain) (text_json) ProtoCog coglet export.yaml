Name: ProtoCog coglet export
URL: "https://r74n.com/mini/protocog"
FileNameExtensions: ["brain"]
MimeType: text/json
DetectionPatterns:
  - Pos: 0
    AsciiString: "{\"brain\":{\"vocab\":{\"1\":{\"t\":\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "CONNECTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RECEIVED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VOCABID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BRAIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "START"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STATS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SENT"
    CaseSensitive: false
