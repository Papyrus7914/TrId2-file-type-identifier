Name: Wizzardz and War Lordz level game data
URL: "https://archive.org/details/wizzardz_war_lordz"
FileNameExtensions: ["inf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xFD, 0x00]
  - Pos: 3
    AsciiString: "X\xE35\f"
    CaseSensitive: true
  - Pos: 11
    Bytes: [0x01]
