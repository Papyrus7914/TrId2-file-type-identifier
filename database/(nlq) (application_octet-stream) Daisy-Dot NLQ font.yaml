Name: Daisy-Dot NLQ font
URL: "http://fileformats.archiveteam.org/wiki/Atari_graphics_formats"
FileNameExtensions: ["nlq"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "DAISY-DOT NLQ FONT"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DAISY-DOT NLQ FONT"
    CaseSensitive: false
