Name: DIgSILENT PowerFactory project export format (old)
URL: "https://www.digsilent.de/en/powerfactory.html"
FileNameExtensions: ["dz"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #                                            9     <     Z
    Bytes: [0x82, 0x85, 0x82, 0xD5, 0xA9, 0xA3, 0x39, 0x3C, 0x5A, 0xD2, 0x9A]
