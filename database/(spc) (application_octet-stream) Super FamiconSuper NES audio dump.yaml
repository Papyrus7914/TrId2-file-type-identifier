Name: Super Famicon/Super NES audio dump
Description: Contain a snapshot of the system state to play native audio.
URL: "http://fileformats.archiveteam.org/wiki/SPC_(Audio)"
FileNameExtensions: ["spc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SNES-SPC700 Sound File Data v"
    CaseSensitive: true
  - Pos: 30
    AsciiString: "."
    CaseSensitive: true
  - Pos: 33
    Bytes: [0x1A, 0x1A]
