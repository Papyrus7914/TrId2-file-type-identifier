Name: easyHDR 2 Project
URL: "http://www.easyhdr.com/"
FileNameExtensions: ["ehpx"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "EASYHDRPROJECT PROJECTFILEVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TONEMAPPING_SETTINGS PATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NOISEFILTERING ENABLED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GHOSTREMOVAL ENABLED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HDRGENERATION METHOD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SMARTMERGE_STRENGTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRUEHDR_SELECTIVITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OTHER PANORAMA360"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SMARTMERGE_SMOOTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROGRAMVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PHOTOS COUNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PHOTO1 PATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SMOOTHNESS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EVUSER"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".EHSX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODE"
    CaseSensitive: false
