Name: Foltyn Commander Configuration
Description: Polish Norton Commander clone.
FileNameExtensions: ["cfg"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "FCM.CFG\r\nPlik konfiguracyjny programu Foltyn Commander "
    CaseSensitive: true
  - Pos: 56
    AsciiString: "."
    CaseSensitive: true
  - Pos: 58
    AsciiString: "\r\n\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PRZYPISANIA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CZYTNIKI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EDYTORY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILTRY"
    CaseSensitive: false
