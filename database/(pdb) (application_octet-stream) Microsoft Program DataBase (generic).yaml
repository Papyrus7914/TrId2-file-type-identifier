Name: Microsoft Program DataBase (generic)
Description: Symbol Table / Debug info used by Microsoft's compilers
URL: "https://en.wikipedia.org/wiki/Program_database"
FileNameExtensions: ["pdb"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Microsoft C/C++ "
    CaseSensitive: true
