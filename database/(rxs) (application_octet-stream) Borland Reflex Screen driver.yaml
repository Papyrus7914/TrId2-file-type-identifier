Name: Borland Reflex Screen driver
URL: "https://en.wikipedia.org/wiki/Borland_Reflex"
FileNameExtensions: ["rxs"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x01, 0x00]
  - Pos: 3
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".RXS"
    CaseSensitive: false
