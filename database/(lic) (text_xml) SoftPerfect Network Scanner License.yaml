Name: SoftPerfect Network Scanner License
URL: "https://www.softperfect.com/products/networkscanner/"
FileNameExtensions: ["lic"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "NETWORK-SCANNER-LICENSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTOUPDATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LASTCHECK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LANGUAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENABLED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UPGRADE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROMPT"
    CaseSensitive: false
