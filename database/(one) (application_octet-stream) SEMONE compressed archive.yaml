Name: SEMONE compressed archive
Description: SEMONE is an old compression program by Vladimir V. Vemenyuk.
URL: "http://fileformats.archiveteam.org/wiki/SEMONE"
FileNameExtensions: ["one"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SEM"
    CaseSensitive: true
