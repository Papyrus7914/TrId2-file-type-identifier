    CaseSensitive: true
  - Pos: 40
    AsciiString: ". OBJ."
    CaseSensitive: true
  - Pos: 52
    AsciiString: "WORLD  "
    CaseSensitive: true
  - Pos: any
    AsciiString: "D3D  (C) VINCENT BELTRAME 199"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WORLD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "D3D."
    CaseSensitive: false
  - Pos: any
    AsciiString: "FAC."
    CaseSensitive: false
  - Pos: any
    AsciiString: "OBJ."
    CaseSensitive: false
