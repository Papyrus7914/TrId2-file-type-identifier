Name: Balsamiq Mockups prototype
URL: "http://en.wikipedia.org/wiki/Balsamiq"
FileNameExtensions: ["bmml"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<mockup version=\"1.0\" skin=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "COM.BALSAMIQ.MOCKUPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTROL CONTROLID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTROLPROPERTIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MOCKUP VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTROLTYPEID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ISINGROUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTROLS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOCKED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SKETCH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ZORDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FALSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SKIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
