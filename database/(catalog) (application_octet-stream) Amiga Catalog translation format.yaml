Name: Amiga Catalog translation format
FileNameExtensions: ["catalog"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "CTLGFVER"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CSET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LANG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRS"
    CaseSensitive: false
