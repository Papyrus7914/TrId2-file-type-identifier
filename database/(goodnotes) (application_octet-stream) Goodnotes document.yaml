Name: Goodnotes document
URL: "https://www.goodnotes.com/"
FileNameExtensions: ["goodnotes"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "index.search.pb"
    CaseSensitive: true
  - Pos: any
    AsciiString: "INDEX.ATTACHMENTS.PB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INDEX.EVENTS.PB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INDEX.SEARCH.PB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INDEX.NOTES.PB"
    CaseSensitive: false
