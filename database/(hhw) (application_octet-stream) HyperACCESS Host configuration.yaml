Name: HyperACCESS Host configuration
URL: "https://en.wikipedia.org/wiki/HyperACCESS"
FileNameExtensions: ["hhw"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1]
  - Pos: 1024
    AsciiString: "R\0o\0o\0t\0 \0E\0n\0t\0r\0y"
    CaseSensitive: true
  - Pos: any
    AsciiString: "P\0H\0O\0N\0E\0B\0O\0O\0K\0.\0D\0E\0T\0A\0I\0L\0S\0.\0I\0N\0F\0O"
    CaseSensitive: false
  - Pos: any
    AsciiString: "R\0O\0O\0T\0 \0E\0N\0T\0R\0Y"
    CaseSensitive: false
  - Pos: any
    AsciiString: "C\0O\0N\0T\0E\0N\0T\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HOST.HHW"
    CaseSensitive: false
