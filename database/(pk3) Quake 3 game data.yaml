Name: Quake 3 game data
FileNameExtensions: ["pk3"]
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "LEVELSHOTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".BSPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".JPGPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAPS"
    CaseSensitive: false
