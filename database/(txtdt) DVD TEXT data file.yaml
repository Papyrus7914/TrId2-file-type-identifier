Name: DVD TEXT data file
FileNameExtensions: ["txtdt"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "DVD_TEXT_DATA\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NUM_LANG_UNITS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHARACTER_SET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DVD_TEXT_DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT_DATA_ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LANGUAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VOLUME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ISO_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SORTING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
