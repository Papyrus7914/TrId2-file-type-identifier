Name: GNOME Shell extension
URL: "https://extensions.gnome.org/"
FileNameExtensions: ["zip"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "GENERATED BY SWEETTOOTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "METADATA.JSONPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "METADATA.JSON{"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTENSION.JSU"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHELL-VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DO NOT EDIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_GENERATED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UUID"
    CaseSensitive: false
