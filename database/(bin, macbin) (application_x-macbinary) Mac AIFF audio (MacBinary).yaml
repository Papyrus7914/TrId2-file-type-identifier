Name: Mac AIFF audio (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/Audio_Interchange_File_Format"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "AIFF"
    CaseSensitive: true
  - Pos: any
    AsciiString: "AIFF"
    CaseSensitive: false
