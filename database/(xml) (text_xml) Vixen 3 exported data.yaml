Name: Vixen 3 exported data
URL: "http://www.vixenlights.com/"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xEF\xBB\xBF<?xml version=\"1.0\" encoding=\"utf-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VIXEN3_EXPORT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTROLLER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RESOLUTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STARTCHAN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHANNELS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DURATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NETWORK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUTFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INDEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".VIX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
