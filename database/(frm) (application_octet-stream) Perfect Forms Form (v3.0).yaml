Name: Perfect Forms Form (v3.0)
Description: PC forms creator tool by Expert Software.
FileNameExtensions: ["frm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "V\0"
    CaseSensitive: true
  - Pos: 4
    AsciiString: "M"
    CaseSensitive: true
  - Pos: any
    AsciiString: "F..."
    CaseSensitive: false
