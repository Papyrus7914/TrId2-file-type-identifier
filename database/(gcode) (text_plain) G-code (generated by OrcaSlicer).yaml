Name: G-code (generated by OrcaSlicer)
URL: "https://github.com/SoftFever/OrcaSlicer"
FileNameExtensions: ["gcode"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "; HEADER_BLOCK_START\n; generated by OrcaSlicer"
    CaseSensitive: true
  - Pos: any
    AsciiString: "EXTERNAL PERIMETERS EXTRUSION WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOLID INFILL EXTRUSION WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FIRST LAYER EXTRUSION WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOP INFILL EXTRUSION WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ESTIMATED PRINTING TIME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATED BY ORCASLICER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXECUTABLE_BLOCK_START"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THUMBNAIL_BLOCK_START"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXECUTABLE_BLOCK_END"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STOP PRINTING OBJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BEFORE_LAYER_CHANGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THUMBNAIL_BLOCK_END"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOTAL FILAMENT COST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONFIG_BLOCK_START"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILAMENT END GCODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEADER_BLOCK_START"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOTAL LAYER NUMBER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOTAL LAYERS COUNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEADER_BLOCK_END"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THUMBNAIL BEGIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILAMENT USED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THUMBNAIL END"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INNER WALL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUTER WALL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CUSTOM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
