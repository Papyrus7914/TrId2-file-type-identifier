Name: Trainz Mesh Importer info
URL: "http://online.ts2009.com/mediaWiki/index.php/Trainz_Mesh_Importer"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<trainzImport>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TEXTURENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MATERIALID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MATERIALS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRIANGLES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POSITION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXCOORD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXTURES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIFFUSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERTEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MESH"
    CaseSensitive: false
