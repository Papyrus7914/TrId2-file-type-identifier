Name: "Dracula: The Resurrection save game"
URL: "https://www.mobygames.com/game/1862/dracula-the-resurrection/"
FileNameExtensions: ["bin"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 1
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 5
    AsciiString: ":"
    CaseSensitive: true
  - Pos: 27
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "INTERFACE.VR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCRIPT."
    CaseSensitive: false
  - Pos: any
    AsciiString: ".WAV"
    CaseSensitive: false
