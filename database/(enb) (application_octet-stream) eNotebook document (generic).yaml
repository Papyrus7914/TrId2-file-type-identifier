Name: eNotebook document (generic)
URL: "http://www.enotebook-home.com"
FileNameExtensions: ["enb"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x11ENBFILEVERSION:"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ENBFILEVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CENBDOCINFO"
    CaseSensitive: false
