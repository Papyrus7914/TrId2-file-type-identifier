Name: 3D Construction Kit / Virtual Reality Studio driver
URL: "https://www.mobygames.com/game/virtual-reality-studio"
FileNameExtensions: ["drv"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "3D Construction Kit (c) Incentive Software.\0\r\nIBM PC Timer "
    CaseSensitive: true
  - Pos: any
    AsciiString: "DEVICE DRIVER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VWRQSP"
    CaseSensitive: false
