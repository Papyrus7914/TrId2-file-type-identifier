Name: Playscore 2 document
URL: "https://www.playscore.co/"
FileNameExtensions: ["playscore"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "doc.json"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOC.JSON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOC.MID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOC.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".JPG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGE"
    CaseSensitive: false
