Name: Cryo Interactive game data (UBIK)
URL: "https://en.wikipedia.org/wiki/Cryo_Interactive"
FileNameExtensions: ["bf", "oli"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "UBIK\x02\0\0\0"
    CaseSensitive: true
  - Pos: 20
    AsciiString: "XB"
    CaseSensitive: true
