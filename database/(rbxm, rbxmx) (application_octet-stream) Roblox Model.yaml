Name: Roblox Model
URL: "http://en.wikipedia.org/wiki/Roblox"
FileNameExtensions: ["rbxm", "rbxmx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "<roblox"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROP"
    CaseSensitive: false
