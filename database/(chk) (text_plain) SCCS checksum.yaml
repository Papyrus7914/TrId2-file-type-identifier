Name: SCCS checksum
FileNameExtensions: ["chk"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "SCCS file DISKFILE.CHK version "
    CaseSensitive: true
  - Pos: any
    AsciiString: "FILE CHECKING MASK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE LENGTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CRC-32"
    CaseSensitive: false
