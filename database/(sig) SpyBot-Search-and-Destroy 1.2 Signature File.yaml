Name: SpyBot-Search-and-Destroy 1.2 Signature File
FileNameExtensions: ["sig"]
DetectionPatterns:
  - Pos: 0
    Bytes: [0x89, 0x00]
  - Pos: 3
    #                          >
    Bytes: [0x03, 0x05, 0x00, 0x3E]
  - Pos: 10
    #                          !
    Bytes: [0x8C, 0xC1, 0xD6, 0x21, 0x13, 0xDB, 0x94, 0xA3, 0x11, 0x02]
  - Pos: 22
    AsciiString: "\0"
    CaseSensitive: true
