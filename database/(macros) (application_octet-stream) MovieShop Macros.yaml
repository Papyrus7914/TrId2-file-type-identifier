Name: MovieShop Macros
FileNameExtensions: ["macros"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "MSMAMAHD"
    CaseSensitive: true
  - Pos: 24
    AsciiString: "FVER"
    CaseSensitive: true
  - Pos: 32
    AsciiString: "$VER: MovieShopMacros"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ANNO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MACD"
    CaseSensitive: false
