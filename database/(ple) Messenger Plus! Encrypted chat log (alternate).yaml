Name: Messenger Plus! Encrypted chat log (alternate)
URL: "http://www.msgplus.net/"
FileNameExtensions: ["ple"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "MPLE2"
    CaseSensitive: true
  - Pos: 15
    AsciiString: "h\0t\0m\0l"
    CaseSensitive: true
  - Pos: 47
    AsciiString: "RSA1"
    CaseSensitive: true
