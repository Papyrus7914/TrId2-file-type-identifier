    CaseSensitive: false
  - Pos: any
    AsciiString: "SLIDELAYOUTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SLIDEMASTERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THEME1.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CORE.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCPROPS"
    CaseSensitive: false
