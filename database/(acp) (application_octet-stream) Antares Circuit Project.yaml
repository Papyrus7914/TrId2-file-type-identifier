Name: Antares Circuit Project
URL: "https://www.antarescircuit.io/"
FileNameExtensions: ["acp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 26
    AsciiString: "%\0\0\0"
    CaseSensitive: true
  - Pos: 38
    AsciiString: "-"
    CaseSensitive: true
  - Pos: 43
    AsciiString: "-"
    CaseSensitive: true
  - Pos: 48
    AsciiString: "-"
    CaseSensitive: true
  - Pos: 53
    AsciiString: "-"
    CaseSensitive: true
  - Pos: 66
    AsciiString: "/"
    CaseSensitive: true
  - Pos: 69
    AsciiString: "PK"
    CaseSensitive: true
  - Pos: 85
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 123
    AsciiString: "-"
    CaseSensitive: true
  - Pos: 128
    AsciiString: "-"
    CaseSensitive: true
  - Pos: 133
    AsciiString: "-"
    CaseSensitive: true
  - Pos: 138
    AsciiString: "-"
    CaseSensitive: true
  - Pos: 151
    AsciiString: "/"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LIBRARY.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".CIRPK"
    CaseSensitive: false
