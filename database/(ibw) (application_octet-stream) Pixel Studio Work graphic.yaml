Name: Pixel Studio Work graphic
URL: "http://fileformats.archiveteam.org/wiki/Pixel_Studio_(FileStream)"
FileNameExtensions: ["ibw"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: ",-\0\0"
    CaseSensitive: true
  - Pos: 14
    AsciiString: "CDibImage"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CDIBIMAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SELECTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CCHANNEL"
    CaseSensitive: false
