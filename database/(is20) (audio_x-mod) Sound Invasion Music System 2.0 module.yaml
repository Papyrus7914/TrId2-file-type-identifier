Name: Sound Invasion Music System 2.0 module
Description: AKA InStereo!, the editor's name.
URL: "http://www.exotica.org.uk/wiki/InStereo!"
FileNameExtensions: ["is20"]
MimeType: audio/x-mod
DetectionPatterns:
  - Pos: 0
    AsciiString: "IS20DF10STBL"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SAMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYNT"
    CaseSensitive: false
