Name: EasyCAD for Windows drawing (generic)
URL: "https://en.wikipedia.org/wiki/FastCAD"
FileNameExtensions: ["ecw"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "ECWin "
    CaseSensitive: true
  - Pos: 7
    AsciiString: "."
    CaseSensitive: true
  - Pos: 10
    AsciiString: " Drawing File: "
    CaseSensitive: true
