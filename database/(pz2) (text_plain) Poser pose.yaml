Name: Poser pose
URL: "http://en.wikipedia.org/wiki/Poser"
FileNameExtensions: ["pz2"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "{"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FIGURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUMBER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HIGH"
    CaseSensitive: false
