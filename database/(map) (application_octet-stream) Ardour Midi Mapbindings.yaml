Name: Ardour Midi Map/bindings
URL: "https://en.wikipedia.org/wiki/Ardour_(software)"
FileNameExtensions: ["map"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ARDOURMIDIBINDINGS VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FUNCTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
