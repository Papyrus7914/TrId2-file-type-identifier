Name: Lightwork Pattern (name first)
URL: "https://hohmbody.com/flickerstrip/lightwork"
FileNameExtensions: ["pattern"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "name:"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PIXELDATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PUBLISHED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISPLAY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PALETTE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FRAMES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PIXELS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OWNER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CODE"
    CaseSensitive: false
