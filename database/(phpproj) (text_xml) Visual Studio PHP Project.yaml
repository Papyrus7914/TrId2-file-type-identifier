Name: Visual Studio PHP Project
URL: "https://en.wikipedia.org/wiki/Microsoft_Visual_Studio"
FileNameExtensions: ["phpproj"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    #                          <
    Bytes: [0xEF, 0xBB, 0xBF, 0x3C]
  - Pos: any
    AsciiString: "CONFIGURATION CONDITION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INCLUDEDEBUGINFORMATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERTYGROUP CONDITION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCHEMAS.MICROSOFT.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$(CONFIGURATION)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPILE INCLUDE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULTTARGETS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROOTNAMESPACE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECTGUID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUTPUTTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEVELOPER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ITEMGROUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MSBUILD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RELEASE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FALSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PHP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "2003"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRUE"
    CaseSensitive: false
