Name: Discus CD Label (v2)
URL: "http://fileformats.archiveteam.org/wiki/Discus"
FileNameExtensions: ["cdl"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xCD\xCD\0\aCANV"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FONT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAYR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MASK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PHOT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PREV"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
