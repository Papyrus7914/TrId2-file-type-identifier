Name: PageFocus DataBase
URL: "https://www.pagefocus.com"
FileNameExtensions: ["xdb"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PFocus"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "."
    CaseSensitive: true
  - Pos: 16
    AsciiString: "FORMDB"
    CaseSensitive: true
