Name: Lotus Raster Font
Description: Used in old Lotus MS-DOS applications.
FileNameExtensions: ["lrf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "LOTUS FONT\x01\0\x01\0O\0\x03\0"
    CaseSensitive: true
  - Pos: 19
    AsciiString: "\0O\0\0\0"
    CaseSensitive: true
