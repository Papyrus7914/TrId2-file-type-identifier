Name: Airty Prolog Environment settings (v4.x)
URL: "https://winworldpc.com/product/arity-prolog-compiler/4x"
FileNameExtensions: ["env"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "EN"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".ADB"
    CaseSensitive: false
