Name: Micrografx Media Manager Easy Catalog
URL: "https://en.wikipedia.org/wiki/Micrografx"
FileNameExtensions: ["ecf"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "[Main]\r\nName=."
    CaseSensitive: true
  - Pos: any
    AsciiString: "WINDOWHEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WINDOWWIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SUBJECTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COUNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".SBJ"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH"
    CaseSensitive: false
