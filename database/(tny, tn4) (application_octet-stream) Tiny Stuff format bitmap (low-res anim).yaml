Name: Tiny Stuff format bitmap (low-res anim)
Description: Old Atari ST RLE compressed format.
URL: "http://fileformats.archiveteam.org/wiki/Tiny_Stuff"
FileNameExtensions: ["tny", "tn4"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x03\aw"
    CaseSensitive: true
