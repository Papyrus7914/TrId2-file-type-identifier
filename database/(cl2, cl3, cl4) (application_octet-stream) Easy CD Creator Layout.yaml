Name: Easy CD Creator Layout
URL: "https://en.wikipedia.org/wiki/Roxio"
FileNameExtensions: ["cl2", "cl3", "cl4"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1, 0x00]
  - Pos: any
    AsciiString: "R\0O\0O\0T\0 \0E\0N\0T\0R\0Y"
    CaseSensitive: false
  - Pos: any
    AsciiString: "C\0O\0N\0T\0E\0N\0T\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SESNDESCRIPTOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CD_PLUS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "0090"
    CaseSensitive: false
