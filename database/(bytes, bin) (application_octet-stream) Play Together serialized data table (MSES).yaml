Name: Play Together serialized data table (MSES)
URL: "https://playtogether.fandom.com/wiki/Play_Together_Wiki"
FileNameExtensions: ["bytes", "bin"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MSES\a\0\0\0"
    CaseSensitive: true
  - Pos: 64
    AsciiString: "UTF-8"
    CaseSensitive: true
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
