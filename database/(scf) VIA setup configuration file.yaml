Name: VIA setup configuration file
URL: "http://en.wikipedia.org/wiki/VIA_Technologies"
FileNameExtensions: ["scf"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "[SCF]\r\nCOMPANY="
    CaseSensitive: true
  - Pos: any
    AsciiString: "SYSTEM MANUFACTURER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYSTEM SIGNATURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.VIAARENA.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIA TECHNOLOGIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PACKAGE_VERSION"
    CaseSensitive: false
