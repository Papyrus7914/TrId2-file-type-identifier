Name: Mac Finder data (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/Finder_(software)"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "FNDR"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FNDR"
    CaseSensitive: false
