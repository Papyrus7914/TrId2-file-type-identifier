Name: LEGO Mindstorms EV3 project
URL: "http://en.wikipedia.org/wiki/Lego_Mindstorms_EV3"
FileNameExtensions: ["ev3"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "ACTIVITYASSETS.LAZ"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT.LVPROJX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "___PROJECTTITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ACTIVITY.X3A"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".EV3P"
    CaseSensitive: false
