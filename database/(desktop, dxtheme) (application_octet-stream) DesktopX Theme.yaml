Name: DesktopX Theme
URL: "http://www.stardock.com/products/desktopx/"
FileNameExtensions: ["desktop", "dxtheme"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "THEME.INI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "T.BMP"
    CaseSensitive: false
