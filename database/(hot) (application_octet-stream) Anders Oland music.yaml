Name: Anders Oland music
Description: Used in the Amiga game Prime Mover.
FileNameExtensions: ["hot"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "mpl"
    CaseSensitive: true
  - Pos: 18
    AsciiString: "-=*> Music & Player by: Anders 0land/Soul Syndicate! - All Rig"
    CaseSensitive: true
  - Pos: 84
    AsciiString: "Reserved! <=*-"
    CaseSensitive: true
