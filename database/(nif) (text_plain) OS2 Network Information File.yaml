Name: OS/2 Network Information File
Description: Needed for network cards installation.
URL: "https://en.wikipedia.org/wiki/OS/2"
FileNameExtensions: ["nif"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "["
    CaseSensitive: true
  - Pos: any
    AsciiString: "DRIVERNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EDITABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPTIONAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISPLAY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".OS2"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HELP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PORT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
