Name: 3D XML files (unzipped)
Description: files created with 3dprintscreen.exe differ from those created with other software
URL: "http://www.3ds.com/products-solutions/3d-for-all/"
FileNameExtensions: ["3dxml"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "XMLSCHEMA-INSTANCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODEL_3DXML XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCHEMAVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.3DS.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.W3.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEADER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XLINK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
