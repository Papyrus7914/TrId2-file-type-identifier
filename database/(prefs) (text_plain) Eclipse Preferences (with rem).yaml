Name: Eclipse Preferences (with rem)
URL: "https://en.wikipedia.org/wiki/Eclipse_(software)"
FileNameExtensions: ["prefs"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "#"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ECLIPSE.PREFERENCES.VERSION"
    CaseSensitive: false
