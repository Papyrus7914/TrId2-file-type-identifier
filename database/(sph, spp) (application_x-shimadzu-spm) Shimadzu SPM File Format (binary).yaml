Name: Shimadzu SPM File Format (binary)
URL: "https://github.com/christian-sahlmann/gwyddion/blob/master/modules/file/shimadzu.c"
FileNameExtensions: ["sph", "spp"]
MimeType: application/x-shimadzu-spm
DetectionPatterns:
  - Pos: 0
    AsciiString: "Shimadzu SPM File Format Version "
    CaseSensitive: true
