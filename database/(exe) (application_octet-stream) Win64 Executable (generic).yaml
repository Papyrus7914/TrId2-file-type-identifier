Name: Win64 Executable (generic)
URL: "https://en.wikipedia.org/wiki/Portable_Executable"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 3
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 11
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 14
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 17
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 21
    AsciiString: "\0\0\0@\0"
    CaseSensitive: true
  - Pos: 27
    AsciiString: "\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 62
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODE"
    CaseSensitive: false
