    CaseSensitive: true
  - Pos: any
    AsciiString: "SONG_BLOCK_COLORS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE_MIDI_SEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLAYHEAD_TINT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RECORD_BRIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ACCENT_GHOST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOADING_TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRACK_COLORS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ACCENT_DARK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT_BRIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ACCENT_DIM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ACCENT_MID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEPARATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_COMMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DANGER"
    CaseSensitive: false
