Name: CorelDRAW drawing (generic)
Description: Older format.
URL: "https://en.wikipedia.org/wiki/CorelDRAW"
FileNameExtensions: ["cdr"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "WL"
    CaseSensitive: true
  - Pos: 3
    AsciiString: "\0"
    CaseSensitive: true
