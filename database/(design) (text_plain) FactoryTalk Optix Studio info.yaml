Name: FactoryTalk Optix Studio info
URL: "https://www.rockwellautomation.com/"
FileNameExtensions: ["design"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "Project:\n Name: "
    CaseSensitive: true
  - Pos: any
    AsciiString: "PROJECTNAMESPACEINDEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FTOPTIX.COREBASE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRODUCTVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMATVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEPENDENCIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RELATIVEPATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COREVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COPYRIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPANY"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".OPTIX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODULE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NODES"
    CaseSensitive: false
