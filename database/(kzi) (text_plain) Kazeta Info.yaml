Name: Kazeta Info
URL: "https://github.com/kazetaos/kazeta/wiki/Kazeta-Info-(KZI)-File-Reference"
FileNameExtensions: ["kzi"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "Name="
    CaseSensitive: true
  - Pos: any
    AsciiString: "GAMESCOPEOPTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ICON.PNG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RUNTIME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXEC"
    CaseSensitive: false
