Name: Elite Dangerous Trade Routes Data
URL: "https://en.wikipedia.org/wiki/Elite_Dangerous"
FileNameExtensions: ["trd"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\" ?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DATA TIMESTAMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYSTEMADDRESS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMODITYID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRADEROUTES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FROMSTARID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOSTARID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREDITS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AMOUNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ITEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
