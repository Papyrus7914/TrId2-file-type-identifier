Name: Smart Software WorkSheet (generic)
Description: Old MS-DOS office like suite by Innovative Software.
FileNameExtensions: ["ws"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "version "
    CaseSensitive: true
  - Pos: 9
    AsciiString: "."
    CaseSensitive: true
  - Pos: 11
    AsciiString: "\r\n\x1A"
    CaseSensitive: true
