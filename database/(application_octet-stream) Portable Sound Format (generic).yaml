Name: Portable Sound Format (generic)
Description: Format for emulated music of various systen. Contains original game code (patched) + audio data.
URL: "http://fileformats.archiveteam.org/wiki/Portable_Sound_Format"
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PSF"
    CaseSensitive: true
