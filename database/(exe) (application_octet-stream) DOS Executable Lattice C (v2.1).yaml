Name: DOS Executable Lattice C (v2.1)
URL: "https://en.wikipedia.org/wiki/Lattice_C"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 12
    Bytes: [0xFF, 0xFF]
  - Pos: 16
    Bytes: [0x80, 0x00]
  - Pos: any
    AsciiString: "$*** STACK OVERFLOW ***"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$INSUFFICIENT MEMORY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INVALID STACK SIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LATTICE C 2.1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "O REDIRECTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$INVALID I"
    CaseSensitive: false
