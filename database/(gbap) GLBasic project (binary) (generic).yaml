Name: GLBasic project (binary) (generic)
URL: "http://www.glbasic.com/"
FileNameExtensions: ["gbap"]
DetectionPatterns:
  - Pos: 7
    AsciiString: "@"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 27
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 32
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".GBAS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIN32"
    CaseSensitive: false
