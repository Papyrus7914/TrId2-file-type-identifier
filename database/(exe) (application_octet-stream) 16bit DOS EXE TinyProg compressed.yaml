Name: 16bit DOS EXE TinyProg compressed
Description: Old DOS executable compressor by Tranzoa, Co.
URL: "http://fileformats.archiveteam.org/wiki/TINYPROG"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 28
    AsciiString: "tz"
    CaseSensitive: true
  - Pos: any
    AsciiString: "A\0YIT"
    CaseSensitive: false
