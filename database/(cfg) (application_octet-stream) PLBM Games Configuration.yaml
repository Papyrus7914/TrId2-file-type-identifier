    CaseSensitive: false
  - Pos: any
    AsciiString: "FLAG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KEY1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KEY2"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MOUS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOUN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VDEO"
    CaseSensitive: false
