Name: Announcements Business card (v2.0)
Description: Printed graphics designer for Windows 3.x by Parsons Technology.
FileNameExtensions: ["bus"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\a"
    CaseSensitive: true
  - Pos: 2
    AsciiString: "Announcements V2.0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ANNOUNCEMENTS V2.0"
    CaseSensitive: false
