Name: Qualcomm BREW Module Information File
URL: "https://en.wikipedia.org/wiki/Binary_Runtime_Environment_for_Wireless"
FileNameExtensions: ["mif"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x11, 0x00, 0x01, 0x00, 0x01, 0x00]
  - Pos: 7
    AsciiString: "\0 \0\0\0"
    CaseSensitive: true
