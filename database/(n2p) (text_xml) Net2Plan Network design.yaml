Name: Net2Plan Network design
URL: "https://net2plan.com/"
FileNameExtensions: ["n2p"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version="
    CaseSensitive: true
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NETWORK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEMAND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XCOORD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "YCOORD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NODE"
    CaseSensitive: false
