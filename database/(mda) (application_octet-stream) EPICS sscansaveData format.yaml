Name: EPICS sscan/saveData format
FileNameExtensions: ["mda"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "?\xA6ff\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LINEAR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCAN1"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".VAL"
    CaseSensitive: false
