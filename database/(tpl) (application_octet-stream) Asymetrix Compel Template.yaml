Name: Asymetrix Compel Template
URL: "http://fileformats.archiveteam.org/wiki/Asymetrix_Compel"
FileNameExtensions: ["tpl"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\aTcM\x01\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "COLORSCHEME"
    CaseSensitive: false
