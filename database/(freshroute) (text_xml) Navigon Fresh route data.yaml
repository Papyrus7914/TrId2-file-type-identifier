Name: Navigon Fresh route data
URL: "https://en.wikipedia.org/wiki/Navigon"
FileNameExtensions: ["freshroute"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"ISO-8859-1\" standalone=\"yes\"?>\n<Route>\n    <Name>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ISO-8859-1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STANDALONE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POINT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROUTE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
