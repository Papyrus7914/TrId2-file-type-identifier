Name: Borland Project Group
URL: "https://en.wikipedia.org/wiki/Borland"
FileNameExtensions: ["bpg"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "#------------------------------------------------------------------------------"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MAKE.EXE -$(MAKEFLAGS)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BRCC32.EXE $**"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DCC32.EXE $**"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$(PROJECTS)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IFNDEF ROOT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$(MAKEDIR)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$(ROOT)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BWS.01"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-F$**"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENDIF"
    CaseSensitive: false
