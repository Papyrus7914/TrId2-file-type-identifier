Name: WebEx Recording
Description: Recording of a web meeting arranged using WebEx, which can be watched by using WebEx Player.
URL: "http://support.webex.com/support/downloads.html"
FileNameExtensions: ["wrf", "wot"]
MimeType: application/octet-stream"
DetectionPatterns:
  - Pos: 0
    AsciiString: "WOTF"
    CaseSensitive: true
