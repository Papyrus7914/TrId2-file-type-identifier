Name: PTC Creo 3D model
URL: "https://en.wikipedia.org/wiki/PTC_Creo"
FileNameExtensions: ["pk2"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 28
    AsciiString: "p\00SD[\0\xA4"
    CaseSensitive: true
  - Pos: any
    AsciiString: "P\00SD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "P\01SD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "P\02SD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "P\03SD"
    CaseSensitive: false
