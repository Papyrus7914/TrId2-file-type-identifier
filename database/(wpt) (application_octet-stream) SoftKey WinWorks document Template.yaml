Name: SoftKey WinWorks document Template
FileNameExtensions: ["wpt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 2
    AsciiString: "\0\0j\0WINWORKS TEMPLATE"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FOOTNOTE TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BODY TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COPYRIGHT"
    CaseSensitive: false
