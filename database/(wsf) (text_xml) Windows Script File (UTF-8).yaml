Name: Windows Script File (UTF-8)
FileNameExtensions: ["wsf"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    #                          <
    Bytes: [0xEF, 0xBB, 0xBF, 0x3C]
  - Pos: any
    AsciiString: "WSCRIPT."
    CaseSensitive: false
  - Pos: any
    AsciiString: "JOB ID"
    CaseSensitive: false
