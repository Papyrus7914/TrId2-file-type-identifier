Name: Flipper Zero Application Installation Manifest
URL: "https://en.wikipedia.org/wiki/Flipper_Zero"
FileNameExtensions: ["fim"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "Filetype: Flipper Application Installation Manifest"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VERSION BUILD API"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION UID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILETYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FULL NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".FAP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ICON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH"
    CaseSensitive: false
