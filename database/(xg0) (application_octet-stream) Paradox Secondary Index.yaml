Name: Paradox Secondary Index
URL: "https://en.wikipedia.org/wiki/Paradox_(database)"
FileNameExtensions: ["xg0"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 1
    AsciiString: "\0\0\b\b"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BLK NUM"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".XG0"
    CaseSensitive: false
