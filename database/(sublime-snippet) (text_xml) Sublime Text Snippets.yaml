Name: Sublime Text Snippets
URL: "https://en.wikipedia.org/wiki/Sublime_Text"
FileNameExtensions: ["sublime-snippet"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<snippet>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TABTRIGGER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CDATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCOPE"
    CaseSensitive: false
