    AsciiString: "MPQ\x1A \0\0\0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "\0\0\x03\0"
    CaseSensitive: true
  - Pos: 26
    AsciiString: "\0\0"
    CaseSensitive: true
