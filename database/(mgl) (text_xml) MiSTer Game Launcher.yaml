Name: MiSTer Game Launcher
URL: "https://mister-devel.github.io/MkDocs_MiSTer/advanced/mgl/"
FileNameExtensions: ["mgl"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<mistergamedescription>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FILE DELAY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INDEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
