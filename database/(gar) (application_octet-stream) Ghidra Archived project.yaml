Name: Ghidra Archived project
URL: "https://en.wikipedia.org/wiki/Ghidra"
FileNameExtensions: ["gar"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "GHIDRA ARCHIVE FILE FOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JAR_FORMATPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "~INDEX.DATPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSIONED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT."
    CaseSensitive: false
  - Pos: any
    AsciiString: "IDATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".GPR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USER"
    CaseSensitive: false
