Name: Extra! for Windows Binary/compiled Macro
Description: Mainframe terminal client for Windows by Attachmate Corp.
FileNameExtensions: ["ebm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        ^
    Bytes: [0x5E, 0x00, 0xCD, 0xAB]
  - Pos: any
    AsciiString: "SUB MAIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "END SUB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STPR"
    CaseSensitive: false
