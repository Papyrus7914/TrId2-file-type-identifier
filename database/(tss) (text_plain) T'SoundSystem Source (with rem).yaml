Name: T'SoundSystem Source (with rem)
URL: "https://code.google.com/p/tss/"
FileNameExtensions: ["tss"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "{"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CHANNEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
