Name: LEGO Mindstorms EV3 Block
URL: "http://en.wikipedia.org/wiki/Lego_Mindstorms_EV3"
FileNameExtensions: ["ev3b"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "_DIAGRAM_MOUSEOVER.PNG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_PALETTE_MOUSEOVER.PNG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_DIAGRAM.PNG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_PALETTE.PNG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BLOCKS.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POLYGROUP_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRINGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMAGES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_MODE_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IDATX"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".VIX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HELP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IHDR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PHYS"
    CaseSensitive: false
