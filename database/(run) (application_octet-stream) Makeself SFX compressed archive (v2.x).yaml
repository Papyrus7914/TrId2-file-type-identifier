Name: Makeself SFX compressed archive (v2.x)
URL: "https://makeself.io/"
FileNameExtensions: ["run"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "#!/bin/sh\n# This script was generated using Makeself 2."
    CaseSensitive: true
  - Pos: 56
    AsciiString: "."
    CaseSensitive: true
  - Pos: 58
    AsciiString: "\n"
    CaseSensitive: true
