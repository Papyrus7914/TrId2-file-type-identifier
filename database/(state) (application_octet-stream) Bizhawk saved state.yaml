Name: Bizhawk saved state
URL: "https://tasvideos.org/Bizhawk/SavestateFormat"
FileNameExtensions: ["state"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "BIZSTATE 1.0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FRAMEBUFFER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INPUT LOG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CORE"
    CaseSensitive: false
