Name: MSXVR app manifest
URL: "https://msxvr.com/"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"utf-8\"?>\r\n<icon name=\"app.png\" />\r\n<description \r\nbundle=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "APPLICATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEVELOPER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ICON NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APP.PNG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUNDLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
