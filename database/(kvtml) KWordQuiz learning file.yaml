Name: KWordQuiz learning file
URL: "http://edu.kde.org/kwordquiz/"
FileNameExtensions: ["kvtml"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOCTYPE KVTML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TION"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".DTD"
    CaseSensitive: false
