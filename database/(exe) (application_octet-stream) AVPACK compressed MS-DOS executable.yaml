Name: AVPACK compressed MS-DOS executable
Description: Old EXE file compressor by Andrei Volkov.
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "\0\x04\0\0\x12\0\0\0>\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 32
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 66
    AsciiString: "AVPACK"
    CaseSensitive: true
  - Pos: any
    AsciiString: "AVPACK"
    CaseSensitive: false
