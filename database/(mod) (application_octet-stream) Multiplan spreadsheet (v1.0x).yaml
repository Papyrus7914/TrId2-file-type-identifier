Name: Multiplan spreadsheet (v1.0x)
URL: "https://en.wikipedia.org/wiki/Multiplan"
FileNameExtensions: ["mod"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\b\xE7\0"
    CaseSensitive: true
  - Pos: 6
    Bytes: [0x01, 0x00]
  - Pos: 11
    AsciiString: "\0\0\0"
    CaseSensitive: true
