Name: Pksmart compressed 16bit DOS executable (v1)
Description: EXE compressor by Puchkov Sergey and Alex.
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0\0\x02\0"
    CaseSensitive: true
  - Pos: 12
    Bytes: [0xFF, 0xFF]
  - Pos: 16
    Bytes: [0x80, 0x01]
  - Pos: 20
    AsciiString: "\x04\0\0\0\x1C\0\0\0PKS\x01"
    CaseSensitive: true
  - Pos: any
    AsciiString: "W2RZ"
    CaseSensitive: false
