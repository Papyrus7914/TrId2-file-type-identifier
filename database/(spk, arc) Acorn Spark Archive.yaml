Name: Acorn Spark Archive
FileNameExtensions: ["spk", "arc"]
DetectionPatterns:
  - Pos: 0
    Bytes: [0x1A]
  - Pos: 2
    AsciiString: "!"
    CaseSensitive: true
  - Pos: 18
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 28
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 32
    Bytes: [0xFF]
  - Pos: 38
    AsciiString: "\0\0\0"
    CaseSensitive: true
