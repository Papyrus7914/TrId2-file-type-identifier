Name: Zicky Zick's Milkcaps game data
FileNameExtensions: ["tub"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x96, 0x19]
  - Pos: any
    AsciiString: "TTUBEDESIGN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPUTERSP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMAGE.DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TPOGDESIGN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HUMANSP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KIND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TPF0"
    CaseSensitive: false
