Name: Mirror II Emulation File
Description: Mirror II terminal emulator was included with Amstrad PPC computers.
URL: "http://www.danielsays.com/ss-gallery-dos-mirror-iii.html"
FileNameExtensions: ["mef"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MR\0\0\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 11
    Bytes: [0x0E]
