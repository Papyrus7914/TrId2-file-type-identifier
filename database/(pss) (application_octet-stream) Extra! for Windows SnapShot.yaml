Name: Extra! for Windows SnapShot
Description: Mainframe terminal client for Windows by Attachmate Corp.
FileNameExtensions: ["pss"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "@\0\x01\x01DFp2"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".PSS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DFP2"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MENU"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VTAM"
    CaseSensitive: false
