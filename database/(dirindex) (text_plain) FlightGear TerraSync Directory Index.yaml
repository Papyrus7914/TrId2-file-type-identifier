Name: FlightGear TerraSync Directory Index
URL: "https://wiki.flightgear.org/TerraSync"
FileNameExtensions: ["dirindex"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "#"
    CaseSensitive: true
  - Pos: 44
    AsciiString: "\nversion:1\npath:"
    CaseSensitive: true
  - Pos: any
    AsciiString: "INDEX CREATED ON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH"
    CaseSensitive: false
