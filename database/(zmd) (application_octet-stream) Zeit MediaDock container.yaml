    AsciiString: "MediaDock"
    CaseSensitive: true
  - Pos: 18
    AsciiString: "RIFF"
    CaseSensitive: true
  - Pos: 26
    AsciiString: "MDRDstat"
    CaseSensitive: true
  - Pos: 40
    AsciiString: "vol "
    CaseSensitive: true
  - Pos: 56
    AsciiString: "path"
    CaseSensitive: true
  - Pos: 80
    AsciiString: "name"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MDRDSTAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RIFF"
    CaseSensitive: false
