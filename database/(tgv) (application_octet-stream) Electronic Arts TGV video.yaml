Name: Electronic Arts TGV video
URL: "https://wiki.multimedia.cx/index.php?title=TGV"
FileNameExtensions: ["tgv"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "kVGT"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FVGT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "1SND"
    CaseSensitive: false
