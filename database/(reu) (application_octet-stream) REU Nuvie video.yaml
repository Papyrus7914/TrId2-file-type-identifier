Name: REU Nuvie video
Description: Actually the dump of a REU memory expansion for the Commodore 64.
URL: "http://www.mos6502.com/friday-commodore/hq-video-playback-on-a-c64/"
FileNameExtensions: ["reu"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xA0]
  - Pos: 2
    Bytes: [0x8C]
  - Pos: 4
    #                                                  <
    Bytes: [0xD0, 0xA0, 0xB8, 0x8C, 0x18, 0xD0, 0xA0, 0x3C, 0x8C, 0x11, 0xD0, 0xA0]
