Name: KeePass Password Safe database
Description: KeePass is a free, open-source, light-weight and easy-to-use password manager.
URL: "http://keepass.sourceforge.net"
FileNameExtensions: ["kdb", "kdbx"]
DetectionPatterns:
  - Pos: 0
    Bytes: [0x03, 0xD9, 0xA2, 0x9A]
  - Pos: 5
    #              K
    Bytes: [0xFB, 0x4B, 0xB5]
