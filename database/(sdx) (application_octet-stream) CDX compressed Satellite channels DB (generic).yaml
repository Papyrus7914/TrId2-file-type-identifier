Name: CDX compressed Satellite channels DB (generic)
FileNameExtensions: ["sdx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "CDX\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DATABASEV"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".SDX"
    CaseSensitive: false
