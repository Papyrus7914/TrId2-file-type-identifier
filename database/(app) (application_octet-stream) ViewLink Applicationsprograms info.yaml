Name: ViewLink Applications/programs info
URL: "https://wiki.preterhuman.net/Traveling_Software_ViewLink"
FileNameExtensions: ["app"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "VL.APP "
    CaseSensitive: true
  - Pos: any
    AsciiString: "COPYRIGHT 1989 TRAVELING SOFTWARE"
    CaseSensitive: false
