Name: Satori Paint Canvas
URL: "https://en.wikipedia.org/wiki/Satori_Paint"
FileNameExtensions: ["cvs"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "0\0\0\0GLCWIND picture file (c) Spaceward Graphics Ltd.\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GLCOBJ_STRUC_GENERIC"
    CaseSensitive: false
