Name: SGI Open Inventor Scene Graph (binary)
URL: "http://oss.sgi.com/projects/inventor/"
FileNameExtensions: ["iv"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "#Inventor V"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "."
    CaseSensitive: true
  - Pos: 14
    AsciiString: " binary"
    CaseSensitive: true
