Name: Mac HyperCard stack (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/HyperCard"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "STAK"
    CaseSensitive: true
  - Pos: any
    AsciiString: "STAK"
    CaseSensitive: false
