Name: XEphem gallery info
URL: "https://en.wikipedia.org/wiki/XEphem"
FileNameExtensions: ["gly"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "<gallery>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
