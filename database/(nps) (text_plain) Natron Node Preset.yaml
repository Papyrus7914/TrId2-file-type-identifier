Name: Natron Node Preset
URL: "https://en.wikipedia.org/wiki/Natron_(software)"
FileNameExtensions: ["nps"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "# Natron Presets File"
    CaseSensitive: true
  - Pos: any
    AsciiString: "- PLUGINID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "- TYPENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGESORDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USERPAGES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHILDREN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NODEPAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISPLAY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "- NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INPUTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARAMS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GROUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LABEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NDIMS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BOOL"
    CaseSensitive: false
