Name: QuickCrt Theme
URL: "https://sourceforge.net/projects/quickcrt/"
FileNameExtensions: ["thm"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "["
    CaseSensitive: true
  - Pos: 2
    AsciiString: "]\r\n\t"
    CaseSensitive: true
  - Pos: any
    AsciiString: "THEME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
