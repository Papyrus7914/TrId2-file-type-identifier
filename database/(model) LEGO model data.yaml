    Bytes: [0x64, 0x00, 0x00, 0x00, 0xB5, 0xB2, 0x8E, 0x40, 0xD6, 0x15, 0x41, 0x48, 0x90, 0xA6, 0xA6, 0x94, 0x9C, 0xDC, 0x9D, 0xFE]
