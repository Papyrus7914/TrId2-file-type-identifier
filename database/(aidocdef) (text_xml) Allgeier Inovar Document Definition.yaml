    CaseSensitive: true
  - Pos: any
    AsciiString: "DOCDEF XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.AI-AG.DE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMATERROR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BOOLEAN ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INTEGER ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RANGEERROR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FLOAT ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
