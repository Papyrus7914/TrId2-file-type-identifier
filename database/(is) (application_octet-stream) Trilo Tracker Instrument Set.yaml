Name: Trilo Tracker Instrument Set
Description: An MSX tracker.
URL: "http://trilobyte-msx.com/TriloTracker/index.php/Main_Page"
FileNameExtensions: ["is"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "IS\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CLOSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPEN"
    CaseSensitive: false
