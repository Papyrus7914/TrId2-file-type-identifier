Name: Made4U remote codes db / programming data
URL: "http://www.gbs-elettronica.it/"
FileNameExtensions: ["exd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PMED\0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GBS ELETTRONICA"
    CaseSensitive: false
