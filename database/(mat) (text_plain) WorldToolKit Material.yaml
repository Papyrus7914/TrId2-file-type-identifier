Name: WorldToolKit Material
URL: "https://www.terasoft.com/about/sense8.html"
FileNameExtensions: ["mat"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "mat"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DIFFUSE SPECULAR SHININESS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALID AMBIENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION 3.0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MATDEF"
    CaseSensitive: false
