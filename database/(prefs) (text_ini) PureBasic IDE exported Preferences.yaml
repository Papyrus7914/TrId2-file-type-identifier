Name: PureBasic IDE exported Preferences
URL: "https://www.purebasic.com/"
FileNameExtensions: ["prefs"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    Bytes: [0xEF, 0xBB, 0xBF]
  - Pos: any
    AsciiString: "PUREBASIC IDE EXPORTED PREFERENCES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHORTCUT SETTINGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FOLDING KEYWORDS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR SETTINGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOOLBAR LAYOUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHORTCUTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SECTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLORS"
    CaseSensitive: false
