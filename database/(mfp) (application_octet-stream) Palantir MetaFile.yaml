Name: Palantir MetaFile
Description: A Windows MetaFile with some custom header.
FileNameExtensions: ["mfp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x03\0\b\0"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "\x05\x01\0\t\0\0\x01"
    CaseSensitive: true
