Name: PC-Draft-CAD drawing (v3.x)
Description: MS-DOS shareware CAD by Natural Sorftware.
FileNameExtensions: ["dwg"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 5
    AsciiString: "\0\0\0\0"
    CaseSensitive: true
  - Pos: 10
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 14
    AsciiString: "\0\0\0\x80="
    CaseSensitive: true
  - Pos: 63
    #              >           3
    Bytes: [0x80, 0x3E, 0xF4, 0x33]
  - Pos: 111
    #              >           3
    Bytes: [0x80, 0x3E, 0xF4, 0x33]
