Name: Axiom Blueprint
URL: "https://axiomdocs.moulberry.com/"
FileNameExtensions: ["bp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\n\xE5\xBB6\0\0\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "\n\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LOCKEDTHUMBNAIL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THUMBNAILPITCH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THUMBNAILYAW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BLOCKCOUNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTHOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IDATX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IHDR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TAGS"
    CaseSensitive: false
