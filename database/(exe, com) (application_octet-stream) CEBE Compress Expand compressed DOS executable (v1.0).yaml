Name: CEBE Compress Expand compressed DOS executable (v1.0)
Description: EXE/COM compressor by Babble Enterprises.
URL: "http://fileformats.archiveteam.org/wiki/CEBE"
FileNameExtensions: ["exe", "com"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0\0\x02\0"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "\x80\0\0\0\x0E\0"
    CaseSensitive: true
  - Pos: 24
    AsciiString: "\x1C\0\0\0CEBE"
    CaseSensitive: true
  - Pos: any
    AsciiString: "*CEP*"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CEBE"
    CaseSensitive: false
