Name: Sydex SXD Self eXtraciting Disk image Executable
URL: "http://fileformats.archiveteam.org/wiki/SXD_(Sydex)"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 3
    Bytes: [0x01]
  - Pos: 5
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 12
    Bytes: [0xFF, 0xFF]
  - Pos: any
    AsciiString: "JANFEBMARAPRMAYJUNJULAUGSEPOCTNOVDECU"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NOT ENOUGH MEMORY TO EXECUTE."
    CaseSensitive: false
  - Pos: any
    AsciiString: "INC. ALL RIGHTS RESERVED."
    CaseSensitive: false
  - Pos: any
    AsciiString: "REQUIRES AT LEAST DOS 3.3"
    CaseSensitive: false
  - Pos: any
    AsciiString: "000 PERCENT\0360K 5.25"
    CaseSensitive: false
  - Pos: any
    AsciiString: "8 INCH \02.88M 3.5"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOW\0HIGH\0EXTENDED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COPYRIGHT 1995"
    CaseSensitive: false
  - Pos: any
    AsciiString: "1.2M 5.25"
    CaseSensitive: false
  - Pos: any
    AsciiString: "1.44M 3.5"
    CaseSensitive: false
  - Pos: any
    AsciiString: "720K  3.5"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYDEX"
    CaseSensitive: false
