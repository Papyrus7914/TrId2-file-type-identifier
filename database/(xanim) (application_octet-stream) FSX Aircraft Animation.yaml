Name: FSX Aircraft Animation
URL: "http://en.wikipedia.org/wiki/Microsoft_Flight_Simulator_X"
FileNameExtensions: ["xanim"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"ISO-8859-1\" ?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ANIMLIB VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
