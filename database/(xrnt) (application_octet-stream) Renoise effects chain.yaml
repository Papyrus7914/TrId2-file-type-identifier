Name: Renoise effects chain
URL: "https://en.wikipedia.org/wiki/Renoise"
FileNameExtensions: ["xrnt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "DeviceChain.xml"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DEVICECHAIN.XMLPK"
    CaseSensitive: false
