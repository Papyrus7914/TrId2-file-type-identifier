Name: git submodule properties definition
URL: "https://git-scm.com/docs/gitmodules"
FileNameExtensions: ["gitmodule"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "[submodule \""
    CaseSensitive: true
  - Pos: any
    AsciiString: "SUBMODULE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".GIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH"
    CaseSensitive: false
