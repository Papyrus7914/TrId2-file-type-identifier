Name: StarWriter for MS-DOS Graphics Printer driver
URL: "https://en.wikipedia.org/wiki/StarOffice"
FileNameExtensions: ["gpm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: " Y\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
