Name: Microsoft Excel sheet (alternate)
URL: "https://en.wikipedia.org/wiki/Microsoft_Excel"
FileNameExtensions: ["xls"]
MimeType: application/vnd.ms-excel
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1, 0x00]
  - Pos: any
    AsciiString: "R\0O\0O\0T\0 \0E\0N\0T\0R\0Y"
    CaseSensitive: false
  - Pos: any
    AsciiString: "W\0O\0R\0K\0B\0O\0O\0K"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WORK"
    CaseSensitive: false
