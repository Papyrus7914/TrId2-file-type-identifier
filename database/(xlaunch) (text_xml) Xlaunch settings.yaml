Name: Xlaunch settings
URL: "http://www.straightrunning.com/XmingNotes/IDH_DISPLAY.htm"
FileNameExtensions: ["xlaunch"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "WWW.STRAIGHTRUNNING.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLSCHEMA-INSTANCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCHEMALOCATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XLAUNCH XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XLAUNCH.XSD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLIENTMODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WINDOWMODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.W3.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMINGNOTES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLIPBOARD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
