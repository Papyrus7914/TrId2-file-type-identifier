Name: Mac After Effects project (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/Adobe_After_Effects"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "EggP"
    CaseSensitive: true
  - Pos: any
    AsciiString: "EGGP"
    CaseSensitive: false
