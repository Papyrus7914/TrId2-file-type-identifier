Name: CD Architect Project (v4)
URL: "http://fileformats.archiveteam.org/wiki/CD_Architect"
FileNameExtensions: ["cdp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "RIFF"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "SFPJfmt"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TLSTLIST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRAKTRKH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XLSTGAIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PQLSFMT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SFPJFMT"
    CaseSensitive: false
