Name: Serif MetaFile
FileNameExtensions: ["smf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "document.xml"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOCUMENT.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THUMB.PNGPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROOT.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IDATX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IHDR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PHYS"
    CaseSensitive: false
