Name: BizHawk movie capture
URL: "https://emulation.fandom.com/wiki/BizHawk"
FileNameExtensions: ["bk2"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "SYNCSETTINGS.JSON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INPUT LOG.TXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SUBTITLES.TXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMENTS.TXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEADER.TXT"
    CaseSensitive: false
