Name: Waves Preset
URL: "http://www.waves.com/"
FileNameExtensions: ["xps"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<PresetXMLTree version=\"2\">"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PRESETXMLTREE VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRESETDATA SETUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARAMETERS TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLUGINVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRESETHEADER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERICTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRESET NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLUGINNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REALWORLD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "READONLY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "* * * *"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CURRENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "000000"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FALSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "9999"
    CaseSensitive: false
