Name: Excellence! document
Description: Amiga wordprocessor by MSS.
URL: "https://en.wikipedia.org/wiki/Excellence_(software)"
FileNameExtensions: ["doc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "FTXTPSET"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PINF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RULE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STYL"
    CaseSensitive: false
