Name: HMI Sound Operating System crash exception report
Description: HMI SOS crash dump, module list + PE sections.
URL: "https://www.vgmpf.com/Wiki/index.php/Human_Machine_Interfaces"
FileNameExtensions: ["err", "log"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "OPWI\x14\0\0\0\x01\0\0\0"
    CaseSensitive: true
  - Pos: 160
    AsciiString: ":\\"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".IDATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".RDATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".RELOC"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".RSRC"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".BSS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".EXE"
    CaseSensitive: false
