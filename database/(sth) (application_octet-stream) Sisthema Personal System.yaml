Name: Sisthema Personal System
Description: Amiga software for Totocalcio/Totip/Enalotto systems.
FileNameExtensions: ["sth"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "STHFGAME"
    CaseSensitive: true
