Name: BlueJ package
URL: "http://en.wikipedia.org/wiki/Bluej"
FileNameExtensions: ["bluej"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "#BlueJ package file"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PACKAGE.NUMDEPENDENCIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PACKAGE.EDITOR.HEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PACKAGE.EDITOR.WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PACKAGE.NUMTARGETS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PACKAGE.EDITOR.X"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PACKAGE.EDITOR.Y"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TARGET1.HEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TARGET1.WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TARGET1.NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TARGET1.TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLASSTARGET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TARGET1.X"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TARGET1.Y"
    CaseSensitive: false
