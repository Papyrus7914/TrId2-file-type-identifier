Name: RadPHP Project
URL: "http://en.wikipedia.org/wiki/RadPHP"
FileNameExtensions: ["phprj"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "[PHPProject]"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PHPPROJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ITEM1"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PHP"
    CaseSensitive: false
