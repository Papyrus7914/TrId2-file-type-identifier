Name: ASiC Simple container
URL: "https://en.wikipedia.org/wiki/Associated_Signature_Containers"
FileNameExtensions: ["asics"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "mimetypeapplication/vnd.etsi.asic-s+zip"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MIMETYPEAPPLICATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VND.ETSI.ASIC-S+ZIP"
    CaseSensitive: false
