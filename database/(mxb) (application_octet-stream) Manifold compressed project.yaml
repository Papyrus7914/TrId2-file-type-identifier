Name: Manifold compressed project
URL: "https://manifold.net/"
FileNameExtensions: ["mxb"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xEF, 0xEF, 0xAB, 0xAB, 0x00, 0x02, 0x00, 0x00]
  - Pos: 22
    AsciiString: "\0\0x\x9C"
    CaseSensitive: true
  - Pos: any
    AsciiString: "M\0F\0D\0_\0M\0E\0T\0A"
    CaseSensitive: false
  - Pos: any
    AsciiString: "M\0F\0D\0_\0R\0O\0O\0T"
    CaseSensitive: false
