Name: XTrkCAD project (with rem)
URL: "http://www.xtrkcad.org"
FileNameExtensions: ["xtc"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "#XTrkCad Version: "
    CaseSensitive: true
  - Pos: any
    AsciiString: "XTRKCAD VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROOMSIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAYERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCALE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
