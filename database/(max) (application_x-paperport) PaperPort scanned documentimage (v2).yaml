Name: PaperPort scanned document/image (v2)
Description: PaperPort is a document management tool. It allow scanning and archiving documents, photos, papers, etc.
URL: "http://fileformats.archiveteam.org/wiki/PaperPort_(MAX)"
FileNameExtensions: ["max"]
MimeType: application/x-paperport
DetectionPatterns:
  - Pos: 0
    AsciiString: "ViG"
    CaseSensitive: true
  - Pos: 4
    #        e
    Bytes: [0x65, 0x1A]
