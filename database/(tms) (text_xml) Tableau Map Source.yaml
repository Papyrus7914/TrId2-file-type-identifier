    CaseSensitive: false
  - Pos: any
    AsciiString: "CONNECTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "URL-FORMAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FEATURES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHOW-UI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAYERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SERVER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PORT"
    CaseSensitive: false
