    AsciiString: "PROCSET MAYURADRAW_OPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%%BEGINRESOURCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%%DOCUMENTFONTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAYURA SOFTWARE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%%CREATIONDATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%%BEGINPROLOG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%%BOUNDINGBOX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%%ENDCOMMENTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%%ENDRESOURCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%%INCLUDEFONT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%%ORIENTATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%%PAGETRAILER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%%BEGINSETUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%%COPYRIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%%ENDPROLOG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%%ENDSETUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%%TRAILER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%%VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%%TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PDXDICT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%%EOF"
    CaseSensitive: false
