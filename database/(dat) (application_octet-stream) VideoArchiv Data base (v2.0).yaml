Name: VideoArchiv Data base (v2.0)
Description: Amiga video DB by David Rado.
FileNameExtensions: ["dat"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "VA20CODE"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VA20CODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITL"
    CaseSensitive: false
