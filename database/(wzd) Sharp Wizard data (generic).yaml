Name: Sharp Wizard data (generic)
URL: "http://dmoz.org/Computers/Systems/Handhelds/Sharp/Wizard/"
FileNameExtensions: ["wzd"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<SHARP WZD DATA>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SHARP WZD DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CATEGORY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
