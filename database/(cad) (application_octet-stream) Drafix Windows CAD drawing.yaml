Name: Drafix Windows CAD drawing
FileNameExtensions: ["cad"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\n"
    CaseSensitive: true
  - Pos: 2
    AsciiString: "\0\0\0\v"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DRAFIX WINDOWS CAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHORT"
    CaseSensitive: false
