    CaseSensitive: false
  - Pos: any
    AsciiString: "FILEINFO FILENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "METADATA VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FIELDPROPERTIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SECTION NUMBER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMAGEINFO ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DWFILENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMAGEINFOS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILEINFOS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STARTPAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DWGUID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NORMAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NPAGES"
    CaseSensitive: false
