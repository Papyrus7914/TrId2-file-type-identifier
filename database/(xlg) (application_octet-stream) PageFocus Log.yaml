Name: PageFocus Log
URL: "https://www.pagefocus.com"
FileNameExtensions: ["xlg"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PFocus"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "."
    CaseSensitive: true
  - Pos: 16
    AsciiString: "EXFORMLOG"
    CaseSensitive: true
