Name: Fractal Design Painter Paper grain
Description: Now Corel Painter.
URL: "https://winworldpc.com/product/fractal-design-painter"
FileNameExtensions: ["pap"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0\x01\0\0"
    CaseSensitive: true
  - Pos: 80
    AsciiString: "\0\0FSPPFS"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FSPPFS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FSPG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
