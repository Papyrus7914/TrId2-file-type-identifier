Name: ListPro data
Description: ListPro is a personal information tool.
URL: "http://www.iliumsoft.com/site/lp/listpro.htm"
FileNameExtensions: ["clf"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "*Ilium Software*\r\n\r\nThis is a ListPro file. It can only be used with ListPro. Do not edit this file with any other program."
    CaseSensitive: true
  - Pos: 140
    AsciiString: "C\0h\0c\0k\0M\0a\0t\0e\0"
    CaseSensitive: true
