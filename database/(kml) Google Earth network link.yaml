Name: Google Earth network link
URL: "http://en.wikipedia.org/wiki/Keyhole_Markup_Language"
FileNameExtensions: ["kml"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "EARTH.GOOGLE.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NETWORKLINK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KML XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HREF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
