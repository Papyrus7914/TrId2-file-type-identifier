Name: GEM WordChart document
Description: Simple slides/charts making tool.
FileNameExtensions: ["wch"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #                                \f                                                                \n
    Bytes: [0x03, 0x00, 0x06, 0x00, 0x0C, 0x00, 0x15, 0x00, 0x89, 0x01, 0x91, 0x01, 0xA7, 0x02, 0xA7, 0x0A]
