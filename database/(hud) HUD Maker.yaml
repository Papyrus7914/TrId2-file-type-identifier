Name: HUD Maker
URL: "http://www.hudmaker.com"
FileNameExtensions: ["hud"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "HUDMAKER_HUD1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STANDALONE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SECTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LABEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LINE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MEMO"
    CaseSensitive: false
