Name: DeluxeProductions project
Description: Amiga Desk Top Video software.
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "PRODPRHD"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CNFG"
    CaseSensitive: false
