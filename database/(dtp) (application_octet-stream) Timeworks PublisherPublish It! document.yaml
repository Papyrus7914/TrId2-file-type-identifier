Name: Timeworks Publisher/Publish It! document
Description: Know also as Key Publisher.
URL: "https://en.wikipedia.org/wiki/Timeworks_Publisher"
FileNameExtensions: ["dtp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "DTPI"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BODY TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EODF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FKEY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POFS"
    CaseSensitive: false
