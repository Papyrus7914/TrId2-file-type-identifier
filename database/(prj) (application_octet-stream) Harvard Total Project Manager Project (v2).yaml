Name: Harvard Total Project Manager Project (v2)
Description: Project planning tool for MS-DOS.
FileNameExtensions: ["prj"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\"\0\x01\x80\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "START"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PRJ"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GOAL"
    CaseSensitive: false
