Name: Blaise Solution
URL: "https://www.blaise.com/"
FileNameExtensions: ["bsol"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"utf-8\"?>\r\n<Solution Name=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "STARTUPPROJECT RELATIVEPATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUILDSEQUENCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOLUTION NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECTITEMS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".BPROJ"
    CaseSensitive: false
