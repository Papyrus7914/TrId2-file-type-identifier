Name: Calendar Creator Plus project (v4.0)
Description: Calendar printing tool by Spinnaker Software.
FileNameExtensions: ["cc3"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1]
  - Pos: any
    AsciiString: "CALENDAR CREATOR 4.0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "R\0O\0O\0T\0 \0E\0N\0T\0R\0Y"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CURRENT_CALENDAR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GCWORKBOOKWINDOW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "C\0O\0N\0T\0E\0N\0T\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "S\0E\0T\0T\0I\0N\0G\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "V\0E\0R\0S\0I\0O\0N\04"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROGRAM FILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CCLAYOUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAMPLES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOFTKEY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".CC3"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".CE3"
    CaseSensitive: false
