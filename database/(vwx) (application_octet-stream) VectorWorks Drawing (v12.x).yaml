Name: VectorWorks Drawing (v12.x)
URL: "https://en.wikipedia.org/wiki/Vectorworks"
FileNameExtensions: ["vwx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0\b"
    CaseSensitive: true
  - Pos: 13
    AsciiString: " VW12."
    CaseSensitive: true
  - Pos: 20
    AsciiString: "."
    CaseSensitive: true
  - Pos: 22
    AsciiString: " VW1"
    CaseSensitive: true
  - Pos: 56
    AsciiString: "\x01\0VectorWorks\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VECTORWORKS"
    CaseSensitive: false
