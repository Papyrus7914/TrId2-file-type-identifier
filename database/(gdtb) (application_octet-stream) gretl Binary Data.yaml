Name: gretl Binary Data
Description: gretl native binary data format.
URL: "http://gretl.sourceforge.net/"
FileNameExtensions: ["gdtb"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "DATA.BINPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA.XMLPK"
    CaseSensitive: false
