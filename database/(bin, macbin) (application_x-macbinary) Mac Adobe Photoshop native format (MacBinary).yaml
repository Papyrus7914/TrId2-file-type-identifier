Name: Mac Adobe Photoshop native format (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/Adobe_Photoshop"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "8BIM"
    CaseSensitive: true
  - Pos: any
    AsciiString: "8BIM"
    CaseSensitive: false
