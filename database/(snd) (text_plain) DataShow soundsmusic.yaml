Name: DataShow sounds/music
Description: Old DOS multimedia presentations software by Rene Michael Plambek.
FileNameExtensions: ["snd"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: ";DataShow"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FREQ"
    CaseSensitive: false
