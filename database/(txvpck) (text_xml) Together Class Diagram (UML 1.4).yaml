Name: Together Class Diagram (UML 1.4)
URL: "https://en.wikipedia.org/wiki/Borland_Together"
FileNameExtensions: ["txvpck"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "$DEFAULTDIAGRAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PACKAGE DIAGRAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERTY NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$METACLASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIEW UIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NODESET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRUE"
    CaseSensitive: false
