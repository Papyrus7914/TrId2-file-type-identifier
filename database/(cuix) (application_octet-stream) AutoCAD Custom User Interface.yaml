Name: AutoCAD Custom User Interface
URL: "https://en.wikipedia.org/wiki/AutoCAD"
FileNameExtensions: ["cuix"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "MENU_PACKAGE_INFO.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MENUGROUP.CUIPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENT_TYPES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEADER.CUIPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".RELSPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_RELS"
    CaseSensitive: false
