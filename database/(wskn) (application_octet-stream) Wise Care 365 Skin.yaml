Name: Wise Care 365 Skin
URL: "http://www.wisecleaner.com/wise-care-365.html"
FileNameExtensions: ["wskn"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "MAINFRAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SKIN.INI"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PNG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRIV"
    CaseSensitive: false
