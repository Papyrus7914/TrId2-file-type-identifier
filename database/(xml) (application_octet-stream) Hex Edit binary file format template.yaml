Name: Hex Edit binary file format template
URL: "http://www.hexedit.com"
FileNameExtensions: ["xml"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOCTYPE BINARY_FILE_FORMAT SYSTEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BINARY_FILE_FORMAT NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BINARYFILEFORMAT.DTD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
