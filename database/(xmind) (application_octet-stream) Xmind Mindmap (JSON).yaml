Name: Xmind Mindmap (JSON)
URL: "https://xmind.com/"
FileNameExtensions: ["xmind"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "MANIFEST.JSON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "METADATA.JSON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THUMBNAIL.PNG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENT.JSON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENT.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THUMBNAILS"
    CaseSensitive: false
