Name: RSS web feed
URL: "http://en.wikipedia.org/wiki/RSS_%28file_format%29"
FileNameExtensions: ["xml", "rss"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHANNEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ABOUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LINK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CALL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INTO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW."
    CaseSensitive: false
  - Pos: any
    AsciiString: ".ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ITEM"
    CaseSensitive: false
