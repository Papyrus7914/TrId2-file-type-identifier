Name: Borland C++ Appexpert database
URL: "https://en.wikipedia.org/wiki/Turbo_C%2B%2B"
FileNameExtensions: ["apx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 8
    AsciiString: "BORCMDB"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BORCMDB"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".APX"
    CaseSensitive: false
