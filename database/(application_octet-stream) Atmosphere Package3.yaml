Name: Atmosphere Package3
Description: Part of a custom firmware package for Nintendo Switch.
URL: "https://github.com/Atmosphere-NX"
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PK31 \0\0\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 32
    AsciiString: "FSS0"
    CaseSensitive: true
