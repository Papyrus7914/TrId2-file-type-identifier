Name: MATLAB app installer
URL: "https://en.wikipedia.org/wiki/MATLAB"
FileNameExtensions: ["mlappinstall"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "COREPROPERTIES.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPPROPERTIES.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MANIFEST.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENT_TYPES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "METADATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".RELSPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_RELS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
