Name: 7-Zip compressed archive (v0.4)
Description: 7-Zip is a freeware file archiver with a very high compression ratio.
URL: "https://en.wikipedia.org/wiki/7-Zip"
FileNameExtensions: ["7z"]
MimeType: application/x-7z-compressed
DetectionPatterns:
