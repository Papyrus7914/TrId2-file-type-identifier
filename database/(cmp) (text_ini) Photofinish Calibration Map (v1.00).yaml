Name: Photofinish Calibration Map (v1.00)
FileNameExtensions: ["cmp"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "[CALIBRATION_MAP]\r\nVersion=1.00\r\nPreset="
    CaseSensitive: true
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRESET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COUNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "1.00"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
