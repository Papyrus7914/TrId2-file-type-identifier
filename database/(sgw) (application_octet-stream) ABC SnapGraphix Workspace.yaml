Name: ABC SnapGraphix Workspace
URL: "https://en.wikipedia.org/wiki/Micrografx"
FileNameExtensions: ["sgw"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\x1D\0GF*\0\0"
    CaseSensitive: true
  - Pos: 36
    AsciiString: ":\\"
    CaseSensitive: true
  - Pos: 185
    AsciiString: ":\\"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".SGW"
    CaseSensitive: false
