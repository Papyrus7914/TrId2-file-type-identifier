Name: Brick of Values (with rem)
URL: "https://ncar.github.io/VaporDocumentationWebsite/dataFormatRequirements/brickOfValues.html"
FileNameExtensions: ["bov"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "#"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BRICK_ORIGIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA_FORMAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BRICK_SIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA_FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA_SIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VARIABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TIME"
    CaseSensitive: false
