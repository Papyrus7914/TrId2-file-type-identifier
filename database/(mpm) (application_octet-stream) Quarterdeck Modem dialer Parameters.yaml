Name: Quarterdeck Modem dialer Parameters
URL: "https://en.wikipedia.org/wiki/Quarterdeck_Office_Systems"
FileNameExtensions: ["mpm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MPM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MODEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ATZ%"
    CaseSensitive: false
