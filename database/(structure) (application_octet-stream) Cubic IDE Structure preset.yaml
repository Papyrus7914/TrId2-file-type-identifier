Name: Cubic IDE Structure preset
URL: "https://en.wikipedia.org/wiki/Cubic_IDE"
FileNameExtensions: ["structure"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "OOP\0X\x96"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".STRUCTURE"
    CaseSensitive: false
