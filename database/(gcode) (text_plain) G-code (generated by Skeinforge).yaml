Name: G-code (generated by Skeinforge)
URL: "https://reprap.org/wiki/Skeinforge"
FileNameExtensions: ["gcode"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "(** This GCode was generated by "
    CaseSensitive: true
  - Pos: any
    AsciiString: "EXPORT SAVE_PENULTIMATE_GCODE FALSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(** THIS GCODE WAS GENERATED BY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(*********END END.GCODE*******)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXPORT GCODE_TIME_SEGMENT FALSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(**** END OF START.GCODE ****)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(******* END.GCODE*******)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(**** START.GCODE FOR THE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXPORT ANALYZE_GCODE TRUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(**** BEGIN HOMING ****)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXPORT GCODE_SMALL FALSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXPORT GCODE_STEP FALSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(*  USING SKEINFORGE ("
    CaseSensitive: false
  - Pos: any
    AsciiString: "(**** END HOMING ****)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SUPPORT_START.GCODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SUPPORT_END.GCODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COOL_START.GCODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SKEINFORGE GCODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COOL_END.GCODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEAD ****)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HOME.GCODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTRUDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLATFORM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SETTINGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREATED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMAT"
    CaseSensitive: false
