Name: The Music Studio Song (Apple II GS, v2)
URL: "http://justsolve.archiveteam.org/wiki/The_Music_Studio"
FileNameExtensions: ["sng"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xCFMstudio\xCF\x02"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MSTUDIO"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".WBNK"
    CaseSensitive: false
