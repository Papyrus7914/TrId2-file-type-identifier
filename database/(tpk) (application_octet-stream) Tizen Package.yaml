Name: Tizen Package
URL: "https://en.wikipedia.org/wiki/Tizen"
FileNameExtensions: ["tpk"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "AUTHOR-SIGNATURE.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TIZEN-MANIFEST.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIGNATURE1.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHARED"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PNG"
    CaseSensitive: false
