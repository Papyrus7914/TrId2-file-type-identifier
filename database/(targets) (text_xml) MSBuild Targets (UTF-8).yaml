Name: MSBuild Targets (UTF-8)
URL: "https://learn.microsoft.com/en-us/visualstudio/msbuild/msbuild?view=vs-2022"
FileNameExtensions: ["targets"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    #                          <
    Bytes: [0xEF, 0xBB, 0xBF, 0x3C]
  - Pos: any
    AsciiString: "SCHEMAS.MICROSOFT.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERTYGROUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEVELOPER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MSBUILD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "2003"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
