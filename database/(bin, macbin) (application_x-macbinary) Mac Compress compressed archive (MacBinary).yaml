Name: Mac Compress compressed archive (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/Compress"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "ZIVM"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ZIVM"
    CaseSensitive: false
