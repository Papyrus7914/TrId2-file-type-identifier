Name: AppleWin Saved State (v2)
URL: "https://github.com/AppleWin/AppleWin"
FileNameExtensions: ["yaml"]
MimeType: application/yaml
DetectionPatterns:
  - Pos: 0
    AsciiString: "# Date-stamp: "
    CaseSensitive: true
  - Pos: any
    AsciiString: "APPLECOLOR RGB ADAPTOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPLEWIN SAVE STATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN MEMORY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE_HDR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JOYSTICK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KEYBOARD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPEAKER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIDEO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNIT"
    CaseSensitive: false
