Name: BioForge Motion
URL: "https://en.wikipedia.org/wiki/BioForge"
FileNameExtensions: ["mtn"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "MOTN"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MOTN"
    CaseSensitive: false
