Name: Tupi project
URL: "https://en.wikipedia.org/wiki/Tupi_(software)"
FileNameExtensions: ["tup"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "LIBRARY.TPLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT.TPPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT.TPPM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCENE0.TPSPK"
    CaseSensitive: false
