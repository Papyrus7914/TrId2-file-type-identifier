Name: Reason song
URL: "https://en.wikipedia.org/wiki/Reason_(software)"
FileNameExtensions: ["reason"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "X15_FILE"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PROPELLERHEADS REASON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SONG FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BODY"
    CaseSensitive: false
