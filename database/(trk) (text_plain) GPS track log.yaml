Name: GPS track log
FileNameExtensions: ["trk"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xEF\xBB\xBFB  UTF-8"
    CaseSensitive: true
  - Pos: 14
    AsciiString: " "
    CaseSensitive: true
  - Pos: any
    AsciiString: "G  WGS 84"
    CaseSensitive: false
  - Pos: any
    AsciiString: "B  UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "T  A"
    CaseSensitive: false
  - Pos: any
    AsciiString: "U  1"
    CaseSensitive: false
