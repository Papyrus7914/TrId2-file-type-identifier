Name: Studio Folio Corsage game data archive
Description: Visual novel / adventure by Studio Folio.
URL: "http://fileformats.archiveteam.org/wiki/DPK"
FileNameExtensions: ["dpk"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PA"
    CaseSensitive: true
  - Pos: any
    AsciiString: "0001"
    CaseSensitive: false
