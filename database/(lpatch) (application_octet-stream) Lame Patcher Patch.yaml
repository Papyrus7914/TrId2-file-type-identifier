    CaseSensitive: false
  - Pos: any
    AsciiString: "BYTES_PATCH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MYTOOLZ.HTM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ALUIGI.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "E-MAIL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LPATCH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INTRO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
