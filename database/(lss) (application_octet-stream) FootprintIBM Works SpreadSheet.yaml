Name: Footprint/IBM Works SpreadSheet
URL: "https://en.wikipedia.org/wiki/IBM_Works"
FileNameExtensions: ["lss"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MicroBurst"
    CaseSensitive: true
  - Pos: 424
    AsciiString: "MBSS"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MBSS"
    CaseSensitive: false
