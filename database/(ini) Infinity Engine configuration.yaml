Name: Infinity Engine configuration
Description: Infinity Engine INI files follow the standard INI format.
URL: "http://iesdp.gibberlings3.net/file_formats/ie_formats/ini.htm"
FileNameExtensions: ["ini"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "[locals]\r\n\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SPEC_VAR_OPERATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IGNORE_CAN_SEE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPEC_VAR_VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPAWN_POINT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREATE_QTY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPAWN_MAIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPEC_QTY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CRE_FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CRITTERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INTERVAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCRIPT_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOCALS"
    CaseSensitive: false
