Name: Taxman's Retro Engine v5 Sprite info
URL: "https://en.wikipedia.org/wiki/Retro_Engine"
FileNameExtensions: ["bin"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SPR\0"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".GIF"
    CaseSensitive: false
