Name: Lotus SmartPic library
Description: Clipart library tool for Windows 3.x.
FileNameExtensions: ["sy1"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\x01@\0DEBR@"
    CaseSensitive: true
  - Pos: any
    AsciiString: "1-COLUMN BULLETS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "2-COLUMN BULLETS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BASIC LAYOUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NOMASTER.MAS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "2 GRAPHS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "4 GRAPHS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "1 GRAPH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MASTERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYMBOL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHAG"
    CaseSensitive: false
