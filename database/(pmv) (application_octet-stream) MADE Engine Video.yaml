Name: MADE Engine Video
URL: "https://wiki.multimedia.cx/index.php/Zork_PMV"
FileNameExtensions: ["pmv"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MOVE"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "MHED:"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MFRM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MHED"
    CaseSensitive: false
