Name: Allways Screen Driver
Description: A DTP quality add-in for Lotus 1-2-3.
FileNameExtensions: ["asd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SD\x01\0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "\0\0\0\0(C) 1988 Funk Software, Inc.\0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "(C) 1988 FUNK SOFTWARE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INC."
    CaseSensitive: false
