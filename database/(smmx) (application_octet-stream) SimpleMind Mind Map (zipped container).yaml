Name: SimpleMind Mind Map (zipped container)
URL: "https://simplemind.eu/"
FileNameExtensions: ["smmx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "document/mindmap.xml"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MINDMAP.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCUMENT"
    CaseSensitive: false
