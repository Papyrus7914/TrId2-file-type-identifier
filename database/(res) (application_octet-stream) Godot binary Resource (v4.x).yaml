Name: Godot binary Resource (v4.x)
URL: "https://en.wikipedia.org/wiki/Godot_(game_engine)"
FileNameExtensions: ["res"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "RSRC\0\0\0\0\0\0\0\0\x03\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LOCAL"
    CaseSensitive: false
