Name: FreedroidRPG isometric image Offset info
URL: "https://www.freedroid.org/"
FileNameExtensions: ["offset"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "\n"
    CaseSensitive: true
  - Pos: 2
    AsciiString: "*"
    CaseSensitive: true
  - Pos: any
    AsciiString: "** START OF ISO_IMAGE OFFSET FILE **"
    CaseSensitive: false
  - Pos: any
    AsciiString: "** END OF ISO_IMAGE OFFSET FILE **"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OFFSETX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OFFSETY"
    CaseSensitive: false
