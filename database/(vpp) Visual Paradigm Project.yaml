Name: Visual Paradigm Project
URL: "http://www.visual-paradigm.com/product/vpsuite/"
FileNameExtensions: ["vpp"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "VP-UML Project"
    CaseSensitive: true
  - Pos: 64
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "OPTIONCODEGENERATIONPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECTPROPERTIESFILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PERSISTENTMODELFILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRINTINGFRAMEWORKPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIAGRAMGENERATORPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VPUMLTREEOPTIONSPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VP-UML PROJECT200"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPTIONIMPORTERPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPTIONREPORTPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT.XMLPK"
    CaseSensitive: false
