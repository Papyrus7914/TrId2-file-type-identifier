Name: NumPy compressed data archive format
URL: "https://en.wikipedia.org/wiki/NumPy"
FileNameExtensions: ["npz"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: ".NPYPK"
    CaseSensitive: false
