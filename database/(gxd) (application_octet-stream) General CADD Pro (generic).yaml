Name: General CADD Pro (generic)
Description: Match drawings, components, fonts, etc.
URL: "http://www.generalcadd.com/"
FileNameExtensions: ["gxd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x1F\x8B\b\0\0\0\0\0\0\vGXD\0"
    CaseSensitive: true
  - Pos: 39
    AsciiString: "@"
    CaseSensitive: true
  - Pos: 54
    AsciiString: "\0\0%\0\0\0Created with General CADD for Windows"
    CaseSensitive: true
