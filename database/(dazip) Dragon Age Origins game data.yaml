Name: "Dragon Age: Origins game data"
URL: "http://en.wikipedia.org/wiki/Dragon_Age:_Origins"
FileNameExtensions: ["dazip"]
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "CONTENTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ADDINS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODULE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CORE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MLPK"
    CaseSensitive: false
