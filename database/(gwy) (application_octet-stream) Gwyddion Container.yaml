Name: Gwyddion Container
URL: "http://gwyddion.net/"
FileNameExtensions: ["gwy"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "GWY"
    CaseSensitive: true
  - Pos: 4
    AsciiString: "GwyContainer\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GWYCONTAINER"
    CaseSensitive: false
