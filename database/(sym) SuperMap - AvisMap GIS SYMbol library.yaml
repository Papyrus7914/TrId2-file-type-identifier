Name: SuperMap - AvisMap GIS SYMbol library
URL: "http://en.wikipedia.org/wiki/SuperMap"
FileNameExtensions: ["sym"]
DetectionPatterns:
  - Pos: 0
    #                          \t
    Bytes: [0x98, 0xF0, 0xD3, 0x09]
  - Pos: 9
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 22
    AsciiString: "\0\0"
    CaseSensitive: true
