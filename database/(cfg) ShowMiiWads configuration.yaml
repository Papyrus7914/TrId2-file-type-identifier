Name: ShowMiiWads configuration
Description: ShowMiiWads is a 'Wad File Manager' for Windows.
URL: "http://code.google.com/p/showmiiwads/"
FileNameExtensions: ["cfg"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "CREATEBACKUPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WINDOWHEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPLASHSCREEN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WINDOWWIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WINDOWSTATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHOWMIIWADS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAVEFOLDERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FOLDERCOUNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STANDALONE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAXIMIZED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOCATIONX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOCATIONY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LANGUAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTOSIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ACCEPTED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHOWPATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NANDPATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PORTABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SETTINGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LANGFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FOLDER0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ADDSUB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIEW"
    CaseSensitive: false
