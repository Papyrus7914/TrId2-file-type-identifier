Name: Kindwords document (v2.x)
Description: Amiga word processor by Disc Company.
URL: "https://en.wikipedia.org/wiki/KindWords"
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "CAT "
    CaseSensitive: true
  - Pos: 12
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 20
    AsciiString: "FTXTTCPP"
    CaseSensitive: true
