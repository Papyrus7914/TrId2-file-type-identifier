Name: Amiga WHDLoad package (zipped)
URL: "https://en.wikipedia.org/wiki/WHDLoad"
FileNameExtensions: ["zip"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "README.INFOU"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".SLAVE"
    CaseSensitive: false
