Name: Verity Collection Index Pending Transaction
URL: "http://fileformats.archiveteam.org/wiki/Ext:trn"
FileNameExtensions: ["trn"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "LAST LOGCHECK \""
    CaseSensitive: true
  - Pos: 18
    AsciiString: " "
    CaseSensitive: true
  - Pos: 22
    AsciiString: " "
    CaseSensitive: true
  - Pos: 25
    AsciiString: " "
    CaseSensitive: true
  - Pos: 28
    AsciiString: ":"
    CaseSensitive: true
  - Pos: 31
    AsciiString: ":"
    CaseSensitive: true
  - Pos: 34
    AsciiString: " "
    CaseSensitive: true
  - Pos: any
    AsciiString: "LAST OPTIMIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAST CLEAN"
    CaseSensitive: false
