Name: MediaZip compressed archive
Description: MediaZip is a Windows program that performs lossless compression/decompression and manages archives of media files (Sound and Picture)
URL: "http://futalgo.planetaclix.pt/mediazip/index.htm"
FileNameExtensions: ["mzf"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0MZFA"
    CaseSensitive: true
