Name: Mimio Notebook
FileNameExtensions: ["ink"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "THUMBNAIL_1.JPGPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMAGE_1.PNGPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMAGE_2.PNGPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OBJECTS.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".RTFPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IDAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IHDR"
    CaseSensitive: false
