Name: AutoCAD LT settings
URL: "https://en.wikipedia.org/wiki/AutoCAD"
FileNameExtensions: ["ini"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "[AutoCAD LT General]\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "AUTOCAD LT GRAPHICS WINDOW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTOCAD LT TEXT WINDOW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ANSIPROTOTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ANSILINETYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ISOPROTOTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ISOLINETYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOOLBARSIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WINDOWSTATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BACKGROUND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FOREGROUND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ANSIHATCH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ISOHATCH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MEASURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SUPPORT"
    CaseSensitive: false
