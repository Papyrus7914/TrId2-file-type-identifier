    AsciiString: ".DWG"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".LIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FONT"
    CaseSensitive: false
