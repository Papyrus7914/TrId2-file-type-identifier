Name: V-Ray Material (binary)
URL: "http://fileformats.archiveteam.org/wiki/V-Ray"
FileNameExtensions: ["vismat"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 3
    AsciiString: "\0\x01\0\0\0"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 13
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 15
    AsciiString: "\0"
    CaseSensitive: true
