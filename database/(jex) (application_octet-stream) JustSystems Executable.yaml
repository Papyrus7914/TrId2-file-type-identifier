Name: JustSystems Executable
URL: "https://en.wikipedia.org/wiki/JustSystems"
FileNameExtensions: ["jex"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "JSD\0\0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "KERNEL.WEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".JEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".WDL"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".WDV"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPL"
    CaseSensitive: false
