Name: Compo composition
Description: AKA Composition scriptable image editing tool for RISC OS.
URL: "http://www.compo.iconbar.com/compo.htm"
FileNameExtensions: ["cpo"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "# Composition\n# Saved:"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CANVAS BYTES_PER_PIXEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PREFERENCES AT SAVE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXPORT FILE FORMAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SQUASH COMPOSITION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BASE SCALE ON DPI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MORE VECTOR STUFF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MULTI-TASK REDRAW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPOSITION DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INTERACTIVE MOVE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CANVAS DETAILS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIRTUAL MEMORY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISPLAY UNITS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GRID OPTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VM OPTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RESERVED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WARNINGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XSPACING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "YSPACING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PALETTE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ASPECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAVED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOCK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHOW"
    CaseSensitive: false
