Name: Sweet Home 3D Furniture library
URL: "http://fileformats.archiveteam.org/wiki/Sweet_Home_3D_Furniture_Library"
FileNameExtensions: ["sh3f"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "PLUGINFURNITURECATALOG.PROPERTIESPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".MTLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".OBJPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PNGPK"
    CaseSensitive: false
