Name: HPACK compressed archive
Description: Multiplatform compressor by Peter Gutmann.
URL: "http://fileformats.archiveteam.org/wiki/HPACK_(compressed_archive)"
FileNameExtensions: ["hpk"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "HPAK"
    CaseSensitive: true
