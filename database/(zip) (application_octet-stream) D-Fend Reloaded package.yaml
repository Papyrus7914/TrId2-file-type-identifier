Name: D-Fend Reloaded package
URL: "http://dfendreloaded.sourceforge.net/"
FileNameExtensions: ["zip"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "INSTALLREADME.TXTPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INSTALLREADME.TXTM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIRTUALHD"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".CONFPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PROFPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CAPTURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".EXEPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMP"
    CaseSensitive: false
