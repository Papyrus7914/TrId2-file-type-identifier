Name: Mesen Save State
URL: "https://www.mesen.ca/"
FileNameExtensions: ["mst"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MST"
    CaseSensitive: true
  - Pos: 58
    #        x
    Bytes: [0x78, 0x01, 0xED]
  - Pos: any
    AsciiString: ".NES"
    CaseSensitive: false
