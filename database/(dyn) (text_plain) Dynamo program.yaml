Name: Dynamo program
URL: "http://dynamobim.org/"
FileNameExtensions: ["dyn"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "<Workspace Version=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "CONNECTORMODEL START"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ISUPSTREAMVISIBLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "START_INDEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONNECTORS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "END_INDEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ISVISIBLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ELEMENTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NICKNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PORTTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DYNAMO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LACING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NODES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NOTES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GUID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ZOOM"
    CaseSensitive: false
