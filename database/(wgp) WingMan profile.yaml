Name: WingMan profile
Description: Configuration file for WingMan line of programmable gaming input devices.
URL: "http://www.wingmanteam.com/profiles/profiles_mouse.htm"
FileNameExtensions: ["wgp"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "[Profile]"
    CaseSensitive: true
  - Pos: any
    AsciiString: "WFFMSETTINGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXECUTABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIGNATURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REVISION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WFFMMODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APP PATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMAND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTHOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEVICE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BRAND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
