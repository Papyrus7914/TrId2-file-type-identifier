Name: 16bit DOS Executable with 1988 MS runtime lib (generic)
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 25
    AsciiString: "\0\0\0\x01\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MS RUN-TIME LIBRARY - COPYRIGHT (C) 1988"
    CaseSensitive: false
  - Pos: any
    AsciiString: "- NOT ENOUGH SPACE FOR ENVIRONMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "- FLOATING POINT NOT LOADED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "- NULL POINTER ASSIGNMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "- INTEGER DIVIDE BY 0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "- STACK OVERFLOW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MICROSOFT CORP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RUN-TIME ERROR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "C_FILE_INFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "R6000"
    CaseSensitive: false
  - Pos: any
    AsciiString: "R6001"
    CaseSensitive: false
  - Pos: any
    AsciiString: "R6002"
    CaseSensitive: false
  - Pos: any
    AsciiString: "R6003"
    CaseSensitive: false
  - Pos: any
    AsciiString: "R6009"
    CaseSensitive: false
  - Pos: any
