Name: AutoRun Info
Description: Placed in CDs/DVDs to make autorun or set the disk's logo/label.
URL: "https://en.wikipedia.org/wiki/AutoRun"
FileNameExtensions: ["inf"]
MimeType: text/inf
DetectionPatterns:
  - Pos: 0
    AsciiString: "["
    CaseSensitive: true
  - Pos: 2
    AsciiString: "uto"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "un"
    CaseSensitive: true
  - Pos: any
    AsciiString: "AUTORUN"
    CaseSensitive: false
