Name: Picasa Windows info
URL: "https://en.wikipedia.org/wiki/Picasa"
FileNameExtensions: ["fen"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<window"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BUTTON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GROUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LABEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
