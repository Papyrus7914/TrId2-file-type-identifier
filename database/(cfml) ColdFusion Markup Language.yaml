Name: ColdFusion Markup Language
URL: "http://en.wikipedia.org/wiki/ColdFusion_Markup_Language"
FileNameExtensions: ["cfml"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<cf"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CFOUTPUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
