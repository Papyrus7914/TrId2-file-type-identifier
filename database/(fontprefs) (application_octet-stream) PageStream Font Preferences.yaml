Name: PageStream Font Preferences
URL: "https://en.wikipedia.org/wiki/PageStream"
FileNameExtensions: ["fontprefs"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "FNTPFNTP\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FNTPFNTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYFCTYFC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYFM"
    CaseSensitive: false
