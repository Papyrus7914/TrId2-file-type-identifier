Name: Workflow Petri Net Designer project
Description: WoPeD is an easy-to-use software for modelling, simulating and analyzing processes described by workflow nets.
URL: "http://woped.dhbw-karlsruhe.de/woped/"
FileNameExtensions: ["pnml"]
MimeType: text/xml
