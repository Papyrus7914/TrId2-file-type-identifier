Name: gfxboot compiled HTML Help (main)
Description: variant with first label name "main"; verified by command like `gfxboot --help-show en.hlp`
URL: "https://github.com/openSUSE/gfxboot"
FileNameExtensions: ["hlp"]
MimeType: application/x-gfxboot-hlp
DetectionPatterns:
