Name: FrameMaker Maker Markup Language
URL: "https://en.wikipedia.org/wiki/Adobe_FrameMaker"
FileNameExtensions: ["mml"]
MimeType: application/vnd.framemaker
DetectionPatterns:
  - Pos: 0
    AsciiString: "<MML"
    CaseSensitive: true
  - Pos: any
    AsciiString: "COMMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMATS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BODY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEAD"
    CaseSensitive: false
