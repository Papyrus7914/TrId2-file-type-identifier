Name: Performance music bank
Description: Amiga music software by Pregnant Badger Music.
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "BANKSHDR"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BODY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FIND"
    CaseSensitive: false
