Name: Zoner Draw (container with preview)
Description: Container with a BMP preview and the ZMF native document.
URL: "http://www.zoner.com/"
FileNameExtensions: ["zmf"]
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04, 0x14]
  - Pos: 25
    AsciiString: "\0\v\0\0\0content.zmf"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CONTENT.ZMFPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PREVIEW.BMPPK"
    CaseSensitive: false
