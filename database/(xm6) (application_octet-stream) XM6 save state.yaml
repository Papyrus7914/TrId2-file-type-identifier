Name: XM6 save state
Description: X68000 emulator for Windows.
URL: "http://retropc.net/gimons/"
FileNameExtensions: ["xm6"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "XM6 DATA "
    CaseSensitive: true
  - Pos: 10
    AsciiString: "."
    CaseSensitive: true
