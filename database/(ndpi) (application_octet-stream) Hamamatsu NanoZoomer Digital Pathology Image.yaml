Name: Hamamatsu NanoZoomer Digital Pathology Image
URL: "https://docs.openmicroscopy.org/bio-formats/6.9.0/formats/hamamatsu-ndpi.html?highlight=hamamatsu"
FileNameExtensions: ["ndpi"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "II*\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "HAMAMATSU NANOZOOMER DIGITAL PATHOLOGY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HAMAMATSU JPEG LIBRARY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NDP.SCAN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JFIF"
    CaseSensitive: false
