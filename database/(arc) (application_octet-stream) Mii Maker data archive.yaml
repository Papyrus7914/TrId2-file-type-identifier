Name: Mii Maker data archive
URL: "https://en.wikipedia.org/wiki/Mii#Mii_Maker_2"
FileNameExtensions: ["arc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SARC"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SFAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SFNT"
    CaseSensitive: false
