Name: TeamSpeak 3 Plugin
URL: "https://en.wikipedia.org/wiki/TeamSpeak"
FileNameExtensions: ["ts3_plugin"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "PACKAGE.INI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_WIN32.DLL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_WIN64.DLL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLUGINS"
    CaseSensitive: false
