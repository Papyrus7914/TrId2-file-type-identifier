Name: Fluid Entertainment Dundjinni - included Art
Description: Art included in Dundjinni which is used to create your maps, (such as an image of a trophy, or a bathtub), have the .djx extension. Miniature tokens also receive this extension.
URL: "http://www.dundjinni.com/"
FileNameExtensions: ["djx"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DJX-IMAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ELEMENTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DJX-PROP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAJOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOW-1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MINOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROOT"
    CaseSensitive: false
