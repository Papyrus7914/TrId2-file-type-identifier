Name: Radeon Software Settings Snapshot
URL: "https://en.wikipedia.org/wiki/Radeon"
FileNameExtensions: ["zip"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "RSSETTINGS.JSONPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GALLERY.BLBPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RGSTATS.DBPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GMDB.BLBPK"
    CaseSensitive: false
