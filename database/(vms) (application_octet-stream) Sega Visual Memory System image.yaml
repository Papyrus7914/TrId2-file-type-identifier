Name: Sega Visual Memory System image
URL: "https://en.wikipedia.org/wiki/VMU"
FileNameExtensions: ["vms"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "!"
    CaseSensitive: true
  - Pos: 27
    AsciiString: ")0"
    CaseSensitive: true
  - Pos: 79
    Bytes: [0xB0]
  - Pos: 308
    AsciiString: "\xB8\r!"
    CaseSensitive: true
  - Pos: 496
    AsciiString: "\xB8\r!"
    CaseSensitive: true
