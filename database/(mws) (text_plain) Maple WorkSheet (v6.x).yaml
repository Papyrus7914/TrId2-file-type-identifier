Name: Maple WorkSheet (v6.x)
URL: "https://en.wikipedia.org/wiki/Maple_(software)"
FileNameExtensions: ["mws"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "{VERSION 6 "
    CaseSensitive: true
  - Pos: any
    AsciiString: "{USTYLETAB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "{CSTYLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "{PSTYLE"
    CaseSensitive: false
