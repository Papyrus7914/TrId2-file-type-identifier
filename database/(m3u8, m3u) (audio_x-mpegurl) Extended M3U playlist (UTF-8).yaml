Name: Extended M3U playlist (UTF-8)
Description: A variation of the M3U format with Unicode support.
URL: "http://en.wikipedia.org/wiki/M3U"
FileNameExtensions: ["m3u8", "m3u"]
MimeType: audio/x-mpegurl
DetectionPatterns:
  - Pos: 0
    #                          #
    Bytes: [0xEF, 0xBB, 0xBF, 0x23]
  - Pos: any
    AsciiString: "EXTINF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTM3U"
    CaseSensitive: false
