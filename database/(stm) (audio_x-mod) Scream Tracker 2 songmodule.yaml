Name: Scream Tracker 2 song/module
URL: "https://wiki.multimedia.cx/index.php/Scream_Tracker_2_Module"
FileNameExtensions: ["stm"]
MimeType: audio/x-mod
DetectionPatterns:
  - Pos: 20
    AsciiString: "!Scream!"
    CaseSensitive: true
  - Pos: 30
    Bytes: [0x02]
  - Pos: any
    AsciiString: "SCREAM"
    CaseSensitive: false
