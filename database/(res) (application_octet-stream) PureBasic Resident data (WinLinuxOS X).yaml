Name: PureBasic Resident data (Win/Linux/OS X)
URL: "https://en.wikipedia.org/wiki/PureBasic"
FileNameExtensions: ["res"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "ERUP\0\0\0\0"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "SERTCRS"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SERTCRS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TSNC"
    CaseSensitive: false
