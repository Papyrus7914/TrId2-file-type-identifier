Name: Zero-X Color scheme
URL: "https://www.soundonsound.com/reviews/zero-x-beat-quantizer"
FileNameExtensions: ["zco"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "[Zero-X Color Scheme]"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BACKGROUND FADE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BACKGROUND FROM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BACKGROUND TO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GRID LINES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SELECTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAMPLE"
    CaseSensitive: false
