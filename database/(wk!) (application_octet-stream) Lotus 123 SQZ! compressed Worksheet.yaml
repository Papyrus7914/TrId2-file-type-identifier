Name: Lotus 123 SQZ! compressed Worksheet
Description: SQZ! is an add-on to compress/decompress worksheets.
FileNameExtensions: ["wk!"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Z"
    CaseSensitive: true
  - Pos: 13
    AsciiString: "\r\nZ"
    CaseSensitive: true
  - Pos: any
    AsciiString: "***** END OF SQZ"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ZAPPTR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SFTSP"
    CaseSensitive: false
