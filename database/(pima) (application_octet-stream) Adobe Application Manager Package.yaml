Name: Adobe Application Manager Package
FileNameExtensions: ["pima"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04, 0x14]
  - Pos: 30
    AsciiString: "Adobe"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CUSTOMHOOK.EXE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ADOBE"
    CaseSensitive: false
