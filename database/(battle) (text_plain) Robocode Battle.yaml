Name: Robocode Battle
URL: "http://robocode.sourceforge.net/"
FileNameExtensions: ["battle"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "#Battle Properties"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ROBOCODE.BATTLE.RULES.INACTIVITYTIME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROBOCODE.BATTLE.GUNCOOLINGRATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROBOCODE.BATTLE.SELECTEDROBOTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROBOCODE.BATTLEFIELD.HEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROBOCODE.BATTLEFIELD.WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROBOCODE.BATTLE.NUMROUNDS"
    CaseSensitive: false
