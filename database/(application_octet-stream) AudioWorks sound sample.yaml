Name: AudioWorks sound sample
Description: Acord Archimedes sound editor.
URL: "http://www.cconcepts.co.uk/products/audiow.htm"
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xC5, 0xC6, 0xCB, 0xC3]
