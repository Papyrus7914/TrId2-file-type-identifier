Name: Total Annihilation game data
URL: "http://fileformats.archiveteam.org/wiki/GAF_(Total_Annihilation)"
FileNameExtensions: ["gaf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x00, 0x01, 0x01, 0x00]
  - Pos: 5
    AsciiString: "\0\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 15
    AsciiString: "\0"
    CaseSensitive: true
