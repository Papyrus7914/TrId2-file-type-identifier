Name: Hangul Draw 96 data
URL: "https://en.wikipedia.org/wiki/Hangul_(word_processor)"
FileNameExtensions: ["hdr"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "HDraw96 Data File\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LAYER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGE"
    CaseSensitive: false
