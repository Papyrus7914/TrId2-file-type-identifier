Name: Doodle-mation Doodle (v1.x)
URL: "https://archive.org/details/doodle-mation_1993_screenmagic"
FileNameExtensions: ["doo"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "<<< Doodle File, ver. 1."
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOODLE FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SETTINGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PALETTE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WINDOW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VER."
    CaseSensitive: false
