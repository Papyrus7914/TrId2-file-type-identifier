Name: MSBuild-compatible Nemerle Project (UTF-8)
URL: "https://en.wikipedia.org/wiki/Nemerle"
FileNameExtensions: ["nproj"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    #                          <
    Bytes: [0xEF, 0xBB, 0xBF, 0x3C]
  - Pos: any
    AsciiString: "SCHEMAS.MICROSOFT.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULTTARGETS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMPORT PROJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERTYGROUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECTGUID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$(NEMERLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONDITION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEVELOPER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ITEMGROUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NEMERLE."
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INCLUDE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MSBUILD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FOLDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "2003"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH"
    CaseSensitive: false
