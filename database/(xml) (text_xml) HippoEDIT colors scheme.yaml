Name: HippoEDIT colors scheme
URL: "https://www.hippoedit.com"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"utf-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "XML-STYLESHEET TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLCONFIGSETTINGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILEINFO AUTHOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HIPPOEDIT.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PALETTE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR.XSLT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INDEX NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HREF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
