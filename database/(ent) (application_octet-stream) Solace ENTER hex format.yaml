Name: Solace ENTER hex format
URL: "https://www.sol20.org"
FileNameExtensions: ["ent"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "ENTER "
    CaseSensitive: true
  - Pos: 10
    AsciiString: "\r\n"
    CaseSensitive: true
  - Pos: 16
    AsciiString: ": "
    CaseSensitive: true
