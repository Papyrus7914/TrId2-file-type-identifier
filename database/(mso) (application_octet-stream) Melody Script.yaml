Name: Melody Script
URL: "https://www.mobygames.com/company/16112/melody/"
FileNameExtensions: ["mso"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MOBJ\x05\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BASIC."
    CaseSensitive: false
  - Pos: any
    AsciiString: ".MGO"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".MSO"
    CaseSensitive: false
