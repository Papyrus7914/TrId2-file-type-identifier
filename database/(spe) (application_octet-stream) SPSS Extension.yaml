Name: SPSS Extension
URL: "https://en.wikipedia.org/wiki/SPSS"
FileNameExtensions: ["spe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: ".PROPERTIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MANIFEST.MF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MESSAGES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "META-INF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYNTAX"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LANG"
    CaseSensitive: false
