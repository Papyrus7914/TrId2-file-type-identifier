    AsciiString: "CERTIFICATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LASTUPDATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SERIAL BOX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ZIPLENGTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REVISION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GREETING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
