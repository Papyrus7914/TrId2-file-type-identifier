Name: PiST Project
URL: "https://github.com/idontwantyourspamthanks/PiST"
FileNameExtensions: ["pistproject"]
MimeType: text/json
DetectionPatterns:
  - Pos: 0
    AsciiString: "{"
    CaseSensitive: true
  - Pos: any
    AsciiString: "HARDDISKIMAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FLOPPYIMAGES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FASTFORWARD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HATARIPATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MEMSIZEMIB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EMULATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MACHINE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MONITOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOSPATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
