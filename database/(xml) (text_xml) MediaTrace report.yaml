Name: MediaTrace report
URL: "https://mediaarea.net/MediaTrace"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CREATINGLIBRARY VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MEDIATRACE_0_1.XSD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLSCHEMA-INSTANCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MEDIATRACE HTTPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCHEMALOCATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MEDIAAREA.NET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BLOCK OFFSET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MEDIAINFOLIB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA OFFSET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.W3.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIZE"
    CaseSensitive: false
