    AsciiString: "DOCTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PACKAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CANVAS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLORS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "C_PARA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PREFIX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MENT~"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NONE~"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHAPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIDTH"
    CaseSensitive: false
