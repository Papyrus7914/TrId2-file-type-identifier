Name: Photogenics Graphics Input/Output module
Description: Amiga image manipulation tool.
URL: "https://en.wikipedia.org/wiki/Photogenics"
FileNameExtensions: ["gio"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x00, 0x00, 0x03, 0xF3]
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "*_NU"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".GIO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "P\0NU"
    CaseSensitive: false
