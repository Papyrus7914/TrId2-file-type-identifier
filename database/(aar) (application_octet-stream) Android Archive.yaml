Name: Android Archive
URL: "https://en.wikipedia.org/wiki/Android_(operating_system)"
FileNameExtensions: ["aar"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "ANDROIDMANIFEST.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUES.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLASSES.JAR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "R.TXTPK"
    CaseSensitive: false
