Name: Java HotSpot JVM performance data (hsperfdata)
URL: "https://en.wikipedia.org/wiki/HotSpot"
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xCA, 0xFE, 0xC0, 0xC0, 0x01, 0x02, 0x00]
  - Pos: any
    AsciiString: "JAVA.CLS.LOADEDCLASSES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JAVA.THREADS.LIVE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SUN.RT."
    CaseSensitive: false
