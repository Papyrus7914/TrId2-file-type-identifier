Name: Wise Installer log
URL: "http://www.wisesolutions.com"
FileNameExtensions: ["log"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "***  Installation Started "
    CaseSensitive: true
  - Pos: any
    AsciiString: "INSTALLATION STARTED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNINSTALLSTRING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CURRENTVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISPLAYNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INSTALL.LOG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REGDB ROOT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHELL LINK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REGDB NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REGDB KEY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE COPY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REGDB VAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MICROSOFT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOFTWARE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MADE DIR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WINDOWS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNWISE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOURCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
