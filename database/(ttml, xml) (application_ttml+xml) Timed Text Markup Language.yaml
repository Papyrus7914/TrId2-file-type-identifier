Name: Timed Text Markup Language
URL: "https://en.wikipedia.org/wiki/Timed_Text_Markup_Language"
FileNameExtensions: ["ttml", "xml"]
MimeType: application/ttml+xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "WWW.W3.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STYLING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BEGIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BODY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
