Name: WavPack compressed audio
URL: "https://en.wikipedia.org/wiki/WavPack"
FileNameExtensions: ["wv"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "wvpk"
    CaseSensitive: true
  - Pos: 34
    AsciiString: "RIFF"
    CaseSensitive: true
  - Pos: 42
    AsciiString: "WAVEfmt"
    CaseSensitive: true
  - Pos: any
    AsciiString: "WAVEFMT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RIFF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WVPK"
    CaseSensitive: false
