Name: Dice C project (v3)
URL: "http://legacy.obviously.com/dice/"
FileNameExtensions: ["dice"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "PROJECT="
    CaseSensitive: true
  - Pos: any
    AsciiString: "AUTOMATICALLY GENERATED - DO NOT EDIT BELOW THIS LINE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$(PCOMPFILE)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$(PROJECT)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$(CFLAGS)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$(EXEDIR)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$(PRECOMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$(PROTOS)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPFLAGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DMAKEFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PDEFAULT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$(OBJS)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLIARGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$(EXE)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$(SRCS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTRAS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$(OD)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAKEP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$VER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HDRS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
