Name: reFX NEXUS Skin
URL: "http://refx.com"
FileNameExtensions: ["nsk"]
DetectionPatterns:
  - Pos: 0
    AsciiString: ">\"hw\xC8\xD2"
    CaseSensitive: true
  - Pos: 7
    Bytes: [0xE6, 0xB1, 0xA5]
  - Pos: 19
    AsciiString: "6\xCD-"
    CaseSensitive: true
  - Pos: 23
    #        l           Z
    Bytes: [0x6C, 0x9A, 0x5A, 0xD6, 0xDB]
  - Pos: 29
    Bytes: [0xB5, 0xFA, 0xD8, 0x05, 0x04, 0x01, 0x1D, 0xFC, 0xAE, 0x8B, 0xB0]
  - Pos: any
    AsciiString: "4KSN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IKSN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NIKS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SNIK"
    CaseSensitive: false
