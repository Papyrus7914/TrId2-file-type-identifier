Name: Virtual Vector Configuration
URL: "http://sensi.org/~svo/virtualvector/"
FileNameExtensions: ["con"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "CON2\0"
    CaseSensitive: true
  - Pos: 33
    AsciiString: "0123456789\xBA\xBB\xBC\xBD\xBE\xBF\xDEABCDEFGHIJKLMNOPQRSTUVWXYZ"
    CaseSensitive: true
