Name: PointCab QDIM elevation map
URL: "https://www.pointcab-software.com/"
FileNameExtensions: ["qdim"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MIDQ"
    CaseSensitive: true
  - Pos: any
    AsciiString: "IDATX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IHDR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MICQ"
    CaseSensitive: false
