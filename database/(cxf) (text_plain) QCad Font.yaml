Name: QCad Font
URL: "https://en.wikipedia.org/wiki/QCad"
FileNameExtensions: ["cxf"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "# Format:      "
    CaseSensitive: true
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMAT"
    CaseSensitive: false
