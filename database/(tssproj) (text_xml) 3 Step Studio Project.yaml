Name: 3 Step Studio Project
URL: "https://www.kickstarter.com/projects/garagegames/3-step-studio"
FileNameExtensions: ["tssproj"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<ScriptObject"
    CaseSensitive: true
  - Pos: any
    AsciiString: "{PHYSICSLAUNCHER}"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEMPLATEMODULE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "3 STEP STUDIO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LASTMODIFIED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCRIPTOBJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOURCEMODULE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECTNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "{USERGAME}"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
