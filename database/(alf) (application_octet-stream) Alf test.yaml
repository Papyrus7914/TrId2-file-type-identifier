Name: Alf test
URL: "https://programalf.com"
FileNameExtensions: ["alf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "TEST.ALFSD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_OBRAZOK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".JPGSD"
    CaseSensitive: false
