    AsciiString: "THEMAP\0\0THEMAP\0\0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BLOCKBLOCKBLOCK("
    CaseSensitive: false
  - Pos: any
    AsciiString: "SF01\0\0\0\0UNUSED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAN_AND\0H"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BLOCKX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PSIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TICK"
    CaseSensitive: false
