Name: MapInfo Workspace
URL: "http://www.mapinfo.com/"
FileNameExtensions: ["wor"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "!"
    CaseSensitive: true
  - Pos: 2
    AsciiString: "orkspace"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FONT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WORKSPACE"
    CaseSensitive: false
