Name: Juggling Markup Language
URL: "https://jugglinglab.org/html/jml.html"
FileNameExtensions: ["jml"]
MimeType: application/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOCTYPE JML SYSTEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NOTATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATTERN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".DTD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
