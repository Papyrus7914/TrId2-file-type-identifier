Name: Sony digital camera RAW image
URL: "http://en.wikipedia.org/wiki/Raw_image_format"
FileNameExtensions: ["arw", "sr2"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "II*\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CDEFGHIJSTUVWXYZCDEFGHIJSTUVWXY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "*456789"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SONY"
    CaseSensitive: false
