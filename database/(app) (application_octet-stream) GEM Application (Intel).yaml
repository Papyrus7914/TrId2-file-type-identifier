Name: GEM Application (Intel)
URL: "https://en.wikipedia.org/wiki/Graphics_Environment_Manager#Intel_versions"
FileNameExtensions: ["app"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GEMAES"
    CaseSensitive: false
