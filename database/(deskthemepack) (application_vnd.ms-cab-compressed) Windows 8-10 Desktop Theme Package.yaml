Name: Windows 8-10 Desktop Theme Package
Description: CABinet with LZX:21 compression, ID 0, panoram{as,ic}.theme and panorama JPEG image only suited for Windows 8-10.
URL: "http://www.drewkeller.com/content/using-theme-both-windows-7-and-windows-8"
FileNameExtensions: ["deskthemepack"]
MimeType: application/vnd.ms-cab-compressed
DetectionPatterns:
  - Pos: 0
    AsciiString: "MSCF\0\0\0\0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "\0\0\0\0"
    CaseSensitive: true
  - Pos: 20
    AsciiString: "\0\0\0\0\x03\x01"
    CaseSensitive: true
  - Pos: 30
    AsciiString: "\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 42
    Bytes: [0x03, 0x15]
  - Pos: any
    AsciiString: "DESKTOPBACKGROUND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PANORAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".THEME"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".JPG"
    CaseSensitive: false
