Name: Flipper Zero LF RFID key
URL: "https://en.wikipedia.org/wiki/Flipper_Zero"
FileNameExtensions: ["rfid"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "Filetype: Flipper RFID key"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FILETYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KEY TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
