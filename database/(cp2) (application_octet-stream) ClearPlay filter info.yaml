Name: ClearPlay filter info
URL: "https://web.clearplay.com/"
FileNameExtensions: ["cp2"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x01\0S\0\0\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "CLEARPLAY"
    CaseSensitive: true
  - Pos: 38
    AsciiString: "Copyright ClearPlay Inc. All Rights Reserved\0\x10\0$\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "COPYRIGHT CLEARPLAY INC. ALL RIGHTS RESERVED"
    CaseSensitive: false
