Name: Gnome Keyring Store
URL: "http://en.wikipedia.org/wiki/GNOME_Keyring"
FileNameExtensions: ["keystore"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "Gnome Keyring Store 2\n\r"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SHA256"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IDX2"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PUB2"
    CaseSensitive: false
