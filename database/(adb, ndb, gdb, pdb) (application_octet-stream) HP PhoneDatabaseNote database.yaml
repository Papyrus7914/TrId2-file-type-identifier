Name: HP Phone/Database/Note database
Description: Suite of applications for the HP LX palmtops.
URL: "https://en.wikipedia.org/wiki/HP_200LX"
FileNameExtensions: ["adb", "ndb", "gdb", "pdb"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "hcD\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ALL FIELDS"
    CaseSensitive: false
