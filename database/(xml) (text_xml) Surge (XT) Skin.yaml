Name: Surge (XT) Skin
URL: "https://surge-synthesizer.github.io/"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SURGE-SYNTH-TEAM.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPONENT-CLASSES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SURGE SYNTH TEAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SURGE-SKIN NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTHORURL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTROLS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GLOBALS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTPS"
    CaseSensitive: false
