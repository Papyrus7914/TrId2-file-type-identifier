Name: ConceptDraw Project document (Zipped)
URL: "http://en.wikipedia.org/wiki/ConceptDraw_Project"
FileNameExtensions: ["cdpz"]
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "CDDocument.xmlUT"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CDDOCUMENT.XMLUT"
    CaseSensitive: false
