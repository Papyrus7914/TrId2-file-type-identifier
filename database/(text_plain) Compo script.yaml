Name: Compo script
Description: AKA Composition scriptable image editing tool for RISC OS.
URL: "http://www.compo.iconbar.com/compo.htm"
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "#"
    CaseSensitive: true
  - Pos: any
    AsciiString: "COMPOSCRIPT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFPROC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENDPROC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SELECT"
    CaseSensitive: false
