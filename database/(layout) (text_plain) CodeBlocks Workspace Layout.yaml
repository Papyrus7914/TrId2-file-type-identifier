Name: Code::Blocks Workspace Layout
URL: "http://en.wikipedia.org/wiki/Code::Blocks"
FileNameExtensions: ["layout"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "CODEBLOCKS_LAYOUT_FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POSITION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOPLINE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CURSOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPEN"
    CaseSensitive: false
