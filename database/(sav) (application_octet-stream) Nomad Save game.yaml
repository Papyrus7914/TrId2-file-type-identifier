Name: Nomad Save game
Description: DOS space sim by Papyrus Design Group.
FileNameExtensions: ["sav"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        \a          n     (
    Bytes: [0x07, 0x01, 0x6E, 0x28, 0xA5, 0x02]
  - Pos: 12
    AsciiString: "\0\0\0ESS "
    CaseSensitive: true
