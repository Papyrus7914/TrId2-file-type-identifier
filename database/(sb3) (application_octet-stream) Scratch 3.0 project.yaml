Name: Scratch 3.0 project
URL: "https://en.wikipedia.org/wiki/Scratch_(programming_language)"
FileNameExtensions: ["sb3"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "project.json"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PROJECT.JSONPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".SVGPK"
    CaseSensitive: false
