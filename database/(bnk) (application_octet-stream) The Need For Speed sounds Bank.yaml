Name: The Need For Speed sounds Bank
URL: "https://en.wikipedia.org/wiki/The_Need_for_Speed"
FileNameExtensions: ["bnk"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 552
    AsciiString: "EACS"
    CaseSensitive: true
  - Pos: any
    AsciiString: "EACS"
    CaseSensitive: false
