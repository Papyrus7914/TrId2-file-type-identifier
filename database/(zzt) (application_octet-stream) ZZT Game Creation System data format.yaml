Name: ZZT Game Creation System data format
URL: "http://fileformats.archiveteam.org/wiki/ZZT"
FileNameExtensions: ["zzt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xFF, 0xFF]
  - Pos: 3
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "\0\0\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 18
    AsciiString: "\0\0\0\0\0\0\0"
    CaseSensitive: true
