Name: CADIF format (v6)
URL: "https://en.wikipedia.org/wiki/EDIF"
FileNameExtensions: ["paf"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "(cadif\r\n (format CADIF 6 "
    CaseSensitive: true
  - Pos: any
    AsciiString: "(FORMAT CADIF 6"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(DESIGN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(CADIF"
    CaseSensitive: false
