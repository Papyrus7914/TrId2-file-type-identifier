Name: Visual Basic Form (v2.x)
URL: "https://en.wikipedia.org/wiki/Visual_Basic"
FileNameExtensions: ["frm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #                    +
    Bytes: [0xFF, 0xCC, 0x2B]
  - Pos: 7
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FORM"
    CaseSensitive: false
