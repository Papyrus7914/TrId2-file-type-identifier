Name: NextDAW project
URL: "http://nextdaw.biasillo.com/"
FileNameExtensions: ["daw"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "NextDAW "
    CaseSensitive: true
  - Pos: any
    AsciiString: "PATCH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRJS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRAC"
    CaseSensitive: false
