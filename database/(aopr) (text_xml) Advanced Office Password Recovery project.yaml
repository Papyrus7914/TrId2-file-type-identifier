Name: Advanced Office Password Recovery project
URL: "https://www.elcomsoft.it/aopr.html"
FileNameExtensions: ["aopr"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xEF\xBB\xBF<?xml version=\"1.0\" encoding=\"utf-8\"?>\r\n<AOPR_Project>\r\n\t<FileName>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SMARTATTACKPARAMS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AOPR_PROJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPLICATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCTYPE"
    CaseSensitive: false
