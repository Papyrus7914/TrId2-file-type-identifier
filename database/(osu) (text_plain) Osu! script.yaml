Name: Osu! script
Description: Human-readable file format containing information about a single beatmap.
URL: "http://en.wikipedia.org/wiki/Osu!"
FileNameExtensions: ["osu"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "osu file format v"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BACKGROUND COLOUR TRANSFORMATIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STORYBOARD LAYER 0 (BACKGROUND)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STORYBOARD LAYER 3 (FOREGROUND)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BACKGROUND AND VIDEO EVENTS"
    CaseSensitive: false
