    AsciiString: "SCHEMA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HASH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIGN"
    CaseSensitive: false
