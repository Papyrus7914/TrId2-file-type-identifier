Name: Compo filters
Description: AKA Composition scriptable image editing tool for RISC OS.
URL: "http://www.compo.iconbar.com/compo.htm"
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "Name:\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIZE"
    CaseSensitive: false
