Name: Vue D'Esprit 4 Atmosphere Preset
Description: Describes sky, clouds, weather conditions etc. for use in Vue D'Esprit 4 projects.
URL: "http://www.e-onsoftware.com"
FileNameExtensions: ["atm"]
DetectionPatterns:
  - Pos: 12
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ESPRIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VUE D"
    CaseSensitive: false
