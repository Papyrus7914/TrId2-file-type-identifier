Name: Chief Architect symbol Library (compressed )
URL: "https://en.wikipedia.org/wiki/Chief_Architect_Software"
FileNameExtensions: ["calibz"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: ".CALIBPK"
    CaseSensitive: false
