Name: gretl Data
Description: gretl native XML data format.
URL: "http://gretl.sourceforge.net/"
FileNameExtensions: ["gdt"]
MimeType: application/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOCTYPE GRETLDATA SYSTEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OBSERVATIONS COUNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VARIABLES COUNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GRETLDATA.DTD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VARIABLE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FREQUENCY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STARTOBS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENDOBS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LABELS"
    CaseSensitive: false
