Name: The Surge saved game
URL: "https://www.mobygames.com/game/88713/the-surge/"
FileNameExtensions: ["sav"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #                    Z     S
    Bytes: [0xFF, 0xB2, 0x5A, 0x53]
  - Pos: 8
    AsciiString: "L\0\0\0"
    CaseSensitive: true
  - Pos: 99
    AsciiString: "\0x\x9C"
    CaseSensitive: true
