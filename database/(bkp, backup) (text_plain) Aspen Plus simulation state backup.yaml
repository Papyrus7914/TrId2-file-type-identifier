    AsciiString: "--THIS IS THE CURRENT STATE OF ECONOMICS ANALYSIS DASHBOARD--"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ASPENTECH.ACTIVATIONDASHBOARD.ECONOMICANALYSIS.DASHBOARDITEM"
    CaseSensitive: false
