Name: PTab workbook (v3.x)
URL: "http://www.z4soft.com/ptab-spreadsheet"
FileNameExtensions: ["pt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x01\0\b\0\x03\0\x03\0\x03\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "D\0-\0M\0M\0M\0-\0Y\0Y"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%\0\0\0-\0\0\0%"
    CaseSensitive: false
  - Pos: any
    AsciiString: "M\0M\0 \0T\0T"
    CaseSensitive: false
  - Pos: any
    AsciiString: "S\0S\0 \0T\0T"
    CaseSensitive: false
