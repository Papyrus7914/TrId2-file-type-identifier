Name: Windows Printer Description (PostScript)
Description: Used by Windows 2.x-3.x.
FileNameExtensions: ["wpd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x12\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "POSTSCRIPT\0COURIER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POSTSCRIPT\0S"
    CaseSensitive: false
