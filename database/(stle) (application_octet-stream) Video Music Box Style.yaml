    CaseSensitive: true
  - Pos: 8
    AsciiString: "STLESTHD"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NTCK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHORDS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RHYTHM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PPHD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PTHD"
    CaseSensitive: false
