Name: Renderware TeXture Dictionary
URL: "https://wiki.multimedia.cx/index.php/TXD"
FileNameExtensions: ["txd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x16\0\0\0"
    CaseSensitive: true
  - Pos: 7
    Bytes: [0x00, 0xFF, 0xFF, 0x03]
  - Pos: 12
    AsciiString: "\x01\0\0\0\x04\0\0\0\xFF\xFF\x03"
    CaseSensitive: true
