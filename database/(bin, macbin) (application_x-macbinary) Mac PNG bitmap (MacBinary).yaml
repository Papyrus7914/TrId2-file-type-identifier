Name: Mac PNG bitmap (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/Portable_Network_Graphics"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "PNGF"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PNGF"
    CaseSensitive: false
