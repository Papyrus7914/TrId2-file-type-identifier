Name: WorldMachine document
URL: "http://www.world-machine.com"
FileNameExtensions: ["tmd"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "SPRWorld"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DISTORTION DIRECTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISTORTION AMOUNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISTORTION ENABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPRWORLD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OFFSET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCALE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STYLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPRK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GAIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUTP"
    CaseSensitive: false
