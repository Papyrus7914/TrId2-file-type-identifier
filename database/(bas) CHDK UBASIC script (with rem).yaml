Name: CHDK UBASIC script (with rem)
URL: "http://chdk.wikia.com/wiki/CHDK"
FileNameExtensions: ["bas"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "rem "
    CaseSensitive: true
  - Pos: any
    AsciiString: "PRINT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHOOT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THEN"
    CaseSensitive: false
