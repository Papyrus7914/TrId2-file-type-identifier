Name: WINDEV internal analysis
Description: WINDEV is a RAD tool by PC Soft.
URL: "https://windev.com"
FileNameExtensions: ["mdf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x02, 0x06, 0x00, 0x00, 0xFF, 0xFE, 0xFF]
  - Pos: 9
    AsciiString: "\0:\0\\\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "P\0R\0O\0J\0E\0C\0T\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".\0A\0N\0A"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".\0W\0D\0D"
    CaseSensitive: false
