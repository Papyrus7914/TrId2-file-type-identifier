Name: Palm Quicksheet
Description: QuickSheet is a powerful spreadsheet application for Palm OS devices.
URL: "http://www.quickoffice.com/palmos/quicksheet.html"
FileNameExtensions: ["pdb"]
DetectionPatterns:
  - Pos: 60
    AsciiString: "DataSprd"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DATASPRD"
    CaseSensitive: false
