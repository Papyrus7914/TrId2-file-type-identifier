Name: P-Screen COM Screen
URL: "http://fileformats.archiveteam.org/wiki/P-Screen_COM_Screen"
FileNameExtensions: ["com"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #              =
    Bytes: [0xEB, 0x3D, 0x90]
  - Pos: 5
    AsciiString: "P\0\0"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "Pro~Formance Screen Design  \x1A        P-Screen  Com \r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PRO~FORMANCE SCREEN DESIGN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "P-SCREEN  COM"
    CaseSensitive: false
