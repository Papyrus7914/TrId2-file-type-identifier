Name: Image Packaging System Manifest
URL: "http://fileformats.archiveteam.org/wiki/IPS_manifest"
FileNameExtensions: ["p5m"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "set name=pkg."
    CaseSensitive: true
  - Pos: any
    AsciiString: "PKG.SUMMARY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REQUIRE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEPEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
