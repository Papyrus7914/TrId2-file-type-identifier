Name: Mac JPEG 2000 bitmap (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/JPEG_2000"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "jp2_"
    CaseSensitive: true
  - Pos: any
    AsciiString: "JP2_"
    CaseSensitive: false
