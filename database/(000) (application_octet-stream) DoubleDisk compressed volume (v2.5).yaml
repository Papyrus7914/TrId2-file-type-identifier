Name: DoubleDisk compressed volume (v2.5)
Description: Usually the file is named DBLDISK.000
URL: "https://en.wikipedia.org/wiki/Disk_compression#DoubleDisk"
FileNameExtensions: ["000"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xEBn\x90IBML2.5 "
    CaseSensitive: true
