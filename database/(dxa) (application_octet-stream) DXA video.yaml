Name: DXA video
URL: "https://wiki.multimedia.cx/index.php?title=DXA"
FileNameExtensions: ["dxa"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "DEXA"
    CaseSensitive: true
  - Pos: 15
    AsciiString: "WAVE"
    CaseSensitive: true
  - Pos: 23
    AsciiString: "RIFF"
    CaseSensitive: true
  - Pos: 31
    AsciiString: "WAVEfmt "
    CaseSensitive: true
