Name: WorldWide Telescope collection
URL: "https://en.wikipedia.org/wiki/WorldWide_Telescope"
FileNameExtensions: ["wtml"]
MimeType: application/x-wtml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version="
    CaseSensitive: true
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THUMBNAIL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FOLDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLANET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEARCH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GROUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
