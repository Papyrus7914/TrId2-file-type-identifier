Name: Rob Hubbard chiptune
URL: "http://www.exotica.org.uk/wiki/Rob_Hubbard_(format)"
FileNameExtensions: ["rh"]
MimeType: audio/x-mod
DetectionPatterns:
  - Pos: 0
    AsciiString: "`\0\0"
    CaseSensitive: true
  - Pos: 4
    AsciiString: "`\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "`\0\0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "`\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PNUA"
    CaseSensitive: false
