Name: Scrivener Template
URL: "https://en.wikipedia.org/wiki/Scrivener_(software)"
FileNameExtensions: ["scrivtemplate"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<ScrivenerTemplate Version=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "PROJECTZIPDATA TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INCLUDESTYLES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMAGENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CATEGORY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BASE64"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
