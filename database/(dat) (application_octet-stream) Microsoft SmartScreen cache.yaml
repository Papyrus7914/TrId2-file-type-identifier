Name: Microsoft SmartScreen cache
URL: "https://learn.microsoft.com/en-us/windows/security/operating-system-security/virus-and-threat-protection/microsoft-defender-smartscreen/"
FileNameExtensions: ["dat"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        0           r     J     \f          6     M           h           3
    Bytes: [0x30, 0xF4, 0x72, 0x4A, 0x0C, 0xB4, 0x36, 0x4D, 0xA0, 0x68, 0xCE, 0x33, 0xAD, 0xA5, 0xAD, 0xF9]
