Name: GLB game data archive
Description: Used in the game Galactix.
URL: "http://www.shikadi.net/moddingwiki/GLB_Format_(Galactix)"
FileNameExtensions: ["glb"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 4
    AsciiString: "GLIB FILE\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GLIB FILE"
    CaseSensitive: false
