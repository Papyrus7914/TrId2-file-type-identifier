Name: Digital Anvil Texture library
URL: "https://www.mobygames.com/company/1385/digital-anvil-inc/"
FileNameExtensions: ["txm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "UTF \x01\x01\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TEXTURE LIBRARY"
    CaseSensitive: false
