Name: NGE_Nibbles level
URL: "https://nge.sourceforge.net/"
FileNameExtensions: ["scp"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "Level.Title Level_"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LEVEL.BLOCKNUM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LEVEL.FOODNUM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WORM.START"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GRAPE.SPR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE ART"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BLOCK 0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FOOD 0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIDTH"
    CaseSensitive: false
