Name: Bitwig Studio Extension
URL: "https://www.bitwig.com/"
FileNameExtensions: ["bwextension"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "META-INF/"
    CaseSensitive: true
  - Pos: any
    AsciiString: "COM.BITWIG.EXTENSION.EXTENSIONDEFINITIONPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MANIFEST.MFPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTROLLER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ER.CLASSPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARAMETER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "META-INF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SERVICES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEVICE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRACK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LK-."
    CaseSensitive: false
  - Pos: any
    AsciiString: "MLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODE"
    CaseSensitive: false
