Name: ReproZip (GZipped)
URL: "https://www.reprozip.org/"
FileNameExtensions: ["rpz"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #                    \b    \b
    Bytes: [0x1F, 0x8B, 0x08, 0x08]
  - Pos: 8
    Bytes: [0x02, 0xFF]
  - Pos: any
    AsciiString: ".RPZ"
    CaseSensitive: false
