Name: XML Shareable Playlist Format
Description: XSPF is an XML-based playlist format for digital media.
URL: "http://en.wikipedia.org/wiki/Xspf"
FileNameExtensions: ["xspf"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TRACKLIST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOCATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLAYLIST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
