Name: XML Forms Data Format
URL: "http://fileformats.archiveteam.org/wiki/XFDF"
FileNameExtensions: ["xfdf"]
MimeType: application/vnd.adobe.xfdf
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "NS.ADOBE.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XFDF XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PDF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HREF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
