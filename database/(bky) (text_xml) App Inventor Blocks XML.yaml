Name: App Inventor Blocks XML
URL: "https://en.wikipedia.org/wiki/App_Inventor_for_Android"
FileNameExtensions: ["bky"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<xml"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BLOCK TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INLINE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FALSE"
    CaseSensitive: false
