Name: ExeLITE compressed 16bit DOS executable
Description: EXE compressor by Patryk E. Glowacz e Adam Augustyn.
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 18
    AsciiString: "\0\0\0\0\0\0\0\0ELITE\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ELITE"
    CaseSensitive: false
