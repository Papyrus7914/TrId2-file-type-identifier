Name: Delta RPM Package
URL: "http://en.wikipedia.org/wiki/RPM_Package_Manager"
FileNameExtensions: ["drpm"]
DetectionPatterns:
  - Pos: 0
    Bytes: [0xED, 0xAB, 0xEE, 0xDB, 0x03, 0x00, 0x00, 0x00, 0x00]
  - Pos: any
    AsciiString: "ROOT\0ROOT\0ROOT\0ROOT\0ROOT\0ROOT\0ROOT\0ROOT\0ROOT\0ROOT\0ROOT\0ROOT\0ROOT\0ROOT\0ROOT\0ROOT\0ROOT\0ROOT\0ROOT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RPMLIB(PAYLOADFILESHAVEPREFIX)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RPMLIB(COMPRESSEDFILENAMES)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RPMLIB(PAYLOADIS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ")\0RPMLIB("
    CaseSensitive: false
  - Pos: any
    AsciiString: "MESSAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SRC.RPM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PACKAG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOURCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ECTOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INTER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REMOV"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHARE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-TAB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DRPM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HANG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SERV"
    CaseSensitive: false
