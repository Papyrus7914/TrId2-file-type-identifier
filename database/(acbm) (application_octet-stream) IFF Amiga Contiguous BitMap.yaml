Name: IFF Amiga Contiguous BitMap
URL: "http://wiki.amigaos.net/wiki/ACBM_IFF_Amiga_Continuous_Bitmap"
FileNameExtensions: ["acbm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "ACBM"
    CaseSensitive: true
