Name: ABC SnapGraphics Palette
URL: "https://en.wikipedia.org/wiki/Micrografx"
FileNameExtensions: ["sgp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\x1D\0GF*\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SHAPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".SGP"
    CaseSensitive: false
