    AsciiString: "<?xml version='1.0' encoding='UTF-8'?>"
    CaseSensitive: true
  - Pos: 42
    AsciiString: "-"
    CaseSensitive: true
  - Pos: 60
    AsciiString: "t"
    CaseSensitive: true
  - Pos: 72
    AsciiString: "-"
    CaseSensitive: true
  - Pos: any
    AsciiString: "-- SCHEMA FILE WRITTEN BY PDE --"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCHEMA TARGETNAMESPACE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "META.SCHEMA PLUGIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "META.SECTION TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ATTRIBUTE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "META.ATTRIBUTE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCUMENTATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ELEMENT NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPLEXTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ELEMENT REF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ANNOTATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTENSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REQUIRED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPINFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POINT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SINCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
