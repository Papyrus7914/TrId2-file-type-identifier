Name: KaWeeR words Library
Description: Crossword puzzle editor for Atari ST, by Volker Hemsen.
FileNameExtensions: ["lib"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "#KaWeeR-Library, Version "
    CaseSensitive: true
  - Pos: 26
    AsciiString: "."
    CaseSensitive: true
