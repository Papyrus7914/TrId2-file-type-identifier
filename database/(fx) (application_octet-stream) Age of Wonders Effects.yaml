Name: Age of Wonders Effects
URL: "https://en.wikipedia.org/wiki/Age_of_Wonders_(series)"
FileNameExtensions: ["fx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x01, 0x00, 0x00, 0x01, 0x01, 0x00]
  - Pos: 8
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "IMAGES"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".ILB"
    CaseSensitive: false
