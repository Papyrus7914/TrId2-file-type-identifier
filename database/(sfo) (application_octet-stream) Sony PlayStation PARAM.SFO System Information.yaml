Name: Sony PlayStation PARAM.SFO System Information
URL: "http://fileformats.archiveteam.org/wiki/SFO"
FileNameExtensions: ["sfo"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0PSF\x01"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CATEGORY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
