    AsciiString: "SETTINGS.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENT.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STYLES.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THUMBNAILS"
    CaseSensitive: false
