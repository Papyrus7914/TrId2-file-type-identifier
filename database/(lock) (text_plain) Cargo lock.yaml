Name: Cargo lock
URL: "https://en.wikipedia.org/wiki/Rust_(programming_language)#Cargo"
FileNameExtensions: ["lock"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "# This file is automatically @generated by Cargo.\n# It is not intended for manual editing.\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "IT IS NOT INTENDED FOR MANUAL EDITING."
    CaseSensitive: false
  - Pos: any
    AsciiString: "THIS FILE IS AUTOMATICALLY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATED BY CARGO."
    CaseSensitive: false
  - Pos: any
    AsciiString: "CRATES.IO-INDEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REGISTRY+HTTPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEPENDENCIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GITHUB.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RUST-LANG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHECKSUM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PACKAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOURCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
