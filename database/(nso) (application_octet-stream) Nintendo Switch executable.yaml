Name: Nintendo Switch executable
URL: "https://switchbrew.org/wiki/NSO0"
FileNameExtensions: ["nso"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "NSO0\0\0\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "EXCEPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HANDLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_ZN2NN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ALIGN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEBUG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DLIST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "N2NN4"
    CaseSensitive: false
  - Pos: any
    AsciiString: "START"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MOD0"
    CaseSensitive: false
