Name: Rave Reports Project
URL: "http://www.nevrona.com/"
FileNameExtensions: ["rav"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "RAV\x1A"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TRAVEPROJECTMANAGER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPILENEEDED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNITSFACTOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CATEGORIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARAMETERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FULLNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PIVARS"
    CaseSensitive: false
