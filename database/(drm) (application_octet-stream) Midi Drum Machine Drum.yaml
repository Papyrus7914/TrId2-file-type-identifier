Name: Midi Drum Machine Drum
Description: Multimedia demo by Charles Petzold.
FileNameExtensions: ["drm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "RIFF"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "DRUMLIST"
    CaseSensitive: true
  - Pos: 20
    AsciiString: "INFO"
    CaseSensitive: true
