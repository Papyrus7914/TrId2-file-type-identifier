Name: Quartus Pin Planner data
URL: "https://en.wikipedia.org/wiki/Altera_Quartus"
FileNameExtensions: ["dpf"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PIN_PLANNER_FILE_SPECIFIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GROUP_FILE_ASSOCIATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PIN_PLANNER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PIN_INFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUSES"
    CaseSensitive: false
