Name: Monarch Graphic File
FileNameExtensions: ["mgf"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "MGF"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "Monarch Graphic file. \n Copyright \xA9 2002-"
    CaseSensitive: true
  - Pos: 51
    AsciiString: "Monarch Video Vision"
    CaseSensitive: true
