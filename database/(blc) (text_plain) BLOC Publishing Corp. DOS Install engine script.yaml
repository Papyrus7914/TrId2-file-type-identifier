Name: BLOC Publishing Corp. DOS Install engine script
FileNameExtensions: ["blc"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "HD_NEED "
    CaseSensitive: true
  - Pos: any
    AsciiString: "PRESS ANY KEY TO CONTINUE..."
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRESS F10 TO CONTINUE..."
    CaseSensitive: false
  - Pos: any
    AsciiString: "IN DRIVE SOURCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INSTALLATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPLETED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FDEFAULT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HDEFAULT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISPMSG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUMDISK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAUSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNZIP"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".ZIP"
    CaseSensitive: false
