Name: Clam AntiVirus Database
Description: Clam AntiVirus is a GPL anti-virus toolkit.
URL: "https://en.wikipedia.org/wiki/Clam_AntiVirus"
FileNameExtensions: ["cvd", "cld", "cud", "info"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "ClamAV-VDB:"
    CaseSensitive: true
