Name: Corel PrintHouse image
URL: "http://en.wikipedia.org/wiki/Corel"
FileNameExtensions: ["cph"]
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1, 0x00]
  - Pos: any
    AsciiString: "R\0O\0O\0T\0 \0E\0N\0T\0R\0Y"
    CaseSensitive: false
  - Pos: any
    AsciiString: "T\0H\0U\0M\0B\0N\0A\0I\0L"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WREFCOUNTOUTLINE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "C\0O\0N\0T\0E\0N\0T\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WOUTLINEHANDLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WREFCOUNTFILL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WGRAPHICPAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WFILLHANDLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WGEO"
    CaseSensitive: false
