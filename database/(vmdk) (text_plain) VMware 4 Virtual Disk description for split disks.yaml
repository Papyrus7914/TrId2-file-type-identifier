Name: VMware 4 Virtual Disk description for split disks
URL: "https://en.wikipedia.org/wiki/VMware"
FileNameExtensions: ["vmdk"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "# Disk DescriptorFile"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DDB.GEOMETRY.CYLINDERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DDB.GEOMETRY.SECTORS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISK DESCRIPTORFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DDB.GEOMETRY.HEADS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTENT DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THE DISK DATA BASE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREATETYPE"
    CaseSensitive: false
