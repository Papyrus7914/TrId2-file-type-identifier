Name: Sony ICD-R100 recorder compressed Sound
Description: Experimental pattern obtained via converter code analysis.
URL: "https://www.sony.ca/en/electronics/support/downloads/W0001286"
FileNameExtensions: ["ics"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SIFF"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "WAVEfmt "
    CaseSensitive: true
  - Pos: any
    AsciiString: "WAVEFMT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
