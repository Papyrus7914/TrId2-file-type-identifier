Name: KToon project
URL: "http://www.ktoon.net"
FileNameExtensions: ["ktn"]
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "LIBRARY.KTLUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT.KTPUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCENE0.KTSUT"
    CaseSensitive: false
