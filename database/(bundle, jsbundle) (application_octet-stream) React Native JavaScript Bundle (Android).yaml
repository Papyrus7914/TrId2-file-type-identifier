Name: React Native JavaScript Bundle (Android)
URL: "https://reactnative.dev/docs/javascript-environment"
FileNameExtensions: ["bundle", "jsbundle"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xC6, 0x1F, 0xBC, 0x03, 0xC1, 0x03, 0x19, 0x1F]
  - Pos: any
    AsciiString: "ANDROID.PERMISSION."
    CaseSensitive: false
  - Pos: any
    AsciiString: "REACT-NATIVE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ERROR AND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JS BUNDLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CORRUPT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ELEMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DECOMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNPACK"
    CaseSensitive: false
