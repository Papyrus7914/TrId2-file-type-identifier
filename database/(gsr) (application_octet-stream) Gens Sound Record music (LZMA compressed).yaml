Name: Gens Sound Record music (LZMA compressed)
URL: "http://fileformats.archiveteam.org/wiki/Gens_Sound_Record"
FileNameExtensions: ["gsr"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "LZMA]\0\0\x80\0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "\0\0\0\0\0\0#\x94\xC6h\x89@\xE2"
    CaseSensitive: true
