Name: Node-RED flow
URL: "https://en.wikipedia.org/wiki/Node-RED"
FileNameExtensions: ["json"]
MimeType: text/json
DetectionPatterns:
  - Pos: 0
    AsciiString: "["
    CaseSensitive: true
  - Pos: any
    AsciiString: "COMPLETE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONSOLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAYLOAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ACTIVE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEBUG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIRES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
