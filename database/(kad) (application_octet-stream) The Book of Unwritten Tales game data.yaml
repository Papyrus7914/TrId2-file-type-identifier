Name: The Book of Unwritten Tales game data
URL: "https://en.wikipedia.org/wiki/The_Book_of_Unwritten_Tales"
FileNameExtensions: ["kad"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "<kagedata>\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ASSETREF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FREQ"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
