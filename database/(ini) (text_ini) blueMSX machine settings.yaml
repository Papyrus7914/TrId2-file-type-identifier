Name: blueMSX machine settings
URL: "https://en.wikipedia.org/wiki/BlueMSX"
FileNameExtensions: ["ini"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "["
    CaseSensitive: true
  - Pos: any
    AsciiString: "SUBSLOTTED SLOTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BATTERY BACKED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTERNAL SLOTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "Z80 FREQUENCY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENABLE CMOS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VRAM SIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SLOT 0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SLOT 1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SLOT 2"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SLOT 3"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SLOT A"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SLOT B"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BOARD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COUNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIDEO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
