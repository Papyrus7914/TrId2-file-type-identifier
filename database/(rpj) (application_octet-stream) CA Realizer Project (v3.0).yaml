Name: CA Realizer Project (v3.0)
URL: "https://en.wikipedia.org/wiki/CA-Realizer"
FileNameExtensions: ["rpj"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "CA-Outline Control Save File \0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CA-REALIZER APPLICATIONV"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".RPJ"
    CaseSensitive: false
