Name: Doom Eternal Sound
URL: "https://en.wikipedia.org/wiki/Doom_Eternal"
FileNameExtensions: ["snd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x06\0\0\0"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 11
    AsciiString: "\0RIFF"
    CaseSensitive: true
  - Pos: 19
    AsciiString: "\0WAVEfmt "
    CaseSensitive: true
  - Pos: any
    AsciiString: "WAVEFMT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RIFF"
    CaseSensitive: false
