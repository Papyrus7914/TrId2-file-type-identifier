Name: Punch!CAD Object Description
URL: "https://www.punchcad.com/"
FileNameExtensions: ["pod"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "[Description]"
    CaseSensitive: true
  - Pos: any
    AsciiString: "OBJECTDESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OBJECTNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CUSTOM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPTION"
    CaseSensitive: false
