Name: ClariSSA internal edit format
Description: Amiga animation software.
FileNameExtensions: ["ssaedit", "ssaedition", "edition"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "SSA MDHD"
    CaseSensitive: true
