Name: TAG document (v2.x)
URL: "http://fileformats.archiveteam.org/wiki/TAG"
FileNameExtensions: ["tag"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x01\0TAG\0\0\0\x02"
    CaseSensitive: true
  - Pos: 256
    AsciiString: "HIERARCHIA TEKSTU"
    CaseSensitive: true
  - Pos: any
    AsciiString: "HIERARCHIA TEKSTU"
    CaseSensitive: false
