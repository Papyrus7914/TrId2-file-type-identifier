Name: Atari System Emulator disassembly listing
URL: "https://github.com/thebitculture/ase/"
FileNameExtensions: ["asm"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "; 68000 disassembly listing generated by ASE\r\n; Labels Lxxxxxxxx mark addresses referenced from inside the listing.\r\n;\r\n\t\tORG\t"
    CaseSensitive: true
