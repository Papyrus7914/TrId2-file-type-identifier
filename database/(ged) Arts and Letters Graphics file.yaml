Name: Arts and Letters Graphics file
URL: "http://www.arts-letters.com/"
FileNameExtensions: ["ged"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "A&L-\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LETTERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ARTS"
    CaseSensitive: false
