Name: Egret skin
URL: "https://github.com/egret-labs"
FileNameExtensions: ["exml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version='1.0' encoding='utf-8'?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "HOSTCOMPONENT NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NS.EGRET-LABS.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DECLARATIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EGRET.GUI."
    CaseSensitive: false
  - Pos: any
    AsciiString: "STATE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STATES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SKIN"
    CaseSensitive: false
