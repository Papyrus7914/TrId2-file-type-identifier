Name: Lytro Light Field Picture web format
URL: "http://fileformats.archiveteam.org/wiki/Lytro"
FileNameExtensions: ["lfp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x89LFP\r\n\x1A"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "\x89LF"
    CaseSensitive: true
  - Pos: 20
    AsciiString: "\r\n\x1A"
    CaseSensitive: true
  - Pos: 32
    AsciiString: "sha1-"
    CaseSensitive: true
  - Pos: 112
    AsciiString: "{\"picture\": {\"frameArray\": [{\"frame\": {\"metadataRef\": \"sha1-"
    CaseSensitive: true
