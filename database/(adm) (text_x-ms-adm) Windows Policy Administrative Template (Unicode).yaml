Name: Windows Policy Administrative Template (Unicode)
URL: "https://en.wikipedia.org/wiki/Administrative_Template"
FileNameExtensions: ["adm"]
MimeType: text/x-ms-adm
DetectionPatterns:
  - Pos: 0
    Bytes: [0xFF, 0xFE]
  - Pos: any
    AsciiString: "E\0N\0D\0 \0C\0A\0T\0E\0G\0O\0R\0Y"
    CaseSensitive: false
  - Pos: any
    AsciiString: "E\0N\0D\0 \0P\0O\0L\0I\0C\0Y"
    CaseSensitive: false
  - Pos: any
    AsciiString: "V\0A\0L\0U\0E\0N\0A\0M\0E"
    CaseSensitive: false
  - Pos: any
    AsciiString: "K\0E\0Y\0N\0A\0M\0E"
    CaseSensitive: false
  - Pos: any
    AsciiString: "M\0A\0C\0H\0I\0N\0E"
    CaseSensitive: false
  - Pos: any
    AsciiString: "C\0L\0A\0S\0S"
    CaseSensitive: false
