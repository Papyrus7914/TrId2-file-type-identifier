Name: Stream Deck Profile
URL: "https://en.wikipedia.org/wiki/Elgato#Stream_Deck"
FileNameExtensions: ["streamdeckprofile"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 26
    AsciiString: "/\0"
    CaseSensitive: true
  - Pos: 66
    AsciiString: ".sdProfile"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MANIFEST.JSON"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".SDPROFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMAGES"
    CaseSensitive: false
