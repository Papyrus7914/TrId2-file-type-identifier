Name: AMOS Asm Bank
Description: Contains Amiga 680x0 machine code.
URL: "http://en.wikipedia.org/wiki/AMOS_(programming_language)"
FileNameExtensions: ["abk"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "AmBk"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "Asm"
    CaseSensitive: true
