Name: Godot Engine project settings
URL: "https://en.wikipedia.org/wiki/Godot_(game_engine)"
FileNameExtensions: ["godot"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "; Engine configuration file."
    CaseSensitive: true
  - Pos: any
    AsciiString: "SINCE THE PARAMETERS THAT GO HERE ARE NOT ALL OBVIOUS."
    CaseSensitive: false
  - Pos: any
    AsciiString: "BEST EDITED USING THE EDITOR UI AND NOT DIRECTLY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ASSIGN VALUES TO PARAMETERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SECTION GOES BETWEEN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONFIG_VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPLICATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
