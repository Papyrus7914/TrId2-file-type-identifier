Name: IFF-like Font
Description: (used by AXS)
FileNameExtensions: ["fnt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "FONTINFO"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FONTINFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
