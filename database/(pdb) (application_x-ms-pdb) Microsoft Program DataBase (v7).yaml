Name: Microsoft Program DataBase (v7)
Description: Symbol Table / Debug info used by Microsoft's compilers
URL: "https://en.wikipedia.org/wiki/Program_database"
FileNameExtensions: ["pdb"]
MimeType: application/x-ms-pdb
DetectionPatterns:
  - Pos: 0
    AsciiString: "Microsoft C/C++ MSF 7.00\r\n\x1ADS"
    CaseSensitive: true
