Name: Citation File Format (with rem)
Description: https://citation-file-format.github.io/
FileNameExtensions: ["cff"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "#"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CFF-VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MESSAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
