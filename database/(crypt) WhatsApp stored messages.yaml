Name: WhatsApp stored messages
URL: "http://en.wikipedia.org/wiki/WhatsApp"
FileNameExtensions: ["crypt"]
DetectionPatterns:
  - Pos: 0
    #        I           #                       u                       \\                      -     5
    Bytes: [0x49, 0xEF, 0x23, 0xAE, 0xFF, 0xF9, 0x75, 0x0E, 0xC6, 0xCD, 0x5C, 0xA0, 0xA5, 0x9F, 0x2D, 0x35]
