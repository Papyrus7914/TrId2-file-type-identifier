  - Pos: any
    AsciiString: "0XLSZNPDI71FB300E7UWJ1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TARGETOSVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TARGETLANGUAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FROMVERSION"
    CaseSensitive: false
  - Pos: any
