  - Pos: any
    AsciiString: "SIGNATURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEVERITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERBUILD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERMAJOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERMINOR"
    CaseSensitive: false
