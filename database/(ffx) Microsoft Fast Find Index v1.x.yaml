Name: Microsoft Fast Find Index v1.x
Description: Indexes used to speed finding documents from the Open dialog box in Microsoft Office programs and from Microsoft Outlook.
URL: "http://support.microsoft.com/support/kb/articles/Q166/3/02.ASP"
FileNameExtensions: ["ffx"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "Microsoft (R) Full-text index format Version 1."
    CaseSensitive: true
