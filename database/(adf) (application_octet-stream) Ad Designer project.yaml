Name: Ad Designer project
URL: "http://fileformats.archiveteam.org/wiki/Actual_Drawing"
FileNameExtensions: ["adf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 2
    AsciiString: "Ad Designer v."
    CaseSensitive: true
  - Pos: any
    AsciiString: "PREVIEW JPEG IMAGE."
    CaseSensitive: false
  - Pos: any
    AsciiString: "AD DESIGNER V."
    CaseSensitive: false
  - Pos: any
    AsciiString: ".HTML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JFIF"
    CaseSensitive: false
