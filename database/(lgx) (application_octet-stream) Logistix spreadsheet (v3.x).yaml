Name: Logistix spreadsheet (v3.x)
URL: "https://en.wikipedia.org/wiki/Amiga_productivity_software#Database_and_spreadsheets"
FileNameExtensions: ["lgx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "v3."
    CaseSensitive: true
  - Pos: 5
    AsciiString: " LOGiSTiX DATA FILE"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LOGISTIX DATA FILE"
    CaseSensitive: false
