Name: Reality Bytes game Data archive
Description: Used in the game Dark Vengence.
FileNameExtensions: ["rbd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 8
    Bytes: [0xFF, 0xFF, 0xFF, 0xFF]
  - Pos: 16
    AsciiString: "Copyright 1998 Reality Bytes, Inc.  All rights reserved.\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "COPYRIGHT 1998 REALITY BYTES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INC.  ALL RIGHTS RESERVED."
    CaseSensitive: false
