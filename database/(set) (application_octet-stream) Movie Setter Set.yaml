Name: Movie Setter Set
Description: Amiga video editor.
FileNameExtensions: ["set"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "LIST"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "SSETPROP\0\0\0LILBMCMAP"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ILBMFACE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BODY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORM"
    CaseSensitive: false
