Name: IFF Compressed Data Archive File
Description: A generic IFF container for compressed archives.
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "CDAFNAME"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CDAFNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BODY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
