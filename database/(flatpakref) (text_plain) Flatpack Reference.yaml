Name: Flatpack Reference
URL: "https://en.wikipedia.org/wiki/Flatpak"
FileNameExtensions: ["flatpakref"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "[Flatpak Ref]"
    CaseSensitive: true
  - Pos: any
    AsciiString: "RUNTIMEREPO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ISRUNTIME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BRANCH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
