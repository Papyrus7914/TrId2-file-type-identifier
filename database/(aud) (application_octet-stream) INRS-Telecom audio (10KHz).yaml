Name: INRS-Telecom audio (10KHz)
URL: "http://fileformats.archiveteam.org/wiki/INRS-Telecom_file"
FileNameExtensions: ["aud"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x1CG\0@"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "-"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "-"
    CaseSensitive: true
