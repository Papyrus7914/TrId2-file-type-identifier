Name: Panda multifile object
URL: "http://www.panda3d.org/"
FileNameExtensions: ["p3d"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "#! /usr/bin/env panda3d\npmf"
    CaseSensitive: true
  - Pos: any
    AsciiString: "RUNTIME.PANDA3D.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CERTIFICATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REQUIRES NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PACKAGE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENV PANDA3D"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN_MODULE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HOST URL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GROUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JFIF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
