Name: Microsoft Excel for Mac Spreadsheet (v1.x)
Description: From the very firsts releases of Excel.
URL: "https://en.wikipedia.org/wiki/Microsoft_Excel"
FileNameExtensions: ["xls"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "S'\0"
    CaseSensitive: true
  - Pos: 4
    AsciiString: "\xAB'\0\0\0\0\0\0\0\x02\x03"
    CaseSensitive: true
