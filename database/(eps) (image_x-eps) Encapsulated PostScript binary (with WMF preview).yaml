Name: Encapsulated PostScript binary (with WMF preview)
URL: "http://fileformats.archiveteam.org/wiki/Encapsulated_PostScript"
FileNameExtensions: ["eps"]
MimeType: image/x-eps
DetectionPatterns:
  - Pos: 0
    Bytes: [0xC5, 0xD0, 0xD3, 0xC6, 0x1E]
  - Pos: 20
    AsciiString: "\0\0\0\0\0\0\0\0"
    CaseSensitive: true
