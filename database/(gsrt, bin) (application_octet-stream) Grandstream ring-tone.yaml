Name: Grandstream ring-tone
URL: "https://en.wikipedia.org/wiki/Grandstream_Networks"
FileNameExtensions: ["gsrt", "bin"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\x01\0\0\0\a"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "ring.bin"
    CaseSensitive: true
  - Pos: any
    AsciiString: "RING.BIN"
    CaseSensitive: false
