Name: Sequential Vibes Music
FileNameExtensions: ["svm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SEQVIBES"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SAMPLER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CNTRL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEQSMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SVIS"
    CaseSensitive: false
