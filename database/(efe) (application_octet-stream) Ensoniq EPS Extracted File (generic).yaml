Name: Ensoniq EPS Extracted File (generic)
URL: "https://en.wikipedia.org/wiki/Ensoniq"
FileNameExtensions: ["efe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\r\nEps File: "
    CaseSensitive: true
  - Pos: 47
    AsciiString: "\r\n\x1A"
    CaseSensitive: true
