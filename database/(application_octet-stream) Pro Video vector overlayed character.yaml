Name: Pro Video vector overlayed character
Description: Amiga video software by Shereff Systems.
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 1
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "JDK "
    CaseSensitive: true
  - Pos: 18
    AsciiString: " OVERLAYED CHAR FILE\0\0CHAR/"
    CaseSensitive: true
  - Pos: any
    AsciiString: "OVERLAYED CHAR FILE\0\0CHAR"
    CaseSensitive: false
