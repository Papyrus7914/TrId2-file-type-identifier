Name: Team17 MOIK game data archive
URL: "https://wiki.xentax.com/index.php/Team17_Archive_MOIK"
FileNameExtensions: ["xom", "bdl", "kev", "laf", "aud"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MOIK"
    CaseSensitive: true
  - Pos: 64
    AsciiString: "TYPE"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SCHM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
