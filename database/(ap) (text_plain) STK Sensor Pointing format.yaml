Name: STK Sensor Pointing format
URL: "https://en.wikipedia.org/wiki/Systems_Tool_Kit"
FileNameExtensions: ["ap"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "stk.v."
    CaseSensitive: true
  - Pos: any
    AsciiString: "NUMBEROFATTITUDEPOINTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "END ATTITUDE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEQUENCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BEGIN"
    CaseSensitive: false
