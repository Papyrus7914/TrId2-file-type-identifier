Name: Windows Policy data
URL: "https://en.wikipedia.org/wiki/Microsoft_Windows"
FileNameExtensions: ["pol"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PReg\x01\0\0\0[\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "P\0O\0L\0I\0C\0I\0E\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "S\0O\0F\0T\0W\0A\0R\0E"
    CaseSensitive: false
