Name: Playdate Info
Description: "Filename is: pdxinfo"
URL: "https://en.wikipedia.org/wiki/Playdate_(console)"
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "name="
    CaseSensitive: true
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PDXVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUILDTIME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMAGEPATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUNDLEID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTHOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GAME"
    CaseSensitive: false
