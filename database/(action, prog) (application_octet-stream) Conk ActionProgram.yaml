Name: Conk Action/Program
Description: Action Game Construction Kit for Amiga.
URL: "https://www.semprini.me/1995/03/20/conk-action-game-construction-kit/"
FileNameExtensions: ["action", "prog"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "CONKPROG"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CONKPROG"
    CaseSensitive: false
