Name: ILOG View
URL: "https://en.wikipedia.org/wiki/ILOG"
FileNameExtensions: ["ilv"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "// Ilv Version: "
    CaseSensitive: true
  - Pos: 17
    AsciiString: "."
    CaseSensitive: true
  - Pos: 21
    AsciiString: "/"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ILVGADGETMANAGEROUTPUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE GENERATED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREATOR CLASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ILV VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ILVOBJECTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PALETTES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATHNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "0 ILV"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".ILV"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIZE"
    CaseSensitive: false
