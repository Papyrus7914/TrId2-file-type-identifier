Name: MacroMatrix spreadsheet (v1.00)
Description: Amiga spreadsheet by MacroSystem.
FileNameExtensions: ["mmx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MACROMATRIX   01.00"
    CaseSensitive: true
  - Pos: 26
    AsciiString: "FLAGS"
    CaseSensitive: true
  - Pos: 44
    AsciiString: "CELLS"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CELLS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FLAGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIZE"
    CaseSensitive: false
