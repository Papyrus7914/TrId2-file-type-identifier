Name: 16bit DOS EXE JAM compressed
Description: DOS Executable compressor by Eugen Vasilchenko.
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0\x01\0\x02\0"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "&\x04\0\0`\0"
    CaseSensitive: true
  - Pos: 24
    AsciiString: "\x1C\0\0\0~\0"
    CaseSensitive: true
