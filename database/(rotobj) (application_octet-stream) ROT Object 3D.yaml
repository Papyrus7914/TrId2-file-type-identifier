Name: ROT Object 3D
Description: Amiga 3D format.
URL: "http://amiga.wikia.com/wiki/VideoScape_3D"
FileNameExtensions: ["rotobj"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "ROTOROBJ"
    CaseSensitive: true
