Name: Time Stamped Data
FileNameExtensions: ["tsd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        0                 \v    *           H                 \r          \t                                  0                             0
    Bytes: [0x30, 0x80, 0x06, 0x0B, 0x2A, 0x86, 0x48, 0x86, 0xF7, 0x0D, 0x01, 0x09, 0x10, 0x01, 0x1F, 0xA0, 0x80, 0x30, 0x80, 0x02, 0x01, 0x01, 0x30]
  - Pos: any
    AsciiString: "TIME STAMPING AUTHORITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TIMESTAMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ACERT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CRL0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OCSP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
