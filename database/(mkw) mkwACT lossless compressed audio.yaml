Name: mkwACT lossless compressed audio
Description: The mkw Audio Compression Tool
URL: "http://home.att.net/~mkw/"
FileNameExtensions: ["mkw"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "mkw4"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "\0D\xAC\0\0\x10\xB1\x02\0"
    CaseSensitive: true
