Name: PlayStation Sprite Editor project File
URL: "https://en.wikipedia.org/wiki/PlayStation"
FileNameExtensions: ["sdf"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "TIM0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DISPLAY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ADDR0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ANM0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CEL0"
    CaseSensitive: false
