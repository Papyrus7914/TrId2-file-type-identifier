Name: Luigi's Mansion game data
Description: Yay0 encoded.
URL: "https://en.wikipedia.org/wiki/Luigi%27s_Mansion"
FileNameExtensions: ["szp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Yay0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MODEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RARC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROOT"
    CaseSensitive: false
