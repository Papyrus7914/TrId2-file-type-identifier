Name: 3D Studio Max Material Library
Description: .mat is a widely used extension; moreover, many different programs use this extension to reference material libraries or single materials.
FileNameExtensions: ["mat"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1, 0x00]
  - Pos: 1024
    AsciiString: "R\0o\0o\0t\0 \0E\0n\0t\0r\0y"
    CaseSensitive: true
  - Pos: 1152
    AsciiString: "M\0a\0t\0L\0i\0b"
    CaseSensitive: true
  - Pos: any
    AsciiString: "C\0L\0A\0S\0S\0D\0I\0R\0E\0C\0T\0O\0R\0Y"
    CaseSensitive: false
  - Pos: any
    AsciiString: "D\0L\0L\0D\0I\0R\0E\0C\0T\0O\0R\0Y"
    CaseSensitive: false
  - Pos: any
    AsciiString: "R\0O\0O\0T\0 \0E\0N\0T\0R\0Y"
    CaseSensitive: false
  - Pos: any
    AsciiString: "M\0A\0T\0L\0I\0B"
    CaseSensitive: false
