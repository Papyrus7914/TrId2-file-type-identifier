Name: HyberBook document
Description: Amiga multimedia authoring software.
URL: "https://www.amigafuture.de/asd.php?asd_id=2129"
FileNameExtensions: ["hb"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0\0\n\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "IXdK"
    CaseSensitive: true
  - Pos: any
    AsciiString: "IXDK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NOTE"
    CaseSensitive: false
