Name: G-code (generated by ideaMaker)
URL: "https://www.raise3d.com/ideamaker/"
FileNameExtensions: ["gcode"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: ";Sliced by ideaMaker "
    CaseSensitive: true
  - Pos: 22
    AsciiString: "."
    CaseSensitive: true
  - Pos: any
    AsciiString: "FILAMENT COMPENSATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILAMENT DIAMETER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILAMENT DENSITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTRUDER OFFSET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLATE SHAPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIMENSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAYER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRINT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
