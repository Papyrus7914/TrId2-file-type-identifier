Name: SubEthaEdit Mode
Description: SubEthaEdit is a powerful collaborative text editor for Mac OS X. Modes add support for additional programming languages.
URL: "http://www.codingmonkeys.de/subethaedit/"
FileNameExtensions: ["zip"]
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "SYNTAXDEFINITION.XMLUX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFOPLIST.STRINGSUX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENGLISH.LPROJ"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFO.PLISTUX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RESOURCES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".MODE"
    CaseSensitive: false
