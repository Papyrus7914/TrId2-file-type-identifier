Name: Windows Desktop Theme Package
Description: CABinet with LZX:21 compression and ID 0. Extension ".deskthemepack" only suited for Windows 8-10.
URL: "https://msdn.microsoft.com/en-us/library/windows/desktop/bb773190(v=vs.85).aspx"
FileNameExtensions: ["deskthemepack", "themepack"]
MimeType: application/vnd.ms-cab-compressed
DetectionPatterns:
  - Pos: 0
    AsciiString: "MSCF\0\0\0\0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "\0\0\0\0"
    CaseSensitive: true
  - Pos: 20
    AsciiString: "\0\0\0\0\x03\x01"
    CaseSensitive: true
  - Pos: 30
    AsciiString: "\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 42
    Bytes: [0x03, 0x15]
  - Pos: any
    AsciiString: ".THEME"
    CaseSensitive: false
