Name: ArcPad Layer
URL: "http://resources.arcgis.com/en/help/arcpad/10.0/sdk/xml/"
FileNameExtensions: ["apl"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LAYER NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYMBOLOGY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ARCPAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FIELD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LABEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUE"
    CaseSensitive: false
