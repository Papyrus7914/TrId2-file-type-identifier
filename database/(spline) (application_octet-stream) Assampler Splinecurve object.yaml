Name: Assampler Spline/curve object
Description: Amiga Object oriented sound processor program by Henning Thielemann.
FileNameExtensions: ["spline"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "POLYVHDR"
    CaseSensitive: true
  - Pos: any
    AsciiString: "POLYVHDR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ADSR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALU"
    CaseSensitive: false
