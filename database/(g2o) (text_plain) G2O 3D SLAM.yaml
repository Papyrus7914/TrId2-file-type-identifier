Name: G2O 3D SLAM
URL: "https://github.com/RainerKuemmerle/g2o"
FileNameExtensions: ["g2o"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "PARAMS_SE3OFFSET"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VERTEX_SE3"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EDGE_SE3_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "QUAT 1 1"
    CaseSensitive: false
