Name: Aladdin 4D Drawing (v3.x)
URL: "https://en.wikipedia.org/wiki/Aladdin4D"
FileNameExtensions: ["4d"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "ALDN@"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TEXTURES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NWSP"
    CaseSensitive: false
