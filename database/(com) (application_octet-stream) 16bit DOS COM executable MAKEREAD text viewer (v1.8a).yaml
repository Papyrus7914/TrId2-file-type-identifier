Name: 16bit DOS COM executable MAKEREAD text viewer (v1.8a)
URL: "http://fileformats.archiveteam.org/wiki/MAKEREAD"
FileNameExtensions: ["com"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xE9\f\x01\0\r\n             < H=Home D=PgDn  U=PgUp  L=Down Arrow  E=End  Q=Print >\r$Printing file, please wait...$"
    CaseSensitive: true
