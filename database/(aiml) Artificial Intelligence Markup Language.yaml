Name: Artificial Intelligence Markup Language
URL: "http://www.alicebot.org/aiml.html"
FileNameExtensions: ["aiml"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CATEGORY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATTERN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEMPLATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THIS"
    CaseSensitive: false
