Name: Compressed COLLADA Digital Asset Exchange
URL: "https://en.wikipedia.org/wiki/COLLADA"
FileNameExtensions: ["zae"]
MimeType: model/vnd.collada+xml+zip
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "MANIFEST.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".DAE"
    CaseSensitive: false
