Name: KretSim Circuit
URL: "https://kretsim.se/"
FileNameExtensions: ["ctc"]
MimeType: application/x-ctc
DetectionPatterns:
  - Pos: 0
    AsciiString: "MetaData CreateInfo \"Generated by KretSim v."
    CaseSensitive: true
  - Pos: any
    AsciiString: "GENERATED BY KRETSIM V."
    CaseSensitive: false
  - Pos: any
    AsciiString: "METADATA CREATEINFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "METADATA LAYOUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUT_NET C"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INPUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUT C"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".CLT"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".OUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNIT"
    CaseSensitive: false
