Name: NTv2 Standard ASCII Grid Shift
URL: "https://en.wikipedia.org/wiki/NTv2"
FileNameExtensions: ["gsa"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "NUM_OREC "
    CaseSensitive: true
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NTV2.0"
    CaseSensitive: false
