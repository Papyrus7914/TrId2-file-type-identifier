Name: CherryTree note (XML)
URL: "http://www.giuspen.com/cherrytree"
FileNameExtensions: ["ctd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" ?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NODE CUSTOM_ICON_ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CUSTOM-COLORS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TS_CREATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TS_LASTSAVE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHERRYTREE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FOREGROUND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROG_LANG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RICH_TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNIQUE_ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "READONLY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IS_BOLD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FALSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TAGS"
    CaseSensitive: false
