Name: Dired ls-like directory listing (DOS/Win)
URL: "https://www.gnu.org/software/emacs/manual/html_mono/dired-x.html#Virtual-Dired"
FileNameExtensions: ["dired"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "  "
    CaseSensitive: true
  - Pos: 3
    AsciiString: ":/"
    CaseSensitive: true
