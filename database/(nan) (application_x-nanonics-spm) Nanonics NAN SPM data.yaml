Name: Nanonics NAN SPM data
URL: "https://github.com/christian-sahlmann/gwyddion/blob/master/modules/file/nanonics.c"
FileNameExtensions: ["nan"]
MimeType: application/x-nanonics-spm
DetectionPatterns:
  - Pos: 0
    AsciiString: "NAN File\n-Start Header-"
    CaseSensitive: true
  - Pos: any
    AsciiString: "-END CHANNEL HEADER-"
    CaseSensitive: false
