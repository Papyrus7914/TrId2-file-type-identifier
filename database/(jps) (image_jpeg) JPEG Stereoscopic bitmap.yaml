Name: JPEG Stereoscopic bitmap
URL: "http://fileformats.archiveteam.org/wiki/JPS"
FileNameExtensions: ["jps"]
MimeType: image/jpeg
DetectionPatterns:
  - Pos: 0
    #                                            J     F     I     F
    Bytes: [0xFF, 0xD8, 0xFF, 0xE0, 0x00, 0x10, 0x4A, 0x46, 0x49, 0x46, 0x00, 0x01]
  - Pos: any
    AsciiString: "_JPSJPS_"
    CaseSensitive: false
