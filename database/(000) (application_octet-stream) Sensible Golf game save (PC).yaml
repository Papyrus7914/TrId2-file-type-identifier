Name: Sensible Golf game save (PC)
URL: "https://en.wikipedia.org/wiki/Sensible_Golf"
FileNameExtensions: ["000"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "DMF1."
    CaseSensitive: true
  - Pos: 38
    AsciiString: "NEIL-START"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NEIL-END"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HOLE"
    CaseSensitive: false
