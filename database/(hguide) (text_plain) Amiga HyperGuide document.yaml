Name: Amiga HyperGuide document
FileNameExtensions: ["hguide"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "@hyperguide"
    CaseSensitive: true
  - Pos: any
    AsciiString: "HYPERGUIDE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NODE MAIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENDNODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LINK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
