Name: MAME Hash
URL: "https://en.wikipedia.org/wiki/MAME"
FileNameExtensions: ["hsi"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "HASH CRC32"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTRAINFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HASHFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "YEAR"
    CaseSensitive: false
