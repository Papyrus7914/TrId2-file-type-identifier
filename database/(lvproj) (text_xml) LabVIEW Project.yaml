Name: LabVIEW Project
URL: "https://en.wikipedia.org/wiki/LabVIEW"
FileNameExtensions: ["lvproj"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xEF\xBB\xBF<?xml version='1.0' encoding='UTF-8'?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SPECIFY.CUSTOM.ADDRESS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUILD SPECIFICATIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERTY NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEPENDENCIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MY COMPUTER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ITEM NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LVVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "I.PRO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BOOL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
