Name: Magic Form / AcerForm Form
Description: Win 3.x forms designer app by Institute for Information Industry and Acer Incorporated.
FileNameExtensions: ["frm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MAGIC FORM"
    CaseSensitive: true
  - Pos: 11
    Bytes: [0x01]
