    AsciiString: "MOLECULAR ORBITAL OCCUPATION NUMBERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUCLEAR CARTESIAN COORDINATES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ELECTRONIC SPIN MULTIPLICITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MOLECULAR ORBITAL SPIN TYPES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MOLECULAR ORBITAL ENERGIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUMBER OF ALPHA ELECTRONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUMBER OF BETA ELECTRONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUMBER OF CORE ELECTRONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUMBER OF PERTURBATIONS"
    CaseSensitive: false
  - Pos: any
