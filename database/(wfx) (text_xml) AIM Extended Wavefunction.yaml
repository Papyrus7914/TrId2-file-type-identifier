    AsciiString: "<Title>\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MOLECULAR ORBITAL PRIMITIVE COEFFICIENTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUMBER OF OCCUPIED MOLECULAR ORBITALS"
    CaseSensitive: false
