    AsciiString: "NUMBER OF NUCLEI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIRIAL RATIO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUCLEAR CHARGES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRIMITIVE TYPES"
    CaseSensitive: false
