Name: Microsoft Package Dependency cache
URL: "https://en.wikipedia.org/wiki/Universal_Windows_Platform_apps#APPX"
FileNameExtensions: ["pckgdep"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "ARI8\0\0\0\0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "\0\0\0\0TOC8"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DEPG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JHN8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOC8"
    CaseSensitive: false
