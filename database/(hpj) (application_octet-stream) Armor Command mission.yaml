Name: Armor Command mission
URL: "https://www.mobygames.com/game/1415/armor-command/"
FileNameExtensions: ["hpj"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 1
    AsciiString: "\0\x04\0\x01\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GLOBAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNUSED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOWN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GLOW"
    CaseSensitive: false
