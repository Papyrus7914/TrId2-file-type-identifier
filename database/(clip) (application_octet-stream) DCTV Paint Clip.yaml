Name: DCTV Paint Clip
URL: "http://amiga.resource.cx/exp/dctv"
FileNameExtensions: ["clip"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "DCCL"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BODY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HVVH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MASK"
    CaseSensitive: false
