Name: DT3V D.U.N.E. engine game data (v3)
URL: "http://fileformats.archiveteam.org/wiki/D3TV"
FileNameExtensions: ["sht"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "D3TV"
    CaseSensitive: true
  - Pos: any
    AsciiString: "D3TV"
    CaseSensitive: false
