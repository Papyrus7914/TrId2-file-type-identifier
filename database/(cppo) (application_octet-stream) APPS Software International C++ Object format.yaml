Name: APPS Software International C++ Object format
URL: "http://www-mmsp.ece.mcgill.ca/Documents/AudioFormats/WAVE/Docs/RIFFNEW.pdf"
FileNameExtensions: ["cppo"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "RIFF"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "CPPOLIST"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CPPOLIST"
    CaseSensitive: false
