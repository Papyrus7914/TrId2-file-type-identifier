Name: Mortal Kombat 3 game data archive
URL: "https://en.wikipedia.org/wiki/Mortal_Kombat_3"
FileNameExtensions: ["ftr"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MFIL"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FLAGBAG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CDIR"
    CaseSensitive: false
