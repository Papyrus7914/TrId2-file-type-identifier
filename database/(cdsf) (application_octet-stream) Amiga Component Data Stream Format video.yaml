Name: Amiga Component Data Stream Format video
Description: Concept of a new interactive movie format.
URL: "http://de4.aminet.net/gfx/misc/anim_concept.readme"
FileNameExtensions: ["cdsf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "CDSF"
    CaseSensitive: true
