Name: 16bit DOS EXE WWPACK compressed
Description: DOS EXE compressor by Rafal Wierzbicki and Piotr Warezak.
URL: "http://fileformats.archiveteam.org/wiki/WWPACK"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0\0\x02\0"
    CaseSensitive: true
  - Pos: 21
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 24
    AsciiString: "\x1C\0\0\0WWP"
    CaseSensitive: true
