Name: Jabaco Source
URL: "https://en.wikipedia.org/wiki/Jabaco"
FileNameExtensions: ["jsrc"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "(SUPERCLASS)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(NAMESPACE)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARAM NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOURCEFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(ACCESS)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(NAME)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(TYPE)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OBJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PUBLIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CDATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUE"
    CaseSensitive: false
