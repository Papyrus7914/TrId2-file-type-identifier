Name: IZE data (generic)
Description: DOS info manager from Persoft.
FileNameExtensions: ["ize", "fky", "ftx", "key", "ord", "tix", "tky", "tpt", "_01", "_02"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "IZE\x01"
    CaseSensitive: true
  - Pos: 13
    Bytes: [0x1A]
