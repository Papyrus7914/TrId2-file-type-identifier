Name: Beam Software SIFF video (FCP)
URL: "https://wiki.multimedia.cx/index.php?title=SIFF"
FileNameExtensions: ["vbc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SIFF"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "FCPKFCHD"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FCPKFCHD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BODY"
    CaseSensitive: false
