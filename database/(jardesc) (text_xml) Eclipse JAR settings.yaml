Name: Eclipse JAR settings
URL: "https://en.wikipedia.org/wiki/Eclipse_(software)"
FileNameExtensions: ["jardesc"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "SELECTEDELEMENTS EXPORTCLASSFILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JAVAELEMENT HANDLEIDENTIFIER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INCLUDEDIRECTORYENTRIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPTIONS BUILDIFNEEDED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTIONLOCATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXPORTOUTPUTFOLDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USESOURCEFOLDERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXPORTJAVAFILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAVEDESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXPORTWARNINGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXPORTERRORS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OVERWRITE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".JARDESC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPRESS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JAR PATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFO"
    CaseSensitive: false
