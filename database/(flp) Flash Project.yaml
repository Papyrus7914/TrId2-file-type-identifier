Name: Flash Project
URL: "http://en.wikipedia.org/wiki/Adobe_Flash"
FileNameExtensions: ["flp"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xEF\xBB\xBF<flash_project "
    CaseSensitive: true
  - Pos: any
    AsciiString: "FLASH_PROJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
