Name: 16bit DOS COM VICKING protected
Description: DOS COM protector by MajestiC.
FileNameExtensions: ["com"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xB8]
  - Pos: 3
    Bytes: [0xFF, 0xE0]
  - Pos: any
    AsciiString: "VIKING 1.000 BY MAJESTIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WANNA BE ANOTHER ONE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%MZBYDSE"
    CaseSensitive: false
