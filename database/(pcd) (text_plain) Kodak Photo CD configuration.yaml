Name: Kodak Photo CD configuration
URL: "https://en.wikipedia.org/wiki/Photo_CD"
FileNameExtensions: ["pcd"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "DISC_TYPE:"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LAST_SESN_INFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XACT_TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VENDR"
    CaseSensitive: false
