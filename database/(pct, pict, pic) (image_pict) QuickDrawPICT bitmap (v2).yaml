Name: QuickDraw/PICT bitmap (v2)
URL: "http://fileformats.archiveteam.org/wiki/PICT"
FileNameExtensions: ["pct", "pict", "pic"]
MimeType: image/pict
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 522
    #                                \f
    Bytes: [0x00, 0x11, 0x02, 0xFF, 0x0C, 0x00]
