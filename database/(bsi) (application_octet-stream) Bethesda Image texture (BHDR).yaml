Name: Bethesda Image texture (BHDR)
URL: "https://www.mobygames.com/company/171/bethesda-softworks-llc/"
FileNameExtensions: ["bsi"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "BHDR\0\0\0\x1A"
    CaseSensitive: true
  - Pos: 30
    AsciiString: "\0\0\0\0DATA\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
