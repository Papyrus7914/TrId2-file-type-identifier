Name: Astound Presentation document (old)
URL: "http://fileformats.archiveteam.org/wiki/Astound_Presentation"
FileNameExtensions: ["asd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "AWND"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "LOTS"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DZBM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PMMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPMM"
    CaseSensitive: false
