Name: TrID definition! :-)
Description: Here's where you can find many more definitions!
URL: "http://mark0.net/soft-trid-deflist.html"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<TrID ver=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "FILETYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRID VER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATTERN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "E-MAIL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BLOCK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BYTES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MONTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HOUR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TIME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "YEAR"
    CaseSensitive: false
