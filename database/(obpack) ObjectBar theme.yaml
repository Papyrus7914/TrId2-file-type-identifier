Name: ObjectBar theme
URL: "http://www.stardock.com/products/objectbar/"
FileNameExtensions: ["obpack"]
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "OBPACK-LASTTHEMEINFO.INI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMPORTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BITMAPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ICONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POPUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BARS"
    CaseSensitive: false
