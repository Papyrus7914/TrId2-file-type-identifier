Name: DocBook document (v5.x)
URL: "https://en.wikipedia.org/wiki/DocBook"
FileNameExtensions: ["dbk", "xml"]
MimeType: application/docbook+xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOCBOOK.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARA"
    CaseSensitive: false
