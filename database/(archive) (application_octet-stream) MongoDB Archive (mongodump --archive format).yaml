Name: MongoDB Archive (mongodump --archive format)
URL: "https://www.mongodb.com/docs/database-tools/mongodump/"
FileNameExtensions: ["archive"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        m
    Bytes: [0x6D, 0xE2, 0x99, 0x81]
  - Pos: 5
    AsciiString: "\0\0\0\x10concurrent_collections\0\x04\0\0\0\x02version\0\x04\0\0\00.1\0\x02server_version\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CONCURRENT_COLLECTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SERVER_VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOOL_VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "METADATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INDEXES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
