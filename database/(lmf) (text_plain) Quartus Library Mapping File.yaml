Name: Quartus Library Mapping File
URL: "https://en.wikipedia.org/wiki/Altera_Quartus"
FileNameExtensions: ["lmf"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "LIBRARY "
    CaseSensitive: true
  - Pos: any
    AsciiString: "RETURNS (OUT)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAPPING FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FUNCTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LIBRARY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BEGIN"
    CaseSensitive: false
