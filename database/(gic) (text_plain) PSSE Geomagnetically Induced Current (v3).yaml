    AsciiString: "BEGIN BUS FIXED SHUNT DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "END OF BUS SUBSTATION DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BEGIN BUS SUBSTATION DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "END OF TRANSFORMER DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BEGIN TRANSFORMER DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "END OF SUBSTATION DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "END OF BRANCH DATA"
    CaseSensitive: false
  - Pos: any
