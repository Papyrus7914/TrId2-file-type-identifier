Name: DOS Turbo Basic executable
URL: "https://en.wikipedia.org/wiki/Turbo_Basic"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 32
    AsciiString: "TURBO BASIC"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TURBO BASIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BORLAND"
    CaseSensitive: false
