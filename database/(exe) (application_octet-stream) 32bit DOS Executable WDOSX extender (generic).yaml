    CaseSensitive: true
  - Pos: 62
    AsciiString: " DOS extender Copyright (c) 1996-"
    CaseSensitive: true
  - Pos: 99
    AsciiString: " Michael Tippach\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOS EXTENDER COPYRIGHT (C) 1996-"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MICHAEL TIPPACH"
    CaseSensitive: false
