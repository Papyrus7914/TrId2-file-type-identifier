Name: MacDraft drawing
FileNameExtensions: ["mdd"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "MDDC20"
    CaseSensitive: true
  - Pos: any
    AsciiString: "RECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOCK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROP"
    CaseSensitive: false
