Name: ViewLink Help
URL: "https://wiki.preterhuman.net/Traveling_Software_ViewLink"
FileNameExtensions: ["hlp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "VL.HLP Copyright 1989 by Traveling Software Inc.\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GENERAL HELP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIEWLINK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMAND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOMAIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MENU"
    CaseSensitive: false
