Name: MFC ClassWizard info
FileNameExtensions: ["clw"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "; CLW file contains information for the MFC ClassWizard"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NEWFILEINCLUDE1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RESOURCECOUNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERAL INFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LASTTEMPLATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLASSCOUNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LASTCLASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
