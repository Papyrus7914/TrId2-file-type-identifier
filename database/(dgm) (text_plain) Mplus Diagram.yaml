Name: Mplus Diagram
URL: "https://www.statmodel.com/"
FileNameExtensions: ["dgm"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "VERSION "
    CaseSensitive: true
  - Pos: 9
    AsciiString: "."
    CaseSensitive: true
  - Pos: any
    AsciiString: "USEVARIABLES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INPUT_END"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAMES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".DAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
