Name: Footprint/IBM Works Data Filer Design
URL: "https://en.wikipedia.org/wiki/IBM_Works"
FileNameExtensions: ["lde"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MicroBurst"
    CaseSensitive: true
  - Pos: 15
    AsciiString: "\0DB"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DATABASE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".LDB"
    CaseSensitive: false
