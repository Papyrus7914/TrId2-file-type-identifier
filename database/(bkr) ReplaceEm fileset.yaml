Name: ReplaceEm fileset
URL: "http://web.archive.org/web/20070623104306/http://www.orbit.org/replace/"
FileNameExtensions: ["bkr"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "Version "
    CaseSensitive: true
  - Pos: 9
    AsciiString: "."
    CaseSensitive: true
  - Pos: any
    AsciiString: "BEGIN_GROUP_BACKUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GROUP_START"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
