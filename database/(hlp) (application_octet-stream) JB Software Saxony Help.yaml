Name: JB Software Saxony Help
Description: Used by various DOS software by Jan Bochmann.
FileNameExtensions: ["hlp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "JB Software Saxony "
    CaseSensitive: true
  - Pos: any
    AsciiString: "ONLINE-HILFESYSTEM DATEN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JAN BOCHMANN"
    CaseSensitive: false
