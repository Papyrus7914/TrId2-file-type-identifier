Name: Analysis for Windows structure
URL: "http://www.cuylaerts.net/"
FileNameExtensions: ["ana"]
DetectionPatterns:
  - Pos: 1
    AsciiString: ":\\"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MEMBERLOADS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JOINTLOADS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GRAM FILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOADCASE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SUPPORTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MEMBERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JOINTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".ANA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIEW"
    CaseSensitive: false
