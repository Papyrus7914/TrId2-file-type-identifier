  - Pos: any
    AsciiString: "R\0O\0O\0T\0 \0E\0N\0T\0R\0Y"
    CaseSensitive: false
  - Pos: any
    AsciiString: "T\0E\0M\0P\0L\0A\0T\0E\0I\0D"
    CaseSensitive: false
