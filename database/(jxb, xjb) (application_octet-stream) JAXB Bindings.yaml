Name: JAXB Bindings
URL: "https://en.wikipedia.org/wiki/Java_Architecture_for_XML_Binding"
FileNameExtensions: ["jxb", "xjb"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "JAVA.SUN.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BINDINGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JAXB"
    CaseSensitive: false
