Name: PlayStation 3 Theme
FileNameExtensions: ["p3t"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "P3TF\0\0\x01\x10\0\0\0@\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ICONTABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFOTABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THEME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FONT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "P3TF"
    CaseSensitive: false
