Name: Channel Definition Format
URL: "https://en.wikipedia.org/wiki/Channel_Definition_Format"
FileNameExtensions: ["cdf"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: 13
    AsciiString: "=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "ITEM HREF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHANNEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
