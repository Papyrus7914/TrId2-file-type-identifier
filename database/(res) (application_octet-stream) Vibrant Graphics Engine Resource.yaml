Name: Vibrant Graphics Engine Resource
Description: Graphics library used by various DOS app, like 3D Studio.
FileNameExtensions: ["res"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Resource file II, (c) Vibrant Graphics, Inc. 1992-3.\n\x1A"
    CaseSensitive: true
  - Pos: 64
    AsciiString: "\x01\0directory\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "-- BEGIN AUTOMATIC VIBRANT CONFIGURATION SECTION                        VG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-- END OF AUTOMATIC VIBRANT CONFIGURATION SECTION                       VG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISPLAY PARAMETERS                                                   VG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIRECTORY"
    CaseSensitive: false
