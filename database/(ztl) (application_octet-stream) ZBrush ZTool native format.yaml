Name: ZBrush ZTool native format
URL: "http://en.wikipedia.org/wiki/ZBrush"
FileNameExtensions: ["ztl"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "ZBrush File.Copyright 1977-20"
    CaseSensitive: true
  - Pos: 31
    AsciiString: ".PIXOLOGIC INC\0"
    CaseSensitive: true
  - Pos: 76
    AsciiString: "LTZ\0"
    CaseSensitive: true
