Name: ConceptDraw document
URL: "https://www.conceptdraw.com"
FileNameExtensions: ["cdd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 2
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "CONCEPT"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CONCEPT"
    CaseSensitive: false
