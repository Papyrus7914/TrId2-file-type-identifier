Name: SWORD Module Add-in
URL: "https://www.crosswire.org/sword"
FileNameExtensions: ["zip"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "modules/"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".CONFPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODULES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODS."
    CaseSensitive: false
