Name: Delphi Project source
URL: "https://en.wikipedia.org/wiki/Delphi_(programming_language)"
FileNameExtensions: ["dpr"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "program "
    CaseSensitive: true
  - Pos: any
    AsciiString: "PROGRAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BEGIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "END."
    CaseSensitive: false
