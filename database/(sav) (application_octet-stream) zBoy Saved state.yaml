Name: zBoy Saved state
URL: "http://zboy.sourceforge.net/"
FileNameExtensions: ["sav"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "zBoy v"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "."
    CaseSensitive: true
  - Pos: 10
    AsciiString: " SAVE"
    CaseSensitive: true
