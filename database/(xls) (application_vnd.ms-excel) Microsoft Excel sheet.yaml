Name: Microsoft Excel sheet
URL: "https://en.wikipedia.org/wiki/Microsoft_Excel"
FileNameExtensions: ["xls"]
MimeType: application/vnd.ms-excel
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1, 0x00]
  - Pos: any
    AsciiString: "S\0U\0M\0M\0A\0R\0Y\0I\0N\0F\0O\0R\0M\0A\0T\0I\0O\0N"
    CaseSensitive: false
  - Pos: any
    AsciiString: "B\0O\0O\0K"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXCEL"
    CaseSensitive: false
