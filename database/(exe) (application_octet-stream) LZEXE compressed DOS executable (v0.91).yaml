Name: LZEXE compressed DOS executable (v0.91)
URL: "http://fileformats.archiveteam.org/wiki/LZEXE"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0\0\x02\0"
    CaseSensitive: true
  - Pos: 17
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 21
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 24
    AsciiString: "\x1C\0\0\0LZ91"
    CaseSensitive: true
  - Pos: any
    AsciiString: "*FAB*"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LZ91"
    CaseSensitive: false
