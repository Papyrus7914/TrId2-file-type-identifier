Name: Maxon Cinema 4D Preferences (v5.0)
URL: "https://en.wikipedia.org/wiki/Cinema_4D"
FileNameExtensions: ["prf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MC50"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "PRF5"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PRF5"
    CaseSensitive: false
