Name: Logitech Modula-2 Loadable program  (v2.x)
URL: "http://www.edm2.com/index.php/Logitech_Modula-2"
FileNameExtensions: ["lod"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\x02\0\0\0\x01"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ASCII"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BASE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN"
    CaseSensitive: false
