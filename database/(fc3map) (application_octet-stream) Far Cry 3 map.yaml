Name: Far Cry 3 map
URL: "https://en.wikipedia.org/wiki/Far_Cry"
FileNameExtensions: ["fc3map"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x13\0\0\0k\n\xFD\xD2"
    CaseSensitive: true
  - Pos: any
    AsciiString: "IDATX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FC3M"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IHDR"
    CaseSensitive: false
