Name: Maxthon skin (MX1)
URL: "http://www.maxthon.com/"
FileNameExtensions: ["mskin"]
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "SKIN.INIPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".BMPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".BMPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIDE"
    CaseSensitive: false
