Name: TRS-80 DMK 8" DD disk image (write protected)
Description: Format by David Keil.
URL: "http://fileformats.archiveteam.org/wiki/DMK"
FileNameExtensions: ["dmk"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xFF]
  - Pos: 2
    AsciiString: "@)"
    CaseSensitive: true
