Name: JW Library backup
FileNameExtensions: ["jwlibrary"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "MANIFEST.JSONPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USERDATA.DBPK"
    CaseSensitive: false
