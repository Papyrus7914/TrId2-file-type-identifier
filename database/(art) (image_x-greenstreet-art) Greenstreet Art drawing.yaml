Name: Greenstreet Art drawing
URL: "http://fileformats.archiveteam.org/wiki/GST_ART"
FileNameExtensions: ["art"]
MimeType: image/x-greenstreet-art
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1]
  - Pos: any
    AsciiString: "S\0U\0M\0M\0A\0R\0Y\0I\0N\0F\0O\0R\0M\0A\0T\0I\0O\0N"
    CaseSensitive: false
  - Pos: any
    AsciiString: "P\0R\0E\0V\0I\0E\0W\0.\0D\0I\0B"
    CaseSensitive: false
  - Pos: any
    AsciiString: "R\0O\0O\0T\0 \0E\0N\0T\0R\0Y"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GREENSTREET DRAW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "C\0O\0N\0T\0E\0N\0T\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEMPLATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AW 3.5"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BLACK"
    CaseSensitive: false
