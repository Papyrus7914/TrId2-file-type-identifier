Name: CryENGINE DBATable
URL: "https://en.wikipedia.org/wiki/CryEngine"
FileNameExtensions: ["json"]
MimeType: text/json
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" ?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ANIMATION PATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DBA PATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".CAF"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".DBA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DBAS"
    CaseSensitive: false
