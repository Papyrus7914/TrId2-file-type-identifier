Name: Multimedia Builder Data
URL: "https://www.mmbuilder.ru/"
FileNameExtensions: ["mbd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 1
    AsciiString: "MMBuilder"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MMBUILDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAYER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGE"
    CaseSensitive: false
