Name: Boost serialization archive (binary, 32bit)
URL: "https://en.wikipedia.org/wiki/Boost_(C%2B%2B_libraries)"
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 4
    AsciiString: "serialization::archive"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SERIALIZATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ARCHIVE"
    CaseSensitive: false
