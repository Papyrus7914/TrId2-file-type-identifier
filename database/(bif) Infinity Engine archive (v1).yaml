Name: Infinity Engine archive (v1)
Description: Infinity Engine BIF files are archives containing game resources which are indexed by the KEY file.
URL: "http://iesdp.gibberlings3.net/file_formats/ie_formats/bif_v1.htm#bif_v1"
FileNameExtensions: ["bif"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "BIFFV1  "
    CaseSensitive: true
