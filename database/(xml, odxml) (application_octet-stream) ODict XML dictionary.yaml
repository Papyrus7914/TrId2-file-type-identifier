Name: ODict XML dictionary
URL: "http://fileformats.archiveteam.org/wiki/ODict"
FileNameExtensions: ["xml", "odxml"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DEFINITION VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENTRY TERM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SENSE POS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
