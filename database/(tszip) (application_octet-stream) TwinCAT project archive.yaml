Name: TwinCAT project archive
URL: "https://www.beckhoff.com/en-en/products/automation/twincat/"
FileNameExtensions: ["tszip"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: ".TSPROJPK"
    CaseSensitive: false
