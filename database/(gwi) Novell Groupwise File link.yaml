Name: Novell Groupwise File link
URL: "http://www.novell.com"
FileNameExtensions: ["gwi"]
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1, 0x00]
  - Pos: 1024
    AsciiString: "R\0o\0o\0t\0 \0E\0n\0t\0r\0y"
    CaseSensitive: true
  - Pos: any
    AsciiString: "S\0U\0M\0M\0A\0R\0Y\0I\0N\0F\0O\0R\0M\0A\0T\0I\0O\0N\0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "M\0E\0S\0S\0A\0G\0E\0 \0I\0D"
    CaseSensitive: false
  - Pos: any
    AsciiString: "R\0O\0O\0T\0 \0E\0N\0T\0R\0Y"
    CaseSensitive: false
  - Pos: any
    AsciiString: "I\0T\0E\0M\0 \0T\0Y\0P\0E"
    CaseSensitive: false
