Name: BT Home Hub 6 configuration
URL: "https://en.wikipedia.org/wiki/BT_Smart_Hub"
FileNameExtensions: ["bin", "cfg", "conf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "AEAD 10\0\0"
    CaseSensitive: true
  - Pos: 48
    AsciiString: "default"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DEFAULT"
    CaseSensitive: false
