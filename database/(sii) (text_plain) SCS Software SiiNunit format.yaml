Name: SCS Software SiiNunit format
Description: Used in Euro Track Simulator, American Truck Simulator.
URL: "https://www.scssoft.com/"
FileNameExtensions: ["sii"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "SiiNunit"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_JOB"
    CaseSensitive: false
