Name: CorelSHOW Background (v5)
URL: "http://fileformats.archiveteam.org/wiki/SHW_(Corel)"
FileNameExtensions: ["shb"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "RIFF"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "shl5LIST"
    CaseSensitive: true
  - Pos: 20
    AsciiString: "INFO"
    CaseSensitive: true
