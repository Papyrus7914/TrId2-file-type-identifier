Name: FinalBuilder code completion info
URL: "https://en.wikipedia.org/wiki/FinalBuilder"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "COMPLETION DEFINITIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FBCODECOMPLETION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCOPE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GLOBAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCOPES"
    CaseSensitive: false
