Name: Kawai FunLAB System Song
Description: Amiga desktop music production and education package.
FileNameExtensions: ["sng"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        e     s
    Bytes: [0x65, 0x73, 0x1F, 0xEA]
  - Pos: 68
    AsciiString: "Track 1\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TRACK 1"
    CaseSensitive: false
