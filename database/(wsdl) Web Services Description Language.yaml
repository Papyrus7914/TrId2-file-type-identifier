Name: Web Services Description Language
URL: "http://www.w3.org/TR/wsdl"
FileNameExtensions: ["wsdl"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SCHEMAS.XMLSOAP.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TARGETNAMESPACE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPERATION NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PORTTYPE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MESSAGE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFINITIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.W3.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLSCHEMA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RESPONSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUTPUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INPUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WSDL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PART"
    CaseSensitive: false
