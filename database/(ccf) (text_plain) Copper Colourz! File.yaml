Name: Copper Colourz! File
Description: Amiga colour editor, used to create Copper's colors effects.
FileNameExtensions: ["ccf"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "CCF"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CCF FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BITMAP"
    CaseSensitive: false
