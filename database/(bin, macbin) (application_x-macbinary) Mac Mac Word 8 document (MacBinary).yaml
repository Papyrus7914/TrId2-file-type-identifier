Name: Mac Mac Word 8 document (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/Microsoft_Word"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "W8BN"
    CaseSensitive: true
  - Pos: any
    AsciiString: "W8BN"
    CaseSensitive: false
