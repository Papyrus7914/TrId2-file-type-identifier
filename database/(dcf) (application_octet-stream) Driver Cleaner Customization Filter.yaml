Name: Driver Cleaner Customization Filter
URL: "https://web.archive.org/web/20050118021830/http://www.drivercleaner.net:80/"
FileNameExtensions: ["dcf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "HE3\r"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "\0\0"
    CaseSensitive: true
