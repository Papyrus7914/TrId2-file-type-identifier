Name: LSD video
Description: Used in the game Whale's Voyage 2.
URL: "https://wiki.multimedia.cx/index.php/Whale%27s_Voyage_2_LSD"
FileNameExtensions: ["lsd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "LSDF"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "GLBL"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FRAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PALI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TIME"
    CaseSensitive: false
