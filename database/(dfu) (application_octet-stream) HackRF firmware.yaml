    CaseSensitive: false
  - Pos: any
    AsciiString: "R\0U\0N\0N\0I\0N\0G\0F\0R\0O\0M\0R\0A\0M"
    CaseSensitive: false
  - Pos: any
    AsciiString: "T\0R\0A\0N\0S\0C\0E\0I\0V\0E\0R"
    CaseSensitive: false
  - Pos: any
    AsciiString: "M\0S\0F\0T\01\00\00"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HACKRFFW"
    CaseSensitive: false
  - Pos: any
