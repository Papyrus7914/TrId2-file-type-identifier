Name: Wii Binary Revolution FoNT
URL: "http://fileformats.archiveteam.org/wiki/BRFNT"
FileNameExtensions: ["brfnt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "RFN"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CMAP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CWDH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FINF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TGLP"
    CaseSensitive: false
