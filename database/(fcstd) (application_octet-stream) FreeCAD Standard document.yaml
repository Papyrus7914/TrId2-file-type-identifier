Name: FreeCAD Standard document
URL: "https://en.wikipedia.org/wiki/FreeCAD"
FileNameExtensions: ["fcstd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "GUIDOCUMENT.XMLPK"
    CaseSensitive: false
