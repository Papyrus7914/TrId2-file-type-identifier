Name: KWP multimedia Project data (Key engine)
Description: Associated to a key.dll probably by Encore Developpement SARL - used in many multimedia/demo products in the '90s.
FileNameExtensions: ["kwp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "key\04\0\0\0"
    CaseSensitive: true
