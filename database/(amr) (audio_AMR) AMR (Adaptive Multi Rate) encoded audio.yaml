Name: AMR (Adaptive Multi Rate) encoded audio
Description: Speech encoding format used in GSM telephony.
URL: "https://file-extension.net/info/amr-adaptive-multi-rate-encoded-audio-file.html"
FileNameExtensions: ["amr"]
MimeType: audio/AMR
DetectionPatterns:
  - Pos: 0
    AsciiString: "#!AMR\n"
    CaseSensitive: true
