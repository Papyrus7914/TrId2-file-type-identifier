Name: KeyGO keyboard layout
URL: "http://www.gdgsystems.com/keygo/key.html"
FileNameExtensions: ["kgo"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1]
  - Pos: 512
    AsciiString: "R\0o\0o\0t\0 \0E\0n\0t\0r\0y"
    CaseSensitive: true
  - Pos: 640
    AsciiString: "C\0o\0n\0t\0e\0n\0t\0s\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "R\0O\0O\0T\0 \0E\0N\0T\0R\0Y"
    CaseSensitive: false
  - Pos: any
    AsciiString: "C\0O\0N\0T\0E\0N\0T\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KMFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NONO3"
    CaseSensitive: false
