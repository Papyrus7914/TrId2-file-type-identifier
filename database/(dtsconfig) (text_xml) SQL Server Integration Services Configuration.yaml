Name: SQL Server Integration Services Configuration
URL: "https://en.wikipedia.org/wiki/Microsoft_SQL_Server"
FileNameExtensions: ["dtsconfig"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "DTSCONFIGURATIONFILEINFO GENERATEDBY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONFIGURATION CONFIGUREDTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATEDFROMPACKAGENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DTSCONFIGURATIONHEADING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATEDFROMPACKAGEID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONFIGUREDVALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATEDDATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERTIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUETYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERTY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SERVER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USER"
    CaseSensitive: false
