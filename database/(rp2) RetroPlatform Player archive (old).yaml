Name: RetroPlatform Player archive (old)
Description: Now changed to RP9 since RP2 was already used elsewhere.
URL: "http://www.retroplatform.com/kb/15-122"
FileNameExtensions: ["rp2"]
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "RP2-MANIFEST.XMLPK"
    CaseSensitive: false
