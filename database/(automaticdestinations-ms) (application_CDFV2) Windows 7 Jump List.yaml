Name: Windows 7 Jump List
URL: "https://www.forensicswiki.org/wiki/Jump_Lists"
FileNameExtensions: ["automaticdestinations-ms"]
MimeType: application/CDFV2
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1]
  - Pos: any
    AsciiString: "R\0O\0O\0T\0 \0E\0N\0T\0R\0Y"
    CaseSensitive: false
  - Pos: any
    AsciiString: "D\0E\0S\0T\0L\0I\0S\0T"
    CaseSensitive: false
