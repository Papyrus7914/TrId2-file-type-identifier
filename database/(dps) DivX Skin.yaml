Name: DivX Skin
URL: "http://www.divx.com/skins"
FileNameExtensions: ["dps"]
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "SKIN.DIVLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUTTONS."
    CaseSensitive: false
  - Pos: any
    AsciiString: "T.PNGPK"
    CaseSensitive: false
