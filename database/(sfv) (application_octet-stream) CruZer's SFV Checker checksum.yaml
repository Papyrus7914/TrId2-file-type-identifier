Name: CruZer's SFV Checker checksum
URL: "http://rescene.wikidot.com/csfv"
FileNameExtensions: ["sfv"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "; Generated by CruZer"
    CaseSensitive: true
  - Pos: any
    AsciiString: "S SFV CHECKER"
    CaseSensitive: false
