Name: SymbOS desktop Widget
Description: Advanced multitasking 8bit OS for various Z80 micros.
URL: "https://en.wikipedia.org/wiki/SymbOS"
FileNameExtensions: ["wdg"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 6
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 47
    AsciiString: "\0SymExe10"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DESKTOP WIDGET FOR SYMBOS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SETUP\0SETTINGS\0ABOUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OK\0CANCEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYMBIOSIS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYMEXE10"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SWG1"
    CaseSensitive: false
