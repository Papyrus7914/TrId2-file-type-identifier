Name: Khoros/Cantata Workspace
URL: "http://www.khoral.com/"
FileNameExtensions: ["wksp"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "# "
    CaseSensitive: true
  - Pos: any
    AsciiString: "VISUAL PROGRAMMING WORKSPACE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".WKSP) WAS CREATED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CURRENTLY DECLARED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WORKSPACE FILE ("
    CaseSensitive: false
  - Pos: any
    AsciiString: "NODECONNECTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VARIABLESBEGIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WORKSPACEBEGIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VARIABLESEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WORKSPACEEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONNECTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATAMANIP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOCALHOST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BY USER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFINED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GLYPH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMAG"
    CaseSensitive: false
