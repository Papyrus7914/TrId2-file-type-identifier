Name: HP PCL Soft Font / Secondary font data
Description: Used with LaserJet, PaintJet, and other PCL printers.
URL: "https://en.wikipedia.org/wiki/Printer_Command_Language"
FileNameExtensions: ["sfl", "sfp", "sft", "pjf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x1B)s"
    CaseSensitive: true
