Name: Skylanders Spyro's Adventure compressed data
FileNameExtensions: ["str"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "mrts"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "\x01\0\0\0"
    CaseSensitive: true
  - Pos: 20
    #        x
    Bytes: [0x78, 0x9C]
