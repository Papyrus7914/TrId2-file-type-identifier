Name: Windows Bitmap (v4)
Description: This variant with 108 byte DIB header (Windows 95/NT4)
URL: "https://en.wikipedia.org/wiki/BMP_file_format"
FileNameExtensions: ["bmp"]
MimeType: image/bmp
DetectionPatterns:
  - Pos: 0
    AsciiString: "BM"
    CaseSensitive: true
  - Pos: 14
    AsciiString: "l\0\0\0"
    CaseSensitive: true
