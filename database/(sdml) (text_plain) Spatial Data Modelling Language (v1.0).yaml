    CaseSensitive: false
  - Pos: any
    AsciiString: "SPEED VERT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFATTRIB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPEED ROT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXTURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
