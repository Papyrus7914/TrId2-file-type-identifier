Name: STMicroelectronics Workspace
URL: "https://github.com/stmicroelectronics"
FileNameExtensions: ["stw"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: ";\tSTMicroelectronics Workspace file"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ADDSORTEDELEMENTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ST7WORKSPACE-V0.7"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ACTIVEPROJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ACTIVECONFIG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEPENDENCIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KEYWORD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".STP"
    CaseSensitive: false
