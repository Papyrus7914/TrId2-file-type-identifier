Name: HS2 zipped bitmap(s) archive
URL: "http://fileformats.archiveteam.org/wiki/HS2_(POSTERING)"
FileNameExtensions: ["hsz"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PK\x03\x04\n\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".HS2PK"
    CaseSensitive: false
