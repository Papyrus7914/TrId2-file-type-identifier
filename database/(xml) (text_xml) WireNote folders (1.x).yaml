Name: WireNote folders (1.x)
URL: "https://code.google.com/archive/p/wiredplane-wintools/"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version='1.0' encoding='"
    CaseSensitive: true
  - Pos: any
    AsciiString: "COLLAPSED VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRIORITY VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREATED VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STATE VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ICON VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FOLDER0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FOLDERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ITEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH"
    CaseSensitive: false
