Name: Fine Artist Sound
URL: "https://en.wikipedia.org/wiki/Fine_Artist"
FileNameExtensions: ["snd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "CHNK"
    CaseSensitive: true
  - Pos: 34
    AsciiString: "SND "
    CaseSensitive: true
  - Pos: 44
    AsciiString: "PCM "
    CaseSensitive: true
  - Pos: any
    AsciiString: "ATAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CSRO"
    CaseSensitive: false
