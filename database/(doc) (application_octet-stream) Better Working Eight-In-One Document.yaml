Name: Better Working Eight-In-One Document
Description: An old DOS integrated suite by Spinnaker Software Corp.
FileNameExtensions: ["doc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xFEB\n"
    CaseSensitive: true
  - Pos: 4
    AsciiString: "\ndn"
    CaseSensitive: true
