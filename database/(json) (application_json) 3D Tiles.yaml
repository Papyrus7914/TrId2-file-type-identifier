Name: 3D Tiles
URL: "http://fileformats.archiveteam.org/wiki/3D_Tiles"
FileNameExtensions: ["json"]
MimeType: application/json
DetectionPatterns:
  - Pos: 0
    AsciiString: "{"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BOUNDINGVOLUME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GEOMETRICERROR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ASSET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROOT"
    CaseSensitive: false
