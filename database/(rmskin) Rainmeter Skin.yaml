Name: Rainmeter Skin
URL: "http://rainmeter.net/"
FileNameExtensions: ["rmskin"]
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "RMSKIN.INIPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SKINS"
    CaseSensitive: false
