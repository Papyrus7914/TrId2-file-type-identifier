Name: Chartist flowchart
URL: "http://fileformats.archiveteam.org/wiki/Chartist_(Novagraph)"
FileNameExtensions: ["cht"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        x
    Bytes: [0x78, 0x88]
  - Pos: 3
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0\0\0\0\0\x90\x01\0\0\0\0"
    CaseSensitive: true
  - Pos: 55
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 57
    AsciiString: "\0\0\0\0\0\x90\x01\0\0\0\0"
    CaseSensitive: true
