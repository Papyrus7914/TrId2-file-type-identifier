Name: MusicTime score (v3.x)
Description: Music score editor for Win 3.x by Passport Inc.
FileNameExtensions: ["mus"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MTIW"
    CaseSensitive: true
  - Pos: any
    AsciiString: "COLR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FONT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LINE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MEAS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PREC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TK00"
    CaseSensitive: false
