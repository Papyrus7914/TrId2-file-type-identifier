Name: MageSlayer game data archive
URL: "https://en.wikipedia.org/wiki/MageSlayer"
FileNameExtensions: ["vpk"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Mage"
    CaseSensitive: true
  - Pos: 34
    #              V     P     K
    Bytes: [0x1A, 0x56, 0x50, 0x4B, 0x01, 0x01]
