Name: LocoScript PC installation data (v1.x)
URL: "https://en.wikipedia.org/wiki/LocoScript"
FileNameExtensions: ["1", "2", "3"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "INS\x01\x01LocoScript PC v 1."
    CaseSensitive: true
  - Pos: 101
    AsciiString: "LSPC"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LOCOMOTIVE SOFTWARE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOCOSCRIPT PC V 1."
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISTRIBUTION FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LSPC"
    CaseSensitive: false
