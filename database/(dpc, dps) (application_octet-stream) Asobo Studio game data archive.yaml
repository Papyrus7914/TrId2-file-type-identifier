Name: Asobo Studio game data archive
URL: "https://www.mobygames.com/company/asobo-studio-sarl"
FileNameExtensions: ["dpc", "dps"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "v1."
    CaseSensitive: true
  - Pos: any
    AsciiString: "- ASOBO STUDIO - INTERNAL CROSS TECHNOLOGY"
    CaseSensitive: false
