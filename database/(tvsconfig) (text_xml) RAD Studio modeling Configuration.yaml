Name: RAD Studio modeling Configuration
URL: "https://en.wikipedia.org/wiki/Delphi_(software)#RAD_Studio"
FileNameExtensions: ["tvsconfig"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SUBLEVELDISABLED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TGCONFIG VERSION"
    CaseSensitive: false
