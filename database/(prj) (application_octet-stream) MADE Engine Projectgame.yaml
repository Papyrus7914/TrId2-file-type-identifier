Name: MADE Engine Project/game
URL: "https://en.wikipedia.org/wiki/Multimedia_Applications_Development_Environment"
FileNameExtensions: ["prj"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PROJ"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "DDIT"
    CaseSensitive: true
  - Pos: 26
    AsciiString: "FREE"
    CaseSensitive: true
  - Pos: 50
    AsciiString: "ARCH"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FLEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SNDS"
    CaseSensitive: false
