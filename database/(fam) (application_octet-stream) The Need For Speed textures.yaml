Name: The Need For Speed textures
URL: "https://en.wikipedia.org/wiki/The_Need_for_Speed"
FileNameExtensions: ["fam"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "wwww\x04\0\0\0\x18\0\0\0"
    CaseSensitive: true
  - Pos: 24
    AsciiString: "wwww"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NON-SORT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HORZ"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ORIP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHPI"
    CaseSensitive: false
