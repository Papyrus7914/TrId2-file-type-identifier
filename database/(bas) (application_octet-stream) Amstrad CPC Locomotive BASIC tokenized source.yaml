Name: Amstrad CPC Locomotive BASIC tokenized source
URL: "https://en.wikipedia.org/wiki/Locomotive_BASIC"
FileNameExtensions: ["bas"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "BAS"
    CaseSensitive: true
  - Pos: 18
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 26
    AsciiString: "\0\0"
    CaseSensitive: true
