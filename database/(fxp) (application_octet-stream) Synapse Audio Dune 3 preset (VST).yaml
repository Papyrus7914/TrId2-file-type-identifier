Name: Synapse Audio Dune 3 preset (VST)
URL: "https://www.synapse-audio.com/dune3.html"
FileNameExtensions: ["fxp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "CcnK"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "FPCh\0\0\0\x01DNE3"
    CaseSensitive: true
  - Pos: 60
    AsciiString: "ngis"
    CaseSensitive: true
  - Pos: 92
    #        x
    Bytes: [0x78, 0x9C, 0xED]
  - Pos: any
    AsciiString: "DNE3"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FPCH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NGIS"
    CaseSensitive: false
