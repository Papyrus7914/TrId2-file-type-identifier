Name: LP Ripper Track data
URL: "https://web.archive.org/web/20230603084152/https://cfbsoftware.com/lpripper/WhatsNew.htm"
FileNameExtensions: ["trk"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "LP Ripper\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TRACK 1"
    CaseSensitive: false
