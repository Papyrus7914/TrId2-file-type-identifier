Name: Affymetrix GeneChip CEL - XDA/Binary Format (v4, GCOS)
URL: "https://www.affymetrix.com"
FileNameExtensions: ["cel"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "@\0\0\0\x04\0\0\0"
    CaseSensitive: true
  - Pos: 24
    AsciiString: "Cols="
    CaseSensitive: true
  - Pos: any
    AsciiString: "COLS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROWS"
    CaseSensitive: false
