Name: Sonix video
Description: Apparently used in some video surveillance cameras.
FileNameExtensions: ["snx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        0     &           u           f                                               b           l
    Bytes: [0x30, 0x26, 0xB2, 0x75, 0x8E, 0x66, 0xCF, 0x11, 0xA6, 0xD9, 0x00, 0xAA, 0x00, 0x62, 0xCE, 0x6C]
  - Pos: 44
    AsciiString: "Seh"
    CaseSensitive: true
  - Pos: 285
    AsciiString: "SNX "
    CaseSensitive: true
  - Pos: 573
    AsciiString: "S\0O\0N\0i\0X\0 \0V\0i\0d\0e\0o\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "S\0O\0N\0I\0X\0 \0V\0I\0D\0E\0O"
    CaseSensitive: false
  - Pos: any
    AsciiString: "M\0S\0 \0A\0D\0P\0C\0M"
    CaseSensitive: false
