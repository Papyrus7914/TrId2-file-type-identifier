Name: NO$SNS configuration (v1.x, Win)
URL: "https://problemkaputt.de/sns.htm"
FileNameExtensions: ["ini"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: ";no$sns 1."
    CaseSensitive: true
  - Pos: 11
    AsciiString: " generated config file - do not edit\r\n"
    CaseSensitive: true
