Name: DCTV encoded ILBM bitmap
URL: "http://amiga.resource.cx/exp/dctv"
FileNameExtensions: ["dctv", "ilbm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "ILBMBMHD"
    CaseSensitive: true
  - Pos: any
    AsciiString: "WRITTEN BY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DCTV"
    CaseSensitive: false
