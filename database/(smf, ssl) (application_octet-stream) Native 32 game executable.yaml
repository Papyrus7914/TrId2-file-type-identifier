Name: Native 32 game executable
URL: "https://bootleggames.fandom.com/wiki/Native_32"
FileNameExtensions: ["smf", "ssl"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "_YUVGamemaker 1."
    CaseSensitive: true
  - Pos: any
    AsciiString: "_YUVGAMEMAKER 1."
    CaseSensitive: false
  - Pos: any
    AsciiString: "NA32"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLAY"
    CaseSensitive: false
