Name: Genius Menu Maker Menu
FileNameExtensions: ["gmk"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MENU_NO : "
    CaseSensitive: true
  - Pos: any
    AsciiString: "OPTION_NO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KEYS_NO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MENU_NO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KEY_NO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-OPT-"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BEGIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIDEO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "X_LOC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "Y_LOC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-K1-"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-M1-"
    CaseSensitive: false
