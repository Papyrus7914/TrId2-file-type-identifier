Name: WinOLS project
URL: "https://www.evc.de/en/product/ols/software/"
FileNameExtensions: ["ols"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\v\0\0\0WinOLS File"
    CaseSensitive: true
  - Pos: any
    AsciiString: "WINOLS FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ORIGINAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEXDUMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".OLS"
    CaseSensitive: false
