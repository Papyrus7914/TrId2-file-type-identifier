Name: NEONnoir game data
URL: "https://steamknight.itch.io/neonnoir"
FileNameExtensions: ["neon"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "NEON"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "LOCS"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LOCS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RGNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRG"
    CaseSensitive: false
