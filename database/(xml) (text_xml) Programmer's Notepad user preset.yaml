Name: Programmer's Notepad user preset
URL: "http://www.pnotepad.org/"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "OVERRIDE-COLOURS CARET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OVERRIDE-CLASSES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INDENTGUIDES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PREPROCESSOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USERSETTINGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STYLE-CLASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IDENTIFIER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPERATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KEYWORD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUMBER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ERROR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BACK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BOLD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRUE"
    CaseSensitive: false
