Name: NovoTrade Packer module
Description: Module packer created by NovoTrade.
URL: "http://www.exotica.org.uk/wiki/NovoTrade_Packer"
FileNameExtensions: ["ntp"]
MimeType: audio/x-mod
DetectionPatterns:
  - Pos: 0
    AsciiString: "MODU"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BODY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RPLD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAMP"
    CaseSensitive: false
