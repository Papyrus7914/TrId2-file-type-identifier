Name: ASEAM 2 Plant Input Screen/Data
Description: A Simplified Energy Analysis Method, for DOS.
FileNameExtensions: ["pis"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "AS2 PLANT INPUT SCREEN"
    CaseSensitive: true
  - Pos: any
    AsciiString: "AS2 PLANT INPUT SCREEN"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PIS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
