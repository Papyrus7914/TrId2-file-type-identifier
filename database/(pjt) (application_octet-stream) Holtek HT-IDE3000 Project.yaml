Name: Holtek HT-IDE3000 Project
URL: "https://www.holtek.com/"
FileNameExtensions: ["pjt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "H\0T\0P"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "\0:\0\\\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CFRAMESTATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "H\0T\0I\0D\0E\08"
    CaseSensitive: false
  - Pos: any
    AsciiString: "W\0A\0T\0C\0H\01"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".\0A\0S\0M"
    CaseSensitive: false
