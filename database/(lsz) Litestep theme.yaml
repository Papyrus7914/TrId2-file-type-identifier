Name: Litestep theme
URL: "http://www.litestep.net/"
FileNameExtensions: ["lsz"]
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "CONFIG"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PNGPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".RCPK"
    CaseSensitive: false
