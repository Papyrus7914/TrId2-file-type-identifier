Name: Apple Interface Builder Storyboard document
URL: "https://en.wikipedia.org/wiki/Interface_Builder"
FileNameExtensions: ["storyboard"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "COM.APPLE.INTERFACEBUILDER."
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERTYACCESSCONTROL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLUGIN IDENTIFIER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIEWCONTROLLER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCUMENT TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCENE SCENEID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TARGETRUNTIME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEPENDENCIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOOLSVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".STORYBOARD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OBJECTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCENES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COCOA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTO"
    CaseSensitive: false
