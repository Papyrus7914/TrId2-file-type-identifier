Name: WinAPE Snapshot (v3)
Description: The format was first defined for the CPCEMU emulator.
URL: "http://cpctech.cpc-live.com/docs/snapshot.html"
FileNameExtensions: ["sna"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MV - SNA\0\0\0\0\0\0\0\0\x03"
    CaseSensitive: true
