Name: NO$CPC Configuration (v1.x)
URL: "https://problemkaputt.de/cpc.htm"
FileNameExtensions: ["cfg"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: ";no$cpc 1."
    CaseSensitive: true
  - Pos: 11
    AsciiString: " generated config file - do not edit\r\n"
    CaseSensitive: true
