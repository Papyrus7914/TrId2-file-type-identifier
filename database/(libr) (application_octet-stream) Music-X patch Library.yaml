Name: Music-X patch Library
Description: Amiga sequencer.
URL: "http://www.retrocastaway.com/retro-computing/music-x-making-music-on-the-amiga-in-the-80s/"
FileNameExtensions: ["libr"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "MSCXFORM"
    CaseSensitive: true
  - Pos: 20
    AsciiString: "LIBRLIBH"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SOUNDS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VOICES"
    CaseSensitive: false
