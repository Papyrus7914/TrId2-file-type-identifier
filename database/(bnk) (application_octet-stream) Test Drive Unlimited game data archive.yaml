Name: Test Drive Unlimited game data archive
URL: "https://en.wikipedia.org/wiki/Test_Drive_Unlimited"
FileNameExtensions: ["bnk"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "@\0\0\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "KNAB\0\0\0\0\0\0\0\0"
    CaseSensitive: true
