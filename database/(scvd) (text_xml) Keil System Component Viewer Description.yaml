Name: Keil System Component Viewer Description
URL: "https://www.keil.com/support/"
FileNameExtensions: ["scvd"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"utf-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NAME AND VERSION OF THE COMPONENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPONENT_VIEWER SCHEMAVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NONAMESPACESCHEMALOCATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPONENT_VIEWER.XSD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLSCHEMA-INSTANCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPONENT NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.W3.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EVENTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "1.0.0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "2001"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
