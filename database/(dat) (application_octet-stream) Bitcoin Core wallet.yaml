Name: Bitcoin Core wallet
Description: Was known as Bitcoin-Qt up 'till 2014.
URL: "https://bitcoincore.org/"
FileNameExtensions: ["dat"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 1
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "\0\0\0\0\0b1\x05\0\t\0\0\0\0"
    CaseSensitive: true
  - Pos: 22
    AsciiString: "\0\0\0\t\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MINVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BESTBLOCK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POOL"
    CaseSensitive: false
