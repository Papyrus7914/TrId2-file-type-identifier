Name: Calera/Toshiba Tagged Document Format (header)
Description: Each document start with a .FAX file, then .nnn for each page.
FileNameExtensions: ["fax"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "TDFI\x10\0\x01\0\0\0\0\0\0\0\0\0DOC\xF0"
    CaseSensitive: true
