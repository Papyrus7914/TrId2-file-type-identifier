Name: MusicEdit score
Description: Software for Atari ST by Prof. Herbert Walz.
FileNameExtensions: ["mus"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "blatt\0"
    CaseSensitive: true
  - Pos: 266
    AsciiString: "titel\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TITEL"
    CaseSensitive: false
