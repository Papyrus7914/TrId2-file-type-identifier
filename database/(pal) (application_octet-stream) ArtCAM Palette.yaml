Name: ArtCAM Palette
URL: "https://en.wikipedia.org/wiki/Delcam"
FileNameExtensions: ["pal"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\r\n  ArtCAM "
    CaseSensitive: true
  - Pos: any
    AsciiString: "M_PALETTE FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODEL"
    CaseSensitive: false
