Name: Visual Studio C# Project (UTF-8)
URL: "https://en.wikipedia.org/wiki/Microsoft_Visual_Studio"
FileNameExtensions: ["csproj"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    #                          <
    Bytes: [0xEF, 0xBB, 0xBF, 0x3C]
  - Pos: any
    AsciiString: "REFERENCE INCLUDE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERTYGROUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ASSEMBLYNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MICROSOFT."
    CaseSensitive: false
  - Pos: any
    AsciiString: "ITEMGROUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLATFORM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TARGET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUILD"
    CaseSensitive: false
