Name: PowerCD Multimedia format
URL: "http://fileformats.archiveteam.org/wiki/ZCI"
FileNameExtensions: ["zci"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "CRRW"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CRCW"
    CaseSensitive: false
