Name: Wallpaper engine Texture
URL: "https://github.com/Almamu/linux-wallpaperengine/"
FileNameExtensions: ["tex"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "TEXV0005\0TEXI0001\0"
    CaseSensitive: true
  - Pos: 45
    AsciiString: "\xFFTEXB000"
    CaseSensitive: true
  - Pos: 54
    AsciiString: "\0"
    CaseSensitive: true
