Name: Macintosh OS X Data Fork Font
URL: "http://fileformats.archiveteam.org/wiki/Macintosh_resource_file"
FileNameExtensions: ["dfont"]
MimeType: application/x-dfont
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0\x01\0\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CMAP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FOND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAXP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SFNT"
    CaseSensitive: false
