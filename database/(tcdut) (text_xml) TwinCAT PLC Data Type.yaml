Name: TwinCAT PLC Data Type
URL: "https://www.beckhoff.com/en-en/products/automation/twincat/"
FileNameExtensions: ["tcdut"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xEF\xBB\xBF<?xml version=\"1.0\" encoding=\"utf-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TCPLCOBJECT VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DECLARATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DUT NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "END_TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CDATA"
    CaseSensitive: false
