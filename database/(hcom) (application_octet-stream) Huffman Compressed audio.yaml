Name: Huffman Compressed audio
Description: 8 bit RAW audio compressed format used on Macintosh.
FileNameExtensions: ["hcom"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\x01A\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "FSSD"
    CaseSensitive: true
  - Pos: 128
    AsciiString: "HCOM"
    CaseSensitive: true
