Name: ARJ self-extracting archive
URL: "https://en.wikipedia.org/wiki/ARJ"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0\0\0\x02\0"
    CaseSensitive: true
  - Pos: 12
    Bytes: [0xFF, 0xFF]
  - Pos: 16
    AsciiString: "\x80\0\0\0\x0E\0"
    CaseSensitive: true
  - Pos: 24
    AsciiString: "\x1C\0\0\0RJSX\xFF\xFF\xBA"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ARJSFX"
    CaseSensitive: false
