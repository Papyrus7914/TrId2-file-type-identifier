    CaseSensitive: true
  - Pos: 17
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 39
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 43
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 51
    AsciiString: "\0"
    CaseSensitive: true
