Name: RealLegal E-Transcript
Description: E-Transcript of Court proceedings.
URL: "https://legal.thomsonreuters.com/en/products/reallegal"
FileNameExtensions: ["ptx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 3
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 10
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TRANSCRIPT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPANY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGEHDR"
    CaseSensitive: false
