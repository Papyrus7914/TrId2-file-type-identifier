Name: Matrox MGA Mystique BIOS
URL: "https://dosdays.co.uk/topics/Manufacturers/matrox/mystique.php"
FileNameExtensions: ["bin"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        U           @           {
    Bytes: [0x55, 0xAA, 0x40, 0xEB, 0x7B, 0x18]
  - Pos: 18
    AsciiString: "\xFF\xFF\0\0\0\0`\0\0\0\0 IBM COMPATIBLE MATROX/MYSTIQUE  VGA/VBE BIOS (V"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MATROX GRAPHICS INC.\0MATROX\0MYSTIQUE\000\0VBE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COPYRIGHT (C) LSI LOGIC CORPORATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MATROX POWER GRAPHICS ACCELERATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IBM COMPATIBLE MATROX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MYSTIQUE  VGA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VBE BIOS (V"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MGA SERIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION V"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REVISION"
    CaseSensitive: false
