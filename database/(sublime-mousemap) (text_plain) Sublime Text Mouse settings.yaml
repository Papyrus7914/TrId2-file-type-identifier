Name: Sublime Text Mouse settings
URL: "https://en.wikipedia.org/wiki/Sublime_Text"
FileNameExtensions: ["sublime-mousemap"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "["
    CaseSensitive: true
  - Pos: any
    AsciiString: "PRESS_COMMAND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRESS_ARGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODIFIERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUTTON1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DRAG"
    CaseSensitive: false
