Name: PowerDesigner WorkSpace
URL: "http://en.wikipedia.org/wiki/PowerDesigner"
FileNameExtensions: ["sws"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "-- DO NOT EDIT THIS FILE --"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POWERDESIGNER SIGNATURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BROWSERMODULE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOCAL EXPANDED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODEL EXPANDED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REPOSITORY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WORKSPACE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
