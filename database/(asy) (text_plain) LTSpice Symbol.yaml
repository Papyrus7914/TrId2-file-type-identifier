Name: LTSpice Symbol
URL: "https://en.wikipedia.org/wiki/LTspice"
FileNameExtensions: ["asy"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "Version 4"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PINATTR PINNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYMBOLTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NORMAL"
    CaseSensitive: false
