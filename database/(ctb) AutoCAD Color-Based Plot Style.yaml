Name: AutoCAD Color-Based Plot Style
URL: "http://en.wikipedia.org/wiki/AutoCAD"
FileNameExtensions: ["ctb"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "PIAFILEVERSION_2.0,CTBVER1,compress\r\npmzlibcodec"
    CaseSensitive: true
  - Pos: 54
    Bytes: [0x01, 0x00]
  - Pos: 58
    AsciiString: "\0\0x\xDA"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PIAFILEVERSION_2.0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PMZLIBCODEC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPRESS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CTBVER1"
    CaseSensitive: false
