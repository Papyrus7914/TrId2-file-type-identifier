Name: AZZ Cardfile index
URL: "http://www.azzcardfile.biz"
FileNameExtensions: ["~i"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<~AZZ CARDFILE AZZ FILE VERSION~>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "~AZZ CARDFILE AZZ FILE VERSION~"
    CaseSensitive: false
  - Pos: any
    AsciiString: "~LAST OPEN~"
    CaseSensitive: false
  - Pos: any
    AsciiString: "~CREATED~"
    CaseSensitive: false
  - Pos: any
    AsciiString: "~TITLE~"
    CaseSensitive: false
  - Pos: any
    AsciiString: "~SIZ~"
    CaseSensitive: false
  - Pos: any
    AsciiString: "~UID~"
    CaseSensitive: false
  - Pos: any
    AsciiString: "~ADR~"
    CaseSensitive: false
