    AsciiString: "SETUP_HOLD_DETECTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIMULATION_COVERAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIMULATOR_SETTINGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GLITCH_DETECTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GLITCH_INTERVAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIMULATION_MODE"
    CaseSensitive: false
