Name: Capella CapXML music notation (zipped)
URL: "http://fileformats.archiveteam.org/wiki/CapXML"
FileNameExtensions: ["capx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "score.xml"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SCORE.XML"
    CaseSensitive: false
