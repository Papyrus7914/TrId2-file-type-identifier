Name: StarOffice StarCalc spreadsheet
Description: Old format version, before OpenDocument.
URL: "https://en.wikipedia.org/wiki/StarOffice"
FileNameExtensions: ["sdc"]
MimeType: application/vnd.stardivision.calc
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1, 0x00]
