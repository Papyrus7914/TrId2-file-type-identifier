    CaseSensitive: false
  - Pos: any
    AsciiString: "S\0F\0X\0S\0T\0Y\0L\0E\0S\0H\0E\0E\0T\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EDITENGINEITEMPOOL"
    CaseSensitive: false
