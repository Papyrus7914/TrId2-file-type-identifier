Name: Video Music Box Progression
FileNameExtensions: ["prgn"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "PRGNPRHD"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PGC0"
    CaseSensitive: false
