Name: Borland TLink Overlay
Description: Used for example by Turbo C and Borland C++.
FileNameExtensions: ["ovr"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "\0 \0"
    CaseSensitive: true
  - Pos: 11
    AsciiString: "\0\xFF\xFF\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 21
    AsciiString: "\0\0\0\"\0\0\0\x01\0\xFB\x10rj\b\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "THIS OVERLAY SHOULD NOT BE RUN FROM DOS"
    CaseSensitive: false
