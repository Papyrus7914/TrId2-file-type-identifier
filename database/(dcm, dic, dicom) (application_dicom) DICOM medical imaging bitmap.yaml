Name: DICOM medical imaging bitmap
URL: "https://en.wikipedia.org/wiki/DICOM#Data_format"
FileNameExtensions: ["dcm", "dic", "dicom"]
MimeType: application/dicom
DetectionPatterns:
  - Pos: 128
    AsciiString: "DICM"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DICM"
    CaseSensitive: false
