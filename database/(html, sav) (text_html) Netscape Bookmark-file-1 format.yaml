Name: Netscape Bookmark-file-1 format
URL: "https://en.wikipedia.org/wiki/Netscape"
FileNameExtensions: ["html", "sav"]
MimeType: text/html
DetectionPatterns:
  - Pos: 0
    AsciiString: "<!DOCTYPE NETSCAPE-Bookmark-file-1>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "-- THIS IS AN AUTOMATICALLY GENERATED FILE."
    CaseSensitive: false
  - Pos: any
    AsciiString: "IT WILL BE READ AND OVERWRITTEN."
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAST_MODIFIED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DO NOT EDIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BOOKMARKS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ADD_DATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
