Name: Eclipse Project settings
URL: "https://en.wikipedia.org/wiki/Eclipse_(software)"
FileNameExtensions: ["project"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ORG.ECLIPSE.CDT.CORE.CNATURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECTDESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUILDCOMMAND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ARGUMENTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUILDER.C"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUILDSPEC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NATURES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
