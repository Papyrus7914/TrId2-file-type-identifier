Name: SVArTracker module
URL: "http://www.svarsoft.com/st.html"
FileNameExtensions: ["svar"]
MimeType: audio/x-mod
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "SONGDATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VER02PK"
    CaseSensitive: false
