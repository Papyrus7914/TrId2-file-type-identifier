Name: Lotus Organizer Report
URL: "https://en.wikipedia.org/wiki/IBM_Lotus_Organizer"
FileNameExtensions: ["rep"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        \t    (
    Bytes: [0x09, 0x28, 0x90, 0x1B]
  - Pos: 5
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "\0\x01\0Reporter\0                       "
    CaseSensitive: true
  - Pos: any
    AsciiString: "REPORTER"
    CaseSensitive: false
