Name: Motocross Madness Scene (walls)
URL: "https://www.mobygames.com/game/1235/motocross-madness/"
FileNameExtensions: ["scn"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "[Walls]\r\nNumberOfPoints="
    CaseSensitive: true
  - Pos: any
    AsciiString: "ALLOWCROWDSOUND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCENEINFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCENENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POINTX1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POINTZ1"
    CaseSensitive: false
