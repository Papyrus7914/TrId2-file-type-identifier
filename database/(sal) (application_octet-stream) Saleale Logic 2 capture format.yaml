Name: Saleale Logic 2 capture format
URL: "https://discuss.saleae.com/t/logic-2-capture-format-sal/1858"
FileNameExtensions: ["sal"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "META.JSONPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-0.BINPK"
    CaseSensitive: false
