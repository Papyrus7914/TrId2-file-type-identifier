Name: Oric disk image
Description: An older format used by various Oric emulators.
URL: "http://wiki.defence-force.org/doku.php?id=oric:hardware:dsk_disk_format"
FileNameExtensions: ["dsk"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "ORICDISK"
    CaseSensitive: true
