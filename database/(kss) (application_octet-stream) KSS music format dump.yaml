Name: KSS music format dump
Description: The KSS format is mostly used for audio ripped from MSX systems, but also from Sega Master System or Sega Game Gear games.
URL: "http://fileformats.archiveteam.org/wiki/KSS"
FileNameExtensions: ["kss"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "KSCC"
    CaseSensitive: true
