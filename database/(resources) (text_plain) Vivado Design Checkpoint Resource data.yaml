Name: Vivado Design Checkpoint Resource data
URL: "https://en.wikipedia.org/wiki/Vivado"
FileNameExtensions: ["resources"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "LUT:"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GLOBAL_CLOCK_BUFFERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LUTASLOGIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LUTASMEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BRAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MMCM"
    CaseSensitive: false
