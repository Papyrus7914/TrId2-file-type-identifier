Name: IFF 24-bit RGB bitmap
Description: Amiga format, used by Impulse's software.
URL: "http://fileformats.archiveteam.org/wiki/ILBM"
FileNameExtensions: ["iff", "rgb8"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "RGB8"
    CaseSensitive: true
