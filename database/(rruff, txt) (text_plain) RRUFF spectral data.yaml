Name: RRUFF spectral data
URL: "https://rruff.info/"
FileNameExtensions: ["rruff", "txt"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "##NAMES="
    CaseSensitive: true
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOCALITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RRUFFID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOURCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STATUS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OWNER"
    CaseSensitive: false
