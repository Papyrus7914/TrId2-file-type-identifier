Name: HTTP Archive format
URL: "https://en.wikipedia.org/wiki/.har"
FileNameExtensions: ["har"]
MimeType: text/json
DetectionPatterns:
  - Pos: 0
    AsciiString: "{"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CREATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENTRIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
