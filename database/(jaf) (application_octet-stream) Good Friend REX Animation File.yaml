Name: Good Friend REX Animation File
Description: Used in the game Good Friend Rex by KidNkiD - Korea.
FileNameExtensions: ["jaf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "HProject Character Tool Ver 3.0\0-- Animation File --\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".JSF"
    CaseSensitive: false
