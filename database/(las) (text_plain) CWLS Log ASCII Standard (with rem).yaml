    AsciiString: "CWLS LOG ASCII STANDARD -"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNIQUE WELL ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PER DEPTH S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOCATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROVINCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPANY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SERVICE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FIELD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NULL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SRVC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STEP"
    CaseSensitive: false
