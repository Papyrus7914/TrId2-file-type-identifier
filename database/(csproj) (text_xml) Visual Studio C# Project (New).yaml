Name: Visual Studio C# Project (New)
URL: "https://en.wikipedia.org/wiki/Microsoft_Visual_Studio"
FileNameExtensions: ["csproj"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TARGETFRAMEWORK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERTYGROUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT SDK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MICROSOFT."
    CaseSensitive: false
  - Pos: any
    AsciiString: "T.NET.SDK"
    CaseSensitive: false
