Name: "Phoenix: Ashes to Ashes Blueprint"
URL: "https://www.mobygames.com/game/7754/phoenix/"
FileNameExtensions: ["bpl"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xFF\xFF\x01\0\n\0CBluePrint"
    CaseSensitive: true
  - Pos: 17
    AsciiString: "\0\0\0\xFF\xFF\x01\0\x06\0CBlock"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CBLOCK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".BPL"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".LWO"
    CaseSensitive: false
