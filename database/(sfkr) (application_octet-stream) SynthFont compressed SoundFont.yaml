Name: SynthFont compressed SoundFont
URL: "https://www.synthfont.com/"
FileNameExtensions: ["sfkr"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "RIFF"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "sfkrLIST"
    CaseSensitive: true
  - Pos: 84
    AsciiString: "CRC3"
    CaseSensitive: true
  - Pos: 106
    AsciiString: "LIST"
    CaseSensitive: true
  - Pos: 126
    AsciiString: "kr01"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SFKRLISTV"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFOIFIL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CRC3"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GUID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KR01"
    CaseSensitive: false
