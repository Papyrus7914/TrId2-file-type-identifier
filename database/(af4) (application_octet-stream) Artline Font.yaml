Name: Artline Font
URL: "https://en.wikipedia.org/wiki/Graphics_Environment_Manager#Artline"
FileNameExtensions: ["af4"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x04, 0x00]
  - Pos: 14
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".AF4"
    CaseSensitive: false
