Name: Quattro Pro spreadsheet
URL: "https://en.wikipedia.org/wiki/Quattro_Pro"
FileNameExtensions: ["wb1", "wb2"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0\x02\0"
    CaseSensitive: true
  - Pos: 5
    Bytes: [0x10]
  - Pos: 7
    AsciiString: "\0\x02\0"
    CaseSensitive: true
  - Pos: 13
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 15
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 19
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 25
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ACTIVE GRAPH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LEGEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "D\02\0X"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LABEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ORMA"
    CaseSensitive: false
