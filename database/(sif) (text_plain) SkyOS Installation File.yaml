Name: SkyOS Installation File
URL: "https://en.wikipedia.org/wiki/SkyOS"
FileNameExtensions: ["sif"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "[GENERAL]"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SKYOS INSTALLATION FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULTPATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COPYRIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PACKAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRODUCT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DETAIL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAGIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
