Name: Bootable Mac HFS Volume/Disk image
FileNameExtensions: ["dsk", "hfv"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "LK`\0\0\x86"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "\0\0\x06System"
    CaseSensitive: true
  - Pos: 26
    AsciiString: "\x06Finder"
    CaseSensitive: true
