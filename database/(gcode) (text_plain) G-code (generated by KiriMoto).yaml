Name: G-code (generated by Kiri:Moto)
URL: "https://grid.space/kiri/"
FileNameExtensions: ["gcode"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "; Generated by Kiri:Moto "
    CaseSensitive: true
  - Pos: any
    AsciiString: "--- FILAMENT USED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "--- SHUTDOWN ---"
    CaseSensitive: false
  - Pos: any
    AsciiString: "--- PROCESS ---"
    CaseSensitive: false
  - Pos: any
    AsciiString: "--- STARTUP ---"
    CaseSensitive: false
  - Pos: any
    AsciiString: "--- PRINT TIME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "--- LAYER 0"
    CaseSensitive: false
