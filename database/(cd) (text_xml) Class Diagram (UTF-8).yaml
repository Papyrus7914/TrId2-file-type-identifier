Name: Class Diagram (UTF-8)
FileNameExtensions: ["cd"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xEF\xBB\xBF<?xml version=\"1.0\" encoding=\"utf-8\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "CLASSDIAGRAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAJORVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MINORVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLASS NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POSITION X"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NT NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IDEN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
