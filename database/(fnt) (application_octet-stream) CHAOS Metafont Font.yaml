Name: CHAOS Metafont Font
Description: Fractal software for DOS by Autodesk.
URL: "https://github.com/rudyrucker/chaos"
FileNameExtensions: ["fnt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x02, 0x01]
  - Pos: 49
    AsciiString: "\0METAFONTP\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "METAFONTP"
    CaseSensitive: false
