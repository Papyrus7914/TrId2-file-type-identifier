Name: AutoIt script
URL: "http://en.wikipedia.org/wiki/AutoIt"
FileNameExtensions: ["script"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "["
    CaseSensitive: true
  - Pos: 2
    AsciiString: "ain]\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "%SCRIPTFILE%"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INTERFACE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOWNLOAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SELECTED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROCESS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTHOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FALSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LABEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LEVEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHELL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".EXE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOOL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRUE"
    CaseSensitive: false
