Name: Outlook Shortcuts
URL: "http://www.microsoft.com/outlook"
FileNameExtensions: ["fav"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "\t\0F\0a\0v\0P\0l\0a\0c\0e\0s"
    CaseSensitive: true
  - Pos: any
    AsciiString: "D\0E\0L\0E\0T\0E\0D\0 \0I\0T\0E\0M\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "M\0Y\0 \0C\0O\0M\0P\0U\0T\0E\0R"
    CaseSensitive: false
  - Pos: any
    AsciiString: "F\0A\0V\0P\0L\0A\0C\0E\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "F\0A\0V\0O\0R\0I\0T\0E\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "C\0A\0L\0E\0N\0D\0A\0R"
    CaseSensitive: false
  - Pos: any
    AsciiString: "C\0O\0N\0T\0A\0C\0T\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "I\0N\0B\0O\0X"
    CaseSensitive: false
  - Pos: any
    AsciiString: "T\0A\0S\0K\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "N\0A\0L"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".DLL"
    CaseSensitive: false
