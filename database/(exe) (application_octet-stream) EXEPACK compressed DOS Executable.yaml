Name: EXEPACK compressed DOS Executable
URL: "http://www.shikadi.net/moddingwiki/Microsoft_EXEPACK"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PACKED FILE IS CORRUPT"
    CaseSensitive: false
