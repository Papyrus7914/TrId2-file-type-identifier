Name: HPFS-Access DB
Description: DOS driver for HPFS partition by Andreas Kinzler.
FileNameExtensions: ["dat"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "HPFS-Access "
    CaseSensitive: true
  - Pos: 13
    AsciiString: "."
    CaseSensitive: true
  - Pos: 16
    AsciiString: " database"
    CaseSensitive: true
  - Pos: any
    AsciiString: "HPFS-ACCESS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATABASE"
    CaseSensitive: false
