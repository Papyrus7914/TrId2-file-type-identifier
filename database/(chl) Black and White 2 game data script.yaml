Name: Black and White 2 game data script
URL: "http://en.wikipedia.org/wiki/Black_%26_White_2"
FileNameExtensions: ["chl"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "LHVM"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NULL VARIABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREATURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAND"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".TXT"
    CaseSensitive: false
