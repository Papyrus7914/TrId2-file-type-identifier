Name: SnagIt capture
URL: "http://en.wikipedia.org/wiki/Snagit"
FileNameExtensions: ["snag"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xCBTSCSNAGN"
    CaseSensitive: true
  - Pos: 24
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1, 0x00]
  - Pos: any
    AsciiString: "R\0O\0O\0T\0 \0E\0N\0T\0R\0Y"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXTCREATION TIME\05"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXTDESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "D\0O\0C\0U\0M\0E\0N\0T"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXTDISCLAIMER"
    CaseSensitive: false
