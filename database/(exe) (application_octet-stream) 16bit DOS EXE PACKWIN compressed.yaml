Name: 16bit DOS EXE PACKWIN compressed
URL: "http://fileformats.archiveteam.org/wiki/PACKWIN"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0\0\x04\0"
    CaseSensitive: true
  - Pos: 16
    #                          e
    Bytes: [0x80, 0x00, 0x11, 0x65, 0x10, 0x00]
  - Pos: 24
    AsciiString: "\x1C\0\0\0\0\0YRZLITE (C) 1993 WYellow Rose\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "YRZLITE (C) 1993 WYELLOW ROSE"
    CaseSensitive: false
