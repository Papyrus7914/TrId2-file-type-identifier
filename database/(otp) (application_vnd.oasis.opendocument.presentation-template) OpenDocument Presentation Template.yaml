Name: OpenDocument Presentation Template
URL: "http://fileformats.archiveteam.org/wiki/OpenDocument"
FileNameExtensions: ["otp"]
MimeType: application/vnd.oasis.opendocument.presentation-template
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "mimetypeapplication/vnd.oasis.opendocument.presentation-templatePK"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VND.OASIS.OPENDOCUMENT.PRESENTATION-TEMPLATEPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MIMETYPEAPPLICATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THUMBNAIL.PNG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MANIFEST.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENT.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STYLES.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THUMBNAILS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "META-INF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "META.XML"
    CaseSensitive: false
