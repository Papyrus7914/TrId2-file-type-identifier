Name: Claris Works document
URL: "https://en.wikipedia.org/wiki/Claris"
FileNameExtensions: ["cwk"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 4
    AsciiString: "BOBO"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BOBO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DSET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FNTM"
    CaseSensitive: false
