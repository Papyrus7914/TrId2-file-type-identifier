Name: DAZ Studio script
URL: "http://en.wikipedia.org/wiki/DAZ_Studio"
FileNameExtensions: ["dsa"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "// DAZ Studio version "
    CaseSensitive: true
  - Pos: any
    AsciiString: "FILETYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCRIPT"
    CaseSensitive: false
