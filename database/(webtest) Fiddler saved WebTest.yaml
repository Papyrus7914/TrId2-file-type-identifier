Name: Fiddler saved WebTest
Description: Fiddler is a free HTTP Debugging Proxy.
URL: "http://www.fiddlertool.com/fiddler/"
FileNameExtensions: ["webtest"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xEF\xBB\xBF<?xml version=\"1.0\" encoding=\"utf-8\"?>\r\n<TestCase Name=\"MicrosoftFiddlerWebTest\" Id=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "DEPLOYMENTITEMSEDITABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MICROSOFTFIDDLERWEBTEST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TESTCASECALLBACKCLASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REQUESTCALLBACKCLASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CSSPROJECTSTRUCTURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREDENTIALUSERNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREDENTIALPASSWORD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PREAUTHENTICATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TESTCASE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CSSITERATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRIORITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENABLED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROXY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OWNER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRUE"
    CaseSensitive: false
