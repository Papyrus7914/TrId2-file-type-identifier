    CaseSensitive: true
  - Pos: 124
    AsciiString: "RIFF"
    CaseSensitive: true
  - Pos: 132
    AsciiString: "WAVEfmt "
    CaseSensitive: true
  - Pos: 164
    AsciiString: "data"
    CaseSensitive: true
  - Pos: any
    AsciiString: "WAVEFMT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PCMR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RIFF"
    CaseSensitive: false
