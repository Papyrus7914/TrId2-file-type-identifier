Name: Transform compressed
Description: Transform is a compressor by Michael Bone. It features being able to represent a compressed file as an image or in base 64. It uses a Burrows-Wheeler transform to compress.
URL: "http://users.senet.com.au/~mjbone/"
FileNameExtensions: ["tfm"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "Transform "
    CaseSensitive: true
