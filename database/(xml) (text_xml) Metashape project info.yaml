Name: Metashape project info
Description: File doc.xml.
URL: "http://fileformats.archiveteam.org/wiki/Agisoft"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOCUMENT VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHUNKS NEXT_ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERTY NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ACTIVE_ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHUNK ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "META"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH"
    CaseSensitive: false
