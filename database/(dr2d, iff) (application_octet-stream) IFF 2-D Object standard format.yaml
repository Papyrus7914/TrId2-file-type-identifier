Name: IFF 2-D Object standard format
Description: ProVector native drawing format.
URL: "http://wiki.amigaos.net/wiki/DR2D_IFF_2-D_Objects"
FileNameExtensions: ["dr2d", "iff"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM\0\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "DR2DDRHD"
    CaseSensitive: true
