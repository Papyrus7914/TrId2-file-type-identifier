Name: Inno Setup Script (with alt rem)
URL: "http://en.wikipedia.org/wiki/Inno_Setup"
FileNameExtensions: ["iss"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "//"
    CaseSensitive: true
  - Pos: any
    AsciiString: "APPNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPVER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SETUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TION"
    CaseSensitive: false
