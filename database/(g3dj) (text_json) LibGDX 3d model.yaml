Name: LibGDX 3d model
URL: "https://libgdx.com/"
FileNameExtensions: ["g3dj"]
MimeType: text/json
DetectionPatterns:
  - Pos: 0
    AsciiString: "{"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ANIMATIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MATERIALS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIFFUSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MESHES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NODES"
    CaseSensitive: false
