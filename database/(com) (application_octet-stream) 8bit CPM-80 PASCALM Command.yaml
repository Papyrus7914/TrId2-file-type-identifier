    CaseSensitive: false
  - Pos: any
    AsciiString: "5TAPE1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "5TAPE2"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ABORT."
    CaseSensitive: false
  - Pos: any
    AsciiString: "READER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ALBS"
    CaseSensitive: false
  - Pos: any
