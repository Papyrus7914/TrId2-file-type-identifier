Name: JFIF JPEG bitmap
URL: "https://en.wikipedia.org/wiki/JPEG"
FileNameExtensions: ["jpg", "jpeg"]
MimeType: image/jpeg
DetectionPatterns:
  - Pos: 0
    Bytes: [0xFF, 0xD8, 0xFF, 0xE0]
  - Pos: 6
    AsciiString: "JF"
    CaseSensitive: true
  - Pos: 10
    AsciiString: "\0"
    CaseSensitive: true
