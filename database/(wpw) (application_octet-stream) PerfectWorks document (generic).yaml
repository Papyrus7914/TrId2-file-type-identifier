Name: PerfectWorks document (generic)
Description: Office suite by WordPerfect Corp.
FileNameExtensions: ["wpw"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xFFWPC\x10\0\0\0%"
    CaseSensitive: true
  - Pos: 10
    AsciiString: "\x01\0\0\0\0\0"
    CaseSensitive: true
