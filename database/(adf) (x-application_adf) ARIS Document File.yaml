Name: ARIS Document File
URL: "http://en.wikipedia.org/wiki/ARIS_Express"
FileNameExtensions: ["adf"]
MimeType: x-application/adf
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "THUMBNAIL.JPGPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "METAINFO.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PREVIEW.JPGPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PREVIEW.JSPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODELPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATAPK"
    CaseSensitive: false
