Name: GIF Explainer project
URL: "https://www.gifexplainer.com/"
FileNameExtensions: ["gifex"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 11
    AsciiString: "e{P"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PROJECT.XMLPK"
    CaseSensitive: false
