Name: Vivado Memory Map Information
URL: "https://en.wikipedia.org/wiki/Vivado"
FileNameExtensions: ["mmi"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PROCESSOR ENDIANNESS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ADDRESSRANGE BEGIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ADDRESSSPACE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BITLANE MEMTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MEMINFO VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATAWIDTH MSB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPTION NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARITY ON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLACEMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUSBLOCK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INSTPATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUMBITS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONFIG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LITTLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_BRAM_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MINOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PART"
    CaseSensitive: false
