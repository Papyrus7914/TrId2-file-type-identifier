Name: JASPP package
Description: The Archimedes Software Preservation Project.
URL: "https://forums.jaspp.org.uk/"
FileNameExtensions: ["zip"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "COVER.PNG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SNAP1.PNG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SNAP2.PNG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "01.JPG"
    CaseSensitive: false
  - Pos: any
    AsciiString: ") F10"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISCS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IDATX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IHDR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLTE"
    CaseSensitive: false
