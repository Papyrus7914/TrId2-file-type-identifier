Name: Tasmota firmware for ESP8266 configuration Dump (v6.2.1.0)
URL: "https://github.com/arendst/Sonoff-Tasmota"
FileNameExtensions: ["dmp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\t\x12\\S"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "bbfc"
    CaseSensitive: true
  - Pos: 469
    AsciiString: "/0123456789:;<=>?@A"
    CaseSensitive: true
