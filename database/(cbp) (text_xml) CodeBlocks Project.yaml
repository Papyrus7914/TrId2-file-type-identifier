Name: Code::Blocks Project
URL: "https://en.wikipedia.org/wiki/Code::Blocks"
FileNameExtensions: ["cbp"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "CODEBLOCKS_PROJECT_FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILEVERSION MAJOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPTION COMPILER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNIT FILENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPTION TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TARGET TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPTION TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTENSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUTPUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUILD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEBUG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MINOR"
    CaseSensitive: false
