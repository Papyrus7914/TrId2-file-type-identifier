Name: Palm Tides
Description: Tides is a freeware program by Ken Hancock for keeping track of local tide tables.
URL: "http://members.aol.com/khancock/pilot.html"
FileNameExtensions: ["pdb"]
DetectionPatterns:
  - Pos: 60
    AsciiString: "TdatTide"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TDATTIDE"
    CaseSensitive: false
