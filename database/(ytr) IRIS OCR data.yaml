Name: IRIS OCR data
URL: "http://www.irislink.com/"
FileNameExtensions: ["ytr"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 2
    AsciiString: "IRIS group"
    CaseSensitive: true
  - Pos: any
    AsciiString: "A\0B\0C\0D\0E\0F\0G\0H\0I\0J\0K\0L\0M\0N\0O\0P\0Q\0R\0S\0T\0U\0V\0W\0X\0Y\0Z\0{"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ABCDEFGHIJKLMNOPQRSTUVWXYZ{"
    CaseSensitive: false
  - Pos: any
    AsciiString: "0\01\02\03\04\05\06\07\08\09"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IRIS GROUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "0123456789"
    CaseSensitive: false
