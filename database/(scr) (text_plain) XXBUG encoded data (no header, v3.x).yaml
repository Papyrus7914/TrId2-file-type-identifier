Name: XXBUG encoded data (no header, v3.x)
URL: "http://fileformats.archiveteam.org/wiki/XXBUG"
FileNameExtensions: ["scr"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "*XXBUG3"
    CaseSensitive: true
  - Pos: 38
    AsciiString: "------------------"
    CaseSensitive: true
  - Pos: any
    AsciiString: "*XXBUG VERSION 3."
    CaseSensitive: false
  - Pos: any
    AsciiString: "BY CHAD WAGNER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "*XXBUG3"
    CaseSensitive: false
