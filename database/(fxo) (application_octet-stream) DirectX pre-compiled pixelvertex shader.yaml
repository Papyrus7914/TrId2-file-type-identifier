Name: DirectX pre-compiled pixel/vertex shader
URL: "https://en.wikipedia.org/wiki/DirectX"
FileNameExtensions: ["fxo"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #              \t
    Bytes: [0x01, 0x09, 0xFF, 0xFE]
  - Pos: 7
    AsciiString: "\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 13
    AsciiString: "\0\0\0"
    CaseSensitive: true
