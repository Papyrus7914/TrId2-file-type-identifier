Name: World of Warcraft TOC file
URL: "http://www.wowwiki.com/.toc"
FileNameExtensions: ["toc"]
DetectionPatterns:
  - Pos: 18
    AsciiString: "0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "INTERFACE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NOTES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".LUA"
    CaseSensitive: false
