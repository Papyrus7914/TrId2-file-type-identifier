Name: Quartus Block Design File
URL: "http://en.wikipedia.org/wiki/Altera_Quartus"
FileNameExtensions: ["bdf"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "/*"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DO NOT EDIT THE INPUT AND OUTPUT PORTS IN THIS FILE IN A TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE CORRUPTION IS VERY LIKELY TO OCCUR."
    CaseSensitive: false
  - Pos: any
    AsciiString: "THE BLOCK EDITOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COPYRIGHT (C)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(HEADER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GRAPHIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WARNING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMAT"
    CaseSensitive: false
