Name: Scala Multimedia Script (v1.0)
URL: "https://en.wikipedia.org/wiki/Scala_(company)"
FileNameExtensions: ["script"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "V1.0\n\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MARGINS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".FONT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EVENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAUSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCALA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STYLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TABS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIPE"
    CaseSensitive: false
