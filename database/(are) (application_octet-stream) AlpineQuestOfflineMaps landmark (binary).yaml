Name: AlpineQuest/OfflineMaps landmark (binary)
URL: "https://www.alpinequest.net/en/help/v2/placemarks"
FileNameExtensions: ["are"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PP\r\x01\0\0\0"
    CaseSensitive: true
  - Pos: 15
    AsciiString: "\x03lat"
    CaseSensitive: true
  - Pos: 34
    AsciiString: "\x03lon"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CREATOR_URL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
