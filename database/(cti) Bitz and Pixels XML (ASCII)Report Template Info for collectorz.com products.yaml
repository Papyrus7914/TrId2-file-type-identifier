Name: Bitz and Pixels XML (ASCII)Report Template Info for collectorz.com products
URL: "http://www.collectorz.com/"
FileNameExtensions: ["cti"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<template_info>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SUPPORTS_THUMBNAILS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SUPPORTS_IMAGES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEMPLATE_TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEMPLATE_INFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ITEM_TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRODUCT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MOVIE"
    CaseSensitive: false
