Name: Houdini LUT
URL: "https://en.wikipedia.org/wiki/Houdini_(software)"
FileNameExtensions: ["lut"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "Version\t\t"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LENGTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BLACK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WHITE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FROM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
