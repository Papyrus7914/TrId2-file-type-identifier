Name: FOMod info
Description: "Filename: info.xml"
URL: "https://docs.fileformat.com/game/fomod/"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xFF\xFE<\0f\0o\0m\0o\0d\0>\0 \0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "D\0E\0S\0C\0R\0I\0P\0T\0I\0O\0N"
    CaseSensitive: false
  - Pos: any
    AsciiString: "E\0L\0E\0M\0E\0N\0T"
    CaseSensitive: false
  - Pos: any
    AsciiString: "V\0E\0R\0S\0I\0O\0N"
    CaseSensitive: false
  - Pos: any
    AsciiString: "W\0E\0B\0S\0I\0T\0E"
    CaseSensitive: false
  - Pos: any
    AsciiString: "A\0U\0T\0H\0O\0R"
    CaseSensitive: false
  - Pos: any
    AsciiString: "G\0R\0O\0U\0P\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "N\0A\0M\0E"
    CaseSensitive: false
