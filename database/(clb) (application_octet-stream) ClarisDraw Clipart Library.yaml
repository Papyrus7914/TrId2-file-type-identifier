Name: ClarisDraw Clipart Library
URL: "https://en.wikipedia.org/wiki/Claris"
FileNameExtensions: ["clb"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x02, 0x00]
  - Pos: 4
    AsciiString: "EXPW"
    CaseSensitive: true
  - Pos: any
    AsciiString: "EXPW"
    CaseSensitive: false
