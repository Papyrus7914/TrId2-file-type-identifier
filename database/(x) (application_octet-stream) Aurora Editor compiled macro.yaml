Name: Aurora Editor compiled macro
Description: Advanced programmable text editor for PC.
URL: "http://www-personal.umich.edu/~knassen/aurora.html"
FileNameExtensions: ["x"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #              d
    Bytes: [0xE0, 0x64]
  - Pos: 4
    AsciiString: "\0"
    CaseSensitive: true
