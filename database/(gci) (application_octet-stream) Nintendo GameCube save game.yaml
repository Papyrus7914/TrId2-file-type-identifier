Name: Nintendo GameCube save game
URL: "https://en.wikipedia.org/wiki/GameCube"
FileNameExtensions: ["gci"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "G"
    CaseSensitive: true
  - Pos: 6
    Bytes: [0xFF]
  - Pos: 35
    AsciiString: "\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 58
    Bytes: [0xFF, 0xFF, 0x00, 0x00]
