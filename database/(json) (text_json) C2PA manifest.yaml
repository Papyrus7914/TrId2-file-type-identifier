    CaseSensitive: true
  - Pos: any
    AsciiString: "CLAIM_GENERATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_PRIVATE.KEY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRIVATE_KEY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ASSERTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_CERTS.PEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIGN_CERT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "METADATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TA_URL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LABEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STDS."
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "C2PA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEST"
    CaseSensitive: false
