Name: Scrivener search Indexes
URL: "http://fileformats.archiveteam.org/wiki/Scrivener"
FileNameExtensions: ["indexes"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "SEARCHINDEXES VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCUMENT ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCUMENTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
