Name: Compaq QRST disk image
Description: Quick Release Sector Transfer, used by Compaq to distribute patches.
URL: "https://sembiance.com/fileFormatSamples/archive/qrst/"
FileNameExtensions: ["_01", "001"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "QRST"
    CaseSensitive: true
