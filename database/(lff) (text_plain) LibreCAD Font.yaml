Name: LibreCAD Font
URL: "https://librecad.org/"
FileNameExtensions: ["lff"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "# Format:            LibreCAD Font 1"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LINESPACINGFACTOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LETTERSPACING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WORDSPACING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LICENSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTHOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMAT"
    CaseSensitive: false
