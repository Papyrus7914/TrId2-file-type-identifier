Name: Xournal++ document (ungzipped)
URL: "https://github.com/xournalpp/xournalpp"
FileNameExtensions: ["xopp"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" standalone=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "XOURNAL++ DOCUMENT - SEE HTTPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BACKGROUND TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XOURNAL CREATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XOURNAL++ 1."
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILEVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GITHUB.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGE WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STANDALONE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XOURNALPP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PREVIEW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAYER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
