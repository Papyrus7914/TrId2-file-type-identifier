Name: Volkov Commander Directory tree info
Description: TREEINFO.VCD in root directory on each disk is used by newer Volkov Commander DOS file manager for fast access.
URL: "https://en.wikipedia.org/wiki/Volkov_Commander"
FileNameExtensions: ["vcd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "VC TREE\r\n"
    CaseSensitive: true
