Name: ABC FlowCharter Workspace
URL: "https://en.wikipedia.org/wiki/ABC_FlowCharter"
FileNameExtensions: ["afw"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\x18\0JFO\0\0\x1B\xDE-"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".AF3"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".AFW"
    CaseSensitive: false
