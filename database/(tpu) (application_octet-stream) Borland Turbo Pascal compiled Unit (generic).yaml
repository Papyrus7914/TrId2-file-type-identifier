Name: Borland Turbo Pascal compiled Unit (generic)
URL: "https://en.wikipedia.org/wiki/Turbo_Pascal"
FileNameExtensions: ["tpu"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "TPU"
    CaseSensitive: true
  - Pos: 4
    AsciiString: "\0\0\0\0"
    CaseSensitive: true
