Name: Facet file
Description: Plain ASCII file format with lists of point coordinates and connectivity between them.
URL: "http://www.paraview.org/Wiki/ParaView:FAQ#What_file_formats_does_ParaView_support.3F"
FileNameExtensions: ["facet"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "FACET FILE FROM "
    CaseSensitive: true
