Name: XCar Font
URL: "https://www.mobygames.com/game/6481/xcar-experimental-racing/"
FileNameExtensions: ["fnt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FNHD"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "PAL"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FBMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FONT"
    CaseSensitive: false
