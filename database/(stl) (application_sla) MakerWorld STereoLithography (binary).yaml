Name: MakerWorld STereoLithography (binary)
URL: "https://makerworld.com/"
FileNameExtensions: ["stl"]
MimeType: application/sla
DetectionPatterns:
  - Pos: 0
    AsciiString: "MW 1.0 "
    CaseSensitive: true
  - Pos: 13
    AsciiString: " "
    CaseSensitive: true
  - Pos: 16
    AsciiString: "\0"
    CaseSensitive: true
