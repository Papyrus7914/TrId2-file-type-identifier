Name: Garmin Voice Processing Module
Description: Contains RIFF/WAVe standard audio files.
URL: "http://turboccc.wikispaces.com/share/view/28622555"
FileNameExtensions: ["vpm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "AUDIMG"
    CaseSensitive: true
  - Pos: any
    AsciiString: "WAVEFMT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RIFF"
    CaseSensitive: false
