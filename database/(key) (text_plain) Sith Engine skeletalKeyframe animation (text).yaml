Name: Sith Engine skeletal/Keyframe animation (text)
URL: "https://starwars.fandom.com/wiki/Sith_Engine"
FileNameExtensions: ["key"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "# KEYFRAME '"
    CaseSensitive: true
  - Pos: any
    AsciiString: "KEYFRAME NODES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODE WITH VER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREATED FROM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MESH NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FLAGS 0X"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENTRIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SECTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE 0X"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FRAMES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEADER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JOINTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NODE 0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FPS 1"
    CaseSensitive: false
