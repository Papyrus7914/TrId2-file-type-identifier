Name: IBM PS/55 MKKC Dictionary (v3.x)
FileNameExtensions: ["dct"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "IBM PS/55 MKKC DICTIONARY V3."
    CaseSensitive: true
  - Pos: 42
    AsciiString: "(c) Copyright IBM Corp. 19"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LICENCED MATERIALS-PROPERTY OF IBM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(C) COPYRIGHT IBM CORP. 19"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IBM PS"
    CaseSensitive: false
