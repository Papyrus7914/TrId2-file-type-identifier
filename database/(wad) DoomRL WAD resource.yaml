Name: DoomRL WAD resource
URL: "http://doom.chaosforge.org"
FileNameExtensions: ["wad"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "\bVDFILE02"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BEINGS.LUA__COMPILED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MEDALS.LUA__COMPILED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CELLS.LUA__COMPILED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ITEMS.LUA__COMPILED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LEVEL.LUA__COMPILED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CORE.LUA__COMPILED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN.LUA__COMPILED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PITS.LUA__COMPILED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AI.LUA__COMPILED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHADOW"
    CaseSensitive: false
