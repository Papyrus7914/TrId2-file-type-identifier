Name: Groupwise Mail Message
URL: "http://fileformats.archiveteam.org/wiki/MLM"
FileNameExtensions: ["mlm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xFFWPC"
    CaseSensitive: true
  - Pos: 317
    AsciiString: "From:"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SUBJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FROM"
    CaseSensitive: false
