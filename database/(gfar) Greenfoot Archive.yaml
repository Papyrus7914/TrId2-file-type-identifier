Name: Greenfoot Archive
URL: "http://www.greenfoot.org/"
FileNameExtensions: ["gfar"]
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "PROJECT.GREENFOOTPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "README.TXTPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".CLASSPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JAVA"
    CaseSensitive: false
