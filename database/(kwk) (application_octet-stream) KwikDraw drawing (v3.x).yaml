Name: KwikDraw drawing (v3.x)
URL: "http://fileformats.archiveteam.org/wiki/KwikDraw"
FileNameExtensions: ["kwk"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 183
    AsciiString: "\0CKwik"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CKWIK"
    CaseSensitive: false
