Name: Relux project
URL: "https://relux.com/"
FileNameExtensions: ["rdf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Relux Container\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CREATE TABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BLOB"
    CaseSensitive: false
