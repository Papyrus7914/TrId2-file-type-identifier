Name: Visual Basic class definition
URL: "http://en.wikipedia.org/wiki/Visual_Basic"
FileNameExtensions: ["cls"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "VERSION 1.0 CLASS"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ATTRIBUTE VB_GLOBALNAMESPACE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ATTRIBUTE VB_PREDECLAREDID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ATTRIBUTE VB_CREATABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ATTRIBUTE VB_EXPOSED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ATTRIBUTE VB_NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION 1.0 CLASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MULTIUSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BEGIN"
    CaseSensitive: false
