Name: Pro Evolution Soccer 2010 game data archive
URL: "https://en.wikipedia.org/wiki/Pro_Evolution_Soccer_2010"
FileNameExtensions: ["img"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "AFS\0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "\0\0\0\0"
    CaseSensitive: true
