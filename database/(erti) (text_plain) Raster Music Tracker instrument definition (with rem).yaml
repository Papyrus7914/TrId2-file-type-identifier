Name: Raster Music Tracker instrument definition (with rem)
URL: "https://github.com/VinsCool/RASTER-Music-Tracker/"
FileNameExtensions: ["erti"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "//"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ENVELOPEDISTORTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INSTRUMENT$0"
    CaseSensitive: false
