Name: AMOS Menu Bank
Description: Contains menu definitions.
URL: "http://en.wikipedia.org/wiki/AMOS_(programming_language)"
FileNameExtensions: ["abk"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "AmBk"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "Menu"
    CaseSensitive: true
