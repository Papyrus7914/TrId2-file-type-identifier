Name: Visual Studio Command Table configuration (XML)
FileNameExtensions: ["vsct"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xEF\xBB\xBF<?xml version=\"1.0\" encoding=\"utf-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SCHEMAS.MICROSOFT.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMANDTABLE XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMANDS PACKAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VISUALSTUDIO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTERN HREF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STDIDCMD.H"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VSSHLIDS.H"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.W3.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLSCHEMA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOOLS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "2001"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GUID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MENU"
    CaseSensitive: false
