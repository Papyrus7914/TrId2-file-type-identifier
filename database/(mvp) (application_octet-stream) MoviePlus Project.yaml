Name: MoviePlus Project
URL: "http://fileformats.archiveteam.org/wiki/MoviePlus"
FileNameExtensions: ["mvp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: " \0\0\x80CompressionFile\0"
    CaseSensitive: true
  - Pos: 27
    AsciiString: "\0\x02\0\x02\0x\xDA"
    CaseSensitive: true
  - Pos: any
    AsciiString: "COMPRESSIONFILE"
    CaseSensitive: false
