Name: MAME software list
URL: "https://en.wikipedia.org/wiki/MAME"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version="
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOCTYPE SOFTWARELIST SYSTEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOFTWARELIST NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOFTWARELIST.DTD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOFTWARE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AREA NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INTERFACE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PUBLISHER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PART"
    CaseSensitive: false
  - Pos: any
    AsciiString: "YEAR"
    CaseSensitive: false
