Name: pyFAI Calibration data
URL: "https://pyfai.readthedocs.io/en/latest/"
FileNameExtensions: ["poni"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "poni_version:"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DETECTOR_CONFIG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WAVELENGTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISTANCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PONI1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PONI2"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROT1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROT2"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROT3"
    CaseSensitive: false
