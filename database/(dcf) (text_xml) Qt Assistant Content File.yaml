Name: Qt Assistant Content File
URL: "https://en.wikipedia.org/wiki/Qt_(software)"
FileNameExtensions: ["dcf"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<!DOCTYPE DCF>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LIST OF ALL MEMBER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLASS REFERENCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-MEMBERS.HTML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCUMENTATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXAMPLES.HTML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLASSES.HTML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KEYWORD REF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SECTION REF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INDEX.HTML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMAGEDIR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DCF REF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PNG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ICON"
    CaseSensitive: false
