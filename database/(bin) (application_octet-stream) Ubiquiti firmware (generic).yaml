Name: Ubiquiti firmware (generic)
URL: "https://en.wikipedia.org/wiki/Ubiquiti"
FileNameExtensions: ["bin"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "UBNT"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FIRM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH"
    CaseSensitive: false
