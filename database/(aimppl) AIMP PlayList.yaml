Name: AIMP PlayList
URL: "http://www.aimp2.us/"
FileNameExtensions: ["aimppl"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xFF\xFE#\0N\0a\0m\0e\0:\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "C\0U\0R\0S\0O\0R"
    CaseSensitive: false
  - Pos: any
    AsciiString: "F\0L\0A\0G\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "T\0R\0A\0C\0K"
    CaseSensitive: false
  - Pos: any
    AsciiString: "N\0A\0M\0E"
    CaseSensitive: false
