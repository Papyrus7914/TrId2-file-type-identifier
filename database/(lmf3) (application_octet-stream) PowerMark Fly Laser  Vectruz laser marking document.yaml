Name: PowerMark Fly Laser / Vectruz laser marking document
FileNameExtensions: ["lmf3"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "document\0"
    CaseSensitive: true
  - Pos: 43
    AsciiString: "LMF3"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOCUMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LMF3"
    CaseSensitive: false
