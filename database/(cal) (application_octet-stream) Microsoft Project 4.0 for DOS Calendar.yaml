Name: Microsoft Project 4.0 for DOS Calendar
URL: "https://en.wikipedia.org/wiki/Microsoft_Project"
FileNameExtensions: ["cal"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "4C\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MICROSOFT PROJECT VERSION 4.0"
    CaseSensitive: false
