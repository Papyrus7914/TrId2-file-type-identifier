Name: Iavadraw Wizard
Description: Java dev platform by SFS SOFTWARE.
FileNameExtensions: ["wiz"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "[Properties]"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PUBLIC CLASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLASSSTART"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTENDS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPLET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRESET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LINE"
    CaseSensitive: false
