Name: ST Device Firmware Upgrade
URL: "https://www.st.com/en/development-tools/stsw-stm32080.html"
FileNameExtensions: ["dfu"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "DfuSe\x01"
    CaseSensitive: true
  - Pos: 11
    AsciiString: "Target"
    CaseSensitive: true
  - Pos: 18
    AsciiString: "\x01\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TARGET"
    CaseSensitive: false
