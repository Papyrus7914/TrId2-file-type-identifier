Name: Metashape dense point cloud
URL: "http://fileformats.archiveteam.org/wiki/Agisoft"
FileNameExtensions: ["oc3", "oct"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        O     C
    Bytes: [0x4F, 0x43, 0x01, 0x02]
  - Pos: 211
    AsciiString: "\0nodesOC"
    CaseSensitive: true
  - Pos: 645
    AsciiString: "\0classesOC"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CLASSESOC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NODESOC"
    CaseSensitive: false
