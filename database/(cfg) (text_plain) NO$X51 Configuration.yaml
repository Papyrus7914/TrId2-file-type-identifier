Name: NO$X51 Configuration
URL: "https://problemkaputt.de/x51.htm"
FileNameExtensions: ["cfg"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: ";no$x51 "
    CaseSensitive: true
  - Pos: 9
    AsciiString: "."
    CaseSensitive: true
  - Pos: 11
    AsciiString: " generated config file - do not edit\r\n"
    CaseSensitive: true
