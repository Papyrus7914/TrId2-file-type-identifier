Name: Plotter3D Material
Description: Amiga 3D data plotter.
FileNameExtensions: ["material"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "MATEMATE"
    CaseSensitive: true
  - Pos: any
    AsciiString: "0MATEMATE"
    CaseSensitive: false
