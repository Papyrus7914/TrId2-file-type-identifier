Name: RollerCoaster Tycoon Scenario
URL: "https://www.mobygames.com/game/windows/rollercoaster-tycoon"
FileNameExtensions: ["sc4"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xFD, 0x00]
  - Pos: 6
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CHRIS SAWYER"
    CaseSensitive: false
