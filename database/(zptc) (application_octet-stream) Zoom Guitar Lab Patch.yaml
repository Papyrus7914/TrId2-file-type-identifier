Name: Zoom Guitar Lab Patch
URL: "https://zoomcorp.com/"
FileNameExtensions: ["zptc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PTCF"
    CaseSensitive: true
  - Pos: any
    AsciiString: "EDTB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PPRM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TXE1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TXJ1"
    CaseSensitive: false
