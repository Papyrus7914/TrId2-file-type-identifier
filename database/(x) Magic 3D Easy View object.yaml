Name: Magic 3D Easy View object
URL: "http://www.nicolaudie.com/main.php?id_page=3"
FileNameExtensions: ["x"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xB8\xAF\xA6`psp"
    CaseSensitive: true
  - Pos: 11
    AsciiString: "`ppsr"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PPSR"
    CaseSensitive: false
