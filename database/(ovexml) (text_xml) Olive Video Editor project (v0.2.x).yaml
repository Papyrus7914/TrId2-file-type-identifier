Name: Olive Video Editor project (v0.2.x)
URL: "https://www.olivevideoeditor.org/"
FileNameExtensions: ["ovexml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CONNECTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FRAME_RATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEQUENCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NODE ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUTPUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "T_NODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "0.2.0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INPUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NODES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "T_PIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIDEO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
