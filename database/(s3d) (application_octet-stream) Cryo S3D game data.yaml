Name: Cryo S3D game data
URL: "https://en.wikipedia.org/wiki/Cryo_Interactive"
FileNameExtensions: ["s3d"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FILE_S3D"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CAM2"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CAM3"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CAM4"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CAM5"
    CaseSensitive: false
