Name: Oracle ADF Business Components configuration
Description: "Filename: bc4j.xcfg"
URL: "https://en.wikipedia.org/wiki/JDeveloper"
FileNameExtensions: ["xcfg"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version"
    CaseSensitive: true
  - Pos: any
    AsciiString: "APPMODULECONFIGBAG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BC4JCONFIG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
