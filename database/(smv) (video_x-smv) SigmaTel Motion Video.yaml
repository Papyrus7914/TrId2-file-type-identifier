Name: SigmaTel Motion Video
URL: "https://es.wikipedia.org/wiki/SigmaTel_Motion_Video"
FileNameExtensions: ["smv"]
MimeType: video/x-smv
DetectionPatterns:
  - Pos: 0
    AsciiString: "RIFF"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "WAVEfmt "
    CaseSensitive: true
  - Pos: 40
    AsciiString: "fact"
    CaseSensitive: true
  - Pos: 52
    AsciiString: "data"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SMV002000"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FACT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JFIF"
    CaseSensitive: false
