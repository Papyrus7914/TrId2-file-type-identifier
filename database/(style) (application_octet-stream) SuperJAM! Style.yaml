Name: SuperJAM! Style
Description: Amiga music composition software by The Blue Ribbon SoundWorks.
URL: "https://archive.org/details/amiga-superjam-manual"
FileNameExtensions: ["style"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "STY"
    CaseSensitive: true
  - Pos: 4
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "STYLES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLIK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NOTE"
    CaseSensitive: false
