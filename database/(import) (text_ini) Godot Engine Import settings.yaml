Name: Godot Engine Import settings
URL: "https://en.wikipedia.org/wiki/Godot_(game_engine)"
FileNameExtensions: ["import"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "[remap]"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SOURCE_FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEST_FILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMPORTER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARAMS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REMAP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
