    AsciiString: "BATTERYWEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TESTTYPE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BATTERYCELLS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POWERAMPTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BATTERYTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATESTARTED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TESTCUTOFFV"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STANDALONE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEST NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TESTTIME"
