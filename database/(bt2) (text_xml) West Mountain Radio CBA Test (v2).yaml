Name: West Mountain Radio CBA Test (v2)
Description: Computerized Battery Analyzer is a battery testing tool.
URL: "https://www.westmountainradio.com/cba.php"
FileNameExtensions: ["bt2"]
MimeType: text/xml
DetectionPatterns:
