  - Pos: any
    AsciiString: "BATTERYCAPACITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BATTERYVOLTAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TESTEDCAPACITY"
    CaseSensitive: false
