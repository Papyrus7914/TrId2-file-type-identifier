Name: Hapticpad profiles configuration
URL: "https://github.com/dmcke5/Hapticpad/"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CONFIGURATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LED_SECONDARY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MACROBUTTONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROFILE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LED_PRIMARY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MOMENTUM_I"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MOMENTUM_P"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WHEELMODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLICKY_I"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLICKY_P"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LED_MODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROFILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SETTINGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WHEELKEY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TWIST_I"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TWIST_P"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ACTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LABEL"
    CaseSensitive: false
