Name: Tiny Stuff format bitmap (hi-res anim)
Description: Old Atari ST RLE compressed format.
URL: "http://fileformats.archiveteam.org/wiki/Tiny_Stuff"
FileNameExtensions: ["tny", "tn6"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x05\aw"
    CaseSensitive: true
