    AsciiString: "CMACHINEDRAWINGCONTAINER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CUSTOMERINFOIDENTIFIER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CSTRAIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARAMS"
    CaseSensitive: false
