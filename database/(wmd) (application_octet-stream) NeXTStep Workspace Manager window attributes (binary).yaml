Name: NeXTStep Workspace Manager window attributes (binary)
URL: "https://en.wikipedia.org/wiki/NeXTSTEP"
FileNameExtensions: ["wmd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "i\x02\xFC\xAE\x0F\0\0\0MainBrowserRoot"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MAINBROWSERSHELFROWS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAINBROWSERDIRDOCK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAINBROWSERHEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAINBROWSERWIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAINBROWSERVIEW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAINBROWSERTOP"
    CaseSensitive: false
