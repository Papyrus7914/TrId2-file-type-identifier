Name: Gen Surf map
FileNameExtensions: ["map"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "{"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FUNC_GROUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WORLDSPAWN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLASSNAME"
    CaseSensitive: false
