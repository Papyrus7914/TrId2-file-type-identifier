Name: Time Line Binary Symbols (v6.x)
URL: "https://en.wikipedia.org/wiki/Gen_Digital#TimeLine"
FileNameExtensions: ["bin"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "TL6."
    CaseSensitive: true
  - Pos: 5
    AsciiString: " Binary Symbol File\r\n\x1A"
    CaseSensitive: true
