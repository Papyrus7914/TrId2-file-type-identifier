Name: Karl Morton Sound format
URL: "https://moddingwiki.shikadi.net/wiki/Karl_Morton_Music_Format"
FileNameExtensions: ["sfx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SMPL"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0\0"
    CaseSensitive: true
