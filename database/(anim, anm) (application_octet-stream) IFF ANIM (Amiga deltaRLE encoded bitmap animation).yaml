Name: IFF ANIM (Amiga delta/RLE encoded bitmap animation)
URL: "http://fileformats.archiveteam.org/wiki/ANIM"
FileNameExtensions: ["anim", "anm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "ANIMFORM"
    CaseSensitive: true
