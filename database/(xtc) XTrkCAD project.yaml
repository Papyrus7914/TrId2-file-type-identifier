Name: XTrkCAD project
URL: "http://www.xtrkcad.org"
FileNameExtensions: ["xtc"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "VERSION "
    CaseSensitive: true
  - Pos: any
    AsciiString: "ROOMSIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAYERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCALE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN"
    CaseSensitive: false
