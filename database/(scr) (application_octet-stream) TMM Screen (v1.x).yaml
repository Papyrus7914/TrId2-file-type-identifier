Name: TMM Screen (v1.x)
Description: DOS multimedia software.
FileNameExtensions: ["scr"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "TMM Screen File - Version 1."
    CaseSensitive: true
  - Pos: any
    AsciiString: ".PCX"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".SCR"
    CaseSensitive: false
