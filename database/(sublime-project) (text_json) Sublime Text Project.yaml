Name: Sublime Text Project
URL: "http://en.wikipedia.org/wiki/Sublime_Text"
FileNameExtensions: ["sublime-project"]
MimeType: text/json
DetectionPatterns:
  - Pos: 0
    AsciiString: "{"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FOLDERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLUDE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_PAT"
    CaseSensitive: false
