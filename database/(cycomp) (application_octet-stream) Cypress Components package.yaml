Name: Cypress Components package
URL: "https://en.wikipedia.org/wiki/Cypress_Semiconductor"
FileNameExtensions: ["cycomp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: ".MANIFESTPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".CYSYMPK"
    CaseSensitive: false
