Name: Advance Steel Settings
URL: "https://en.wikipedia.org/wiki/Advance_Steel"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"utf-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ASSETTINGSDATA XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLSCHEMA-INSTANCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.W3.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROOT NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KEY NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ADVANCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HKEY_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STEEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
