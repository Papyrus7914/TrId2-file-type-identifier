Name: Kodak Precision Transform
Description: A Color Management System.
FileNameExtensions: ["pt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "futf"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ALL RIGHTS RESERVED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COPYRIGHT (C)"
    CaseSensitive: false
