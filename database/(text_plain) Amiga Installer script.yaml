Name: Amiga Installer script
URL: "https://en.wikipedia.org/wiki/Installer_(programming_language)"
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "("
    CaseSensitive: true
  - Pos: any
    AsciiString: "(PROMPT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(SOURCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(COPY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(DEST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(HELP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(IF ("
    CaseSensitive: false
  - Pos: any
    AsciiString: "(SET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
