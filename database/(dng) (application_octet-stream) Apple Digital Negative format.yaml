Name: Apple Digital Negative format
URL: "https://en.wikipedia.org/wiki/Digital_Negative"
FileNameExtensions: ["dng"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MM\0*"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "APPLEDNG"
    CaseSensitive: true
  - Pos: any
    AsciiString: "APPLEDNG"
    CaseSensitive: false
