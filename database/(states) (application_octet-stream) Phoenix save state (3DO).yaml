Name: Phoenix save state (3DO)
URL: "http://emulation.gametechwiki.com/index.php/Phoenix_(emulator)"
FileNameExtensions: ["states"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "state-x"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "3\0D\0O\0ROOT"
    CaseSensitive: true
  - Pos: 38
    AsciiString: "TIME"
    CaseSensitive: true
