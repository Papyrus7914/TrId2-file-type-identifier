Name: Good Friend REX Tile set
Description: Used in the game Good Friend Rex by KidNkiD - Korea.
FileNameExtensions: ["til"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Crazy Tool of TileFile Ver 1.0\0Crazy Tool CopyRight (R) "
    CaseSensitive: true
  - Pos: any
    AsciiString: "THIS LINE DOWN CUTTING OF GAMEDATA----------------"
    CaseSensitive: false
