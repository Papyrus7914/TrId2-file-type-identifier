Name: SpectraSuite data
URL: "http://spectrasuite.oceanoptics.com/"
FileNameExtensions: ["procspec"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SpectraSuite Data File"
    CaseSensitive: true
  - Pos: 24
    AsciiString: "+++++++++++++++++++++++++++++++++++"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NUMBER OF PIXELS IN PROCESSED SPECTRUM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUMBER OF SAMPLED COMPONENT SPECTRA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CORRECT FOR DETECTOR NON-LINEARITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BEGIN PROCESSED SPECTRAL DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CORRECT FOR ELECTRICAL DARK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REFERENCE SPECTRUM PRESENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CORRECT FOR STRAY LIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INTEGRATION TIME (USEC)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DARK SPECTRUM PRESENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BOXCAR SMOOTHING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPECTRA AVERAGED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPECTROMETERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAMP ENABLED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STROBE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USER"
    CaseSensitive: false
