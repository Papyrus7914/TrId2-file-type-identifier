Name: BIS P3D MLOD model
Description: A Bohemia Interactive Studio format.
URL: "http://community.bistudio.com/wiki/P3D_File_Format_-_MLOD"
FileNameExtensions: ["p3d"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MLOD"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MLOD"
    CaseSensitive: false
