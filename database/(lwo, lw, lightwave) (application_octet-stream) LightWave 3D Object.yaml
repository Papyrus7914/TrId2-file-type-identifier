Name: LightWave 3D Object
URL: "https://en.wikipedia.org/wiki/LightWave_3D"
FileNameExtensions: ["lwo", "lw", "lightwave"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "LWO"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FORM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PNTS"
    CaseSensitive: false
