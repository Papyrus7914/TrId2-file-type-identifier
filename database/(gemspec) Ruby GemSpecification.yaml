Name: Ruby Gem::Specification
URL: "http://docs.rubygems.org/read/chapter/20"
FileNameExtensions: ["gemspec"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "#"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SPECIFICATION.NEW"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".HOMEPAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".AUTHORS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".SUMMARY"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".EMAIL"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".FILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
