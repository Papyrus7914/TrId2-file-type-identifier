Name: Password Tracker Deluxe Tracking List
Description: Encrypted password list for the Password Tracker Deluxe password management program.
URL: "http://www.clrpc.com/"
FileNameExtensions: ["pwt"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "PTCRRC"
    CaseSensitive: true
  - Pos: any
    AsciiString: "{USERID}"
    CaseSensitive: false
  - Pos: any
    AsciiString: "{TAB}"
    CaseSensitive: false
  - Pos: any
    AsciiString: "{PASSWORD}"
    CaseSensitive: false
  - Pos: any
    AsciiString: "{ENTER}"
    CaseSensitive: false
