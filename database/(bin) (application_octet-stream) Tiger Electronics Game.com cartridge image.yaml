Name: Tiger Electronics Game.com cartridge image
URL: "https://en.wikipedia.org/wiki/Game.com"
FileNameExtensions: ["bin"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 2
    AsciiString: "@"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "TigerDMGC"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TIGERDMGC"
    CaseSensitive: false
