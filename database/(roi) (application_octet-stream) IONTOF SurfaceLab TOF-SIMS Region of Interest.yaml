Name: IONTOF SurfaceLab TOF-SIMS Region of Interest
URL: "https://www.iontof.com"
FileNameExtensions: ["roi"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "ITStrF01"
    CaseSensitive: true
  - Pos: 33
    AsciiString: "root"
    CaseSensitive: true
  - Pos: any
    AsciiString: "REGIONCOLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BITMAPDATA"
    CaseSensitive: false
