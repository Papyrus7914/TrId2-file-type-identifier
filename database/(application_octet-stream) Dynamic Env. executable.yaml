Name: Dynamic Env. executable
Description: Dynamic Environment was a GUI for MS-DOS by Radarsoft.
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        4
    Bytes: [0x34, 0x12]
  - Pos: 5
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 8
    Bytes: [0x04, 0x00]
  - Pos: 14
    Bytes: [0x04, 0x00]
  - Pos: any
    AsciiString: "66\05"
    CaseSensitive: false
