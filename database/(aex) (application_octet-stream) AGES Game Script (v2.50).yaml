Name: AGES Game Script (v2.50)
Description: Adventure engine by Take 2 Interactive Software.
URL: "https://www.mobygames.com/game/1174/black-dahlia/"
FileNameExtensions: ["aex"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xFA\0\nTake 2 Interactive Software\nAGES Game Script Ver: 2.50\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "START"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".AGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INIT"
    CaseSensitive: false
