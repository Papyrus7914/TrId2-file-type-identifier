Name: Icon Theme index
URL: "https://specifications.freedesktop.org/icon-theme-spec/icon-theme-spec-latest.html"
FileNameExtensions: ["theme"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "[Icon Theme]\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "APPLICATIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIRECTORIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CATEGORIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ICON THEME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MIMETYPES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCALABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ACTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEVICES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HICOLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAXSIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MINSIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLACES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STATUS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
