Name: Mac U-LAW audio (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/%CE%9C-law_algorithm"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "ULAW"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ULAW"
    CaseSensitive: false
