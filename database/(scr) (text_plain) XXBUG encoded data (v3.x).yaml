Name: XXBUG encoded data (v3.x)
URL: "http://fileformats.archiveteam.org/wiki/XXBUG"
FileNameExtensions: ["scr"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: " N"
    CaseSensitive: true
  - Pos: 54
    AsciiString: "---------------"
    CaseSensitive: true
  - Pos: any
    AsciiString: "*XXBUG VERSION 3."
    CaseSensitive: false
  - Pos: any
    AsciiString: "BY CHAD WAGNER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "*XXBUG3"
    CaseSensitive: false
