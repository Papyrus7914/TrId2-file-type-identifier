Name: Argonaut Video Sequence video
URL: "https://wiki.multimedia.cx/index.php/AVS"
FileNameExtensions: ["avs"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "wW\x10\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "\b\0"
    CaseSensitive: true
  - Pos: 16
    Bytes: [0x01, 0x00]
