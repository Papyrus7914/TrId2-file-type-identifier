Name: Microsoft C/C++ program database (generic)
FileNameExtensions: ["ncb"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Microsoft C/C++ program database "
    CaseSensitive: true
  - Pos: 34
    AsciiString: "."
    CaseSensitive: true
  - Pos: 37
    AsciiString: "\r\n\x1AJG"
    CaseSensitive: true
  - Pos: any
    AsciiString: "C++ PROGRAM DATABASE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "- WIN32 RELEASE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MICROSOFT C"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODULEINFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TARGETINFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAMES"
    CaseSensitive: false
