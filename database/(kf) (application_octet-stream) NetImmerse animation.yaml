Name: NetImmerse animation
URL: "https://en.wikipedia.org/wiki/Category:NetImmerse_engine_games"
FileNameExtensions: ["kf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "NetImmerse File Format, Version "
    CaseSensitive: true
  - Pos: 33
    AsciiString: "."
    CaseSensitive: true
  - Pos: 52
    AsciiString: "NiSequenceStreamHelper"
    CaseSensitive: true
  - Pos: 90
    AsciiString: "NiTextKeyExtraData"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NISEQUENCESTREAMHELPER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NIKEYFRAMECONTROLLER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NITEXTKEYEXTRADATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NISTRINGEXTRADATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NIKEYFRAMEDATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "START"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STOP"
    CaseSensitive: false
