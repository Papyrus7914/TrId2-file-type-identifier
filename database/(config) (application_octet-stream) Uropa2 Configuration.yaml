Name: Uropa2 Configuration
URL: "https://www.mobygames.com/game/82421/uropa2/"
FileNameExtensions: ["config"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "UPRF"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MOD.WARE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MUSIC"
    CaseSensitive: false
