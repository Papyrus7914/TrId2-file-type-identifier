Name: Fritzing Bundled Part
URL: "https://en.wikipedia.org/wiki/Fritzing"
FileNameExtensions: ["fzpz"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "SVG.BREADBOARD."
    CaseSensitive: false
  - Pos: any
    AsciiString: "SVG.SCHEMATIC."
    CaseSensitive: false
  - Pos: any
    AsciiString: "PART."
    CaseSensitive: false
  - Pos: any
    AsciiString: ".FZP"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".SVG"
    CaseSensitive: false
