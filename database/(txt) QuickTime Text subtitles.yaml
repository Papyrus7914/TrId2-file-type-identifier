Name: QuickTime Text subtitles
FileNameExtensions: ["txt"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "{QTtext}"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TIMESTAMPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TIMESCALE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ABSOLUTE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LANGUAGE"
    CaseSensitive: false
