Name: Martina Word Processor language data
Description: A word processor for translators.
FileNameExtensions: ["gsp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "BSLdbS"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "Show Oleg Scvortsov"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SHOW OLEG SCVORTSOV"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROTCL_XXX_SKV"
    CaseSensitive: false
