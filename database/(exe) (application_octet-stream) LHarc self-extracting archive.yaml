Name: LHarc self-extracting archive
URL: "https://en.wikipedia.org/wiki/LHA_(file_format)"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 37
    AsciiString: "LH"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LHARC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SFX"
    CaseSensitive: false
