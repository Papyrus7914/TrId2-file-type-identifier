Name: "Sky: Children of the Light level data (baked meshes)"
URL: "https://en.wikipedia.org/wiki/Sky_(video_game)"
FileNameExtensions: ["meshes"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "LVL0"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0\0\0\x01"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "LOD0"
    CaseSensitive: true
  - Pos: 17
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 23
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 29
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LOD0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LVL0"
    CaseSensitive: false
