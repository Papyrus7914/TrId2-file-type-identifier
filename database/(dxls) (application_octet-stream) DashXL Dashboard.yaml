Name: DashXL Dashboard
URL: "http://www.dashxl.net/"
FileNameExtensions: ["dxls"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "dashcommand.ini"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SHORT_DESCRIPTION.TXTPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LONG_DESCRIPTION.TXTPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DASHCOMMAND.INIPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BACKGROUND.DXLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BACKGROUND.INIPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FOREGROUND.DXLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FOREGROUND.INIPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PREVIEW.PNGPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TAGS.TXTPK"
    CaseSensitive: false
