    AsciiString: "VARIANT-PARAMETERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERAL-PARAMETERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WELL-RESATURATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RANDOM-PARAMETERS"
