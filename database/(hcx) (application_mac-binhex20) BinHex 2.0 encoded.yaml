Name: BinHex 2.0 encoded
URL: "https://en.wikipedia.org/wiki/BinHex"
FileNameExtensions: ["hcx"]
MimeType: application/mac-binhex20
DetectionPatterns:
  - Pos: 0
    AsciiString: "(This file must be converted with BinHex.Hex)"
    CaseSensitive: true
  - Pos: any
    AsciiString: "(THIS FILE MUST BE CONVERTED WITH BINHEX.HEX)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "***END OF DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "***COMPRESSED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXTTTXT$0000"
    CaseSensitive: false
  - Pos: any
    AsciiString: "***DATA FORK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "***CRC"
    CaseSensitive: false
