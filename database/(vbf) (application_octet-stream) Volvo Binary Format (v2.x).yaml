    AsciiString: "vbf_version = 2."
    CaseSensitive: true
  - Pos: any
    AsciiString: "SOFTWARE PART NUMBER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOFTWARE PART TYPE"
    CaseSensitive: false
