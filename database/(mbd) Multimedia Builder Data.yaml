Name: Multimedia Builder Data
URL: "http://www.mmbuilder.ru/"
FileNameExtensions: ["mbd"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "\vMMBuilder"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MASTER LAYER 000"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MASTER PAGE 000"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MMBUILDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MYAPP"
    CaseSensitive: false
