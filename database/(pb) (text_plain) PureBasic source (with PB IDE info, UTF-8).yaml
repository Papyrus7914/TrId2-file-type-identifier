Name: PureBasic source (with PB IDE info, UTF-8)
URL: "https://en.wikipedia.org/wiki/PureBasic"
FileNameExtensions: ["pb"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    Bytes: [0xEF, 0xBB, 0xBF]
  - Pos: any
    AsciiString: "EXECUTABLEFORMAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CURSORPOSITION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IDE OPTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PUREBASIC"
    CaseSensitive: false
