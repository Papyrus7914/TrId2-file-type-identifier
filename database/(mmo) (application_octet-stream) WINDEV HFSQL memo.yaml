Name: WINDEV HFSQL memo
Description: Hyper File is the native database format of WINDEV, a RAD tool by PC Soft.
URL: "https://windev.com"
FileNameExtensions: ["mmo"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PCS\0\x14\0\0\0\x03\0\a\0"
    CaseSensitive: true
