Name: WarCraft III saved game
URL: "https://en.wikipedia.org/wiki/Warcraft"
FileNameExtensions: ["w3z"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Warcraft III recorded game\x1A\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "WARCRAFT III RECORDED GAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MLTU"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWWW"
    CaseSensitive: false
