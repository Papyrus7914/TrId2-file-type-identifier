Name: Borland user specific project options
URL: "https://en.wikipedia.org/wiki/Delphi_(software)"
FileNameExtensions: ["local"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xEF\xBB\xBF<?xml version=\"1.0\" encoding=\"utf-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BORLANDPROJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRANSACTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNIT1."
    CaseSensitive: false
