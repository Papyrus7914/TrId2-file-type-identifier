Name: JAM bitmap
Description: Used in the game Aladdin.
URL: "http://www.shikadi.net/moddingwiki/JAM_Format"
FileNameExtensions: ["jam"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "XCOM"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "\b\0"
    CaseSensitive: true
