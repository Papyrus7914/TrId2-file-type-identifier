Name: NOAA NDBC Supplemental measurements data
URL: "https://www.ndbc.noaa.gov/faq/dataindex.shtml"
FileNameExtensions: ["supl"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "#YY  MM DD hh mm   PRES PTIME  WSPD  WDIR WTIME"
    CaseSensitive: true
  - Pos: any
    AsciiString: "YR  MO DY HR MN    HPA  HHMM   M"
    CaseSensitive: false
  - Pos: any
    AsciiString: "S  DEGT  HHMM"
    CaseSensitive: false
