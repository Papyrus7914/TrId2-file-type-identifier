Name: Cinnamon applet
URL: "https://en.wikipedia.org/wiki/Cinnamon_(desktop_environment)"
FileNameExtensions: ["zip"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "METADATA.JSONUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPLET.JSUT"
    CaseSensitive: false
