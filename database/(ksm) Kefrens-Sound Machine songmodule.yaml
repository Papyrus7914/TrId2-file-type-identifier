Name: Kefrens-Sound Machine song/module
URL: "http://membres.lycos.fr/asle/AMPD_src/Kefrens.html"
FileNameExtensions: ["ksm"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "M."
    CaseSensitive: true
  - Pos: 15
    AsciiString: "a"
    CaseSensitive: true
  - Pos: 1532
    Bytes: [0xFF, 0xFF, 0xFF, 0xFF]
