Name: Symantec/Norton Config (v1.0)
URL: "https://en.wikipedia.org/wiki/Norton_Utilities"
FileNameExtensions: ["bin"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: " \0"
    CaseSensitive: true
  - Pos: 3
    AsciiString: "\0NCFG1.0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NCFG1.0"
    CaseSensitive: false
