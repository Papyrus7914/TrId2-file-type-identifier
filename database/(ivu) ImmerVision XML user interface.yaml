Name: ImmerVision XML user interface
URL: "http://www.immervision.com"
FileNameExtensions: ["ivu"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "WWW.IMMERVISION.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INTERFACE XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
