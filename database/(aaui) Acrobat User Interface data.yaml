Name: Acrobat User Interface data
URL: "http://en.wikipedia.org/wiki/Adobe_Acrobat"
FileNameExtensions: ["aaui"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ACROBATUI XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPONENT LABEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BASICTOOLSPANE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPONENT NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAJORVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MINORVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NS.ADOBE.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FAVORITES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
