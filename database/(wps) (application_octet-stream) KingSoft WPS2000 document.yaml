    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGEINFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCINFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WPSPAGE"
    CaseSensitive: false
