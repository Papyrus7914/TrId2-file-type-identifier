Name: MetaCard/Revolution/LiveCode stack (generic)
URL: "http://fileformats.archiveteam.org/wiki/LiveCode"
FileNameExtensions: ["rev", "livecode"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "REVO"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "00"
    CaseSensitive: true
