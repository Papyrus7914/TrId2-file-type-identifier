Name: Microsoft PowerPoint Picture Storage
URL: "https://en.wikipedia.org/wiki/Microsoft_PowerPoint"
FileNameExtensions: ["pcs"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1]
  - Pos: any
    AsciiString: "P\0I\0C\0T\0U\0R\0E\0S\0T\0O\0R\0E\0V\0E\0R\0S\0I\0O\0N\0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "M\0A\0X\0P\0I\0C\0T\0U\0R\0E\0R\0E\0F"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MICROSOFT POWERPOINT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "R\0O\0O\0T\0 \0E\0N\0T\0R\0Y"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MICROSOFT DRAW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYSTEM"
    CaseSensitive: false
