Name: DWED Configuration
URL: "https://github.com/DosWorld/dwed/"
FileNameExtensions: ["cfg"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "tab_size ="
    CaseSensitive: true
  - Pos: any
    AsciiString: "COLOR.HELP_MENU_SEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR.HELP_MENU"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR.MENU_SEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR.TEXT_SEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR.HELP_HL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR.TEXT_DL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR.TEXT_HL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR.TOP_HL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR.HELP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR.MENU"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR.TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR.TOP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HL.ENABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USR.DEF.F"
    CaseSensitive: false
