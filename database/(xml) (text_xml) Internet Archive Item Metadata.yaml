Name: Internet Archive Item Metadata
URL: "https://archive.org/developers/metadata.html"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<metadata>\n  <identifier>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLLECTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IDENTIFIER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PUBLICDATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ADDEDDATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MEDIATYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "METADATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOFTWARE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UPLOADER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SUBJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".ORG"
    CaseSensitive: false
