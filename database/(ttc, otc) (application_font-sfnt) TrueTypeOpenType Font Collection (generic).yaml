Name: TrueType/OpenType Font Collection (generic)
URL: "https://en.wikipedia.org/wiki/TrueType"
FileNameExtensions: ["ttc", "otc"]
MimeType: application/font-sfnt
DetectionPatterns:
  - Pos: 0
    AsciiString: "ttcf"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CMAP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAXP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TTCF"
    CaseSensitive: false
