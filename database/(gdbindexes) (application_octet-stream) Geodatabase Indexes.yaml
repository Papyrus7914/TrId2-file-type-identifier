Name: Geodatabase Indexes
Description: Part of a GDB package.
URL: "https://en.wikipedia.org/wiki/Geodatabase_(Esri)"
FileNameExtensions: ["gdbindexes"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 1
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0\0\0F\0D\0O\0_\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "F\0D\0O\0_"
    CaseSensitive: false
