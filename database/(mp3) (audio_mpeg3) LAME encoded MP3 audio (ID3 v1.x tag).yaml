Name: LAME encoded MP3 audio (ID3 v1.x tag)
FileNameExtensions: ["mp3"]
MimeType: audio/mpeg3
DetectionPatterns:
  - Pos: 0
    Bytes: [0xFF]
  - Pos: 20
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TAG"
    CaseSensitive: false
