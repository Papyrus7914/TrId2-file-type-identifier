Name: BootSkin theme
URL: "https://en.wikipedia.org/wiki/BootSkin"
FileNameExtensions: ["bootskin"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "BOOTSKIN.INI"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".BMP"
    CaseSensitive: false
