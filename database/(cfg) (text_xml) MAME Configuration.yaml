Name: MAME Configuration
URL: "https://en.wikipedia.org/wiki/MAME"
FileNameExtensions: ["cfg"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MAMECONFIG VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYSTEM NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
