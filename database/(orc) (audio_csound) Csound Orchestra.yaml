Name: Csound Orchestra
URL: "http://en.wikipedia.org/wiki/Csound"
FileNameExtensions: ["orc"]
MimeType: audio/csound
DetectionPatterns:
  - Pos: 0
    AsciiString: "sr "
    CaseSensitive: true
  - Pos: any
    AsciiString: "NCHNLS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENDIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INSTR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KSMPS"
    CaseSensitive: false
