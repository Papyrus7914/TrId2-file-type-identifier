Name: Novastorm Media video
URL: "https://wiki.multimedia.cx/index.php?title=Novastorm_Media"
FileNameExtensions: ["fa", "fza", "mza"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SHED"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "PCFM"
    CaseSensitive: true
  - Pos: 30
    AsciiString: "SPAL"
    CaseSensitive: true
