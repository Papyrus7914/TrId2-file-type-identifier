Name: Microsoft Visio Drawing (generic)
Description: Visio is the business and technical diagramming program of the Microsoft Office suite.
URL: "https://en.wikipedia.org/wiki/Microsoft_Visio"
FileNameExtensions: ["vsd"]
MimeType: application/visio
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1, 0x00]
  - Pos: any
    AsciiString: "V\0I\0S\0I\0O\0D\0O\0C\0U\0M\0E\0N\0T"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VISIO (TM) DRAWING"
    CaseSensitive: false
