Name: Ardour Lua plugin (with rem)
URL: "https://en.wikipedia.org/wiki/Ardour_(software)"
FileNameExtensions: ["lua"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "--"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ARDOUR {"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FUNCTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RETURN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
