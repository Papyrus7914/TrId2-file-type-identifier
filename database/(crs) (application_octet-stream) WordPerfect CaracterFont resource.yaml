Name: WordPerfect Caracter/Font resource
URL: "https://en.wikipedia.org/wiki/WordPerfect"
FileNameExtensions: ["crs"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xFFWPC"
    CaseSensitive: true
  - Pos: 8
    #              \n
    Bytes: [0x01, 0x0A]
  - Pos: any
    AsciiString: "THIS WAS FONT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PITCH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OFF."
    CaseSensitive: false
