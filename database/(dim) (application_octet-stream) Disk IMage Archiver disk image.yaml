Name: Disk IMage Archiver disk image
Description: Old DOS disk image tool by Ray (Arsen) Arachelian.
FileNameExtensions: ["dim"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Disk IMage VER "
    CaseSensitive: true
  - Pos: 16
    AsciiString: "."
    CaseSensitive: true
