Name: The Office Publisher Document (v1.x)
Description: DTP software for DOS, by Print Tree / Laser Friendly.
FileNameExtensions: ["doc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\aOP\x04V1."
    CaseSensitive: true
  - Pos: 8
    AsciiString: "\aDOC"
    CaseSensitive: true
  - Pos: 13
    Bytes: [0x1A]
