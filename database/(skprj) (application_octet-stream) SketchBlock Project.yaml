Name: SketchBlock Project
URL: "https://www.broad.ology.org.uk/amiga/sketchblock/"
FileNameExtensions: ["skprj"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "SKETCH.XMLPK"
    CaseSensitive: false
