Name: PLS-CADD Import info
URL: "https://www.powline.com"
FileNameExtensions: ["imp"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "TYPE='IMP FILE' VERSION="
    CaseSensitive: true
  - Pos: any
    AsciiString: "FILENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOURCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNITS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USER"
    CaseSensitive: false
