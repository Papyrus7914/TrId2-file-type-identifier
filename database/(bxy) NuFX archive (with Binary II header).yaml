Name: NuFX archive (with Binary II header)
Description: Old Apple ][ compression format.
FileNameExtensions: ["bxy"]
DetectionPatterns:
  - Pos: 0
    #        \n    G     L
    Bytes: [0x0A, 0x47, 0x4C, 0xC3, 0xE0, 0x02, 0x80, 0x00]
  - Pos: 128
    #        N           F           l
    Bytes: [0x4E, 0xF5, 0x46, 0xE9, 0x6C, 0xE5]
