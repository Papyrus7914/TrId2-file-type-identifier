Name: Regressi Win data
URL: "http://ww3.ac-poitiers.fr/sc_phys/formatio/regwin/"
FileNameExtensions: ["rw3"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "EVARISTE REGRESSI WINDOWS 1.0\r"
    CaseSensitive: true
  - Pos: any
    AsciiString: "1 PAGE COMMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "2 ACQUISITION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRECISION VAR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "0 GRAPHE VAR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "3 GRADUATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMAT VAR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIGNIF VAR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "2 OPTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENRE VAR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNITE VAR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "1 TRIGO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NOM VAR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "3 ZERO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MONDE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRACE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LEUR"
    CaseSensitive: false
