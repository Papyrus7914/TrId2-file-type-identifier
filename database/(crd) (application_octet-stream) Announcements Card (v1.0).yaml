Name: Announcements Card (v1.0)
Description: Printed graphics designer for Windows 3.x by Parsons Technology.
FileNameExtensions: ["crd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 2
    AsciiString: "Announcements V1"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ANNOUNCEMENTS V1"
    CaseSensitive: false
