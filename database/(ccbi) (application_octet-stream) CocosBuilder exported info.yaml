Name: CocosBuilder exported info
URL: "https://en.wikipedia.org/wiki/Cocos2d"
FileNameExtensions: ["ccbi"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "ibcc"
    CaseSensitive: true
  - Pos: any
    AsciiString: "IGNOREANCHORPOINTFORPOSITION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENTSIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCALE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IBCC"
    CaseSensitive: false
