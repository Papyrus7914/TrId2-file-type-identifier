Name: VideoArchiv Data base (v3.0)
Description: Amiga video DB by David Rado.
FileNameExtensions: ["vad"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "VA30CODE"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VA30CODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITL"
    CaseSensitive: false
