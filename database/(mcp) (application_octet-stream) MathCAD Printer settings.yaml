Name: MathCAD Printer settings
URL: "https://en.wikipedia.org/wiki/Mathcad"
FileNameExtensions: ["mcp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "*\r\nDescription: "
    CaseSensitive: true
  - Pos: any
    AsciiString: "CHARACTER MATRIX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RESET"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".MCF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGE"
    CaseSensitive: false
