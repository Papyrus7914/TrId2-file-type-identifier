Name: Digital Reality Software Maps data
URL: "https://en.wikipedia.org/wiki/Digital_Reality"
FileNameExtensions: ["maps"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "TerrainMapsHeightMap\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "STATICFOWMAP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TILEMAPBLEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PASSABILITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VISIBILITY"
    CaseSensitive: false
