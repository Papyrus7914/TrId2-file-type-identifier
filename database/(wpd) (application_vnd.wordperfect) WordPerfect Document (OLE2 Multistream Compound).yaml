Name: WordPerfect Document (OLE2 Multistream Compound)
URL: "http://justsolve.archiveteam.org/wiki/WordPerfect"
FileNameExtensions: ["wpd"]
MimeType: application/vnd.wordperfect
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1]
  - Pos: any
    AsciiString: "P\0E\0R\0F\0E\0C\0T\0O\0F\0F\0I\0C\0E\0_\0O\0B\0J\0E\0C\0T\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "P\0E\0R\0F\0E\0C\0T\0O\0F\0F\0I\0C\0E\0_\0M\0A\0I\0N"
    CaseSensitive: false
  - Pos: any
    AsciiString: "R\0O\0O\0T\0 \0E\0N\0T\0R\0Y"
    CaseSensitive: false
