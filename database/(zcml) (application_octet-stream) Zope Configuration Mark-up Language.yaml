Name: Zope Configuration Mark-up Language
URL: "https://en.wikipedia.org/wiki/Zope"
FileNameExtensions: ["zcml"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NAMESPACES.ZOPE.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONFIGURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
