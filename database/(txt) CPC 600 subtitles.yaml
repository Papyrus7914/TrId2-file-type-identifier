Name: CPC 600 subtitles
FileNameExtensions: ["txt"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "~CPCC6.38~;UpperLower;PopOn;01;\r\n0"
    CaseSensitive: true
  - Pos: 35
    AsciiString: ":"
    CaseSensitive: true
  - Pos: 38
    AsciiString: ":"
    CaseSensitive: true
  - Pos: 41
    AsciiString: ":"
    CaseSensitive: true
  - Pos: any
    AsciiString: "0NEN"
    CaseSensitive: false
