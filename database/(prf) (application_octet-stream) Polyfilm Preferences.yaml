Name: Polyfilm Preferences
FileNameExtensions: ["prf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Poly_Prf"
    CaseSensitive: true
  - Pos: any
    AsciiString: "POLY_LSS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POLY_PAT"
    CaseSensitive: false
