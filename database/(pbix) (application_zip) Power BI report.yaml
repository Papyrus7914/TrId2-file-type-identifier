Name: Power BI report
URL: "https://en.wikipedia.org/wiki/Microsoft_Power_BI"
FileNameExtensions: ["pbix"]
MimeType: application/zip
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "Version"
    CaseSensitive: true
  - Pos: 40
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CONTENT_TYPES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "METADATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SETTINGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REPORT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STAT"
    CaseSensitive: false
