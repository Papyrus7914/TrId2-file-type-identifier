Name: GPAC DRM Test
URL: "https://github.com/gpac/testsuite"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\" />\n<GPACDRM type"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GPACDRM TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CRYPTRACK"
    CaseSensitive: false
