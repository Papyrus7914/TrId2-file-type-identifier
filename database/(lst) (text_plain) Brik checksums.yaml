Name: Brik checksums
URL: "http://fileformats.archiveteam.org/wiki/Brik"
FileNameExtensions: ["lst"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "# Whole file CRCs generated by Brik v"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FILENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CRC-32"
    CaseSensitive: false
