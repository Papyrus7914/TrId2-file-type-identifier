Name: Atari ST LZH SFX archive executable
FileNameExtensions: ["tos"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "`\x1A\0\0\t"
    CaseSensitive: true
  - Pos: 10
    AsciiString: "\0\0\x04\0\0\0\0\0\0\0\x04\0\0\0\0\0\0\0`\x12SFX\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FSELF EXTRACTING LZH-ARCHIVE   (C)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "89 BY STEFAN GROSS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ALREADY EXIST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRESS ANY KEY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CRC ERROR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTRACTED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OVERWRITE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MEMORY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NATONU"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAXONU"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-LH1-"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
