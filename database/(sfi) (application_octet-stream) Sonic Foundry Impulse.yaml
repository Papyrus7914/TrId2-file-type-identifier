Name: Sonic Foundry Impulse
FileNameExtensions: ["sfi"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "RIFF"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "SFIPfmt "
    CaseSensitive: true
  - Pos: any
    AsciiString: "SONIC FOUNDRY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFOICMT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ICOP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LIST"
    CaseSensitive: false
