Name: Total Commander language pack
URL: "https://en.wikipedia.org/wiki/Total_Commander"
FileNameExtensions: ["zip"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "PLUGINST.INF"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".LNGPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".MNUPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WCMD_"
    CaseSensitive: false
