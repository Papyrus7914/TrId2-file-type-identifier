Name: Yamaha e-SEQ music
Description: A playback only format used by Yamaha Disklavier.
FileNameExtensions: ["esq", "fil"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xFE\0\0"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "COM-ESEQ"
    CaseSensitive: true
  - Pos: any
    AsciiString: "COM-ESEQ"
    CaseSensitive: false
