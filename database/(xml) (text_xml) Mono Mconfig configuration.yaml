    AsciiString: "<?xml version=\"1.0\" encoding=\"utf-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CONFIGBLOCK NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULT SECTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PUBLICKEYTOKEN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONFIGURATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FEATURE NAME"
    CaseSensitive: false
