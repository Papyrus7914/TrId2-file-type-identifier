    AsciiString: "SECTION NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPLICATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ATTACHPOINT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPILATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYSTEM.WEB"
    CaseSensitive: false
