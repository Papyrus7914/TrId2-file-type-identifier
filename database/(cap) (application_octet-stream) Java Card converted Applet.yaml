Name: Java Card converted Applet
URL: "https://en.wikipedia.org/wiki/Java_Card"
FileNameExtensions: ["cap"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "CONSTANTPOOL.CAPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REFLOCATION.CAPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STATICFIELD.CAPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTOR.CAPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIRECTORY.CAPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPLET.CAPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEADER.CAPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMPORT.CAPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "METHOD.CAPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLASS.CAPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JAVACARD"
    CaseSensitive: false
