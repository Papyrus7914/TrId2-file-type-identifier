Name: Nimble package info (with rem)
URL: "https://nim-lang.github.io/nimble/"
FileNameExtensions: ["nimble"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "# Package"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REQUIRES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LICENSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PACKAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTHOR"
    CaseSensitive: false
