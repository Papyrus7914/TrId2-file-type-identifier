Name: Autodesk Maya Color Transform File
URL: "https://en.wikipedia.org/wiki/Autodesk_Maya"
FileNameExtensions: ["ctf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "INC.  ALL RIGHTS RESERVED."
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUTPUTDESCRIPTOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INPUTDESCRIPTOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROCESSLIST ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUTBITDEPTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INBITDEPTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ARRAY DIM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COPYRIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTODESK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RELEASE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFO"
    CaseSensitive: false
