  - Pos: any
    AsciiString: "SETUPPREREQUISITES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ISPRODUCTFOLDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE LOCALFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CMDLINESILENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERTIES ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXECUTE FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILESIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
