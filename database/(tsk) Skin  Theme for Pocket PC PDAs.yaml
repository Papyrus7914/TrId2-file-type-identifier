Name: Skin / Theme for Pocket PC PDAs
URL: "http://www.pocketthemes.com/"
FileNameExtensions: ["tsk"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "MSCF\0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "WINDOWS\0HPC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MICROSOFT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TDYWATER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOFTWARE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STWATER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%CE2%"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".000"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MSCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".002"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".GIF"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".001"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MSCF"
    CaseSensitive: false
