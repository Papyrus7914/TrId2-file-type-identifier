Name: XML Localization Interchange File Format (UTF-16 LE)
URL: "http://en.wikipedia.org/wiki/Xliff"
FileNameExtensions: ["xlf", "xliff"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    #                    <
    Bytes: [0xFF, 0xFE, 0x3C, 0x00]
  - Pos: any
    AsciiString: "S\0O\0U\0R\0C\0E\0-\0L\0A\0N\0G\0U\0A\0G\0E"
    CaseSensitive: false
  - Pos: any
    AsciiString: "T\0R\0A\0N\0S\0-\0U\0N\0I\0T"
    CaseSensitive: false
  - Pos: any
    AsciiString: "D\0A\0T\0A\0T\0Y\0P\0E"
    CaseSensitive: false
  - Pos: any
    AsciiString: "V\0E\0R\0S\0I\0O\0N"
    CaseSensitive: false
  - Pos: any
    AsciiString: "X\0L\0I\0F\0F"
    CaseSensitive: false
  - Pos: any
    AsciiString: "F\0I\0L\0E"
    CaseSensitive: false
  - Pos: any
    AsciiString: "I\0T\0 \0I"
    CaseSensitive: false
  - Pos: any
    AsciiString: "N\0A\0M\0E"
    CaseSensitive: false
