Name: StarUML Model
URL: "http://en.wikipedia.org/wiki/StarUML"
FileNameExtensions: ["mdj"]
MimeType: application/json
DetectionPatterns:
  - Pos: 0
    AsciiString: "{"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DEFAULTDIAGRAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OWNEDELEMENTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_PARENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$REF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
