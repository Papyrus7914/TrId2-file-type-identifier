Name: Axure RP Library
URL: "https://www.axure.com/"
FileNameExtensions: ["rplib"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xAC, 0xEF]
  - Pos: 3
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "8PHOTOSHOP 3.0\08BIM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESIGNDOCUMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LEXIF\0\0MM\0*"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIDGETINFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ICONHIDPI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THUMBNAIL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$\0RPARTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHILDREN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SETTINGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOOLTIP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CUSTOM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CKAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$3BR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HASH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JFIF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROOT"
    CaseSensitive: false
