Name: VangeliSTeam audio library Device (v2.x)
Description: DOS audio library.
FileNameExtensions: ["dev"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "VTAL\xFF\xFF\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BY JCAB OF IGUANA-VANGELISTEAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(C) COPYRIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEVICE."
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOUND"
    CaseSensitive: false
