Name: Euro Truck Simulator game data
URL: "https://en.wikipedia.org/wiki/Truck_Simulator"
FileNameExtensions: ["scs"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "EST.SII"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AT.SII"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOUND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRUCK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".TXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIGN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNIT"
    CaseSensitive: false
