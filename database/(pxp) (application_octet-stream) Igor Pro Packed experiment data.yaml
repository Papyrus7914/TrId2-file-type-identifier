    CaseSensitive: true
  - Pos: 12
    AsciiString: "Misc_Start\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DEFAULTFONT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IGORVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MISC_START"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MISC_END"
    CaseSensitive: false
  - Pos: any
