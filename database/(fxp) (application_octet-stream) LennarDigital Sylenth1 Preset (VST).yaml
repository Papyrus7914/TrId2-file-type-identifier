Name: LennarDigital Sylenth1 Preset (VST)
URL: "https://www.lennardigital.com/sylenth1/"
FileNameExtensions: ["fxp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "CcnK"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "FPCh\0\0\0\x01syl1"
    CaseSensitive: true
  - Pos: 60
    AsciiString: "1lys"
    CaseSensitive: true
  - Pos: any
    AsciiString: "1LYS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FPCH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYL1"
    CaseSensitive: false
