Name: Voxlap Animation
URL: "https://en.wikipedia.org/wiki/Ken_Silverman#Voxlap"
FileNameExtensions: ["anim"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "ANIM"
    CaseSensitive: true
  - Pos: 13
    AsciiString: "kv6\\"
    CaseSensitive: true
  - Pos: any
    AsciiString: "IDLE"
    CaseSensitive: false
