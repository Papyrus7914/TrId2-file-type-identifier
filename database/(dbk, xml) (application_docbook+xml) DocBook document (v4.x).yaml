Name: DocBook document (v4.x)
URL: "https://en.wikipedia.org/wiki/DocBook"
FileNameExtensions: ["dbk", "xml"]
MimeType: application/docbook+xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DTD DOCBOOK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SECTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PUBLIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OASIS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPEN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARA"
    CaseSensitive: false
