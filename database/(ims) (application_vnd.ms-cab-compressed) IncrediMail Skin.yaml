Name: IncrediMail Skin
URL: "http://www.incredimail.com"
FileNameExtensions: ["ims"]
MimeType: application/vnd.ms-cab-compressed
DetectionPatterns:
  - Pos: 0
    AsciiString: "MSCF\0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CAPTIONBAR.BMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENT.INI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TSCROLL"
    CaseSensitive: false
