Name: Poseidon for UML project file
URL: "http://www.gentleware.com/"
FileNameExtensions: ["zuml"]
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: ".XMIPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PROJ"
    CaseSensitive: false
