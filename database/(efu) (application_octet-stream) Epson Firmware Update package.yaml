Name: Epson Firmware Update package
FileNameExtensions: ["efu"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "FW"
    CaseSensitive: true
  - Pos: 38
    AsciiString: ".rcx"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".RCX"
    CaseSensitive: false
