    AsciiString: "[FormatInfo]"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TEXNICCENTERPROJECTINFORMATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECTLANGUAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECTDIALECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ACTIVEPROFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USEMAKEINDEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMATINFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USEBIBTEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAINFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LATEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".TEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
