Name: Pioneer DJ DDJ-FLX10 firmware
URL: "https://www.pioneerdj.com/en/support/software/controller/ddj-flx10/"
FileNameExtensions: ["upd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "UPD 0100"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "DDJFLX10"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DDJFLX10"
    CaseSensitive: false
