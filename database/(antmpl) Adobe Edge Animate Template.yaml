Name: Adobe Edge Animate Template
FileNameExtensions: ["antmpl"]
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "TEMPLATE-INFO.JSPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_EDGEACTIONS.JSPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_EDGEPRELOAD.JSPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EDGE_INCLUDES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MANIFEST.JSPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THUMB.PNGPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_EDGE.JSPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".MIN.JSPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".HTMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JQUERY-"
    CaseSensitive: false
