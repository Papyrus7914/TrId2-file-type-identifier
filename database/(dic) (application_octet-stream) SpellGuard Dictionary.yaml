Name: SpellGuard Dictionary
FileNameExtensions: ["dic"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SPELLGUARD B COPYRIGHT (C) 19"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PARTS SOLD IN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SORCIM"
    CaseSensitive: false
