Name: Bytenode Compiled JavaScript
URL: "https://github.com/bytenode/bytenode"
FileNameExtensions: ["jsc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 2
    Bytes: [0xDE, 0xC0]
  - Pos: 10
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "EVALMACHINE."
    CaseSensitive: false
  - Pos: any
    AsciiString: "ANONYMOUS"
    CaseSensitive: false
