Name: libtool library control info
URL: "https://www.gnu.org/software/libtool/manual/html_node/Linking-libraries.html"
FileNameExtensions: ["la"]
MimeType: application/x-shared-library-la
DetectionPatterns:
  - Pos: 0
    AsciiString: "# "
    CaseSensitive: true
  - Pos: any
    AsciiString: "LIBTOOL LIBRARY FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION INFORMATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEPENDENCY_LIBS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LIBRARY_NAMES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OLD_LIBRARY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INSTALLED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REVISION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CURRENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DLNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DLOPEN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LIBDIR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "READ"
    CaseSensitive: false
