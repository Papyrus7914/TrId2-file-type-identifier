Name: MP3 to EXE multi-part (v2.x)
URL: "https://www.rarewares.org/rrw/mp3toexe.php"
FileNameExtensions: ["mmm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "8\x12\0\0\x01\0\0\0\xF1J\xEA\0\0\0\x04\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".MP3"
    CaseSensitive: false
