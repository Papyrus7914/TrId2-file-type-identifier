Name: SCUMM digitized Sounds (v5-6)
URL: "https://wiki.scummvm.org/index.php/SCUMM/Technical_Reference/Sound_resources"
FileNameExtensions: ["sou"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SOU "
    CaseSensitive: true
  - Pos: 8
    AsciiString: "V"
    CaseSensitive: true
  - Pos: 10
    AsciiString: "TL"
    CaseSensitive: true
