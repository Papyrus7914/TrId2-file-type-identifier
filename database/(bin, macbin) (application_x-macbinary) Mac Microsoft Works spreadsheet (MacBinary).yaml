Name: Mac Microsoft Works spreadsheet (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/Microsoft_Works"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "AWSS"
    CaseSensitive: true
  - Pos: any
    AsciiString: "AWSS"
    CaseSensitive: false
