Name: Nokia Saved SMS
FileNameExtensions: ["vmg"]
MimeType: text/x-vMessage
DetectionPatterns:
  - Pos: 0
    AsciiString: "BEGIN:VMSG"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BEGIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VBODY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VENV"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VMSG"
    CaseSensitive: false
