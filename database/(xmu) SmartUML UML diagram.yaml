Name: SmartUML UML diagram
URL: "http://smartuml.sourceforge.net/"
FileNameExtensions: ["xmu"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<xuml>\r\n  <SmartUml.ObjectModel.Project_SmartUml.ObjectModel path=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "SMARTUML.OBJECTMODEL.CLASSDIAGRAM.CLASSDIAGRAMMODEL_SMARTUML.OBJECTMODEL NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SMARTUML.OBJECTMODEL.ACTIVITYDIAGRAM.ACTIVITYMODEL_SMARTUML.OBJECTMODEL NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SMARTUML.OBJECTMODEL.USECASEDIAGRAM.USECASEMODEL_SMARTUML.OBJECTMODEL NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SMARTUML.OBJECTMODEL.PROJECT_SMARTUML.OBJECTMODEL PATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NEW ACTIVITY DIAGRAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NEW USE CASE DIAGRAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NEW CLASS DIAGRAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SELECTED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENABLED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VISIBLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FALSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".XMU"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XUML"
    CaseSensitive: false
