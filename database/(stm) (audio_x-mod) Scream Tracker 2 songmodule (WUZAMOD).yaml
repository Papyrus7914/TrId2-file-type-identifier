Name: Scream Tracker 2 song/module (WUZAMOD)
URL: "https://wiki.multimedia.cx/index.php/Scream_Tracker_2_Module"
FileNameExtensions: ["stm"]
MimeType: audio/x-mod
DetectionPatterns:
  - Pos: 20
    AsciiString: "WUZAMOD!"
    CaseSensitive: true
  - Pos: 30
    Bytes: [0x02]
  - Pos: any
    AsciiString: "WUZAMOD"
    CaseSensitive: false
