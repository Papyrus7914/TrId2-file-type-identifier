Name: 3DVIA Composer model
URL: "https://en.wikipedia.org/wiki/3dvia"
FileNameExtensions: ["smg"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SMGPK\x03\x04"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PRODUCT.SMGGEOMPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRODUCT.SMGXMLPK"
    CaseSensitive: false
