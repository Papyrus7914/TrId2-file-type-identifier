    AsciiString: "FUNC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GLBL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOCD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOCL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MIVA"
    CaseSensitive: false
  - Pos: any
