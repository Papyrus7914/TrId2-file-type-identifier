Name: Torque audio asset (XML)
Description: TAML is an acronym of Torque Application Mark-up Language.
URL: "https://en.wikipedia.org/wiki/Torque_(game_engine)"
FileNameExtensions: ["taml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<AudioAsset"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ASSETAUTOUNLOAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ASSETNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUDIOFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".WAV"
    CaseSensitive: false
