Name: QNX volume disk image
URL: "https://en.wikipedia.org/wiki/QNX"
FileNameExtensions: ["img"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "vol "
    CaseSensitive: true
  - Pos: 34
    AsciiString: "/"
    CaseSensitive: true
  - Pos: 38
    AsciiString: "/"
    CaseSensitive: true
  - Pos: 44
    AsciiString: ":"
    CaseSensitive: true
  - Pos: 47
    AsciiString: "            root\0"
    CaseSensitive: true
