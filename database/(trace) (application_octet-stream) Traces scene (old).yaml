Name: Traces scene (old)
URL: "https://en.wikipedia.org/wiki/Blender_(software)#History"
FileNameExtensions: ["trace"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "TRA6WRLD"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ENDT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OBJT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PALE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
