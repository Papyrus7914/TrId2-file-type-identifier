Name: yEnc Encoded
Description: yEnc is a new encoding method which offers efficient and proper transmission for binaries on the Usenet (or by eMail and other applications).
URL: "https://en.wikipedia.org/wiki/YEnc"
FileNameExtensions: ["ync"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "=ybegin "
    CaseSensitive: true
  - Pos: 12
    AsciiString: "="
    CaseSensitive: true
  - Pos: any
    AsciiString: "YEND SIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "YBEGIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CRC32"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LINE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
