Name: Mayo/SPM Analyze format Header (LE)
URL: "http://www.grahamwideman.com/gw/brain/analyze/formatdoc.htm"
FileNameExtensions: ["hdr"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\\\x01\0\0"
    CaseSensitive: true
  - Pos: 32
    AsciiString: "\0@\0\0"
    CaseSensitive: true
  - Pos: 38
    AsciiString: "r"
    CaseSensitive: true
