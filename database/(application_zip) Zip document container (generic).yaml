Name: Zip document container (generic)
Description: Generic format for document using a zip container with mimetype indication.
URL: "http://en.wikipedia.org/wiki/Zip_(file_format)"
MimeType: application/zip
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "mimetype"
    CaseSensitive: true
