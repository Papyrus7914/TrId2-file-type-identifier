Name: DDP Image (ZIP)
URL: "https://en.wikipedia.org/wiki/Disc_Description_Protocol"
FileNameExtensions: ["zip"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "CHECKSUM.MD5PK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHECKSUM.TXTPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMAGE.DATPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DDPIDPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DDPMSPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SDPK"
    CaseSensitive: false
