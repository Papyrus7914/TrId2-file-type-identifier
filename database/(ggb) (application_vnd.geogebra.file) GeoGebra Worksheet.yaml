Name: GeoGebra Worksheet
URL: "https://en.wikipedia.org/wiki/GeoGebra"
FileNameExtensions: ["ggb"]
MimeType: application/vnd.geogebra.file
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "geogebra_"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GEOGEBRA_THUMBNAIL.PNGPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GEOGEBRA.XMLPK"
    CaseSensitive: false
