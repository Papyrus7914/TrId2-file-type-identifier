Name: Aldus Placeable Metafile
Description: (Need to be checked! if you can verify, let me know! THX!)
URL: "http://www.whisqu.se/per/docs/wmf.htm"
FileNameExtensions: ["apm"]
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD7, 0xCD, 0xC6, 0x9A, 0x00, 0x00]
  - Pos: 18
    AsciiString: "\0\0"
    CaseSensitive: true
