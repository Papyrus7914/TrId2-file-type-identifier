Name: Outlook Message
URL: "http://www.microsoft.com"
FileNameExtensions: ["msg"]
MimeType: application/vnd.ms-outlook
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1, 0x00]
  - Pos: any
    AsciiString: "_\0_\0P\0R\0O\0P\0E\0R\0T\0I\0E\0S\0_\0V\0E\0R\0S\0I\0O\0N\01\0.\00"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_\0_\0N\0A\0M\0E\0I\0D\0_\0V\0E\0R\0S\0I\0O\0N\01\0.\00"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_\0_\0S\0U\0B\0S\0T\0G\01\0.\00\0_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "R\0O\0O\0T\0 \0E\0N\0T\0R\0Y"
    CaseSensitive: false
