Name: GROMACS Residue Topology (with rem)
URL: "https://en.wikipedia.org/wiki/GROMACS"
FileNameExtensions: ["rtp"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: ";"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BONDS  ANGLES  DIHEDRALS  IMPROPERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BONDEDTYPES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ATOMS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXCL"
    CaseSensitive: false
