Name: Verilog source code (with rem 1)
Description: For sources that starts with a single line comment.
URL: "https://en.wikipedia.org/wiki/Verilog"
FileNameExtensions: ["v"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "//"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ENDMODULE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUTPUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INPUT"
    CaseSensitive: false
