Name: Shapr3D workspace
URL: "https://www.shapr3d.com/"
FileNameExtensions: ["shapr"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "workspace\xEC"
    CaseSensitive: true
  - Pos: any
    AsciiString: "WORKSPACEPK"
    CaseSensitive: false
