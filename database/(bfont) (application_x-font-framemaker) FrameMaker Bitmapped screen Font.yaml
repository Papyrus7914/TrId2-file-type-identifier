Name: FrameMaker Bitmapped screen Font
Description: Used by the UNIX versions of FrameMaker.
URL: "https://en.wikipedia.org/wiki/Adobe_FrameMaker"
FileNameExtensions: ["bfont"]
MimeType: application/x-font-framemaker
DetectionPatterns:
  - Pos: 0
    AsciiString: "<MakerScreenFont 1."
    CaseSensitive: true
