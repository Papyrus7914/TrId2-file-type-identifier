Name: SoundTrakker128 tune
FileNameExtensions: ["st2"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "BIN"
    CaseSensitive: true
  - Pos: 1304
    AsciiString: "ST-128 Module"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ST-128 MODULE"
    CaseSensitive: false
