    CaseSensitive: true
  - Pos: 22
    AsciiString: "  (FORMAT "
    CaseSensitive: true
  - Pos: any
    AsciiString: "(CADSTARPCB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(FORMAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(HEADER"
    CaseSensitive: false
