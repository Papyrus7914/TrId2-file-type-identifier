Name: Windows Device Dependent Bitmap
URL: "http://fileformats.archiveteam.org/wiki/Windows_DDB"
FileNameExtensions: ["ddb", "bmp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x02\0\0\0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "\0\0\0\0"
    CaseSensitive: true
