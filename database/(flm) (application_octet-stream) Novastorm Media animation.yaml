Name: Novastorm Media animation
Description: Video only, no audio.
URL: "https://wiki.multimedia.cx/index.php?title=Novastorm_Media"
FileNameExtensions: ["flm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PCFM"
    CaseSensitive: true
  - Pos: 14
    AsciiString: "SPAL"
    CaseSensitive: true
  - Pos: 218
    AsciiString: "FRAM"
    CaseSensitive: true
