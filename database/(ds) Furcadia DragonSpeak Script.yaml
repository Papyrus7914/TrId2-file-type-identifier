Name: Furcadia DragonSpeak Script
URL: "http://www.furcadia.com/"
FileNameExtensions: ["ds"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "DSPK"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FURCADIA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENDTRIGGER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENDTRIGGERS"
    CaseSensitive: false
