Name: PerFORM Form's Fill/template (v1.00)
Description: Form program for GEM by Delrina.
URL: "https://en.wikipedia.org/wiki/PerForm"
FileNameExtensions: ["ffl"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Per:FILL-Header-1.00\r\n"
    CaseSensitive: true
  - Pos: 23
    AsciiString: ":\\"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FILL-FIELDS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".FRM"
    CaseSensitive: false
