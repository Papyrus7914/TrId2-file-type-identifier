Name: Remote Desktop Connection Settings
Description: An .rdp file contains all of the information for a connection to a terminal server, including the Options settings that were configured when the file was saved.
URL: "http://www.microsoft.com/windowsxp/using/mobility/default.mspx"
FileNameExtensions: ["rdp"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "screen mode id:i:"
    CaseSensitive: true
  - Pos: any
    AsciiString: "AUTORECONNECTION ENABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BITMAPCACHEPERSISTENABL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISABLE FULL WINDOW DRA"
    CaseSensitive: false
