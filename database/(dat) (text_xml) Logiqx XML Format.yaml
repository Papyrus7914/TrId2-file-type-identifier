Name: Logiqx XML Format
Description: Info for game Rom Managers.
FileNameExtensions: ["dat"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "DTD ROM MANAGEMENT DATAFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCTYPE DATAFILE PUBLIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.LOGIQX.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATAFILE.DTD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GAME NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROM NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTHOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEADER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HOME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIZE"
    CaseSensitive: false
