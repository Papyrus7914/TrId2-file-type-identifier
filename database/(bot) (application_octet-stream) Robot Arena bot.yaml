Name: Robot Arena bot
URL: "https://en.wikipedia.org/wiki/Robot_Arena#Robot_Arena"
FileNameExtensions: ["bot"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "k\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MODELS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_COLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".TGA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BOTS"
    CaseSensitive: false
