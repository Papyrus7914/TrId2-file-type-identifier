Name: EclipseCrossword CrossWord
URL: "http://www.eclipsecrossword.com"
FileNameExtensions: ["ecw"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "; EclipseCrossword "
    CaseSensitive: true
  - Pos: any
    AsciiString: "CROSSWORD PUZZLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "* ACROSS WORDS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "* DOWN WORDS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COPYRIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CODEPAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTHOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIDTH"
    CaseSensitive: false
