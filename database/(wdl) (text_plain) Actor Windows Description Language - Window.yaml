Name: Actor Windows Description Language - Window
URL: "https://en.wikipedia.org/wiki/Actor_(programming_language)"
FileNameExtensions: ["wdl"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "Window "
    CaseSensitive: true
  - Pos: any
    AsciiString: "CLASS"
    CaseSensitive: false
