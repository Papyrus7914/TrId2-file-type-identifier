Name: Cura extruder definition
URL: "https://en.wikipedia.org/wiki/Ultimaker"
FileNameExtensions: ["json"]
MimeType: text/json
DetectionPatterns:
  - Pos: 0
    AsciiString: "{"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DEFAULT_VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTRUDER_NR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FDMEXTRUDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OVERRIDES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INHERITS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "METADATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POSITION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MACHINE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
