Name: Vassal Module
URL: "https://vassalengine.org/"
FileNameExtensions: ["vmod"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "MODULEDATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUILDFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMAGES"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PNG"
    CaseSensitive: false
