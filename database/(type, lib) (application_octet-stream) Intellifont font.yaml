Name: Intellifont font
URL: "https://en.wikipedia.org/wiki/Intellifont"
FileNameExtensions: ["type", "lib"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0D\0\x01\0\0\0"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "\0\0\x02\0\0\x02"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "\0\x14\xFF\xFF\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "I\0\0\0B"
    CaseSensitive: false
  - Pos: any
    AsciiString: "M\0\0\0B"
    CaseSensitive: false
