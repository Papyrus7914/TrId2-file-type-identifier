Name: openMSX machine/device configuration
URL: "https://en.wikipedia.org/wiki/OpenMSX"
FileNameExtensions: ["xml"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOCTYPE MSXCONFIG SYSTEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MSXCONFIG2.DTD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEVICES"
    CaseSensitive: false
