Name: Sith Engine indexed-color texture format
URL: "https://starwars.fandom.com/wiki/Sith_Engine"
FileNameExtensions: ["mat"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MAT 2\0\0\0"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 13
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 84
    AsciiString: "\0\0\x80?\0\0\x80?\0\0\x80?\0\0\x80?"
    CaseSensitive: true
