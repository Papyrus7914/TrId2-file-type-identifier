Name: Canon Design Essentials printer info
FileNameExtensions: ["csc"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "#csc\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "OUTPUT-DIMENSIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INPUT-DIMENSIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INPUT-SPACE LAB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NODES-PER-SIDE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUTPUT-BOUNDS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISTRIBUTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INPUT-BOUNDS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUTPUT-SPACE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BLACK-WHITE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENDHEADER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CC-TABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ERROR"
    CaseSensitive: false
