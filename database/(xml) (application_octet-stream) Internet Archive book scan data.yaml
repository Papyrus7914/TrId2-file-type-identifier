Name: Internet Archive book scan data
Description: One of the file types resulting from their book scanning process.
FileNameExtensions: ["xml"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "ADDTOACCESSFORMATS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGE LEAFNUM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ORIGHEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BOOKSTART"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LEAFCOUNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ORIGWIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BOOKDATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGEDATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGETYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CROPBOX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BOOKID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NORMAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
