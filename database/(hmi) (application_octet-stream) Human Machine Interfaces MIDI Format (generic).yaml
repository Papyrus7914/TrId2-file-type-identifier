Name: Human Machine Interfaces MIDI Format (generic)
URL: "http://www.shikadi.net/moddingwiki/Human_Machine_Interfaces_MIDI_Format"
FileNameExtensions: ["hmi"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "HMI"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MIDI"
    CaseSensitive: false
