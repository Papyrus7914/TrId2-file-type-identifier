Name: Easy Cut Studio project
Description: Previously Sure Cuts Alot.
URL: "http://www.easycutstudio.com/"
FileNameExtensions: ["scut"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<xml version=\"1.0\">"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SURE_CUTS_ALOT VERSION_MAJOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KEEP_ASPECT_RATIO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_DATA MAT_SIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION_MINOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUTLINES EMW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHADOW_SIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHAPE_SVG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NORMAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH T"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ANGLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FALSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GROUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STYLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PT X"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WELD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMAX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "YMAX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "YMIN"
    CaseSensitive: false
