Name: Mastercam ToolBar configuration
URL: "https://www.mastercam.com/"
FileNameExtensions: ["mtb"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "DROPDOWN START "
    CaseSensitive: true
  - Pos: any
    AsciiString: "FUNCTION MASTERCAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOOLBAR START EDIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TB_STATES START"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TB_STATES END"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DROPDOWN END"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOOLBAR END"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DDCOMMAND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEPARATOR"
    CaseSensitive: false
