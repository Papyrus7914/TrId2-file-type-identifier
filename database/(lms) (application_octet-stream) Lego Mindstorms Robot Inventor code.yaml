Name: Lego Mindstorms Robot Inventor code
URL: "https://en.wikipedia.org/wiki/Lego_Mindstorms#Lego_Mindstorms_Robot_Inventor"
FileNameExtensions: ["lms"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "manifest.json"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MANIFEST.JSONPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCRATCH.SB3PK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ICON.SVGPK"
    CaseSensitive: false
