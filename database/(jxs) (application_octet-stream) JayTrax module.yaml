Name: JayTrax module
FileNameExtensions: ["jxs"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 1
    AsciiString: "\r\0\0"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BASS"
    CaseSensitive: false
