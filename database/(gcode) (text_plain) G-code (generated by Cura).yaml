Name: G-code (generated by Cura)
URL: "https://ultimaker.com/software/ultimaker-cura"
FileNameExtensions: ["gcode"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: ";"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GENERATED WITH CURA_STEAMENGINE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FLAVOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTRU"
    CaseSensitive: false
  - Pos: any
    AsciiString: "G1 X"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TIME"
    CaseSensitive: false
