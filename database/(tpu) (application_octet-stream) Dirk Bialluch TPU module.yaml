Name: Dirk Bialluch TPU module
Description: Used in the Time Lock game, by The Power Unit.
URL: "http://www.exotica.org.uk/wiki/Dirk_Bialluch_(format)"
FileNameExtensions: ["tpu"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MSNG"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MARP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MGRV"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MPRG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MPTN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MSEQ"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MSNG"
    CaseSensitive: false
