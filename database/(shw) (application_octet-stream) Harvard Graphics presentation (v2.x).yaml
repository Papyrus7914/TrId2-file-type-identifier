Name: Harvard Graphics presentation (v2.x)
URL: "https://en.wikipedia.org/wiki/Harvard_Graphics"
FileNameExtensions: ["shw"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SHOW"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".CHT"
    CaseSensitive: false
