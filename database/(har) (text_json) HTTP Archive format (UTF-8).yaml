Name: HTTP Archive format (UTF-8)
URL: "https://en.wikipedia.org/wiki/.har"
FileNameExtensions: ["har"]
MimeType: text/json
DetectionPatterns:
  - Pos: 0
    #                          {
    Bytes: [0xEF, 0xBB, 0xBF, 0x7B]
  - Pos: any
    AsciiString: "CREATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENTRIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
