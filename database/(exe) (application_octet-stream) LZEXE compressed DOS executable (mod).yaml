Name: LZEXE compressed DOS executable (mod)
Description: Original signatures modified.
URL: "https://bellard.org/lzexe.html"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0\0\x02\0"
    CaseSensitive: true
  - Pos: 17
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 21
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 24
    AsciiString: "\x1C\0\0\0"
    CaseSensitive: true
