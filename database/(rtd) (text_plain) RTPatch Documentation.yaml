Name: RTPatch Documentation
URL: "https://www.pocketsoft.com/rtpatch_binary_diff.html"
FileNameExtensions: ["rtd"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    Bytes: [0xDA, 0xC4, 0xC4, 0xC4, 0xC4, 0xC4, 0xC4, 0xC4, 0xC4, 0xC4, 0xC4, 0xC4, 0xC4, 0xC4, 0xC4, 0xC4, 0xC4, 0xC4, 0xC4, 0xC4, 0xC4, 0xC4, 0xC4, 0xC4, 0xC4, 0xC4, 0xC4, 0xC4, 0xC4, 0xC4, 0xC4, 0xC4, 0xBF]
  - Pos: any
    AsciiString: "ACTION   ENTRY NAME     OLD NAME       NEW NAME      PATCH SIZE  REDUCED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATCH PROGRAM BEHAVIOR SETTINGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".RTPATCH DOCUMENTATION FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GLOBAL PATCH UNDO ON ERROR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFORMATION DISPLAY LEVEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BACKUP AFFECTED FILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRINT  ERROR MESSAGES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEARCH PATH FOR FILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEARCH SUBDIRECTORIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IGNORE MISSING FILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILES TO BE PATCHED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PASSWORD PROTECTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".RTP (CREATED)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE CREATED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TIME CREATED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATCH FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USER LEVEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ADVANCED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERBOSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODIFY"
    CaseSensitive: false
