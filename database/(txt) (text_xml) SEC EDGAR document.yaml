Name: SEC EDGAR document
URL: "https://www.sec.gov/edgar"
FileNameExtensions: ["txt"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<SEC-DOCUMENT>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SEC-DOCUMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEC-HEADER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEQUENCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
