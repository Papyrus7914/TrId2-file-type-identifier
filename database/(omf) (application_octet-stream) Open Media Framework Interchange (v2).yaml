Name: Open Media Framework Interchange (v2)
URL: "http://fileformats.archiveteam.org/wiki/OMF_Interchange"
FileNameExtensions: ["omf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 5
    AsciiString: "omfi:data"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OMFI"
    CaseSensitive: false
