Name: Star Wolves Textures Cache
URL: "https://www.mobygames.com/game/17957/star-wolves/"
FileNameExtensions: ["txtcache"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "PRIORITY    FORMAT WIDTH HEIGHT MIPCNT MAXRFC ZERORFC LIFETIME SIZE Kb NAME\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "0 ARGB_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "0 XRGB_"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".DDS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "4444"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTO"
    CaseSensitive: false
