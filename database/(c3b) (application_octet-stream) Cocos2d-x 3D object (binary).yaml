Name: Cocos2d-x 3D object (binary)
URL: "https://en.wikipedia.org/wiki/Cocos2d"
FileNameExtensions: ["c3b"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "C3B\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VERTEX_ATTRIB_TEX_COORD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERTEX_ATTRIB_POSITION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERTEX_ATTRIB_NORMAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHAPE1_PART1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GL_FLOAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MATERIAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIFFUSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REPEAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".JPG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MESH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NODE"
    CaseSensitive: false
