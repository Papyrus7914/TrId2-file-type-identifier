Name: Moonbase Commander game data archive
URL: "https://en.wikipedia.org/wiki/MoonBase_Commander"
FileNameExtensions: ["cmp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MULT"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "WRAP"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "OFFS"
    CaseSensitive: true
