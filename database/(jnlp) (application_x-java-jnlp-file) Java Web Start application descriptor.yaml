Name: Java Web Start application descriptor
URL: "http://fileformats.archiveteam.org/wiki/Java_Network_Launching_Protocol"
FileNameExtensions: ["jnlp"]
MimeType: application/x-java-jnlp-file
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "INFORMATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RESOURCES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CODEBASE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VENDOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-DESC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HREF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JNLP"
    CaseSensitive: false
