Name: ORIGIN Systems IFF palette
Description: Used for example in Strike Commander and Bioforge.
URL: "https://en.wikipedia.org/wiki/Origin_Systems"
FileNameExtensions: ["iff"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "PALTINFO"
    CaseSensitive: true
