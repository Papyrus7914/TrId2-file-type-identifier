Name: MP4 v2 container video
URL: "https://en.wikipedia.org/wiki/MPEG-4_Part_14"
FileNameExtensions: ["mp4"]
MimeType: video/mp4
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0\0\x1Cftypmp42"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SMHD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VMHD"
    CaseSensitive: false
