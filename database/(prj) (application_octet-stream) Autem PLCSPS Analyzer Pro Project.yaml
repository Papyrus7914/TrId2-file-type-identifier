Name: Autem PLC/SPS Analyzer Pro Project
URL: "https://www.autem.de/"
FileNameExtensions: ["prj"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "BLOC\xE0\0\0\0"
    CaseSensitive: true
  - Pos: 11
    AsciiString: "EMANAPROJ"
    CaseSensitive: true
  - Pos: any
    AsciiString: "EMANAPROJ"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIGNAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IDATX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRESS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".SPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GAMA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IHDR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PHYS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SRGB"
    CaseSensitive: false
