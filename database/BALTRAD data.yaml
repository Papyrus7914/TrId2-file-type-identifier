Name: BALTRAD data
Description: A self-explaining file format for weather radar data and products. It is primariliy intended for use by the Radar Analysis and Visualization Environment (RAVE) and by the Baltic Sea Experiment's Radar Data Centre with users in the BALTEX community.
URL: "http://www.smhi.se/brdc/baltradformat/baltradformat.html"
DetectionPatterns:
  - Pos: 0
    AsciiString: "BALTRAD"
    CaseSensitive: true
