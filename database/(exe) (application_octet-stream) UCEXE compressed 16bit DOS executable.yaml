Name: UCEXE compressed 16bit DOS executable
URL: "http://fileformats.archiveteam.org/wiki/UltraCompressor_II"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0\0\x02\0"
    CaseSensitive: true
  - Pos: 18
    AsciiString: "\0\0\f\0"
    CaseSensitive: true
  - Pos: 24
    AsciiString: "\0\0\0\0UC2X\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "UC2X"
    CaseSensitive: false
