Name: Syslinux COM32 module (v4)
Description: Most version 4 run in flat-memory 32-bit protected mode (relocatable). Start with assembler instructions MOV EAX,21CD4Cfeh
URL: "http://en.wikipedia.org/wiki/SYSLINUX"
FileNameExtensions: ["c32"]
MimeType: application/x-c32-comboot-syslinux-exec
DetectionPatterns:
  - Pos: 0
    #                    L           !
    Bytes: [0xB8, 0xFE, 0x4C, 0xCD, 0x21]
