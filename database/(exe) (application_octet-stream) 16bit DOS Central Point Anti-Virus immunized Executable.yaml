Name: 16bit DOS Central Point Anti-Virus immunized Executable
URL: "http://fileformats.archiveteam.org/wiki/Central_Point_Anti-Virus_immunized_file"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SELF INTEGRITY CHECK WARNING - FILE WAS CHANGED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CENTRAL POINT ANTI-VIRUS (C) 199"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SELF RECONSTRUCTION."
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTINUE EXECUTION."
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHOOSE AN OPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXIT TO DOS."
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRESS R"
    CaseSensitive: false
  - Pos: any
    AsciiString: "C OR E"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MSDOS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PQRVW"
    CaseSensitive: false
