Name: Spring Engine Zipped mod
URL: "https://en.wikipedia.org/wiki/Spring_Engine"
FileNameExtensions: ["sdz"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "MODINFO.LUA"
    CaseSensitive: false
