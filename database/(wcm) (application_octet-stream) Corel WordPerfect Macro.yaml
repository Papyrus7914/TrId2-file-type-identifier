Name: Corel WordPerfect Macro
URL: "https://en.wikipedia.org/wiki/WordPerfect"
FileNameExtensions: ["wcm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xFFWPC"
    CaseSensitive: true
  - Pos: 8
    #              \n
    Bytes: [0x01, 0x0A]
  - Pos: any
    AsciiString: "APPLICATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULT"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".WCM"
    CaseSensitive: false
