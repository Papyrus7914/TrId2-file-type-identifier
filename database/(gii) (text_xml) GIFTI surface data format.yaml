Name: GIFTI surface data format
URL: "https://surfer.nmr.mgh.harvard.edu/fswiki/GIfTI"
FileNameExtensions: ["gii"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOCTYPE GIFTI SYSTEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ARRAYINDEXINGORDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTERNALFILEOFFSET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUMBEROFDATAARRAYS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATAARRAY INTENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTERNALFILENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIMENSIONALITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NIFTI_INTENT_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROWMAJORORDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LITTLEENDIAN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NIFTI_TYPE_"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".NITRC.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LABELTABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GIFTI.DTD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATATYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "METADATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CDATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIM0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
