Name: Poseidon for UML Project information
Description: .PROJ along with .XMI files are contained in a .ZUML file
URL: "http://www.gentleware.com/"
FileNameExtensions: ["proj"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version = \"1.0\" encoding = \"utf-8\" ?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOCTYPE ARGO SYSTEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JAVAPROFILE.XMI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCUMENTATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODIFIEDWITH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULT.XMI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENTLEWARE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTHORNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOURCEPATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLASSPATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RESOURCES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POSEIDON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJ.DTD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOCATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
