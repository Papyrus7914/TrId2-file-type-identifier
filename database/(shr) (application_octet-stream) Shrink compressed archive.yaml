Name: Shrink compressed archive
Description: File compressor by Matthias Meixner.
FileNameExtensions: ["shr"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "CDAFNAME\0\0\0\x06shrinkFILE\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SHRINKFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CDAFNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BODY"
    CaseSensitive: false
