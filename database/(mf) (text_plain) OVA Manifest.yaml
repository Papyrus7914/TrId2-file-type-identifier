Name: OVA Manifest
URL: "https://en.wikipedia.org/wiki/Open_Virtualization_Alliance"
FileNameExtensions: ["mf"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "SHA"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".VMDK)"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".OVF)"
    CaseSensitive: false
