Name: Zenographics Mirage Image
Description: A Windows presentation/business graphics program.
FileNameExtensions: ["ima"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 1
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0%\x01"
    CaseSensitive: true
  - Pos: 29
    Bytes: [0xFF]
  - Pos: any
    AsciiString: "OBJECT"
    CaseSensitive: false
