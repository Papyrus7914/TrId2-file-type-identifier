Name: Graoumf Tracker 2 module
URL: "http://graoumftracker2.sourceforge.net/"
FileNameExtensions: ["gt2"]
MimeType: audio/x-mod
DetectionPatterns:
  - Pos: 0
    AsciiString: "GT2"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GRAOUMF TRACKER V"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SONG"
    CaseSensitive: false
