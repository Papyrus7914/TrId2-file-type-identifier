Name: DemoShield project
URL: "https://en.wikipedia.org/wiki/InstallShield"
FileNameExtensions: ["dsj"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "[Demo]\r\nPath="
    CaseSensitive: true
  - Pos: any
    AsciiString: "DEMOSHIELD PROJECT FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMPORT BY REF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LANGUAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUMBER"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".DBD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
