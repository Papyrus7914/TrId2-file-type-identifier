    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 52
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 57
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 61
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 73
    AsciiString: "\0"
