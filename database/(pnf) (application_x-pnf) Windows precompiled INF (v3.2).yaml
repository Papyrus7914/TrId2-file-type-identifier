Name: Windows precompiled INF (v3.2)
URL: "http://en.verysource.com/code/10350344_1/inf.h.html"
FileNameExtensions: ["pnf"]
MimeType: application/x-pnf
DetectionPatterns:
  - Pos: 0
    Bytes: [0x02, 0x03, 0x02, 0x00]
  - Pos: 80
    AsciiString: "h\0\0\0"
    CaseSensitive: true
  - Pos: 105
    AsciiString: "\0:\0\\\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "V\0E\0R\0S\0I\0O\0N"
    CaseSensitive: false
