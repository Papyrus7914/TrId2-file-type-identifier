Name: G-code (generated by Creality Print)
URL: "https://www.crealitycloud.com/downloads/software/creality-slicer"
FileNameExtensions: ["gcode"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "; HEADER_BLOCK_START"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GENERATED BY CREALITY_PRINT V"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOTAL LAYER NUMBER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEADER_BLOCK_END"
    CaseSensitive: false
