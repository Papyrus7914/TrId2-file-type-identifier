Name: NewWord messages Overlay
Description: WordStar clone by Newstar Software Inc.
FileNameExtensions: ["ovr"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Newword "
    CaseSensitive: true
  - Pos: 9
    AsciiString: "."
    CaseSensitive: true
  - Pos: 12
    AsciiString: "   Messages\r\nReleased on "
    CaseSensitive: true
  - Pos: 39
    AsciiString: " "
    CaseSensitive: true
  - Pos: 43
    AsciiString: " "
    CaseSensitive: true
  - Pos: 46
    AsciiString: "  \r\nCopyright (C) 198"
    CaseSensitive: true
  - Pos: 68
    AsciiString: " Newstar Software Incorporated.\r\nAll rights reserved.\r\n\x1A"
    CaseSensitive: true
