Name: Windows hosts list
URL: "https://en.wikipedia.org/wiki/Hosts_(file)"
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "# "
    CaseSensitive: true
  - Pos: any
    AsciiString: "127.0.0.1       LOCALHOST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MICROSOFT CORP."
    CaseSensitive: false
  - Pos: any
    AsciiString: "MICROSOFT TCP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WINDOWS."
    CaseSensitive: false
  - Pos: any
    AsciiString: "1993-"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HOSTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SERV"
    CaseSensitive: false
