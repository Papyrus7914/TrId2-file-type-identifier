Name: SYLK - SYmbolic LinK data
Description: A Microsoft file format typically used to exchange data between applications, specifically spreadsheets.
URL: "http://en.wikipedia.org/wiki/SYmbolic_LinK_%28SYLK%29"
FileNameExtensions: ["slk", "sylk"]
MimeType: application/x-sylk
DetectionPatterns:
  - Pos: 0
    AsciiString: "ID;P"
    CaseSensitive: true
