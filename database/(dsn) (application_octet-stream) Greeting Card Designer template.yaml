Name: Greeting Card Designer template
Description: App for Windows 3.x by SoftKey Multimedia.
URL: "https://archive.org/details/GREETCARD"
FileNameExtensions: ["dsn"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "IGC\0\0\0\0\0\0V1.00\0\0\0\0DESIGN"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".BMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".DSN"
    CaseSensitive: false
