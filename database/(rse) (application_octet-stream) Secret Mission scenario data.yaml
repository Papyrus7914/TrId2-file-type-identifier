Name: Secret Mission scenario data
URL: "https://www.mobygames.com/game/22008/secret-mission/"
FileNameExtensions: ["rse"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x01\0\xC8\0\0\0\0\0@\x01\x01\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 17
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ANFL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CMAP"
    CaseSensitive: false
