Name: XFDL form
Description: XFDL stand for Extensible Forms Description Language.
URL: "http://www.w3.org/TR/NOTE-XFDL"
FileNameExtensions: ["xfdl"]
MimeType: application/vnd.xfdl
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml "
    CaseSensitive: true
  - Pos: any
    AsciiString: "FIELD SID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA SID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MIMEDATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGE SID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XFDL"
    CaseSensitive: false
