Name: SmartDraw document
Description: SmartDraw is a software for creating charts and diagrams.
URL: "http://www.smartdraw.com"
FileNameExtensions: ["sdr"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "SMARTDRW\x01\x80"
    CaseSensitive: true
  - Pos: 21
    AsciiString: "\0d\0X\x02"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LIBRARIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SMARTDRW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WINSPOOL"
    CaseSensitive: false
