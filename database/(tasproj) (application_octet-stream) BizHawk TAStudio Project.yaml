Name: BizHawk TAStudio Project
URL: "http://tasvideos.org/BizHawk.html"
FileNameExtensions: ["tasproj"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "Header.txt5"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GREENZONESETTINGS.TXTPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYNCSETTINGS.JSONPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INPUT LOG.TXTPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SUBTITLES.TXTPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMENTS.TXTPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MARKERS.TXTPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEADER.TXTPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GREENZONEPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEADER.TXT5"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAGLOGPK"
    CaseSensitive: false
