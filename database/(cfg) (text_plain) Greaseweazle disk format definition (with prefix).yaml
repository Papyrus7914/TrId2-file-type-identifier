Name: Greaseweazle disk format definition (with prefix)
URL: "https://github.com/keirf/greaseweazle/"
FileNameExtensions: ["cfg"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "# prefix: "
    CaseSensitive: true
  - Pos: any
    AsciiString: "TRACKS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEADS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CYLS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISK"
    CaseSensitive: false
