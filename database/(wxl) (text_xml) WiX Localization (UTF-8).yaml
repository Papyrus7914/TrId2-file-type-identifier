Name: WiX Localization (UTF-8)
URL: "https://en.wikipedia.org/wiki/WiX"
FileNameExtensions: ["wxl"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    #                          <
    Bytes: [0xEF, 0xBB, 0xBF, 0x3C]
  - Pos: any
    AsciiString: "WIXLOCALIZATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRING ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
