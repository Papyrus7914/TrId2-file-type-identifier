Name: Mega Hack Replay (binary)
Description: Geometry Dash macro/replay file used by Mega Hack.
URL: "https://absolllute.com/"
FileNameExtensions: ["mhr"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "HACKPRO"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "ABS"
    CaseSensitive: true
  - Pos: 20
    AsciiString: "LUTE \0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LUTE"
    CaseSensitive: false
