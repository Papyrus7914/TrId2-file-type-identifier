Name: Tiger Electronics Game.com cartridge image (var.3)
URL: "https://en.wikipedia.org/wiki/Game.com"
FileNameExtensions: ["bin"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TIGERDMGC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UUUV"
    CaseSensitive: false
