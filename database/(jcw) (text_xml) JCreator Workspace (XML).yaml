Name: JCreator Workspace (XML)
URL: "https://en.wikipedia.org/wiki/JCreator"
FileNameExtensions: ["jcw"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml?>\r\r\n<workspace>\r\r\n\t<settings>\r\r\n\t\t<label>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PROJECTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".JCP"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".JCU"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH"
    CaseSensitive: false
