Name: Foobar 2000 Columns UI settings
Description: Foobar2000 is an advanced audio player for the Windows platform.
URL: "http://members.lycos.co.uk/musicf/columns_manual.html"
FileNameExtensions: ["fcs"]
DetectionPatterns:
  - Pos: 0
    #                                                  #           Z     t     r     <     o     \f    u
    Bytes: [0xA5, 0xE2, 0xD6, 0x05, 0xD5, 0x9D, 0xCA, 0x23, 0xBE, 0x5A, 0x74, 0x72, 0x3C, 0x6F, 0x0C, 0x75]
  - Pos: any
    AsciiString: "$IF($"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$IF(%_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%)))"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%ALBUM%"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%_FILENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%_LENGTH%"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%_TIME_ELAPSED%"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%__BITRATE%"
    CaseSensitive: false
  - Pos: any
    AsciiString: "($MOD("
    CaseSensitive: false
  - Pos: any
    AsciiString: "(%ARTIST%"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(%TITLE%"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(%TRACKNUMBER%"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(%_PLAYLIST_NUMBER%"
    CaseSensitive: false
  - Pos: any
    AsciiString: "000000"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ING%"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KBPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME%"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_SECONDS%"
    CaseSensitive: false
