Name: GoldED Display/screen configuration
Description: Amiga text editor by Dietmar Eilert.
FileNameExtensions: ["dsp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SCRN"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".FONT"
    CaseSensitive: false
