Name: Micrografx Picture Publisher halftone Style
URL: "https://en.wikipedia.org/wiki/Picture_Publisher"
FileNameExtensions: ["sty"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "[-]\r\nHalftoneName="
    CaseSensitive: true
  - Pos: any
    AsciiString: "CALIBRATENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEPARATENAME"
    CaseSensitive: false
