    AsciiString: "IDLETASKENABLED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERTY NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILEVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECTTREE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NOTSTARTED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SETTINGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREATED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILTERS"
    CaseSensitive: false
  - Pos: any
