Name: CellBasics spreadsheet
Description: MorphOS spreadsheet.
URL: "https://memtrash-pandas.ca/cellbasics/cellbasics.html"
FileNameExtensions: ["cbx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "styles.json"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CELLBASICS.JSON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STYLES.JSON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TABLE_"
    CaseSensitive: false
