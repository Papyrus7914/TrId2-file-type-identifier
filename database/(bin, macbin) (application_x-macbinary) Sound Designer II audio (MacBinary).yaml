Name: Sound Designer II audio (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/Avid_Audio#Sound_Designer"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "Sd2fSd2a"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SD2FSD2A"
    CaseSensitive: false
