Name: IDA Data Base (64-bit)
URL: "https://en.wikipedia.org/wiki/Interactive_Disassembler"
FileNameExtensions: ["i64"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "IDA2\0\0"
    CaseSensitive: true
  - Pos: 26
    Bytes: [0xDD, 0xCC, 0xBB, 0xAA]
  - Pos: 280
    AsciiString: "B-tree v2"
    CaseSensitive: true
