Name: MakeHuman Material
URL: "https://static.makehumancommunity.org/"
FileNameExtensions: ["mhmat"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "# This is a material file for MakeHuman\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "THIS IS A MATERIAL FILE FOR MAKEHUMAN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHADERCONFIG DISPLACEMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHADERCONFIG VERTEXCOLORS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHADERCONFIG DIFFUSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHADERCONFIG NORMAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHADERCONFIG BUMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHADERCONFIG SPEC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPECULARCOLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AMBIENTCOLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHININESS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPACITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHADERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ECOLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRANS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GLSL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
