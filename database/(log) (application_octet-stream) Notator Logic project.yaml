Name: Notator Logic project
FileNameExtensions: ["log"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #                    G
    Bytes: [0xAB, 0xC0, 0x47, 0x13]
  - Pos: 6
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 10
    AsciiString: "\0$"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GLOBAL OBJECTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INSTRUMENT SET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGE NUMBERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ALL OBJECTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BAR NUMBERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MULT. RESTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "*RECORDING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHORD EXT."
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHORD ROOT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLAIN TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NO OUTPUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(FOLDER)"
