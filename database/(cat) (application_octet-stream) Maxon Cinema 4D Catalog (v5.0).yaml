Name: Maxon Cinema 4D Catalog (v5.0)
URL: "https://en.wikipedia.org/wiki/Cinema_4D"
FileNameExtensions: ["cat"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MC50"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "CAT5"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CAT5"
    CaseSensitive: false
