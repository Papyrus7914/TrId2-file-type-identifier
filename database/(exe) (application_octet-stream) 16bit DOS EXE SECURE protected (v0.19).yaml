Name: 16bit DOS EXE SECURE protected (v0.19)
Description: DOS executable protector by Piotr Warezak.
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 16
    Bytes: [0x80, 0x00]
  - Pos: 21
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 24
    Bytes: [0x1C, 0x00]
  - Pos: 27
    AsciiString: "\0SC  "
    CaseSensitive: true
