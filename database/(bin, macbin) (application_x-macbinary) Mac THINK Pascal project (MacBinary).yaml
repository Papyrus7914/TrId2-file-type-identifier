Name: Mac THINK Pascal project (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://wiki.freepascal.org/THINK_Pascal"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "QPRJ"
    CaseSensitive: true
  - Pos: any
    AsciiString: "QPRJ"
    CaseSensitive: false
