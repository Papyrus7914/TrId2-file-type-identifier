Name: Flipper Zero IR signals
URL: "https://en.wikipedia.org/wiki/Flipper_Zero"
FileNameExtensions: ["ir"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "Filetype: IR signals file"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PROTOCOL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ADDRESS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMAND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARSED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
