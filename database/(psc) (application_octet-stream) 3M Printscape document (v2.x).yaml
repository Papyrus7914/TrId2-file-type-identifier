Name: 3M Printscape document (v2.x)
URL: "http://fileformats.archiveteam.org/wiki/3M_Printscape"
FileNameExtensions: ["psc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 22
    AsciiString: "Basic, HD resident data\0"
    CaseSensitive: true
  - Pos: 298
    AsciiString: "3M Printscape\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "HD RESIDENT DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "3M PRINTSCAPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BASIC"
    CaseSensitive: false
