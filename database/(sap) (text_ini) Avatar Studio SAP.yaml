Name: Avatar Studio SAP
Description: French game by Canal+ Multimedia.
FileNameExtensions: ["sap"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "[TYPE]\r\nFULLSAP\r\n[VERSION]"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CREATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FULLSAP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LILIPUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LEVEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
