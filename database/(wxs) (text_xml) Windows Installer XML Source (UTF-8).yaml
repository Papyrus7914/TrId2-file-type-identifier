Name: Windows Installer XML Source (UTF-8)
URL: "http://en.wikipedia.org/wiki/WiX"
FileNameExtensions: ["wxs"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xEF\xBB\xBF<?xml version="
    CaseSensitive: true
  - Pos: any
    AsciiString: "SCHEMAS.MICROSOFT.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIX XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
