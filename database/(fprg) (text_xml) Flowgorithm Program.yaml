    AsciiString: "<?xml version=\"1.0\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FLOWGORITHM FILEVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DECLARE VARIABLES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUTPUT EXPRESSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ATTRIBUTE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INPUT VARIABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FUNCTION NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ATTRIBUTES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARAMETERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTHORS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ABOUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAVED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BODY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
