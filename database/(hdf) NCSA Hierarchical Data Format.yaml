Name: NCSA Hierarchical Data Format
Description: The Hierarchical Data Format (HDF) was designed to be an easy, straight-forward, and self-describing means of sharing scientific data among people, projects, and types of computers.
URL: "http://hdf.ncsa.uiuc.edu/"
FileNameExtensions: ["hdf"]
DetectionPatterns:
  - Pos: 0
    Bytes: [0x0E, 0x03, 0x13, 0x01]
