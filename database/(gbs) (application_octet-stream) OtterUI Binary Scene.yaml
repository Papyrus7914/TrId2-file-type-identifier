Name: OtterUI Binary Scene
URL: "https://github.com/ppiecuch/OtterUI"
FileNameExtensions: ["gbs"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "CSGG"
    CaseSensitive: true
  - Pos: 56
    AsciiString: "TNFG"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ONDEACTIVATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ONACTIVATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXTURES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WVGGX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CSGG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAGG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAGG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TNFG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIEW"
    CaseSensitive: false
