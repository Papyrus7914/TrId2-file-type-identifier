Name: Lightworks Effect Template
URL: "https://en.wikipedia.org/wiki/Lightworks"
FileNameExtensions: ["fxt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "$\0\x02\0"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 11
    AsciiString: "\0T."
    CaseSensitive: true
  - Pos: any
    AsciiString: "000000010000029A29A\02"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIRING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "START"
    CaseSensitive: false
  - Pos: any
    AsciiString: "T.2\0T"
    CaseSensitive: false
  - Pos: any
    AsciiString: "T.F.E"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
