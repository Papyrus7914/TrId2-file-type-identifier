Name: Valeton GP serie firmware (generic)
URL: "https://www.valeton.net/firmware/"
FileNameExtensions: ["bin"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FRMW"
    CaseSensitive: true
  - Pos: 15
    AsciiString: "\0GP"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ALL RIGHTS RESERVED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FIRMWARE VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FACTORY RESET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HARDWARE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALETON"
    CaseSensitive: false
