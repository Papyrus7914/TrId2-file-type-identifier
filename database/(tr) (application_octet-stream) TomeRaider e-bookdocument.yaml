Name: TomeRaider e-book/document
Description: TomeRaider is a cross-platform reference and e-book reader.
URL: "https://en.wikipedia.org/wiki/TomeRaider"
FileNameExtensions: ["tr"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "7\0\0\x10m\0\0\x10\xD2\x16\0\x10"
    CaseSensitive: true
