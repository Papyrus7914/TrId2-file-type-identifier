Name: Sound Play digitized audio
Description: Digitized sound system by Marcio Luis Teixeira.
FileNameExtensions: ["snd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\n\rUse Sound Play, by Marcio Luis Teixeira, to play this\n\rsound file on your PC.\n\r\x1A"
    CaseSensitive: true
