Name: Quest3D data
FileNameExtensions: ["cgr"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "ACTF"
    CaseSensitive: true
  - Pos: 24
    AsciiString: "ZIOS"
    CaseSensitive: true
  - Pos: 36
    AsciiString: "ZINS"
    CaseSensitive: true
  - Pos: 48
    AsciiString: "ZICB"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ACTF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ZICB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ZINS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ZIOS"
    CaseSensitive: false
