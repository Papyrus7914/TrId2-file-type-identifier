Name: Adobe Duotone Options
FileNameExtensions: ["ado"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\x01\0\x02\0\x03PROBKP\0\0\0\x03 "
    CaseSensitive: true
  - Pos: 109
    AsciiString: "PANTONE "
    CaseSensitive: true
  - Pos: any
    AsciiString: "PANTONE PROCESS"
    CaseSensitive: false
