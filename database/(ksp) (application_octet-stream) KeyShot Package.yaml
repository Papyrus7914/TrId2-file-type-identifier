Name: KeyShot Package
Description: Contain an entire KeyShot scene.
URL: "https://www.keyshot.com"
FileNameExtensions: ["ksp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "KEYSHOT.PACKAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".BIPPK"
    CaseSensitive: false
