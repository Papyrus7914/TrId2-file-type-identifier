Name: MPEG-H Audio Scene Configuration
URL: "https://github.com/Fraunhofer-IIS/mpeghdec/wiki/MPEG-H-UI-Manager-XML-format"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"utf-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DRCSETEFFECTAVAILABLE INDEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROMINENCELEVELPROP MIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUDIOSCENECONFIG UUID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION LANGCODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CUSTOMKIND LANGCODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUDIOELEMENT ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ISACTIONALLOWED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MUTINGPROP DEF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONFIGCHANGED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ISAVAILABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DRCINFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRESETS"
    CaseSensitive: false
