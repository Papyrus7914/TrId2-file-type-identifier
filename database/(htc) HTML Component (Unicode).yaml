Name: HTML Component (Unicode)
FileNameExtensions: ["htc"]
DetectionPatterns:
  - Pos: 0
    #                    <
    Bytes: [0xFF, 0xFE, 0x3C, 0x00]
  - Pos: any
    AsciiString: "A\0T\0T\0A\0C\0H\0 \0E\0V\0E\0N\0T"
    CaseSensitive: false
  - Pos: any
    AsciiString: "C\0O\0M\0P\0O\0N\0E\0N\0T"
    CaseSensitive: false
  - Pos: any
    AsciiString: "F\0U\0N\0C\0T\0I\0O\0N"
    CaseSensitive: false
  - Pos: any
    AsciiString: "P\0U\0B\0L\0I\0C"
    CaseSensitive: false
  - Pos: any
    AsciiString: "S\0C\0R\0I\0P\0T"
    CaseSensitive: false
  - Pos: any
    AsciiString: "N\0A\0M\0E"
    CaseSensitive: false
