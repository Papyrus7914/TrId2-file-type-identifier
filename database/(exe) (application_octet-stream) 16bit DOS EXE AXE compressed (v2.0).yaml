Name: 16bit DOS EXE AXE compressed (v2.0)
Description: Program compression tool by System Enhancement Associates.
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 21
    AsciiString: "\0\0\0\x1E\0\0\0\x01\0\0\0SEA-AXE 2.0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "INVALID COMPRESSED FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COPYRIGHT 1987 - 1989"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INSUFFICIENT MEMORY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INVALID ENVIRONMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNABLE TO OPEN FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$PATH"
    CaseSensitive: false
