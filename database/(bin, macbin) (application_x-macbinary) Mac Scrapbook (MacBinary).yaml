Name: Mac Scrapbook (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/Scrapbook_(Mac_OS)"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "scbk"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SCBK"
    CaseSensitive: false
