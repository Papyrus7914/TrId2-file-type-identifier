Name: ChiWriter low resolution screen font.
Description: ChiWriter is a scientific multifont word processor.
URL: "http://www.xs4all.nl/~jvde/prof/v4pack.htm"
FileNameExtensions: ["cft"]
DetectionPatterns:
  - Pos: 0
    Bytes: [0x11]
  - Pos: 13
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 18
    AsciiString: "\0\b\f\0\b\0\0\0\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".CFT"
    CaseSensitive: false
