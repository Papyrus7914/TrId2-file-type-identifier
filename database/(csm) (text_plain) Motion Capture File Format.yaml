Name: Motion Capture File Format
Description: Motion Capture data that can be played back (for example in 3DStudio Max's Character Studio).
URL: "https://en.wikipedia.org/wiki/Autodesk_3ds_Max#Features"
FileNameExtensions: ["csm"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "$"
    CaseSensitive: true
  - Pos: any
    AsciiString: "$FIRSTFRAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$LASTFRAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$COMMENTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$POINTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$ORDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$RATE"
    CaseSensitive: false
