Name: Edsac Simulator PC settings
Description: A software replica of the EDSAC.
URL: "http://www.dcs.warwick.ac.uk/~edsac/"
FileNameExtensions: ["ini"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "[ToolBarPresets]"
    CaseSensitive: true
  - Pos: any
    AsciiString: "EDSACFORMPLACEMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTOOPENRECENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INITIALORDERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIRECTORIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EDSAC TAPES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TELEPRINTER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IGNORECASE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHORTTANKS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FONT SIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REALTIME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STARTUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RECENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HINTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OTHER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOUND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FONT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LEFT"
    CaseSensitive: false
