    CaseSensitive: false
  - Pos: any
    AsciiString: "ELECTRO-MAGNETIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "*   TRANSMITTED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "*   ELECTRIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OR         *"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OR OTHERWISE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "*   OPTICAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INC.      *"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRANSCRIBED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ELECTRONIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MECHANICAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRANSLATED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
