  - Pos: any
    AsciiString: "*   PERMISSION FROM SUN MICROSYSTEMS INC.                   *"
    CaseSensitive: false
  - Pos: any
    AsciiString: "*   THIS DATA IS PROTECTED BY FEDERAL COPYRIGHT LAW.        *"
    CaseSensitive: false
  - Pos: any
    AsciiString: "*************************************************************"
    CaseSensitive: false
  - Pos: any
    AsciiString: "*   NO PART OF THIS DATA MAY BE REPRODUCED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IN ANY FORM OR BY ANY MEANS MANUAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WITHOUT PRIOR EXPLICIT WRITTEN   *"
    CaseSensitive: false
  - Pos: any
    AsciiString: "*   A RETRIEVAL SYSTEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BY SUN MICROSYSTEMS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "*   COPYRIGHT (C)"
    CaseSensitive: false
  - Pos: any
