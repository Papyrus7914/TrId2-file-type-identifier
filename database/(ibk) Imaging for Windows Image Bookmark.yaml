Name: Imaging for Windows Image Bookmark
Description: (Kodak) Imaging for Windows was included with some version of Microsoft Windows.
URL: "http://support.microsoft.com/default.aspx?scid=kb;en-us;308979"
FileNameExtensions: ["ibk"]
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1]
  - Pos: any
    AsciiString: "S\0U\0M\0M\0A\0R\0Y\0I\0N\0F\0O\0R\0M\0A\0T\0I\0O\0N"
    CaseSensitive: false
  - Pos: any
    AsciiString: "G\0L\0O\0B\0A\0L\0 \0I\0N\0F\0O\0R\0M\0A\0T\0I\0O\0N"
    CaseSensitive: false
  - Pos: any
    AsciiString: "P\0A\0G\0E\0 \0I\0N\0F\0O\0R\0M\0A\0T\0I\0O\0N"
    CaseSensitive: false
  - Pos: any
    AsciiString: "I\0M\0A\0G\0E\0 \0B\0O\0O\0K\0M\0A\0R\0K"
    CaseSensitive: false
  - Pos: any
    AsciiString: "R\0O\0O\0T\0 \0E\0N\0T\0R\0Y"
    CaseSensitive: false
  - Pos: any
    AsciiString: "T\0H\0U\0M\0B\0N\0A\0I\0L"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMENTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KEYWORDS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SUBJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTHOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
