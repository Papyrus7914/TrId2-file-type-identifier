Name: Jupyter Notebook
URL: "http://fileformats.archiveteam.org/wiki/Jupyter_Notebook"
FileNameExtensions: ["ipynb"]
MimeType: application/x-ipynb+json
DetectionPatterns:
  - Pos: 0
    AsciiString: "{"
    CaseSensitive: true
  - Pos: any
    AsciiString: "EXECUTION_COUNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NBFORMAT_MINOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KERNELSPEC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CELL_TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISPLAY_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LANGUAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MARKDOWN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "METADATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUTPUTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOURCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CELLS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PORT"
    CaseSensitive: false
