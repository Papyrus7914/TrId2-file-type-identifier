Name: Hoxs64 state snapshot
Description: Commodore 64 emulator by David Horrocks.
URL: "http://www.hoxs64.net/"
FileNameExtensions: ["64s"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "COMMODORE 64 STATE SNAPSHOT"
    CaseSensitive: true
  - Pos: 36
    AsciiString: "Hoxs64"
    CaseSensitive: true
