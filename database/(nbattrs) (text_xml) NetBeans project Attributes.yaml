Name: NetBeans project Attributes
URL: "https://en.wikipedia.org/wiki/NetBeans"
FileNameExtensions: ["nbattrs"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOCTYPE ATTRIBUTES PUBLIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DTD DEFAULTATTRIBUTES 1.0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ATTRIBUTES VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ATTRIBUTES-1_0.DTD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.NETBEANS.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILEOBJECT NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ATTR NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DTDS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
