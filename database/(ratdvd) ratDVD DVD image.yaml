Name: ratDVD DVD image
Description: ratDVD provide a way to encode a complete, full featured DVD in one file.
URL: "http://www.ratdvd.dk"
FileNameExtensions: ["ratdvd"]
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "Version.xml<?xml version=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "VERSIONINFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CORE"
    CaseSensitive: false
