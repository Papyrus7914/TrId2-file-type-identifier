Name: Images catalog/Index
Description: Paired with a .PVD file with the actual bitmaps. Used by Canon ImageBrowser/Picture Browser, but also other applications/catalogs.
FileNameExtensions: ["pvi"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "ImgC"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "\0\0\0"
    CaseSensitive: true
