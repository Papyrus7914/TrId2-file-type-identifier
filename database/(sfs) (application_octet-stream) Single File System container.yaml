Name: Single File System container
URL: "http://www.aidaim.com/single-file_delphi_virtual_file_system.htm"
FileNameExtensions: ["sfs"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "AAMVHFSS"
    CaseSensitive: true
  - Pos: 280
    AsciiString: "AASFSSGN"
    CaseSensitive: true
