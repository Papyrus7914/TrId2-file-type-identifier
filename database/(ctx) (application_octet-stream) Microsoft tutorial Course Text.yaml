Name: Microsoft tutorial Course Text
Description: Used in various MS-DOS apps/tools like Word, VBDOS.
FileNameExtensions: ["ctx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xAD, 0x90]
  - Pos: 7
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MICROSOFT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRESS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPACE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JUST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MENU"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THEN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
