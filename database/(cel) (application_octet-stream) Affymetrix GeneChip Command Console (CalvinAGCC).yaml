Name: Affymetrix GeneChip Command Console (Calvin/AGCC)
URL: "https://www.affymetrix.com"
FileNameExtensions: ["cel"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: ";\x01\0\0\0"
    CaseSensitive: true
  - Pos: 14
    AsciiString: "affymetrix-calvin-intensity"
    CaseSensitive: true
  - Pos: any
    AsciiString: "A\0F\0F\0Y\0M\0E\0T\0R\0I\0X\0-\0A\0L\0G\0O\0R\0I\0T\0H\0M\0-"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AFFYMETRIX-CALVIN-INTENSITY"
    CaseSensitive: false
