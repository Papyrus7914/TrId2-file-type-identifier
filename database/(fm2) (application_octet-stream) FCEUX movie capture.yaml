Name: FCEUX movie capture
URL: "https://en.wikipedia.org/wiki/FCEUX"
FileNameExtensions: ["fm2"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "version 3\nemuVersion "
    CaseSensitive: true
  - Pos: any
    AsciiString: "ROMCHECKSUM BASE64"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RERECORDCOUNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FOURSCORE 0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROMFILENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EMUVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PALFLAG 0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION 3"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PORT0 1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PORT2 0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PORT1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GUID"
    CaseSensitive: false
