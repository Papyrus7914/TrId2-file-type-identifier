    CaseSensitive: true
  - Pos: any
    AsciiString: "ORIGINALVERSION CREATEDBYPROGRAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GRAPHPADPRISMFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREATEDBYVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRISMXMLVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GRAPHPAD PRISM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TABLESEQUENCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFOSEQUENCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATETIME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SELECTED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REF ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOGIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
