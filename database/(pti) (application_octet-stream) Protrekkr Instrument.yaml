Name: Protrekkr Instrument
Description: Amiga Tracker by Franck Charlet.
FileNameExtensions: ["pti"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 4
    AsciiString: "INS"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 103
    AsciiString: "@@@@@@@@@@@@@@@@@"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".WAV"
    CaseSensitive: false
