Name: Management Pack Fragment (UTF-8)
FileNameExtensions: ["mpx"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xEF\xBB\xBF<ManagementPackFragment SchemaVersion=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "MANAGEMENTPACKFRAGMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MICROSOFT."
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.W3.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLSCHEMA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "2001"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
