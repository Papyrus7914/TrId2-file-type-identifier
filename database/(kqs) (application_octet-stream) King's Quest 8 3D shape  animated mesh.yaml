Name: King's Quest 8 3D shape / animated mesh
URL: "https://www.mobygames.com/game/136/kings-quest-mask-of-eternity/"
FileNameExtensions: ["kqs"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PERS"
    CaseSensitive: true
  - Pos: 10
    AsciiString: "KQ8::Shape"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MATERIALLIST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CELANIMMESH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHAPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".BMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BODY"
    CaseSensitive: false
