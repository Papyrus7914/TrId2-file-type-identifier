Name: RIS citation format (UTF-8)
URL: "http://fileformats.archiveteam.org/wiki/RefMan"
FileNameExtensions: ["ris"]
MimeType: application/x-research-info-systems
DetectionPatterns:
  - Pos: 0
    Bytes: [0xEF, 0xBB, 0xBF]
  - Pos: 5
    AsciiString: "  - "
    CaseSensitive: true
  - Pos: any
    AsciiString: "ER  -"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TY  -"
    CaseSensitive: false
