Name: Profi Install Project (v3.0c)
Description: Installation tool by Adontec Computer Systems Ltd.
FileNameExtensions: ["ipj"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 2
    AsciiString: "C7Z\x04"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "IPJ30c \0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "IPJ30C"
    CaseSensitive: false
