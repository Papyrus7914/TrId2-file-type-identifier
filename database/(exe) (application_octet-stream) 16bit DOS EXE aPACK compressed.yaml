Name: 16bit DOS EXE aPACK compressed
Description: aPACK is a compressor for 16-bit DOS executables.
URL: "http://fileformats.archiveteam.org/wiki/APACK"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 32
    Bytes: [0x1E, 0x06, 0x8C, 0xCB, 0xBA]
  - Pos: 39
    #                          3           3           K
    Bytes: [0x03, 0xDA, 0xFC, 0x33, 0xF6, 0x33, 0xFF, 0x4B, 0x8E, 0xDB, 0x8D, 0x87]
  - Pos: 53
    #                          \b                      J     u                                   3
    Bytes: [0x8E, 0xC0, 0xB9, 0x08, 0x00, 0xF3, 0xA5, 0x4A, 0x75, 0xEB, 0x8E, 0xC3, 0x8E, 0xD8, 0x33, 0xFF, 0xBE]
