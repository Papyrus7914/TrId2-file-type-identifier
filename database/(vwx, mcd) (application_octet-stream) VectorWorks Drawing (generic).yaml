Name: VectorWorks Drawing (generic)
URL: "https://en.wikipedia.org/wiki/Vectorworks"
FileNameExtensions: ["vwx", "mcd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 13
    AsciiString: " V"
    CaseSensitive: true
  - Pos: 57
    AsciiString: "\0VectorWorks\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VECTORWORKS"
    CaseSensitive: false
