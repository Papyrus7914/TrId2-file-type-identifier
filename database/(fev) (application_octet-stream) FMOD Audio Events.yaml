Name: FMOD Audio Events
URL: "https://en.wikipedia.org/wiki/FMOD"
FileNameExtensions: ["fev"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FEV1\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MASTER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MUSIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".WAV"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMP"
    CaseSensitive: false
