Name: GPFax FAX format
Description: Amiga FAX software by GPSoftware.
URL: "http://www.amigareport.com/ar134/p1-11.html"
FileNameExtensions: ["fax"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "FAX3FXHD"
    CaseSensitive: true
