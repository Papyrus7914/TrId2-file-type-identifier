Name: Scala Multimedia Script (generic)
URL: "https://en.wikipedia.org/wiki/Scala_(company)"
FileNameExtensions: ["script"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "V"
    CaseSensitive: true
  - Pos: 2
    AsciiString: "."
    CaseSensitive: true
  - Pos: 4
    AsciiString: "\n\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MARGINS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".FONT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EVENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAUSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCALA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STYLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TABS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIPE"
    CaseSensitive: false
