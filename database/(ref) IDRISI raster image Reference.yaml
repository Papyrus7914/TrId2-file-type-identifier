Name: IDRISI raster image Reference
URL: "http://www.idrisi.com/"
FileNameExtensions: ["ref"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "ref. system :"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ORIGIN LONG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REF. SYSTEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAJOR S-AX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MINOR S-AX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ORIGIN LAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARAMETERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ELLIPSOID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCALE FAC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ORIGIN X"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ORIGIN Y"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATUM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DELTA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNITS"
    CaseSensitive: false
