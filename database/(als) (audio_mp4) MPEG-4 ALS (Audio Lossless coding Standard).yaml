Name: MPEG-4 ALS (Audio Lossless coding Standard)
URL: "http://www.nue.tu-berlin.de/forschung/projekte/lossless/mp4als.html"
FileNameExtensions: ["als"]
MimeType: audio/mp4
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 12
    Bytes: [0xFF, 0x00]
  - Pos: 17
    AsciiString: "\x80\0,"
    CaseSensitive: true
  - Pos: 22
    AsciiString: "RIFF"
    CaseSensitive: true
  - Pos: 30
    AsciiString: "WAVEfmt"
    CaseSensitive: true
  - Pos: 57
    AsciiString: "\0data"
    CaseSensitive: true
