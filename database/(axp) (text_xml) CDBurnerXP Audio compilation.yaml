    AsciiString: "--AUDIO COMPILATION CREATED BY CDBURNERXP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCTYPE LAYOUT PUBLIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML-STYLESHEET TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.CDBURNERXP.SE"
    CaseSensitive: false
