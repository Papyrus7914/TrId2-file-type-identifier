Name: Diesel game engine animation data
URL: "https://en.wikipedia.org/wiki/Diesel_(game_engine)"
FileNameExtensions: ["diesel"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xFF, 0xFF, 0xFF, 0xFF]
  - Pos: 20
    AsciiString: "\x1A\0\0\0AnimationData"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".GEOMETRY"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".TOPOLOGY"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".MAX"
    CaseSensitive: false
