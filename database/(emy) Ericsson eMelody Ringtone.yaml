Name: Ericsson eMelody Ringtone
URL: "http://www.ericsson.com/"
FileNameExtensions: ["emy"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "BEGIN:EMELODY\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "EMELODY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BEGIN"
    CaseSensitive: false
