Name: Stacker compressed volume (generic)
Description: Usually the file is named STACVOL.000
URL: "https://en.wikipedia.org/wiki/Stac_Electronics"
FileNameExtensions: ["000"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "STACKER  version "
    CaseSensitive: true
  - Pos: 23
    AsciiString: "volume:"
    CaseSensitive: true
