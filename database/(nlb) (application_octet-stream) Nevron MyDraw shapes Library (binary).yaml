Name: Nevron MyDraw shapes Library (binary)
URL: "https://www.mydraw.com/"
FileNameExtensions: ["nlb"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 26
    AsciiString: "\f\0\0\0document.bin"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOCUMENT.BINPK"
    CaseSensitive: false
