    AsciiString: "TABLEROWENTRY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERTYNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TABLECONTROL"
    CaseSensitive: false
