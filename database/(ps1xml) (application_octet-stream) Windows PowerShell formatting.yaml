    AsciiString: "VIEWDEFINITIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIEWSELECTEDBY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONFIGURATION"
    CaseSensitive: false
