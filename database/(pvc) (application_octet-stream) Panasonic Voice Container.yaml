Name: Panasonic Voice Container
URL: "https://wiki.multimedia.cx/index.php?title=Panasonic_SD_Voice"
FileNameExtensions: ["pvc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "SD_VOICE.PLMUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SD_VOICE.TKMUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MOB001.VM1UT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SD_VC001"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIL"
    CaseSensitive: false
