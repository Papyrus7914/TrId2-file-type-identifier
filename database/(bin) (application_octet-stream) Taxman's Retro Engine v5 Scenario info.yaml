Name: Taxman's Retro Engine v5 Scenario info
URL: "https://en.wikipedia.org/wiki/Retro_Engine"
FileNameExtensions: ["bin"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SCN\0"
    CaseSensitive: true
  - Pos: 8
    Bytes: [0xFF]
  - Pos: 13
    Bytes: [0x01, 0x01, 0x04, 0x00, 0x01]
  - Pos: 19
    AsciiString: "\0"
    CaseSensitive: true
