Name: Turbo Shell settings (v3.x)
Description: IDE for assembler by Sergei Chekhut.
FileNameExtensions: ["dsk", "ini"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Turbo Shell V3."
    CaseSensitive: true
  - Pos: 17
    AsciiString: "\r\n"
    CaseSensitive: true
