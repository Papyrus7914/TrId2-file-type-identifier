Name: CD Viewer Help
Description: Viewer for the CD magazines from microMedia electronic publishing.
FileNameExtensions: ["cvh"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "Hilfe-Datei f\xFCr CD-Viewer-System, (c) 1993"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BY MICROMEDIA ELECTRONIC PUBLISHING GMBH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INHALT..."
    CaseSensitive: false
  - Pos: any
    AsciiString: "GERMANY"
    CaseSensitive: false
