Name: CL-Amiga FASt Load Common Lisp compiled code
URL: "https://github.com/mdbergmann/cl-amiga"
FileNameExtensions: ["fasl"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "CLFA"
    CaseSensitive: true
  - Pos: any
    AsciiString: "COMMON-LISP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLAMIGA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PACKAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRUCT-"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".LISP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ERROR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LIST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PORT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SETF"
    CaseSensitive: false
