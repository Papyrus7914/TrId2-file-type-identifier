Name: Personal Font Maker Definitions (charset)
URL: "https://www.amigaforever.com/classic/pfm/"
FileNameExtensions: ["def"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PDM DEFS\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CHAR 1"
    CaseSensitive: false
