Name: KSSX music format dump
Description: The KSSX format is mostly used for audio ripped from MSX systems, but also from Sega Master System or Sega Game Gear games.
URL: "http://fileformats.archiveteam.org/wiki/KSSX"
FileNameExtensions: ["kss"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "KSSX"
    CaseSensitive: true
