Name: Live2D Cubism Motion data (UTF-8)
URL: "https://www.live2d.com/en/"
FileNameExtensions: ["mtn"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xEF\xBB\xBF# Live2D Animator Motion Data"
    CaseSensitive: true
  - Pos: any
    AsciiString: "$FPS"
    CaseSensitive: false
