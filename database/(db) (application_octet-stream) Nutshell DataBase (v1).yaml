Name: Nutshell DataBase (v1)
URL: "https://en.wikipedia.org/wiki/FileMaker"
FileNameExtensions: ["db"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x01\0\0\0"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0\x01\0"
    CaseSensitive: true
  - Pos: 10
    Bytes: [0x00, 0x02, 0x02, 0x00]
  - Pos: 524
    AsciiString: "HBAM1"
    CaseSensitive: true
  - Pos: any
    AsciiString: "1.00"
    CaseSensitive: false
