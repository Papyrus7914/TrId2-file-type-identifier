Name: KVIrc theme data
URL: "https://www.kvirc.net/"
FileNameExtensions: ["kvc"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "# KVIrc configuration file"
    CaseSensitive: true
  - Pos: any
    AsciiString: "STRINGICONTHEMESUBDIR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THEMEDATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NICKSERV"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MEIRCOP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MSGTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DCCMSG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IDENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LIMIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LINKS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STATS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ECHO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HELP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MEOP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MOTD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PART"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPAM"
    CaseSensitive: false
