Name: Minecraft LiteLoader Mod
URL: "http://www.liteloader.com/"
FileNameExtensions: ["litemod"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "LITEMOD"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".CLASS"
    CaseSensitive: false
