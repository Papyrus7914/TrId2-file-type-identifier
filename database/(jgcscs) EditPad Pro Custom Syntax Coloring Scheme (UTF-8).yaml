Name: EditPad Pro Custom Syntax Coloring Scheme (UTF-8)
URL: "http://www.editpadpro.com/"
FileNameExtensions: ["jgcscs"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xEF\xBB\xBFJGCSCS"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FALSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRUE"
    CaseSensitive: false
