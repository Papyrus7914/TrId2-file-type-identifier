Name: Java bytecode
Description: Java is a bytecode based, portable, object-oriented programming language.
URL: "http://en.wikipedia.org/wiki/Java_class_file"
FileNameExtensions: ["class"]
MimeType: application/x-java-applet
DetectionPatterns:
  - Pos: 0
    Bytes: [0xCA, 0xFE, 0xBA, 0xBE, 0x00]
  - Pos: 6
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "JAVA"
    CaseSensitive: false
