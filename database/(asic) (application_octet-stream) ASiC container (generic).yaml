Name: ASiC container (generic)
URL: "https://en.wikipedia.org/wiki/Associated_Signature_Containers"
FileNameExtensions: ["asic"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "mimetypeapplication/vnd.etsi.asic-"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MIMETYPEAPPLICATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VND.ETSI.ASIC-"
    CaseSensitive: false
  - Pos: any
    AsciiString: "+ZIP"
    CaseSensitive: false
