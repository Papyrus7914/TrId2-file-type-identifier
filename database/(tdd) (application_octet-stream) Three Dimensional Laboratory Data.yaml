Name: Three Dimensional Laboratory Data
Description: A Windows 3.x stereograms tool by Evolving Software Products Inc.
FileNameExtensions: ["tdd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "     Three Dimensional Laboratory Data (Version "
    CaseSensitive: true
  - Pos: 49
    AsciiString: "."
    CaseSensitive: true
  - Pos: any
    AsciiString: "NUMBER OF STRIPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRIP WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRIP DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLORS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEIGHT"
    CaseSensitive: false
