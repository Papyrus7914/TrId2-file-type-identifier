Name: Visual CADD Drawing (v1.x)
Description: CAD software for Windows 3.x by Numera Software.
FileNameExtensions: ["vcd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "P\0\0\0p\0\0\0p\0\0\0"
    CaseSensitive: true
  - Pos: 86
    AsciiString: " CADD Drawing V "
    CaseSensitive: true
  - Pos: any
    AsciiString: "CADD DRAWING V"
    CaseSensitive: false
