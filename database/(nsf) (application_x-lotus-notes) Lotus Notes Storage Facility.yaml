Name: Lotus Notes Storage Facility
URL: "http://fileformats.archiveteam.org/wiki/Notes_Storage_Facility"
FileNameExtensions: ["nsf"]
MimeType: application/x-lotus-notes
DetectionPatterns:
  - Pos: 0
    Bytes: [0x1A]
  - Pos: 16
    AsciiString: "%"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FORM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NOTE"
    CaseSensitive: false
