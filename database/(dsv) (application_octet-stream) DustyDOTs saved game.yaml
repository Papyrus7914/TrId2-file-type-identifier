Name: DustyDOTs saved game
Description: Shareware OS/2 game by Dan Phillips.
FileNameExtensions: ["dsv"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "}!\r\0O\x06\0\0\0\0\f\0\b\0\0\0BoxValue"
    CaseSensitive: true
  - Pos: any
    AsciiString: "RIGHTMOVEDIRECTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LEFTMOVEDIRECTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RIGHTPLAYERSCORE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LEFTPLAYERSCORE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPUTERPLAY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIFFICULTY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOTALSCORE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BOXVALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RIGHTCOL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RIGHTROW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LEFTCOL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LEFTROW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLAYER"
    CaseSensitive: false
