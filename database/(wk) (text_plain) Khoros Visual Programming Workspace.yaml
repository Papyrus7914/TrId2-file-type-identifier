  - Pos: any
    AsciiString: "WORKSPACEBEGIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VARIABLESEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WORKSPACEEND"
    CaseSensitive: false
