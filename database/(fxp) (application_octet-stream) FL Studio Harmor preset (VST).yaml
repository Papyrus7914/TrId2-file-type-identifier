Name: FL Studio Harmor preset (VST)
URL: "https://www.image-line.com/fl-studio-learning/fl-studio-online-manual/html/plugins/Harmor.htm"
FileNameExtensions: ["fxp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "CcnK"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "FPCh\0\0\0\x01IHmo"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FPCH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IHMO"
    CaseSensitive: false
