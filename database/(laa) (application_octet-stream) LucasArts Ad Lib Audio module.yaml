Name: LucasArts Ad Lib Audio module
FileNameExtensions: ["laa"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "ADL "
    CaseSensitive: true
  - Pos: any
    AsciiString: "MDHD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MTHD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MTRK"
    CaseSensitive: false
