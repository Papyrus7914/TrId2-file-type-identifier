Name: DDL disk image
Description: XML language that describes data stored on floppy disk.
URL: "https://github.com/OpenEmulatorProject/libemulation/blob/develop/doc/Formats/DDL%20Format%201.0.txt"
FileNameExtensions: ["xml"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "WWW.OPENEMULATOR.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCTYPE DDL PUBLIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRACKSPERINCH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WRITEENABLED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DDL VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DDL-1.0.DTD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DTD DDL 1.0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRACK INDEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIDE INDEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MEDIUM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LABEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
