Name: WIBU-SYSTEMS Control
FileNameExtensions: ["wibucmrau"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "[WIBU-SYSTEMS Control File]"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UPDATE FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CODEMETER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GUID"
    CaseSensitive: false
