Name: Minecraft Resource Pack info
FileNameExtensions: ["mcmeta"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "{"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PACK_FORMAT"
    CaseSensitive: false
