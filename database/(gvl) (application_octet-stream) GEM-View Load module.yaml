Name: GEM-View Load module
URL: "http://www.fiebelkorn.net/"
FileNameExtensions: ["gvl"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "`\x1A\0\0"
    CaseSensitive: true
  - Pos: 26
    AsciiString: "\0\0N\xF9\0\0\0\x90N\xF9\0\0"
    CaseSensitive: true
  - Pos: 40
    AsciiString: "GVWL\x01\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ERROR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BGNA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GVWL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "READ"
    CaseSensitive: false
