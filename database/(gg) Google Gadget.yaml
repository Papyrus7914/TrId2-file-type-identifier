Name: Google Gadget
URL: "http://desktop.google.com/plugins/sidebar/"
FileNameExtensions: ["gg"]
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "GADGET.GMANIFEST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN.XML"
    CaseSensitive: false
