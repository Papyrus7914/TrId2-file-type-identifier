Name: IBM Final-Form Text document
Description: An output format only.
URL: "https://en.wikipedia.org/wiki/Revisable-Form_Text"
FileNameExtensions: ["fft"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        +                                   +           \a                                        +
    Bytes: [0x2B, 0xD2, 0x04, 0x85, 0x00, 0x00, 0x2B, 0xD1, 0x07, 0x05, 0x00, 0x1A, 0x00, 0x90, 0x01, 0x2B, 0xD1]
