Name: HPub HTML Publication
URL: "http://twixlmedia.com/"
FileNameExtensions: ["hpub"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "BOOK.JSONU"
    CaseSensitive: false
  - Pos: any
    AsciiString: "01.HTMLU"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COVER."
    CaseSensitive: false
  - Pos: any
    AsciiString: ".CSSU"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".JPGU"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PNGU"
    CaseSensitive: false
