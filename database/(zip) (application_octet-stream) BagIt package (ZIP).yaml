Name: BagIt package (ZIP)
URL: "https://en.wikipedia.org/wiki/BagIt"
FileNameExtensions: ["zip"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "BAGIT.TXTPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MANIFEST-"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
