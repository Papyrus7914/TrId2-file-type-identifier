Name: Scoop bucket
URL: "https://scoop.sh/"
FileNameExtensions: ["json"]
MimeType: text/json
DetectionPatterns:
  - Pos: 0
    AsciiString: "{\r\n  "
    CaseSensitive: true
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HOMEPAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LICENSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
