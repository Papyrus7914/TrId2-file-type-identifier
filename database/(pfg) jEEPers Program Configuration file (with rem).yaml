Name: jEEPers Program Configuration file (with rem)
FileNameExtensions: ["pfg"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "//"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FLASH SIGNATURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "I2C EEPROM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONFIGURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FIELDS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "READ"
    CaseSensitive: false
