Name: Adobe Portable Document Format (old header)
Description: Supported by Adobe Reader up to v6.
URL: "http://fileformats.archiveteam.org/wiki/PDF"
FileNameExtensions: ["pdf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "%!PS-Adobe-N.n PDF-M.m"
    CaseSensitive: true
