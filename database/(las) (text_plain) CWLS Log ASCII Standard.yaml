Name: CWLS Log ASCII Standard
URL: "https://en.wikipedia.org/wiki/Log_ASCII_Standard"
FileNameExtensions: ["las"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "~V"
    CaseSensitive: true
  - Pos: any
    AsciiString: "STANDARD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEPTH S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ASCII"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NULL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STEP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STOP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WELL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WRAP"
    CaseSensitive: false
