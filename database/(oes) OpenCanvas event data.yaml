Name: OpenCanvas event data
URL: "http://en.wikipedia.org/wiki/OpenCanvas"
FileNameExtensions: ["oes"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "OTNL"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "\0\x01\0\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "OBEV"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OEVP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OTNL"
    CaseSensitive: false
