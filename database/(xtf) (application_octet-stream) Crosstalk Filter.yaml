Name: Crosstalk Filter
URL: "https://en.wikipedia.org/wiki/Crosstalk_Mk.4"
FileNameExtensions: ["xtf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x13, 0x18, 0x00, 0x00]
  - Pos: 6
    AsciiString: "\0\0\x04\0\0\0"
    CaseSensitive: true
  - Pos: 13
    Bytes: [0x00, 0x00, 0x00, 0xFF, 0xFF, 0xFF, 0xFF]
  - Pos: any
    AsciiString: "WORKING WITH MENUS AND FORMS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHARACTERS T"
    CaseSensitive: false
  - Pos: any
    AsciiString: "YOU ARE IN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INCOMING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILTER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODULE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRANS"
    CaseSensitive: false
