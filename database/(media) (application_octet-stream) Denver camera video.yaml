Name: Denver camera video
Description: Can be converted with ffmpeg.
URL: "https://denver.eu/"
FileNameExtensions: ["media"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x01\0\0\0"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 13
    AsciiString: "\x01\0\0"
    CaseSensitive: true
  - Pos: 22
    AsciiString: "\0\0\0\0\0\x01"
    CaseSensitive: true
