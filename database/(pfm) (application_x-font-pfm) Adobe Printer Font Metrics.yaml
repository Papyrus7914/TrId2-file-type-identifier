Name: Adobe Printer Font Metrics
Description: sometimes also called "Type 1 font metric"
URL: "https://en.wikipedia.org/wiki/PostScript_fonts"
FileNameExtensions: ["pfm"]
MimeType: application/x-font-pfm
DetectionPatterns:
  - Pos: 0
    Bytes: [0x00, 0x01]
  - Pos: 67
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 69
    AsciiString: "\0,\x01,\x01"
    CaseSensitive: true
