Name: Game Studio Resource data
FileNameExtensions: ["resource"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "[DATA.RESOURCE]"
    CaseSensitive: true
  - Pos: 19
    AsciiString: "GAME_STUDIO_RESOURCE_DATA_FILE"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GAME_STUDIO_RESOURCE_DATA_FILE"
    CaseSensitive: false
