Name: FrameMaker book (binary)
Description: at offset 1 phrase BookFile, BOOKFILE or Bookfile and at offset 10 version string (like 3.0 4.0 5.0 10.0)
URL: "http://fileformats.archiveteam.org/wiki/FrameMaker"
FileNameExtensions: ["bk", "book"]
MimeType: application/vnd.framemaker
DetectionPatterns:
  - Pos: 0
    AsciiString: "<B"
    CaseSensitive: true
  - Pos: 9
    AsciiString: " "
    CaseSensitive: true
  - Pos: 14
    AsciiString: ">\r\n\x1A\0\0\b\t\n\r\x1AAa\x7F\xFF"
    CaseSensitive: true
  - Pos: 49
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BOOKFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EMPHASIS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REGULAR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BULLET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ITALIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCRIPT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TIMES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BODY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BOLD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEAD"
    CaseSensitive: false
