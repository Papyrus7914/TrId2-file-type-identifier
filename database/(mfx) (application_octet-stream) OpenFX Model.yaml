Name: OpenFX Model
URL: "https://en.wikipedia.org/wiki/OpenFX_(software)"
FileNameExtensions: ["mfx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM\0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "AXIS\0\0\00"
    CaseSensitive: true
  - Pos: 68
    AsciiString: "OFFS"
    CaseSensitive: true
  - Pos: any
    AsciiString: "AXIS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MATL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OFFS"
    CaseSensitive: false
