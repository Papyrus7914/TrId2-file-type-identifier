Name: OS X system data
FileNameExtensions: ["apdisk"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE plist PUBLIC \"-//Apple//DTD PLIST 1.0//EN\" \"http://www.apple.com/DTDs/PropertyList-1.0.dtd\">\n<plist version=\"1.0\">\n<dict>\n\t<key>diskUuid</key>\n\t<string>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOCTYPE PLIST PUBLIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERTYLIST-1.0.DTD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DTD PLIST 1.0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLIST VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.APPLE.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISKUUID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DICT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DTDS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
