    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULTCONTEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIALOGCONTEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GALLEYCONTEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TABLECONTEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXTCONTEXT"
    CaseSensitive: false
