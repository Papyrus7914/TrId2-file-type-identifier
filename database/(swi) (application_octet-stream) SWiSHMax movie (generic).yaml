Name: SWiSHMax movie (generic)
URL: "https://en.wikipedia.org/wiki/SWiSH_Max"
FileNameExtensions: ["swi"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 2
    Bytes: [0xFF, 0xFE, 0xFF]
  - Pos: 6
    AsciiString: "S\0W\0i\0S\0H\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CSCENEOBJ"
    CaseSensitive: false
  - Pos: any
    AsciiString: "S\0W\0I\0S\0H"
    CaseSensitive: false
  - Pos: any
    AsciiString: "M\0A\0X"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CVID"
    CaseSensitive: false
