Name: Adobe After Effects Graphics
URL: "https://en.wikipedia.org/wiki/Adobe_After_Effects"
FileNameExtensions: ["aegraphic"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "PB_21_Premiere_Graphics.aep"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PB_21_PREMIERE_GRAPHICSREPORT.TXT"
    CaseSensitive: false
