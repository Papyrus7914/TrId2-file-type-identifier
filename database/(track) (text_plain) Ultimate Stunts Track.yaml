Name: Ultimate Stunts Track
URL: "http://www.ultimatestunts.nl/documentation/en/fileformats.htm#track"
FileNameExtensions: ["track"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "TRACKFILE"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BEGIN"
    CaseSensitive: false
