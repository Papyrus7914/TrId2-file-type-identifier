Name: JAM game video
Description: "Used in Gex 3D: Enter the Gecko and Hot Wheels: Stunt Track Driver."
URL: "https://wiki.multimedia.cx/index.php/JAM"
FileNameExtensions: ["jam"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "JAM\0"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\x01\0\0\xF0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "L\0I\0F"
    CaseSensitive: false
