Name: Foenix IDE project
URL: "https://github.com/Trinity-11/FoenixIDE"
FileNameExtensions: ["fnxml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xEF\xBB\xBF<?xml version=\"1.0\" encoding=\"utf-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "--EXPORT OF FOENIXIDE FOR C256.  ALL VALUES ARE IN HEXADECIMAL FORM--"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGE START-ADDRESS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CODE ADDRESS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA ADDRESS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGES FORMAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BREAKPOINTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RESOURCES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMAND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPACT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LISTING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WATCHES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LABEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VICKY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BANK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REVC"
    CaseSensitive: false
