Name: Pxlab experiment Design
URL: "http://www.pxlab.de/"
FileNameExtensions: ["pxd"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "Experiment()"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ASSIGNMENTGROUP()"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROCEDURE()"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SUBJECTCODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTEXT()"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SESSION()"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BLOCK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PXLAB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRIAL"
    CaseSensitive: false
