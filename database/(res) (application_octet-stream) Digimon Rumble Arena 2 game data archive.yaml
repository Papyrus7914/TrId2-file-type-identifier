Name: Digimon Rumble Arena 2 game data archive
URL: "http://wiki.xentax.com/index.php/GRAF:Digimon_Rumble_Arena_2_RES"
FileNameExtensions: ["res"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "res\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "INDX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SURF"
    CaseSensitive: false
