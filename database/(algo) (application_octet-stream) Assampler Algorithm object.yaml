Name: Assampler Algorithm object
Description: Amiga Object oriented sound processor program by Henning Thielemann.
FileNameExtensions: ["algo"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "S"
    CaseSensitive: true
  - Pos: 10
    AsciiString: "R"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "TYPE"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SPRCTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALU"
    CaseSensitive: false
