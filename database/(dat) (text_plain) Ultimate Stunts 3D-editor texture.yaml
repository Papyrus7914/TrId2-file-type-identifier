Name: Ultimate Stunts 3D-editor texture
URL: "http://www.ultimatestunts.nl/documentation/en/fileformats.htm#3dedit"
FileNameExtensions: ["dat"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "TEDITFILE"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BEGIN"
    CaseSensitive: false
