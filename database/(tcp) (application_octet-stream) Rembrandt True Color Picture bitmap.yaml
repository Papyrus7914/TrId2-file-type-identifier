Name: Rembrandt True Color Picture bitmap
Description: Atari Falcon graphic format.
URL: "http://www.atari-wiki.com/index.php/Rembrandt_file_format"
FileNameExtensions: ["tcp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "TRUECOLR\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PICT"
    CaseSensitive: false
