Name: Namco Universal Configuration format
Description: Used in various Namco games, like Super Smash Bros. Ultimate.
URL: "https://en.wikipedia.org/wiki/Bandai_Namco_Studios"
FileNameExtensions: ["nus3conf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "NUS3"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "CNF TOC "
    CaseSensitive: true
  - Pos: any
    AsciiString: "CNF TOC"
    CaseSensitive: false
