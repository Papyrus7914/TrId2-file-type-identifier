Name: Rosegarden composition (var.2)
URL: "https://www.rosegardenmusic.com/"
FileNameExtensions: ["rg"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #                    \b    \b
    Bytes: [0x1F, 0x8B, 0x08, 0x08]
  - Pos: 8
    Bytes: [0x00, 0x03]
  - Pos: any
    AsciiString: ".RG.XML"
    CaseSensitive: false
