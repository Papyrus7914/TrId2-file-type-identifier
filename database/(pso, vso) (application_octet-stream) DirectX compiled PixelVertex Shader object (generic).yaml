Name: DirectX compiled Pixel/Vertex Shader object (generic)
URL: "https://en.wikipedia.org/wiki/DirectX"
FileNameExtensions: ["pso", "vso"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 3
    Bytes: [0xFF]
  - Pos: 7
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SHADER"
    CaseSensitive: false
