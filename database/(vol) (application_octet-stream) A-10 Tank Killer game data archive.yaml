Name: A-10 Tank Killer game data archive
URL: "https://en.wikipedia.org/wiki/A-10_Tank_Killer"
FileNameExtensions: ["vol"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "VOL "
    CaseSensitive: true
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VBLK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VOLH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VOLI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VOLS"
    CaseSensitive: false
