Name: ProductView Packaged Structure and Drawing
URL: "https://www.ptc.com/en/products/creo/creo-view"
FileNameExtensions: ["pvz"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: ".PVSPK"
    CaseSensitive: false
