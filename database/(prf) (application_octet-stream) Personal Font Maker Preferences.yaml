Name: Personal Font Maker Preferences
URL: "https://www.amigaforever.com/classic/pfm/"
FileNameExtensions: ["prf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PFM PREF\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "EPIL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RNGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SQOF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SQON"
    CaseSensitive: false
