Name: EISA add-on card Configuration
URL: "https://en.wikipedia.org/wiki/Extended_Industry_Standard_Architecture"
FileNameExtensions: ["cfg"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "BOARD\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CATEGORY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FUNCTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHOICE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
