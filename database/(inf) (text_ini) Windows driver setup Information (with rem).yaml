Name: Windows driver setup Information (with rem)
URL: "https://learn.microsoft.com/en-us/windows-hardware/drivers/install/overview-of-inf-files"
FileNameExtensions: ["inf"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: ";"
    CaseSensitive: true
  - Pos: any
    AsciiString: "$CHICAGO$"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIGNATURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
