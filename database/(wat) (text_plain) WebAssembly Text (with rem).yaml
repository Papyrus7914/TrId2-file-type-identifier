Name: WebAssembly Text (with rem)
URL: "https://en.wikipedia.org/wiki/WebAssembly"
FileNameExtensions: ["wat"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: ";;"
    CaseSensitive: true
  - Pos: any
    AsciiString: "(EXPORT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(PARAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RESULT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(FUNC"
    CaseSensitive: false
