Name: MOST compressed text
URL: "http://fileformats.archiveteam.org/wiki/Most"
FileNameExtensions: ["cff"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "CFF\0To view text use MOST V1.0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "R.WYNN"
    CaseSensitive: false
