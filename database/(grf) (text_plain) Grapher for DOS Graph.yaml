Name: Grapher for DOS Graph
Description: Graphing tool by Golden Software.
FileNameExtensions: ["grf"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "1243\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DEFAULT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOLID"
    CaseSensitive: false
