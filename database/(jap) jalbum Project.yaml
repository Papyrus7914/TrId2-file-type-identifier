Name: jalbum Project
Description: jalbum project (.JAP) files are used to store the values of Jalbum.
URL: "http://jalbum.net/"
FileNameExtensions: ["jap"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "#J"
    CaseSensitive: true
  - Pos: 3
    AsciiString: "lbum Project"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CLASS SE.DATADOSEN.JALBUM.ALBUMBEAN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FALSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SKIN."
    CaseSensitive: false
  - Pos: any
    AsciiString: ".HTM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROWS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".CSS"
    CaseSensitive: false
