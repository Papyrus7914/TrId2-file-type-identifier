Name: Mac FileMaker Pro data base (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/FileMaker"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "FMP3"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FMP3"
    CaseSensitive: false
