Name: 16bit DOS EXE DIET compressed (v1.00)
URL: "http://fileformats.archiveteam.org/wiki/DIET_(compression)"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 6
    Bytes: [0x01, 0x00, 0x02, 0x00]
  - Pos: 20
    AsciiString: "\x03\0\0\0\x1C\0"
    CaseSensitive: true
  - Pos: 29
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 35
    #                                                        8
    Bytes: [0xFC, 0x06, 0x1E, 0x0E, 0x8C, 0xC8, 0x01, 0x06, 0x38, 0x01, 0xBA]
  - Pos: 48
    Bytes: [0x03, 0xC2, 0x8B, 0xD8, 0x05]
  - Pos: 55
    #                                3           3                 \b                      K     H     J     y                                         J
    Bytes: [0x8E, 0xDB, 0x8E, 0xC0, 0x33, 0xF6, 0x33, 0xFF, 0xB9, 0x08, 0x00, 0xF3, 0xA5, 0x4B, 0x48, 0x4A, 0x79, 0xEE, 0x8E, 0xC3, 0x8E, 0xD8, 0xBE, 0x4A, 0x00, 0xAD, 0x8B, 0xE8, 0xB2, 0x10, 0xEA]
  - Pos: any
    AsciiString: "KHJY"
    CaseSensitive: false
