Name: Renoise Instrument
URL: "https://en.wikipedia.org/wiki/Renoise"
FileNameExtensions: ["xrni"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "Instrument.xml"
    CaseSensitive: true
  - Pos: any
    AsciiString: "INSTRUMENT.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAMPLE00 ("
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAMPLEDATA"
    CaseSensitive: false
