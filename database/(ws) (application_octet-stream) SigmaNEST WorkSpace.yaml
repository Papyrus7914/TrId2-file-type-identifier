Name: SigmaNEST WorkSpace
URL: "https://www.sigmanest.com/"
FileNameExtensions: ["ws"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x01\aSGMNEST"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SGMNEST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ID.DAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PART1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEMP"
    CaseSensitive: false
