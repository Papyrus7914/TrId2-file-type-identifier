Name: Spore saved game
URL: "https://en.wikipedia.org/wiki/Spore_(2008_video_game)"
FileNameExtensions: ["spo"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "DBPF"
    CaseSensitive: true
  - Pos: 102
    #                    \r    &
    Bytes: [0x01, 0xA8, 0x0D, 0x26]
  - Pos: any
    AsciiString: "P\0L\0A\0N\0E\0T"
    CaseSensitive: false
  - Pos: any
    AsciiString: "D\0I\0U\0S"
    CaseSensitive: false
