Name: EGrid32 Compilable Grid Format (ready to be compiled)
Description: CGF files are created by the EGrid32 Form Designer. EGrid32 is a powerfull grid control by Elias Montoya.
URL: "http://sweetheartgames.com/"
FileNameExtensions: ["cgf"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "EG32CMP_2"
    CaseSensitive: true
