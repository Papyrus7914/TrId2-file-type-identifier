Name: 16bit DOS COM TurboBat compiled batch (unreg)
Description: Batch file compiler by Foley Hi-Tech Systems.
FileNameExtensions: ["com"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xBA]
  - Pos: 2
    #                    \t          !                 @                                         &           &     l                             &           l           $           :           t           &           l           $           :           u                       \a
    Bytes: [0x01, 0xB4, 0x09, 0xCD, 0x21, 0x06, 0xB8, 0x40, 0x00, 0x8E, 0xC0, 0xB9, 0x03, 0x00, 0x26, 0x8A, 0x26, 0x6C, 0x00, 0x80, 0xE4, 0x0F, 0x26, 0xA0, 0x6C, 0x00, 0x24, 0x0F, 0x3A, 0xC4, 0x74, 0xF6, 0x26, 0xA0, 0x6C, 0x00, 0x24, 0x0F, 0x3A, 0xC4, 0x75, 0xF6, 0xE2, 0xEA, 0x07]
  - Pos: any
    AsciiString: "FILE COMPILER.  PLEASE REGISTER TO ELIMINATE THIS MESSAGE."
    CaseSensitive: false
  - Pos: any
    AsciiString: "THIS FILE COMPILED WITH UNREGISTERED VERSION OF TURBOBAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BATCH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SQW3"
    CaseSensitive: false
