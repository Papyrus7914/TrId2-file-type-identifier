Name: Quickbasic Coordinates File
Description: QCF stands for Quickbasic Coordinates File. It was originally used to draw pictures in Microsoft Quickbasic (Qbasic).
URL: "http://www.moor-software.com/"
FileNameExtensions: ["qcf"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "QCF"
    CaseSensitive: true
  - Pos: 4
    AsciiString: "\r\n"
    CaseSensitive: true
