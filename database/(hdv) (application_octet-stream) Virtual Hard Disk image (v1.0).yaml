Name: Virtual Hard Disk image (v1.0)
Description: Used by some TRS-80 emulators.
URL: "http://www.trs-80emulators.com/hdv1-format/"
FileNameExtensions: ["hdv"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        V
    Bytes: [0x56, 0xCB, 0x11]
  - Pos: 6
    AsciiString: "\0"
    CaseSensitive: true
