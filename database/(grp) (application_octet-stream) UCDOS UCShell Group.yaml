Name: UCDOS UCShell Group
URL: "https://archive.org/details/ucdos7"
FileNameExtensions: ["grp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PMUJ000"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PMUJ000"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UCDOS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".ICO"
    CaseSensitive: false
