Name: Lotus Approach v3.0
URL: "https://en.wikipedia.org/wiki/IBM_Lotus_Approach"
FileNameExtensions: ["apr"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1, 0x00]
  - Pos: 1024
    AsciiString: "R\0o\0o\0t\0 \0E\0n\0t\0r\0y"
    CaseSensitive: true
  - Pos: 1410
    AsciiString: "C\0o\0m\0p\0O\0b\0j"
    CaseSensitive: true
  - Pos: any
    AsciiString: "APPROACHAPPLICATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPROACH OBJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "D\0O\0C\0U\0M\0E\0N\0T"
    CaseSensitive: false
  - Pos: any
    AsciiString: "V\0E\0R\0S\0I\0O\0N"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULT MENU"
    CaseSensitive: false
  - Pos: any
    AsciiString: "I\0N\0F\0O"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STYLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".APR"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".DBF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
