Name: Pocket Excel sheet
URL: "http://www.pocketpc.com"
FileNameExtensions: ["pxl"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "\t"
    CaseSensitive: true
  - Pos: 2
    #                          B
    Bytes: [0x01, 0x05, 0x00, 0x42]
  - Pos: 7
    Bytes: [0x04, 0x8C]
  - Pos: 10
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "\0"
    CaseSensitive: true
