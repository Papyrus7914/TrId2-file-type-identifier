Name: SimCity City
URL: "https://en.wikipedia.org/wiki/SimCity"
FileNameExtensions: ["cty"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "CITYMCRP"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CITYMCRP"
    CaseSensitive: false
