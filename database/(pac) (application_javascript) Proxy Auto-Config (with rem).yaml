Name: Proxy Auto-Config (with rem)
URL: "https://en.wikipedia.org/wiki/Proxy_auto-config"
FileNameExtensions: ["pac"]
MimeType: application/javascript
DetectionPatterns:
  - Pos: 0
    AsciiString: "/*"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FUNCTION FINDPROXYFORURL(URL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIRECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RETURN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HOST"
    CaseSensitive: false
