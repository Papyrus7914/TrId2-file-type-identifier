Name: OpenSceneGraph Binary format
URL: "http://fileformats.archiveteam.org/wiki/OpenSceneGraph"
FileNameExtensions: ["osgb"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #                          l     E     E
    Bytes: [0xA1, 0x0E, 0x91, 0x6C, 0x45, 0x45, 0xFB, 0x1A, 0x01, 0x00, 0x00, 0x00]
