Name: opencomic syndication format
URL: "http://fileformats.archiveteam.org/wiki/Opencomic"
FileNameExtensions: ["json"]
MimeType: application/opencomic+json
DetectionPatterns:
  - Pos: 0
    AsciiString: "{"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DATE_PUBLISHED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPENCOMIC.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE_TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMAGE_URL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ALT_TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HOME_URL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LANGUAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTHORS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXPIRED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PANELS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "V1.0"
    CaseSensitive: false
