Name: Saved WCF Configuration Information
FileNameExtensions: ["svcinfo"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"utf-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SAVEDWCFCONFIGURATIONINFORMATION XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BINDINGCONFIGURATIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLSCHEMA-INSTANCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.W3.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENDPOINTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHECKSUM"
    CaseSensitive: false
