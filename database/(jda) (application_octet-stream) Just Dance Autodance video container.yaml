Name: Just Dance Autodance video container
URL: "https://justdance.fandom.com/wiki/Autodance"
FileNameExtensions: ["jda"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "CON "
    CaseSensitive: true
  - Pos: any
    AsciiString: "J\0U\0S\0T\0 \0D\0A\0N\0C\0E\0 \04\0 \0C\0O\0N\0T\0E\0N\0T"
    CaseSensitive: false
