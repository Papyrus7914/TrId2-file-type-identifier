Name: HstWB Installer package info
URL: "https://hstwb.firstrealize.com/"
FileNameExtensions: ["json"]
MimeType: text/json
DetectionPatterns:
  - Pos: 0
    AsciiString: "{\r\n    \""
    CaseSensitive: true
  - Pos: any
    AsciiString: "SYSTEMDIR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ASSIGNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
