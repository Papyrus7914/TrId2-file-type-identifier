Name: Sothink SWF Easy Project
URL: "http://www.sothink.com/"
FileNameExtensions: ["gla"]
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1]
  - Pos: any
    AsciiString: "B\0K\0G\0N\0D\0 \0S\0C\0E\0N\0E\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "R\0O\0O\0T\0 \0E\0N\0T\0R\0Y"
    CaseSensitive: false
  - Pos: any
    AsciiString: "V\0E\0R\0S\0I\0O\0N"
    CaseSensitive: false
  - Pos: any
    AsciiString: "I\0N\0D\0E\0X"
    CaseSensitive: false
  - Pos: any
    AsciiString: "M\0A\0G\0I\0C"
    CaseSensitive: false
  - Pos: any
    AsciiString: "M\0A\0I\0N"
    CaseSensitive: false
  - Pos: any
    AsciiString: "P\0R\0O\0P"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYMBOL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "D\0O\0C"
    CaseSensitive: false
  - Pos: any
    AsciiString: "L\0I\0B"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCENE"
    CaseSensitive: false
