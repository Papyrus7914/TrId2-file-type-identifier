Name: MSIX Windows app package
URL: "https://docs.microsoft.com/en-us/windows/msix/overview"
FileNameExtensions: ["msix"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "APPXBLOCKMAP.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPXMANIFEST.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENT_TYPES"
    CaseSensitive: false
