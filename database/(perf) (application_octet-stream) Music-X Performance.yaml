Name: Music-X Performance
Description: Amiga sequencer.
URL: "http://www.retrocastaway.com/retro-computing/music-x-making-music-on-the-amiga-in-the-80s/"
FileNameExtensions: ["perf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "MSCXAUTH"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CUES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEQU"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TMPO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TSIG"
    CaseSensitive: false
