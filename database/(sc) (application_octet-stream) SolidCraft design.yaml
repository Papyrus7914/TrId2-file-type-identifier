Name: SolidCraft design
URL: "https://solidcraft.io/"
FileNameExtensions: ["sc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "SOLIDCRAFT-CONTAINER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTAINER.JSON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCUMENT.JSON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMAT"
    CaseSensitive: false
