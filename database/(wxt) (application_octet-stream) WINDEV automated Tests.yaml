Name: WINDEV automated Tests
Description: WINDEV is a RAD tool by PC Soft.
URL: "https://windev.com"
FileNameExtensions: ["wxt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PCS\0\x14\0\0\0\x11\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 15
    AsciiString: "\0\x01\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TEST"
    CaseSensitive: false
