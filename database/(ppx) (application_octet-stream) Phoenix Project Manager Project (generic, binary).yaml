Name: Phoenix Project Manager Project (generic, binary)
URL: "https://www.phoenixcpm.com/"
FileNameExtensions: ["ppx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PPX!!!!|VERSION="
    CaseSensitive: true
  - Pos: 17
    AsciiString: "."
    CaseSensitive: true
