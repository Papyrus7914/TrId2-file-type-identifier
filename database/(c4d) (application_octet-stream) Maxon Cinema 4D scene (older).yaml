Name: Maxon Cinema 4D scene (older)
URL: "http://fileformats.archiveteam.org/wiki/C4D"
FileNameExtensions: ["c4d"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "FRAYMAT1"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FRAYMAT1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FRE1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OBJ1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UMG1"
    CaseSensitive: false
