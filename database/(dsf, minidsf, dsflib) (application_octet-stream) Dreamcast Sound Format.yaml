Name: Dreamcast Sound Format
URL: "http://fileformats.archiveteam.org/wiki/DSF"
FileNameExtensions: ["dsf", "minidsf", "dsflib"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PSF\x12\0\0\0\0"
    CaseSensitive: true
  - Pos: 11
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "x"
    CaseSensitive: true
