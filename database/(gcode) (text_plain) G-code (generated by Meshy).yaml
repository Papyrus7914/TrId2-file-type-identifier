Name: G-code (generated by Meshy)
URL: "https://github.com/0x00019913/meshy"
FileNameExtensions: ["gcode"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "; FILENAME: "
    CaseSensitive: true
  - Pos: any
    AsciiString: "GENERATED WITH MESHY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRIME EXTRUDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAYER 0"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".GCODE"
    CaseSensitive: false
