Name: Pod Specification
URL: "https://guides.cocoapods.org/syntax/podspec.html"
FileNameExtensions: ["podspec"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "Pod::Spec.new do |s"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".HOMEPAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".SUMMARY"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".AUTHOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".SOURCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".GIT"
    CaseSensitive: false
