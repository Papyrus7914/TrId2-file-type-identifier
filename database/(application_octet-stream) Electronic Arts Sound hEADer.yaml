Name: Electronic Arts Sound hEADer
URL: "https://wiki.multimedia.cx/index.php?title=Electronic_Arts_SEAD"
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SEAD"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SNDC"
    CaseSensitive: false
