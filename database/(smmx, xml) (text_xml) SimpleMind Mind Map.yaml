Name: SimpleMind Mind Map
URL: "https://simplemind.eu/"
FileNameExtensions: ["smmx", "xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xEF\xBB\xBF<?xml version=\"1.0\" encoding=\"UTF-8\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "AUTO-NUMBERING STYLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN-CENTRALTHEME ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIMPLEMIND-MINDMAPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCROLLSTATE ZOOM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOC-VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GEN-VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLORINFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GUID GUID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RELATIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STYLE KEY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISABLED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOPIC ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOPICS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "META"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
