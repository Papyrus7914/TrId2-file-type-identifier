Name: DESQview/X colors Configuration
URL: "https://en.wikipedia.org/wiki/DESQview#DESQview/X"
FileNameExtensions: ["cfg"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "#---- DWM Color Configuration file: "
    CaseSensitive: true
  - Pos: any
    AsciiString: "WM.BK.FILL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WM.BK.SHAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WM.BK.TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WM.FL.FILL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WM.FL.TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WM.MN.FILL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WM.MN.SHAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WM.MN.TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WM.TP.FILL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WM.TP.SHAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WM.TP.TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WM.BK.BAR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WM.MN.OFF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WM.TP.BAR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WM.BK.HI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WM.MN.HI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WM.TP.HI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR"
    CaseSensitive: false
