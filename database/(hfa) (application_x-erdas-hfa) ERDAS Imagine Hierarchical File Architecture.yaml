Name: ERDAS Imagine Hierarchical File Architecture
Description: The HFA maintains an object-oriented representation of data in an ERDAS IMAGINE disk file through use of a tree structure.
URL: "http://www.rdg.ac.uk/ITS/Topic/Graphics/GrGImagi01/"
FileNameExtensions: ["hfa"]
MimeType: application/x-erdas-hfa
DetectionPatterns:
  - Pos: 0
    AsciiString: "EHFA_HEADER_TAG"
    CaseSensitive: true
