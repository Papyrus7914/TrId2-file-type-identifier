Name: Tim Newport-Peace's Special Use Airspace Format
URL: "http://www.spsys.demon.co.uk/#Airspace"
FileNameExtensions: ["sua"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "#"
    CaseSensitive: true
  - Pos: any
    AsciiString: "E RADIUS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CENTRE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLUDE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POINT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BASE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
