Name: Google Drive Spreadsheet link
URL: "http://en.wikipedia.org/wiki/Google_Drive"
FileNameExtensions: ["gsheet"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "{\"url\": \"https://docs.google.com/"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOCS.GOOGLE.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RESOURCE_ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPREADSHEET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTPS"
    CaseSensitive: false
