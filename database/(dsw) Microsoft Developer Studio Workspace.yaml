Name: Microsoft Developer Studio Workspace
URL: "http://en.wikipedia.org/wiki/Microsoft_Visual_Studio"
FileNameExtensions: ["dsw"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "Microsoft Developer Studio Workspace File, Format Version "
    CaseSensitive: true
  - Pos: any
    AsciiString: "DO NOT EDIT OR DELETE THIS WORKSPACE FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MICROSOFT DEVELOPER STUDIO WORKSPACE FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMAT VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PACKAGE OWNER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WARNING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GLOBAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".DSP"
    CaseSensitive: false
