Name: Protein Structure File
URL: "http://www.ks.uiuc.edu/Training/Tutorials/namd/namd-tutorial-win-html/node24.html"
FileNameExtensions: ["psf"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "PSF"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NTITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NATOM"
    CaseSensitive: false
