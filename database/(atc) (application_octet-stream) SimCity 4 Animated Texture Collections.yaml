Name: SimCity 4 Animated Texture Collections
URL: "http://www.wiki.sc4devotion.com/index.php?title=ATC"
FileNameExtensions: ["atc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #                          )     D                 z
    Bytes: [0xEC, 0xD1, 0xA5, 0x29, 0x44, 0x0E, 0xB5, 0x7A]
  - Pos: 16
    AsciiString: "u\xCD\xAD\t\xF9X$*"
    CaseSensitive: true
