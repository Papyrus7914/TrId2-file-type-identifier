Name: Fiasco Frequencies
Description: Amiga DB by Nils Bandener.
FileNameExtensions: ["frec"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FDBH\0"
    CaseSensitive: true
  - Pos: 24
    AsciiString: "FREC\0\x05\0\x01\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FREC"
    CaseSensitive: false
