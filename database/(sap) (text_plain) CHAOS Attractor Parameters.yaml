Name: CHAOS Attractor Parameters
Description: Fractal software for DOS by Autodesk.
URL: "https://github.com/rudyrucker/chaos"
FileNameExtensions: ["sap"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "CHAOS Attractor Data\r\nCreated: "
    CaseSensitive: true
  - Pos: any
    AsciiString: "WINDOW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
