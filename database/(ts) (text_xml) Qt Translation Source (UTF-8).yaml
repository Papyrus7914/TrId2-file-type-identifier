Name: Qt Translation Source (UTF-8)
URL: "http://en.wikipedia.org/wiki/Qt_%28toolkit%29"
FileNameExtensions: ["ts"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    #                          <
    Bytes: [0xEF, 0xBB, 0xBF, 0x3C]
  - Pos: any
    AsciiString: "TRANSLATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCTYPE TS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MESSAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
