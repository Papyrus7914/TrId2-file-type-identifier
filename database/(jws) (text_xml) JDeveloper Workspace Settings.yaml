Name: JDeveloper Workspace Settings
URL: "https://en.wikipedia.org/wiki/JDeveloper"
FileNameExtensions: ["jws"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version = '1.0' encoding = '"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ORACLE.IDE.MODEL."
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLNS.ORACLE.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LISTOFCHILDREN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ORACLE.JDEV"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WORKSPACE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".JPR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH"
    CaseSensitive: false
