    AsciiString: "IHDR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NULL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PHYS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SRGB"
    CaseSensitive: false
