Name: PabloPaint packed bitmap
Description: Atari ST paint program.
URL: "http://www.atari-wiki.com/index.php/Pablo_Paint_file_format"
FileNameExtensions: ["pa3", "ppp"]
MimeType: image/x-pablo-packed-picture
DetectionPatterns:
  - Pos: 0
    AsciiString: "PABLO PACKED PICTURE: Groupe CDND \r\n"
    CaseSensitive: true
