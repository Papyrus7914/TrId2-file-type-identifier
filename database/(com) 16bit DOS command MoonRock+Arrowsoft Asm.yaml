Name: 16bit DOS command MoonRock+Arrowsoft Asm.
Description: MoonRock is a BASIC-like language with several extensions. Produces small and tight executables. Includes compiler, ArrowSoft assembler, documentation and sample programs.
URL: "http://www.rowan.sensation.net.au/bruce-mr.html"
FileNameExtensions: ["com"]
DetectionPatterns:
  - Pos: 0
    Bytes: [0xBC]
  - Pos: 3
    Bytes: [0xBB]
  - Pos: 6
    AsciiString: "\xB4J\xCD!r"
    CaseSensitive: true
  - Pos: 12
    #              $     5           !     .
    Bytes: [0xB8, 0x24, 0x35, 0xCD, 0x21, 0x2E, 0x89, 0x1E]
  - Pos: 22
    #        .
    Bytes: [0x2E, 0x8C, 0x06]
  - Pos: 27
    #              $     %
    Bytes: [0xB8, 0x24, 0x25, 0xBA]
  - Pos: 33
    #              !           H
    Bytes: [0xCD, 0x21, 0xB4, 0x48, 0xBB]
  - Pos: 40
    AsciiString: "\xCD!r"
    CaseSensitive: true
  - Pos: 44
    Bytes: [0x8E, 0xD8, 0x8E, 0xC0]
  - Pos: any
    AsciiString: "BY ROWAN CROWE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATED BY MOONROCK COMPILER V"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MEMORY ALLOCATION ERROR$"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PORTIONS (C) 1994-199"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PSQR"
    CaseSensitive: false
