Name: Kang Change Directory tree info
Description: DOS utilities by Kang Yonghee, inspired by Norton utilities.
FileNameExtensions: ["kcd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "KCD by Kang,Yong-Huee\0\0\0\0"
    CaseSensitive: true
  - Pos: 27
    AsciiString: "\\"
    CaseSensitive: true
