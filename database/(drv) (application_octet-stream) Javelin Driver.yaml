Name: Javelin Driver
URL: "http://en.wikipedia.org/wiki/Javelin_Software"
FileNameExtensions: ["drv"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 73
    AsciiString: "\x02\0\0$\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "THIS PROGRAM IS A JAVELIN DEVICE DRIVER FOR THE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IT MUST BE LOADED BY THE JAVELIN PRODUCT."
    CaseSensitive: false
  - Pos: any
    AsciiString: "STACK OVERFLOW DETECTED."
    CaseSensitive: false
  - Pos: any
    AsciiString: "JAVELIN DRIVER"
    CaseSensitive: false
