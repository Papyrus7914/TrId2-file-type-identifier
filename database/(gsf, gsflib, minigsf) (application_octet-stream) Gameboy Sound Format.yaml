Name: Gameboy Sound Format
URL: "http://fileformats.archiveteam.org/wiki/GSF"
FileNameExtensions: ["gsf", "gsflib", "minigsf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PSF\"\0\0\0\0"
    CaseSensitive: true
  - Pos: 11
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 16
    #        x
    Bytes: [0x78, 0xDA]
