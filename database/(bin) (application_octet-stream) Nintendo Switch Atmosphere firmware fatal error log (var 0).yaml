Name: Nintendo Switch Atmosphere firmware fatal error log (var 0)
URL: "https://github.com/Atmosphere-NX/Atmosphere"
FileNameExtensions: ["bin"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "AFE0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NINTENDOSDK FIRMWARE FOR NX"
    CaseSensitive: false
