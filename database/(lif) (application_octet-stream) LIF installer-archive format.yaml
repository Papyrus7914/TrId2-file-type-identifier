Name: LIF installer-archive format
URL: "http://fileformats.archiveteam.org/wiki/LIF_(Knowledge_Dynamics)"
FileNameExtensions: ["lif"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "1"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "000"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "000"
    CaseSensitive: true
  - Pos: 32
    AsciiString: "0"
    CaseSensitive: true
  - Pos: 46
    AsciiString: "\0\0\0\0\0\0\0\0"
    CaseSensitive: true
