Name: Windows ESE database
URL: "https://forensics.wiki/extensible_storage_engine_(ese)_database_file_(edb)_format/"
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x17\0\0\0SCCA\x11\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "H\0A\0R\0D\0D\0I\0S\0K\0V\0O\0L\0U\0M\0E"
    CaseSensitive: false
  - Pos: any
    AsciiString: "W\0I\0N\0D\0O\0W\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "D\0E\0V\0I\0C\0E"
    CaseSensitive: false
  - Pos: any
    AsciiString: "L\0O\0C\0A\0L"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".\0E\0X\0E"
    CaseSensitive: false
  - Pos: any
    AsciiString: "U\0S\0E\0R"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCCA"
    CaseSensitive: false
