Name: TuneUp Style Boot Screen
URL: "http://www.tune-up.com"
FileNameExtensions: ["tbs"]
DetectionPatterns:
  - Pos: 0
    #        T     K
    Bytes: [0x54, 0x4B, 0x03, 0x04]
  - Pos: 21
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 25
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 27
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".INIPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".BMPPK"
    CaseSensitive: false
