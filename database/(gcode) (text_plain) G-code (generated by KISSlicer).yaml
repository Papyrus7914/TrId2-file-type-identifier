    AsciiString: "; KISSlicer - "
    CaseSensitive: true
  - Pos: any
    AsciiString: "*** MATERIAL SETTINGS FOR EXTRUDER 1 ***"
    CaseSensitive: false
  - Pos: any
    AsciiString: "*** ACTUAL SLICING SETTINGS AS USED ***"
    CaseSensitive: false
  - Pos: any
    AsciiString: "* BEFORE POSSIBLY SLOWING DOWN FOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "*** EXTRUSION TIME BREAKDOWN ***"
    CaseSensitive: false
  - Pos: any
    AsciiString: "* NOT INCLUDING Z-TRAVEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "*** PRINTER SETTINGS ***"
    CaseSensitive: false
  - Pos: any
    AsciiString: "*** STYLE SETTINGS ***"
    CaseSensitive: false
  - Pos: any
    AsciiString: "* ESTIMATED TIME IN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "*** MAIN G-CODE ***"
    CaseSensitive: false
  - Pos: any
    AsciiString: "G-CODE POSTFIX ***"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WARMING EXTRUDER 1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "G-CODE PREFIX ***"
    CaseSensitive: false
  - Pos: any
    AsciiString: "*** COOLING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SUPPORT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".GCODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUILT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NULL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RING"
    CaseSensitive: false
