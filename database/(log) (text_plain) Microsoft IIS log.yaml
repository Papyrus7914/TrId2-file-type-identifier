Name: Microsoft IIS log
URL: "https://en.wikipedia.org/wiki/Internet_Information_Services"
FileNameExtensions: ["log"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "#Software: Microsoft Internet Information Services "
    CaseSensitive: true
  - Pos: any
    AsciiString: "SOFTWARE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FIELDS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TIME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USER"
    CaseSensitive: false
