Name: FL Studio Score
URL: "http://fileformats.archiveteam.org/wiki/FL_Studio_Score_File"
FileNameExtensions: ["fsc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FLhd\x06\0\0\0\x10\0"
    CaseSensitive: true
  - Pos: 11
    AsciiString: "\0`\0FLdt"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FLDT"
    CaseSensitive: false
