Name: Spybot Search'n'Destroy process data
URL: "https://en.wikipedia.org/wiki/Spybot_%E2%80%93_Search_%26_Destroy"
FileNameExtensions: ["tnfo"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "[]\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONFIRMED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOURCE"
    CaseSensitive: false
