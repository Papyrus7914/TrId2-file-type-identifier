Name: Windows Bitmap (v5)
Description: This variant with 128 byte DIB header (Windows 98/2000)
URL: "https://en.wikipedia.org/wiki/BMP_file_format"
FileNameExtensions: ["bmp"]
MimeType: image/bmp
DetectionPatterns:
  - Pos: 0
    AsciiString: "BM"
    CaseSensitive: true
  - Pos: 14
    AsciiString: "|\0\0\0"
    CaseSensitive: true
