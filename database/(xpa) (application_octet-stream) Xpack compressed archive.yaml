Name: Xpack compressed archive
Description: Xpack compressor by JauMing Tseng 1999
URL: "ftp://ftp.sac.sk/pub/sac/xpa167r.zip"
FileNameExtensions: ["xpa"]
MimeType: application/octet-stream
