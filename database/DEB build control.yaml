Name: DEB build control
URL: "http://en.wikipedia.org/wiki/Debian"
DetectionPatterns:
  - Pos: 0
    AsciiString: "Source:"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEPENDS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PACKAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOURCE"
    CaseSensitive: false
