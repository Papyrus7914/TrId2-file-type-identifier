Name: 16bit DOS EXE TCEC protected (v3.59)
Description: Protector by The ThE CLERiC!
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0\0\x02\0"
    CaseSensitive: true
  - Pos: 16
    #                    Y
    Bytes: [0xFE, 0xFF, 0x59, 0x03, 0x00, 0x00]
  - Pos: 24
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 27
    AsciiString: "\0TCEC"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TCEC"
    CaseSensitive: false
