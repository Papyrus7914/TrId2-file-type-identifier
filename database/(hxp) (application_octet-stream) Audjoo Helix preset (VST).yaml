Name: Audjoo Helix preset (VST)
URL: "https://www.audjoo.com/h/Helix.htm"
FileNameExtensions: ["hxp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "CcnK"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "FPCh\0\0\0\x01x!!$"
    CaseSensitive: true
  - Pos: 60
    AsciiString: "JonasNorberg####Helix###20"
    CaseSensitive: true
  - Pos: 92
    AsciiString: "Program#########"
    CaseSensitive: true
  - Pos: any
    AsciiString: "JONASNORBERG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROGRAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HELIX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FPCH"
    CaseSensitive: false
