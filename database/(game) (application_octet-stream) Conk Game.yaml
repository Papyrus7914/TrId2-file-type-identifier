Name: Conk Game
Description: Action Game Construction Kit for Amiga.
URL: "https://www.semprini.me/1995/03/20/conk-action-game-construction-kit/"
FileNameExtensions: ["game"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "CONKGAME"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CONKGAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".ACTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".BOBS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".DISP"
    CaseSensitive: false
