Name: HASP license update info
URL: "https://docs.sentinel.thalesgroup.com/"
FileNameExtensions: ["v2c"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"utf-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "HASPSCOPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HASP_INFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VENDOR ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HASP ID"
    CaseSensitive: false
