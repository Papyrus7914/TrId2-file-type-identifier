Name: Autodesk PowerMill Geometry data
URL: "https://en.wikipedia.org/wiki/PowerMILL"
FileNameExtensions: ["pmlgeom"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Name:           PowerMILL20"
    CaseSensitive: true
  - Pos: 82
    AsciiString: "\nComment:"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MICROSOFT (R) WINDOWS NT (TM)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PMLENTTOOLPATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYSTEM VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ARCHITECTURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POWERMILL20"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-GEOMETRY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PSINDEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RELEASE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NODE"
    CaseSensitive: false
