Name: radiobrowser stations info
URL: "https://gitlab.com/radiobrowser/radio-database"
FileNameExtensions: ["json"]
MimeType: text/json
DetectionPatterns:
  - Pos: 0
    AsciiString: "["
    CaseSensitive: true
  - Pos: any
    AsciiString: "LANGUAGECODES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COUNTRYCODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STATIONUUID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ISO_3166_2"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HOMEPAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FAVICON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TAGS"
    CaseSensitive: false
