Name: Novell Netware Virtual Loadable Module
URL: "https://en.wikipedia.org/wiki/NetWare"
FileNameExtensions: ["vlm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 11
    AsciiString: "\0\xFF\xFF\0\0\0"
    CaseSensitive: true
  - Pos: 25
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 27
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NETWARE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NOVELL"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".VLM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NVLM"
    CaseSensitive: false
