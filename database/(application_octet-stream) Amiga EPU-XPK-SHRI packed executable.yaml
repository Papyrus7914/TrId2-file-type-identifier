Name: Amiga EPU-XPK-SHRI packed executable
Description: https://www.dstoecker.eu/xpklibs.html#SHRI
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #                    c     h           a
    Bytes: [0x01, 0x80, 0x63, 0x68, 0x05, 0x61, 0x01]
  - Pos: 16
    AsciiString: "xpkSHRI"
    CaseSensitive: true
  - Pos: any
    AsciiString: "XPKSHRI"
    CaseSensitive: false
