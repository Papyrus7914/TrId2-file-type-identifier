Name: Fallout 2 save game
URL: "https://www.mobygames.com/game/239/fallout-2/"
FileNameExtensions: ["dat"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FALLOUT SAVE FILE\0\0\0\0\0\0\0\0\x01\0\x02RM"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".SAV"
    CaseSensitive: false
