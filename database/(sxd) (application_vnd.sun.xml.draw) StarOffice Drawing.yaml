Name: StarOffice Drawing
URL: "http://en.wikipedia.org/wiki/OpenDocument"
FileNameExtensions: ["sxd"]
MimeType: application/vnd.sun.xml.draw
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "MIMETYPEAPPLICATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VND.SUN.XML.DRAWPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MANIFEST.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SETTINGS.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENT.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MIMETYPEPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STYLES.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "META-INF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "META.XML"
    CaseSensitive: false
