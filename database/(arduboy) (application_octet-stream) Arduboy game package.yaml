Name: Arduboy game package
URL: "https://www.arduboy.com/"
FileNameExtensions: ["arduboy"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "BANNER.PNG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFO.JSON"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".HEX"
    CaseSensitive: false
