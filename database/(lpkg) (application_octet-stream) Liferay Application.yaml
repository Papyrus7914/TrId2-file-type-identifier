Name: Liferay Application
Description: https://en.wikipedia.org/wiki/Liferay
FileNameExtensions: ["lpkg"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "LIFERAY-MARKETPLACE.PROPERTIESPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ARPK"
    CaseSensitive: false
