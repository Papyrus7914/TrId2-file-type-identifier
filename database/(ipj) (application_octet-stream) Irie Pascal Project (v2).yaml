Name: Irie Pascal Project (v2)
URL: "https://www.irietools.com/"
FileNameExtensions: ["ipj"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "IPJ Version 2 - Irie Pascal Project File"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ENVIRONMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTENSIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LANGUAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CODEGEN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RUNTIME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PAS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MISC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WARN"
    CaseSensitive: false
