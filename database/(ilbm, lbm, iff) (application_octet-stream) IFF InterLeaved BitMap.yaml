Name: IFF InterLeaved BitMap
Description: A bitmap format mostly used on Commodore Amiga.
URL: "http://en.wikipedia.org/wiki/ILBM"
FileNameExtensions: ["ilbm", "lbm", "iff"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "ILBM"
    CaseSensitive: true
