Name: E-Mail message (Var. 11)
URL: "http://fileformats.archiveteam.org/wiki/Internet_e-mail_message_format"
FileNameExtensions: ["eml"]
MimeType: message/rfc822
DetectionPatterns:
  - Pos: 0
    AsciiString: "Date: "
    CaseSensitive: true
  - Pos: any
    AsciiString: "CONTENT-TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MIME-VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MESSAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SUBJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FROM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIL"
    CaseSensitive: false
