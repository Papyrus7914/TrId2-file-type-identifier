Name: Fossil repository data base
Description: SQLite 3.x database with application id 0x0F055111; file name suffix fsl also sometimes occur
URL: "http://fileformats.archiveteam.org/wiki/Fossil_repository_database"
FileNameExtensions: ["fossil", "fsl"]
MimeType: application/vnd.sqlite3
DetectionPatterns:
  - Pos: 0
    AsciiString: "SQLite format 3"
    CaseSensitive: true
  - Pos: 68
    #                    Q
    Bytes: [0x0F, 0x05, 0x51, 0x11]
