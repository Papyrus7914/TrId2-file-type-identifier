Name: Windows spelling Dictionary identifier
FileNameExtensions: ["dub"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x12, 0xE2]
  - Pos: 3
    AsciiString: "w"
    CaseSensitive: true
  - Pos: 5
    Bytes: [0x94]
  - Pos: 7
    AsciiString: "V"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "5"
    CaseSensitive: true
  - Pos: 11
    Bytes: [0x84]
  - Pos: 13
    Bytes: [0xE2]
  - Pos: 15
    AsciiString: "w"
    CaseSensitive: true
