Name: Dreamcast PVR texture format
URL: "http://fabiensanglard.net/Mykaruga/tools/segaPVRFormat.txt"
FileNameExtensions: ["pvr"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "GBIX"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "PVRT"
    CaseSensitive: true
