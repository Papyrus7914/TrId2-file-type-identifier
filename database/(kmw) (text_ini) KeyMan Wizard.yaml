Name: KeyMan Wizard
Description: Macro tool for Windows by VP-Soft.
FileNameExtensions: ["kmw"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "[General]\r\nName="
    CaseSensitive: true
  - Pos: any
    AsciiString: "ADDAFTER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CATEGORY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SELECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WINDOW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HINT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOOL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
