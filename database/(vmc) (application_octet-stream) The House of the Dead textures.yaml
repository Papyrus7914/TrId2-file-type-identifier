Name: The House of the Dead textures
URL: "https://www.mobygames.com/game/windows/house-of-the-dead"
FileNameExtensions: ["vmc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PIFF"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "VVTPBODY"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VVTPBODY"
    CaseSensitive: false
