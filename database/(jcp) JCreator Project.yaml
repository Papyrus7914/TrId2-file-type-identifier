Name: JCreator Project
URL: "http://en.wikipedia.org/wiki/JCreator"
FileNameExtensions: ["jcp"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "! ** JCreator Project File (C)2000"
    CaseSensitive: true
  - Pos: any
    AsciiString: "START RUNTIME CONFIGURATION STRUCTURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "START REQUIRED LIBRARIES STRUCTURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "** JCREATOR PROJECT FILE (C)2000"
    CaseSensitive: false
  - Pos: any
    AsciiString: "********** DO NOT EDIT *********"
    CaseSensitive: false
  - Pos: any
    AsciiString: "START PROJECT FOLDER STRUCTURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BEGINRUNTIME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BEGINFOLDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENDRUNTIME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JDKPROFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUTPUTPATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENDFOLDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RUNAPPLET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RUNAPPLIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPILER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ACTIVE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILTER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHECK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LABEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROOT"
    CaseSensitive: false
