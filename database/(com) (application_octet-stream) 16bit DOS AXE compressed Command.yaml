Name: 16bit DOS AXE compressed Command
URL: "https://en.wikipedia.org/wiki/ARC_(file_format)"
FileNameExtensions: ["com"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 3
    AsciiString: "\x01\x03\0\0\0\x02\0\0\0\xFF\xFF\0\0"
    CaseSensitive: true
  - Pos: 21
    AsciiString: "\0\0\0\x1E\0\0\0\x01\0\0\0SEA-AXE"
    CaseSensitive: true
  - Pos: any
    AsciiString: "INVALID COMPRESSED FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INSUFFICIENT MEMORY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INVALID ENVIRONMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNABLE TO OPEN FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEA-AXE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$PATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".COM"
    CaseSensitive: false
