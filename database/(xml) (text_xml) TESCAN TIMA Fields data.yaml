Name: TESCAN TIMA Fields data
URL: "https://en.wikipedia.org/wiki/TESCAN"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "EXPORTEDMEASUREMENTFIELDS REVISION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.TESCAN.CZ"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FIELD NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FIELDDIR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TIMA"
    CaseSensitive: false
