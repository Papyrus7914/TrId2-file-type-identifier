Name: PotPlayer Skin
URL: "https://potplayer.daum.net/"
FileNameExtensions: ["dsf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "SCROLLBAR.BMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIDEOSKIN.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BRTOOL.PNG"
    CaseSensitive: false
