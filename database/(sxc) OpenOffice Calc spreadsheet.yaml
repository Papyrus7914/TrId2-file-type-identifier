Name: OpenOffice Calc spreadsheet
URL: "http://en.wikipedia.org/wiki/OpenDocument"
FileNameExtensions: ["sxc"]
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "DOCUMENT-STATISTIC META"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DTD OFFICEDOCUMENT 1.0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCUMENT-META PUBLIC"
    CaseSensitive: false
