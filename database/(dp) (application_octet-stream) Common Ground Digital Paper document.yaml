Name: Common Ground Digital Paper document
URL: "http://fileformats.archiveteam.org/wiki/Common_Ground"
FileNameExtensions: ["dp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 8
    AsciiString: "CGDC"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CGDC"
    CaseSensitive: false
