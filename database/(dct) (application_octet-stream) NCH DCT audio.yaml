Name: NCH DCT audio
URL: "http://fileformats.archiveteam.org/wiki/DCT"
FileNameExtensions: ["dct"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 4
    AsciiString: "\x01\0\0\0\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 15
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 19
    AsciiString: "\t7]"
    CaseSensitive: true
  - Pos: any
    AsciiString: "WAVEFMT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "L\0X\0B"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RIFF"
    CaseSensitive: false
