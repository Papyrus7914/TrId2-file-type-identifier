Name: Monefy backup
URL: "https://monefy.com/"
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        c           \r    }     }     }           N                       V     l
    Bytes: [0x63, 0x9C, 0x0D, 0x7D, 0x7D, 0x7D, 0xF2, 0x4E, 0xE8, 0x8B, 0xBC, 0x56, 0x6C, 0x03, 0xC3, 0x9C]
  - Pos: 64
    #                    z     p     Z     Y                 1                             g     A
    Bytes: [0x04, 0x8D, 0x7A, 0x70, 0x5A, 0x59, 0x86, 0x8D, 0x31, 0x05, 0xCB, 0xD2, 0x88, 0x67, 0x41, 0x90]
  - Pos: any
    AsciiString: "ZPZY"
    CaseSensitive: false
