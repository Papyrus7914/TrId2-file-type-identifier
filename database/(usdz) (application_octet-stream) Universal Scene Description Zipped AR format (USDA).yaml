Name: Universal Scene Description Zipped AR format (USDA)
URL: "http://fileformats.archiveteam.org/wiki/Universal_Scene_Description"
FileNameExtensions: ["usdz"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: ".USDA"
    CaseSensitive: false
