Name: thinBasic GUI scripts (obfuscated)
Description: thinBasic is a Basic like language interpreter. Its target is to have a scripts text file to be interpreted and executed immediately by a simple double click or by an automated scheduled tasks.
URL: "http://www.thinbasic.com"
FileNameExtensions: ["tbasicx"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "TB\x01\0\x01\0\0\0\0\0\0\0\b\0\0\0\x01\0\0\0"
    CaseSensitive: true
