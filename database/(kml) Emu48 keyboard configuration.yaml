Name: Emu48 keyboard configuration
Description: Emu48 is an emulator for the HP48 and HP49 calculators.
URL: "http://www.hpcalc.org"
FileNameExtensions: ["kml"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "Global\r\n\t"
    CaseSensitive: true
  - Pos: 14
    AsciiString: " "
    CaseSensitive: true
  - Pos: any
    AsciiString: "ANNUNCIATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BACKGROUND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BEEP.EXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTHOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OFFSET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BITMAP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUTTON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROM.48"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GLOBAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUTIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEBUG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATCH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".BMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOWN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ZOOM"
    CaseSensitive: false
