Name: G-code (generated by Slic3r)
URL: "https://en.wikipedia.org/wiki/Slic3r"
FileNameExtensions: ["gcode"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "; generated by Slic3r "
    CaseSensitive: true
  - Pos: any
    AsciiString: "PERIMETERS EXTRUSION WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFILL EXTRUSION WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTRUSION_MULTIPLIER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BOTTOM_SOLID_LAYERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATED BY SLIC3R"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILAMENT_DIAMETER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOP_SOLID_LAYERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NOZZLE_DIAMETER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PERIMETER_SPEED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILAMENT USED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILL_DENSITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFILL_SPEED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAYER_HEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRAVEL_SPEED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEMPERATURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISTANCES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FIRST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AXIS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HOME"
    CaseSensitive: false
