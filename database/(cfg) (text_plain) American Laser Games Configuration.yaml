Name: American Laser Games Configuration
URL: "https://www.mobygames.com/company/442/american-laser-games-inc/"
FileNameExtensions: ["cfg"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "U\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MOUSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".LIB"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".SCN"
    CaseSensitive: false
