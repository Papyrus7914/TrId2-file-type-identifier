  - Pos: any
    AsciiString: "B\0O\0O\0T\0 \0M\0A\0N\0A\0G\0E\0R"
    CaseSensitive: false
  - Pos: any
    AsciiString: "B\0O\0O\0T\0M\0G\0F\0W\0.\0E\0F\0I"
    CaseSensitive: false
  - Pos: any
    AsciiString: "X\0\0\0B\0C\0D\0O\0B\0J\0E\0C\0T"
    CaseSensitive: false
  - Pos: any
    AsciiString: "S\0H\0E\0L\0L"
    CaseSensitive: false
