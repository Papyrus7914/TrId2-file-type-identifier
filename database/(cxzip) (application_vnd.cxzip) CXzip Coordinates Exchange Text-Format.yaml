Name: CXzip Coordinates Exchange Text-Format
URL: "https://heightmap.org/"
FileNameExtensions: ["cxzip"]
MimeType: application/vnd.cxzip
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "__main.cxtf"
    CaseSensitive: true
  - Pos: any
    AsciiString: "__MAIN.CXTF"
    CaseSensitive: false
