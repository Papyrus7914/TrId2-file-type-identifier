Name: Delphi project Options
URL: "https://en.wikipedia.org/wiki/Delphi_(software)"
FileNameExtensions: ["opt"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "[Compiler]"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CONDITIONALS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIRECTORIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPTIMIZEEXE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LINKBUFFER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARAMETERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEARCHPATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEBUGINFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUTPUTDIR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RUNPARAMS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STACKSIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEAPSIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAPFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LINKER"
    CaseSensitive: false
