Name: iMovie Project
URL: "https://en.wikipedia.org/wiki/IMovie"
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "iMovie Project File"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PROJECTSELECTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUDIOTRACKMUTE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIDEOSTANDARD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTERNAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLAYHEAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
