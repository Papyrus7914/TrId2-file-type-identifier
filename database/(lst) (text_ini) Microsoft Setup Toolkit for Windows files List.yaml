    CaseSensitive: false
  - Pos: any
    AsciiString: "WNDMESS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARAMS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SETUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHELL"
    CaseSensitive: false
