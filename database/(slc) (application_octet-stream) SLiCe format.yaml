Name: SLiCe format
URL: "http://web.archive.org/web/20120313222303/http://paulbourke.net/dataformats/slc/"
FileNameExtensions: ["slc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "-SLCVER "
    CaseSensitive: true
  - Pos: 9
    AsciiString: "."
    CaseSensitive: true
  - Pos: any
    AsciiString: "-EXTENTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-PACKAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-TYPE"
    CaseSensitive: false
