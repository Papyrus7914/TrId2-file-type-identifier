Name: VMware 4 Virtual Disk (monolitic)
URL: "https://en.wikipedia.org/wiki/VMware"
FileNameExtensions: ["vmdk"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "KDMV"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DDB.GEOMETRY.CYLINDERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DDB.GEOMETRY.SECTORS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISK DESCRIPTORFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DDB.GEOMETRY.HEADS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THE DISK DATA BASE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DDB.ADAPTERTYPE"
    CaseSensitive: false
