Name: JetDogs Studios game data archive
Description: Used for example in Sinister City and Cursed.
FileNameExtensions: ["dat"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "wazzzzaup!"
    CaseSensitive: true
  - Pos: 14
    AsciiString: "\0\0\0\0"
    CaseSensitive: true
