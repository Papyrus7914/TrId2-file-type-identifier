Name: SuperPower scenario
URL: "https://www.mobygames.com/game/windows/superpower"
FileNameExtensions: ["dsc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "E#\x04\0GolemLabs\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SCENARIO BACKGROUND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCENARIO TIME LIMIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCENARIO OBJECTIVE"
    CaseSensitive: false
