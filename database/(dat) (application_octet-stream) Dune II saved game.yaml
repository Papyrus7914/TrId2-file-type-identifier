Name: Dune II saved game
URL: "https://en.wikipedia.org/wiki/Dune_II"
FileNameExtensions: ["dat"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "SCENNAME"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".WSA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BLDG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLYR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNIT"
    CaseSensitive: false
