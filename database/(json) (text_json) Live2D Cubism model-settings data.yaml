Name: Live2D Cubism model-settings data
URL: "https://www.live2d.com/en/"
FileNameExtensions: ["json"]
MimeType: text/json
DetectionPatterns:
  - Pos: 0
    AsciiString: "{\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LIVE2D MODEL SETTING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXTURES"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PNG"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".MOC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
