Name: VP6 encoded video
URL: "http://www.on2.com"
FileNameExtensions: ["vp6"]
DetectionPatterns:
  - Pos: 1
    AsciiString: "V"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 27
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MV0FD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MV0FL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MV0FT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MVHD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "V0FH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MV0K"
    CaseSensitive: false
