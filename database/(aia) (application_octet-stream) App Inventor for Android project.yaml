Name: App Inventor for Android project
Description: App Inventor is an open-source web application maintained by the MIT.
URL: "http://en.wikipedia.org/wiki/App_Inventor_for_Android"
FileNameExtensions: ["aia"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "PROJECT.PROPERTIESPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "YOUNGANDROIDPROJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCREEN1.BKYPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCREEN1.SCMPK"
    CaseSensitive: false
