Name: Kaspersky Anti-virus for DOS license Key (v3.x)
URL: "https://en.wikipedia.org/wiki/Kaspersky_Anti-Virus"
FileNameExtensions: ["key"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "AVP 3."
    CaseSensitive: true
  - Pos: 7
    AsciiString: " Key File"
    CaseSensitive: true
