Name: jGRASP Project
URL: "http://en.wikipedia.org/wiki/JGRASP"
FileNameExtensions: ["gpj"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "!"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CLASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GRASP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_PATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JAVA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SJU0"
    CaseSensitive: false
