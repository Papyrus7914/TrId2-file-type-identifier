Name: WordPerfect overlay
Description: Used in WordPerfect 5.x.
URL: "https://github.com/OneWingedShark/WordPerfect/blob/master/doc/SDK_Help/FileFormats/WPFF_DocumentStructure.htm"
FileNameExtensions: ["fil"]
MimeType: application/x-wordperfect-fil
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xFFWPC"
    CaseSensitive: true
  - Pos: 8
    Bytes: [0x01, 0x15]
