Name: TwinCAT Compiled-Library
URL: "https://www.beckhoff.com/en-en/products/automation/twincat/"
FileNameExtensions: ["compiled-library"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "__LANGUAGEMODEL.AUXILIARYPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTOMATICALLY GENERATED BY"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".OBJECTPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".METAPK"
    CaseSensitive: false
