Name: Kodak Digital Camera RAW image (DC serie)
URL: "http://fileformats.archiveteam.org/wiki/Kodak"
FileNameExtensions: ["kdc"]
MimeType: image/x-kodak-kdc
DetectionPatterns:
  - Pos: 0
    AsciiString: "MM\0*\0\0\0\b\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "EASTMAN KODAK COMPANY\0KODAK D"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIGITAL CAMERA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FULL\0\0KODAK D"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CAMERA V"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ZOOM"
    CaseSensitive: false
