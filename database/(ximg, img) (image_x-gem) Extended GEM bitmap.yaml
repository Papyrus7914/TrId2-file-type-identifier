Name: Extended GEM bitmap
URL: "http://fileformats.archiveteam.org/wiki/GEM_Raster"
FileNameExtensions: ["ximg", "img"]
MimeType: image/x-gem
DetectionPatterns:
  - Pos: 0
    Bytes: [0x00, 0x01]
  - Pos: 4
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "XIMG"
    CaseSensitive: true
