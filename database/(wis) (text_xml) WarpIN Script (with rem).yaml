Name: WarpIN Script (with rem)
URL: "http://warpin.netlabs.org/"
FileNameExtensions: ["wis"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<!-- "
    CaseSensitive: true
  - Pos: any
    AsciiString: "PACKAGEID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SELECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TARGET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WARPIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INDEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BODY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
