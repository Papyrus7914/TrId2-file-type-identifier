Name: 16bit DOS EXE DoP's CRYPTEXE encrypted
Description: Encryptor by The Doors of Perception Ltd.
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 16
    Bytes: [0xFE, 0xFF]
  - Pos: 20
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 25
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 27
    AsciiString: "\0DoP\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "0{({8{ {\0{"
    CaseSensitive: false
  - Pos: any
    AsciiString: "~$S4"
    CaseSensitive: false
  - Pos: any
    AsciiString: "~(~0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "~0~("
    CaseSensitive: false
