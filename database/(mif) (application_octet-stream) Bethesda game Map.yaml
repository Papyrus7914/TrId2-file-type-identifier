Name: Bethesda game Map
Description: "Used in The Elder Scrolls, The Terminator: Rampage, etc."
URL: "https://en.wikipedia.org/wiki/Bethesda_Softworks"
FileNameExtensions: ["mif"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MHDR=\0"
    CaseSensitive: true
  - Pos: 7
    Bytes: [0x01]
  - Pos: 67
    AsciiString: "LEVL"
    CaseSensitive: true
  - Pos: 73
    AsciiString: "NAME"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".INF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LEVL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAP1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUMF"
    CaseSensitive: false
