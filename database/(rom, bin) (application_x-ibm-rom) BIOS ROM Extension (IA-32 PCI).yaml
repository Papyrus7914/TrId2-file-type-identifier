Name: BIOS ROM Extension (IA-32 PCI)
Description: At offset 24 short pointer to 4 byte signature PCIR
URL: "https://en.wikipedia.org/wiki/Option_ROM"
FileNameExtensions: ["rom", "bin"]
MimeType: application/x-ibm-rom
DetectionPatterns:
  - Pos: 0
    #        U
    Bytes: [0x55, 0xAA]
  - Pos: any
    AsciiString: "PCIR"
    CaseSensitive: false
