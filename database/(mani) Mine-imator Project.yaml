Name: Mine-imator Project
URL: "http://www.stuffbydavid.com/mineimator"
FileNameExtensions: ["mani"]
DetectionPatterns:
  - Pos: 0
    Bytes: [0x02, 0x03]
  - Pos: 3
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".SCHEMATIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MINE"
    CaseSensitive: false
