Name: EPF game data archive
Description: Used in games by East Point Software.
URL: "https://moddingwiki.shikadi.net/wiki/EPF_Format"
FileNameExtensions: ["epf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "EPFS"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "\0"
    CaseSensitive: true
