Name: OcrHex enconded
URL: "http://fileformats.archiveteam.org/wiki/OcrHex"
FileNameExtensions: ["ocrhex"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FILENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".OCRHEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LENGTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "00000"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CRC32"
    CaseSensitive: false
