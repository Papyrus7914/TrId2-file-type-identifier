Name: Opticks Camera
Description: Amiga ray-trace Software.
FileNameExtensions: ["cam"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "\nCAMERAv1.0\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FOCALLENGTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PIXELSIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REALSIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
