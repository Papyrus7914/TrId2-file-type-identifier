Name: Movavi Video Editor Plus Project
URL: "https://www.movavi.com/"
FileNameExtensions: ["mepb"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "version"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".XMLPK"
    CaseSensitive: false
