Name: GeneWeb genealogy data
URL: "https://geneweb.tuxfamily.org/wiki/GeneWeb"
FileNameExtensions: ["gw"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "fam "
    CaseSensitive: true
  - Pos: any
    AsciiString: "NOTES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BEG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "END"
    CaseSensitive: false
