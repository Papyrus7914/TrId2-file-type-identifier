Name: Remedy User Tool shortcut
FileNameExtensions: ["artask"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "[Shortcut]"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SHORTCUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SERVER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TICKET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
