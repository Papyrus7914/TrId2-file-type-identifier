Name: Final Draft Script
URL: "https://www.finaldraft.com/"
FileNameExtensions: ["fdx"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FINALDRAFT DOCUMENTTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARAGRAPH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEMPLATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
