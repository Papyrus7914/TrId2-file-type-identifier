Name: ForthCMP compiled 16bit executable
Description: Shareware Forth compiler for MS-DOS by Tom Almy.
FileNameExtensions: ["com"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xE9\b\0"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0\0\0\0\n\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "F\0XMM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "F\0EE"
    CaseSensitive: false
