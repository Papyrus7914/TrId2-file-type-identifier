Name: Double Commander Shortcuts
URL: "https://doublecmd.sourceforge.io/"
FileNameExtensions: ["scf"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOUBLECMD DCVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HOTKEYS VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORM NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHORTCUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMAND"
    CaseSensitive: false
