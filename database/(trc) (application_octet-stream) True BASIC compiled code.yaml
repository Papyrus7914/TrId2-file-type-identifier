Name: True BASIC compiled code
URL: "https://en.wikipedia.org/wiki/True_BASIC"
FileNameExtensions: ["trc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xD4C\0\0"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "\0"
    CaseSensitive: true
