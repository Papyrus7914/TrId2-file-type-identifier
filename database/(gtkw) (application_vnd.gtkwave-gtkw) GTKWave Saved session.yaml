Name: GTKWave Saved session
URL: "https://en.wikipedia.org/wiki/GTKWave"
FileNameExtensions: ["gtkw"]
MimeType: application/vnd.gtkwave-gtkw
DetectionPatterns:
  - Pos: 0
    AsciiString: "[*]"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GTKWAVE ANALYZER V"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SST_VPANED_HEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATTERN_TRACE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIGNALS_WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SST_EXPANDED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SST_WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TIMESTART"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DUMPFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAVEFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".GTKW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIZE"
    CaseSensitive: false
