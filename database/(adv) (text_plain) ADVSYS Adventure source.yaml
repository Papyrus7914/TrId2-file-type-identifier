Name: ADVSYS Adventure source
Description: ADVenture SYStem, by David Betz.
URL: "http://www.catb.org/retro"
FileNameExtensions: ["adv"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "("
    CaseSensitive: true
  - Pos: any
    AsciiString: "(ADVENTURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(PROPERTY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(PRINT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(NOUN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(ACT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESC"
    CaseSensitive: false
