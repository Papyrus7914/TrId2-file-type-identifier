Name: XMLTV format (UTF-8)
Description: XML based file format for describing TV listings.
URL: "http://wiki.xmltv.org/index.php/XMLTVFormat"
FileNameExtensions: ["xmltv"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xEF\xBB\xBF<?xml version=\"1.0\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "GENERATOR-INFO-NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISPLAY-NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHANNEL ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROGRAMME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SERIE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "START"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STOP"
    CaseSensitive: false
