Name: Differential Data Stream Volume format
Description: A compressed version of PVM files.
URL: "http://paulbourke.net/dataformats/pvm/"
FileNameExtensions: ["pvm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "DDS v3"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "\n"
    CaseSensitive: true
