Name: Borland Developer Studio Project (UTF-8)
URL: "https://en.wikipedia.org/wiki/Borland"
FileNameExtensions: ["bdsproj"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xEF\xBB\xBF<?xml version=\"1.0\" encoding=\"utf-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PERSONALITYINFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BORLANDPROJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PERSONALITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPTION NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECTTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "S NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GUID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN"
    CaseSensitive: false
