Name: Unity addressables Binary content catalog (v2)
URL: "https://en.wikipedia.org/wiki/Unity_(game_engine)"
FileNameExtensions: ["bin"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "B\x89\xE3\r\x02\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ASSETBUNDLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNITYENGINE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RESOURCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
