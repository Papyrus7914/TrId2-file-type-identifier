Name: TAR - Tape ARchive (GNU)
Description: Variant at offset 257 7 character indicator "ustar  " followed by \0 created for example by GNU tar with "gnu" format option.
URL: "https://www.gnu.org/software/tar/manual/html_node/Standard.html"
FileNameExtensions: ["tar", "gtar"]
MimeType: application/x-gtar
DetectionPatterns:
  - Pos: 257
    AsciiString: "ustar  \0"
    CaseSensitive: true
  - Pos: 500
    AsciiString: "\0\0\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 511
    AsciiString: "\0"
    CaseSensitive: true
