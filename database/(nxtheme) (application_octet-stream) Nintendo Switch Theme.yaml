Name: Nintendo Switch Theme
URL: "https://switch.hacks.guide/homebrew/nxtheme-installer.html"
FileNameExtensions: ["nxtheme"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Yaz0\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "\0\0\0\x04\0\0\0\0\xFFSARC"
    CaseSensitive: true
  - Pos: 38
    AsciiString: "SFAT"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SARC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SFAT"
    CaseSensitive: false
