Name: Basic/Z Source code (CP/M, v1.11)
URL: "https://en.wikipedia.org/wiki/PowerBASIC#History"
FileNameExtensions: ["bzs"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x11, 0x01, 0x80, 0x82]
  - Pos: 6
    Bytes: [0x00, 0x80]
  - Pos: 9
    AsciiString: " "
    CaseSensitive: true
