Name: TRS-80 DMK 5"1/4 SD disk image (write protected)
Description: Format by David Keil.
URL: "http://fileformats.archiveteam.org/wiki/DMK"
FileNameExtensions: ["dmk"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xFF]
  - Pos: 2
    #              \f
    Bytes: [0xC0, 0x0C]
