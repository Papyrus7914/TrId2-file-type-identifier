Name: Level 9 Computing game data container
Description: Used by some DOS games by L9.
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "INFO\0\0\0\0\0\0\0\0L9L9"
    CaseSensitive: true
  - Pos: any
    AsciiString: "INFO\0\0\0\0\0\0\0\0L9L9"
    CaseSensitive: false
