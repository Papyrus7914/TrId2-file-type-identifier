Name: Infinity Engine compressed archive (v1.0)
Description: Infinity Engine BIF files are archives containing game resources which are indexed by the KEY file.  The V1.0 format is a zlib compressed BIF.
URL: "http://iesdp.gibberlings3.net/file_formats/ie_formats/bif_v1.htm#bifc_v1.0"
FileNameExtensions: ["bif"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "BIFCV1.0"
    CaseSensitive: true
