Name: Seene 3d model (v3)
URL: "http://seene.co/"
FileNameExtensions: ["oemodel"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x03\0\0\0"
    CaseSensitive: true
  - Pos: 12
    #        9                 E     9                 E
    Bytes: [0x39, 0xE3, 0x11, 0x45, 0x39, 0xE3, 0x11, 0x45]
