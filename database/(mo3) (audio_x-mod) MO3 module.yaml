Name: MO3 module
Description: MO3 is a file format encapsulating the features of several MOD formats (IT, XM, S3M, MTM, MOD) and using MP3 and OGG compressed samples.
URL: "http://www.un4seen.com/mo3.html"
FileNameExtensions: ["mo3"]
MimeType: audio/x-mod
DetectionPatterns:
  - Pos: 0
    AsciiString: "MO3"
    CaseSensitive: true
