Name: KineMaster Project
URL: "https://kinemaster.com/"
FileNameExtensions: ["kmproject"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xF3KM\xEA\0\0\0\x01KHDR"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FTRX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JFIF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TLIN"
    CaseSensitive: false
