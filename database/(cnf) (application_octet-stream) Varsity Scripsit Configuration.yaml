Name: Varsity Scripsit Configuration
Description: PC version of the TRS-80 word processor.
URL: "http://www.trs-80.org/scripsit/"
FileNameExtensions: ["cnf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Varsity configuration file\r\n\x1A"
    CaseSensitive: true
