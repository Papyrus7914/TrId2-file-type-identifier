Name: Prusa i3 MK2.5 firmware
URL: "https://help.prusa3d.com/en/downloads/"
FileNameExtensions: ["hex"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: ":100000000C94"
    CaseSensitive: true
  - Pos: any
    AsciiString: "1_75MM_MK25-RAMBO1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "A-E3DV6FULL"
    CaseSensitive: false
