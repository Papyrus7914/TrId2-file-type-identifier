Name: IRIS Showcase drawing / presentation (v3)
URL: "https://techpubs.jurassic.nl/library/manuals/1000/007-1303-090/sgi_html/index.html"
FileNameExtensions: ["showcase", "sc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SCFM\x03"
    CaseSensitive: true
  - Pos: 20
    AsciiString: "pattern"
    CaseSensitive: true
  - Pos: any
    AsciiString: "THIS FILE CREATED BY IRIS SHOWCASE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CURRENT ITEM NUMBER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CURRENT PAGE NUMBER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SLIDE SHOW SCRIPT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STARTING SCRIPT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION STRING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$VERSION CODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENDING SCRIPT"
    CaseSensitive: false
