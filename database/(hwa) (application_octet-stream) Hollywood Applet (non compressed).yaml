Name: Hollywood Applet (non compressed)
URL: "https://en.wikipedia.org/wiki/Hollywood_(programming_language)"
FileNameExtensions: ["hwa"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "HWA\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "HOLLYWOOD"
    CaseSensitive: false
