Name: Clarion 2 DataBase for DOS
URL: "http://en.wikipedia.org/wiki/Clarion_(programming_language)"
FileNameExtensions: ["dat"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "C3"
    CaseSensitive: true
  - Pos: 3
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 111
    AsciiString: "\0"
    CaseSensitive: true
