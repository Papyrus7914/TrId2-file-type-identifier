Name: PC Tools Menu
URL: "https://en.wikipedia.org/wiki/PC_Tools_(software)"
FileNameExtensions: ["mna", "mnc", "mnd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "n\0"
    CaseSensitive: true
  - Pos: 11
    AsciiString: "\0MENUFILE"
    CaseSensitive: true
  - Pos: 49
    AsciiString: "\0PC "
    CaseSensitive: true
  - Pos: any
    AsciiString: "PC TOOLS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MENU"
    CaseSensitive: false
