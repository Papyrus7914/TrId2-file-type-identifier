Name: MGUI settings
URL: "https://home.uevora.pt/~db/SPATRAM/mguimainp.html"
FileNameExtensions: ["ini"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: ";\r\n; MGUI preferences file\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DEFAULTS FOR THE FORM OBJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULTCOLORS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FONTS1024X768"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FONTS640X480"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FONTS800X600"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BACKGROUND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FOREGROUND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MEDIUM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LARGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SMALL"
    CaseSensitive: false
