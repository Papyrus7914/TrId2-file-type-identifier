Name: PowerGraphics bitmap
Description: Atari 8-bit paint program.
FileNameExtensions: ["pgr"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xFF, 0xFF, 0x06, 0x82]
  - Pos: 8
    AsciiString: "PowerGFX\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "POWERGFX"
    CaseSensitive: false
