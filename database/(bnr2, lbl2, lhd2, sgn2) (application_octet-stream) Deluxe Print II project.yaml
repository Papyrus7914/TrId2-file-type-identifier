Name: Deluxe Print II project
URL: "http://www.amigafuture.de/asd.php?asd_id=333"
FileNameExtensions: ["bnr2", "lbl2", "lhd2", "sgn2"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "DPG3PGHD"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FNTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FONT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IDAT"
    CaseSensitive: false
