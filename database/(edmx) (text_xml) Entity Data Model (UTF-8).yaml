Name: Entity Data Model (UTF-8)
URL: "https://en.wikipedia.org/wiki/Entity_Framework"
FileNameExtensions: ["edmx"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    #                          <
    Bytes: [0xEF, 0xBB, 0xBF, 0x3C]
  - Pos: any
    AsciiString: "ENTITYCONTAINER NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERTYREF NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENTITYTYPE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENTITYSET NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERTY NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EDMX VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAMESPACE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "METADATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NULLABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LENGTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCHEMA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FALSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRUE"
    CaseSensitive: false
