    AsciiString: "SLIDERSET.BMPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUTTONSET.BMPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WINDOWSET.BMPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THUMBNAIL.BMPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHARSET.INIPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SKINKID.INIPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BODY.BMPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAP.BMPPK"
    CaseSensitive: false
