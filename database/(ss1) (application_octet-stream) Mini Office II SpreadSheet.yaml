Name: Mini Office II SpreadSheet
Description: Old office suite for Amstrad CPC.
URL: "http://www.cpcwiki.eu/index.php/Mini_Office_II"
FileNameExtensions: ["ss1"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "SS"
    CaseSensitive: true
