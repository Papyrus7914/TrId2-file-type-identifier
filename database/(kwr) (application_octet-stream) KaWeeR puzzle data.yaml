Name: KaWeeR puzzle data
Description: Crossword puzzle editor for Atari ST, by Volker Hemsen.
FileNameExtensions: ["kwr"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "#KaWeeR-Daten, Version "
    CaseSensitive: true
  - Pos: 24
    AsciiString: "."
    CaseSensitive: true
