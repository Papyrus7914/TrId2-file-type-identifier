Name: Microsoft Flight Simulator 3D model (generic)
URL: "http://en.wikipedia.org/wiki/Microsoft_Flight_Simulator"
FileNameExtensions: ["mdl"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "RIFF"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "MDL"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "MDLH"
    CaseSensitive: true
