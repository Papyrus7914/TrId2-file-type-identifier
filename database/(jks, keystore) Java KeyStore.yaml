Name: Java KeyStore
Description: A Java KeyStore (JKS) is a repository of security certificates, either Authorization certificates or Public key certificates.
URL: "http://en.wikipedia.org/wiki/Keystore"
FileNameExtensions: ["jks", "keystore"]
DetectionPatterns:
  - Pos: 0
    Bytes: [0xFE, 0xED, 0xFE, 0xED]
