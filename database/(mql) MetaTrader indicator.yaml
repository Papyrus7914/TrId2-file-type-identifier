Name: MetaTrader indicator
URL: "http://www.metaquotes.net/"
FileNameExtensions: ["mql"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "/*[[\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "AUTHOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYMBOL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BARS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THEN"
    CaseSensitive: false
