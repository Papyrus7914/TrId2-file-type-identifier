Name: ADMesh processed STereoLithography (binary)
URL: "https://admesh.readthedocs.io/"
FileNameExtensions: ["stl"]
MimeType: model/x.stl-binary
DetectionPatterns:
  - Pos: 0
    AsciiString: "Processed by ADMesh version "
    CaseSensitive: true
  - Pos: 29
    AsciiString: "."
    CaseSensitive: true
