Name: E-Mail message (Var. 5)
URL: "http://fileformats.archiveteam.org/wiki/Internet_e-mail_message_format"
FileNameExtensions: ["eml"]
MimeType: message/rfc822
DetectionPatterns:
  - Pos: 0
    AsciiString: "Received: "
    CaseSensitive: true
  - Pos: any
    AsciiString: "RECEIVED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FROM"
    CaseSensitive: false
