Name: TAR - Tape ARchive (hard link)
Description: Variant at offset 156 '1' indicates hard link as 1st member.
URL: "https://en.wikipedia.org/wiki/Tar_(computing)"
FileNameExtensions: ["tar"]
MimeType: application/x-tar
DetectionPatterns:
  - Pos: 156
    AsciiString: "1"
    CaseSensitive: true
  - Pos: 500
    AsciiString: "\0\0\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 511
    AsciiString: "\0"
    CaseSensitive: true
