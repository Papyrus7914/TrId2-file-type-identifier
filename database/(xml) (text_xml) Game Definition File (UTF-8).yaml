Name: Game Definition File (UTF-8)
URL: "https://msdn.microsoft.com/en-us/library/windows/desktop/ee417681(v=vs.85).aspx"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xEF\xBB\xBF<?xml version=\"1.0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GAMESEXPLORERBASETYPES.V1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GAMEDEFINITION GAMEID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCHEMAS-MICROSOFT-COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GAMEDEFINITIONFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GAMEDESCRIPTION.V1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENDED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
