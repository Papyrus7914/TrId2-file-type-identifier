    CaseSensitive: true
  - Pos: any
    AsciiString: "SYSTEMPROPERTIES DEFAULTMACHINEFOLDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULTHARDDISKFORMAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WEBSERVICEAUTHLIBRARY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTRADATAITEM NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MACHINEENTRY UUID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USBDEVICEFILTERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIRTUALBOX XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOGHISTORYCOUNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MACHINEREGISTRY"
    CaseSensitive: false
  - Pos: any
