Name: Parasolid model (Text)
URL: "https://en.wikipedia.org/wiki/Parasolid"
FileNameExtensions: ["x_t", "sch_txt", "xmt_txt"]
MimeType: model/vnd.parasolid.transmit.text
DetectionPatterns:
