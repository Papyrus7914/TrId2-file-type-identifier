Name: uv Python tool interpreter cache (MessagePack)
URL: "https://docs.astral.sh/uv/"
FileNameExtensions: ["msgpack"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x92, 0x92, 0xCE]
  - Pos: any
    AsciiString: "PLATFORM_PYTHON_IMPLEMENTATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMPLEMENTATION_VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMPLEMENTATION_NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PYTHON_FULL_VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLATFORM_MACHINE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLATFORM_RELEASE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLATFORM_VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLATFORM_SYSTEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PYTHON_VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SITE-PACKAGES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYS_PLATFORM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CPYTHON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INCLUDE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OS_NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PYTHON."
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCRIPTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".EXE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".ZIP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DLLS"
    CaseSensitive: false
