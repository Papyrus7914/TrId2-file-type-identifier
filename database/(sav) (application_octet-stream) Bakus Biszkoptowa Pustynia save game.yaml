Name: Bakus Biszkoptowa Pustynia save game
URL: "https://bakus.fandom.com/pl/wiki/Biszkoptowa_Pustynia"
FileNameExtensions: ["sav"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SAVEHEADER\0\0"
    CaseSensitive: true
  - Pos: 116
    AsciiString: "data\\levels\\"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".LEV"
    CaseSensitive: false
