Name: Assassins Creed Syndicate save game
URL: "https://en.wikipedia.org/wiki/Assassin%27s_Creed"
FileNameExtensions: ["sav"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "CDX\0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "ACSyndicate["
    CaseSensitive: true
  - Pos: any
    AsciiString: "-TM_"
    CaseSensitive: false
