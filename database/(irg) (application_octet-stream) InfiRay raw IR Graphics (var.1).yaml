Name: InfiRay raw IR Graphics (var.1)
Description: Produced by InfiRay thermal cameras.
FileNameExtensions: ["irg"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xCA, 0xAC]
  - Pos: 126
    Bytes: [0xAC, 0xCA]
  - Pos: any
    AsciiString: "$3BR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JFIF"
    CaseSensitive: false
