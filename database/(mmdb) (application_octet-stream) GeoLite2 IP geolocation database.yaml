Name: GeoLite2 IP geolocation database
URL: "https://dev.maxmind.com/geoip/geolite2-free-geolocation-data/"
FileNameExtensions: ["mmdb"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0\x01"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 24
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 31
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 36
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 42
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 49
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BINARY_FORMAT_MAJOR_VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BINARY_FORMAT_MINOR_VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MDATABASE_TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KDESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JIP_VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JNODE_COUNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAXMIND.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RECORD_SIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LANGUAGES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LITE"
    CaseSensitive: false
