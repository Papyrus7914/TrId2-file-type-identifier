Name: Akzent IV document (v4.5x)
Description: German shareware word processor by Harald Czech and Axel Peter Winkler.
FileNameExtensions: ["akz"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: " AKZENT\r\n"
    CaseSensitive: true
  - Pos: 21
    AsciiString: "\bV 4.5"
    CaseSensitive: true
