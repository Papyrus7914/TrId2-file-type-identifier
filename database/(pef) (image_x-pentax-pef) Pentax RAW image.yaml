Name: Pentax RAW image
URL: "http://fileformats.archiveteam.org/wiki/Pentax_PEF"
FileNameExtensions: ["pef"]
MimeType: image/x-pentax-pef
DetectionPatterns:
  - Pos: 1
    AsciiString: "M\0*\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "AOC\0MM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PENTAX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VER 1."
    CaseSensitive: false
  - Pos: any
    AsciiString: "$3BR"
    CaseSensitive: false
