Name: Fluent mesh
URL: "http://www.fluent.com/software/fluent/index.htm"
FileNameExtensions: ["msh"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "("
    CaseSensitive: true
  - Pos: 2
    AsciiString: " \""
    CaseSensitive: true
  - Pos: any
    AsciiString: "INTERIOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FLUID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FACES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WALL"
    CaseSensitive: false
