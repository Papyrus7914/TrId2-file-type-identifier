FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<!-- level environment description file (c) Bitfield GmbH -->"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ENVIRONMENT.X"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODEL NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LIGHT DIR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LIGHTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHADOW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR"
    CaseSensitive: false
