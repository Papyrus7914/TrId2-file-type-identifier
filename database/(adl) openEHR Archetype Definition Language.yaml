    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_LANGUAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ARCHETYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ONTOLOGY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONCEPT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AT0000"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ITEMS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DRAFT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
