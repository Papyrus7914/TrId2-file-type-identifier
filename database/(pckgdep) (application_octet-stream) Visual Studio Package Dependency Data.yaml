Name: Visual Studio Package Dependency Data
URL: "https://en.wikipedia.org/wiki/Visual_Studio"
FileNameExtensions: ["pckgdep"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "ARI8\0\0\0\0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "\0\0\0\0TOC8"
    CaseSensitive: true
  - Pos: any
    AsciiString: "_\0N\0E\0U\0T\0R\0A\0L\0_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "A\0P\0P"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEPG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JHN8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOC8"
    CaseSensitive: false
