Name: Sound Chip Synth parameters
URL: "https://www.exxosforum.co.uk/atari/mirror/COW/Cow-net%20%20Sound%20Chip%20Synth.htm"
FileNameExtensions: ["syn"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "schs"
    CaseSensitive: true
  - Pos: 10
    AsciiString: "data"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
