Name: Mac shared library (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://www.macdisk.com/macsigen.php"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "shlb"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SHLB"
    CaseSensitive: false
