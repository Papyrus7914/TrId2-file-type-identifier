Name: Free42 Layout / skin
URL: "https://thomasokken.com/free42"
FileNameExtensions: ["layout"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "# "
    CaseSensitive: true
  - Pos: any
    AsciiString: "ANNUNCIATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISPLAY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FREE42"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SKIN"
    CaseSensitive: false
