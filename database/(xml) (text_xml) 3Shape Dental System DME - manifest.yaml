Name: 3Shape Dental System DME - manifest
Description: Contained in a DME package.
URL: "https://www.3shape.com/"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\"?>\r\n<DentalContainer version=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "DENTALCONTAINER VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OBJECT NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LIST NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERTY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ITEMS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
