Name: QuickLink II Fax bitmap (new)
Description: Fax program by Smith Micro Software.
FileNameExtensions: ["qfx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "II*\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "QL2FAXW"
    CaseSensitive: true
  - Pos: any
    AsciiString: "QL2FAXW"
    CaseSensitive: false
