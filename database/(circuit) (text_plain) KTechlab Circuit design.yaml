Name: KTechlab Circuit design
URL: "https://userbase.kde.org/KTechlab"
FileNameExtensions: ["circuit"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "<!DOCTYPE KTechlab>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "START-NODE-IS-CHILD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "END-NODE-IS-CHILD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "START-NODE-PARENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCTYPE KTECHLAB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "END-NODE-PARENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "START-NODE-CID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCUMENT TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "END-NODE-CID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MANUAL-ROUTE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONNECTOR__"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CIRCUIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ITEM X"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUMBER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ANGLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FLIP"
    CaseSensitive: false
