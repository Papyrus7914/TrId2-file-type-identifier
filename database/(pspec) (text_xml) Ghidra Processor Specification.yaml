Name: Ghidra Processor Specification
URL: "https://en.wikipedia.org/wiki/Ghidra"
FileNameExtensions: ["pspec"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PROGRAMCOUNTER REGISTER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROCESSOR_SPEC"
    CaseSensitive: false
