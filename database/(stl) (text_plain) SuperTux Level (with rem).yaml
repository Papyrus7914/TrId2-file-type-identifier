Name: SuperTux Level (with rem)
URL: "https://en.wikipedia.org/wiki/SuperTux"
FileNameExtensions: ["stl"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: ";"
    CaseSensitive: true
  - Pos: any
    AsciiString: "(SUPERTUX-LEVEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(AUTHOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(NAME"
    CaseSensitive: false
