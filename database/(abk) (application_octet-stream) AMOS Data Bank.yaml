Name: AMOS Data Bank
Description: Used for holding any kind of data.
URL: "http://en.wikipedia.org/wiki/AMOS_(programming_language)"
FileNameExtensions: ["abk"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "AmBk"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "Datas"
    CaseSensitive: true
