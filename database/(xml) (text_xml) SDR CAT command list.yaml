Name: SDR CAT command list
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"utf-8\" ?>\r\n<catstructs>\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CATSTRUCT CODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CATSTRUCTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NANSPARMS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NGETPARMS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NSETPARMS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ACTIVE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STEREO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESC"
    CaseSensitive: false
