Name: Xilinx ISE Messages
URL: "https://en.wikipedia.org/wiki/Xilinx_ISE"
FileNameExtensions: ["xmsgs"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BEHAVIOR OR DATA CORRUPTION.  IT IS STRONGLY ADVISED THAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHANGES MADE TO THIS FILE MAY RESULT IN UNPREDICTABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BY THE XILINX ISE SOFTWARE.  ANY DIRECT EDITING OR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THIS IS AN INTERNAL FILE THAT HAS BEEN GENERATED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USERS DO NOT EDIT THE CONTENTS OF THIS FILE."
    CaseSensitive: false
  - Pos: any
    AsciiString: "-- IMPORTANT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MESSAGES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MSG TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ARG FMT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INDEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
