Name: Mac QuickTime video (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/QuickTime"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "MooV"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MOOV"
    CaseSensitive: false
