Name: Minecraft resources Package
URL: "https://en.wikipedia.org/wiki/Minecraft"
FileNameExtensions: ["mcpack"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "MANIFEST.JSON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PACK_ICON.PNG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IDATX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IHDR"
    CaseSensitive: false
