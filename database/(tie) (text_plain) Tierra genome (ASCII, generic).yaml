Name: Tierra genome (ASCII, generic)
URL: "https://en.wikipedia.org/wiki/Tierra_(computer_simulation)"
FileNameExtensions: ["tie"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "\nformat: "
    CaseSensitive: true
  - Pos: 10
    AsciiString: "  bits:"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PARENT GENOTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRACK 0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BITS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROT"
    CaseSensitive: false
