Name: PKZIP mini-self-extracting 16bit DOS executable (variant)
URL: "https://en.wikipedia.org/wiki/PKZIP"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 24
    AsciiString: "\x1E\0\0\0"
    CaseSensitive: true
  - Pos: 29
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 31
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PKWARE INC. ALL RIGHTS RESERVED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTRACT UTILITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ERROR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PKSFX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PKZIP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "1989"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FAST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OVER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SELF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TING"
    CaseSensitive: false
