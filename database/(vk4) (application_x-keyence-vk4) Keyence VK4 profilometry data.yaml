Name: Keyence VK4 profilometry data
URL: "https://github.com/christian-sahlmann/gwyddion/blob/master/modules/file/keyence.c"
FileNameExtensions: ["vk4"]
MimeType: application/x-keyence-vk4
DetectionPatterns:
  - Pos: 0
    AsciiString: "VK4_"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "\0\0\0\0"
    CaseSensitive: true
