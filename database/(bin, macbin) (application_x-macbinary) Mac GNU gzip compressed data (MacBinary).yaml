Name: Mac GNU gzip compressed data (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/Gzip"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "Gzip"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GZIP"
    CaseSensitive: false
