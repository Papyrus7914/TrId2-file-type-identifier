Name: Gesture and Motion Signal format
URL: "http://gms.acroe-ica.org/docs/GMS_SPEC_V01.pdf"
FileNameExtensions: ["gms"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "GMS VERS"
    CaseSensitive: true
  - Pos: 23
    AsciiString: "SCEN"
    CaseSensitive: true
