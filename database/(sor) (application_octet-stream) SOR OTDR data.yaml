Name: SOR OTDR data
URL: "http://en.wikipedia.org/wiki/Otdr"
FileNameExtensions: ["sor"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "d\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "GenParams\0"
    CaseSensitive: true
  - Pos: 24
    AsciiString: "SupParams\0"
    CaseSensitive: true
  - Pos: 40
    AsciiString: "FxdParams\0"
    CaseSensitive: true
