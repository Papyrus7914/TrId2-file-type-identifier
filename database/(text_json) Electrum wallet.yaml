Name: Electrum wallet
Description: Electrum is a Bitcoin Wallet.
URL: "https://electrum.org"
MimeType: text/json
DetectionPatterns:
  - Pos: 0
    AsciiString: "{"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ADDR_HISTORY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ACCOUNTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MASTER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_KEY"
    CaseSensitive: false
