Name: Mac PageMill's GIF bitmap (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/Adobe_PageMill"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "GIFf"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GIFF"
    CaseSensitive: false
