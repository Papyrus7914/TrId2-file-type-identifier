Name: Unity Prefab
URL: "https://docs.unity3d.com/Manual/Prefabs.html"
FileNameExtensions: ["prefab"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "%YAML 1.1"
    CaseSensitive: true
  - Pos: any
    AsciiString: "M_OBJECTHIDEFLAGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SERIALIZEDVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "M_LOCALPOSITION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "M_LOCALROTATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "M_LOCALSCALE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "M_ROOTORDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNITY3D.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "M_PREFABIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%YAML 1.1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPONENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRANSFORM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EOBJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "{FILEID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "M_NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "00000"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%TAG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "2011"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GUID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
