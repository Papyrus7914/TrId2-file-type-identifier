Name: GeoWorks Writer document
URL: "https://en.wikipedia.org/wiki/GEOS_(16-bit_operating_system)"
FileNameExtensions: ["000"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xC7E\xCFS\x01\0\0\0"
    CaseSensitive: true
  - Pos: 20
    AsciiString: "WDAT\0\0WP00"
    CaseSensitive: true
  - Pos: any
    AsciiString: "WDAT\0\0WP00"
    CaseSensitive: false
