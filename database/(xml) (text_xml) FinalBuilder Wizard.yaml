    CaseSensitive: false
  - Pos: any
    AsciiString: "WIZARDPAGES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGENUMBER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PREVBUTTON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGETITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FBWIZARD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGEHTML"
    CaseSensitive: false
  - Pos: any
