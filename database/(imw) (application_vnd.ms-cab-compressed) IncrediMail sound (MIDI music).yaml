Name: IncrediMail sound (MIDI music)
URL: "http://www.incredimail.com"
FileNameExtensions: ["imw"]
MimeType: application/vnd.ms-cab-compressed
DetectionPatterns:
  - Pos: 0
    AsciiString: "MSCF\0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CONTENT.INI"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".MID"
    CaseSensitive: false
