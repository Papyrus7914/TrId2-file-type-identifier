Name: High Speed Pascal compiled Unit
FileNameExtensions: ["unit"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "UNI2"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SYSTEM2"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXEC"
    CaseSensitive: false
