Name: OpenStreetMap O5c data
URL: "https://wiki.openstreetmap.org/wiki/O5m#.o5c_as_OSM_Change_Format"
FileNameExtensions: ["o5c"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #                          o     5     c     2
    Bytes: [0xFF, 0xE0, 0x04, 0x6F, 0x35, 0x63, 0x32, 0xDB, 0x12]
