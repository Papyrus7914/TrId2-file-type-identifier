Name: Palm ThoughtManager
Description: ThoughtManager is a versatile and easy to use list manager and information organizer for Palm operating systems.
URL: "http://www.handshigh.com/html/thoughtmanager.html"
FileNameExtensions: ["pdb"]
DetectionPatterns:
  - Pos: 56
    AsciiString: "\0\0\0\0OutlTFst"
    CaseSensitive: true
  - Pos: any
    AsciiString: "OUTLTFST"
    CaseSensitive: false
