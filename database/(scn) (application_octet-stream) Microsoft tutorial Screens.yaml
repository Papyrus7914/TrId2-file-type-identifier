Name: Microsoft tutorial Screens
Description: Used in various MS-DOS apps/tools like Word, VBDOS.
FileNameExtensions: ["scn"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x8D, 0x90]
  - Pos: 5
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "\0\f\0"
    CaseSensitive: true
  - Pos: 13
    AsciiString: "\0"
    CaseSensitive: true
