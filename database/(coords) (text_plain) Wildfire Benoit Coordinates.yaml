Name: Wildfire Benoit Coordinates
URL: "http://www.wk-artworks.de/"
FileNameExtensions: ["coords"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "#Benoit\nVersion:      1\nFractal type: "
    CaseSensitive: true
  - Pos: any
    AsciiString: "COLOR REPEAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FRACTAL TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EVEN COLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ODD COLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXPONENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAX ITER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMULA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "X SEED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "Y SEED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STYLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "X MAX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "X MIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "Y MAX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "Y MIN"
    CaseSensitive: false
