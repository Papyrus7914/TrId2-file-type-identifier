Name: Kig document
URL: "https://en.wikipedia.org/wiki/Kig_(software)"
FileNameExtensions: ["kig"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "<!DOCTYPE KigDocument>\n<KigDocument "
    CaseSensitive: true
  - Pos: any
    AsciiString: "PARENT ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OBJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FIXED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHOWN"
    CaseSensitive: false
