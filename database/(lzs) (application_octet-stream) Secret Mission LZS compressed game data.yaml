Name: Secret Mission LZS compressed game data
URL: "https://www.mobygames.com/game/22008/secret-mission/"
FileNameExtensions: ["lzs"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "LZSS\x80\x01\x18\x01CMAP"
    CaseSensitive: true
  - Pos: 780
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FORM"
    CaseSensitive: false
