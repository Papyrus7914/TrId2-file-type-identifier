Name: 16bit DOS Exe2Com Command
URL: "http://fileformats.archiveteam.org/wiki/ExeToCom_file_converter"
FileNameExtensions: ["com"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xE9]
  - Pos: 3
    AsciiString: "___Converted MZ"
    CaseSensitive: true
  - Pos: any
    AsciiString: "___CONVERTED MZ"
    CaseSensitive: false
