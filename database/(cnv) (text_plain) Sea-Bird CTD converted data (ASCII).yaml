Name: Sea-Bird CTD converted data (ASCII)
URL: "https://www.seabird.com/software"
FileNameExtensions: ["cnv"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "* "
    CaseSensitive: true
  - Pos: any
    AsciiString: "CONDUCTIVITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEMPERATURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BAD_FLAG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRESSURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VOLTAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME 0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME 1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME 2"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME 3"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME 4"
    CaseSensitive: false
  - Pos: any
    AsciiString: "*END*"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEG C"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEPTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "* ST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
