Name: Java Enterprise Archive
URL: "http://en.wikipedia.org/wiki/EAR_(file_format)"
FileNameExtensions: ["ear"]
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "MANIFEST.MFPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "META-INF"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".JARPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LK-."
    CaseSensitive: false
