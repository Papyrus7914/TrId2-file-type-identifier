Name: JBIG raster bitmap
URL: "http://fileformats.archiveteam.org/wiki/JBIG"
FileNameExtensions: ["jbg", "jbig", "bie"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 3
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 17
    Bytes: [0x00, 0x03, 0x1C]
