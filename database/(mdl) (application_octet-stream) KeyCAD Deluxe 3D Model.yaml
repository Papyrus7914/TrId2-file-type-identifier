Name: KeyCAD Deluxe 3D Model
URL: "http://fileformats.archiveteam.org/wiki/KeyCAD"
FileNameExtensions: ["mdl"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Computer Easy 3D Design Plus\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".FNT"
    CaseSensitive: false
