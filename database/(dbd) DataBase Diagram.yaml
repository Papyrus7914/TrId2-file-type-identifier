Name: DataBase Diagram
FileNameExtensions: ["dbd"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<XMLDiagram>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TDBADIAGRAMCONTROLLER LOCKED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TDIAGRAMMETATABLEPROPERTIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TDBADIAGRAMOBJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERTIESCLASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GEOMETRY LEFT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SURFACE ZOOM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OBJECTNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLDIAGRAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ELEMENTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCROLLX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCROLLY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GLYPH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIDTH"
    CaseSensitive: false
