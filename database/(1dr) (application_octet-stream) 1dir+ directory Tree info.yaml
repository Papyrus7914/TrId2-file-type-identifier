Name: 1dir+ directory Tree info
URL: "https://www.gerritspeek.nl/computer/pc_mp_filemanagers.html#1dir"
FileNameExtensions: ["1dr"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "1dir+ Tree "
    CaseSensitive: true
  - Pos: 12
    AsciiString: "."
    CaseSensitive: true
  - Pos: 14
    Bytes: [0x1A]
