Name: Central Point PC Backup Directory data
URL: "https://en.wikipedia.org/wiki/Central_Point_Software"
FileNameExtensions: ["dir"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PCBx"
    CaseSensitive: true
  - Pos: 54
    AsciiString: "DCP"
    CaseSensitive: true
