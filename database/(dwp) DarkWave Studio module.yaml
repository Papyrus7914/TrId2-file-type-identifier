Name: DarkWave Studio module
URL: "http://www.experimentalscene.com/software/darkwave-studio/"
FileNameExtensions: ["dwp"]
DetectionPatterns:
  - Pos: 0
    AsciiString: " PWD"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PATTERN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DARKPLUG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MASTER"
    CaseSensitive: false
