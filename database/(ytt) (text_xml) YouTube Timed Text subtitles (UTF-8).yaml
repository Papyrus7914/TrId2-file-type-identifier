Name: YouTube Timed Text subtitles (UTF-8)
URL: "https://github.com/arcusmaximus/YTSubConverter/blob/master/ytt.ytt"
FileNameExtensions: ["ytt"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xEF\xBB\xBF<?xml version=\"1.0\" encoding=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "TIMEDTEXT FORMAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BODY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEAD"
    CaseSensitive: false
