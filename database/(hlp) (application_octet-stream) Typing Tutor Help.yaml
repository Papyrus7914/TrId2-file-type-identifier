Name: Typing Tutor Help
Description: DOS keyboard tutorial by Kriya Systems.
FileNameExtensions: ["hlp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Welcome to the Typing Tutor "
    CaseSensitive: true
  - Pos: any
    AsciiString: "HELP - DISPLAYS THIS SCREEN."
    CaseSensitive: false
  - Pos: any
    AsciiString: "KEYBOARD INSTRUCTION PROGRAM"
    CaseSensitive: false
