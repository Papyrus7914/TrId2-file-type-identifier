    AsciiString: "WAIT FOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TIMEOUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ACTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMEN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DELETE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUE1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "START"
    CaseSensitive: false
