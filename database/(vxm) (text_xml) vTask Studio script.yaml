    AsciiString: "OUTPUT VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VARIABLE"
    CaseSensitive: false
