Name: PolyPlot Text Definition
URL: "http://web.archive.org/web/20170626004204/http://polyplot.de/"
FileNameExtensions: ["txd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 1
    AsciiString: "\0 \b\b\bPolyplot Textdefintionsdatei\x1A"
    CaseSensitive: true
  - Pos: any
    AsciiString: "POLYPLOT TEXTDEFINTIONSDATEI"
    CaseSensitive: false
