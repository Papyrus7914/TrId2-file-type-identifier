Name: Vector Quantized Animation video
URL: "https://wiki.multimedia.cx/index.php/VQA"
FileNameExtensions: ["vqa"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "WVQA"
    CaseSensitive: true
  - Pos: any
    AsciiString: "WVQA"
    CaseSensitive: false
