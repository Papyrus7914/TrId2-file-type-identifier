Name: JavaCPC Snapshot
URL: "http://www.cpcwiki.eu/index.php/JavaCPC"
FileNameExtensions: ["sna"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MV - SNA\0\0\0\0\0\0\0\0\x01"
    CaseSensitive: true
  - Pos: any
    AsciiString: "JAVACPC SNAPSHOT"
    CaseSensitive: false
