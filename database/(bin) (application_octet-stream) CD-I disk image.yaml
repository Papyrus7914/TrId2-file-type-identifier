Name: CD-I disk image
URL: "https://en.wikipedia.org/wiki/Philips_CD-i"
FileNameExtensions: ["bin"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x00, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0x00]
  - Pos: 14
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 18
    AsciiString: " "
    CaseSensitive: true
