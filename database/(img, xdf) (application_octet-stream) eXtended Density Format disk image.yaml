Name: eXtended Density Format disk image
URL: "https://en.wikipedia.org/wiki/IBM_Extended_Density_Format"
FileNameExtensions: ["img", "xdf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #              O
    Bytes: [0xEB, 0x4F, 0x90]
  - Pos: 128
    AsciiString: "XDF v"
    CaseSensitive: true
  - Pos: 134
    AsciiString: "."
    CaseSensitive: true
  - Pos: 137
    AsciiString: " (c) 1993, "
    CaseSensitive: true
  - Pos: 152
    AsciiString: " -- Backup Technologies, Inc., Tampa FL\n Patent(s) Pending -- Inventor: Roger D. Ivey\nAll rights reserved worldwide\nDuplication prohibited without permission\n"
    CaseSensitive: true
  - Pos: 388
    AsciiString: "Bootable XDF Data Disk\r\nInsert system disk and press any key\r\n\0"
    CaseSensitive: true
