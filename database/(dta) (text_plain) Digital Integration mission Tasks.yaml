Name: Digital Integration mission Tasks
Description: Used in various simulation games by DI.
FileNameExtensions: ["dta"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: ":Task"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GAMEPLAY EXTRA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GAMEPLAY LASER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GAMEPLAY RECON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GAMEPLAY SIDES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GAMEPLAY KEEP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DRONE TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TASK TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USER TASK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WAYPOINT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SUCCESS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WEAPON"
    CaseSensitive: false
