Name: AWL programming language (Var. 2)
Description: Used for PLC programming.
FileNameExtensions: ["awl"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "DATA_BLOCK DB "
    CaseSensitive: true
  - Pos: any
    AsciiString: "END_ORGANIZATION_BLOCK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NETWORK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BEGIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
