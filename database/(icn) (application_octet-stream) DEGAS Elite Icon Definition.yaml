Name: DEGAS Elite Icon Definition
Description: Used on Atari ST.
URL: "http://fileformats.archiveteam.org/wiki/DEGAS_Elite_icon"
FileNameExtensions: ["icn"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "/*"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DEGAS ELITE ICON DEFINITION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFINE ICONSIZE 0X"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFINE ICON_H 0X"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFINE ICON_W 0X"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INT IMAGE"
    CaseSensitive: false
