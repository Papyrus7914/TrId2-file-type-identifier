Name: DiskDupe Disk Image (newer/generic)
URL: "http://fileformats.archiveteam.org/wiki/DDI"
FileNameExtensions: ["ddi"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "IM\0"
    CaseSensitive: true
  - Pos: 4
    AsciiString: "\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 11
    AsciiString: "\0\0\0\0\0\0\0\0\0"
    CaseSensitive: true
