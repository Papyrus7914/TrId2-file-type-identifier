Name: GeoWorks GeoWrite document
URL: "https://en.wikipedia.org/wiki/GEOS_(16-bit_operating_system)#PC.2FGEOS"
FileNameExtensions: ["000"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #              E           S
    Bytes: [0xC7, 0x45, 0xC1, 0x53]
  - Pos: 56
    AsciiString: "WDAT\0\0WP00"
    CaseSensitive: true
