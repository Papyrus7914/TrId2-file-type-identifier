Name: HackRF firmware
URL: "https://greatscottgadgets.com/hackrf/"
FileNameExtensions: ["bin"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xE0]
  - Pos: 2
    #        \b
    Bytes: [0x08, 0x10]
  - Pos: 1024
    AsciiString: "HACKRFFW"
    CaseSensitive: true
  - Pos: any
    AsciiString: "G\0R\0E\0A\0T\0 \0S\0C\0O\0T\0T\0 \0G\0A\0D\0G\0E\0T\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "T\0R\0A\0N\0S\0C\0E\0I\0V\0E\0R"
    CaseSensitive: false
  - Pos: any
    AsciiString: "M\0S\0F\0T\01\00\00"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HACKRFFW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WINUSB"
    CaseSensitive: false
