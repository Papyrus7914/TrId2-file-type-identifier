Name: EaseUS Data Recovery Wizard scan result / recovery session
URL: "https://www.easeus.com/data-recovery-software/"
FileNameExtensions: ["rsf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #                                      C           J                 $     J     3
    Bytes: [0xEA, 0xF4, 0xB3, 0x1B, 0x05, 0x43, 0xB6, 0x4A, 0xB4, 0xB8, 0x24, 0x4A, 0x33, 0xD9, 0x13, 0xBB]
