Name: Adobe Motion Graphics Template
FileNameExtensions: ["mogrt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "PROJECT.AEGRAPHICPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFINITION.JSONPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THUMB.PNGPK"
    CaseSensitive: false
