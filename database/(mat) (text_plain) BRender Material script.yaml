Name: BRender Material script
URL: "https://en.wikipedia.org/wiki/Argonaut_Games#BRender"
FileNameExtensions: ["mat"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "material = ["
    CaseSensitive: true
  - Pos: any
    AsciiString: "IDENTIFIER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AMBIENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIFFUSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOUR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FLAGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POWER"
    CaseSensitive: false
