Name: WinHex Position Data
URL: "http://www.x-ways.net/winhex/POS_Format.html"
FileNameExtensions: ["pos"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "WinHex Pos v"
    CaseSensitive: true
  - Pos: 13
    AsciiString: "."
    CaseSensitive: true
  - Pos: 15
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "WINHEX POS V"
    CaseSensitive: false
