Name: GFA-BASIC Atari tokenized source (generic)
URL: "http://en.wikipedia.org/wiki/GFA_BASIC"
FileNameExtensions: ["gfa", "bas"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 2
    AsciiString: "G"
    CaseSensitive: true
  - Pos: 4
    AsciiString: "A"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BASIC"
    CaseSensitive: false
