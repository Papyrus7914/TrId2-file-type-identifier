Name: Brother P-touch Editor Label
URL: "http://fileformats.archiveteam.org/wiki/P-touch_Editor_Label"
FileNameExtensions: ["lbx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "LABEL.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROP.XML"
    CaseSensitive: false
