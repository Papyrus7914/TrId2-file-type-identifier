Name: 16bit DOS COM EPW password protected (v1.3)
Description: Password encryption utility for executable files by Farpoint Software.
FileNameExtensions: ["com"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xE9]
  - Pos: 36
    AsciiString: "Decryptor - (c) 1988, Farpoint Software     "
    CaseSensitive: true
  - Pos: any
    AsciiString: "$PASSWORD IS NOT CORRECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENTER PASSWORD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VURQSP"
    CaseSensitive: false
