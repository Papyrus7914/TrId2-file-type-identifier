Name: Ghidra Function ID Dataset (packed)
URL: "https://en.wikipedia.org/wiki/Ghidra"
FileNameExtensions: ["fidb"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xAC\xED\0\x05wD.0!&4\xE9, \0\0\0\x01\0\x14Function ID Database\0\x14Function ID Database\0"
    CaseSensitive: true
  - Pos: 74
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "FUNCTION ID DATABASE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FOLDER_ITEM"
    CaseSensitive: false
