  - Pos: any
    AsciiString: "CHASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DINFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENGIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUMCH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUMDR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUMEN"
    CaseSensitive: false
