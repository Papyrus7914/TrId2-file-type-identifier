Name: Allways Printer Fonts info
Description: A DTP quality add-in for Lotus 1-2-3.
URL: "https://en.wikipedia.org/wiki/Funk_Software"
FileNameExtensions: ["apf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PF\n\0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "\0\0\0\0(C) 1988 Funk Software, Inc.\0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "(C) 1988 FUNK SOFTWARE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INC."
    CaseSensitive: false
