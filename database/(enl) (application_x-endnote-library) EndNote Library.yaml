Name: EndNote Library
Description: More than just a reference manager. EndNote moves you through the research process as you search, organize, write, publish and share.
URL: "http://endnote.com/"
FileNameExtensions: ["enl"]
MimeType: application/x-endnote-library
DetectionPatterns:
