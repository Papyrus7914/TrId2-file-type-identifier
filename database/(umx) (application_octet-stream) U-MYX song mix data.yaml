    CaseSensitive: false
  - Pos: any
    AsciiString: "COPYRIGHTNOTICE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DARKBACKGROUND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.U-MYX.COM"
    CaseSensitive: false
