Name: U-MYX song mix data
URL: "https://en.wikipedia.org/wiki/U-MYX"
FileNameExtensions: ["umx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\x01gr\0\0\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "\0\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: ". ANY MIXES ENABLED BY THE USER FROM THE U-MYX APPLICATION MUST BE USED FOR THEIR OWN PERSONAL USE ONLY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AND EVERY FEASIBLE PERMUTATION ENABLED BY THE U-MYX FORMAT ARE OWNED EXCLUSIVELY BY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AND SHOULD NOT BE COMMERCIALLY EXPLOITED OR BROADCASTED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ALL COPYRIGHT AND OWNERSHIP FOR THIS RECORDING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MADE FOR SALE OR SHARED ONLINE."
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRACKLISTBACKGROUNDSTRETCH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BANDFRAMESHADOWTEXTCOLOR"
    CaseSensitive: false
  - Pos: any
