    AsciiString: "DUPLICATED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BANDIMAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MICROSITE"
    CaseSensitive: false
  - Pos: any
