Name: Electronic Arts Font (generic)
URL: "https://wiki.xentax.com/index.php/EA_FFN_Font"
FileNameExtensions: ["ffn"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "F"
    CaseSensitive: true
  - Pos: 3
    AsciiString: "F"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FNTF"
    CaseSensitive: false
