Name: Mac textClipping
URL: "https://en.wikipedia.org/wiki/TextClipping"
FileNameExtensions: ["textclipping"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "bplist00"
    CaseSensitive: true
  - Pos: any
    AsciiString: "$COM.APPLE.TRADITIONAL-MAC-PLAIN-TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PUBLIC.UTF16-PLAIN-TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PUBLIC.UTF8-PLAIN-TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-PLAIN-TEXT_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XUTI-DATA"
    CaseSensitive: false
