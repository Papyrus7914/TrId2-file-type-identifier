Name: GEM RTS engine 3D mesh
URL: "https://bestway-1.gitbook.io/documentation"
FileNameExtensions: ["ply"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "EPLYBNDS"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".MTL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INDX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MESH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERT"
    CaseSensitive: false
