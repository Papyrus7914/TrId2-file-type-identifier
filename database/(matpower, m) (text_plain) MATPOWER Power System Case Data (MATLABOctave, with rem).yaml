Name: MATPOWER Power System Case Data (MATLAB/Octave, with rem)
URL: "https://matpower.org"
FileNameExtensions: ["matpower", "m"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "%"
    CaseSensitive: true
  - Pos: any
    AsciiString: "%% GENERATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FUNCTION MPC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%% BUS DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MPC.BASEMVA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MPC.VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MPC.BUS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MPC.GEN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BRANCH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ANGLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUS_I"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RATIO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AREA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CASE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VMAX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VMIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ZONE"
    CaseSensitive: false
