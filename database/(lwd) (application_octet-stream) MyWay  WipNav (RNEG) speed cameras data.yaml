Name: MyWay / WipNav (RNEG) speed cameras data
Description: Navigation software used in PSA group cars.
FileNameExtensions: ["lwd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "LWDB\0Ver 1.0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "XYDATACONTAINER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPEEDLIMIT"
    CaseSensitive: false
