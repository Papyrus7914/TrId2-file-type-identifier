Name: CA Visual Objects Application Export File (v1.x)
URL: "https://en.wikipedia.org/wiki/Visual_Objects"
FileNameExtensions: ["aef"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x01\0 \0\0\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "CA-VO Application Export File"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CA-VO APPLICATION EXPORT FILE"
    CaseSensitive: false
