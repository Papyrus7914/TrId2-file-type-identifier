Name: HEIF bitmap (hevx)
URL: "https://en.wikipedia.org/wiki/High_Efficiency_Image_File_Format"
FileNameExtensions: ["heic"]
MimeType: image/heic-sequence
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 4
    AsciiString: "ftyphevx\0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FTYPHEVX"
    CaseSensitive: false
