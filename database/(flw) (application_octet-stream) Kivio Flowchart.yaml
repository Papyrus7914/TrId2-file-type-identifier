Name: Kivio Flowchart
URL: "https://en.wikipedia.org/wiki/Calligra_Flow"
FileNameExtensions: ["flw"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "mimetypeapplication/x-kivio"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOCUMENTINFO.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAINDOC.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PREVIEW.PNG"
    CaseSensitive: false
