Name: Hedgewars add-on Package (Script)
URL: "https://www.hedgewars.org/kb/HWPFormat"
FileNameExtensions: ["hwp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "Scripts/"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MULTIPLAYER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCRIPTS"
    CaseSensitive: false
