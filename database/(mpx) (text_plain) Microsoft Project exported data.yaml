Name: Microsoft Project exported data
URL: "http://en.wikipedia.org/wiki/Microsoft_Project"
FileNameExtensions: ["mpx"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "MPX"
    CaseSensitive: true
  - Pos: 4
    AsciiString: "Microsoft Project for Windows"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MICROSOFT PROJECT FOR WINDOWS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ANSI"
    CaseSensitive: false
