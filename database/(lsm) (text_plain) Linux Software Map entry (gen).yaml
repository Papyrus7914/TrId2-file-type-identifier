Name: Linux Software Map entry (gen)
URL: "https://en.wikipedia.org/wiki/Linux_Software_Map"
FileNameExtensions: ["lsm"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "Begin"
    CaseSensitive: true
  - Pos: any
    AsciiString: "KEYWORDS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POLICY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COPY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESC"
    CaseSensitive: false
