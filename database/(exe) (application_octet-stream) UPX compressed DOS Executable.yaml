Name: UPX compressed DOS Executable
URL: "https://en.wikipedia.org/wiki/UPX"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0\x01\0\x02\0"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 18
    AsciiString: "\0\0\0\0\0\0\x1C\0\0\0"
    CaseSensitive: true
  - Pos: 29
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 32
    Bytes: [0xB9]
  - Pos: 35
    Bytes: [0xBE]
  - Pos: 38
    Bytes: [0x89, 0xF7, 0x1E, 0xA9, 0xB5, 0x80, 0x8C, 0xC8, 0x05, 0x05]
  - Pos: 49
    Bytes: [0x8E, 0xD8, 0x05]
  - Pos: 54
    #                                            .           l                 s
    Bytes: [0x8E, 0xC0, 0xFD, 0xF3, 0xA5, 0xFC, 0x2E, 0x80, 0x6C, 0x12, 0x10, 0x73, 0xE7, 0x92, 0xAF, 0xAD, 0x0E, 0x0E]
  - Pos: 85
    AsciiString: "UPX!"
    CaseSensitive: true
  - Pos: 90
    Bytes: [0x03, 0x03]
  - Pos: 110
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "UPX!"
    CaseSensitive: false
