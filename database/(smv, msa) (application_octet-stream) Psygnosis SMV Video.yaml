Name: Psygnosis SMV Video
Description: Used in WipeOut.
URL: "https://wiki.multimedia.cx/index.php/Psygnosis_SMV"
FileNameExtensions: ["smv", "msa"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "ST"
    CaseSensitive: true
  - Pos: 3
    AsciiString: "\0@\x01"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "\0"
    CaseSensitive: true
