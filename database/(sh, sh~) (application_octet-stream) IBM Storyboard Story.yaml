Name: IBM Storyboard Story
URL: "https://en.wikipedia.org/wiki/IBM_Storyboard_Plus"
FileNameExtensions: ["sh", "sh~"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x85, 0xAA]
  - Pos: 7
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "STORY LAST LINE"
    CaseSensitive: false
