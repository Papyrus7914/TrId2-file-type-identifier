Name: Lazarus Project Information
URL: "https://en.wikipedia.org/wiki/Lazarus_(IDE)"
FileNameExtensions: ["lpi"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "ISPARTOFPROJECT VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMATVERSION VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPILEROPTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILENAME VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECTOPTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PUBLISHOPTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RUNPARAMS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "S VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONFIG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNITS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOOL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRUE"
    CaseSensitive: false
