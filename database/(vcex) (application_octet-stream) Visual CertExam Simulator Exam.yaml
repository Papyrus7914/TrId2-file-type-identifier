    CaseSensitive: true
  - Pos: 44
    AsciiString: "-"
    CaseSensitive: true
  - Pos: 49
    AsciiString: "-"
    CaseSensitive: true
  - Pos: 54
    AsciiString: "-"
    CaseSensitive: true
  - Pos: 67
    AsciiString: "-"
    CaseSensitive: true
  - Pos: 100
