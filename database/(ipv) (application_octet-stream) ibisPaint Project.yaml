Name: ibisPaint Project
URL: "https://ibispaint.com/"
FileNameExtensions: ["ipv"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x01\0\x01\0\0\0\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "A"
    CaseSensitive: true
  - Pos: any
    AsciiString: "IBISPAINT X"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IDATX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IHDR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VER."
    CaseSensitive: false
