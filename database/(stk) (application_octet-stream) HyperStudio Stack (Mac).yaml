Name: HyperStudio Stack (Mac)
URL: "https://en.wikipedia.org/wiki/HyperStudio"
FileNameExtensions: ["stk"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0\x01\0\0\0"
    CaseSensitive: true
  - Pos: 80
    AsciiString: "\0\0StakHSTU\x01\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "HYPERSTUDIO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STAKHSTU"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".STK"
    CaseSensitive: false
