Name: PSM Engine Font
URL: "https://wiki.multimedia.cx/index.php/Engines/PSM"
FileNameExtensions: ["fnt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FONT"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 11
    AsciiString: "\0"
    CaseSensitive: true
