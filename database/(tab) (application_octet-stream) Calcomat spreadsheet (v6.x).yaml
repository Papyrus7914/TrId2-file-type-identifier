Name: Calcomat spreadsheet (v6.x)
Description: Atari ST spreadsheet by Micro Application.
FileNameExtensions: ["tab"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "JLS v6."
    CaseSensitive: true
  - Pos: 68
    AsciiString: "v6"
    CaseSensitive: true
  - Pos: 72
    AsciiString: "JL"
    CaseSensitive: true
