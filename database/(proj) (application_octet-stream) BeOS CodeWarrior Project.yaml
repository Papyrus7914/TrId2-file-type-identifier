Name: BeOS CodeWarrior Project
URL: "https://en.wikipedia.org/wiki/CodeWarrior"
FileNameExtensions: ["proj"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MIDE"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "DPrf"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "PrEn"
    CaseSensitive: true
