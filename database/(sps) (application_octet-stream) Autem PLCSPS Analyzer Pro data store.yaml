Name: Autem PLC/SPS Analyzer Pro data store
URL: "https://www.autem.de/"
FileNameExtensions: ["sps"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "BLOC\xE0\0\0\0"
    CaseSensitive: true
  - Pos: 11
    AsciiString: "EMANASGNL"
    CaseSensitive: true
  - Pos: any
    AsciiString: "EMANASGNL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "START"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IDAT"
    CaseSensitive: false
