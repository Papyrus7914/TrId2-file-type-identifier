Name: Cinemaware music
Description: A MIDI-like music format that appears to have only been used in Cinemaware's last game, Wings.
URL: "http://www.exotica.org.uk/wiki/Cinemaware_(format)"
FileNameExtensions: ["cin"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "IBLK"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ASEQ"
    CaseSensitive: false
