Name: Better On-Line Solutions Printer Driver
Description: Used in BOSaNOVA Access terminal emulator for Windows 3.x.
FileNameExtensions: ["apd", "aps"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PN\0\0"
    CaseSensitive: true
  - Pos: 5
    Bytes: [0x02, 0x00]
