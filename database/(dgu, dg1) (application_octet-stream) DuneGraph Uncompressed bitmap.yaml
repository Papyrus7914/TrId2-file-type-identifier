Name: DuneGraph Uncompressed bitmap
Description: Atari Falcon graphic format.
URL: "https://www.atari-wiki.com/index.php?title=DuneGraph_file_format"
FileNameExtensions: ["dgu", "dg1"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "DGU\x01"
    CaseSensitive: true
