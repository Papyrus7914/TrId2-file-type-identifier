Name: Panasonic channel list DataBase
URL: "https://github.com/PredatH0r/ChanSort"
FileNameExtensions: ["db", "bin"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PSDB\0"
    CaseSensitive: true
  - Pos: 126
    AsciiString: "SQLite format 3"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MEDIA BROADCAST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIGITAL+"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CSAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TELETEXT"
    CaseSensitive: false
