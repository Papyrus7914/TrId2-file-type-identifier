Name: Prusa i3 MK3 firmware
URL: "https://help.prusa3d.com/en/downloads/"
FileNameExtensions: ["hex"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: ":100000000C94"
    CaseSensitive: true
  - Pos: 44
    AsciiString: "\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "1_75MM_MK3-EINSY10A-E3DV6FULL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "100000000C94"
    CaseSensitive: false
