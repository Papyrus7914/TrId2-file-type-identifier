Name: VideoMaxe Printer Preferences
Description: Amiga video DB by Stephan Surken.
FileNameExtensions: ["prp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "VideoMaxe_V"
    CaseSensitive: true
  - Pos: 14
    AsciiString: "_Druckervoreinstellungs-Datei_\xA9StS_"
    CaseSensitive: true
