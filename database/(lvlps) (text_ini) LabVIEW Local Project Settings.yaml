Name: LabVIEW Local Project Settings
URL: "https://en.wikipedia.org/wiki/LabVIEW"
FileNameExtensions: ["lvlps"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "[ProjectWindow_Data]"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PROJECTEXPLORER.CLASSICPOSITION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRING"
    CaseSensitive: false
