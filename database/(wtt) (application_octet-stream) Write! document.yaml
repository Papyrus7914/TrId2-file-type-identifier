Name: Write! document
URL: "http://wri.tt/"
FileNameExtensions: ["wtt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "OPEN_SANS.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCUMENT.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PACKAGE.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRESETS"
    CaseSensitive: false
