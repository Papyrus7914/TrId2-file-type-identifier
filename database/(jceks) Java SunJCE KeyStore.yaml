Name: Java SunJCE KeyStore
Description: The proprietary keystore implementation provided by the "SunJCE" provider.
URL: "http://docs.oracle.com/javase/6/docs/technotes/guides/security/StandardNames.html#KeyStore"
FileNameExtensions: ["jceks"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xCE\xCE\xCE\xCE\0\0\0\x02\0\0\0"
    CaseSensitive: true
