Name: Omnis Web Client Form Cache
URL: "http://www.omnis.net"
FileNameExtensions: ["fca"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x82\x01\0 \0\0\0 \0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "\0\0\0\x03\0\0\0"
    CaseSensitive: true
  - Pos: 20
    AsciiString: ";\x9A\xCA\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BUTTON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REMOTE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OMNIS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BACK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ICON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LIST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PORT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PUSH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GRID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TREE"
    CaseSensitive: false
