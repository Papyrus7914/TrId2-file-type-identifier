Name: Segmented Hypergraphics bitmap
Description: Used in WinHelp files. Often confused with Multiple Resolution Bitmap (MRB).
URL: "http://fileformats.archiveteam.org/wiki/Segmented_Hypergraphics"
FileNameExtensions: ["shg"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "lp"
    CaseSensitive: true
