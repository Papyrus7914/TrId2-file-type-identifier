Name: Unreal Engine Project
URL: "https://en.wikipedia.org/wiki/Unreal_Engine"
FileNameExtensions: ["uproject"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "{"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ENGINEASSOCIATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILEVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CATEGORY"
    CaseSensitive: false
