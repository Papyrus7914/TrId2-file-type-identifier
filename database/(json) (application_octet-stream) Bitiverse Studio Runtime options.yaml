Name: Bitiverse Studio Runtime options
URL: "https://fortisq.itch.io/bitiverse-studio"
FileNameExtensions: ["json"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "{\r\n  \"runtimeOptions\": {\r\n    \"tfm\": \""
    CaseSensitive: true
  - Pos: any
    AsciiString: "SYSTEM.RUNTIME.SERIALIZATION.ENABLEUNSAFEBINARYFORMATTERSERIALIZATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYSTEM.REFLECTION.METADATA.METADATAUPDATER.ISSUPPORTED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MICROSOFT.NETCORE.APP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INCLUDEDFRAMEWORKS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONFIGPROPERTIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RUNTIMEOPTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NET10.0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
