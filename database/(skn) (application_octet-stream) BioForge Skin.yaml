Name: BioForge Skin
URL: "https://en.wikipedia.org/wiki/BioForge"
FileNameExtensions: ["skn"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "SKINLINK"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SKINLINK"
    CaseSensitive: false
