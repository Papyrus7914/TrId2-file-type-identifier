Name: AmiBlocksIDE Editor configuration
Description: Code::Blocks-inspired native IDE for Amiga by James Purcel.
FileNameExtensions: ["editor"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "AmiBlocks editor preferences 1\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "HIGHLIGHT_MATCHING_BRACES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRIM_WHITESPACE_ON_SAVE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTO_CLOSE_BRACKETS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHOW_SIGNATURE_HELP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHOW_DIAGNOSTICS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAX_LINE_LENGTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMAT_ON_SAVE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INDENT_WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTO_INDENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TAB_WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USE_TABS"
    CaseSensitive: false
