Name: WindowBlinds Progress Anim theme
URL: "https://en.wikipedia.org/wiki/WindowBlinds"
FileNameExtensions: ["wba"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04, 0x14]
  - Pos: any
    AsciiString: ".ANIMATIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".AVI"
    CaseSensitive: false
