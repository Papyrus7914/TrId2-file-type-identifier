Name: Naive Image format NII animated bitmaps
Description: Animated image, out-of-band frames.
URL: "http://fileformats.archiveteam.org/wiki/Na%C3%AFve_Image_Formats"
FileNameExtensions: ["nii"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        n                 I
    Bytes: [0x6E, 0xC3, 0xAF, 0x49]
