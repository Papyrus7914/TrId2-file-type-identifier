Name: "Prince of Persia: The Sands of Time save game"
URL: "https://www.mobygames.com/game/11185/prince-of-persia-the-sands-of-time/"
FileNameExtensions: ["sav"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SAV4"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 32
    AsciiString: "|\x8D\0\0"
    CaseSensitive: true
