Name: Hancom Word document
URL: "http://fileformats.archiveteam.org/wiki/HWP"
FileNameExtensions: ["hwp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1]
  - Pos: any
    AsciiString: "HWP DOCUMENT FILE"
    CaseSensitive: false
