Name: Electronics Workbench Circuit
URL: "http://www.electronicsworkbench.com/"
FileNameExtensions: ["ewb"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "Electronics Workbench Circuit File"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ELECTRONICS WORKBENCH CIRCUIT FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USINGVECTORGRAPHICS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCRYPTIONTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHARSET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
