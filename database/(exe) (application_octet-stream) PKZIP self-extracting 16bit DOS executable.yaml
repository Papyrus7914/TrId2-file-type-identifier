Name: PKZIP self-extracting 16bit DOS executable
URL: "https://en.wikipedia.org/wiki/PKZIP"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 30
    AsciiString: "Copyright 1989-"
    CaseSensitive: true
  - Pos: 49
    AsciiString: " PKWARE Inc."
    CaseSensitive: true
  - Pos: any
    AsciiString: "COPYRIGHT 1989-"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PKWARE INC."
    CaseSensitive: false
