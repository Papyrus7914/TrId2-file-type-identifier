Name: DigiDoc digital signature
URL: "https://en.wikipedia.org/wiki/DigiDoc"
FileNameExtensions: ["ddoc"]
MimeType: application/x-ddoc
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "SIGNEDDOC FORMAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIGIDOC-XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIGNATURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.SK.EE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ATAF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
