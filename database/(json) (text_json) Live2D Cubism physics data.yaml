Name: Live2D Cubism physics data
URL: "https://www.live2d.com/en/"
FileNameExtensions: ["json"]
MimeType: text/json
DetectionPatterns:
  - Pos: 0
    AsciiString: "{"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LIVE2D PHYSICS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PHYSICS_HAIR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TARGETS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LENGTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REGIST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SETUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
