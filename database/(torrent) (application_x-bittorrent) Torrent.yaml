Name: Torrent
Description: BitTorrent is a protocol for distributing files. It identifies content by URL and is designed to integrate seamlessly with the web. Its advantage over plain HTTP is that when multiple downloads of the same file happen concurrently, the downloaders upload to each other, making it possible for the file source to support very large numbers of downloaders with only a modest increase in its load.
URL: "https://en.wikipedia.org/wiki/Torrent_file"
FileNameExtensions: ["torrent"]
MimeType: application/x-bittorrent
DetectionPatterns:
  - Pos: 0
    AsciiString: "d8:announce"
    CaseSensitive: true
