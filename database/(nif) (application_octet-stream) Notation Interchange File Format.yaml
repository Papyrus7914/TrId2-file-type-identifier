Name: Notation Interchange File Format
URL: "http://fileformats.archiveteam.org/wiki/Notation_Interchange_File_Format"
FileNameExtensions: ["nif"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "RIFX\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "NIFFLIST\0\0\x03"
    CaseSensitive: true
