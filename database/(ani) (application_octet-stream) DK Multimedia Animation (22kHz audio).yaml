Name: DK Multimedia Animation (22kHz audio)
URL: "https://wiki.multimedia.cx/index.php/DK_Animation"
FileNameExtensions: ["ani"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x01, 0x00]
  - Pos: 18
    AsciiString: "\"V\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FUNKY"
    CaseSensitive: false
