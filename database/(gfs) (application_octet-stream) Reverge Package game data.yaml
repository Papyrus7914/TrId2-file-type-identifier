Name: Reverge Package game data
URL: "https://en.wikipedia.org/wiki/Skullgirls"
FileNameExtensions: ["gfs"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 4
    AsciiString: "\0\0\0\0\x14\0\0\0Reverge Package File"
    CaseSensitive: true
  - Pos: any
    AsciiString: "REVERGE PACKAGE FILE"
    CaseSensitive: false
