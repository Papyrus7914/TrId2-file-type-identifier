Name: Timeworks Publisher/Publish It! document (OLE2)
Description: Know also as Key Publisher.
URL: "https://en.wikipedia.org/wiki/Timeworks_Publisher"
FileNameExtensions: ["dtp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1]
  - Pos: any
    AsciiString: "BODY TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DTPI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EODF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FKEY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POFS"
    CaseSensitive: false
