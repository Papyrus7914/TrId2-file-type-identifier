Name: TEI document (UTF-8)
URL: "https://wiki.tei-c.org/index.php/Main_Page"
FileNameExtensions: ["xml"]
MimeType: application/tei+xml
DetectionPatterns:
  - Pos: 0
    #                          <
    Bytes: [0xEF, 0xBB, 0xBF, 0x3C]
  - Pos: any
    AsciiString: "PUBLICATIONSTMT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOURCEDESC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEIHEADER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLESTMT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILEDESC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EDIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
