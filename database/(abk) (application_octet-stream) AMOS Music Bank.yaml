Name: AMOS Music Bank
Description: Tracker-like music player created by Francois Lionet for his AMOS Basic programming language. AMOS comes with programs for converting tracker and Sonix music to the AMOS format.
URL: "http://en.wikipedia.org/wiki/AMOS_(programming_language)"
FileNameExtensions: ["abk"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "AmBk"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "Music"
    CaseSensitive: true
