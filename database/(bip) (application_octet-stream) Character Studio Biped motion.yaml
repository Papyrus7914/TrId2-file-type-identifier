Name: Character Studio Biped motion
URL: "https://en.wikipedia.org/wiki/Autodesk_3ds_Max#Features"
FileNameExtensions: ["bip"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x90, 0x01]
  - Pos: 3
    AsciiString: "\0\0\0X\x01"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TRUEVISION-XFILE."
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTODESK 3DS MAX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ORIGINALE"
    CaseSensitive: false
