Name: UltraEdit Project User Interface
URL: "https://en.wikipedia.org/wiki/UltraEdit"
FileNameExtensions: ["pui"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "[Open Files]"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ACTIVE FILE DISPLAY MODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPEN FILE WINDOW POS0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT INFORMATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ACTIVE FILE INDEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPEN FILE LINE0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPEN FILE POS0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REMEMBER FILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT START"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPEN FILE0"
    CaseSensitive: false
