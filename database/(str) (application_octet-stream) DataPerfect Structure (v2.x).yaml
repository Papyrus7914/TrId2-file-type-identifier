Name: DataPerfect Structure (v2.x)
URL: "https://en.wikipedia.org/wiki/WordPerfect#DataPerfect"
FileNameExtensions: ["str"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 1
    AsciiString: "WPC\0\0\0\0\n\x01"
    CaseSensitive: true
  - Pos: 18
    AsciiString: "\0\0\0\0\0\0\0\0 \0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ABCDEFGHIJKLMNOPQRSTUVWXYZ{"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FEBMARAPRMAYJUNJULAUG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEPOCTNOVDEC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "0123456789"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AIOUNNAO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "()*+"
    CaseSensitive: false
