Name: DOS Executable BASCOM (v1.0)
Description: IBM BASIC Compiler.
URL: "http://www.edm2.com/index.php/IBM_PC_BASIC"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 20
    AsciiString: "\x1A\0\0\0\x1C\0\0\0\x04\0\0\0\x06\0\0\0\b\0\0\0\x1D\0\0\0)\0\0\0"
    CaseSensitive: true
  - Pos: 512
    AsciiString: "b"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ENTER NEW DRIVE LETTER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ERROR IN EXE FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROGRAM TOO LARGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$\0BASRUN  EXE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CANNOT FIND A"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BASRUN.EXE"
    CaseSensitive: false
