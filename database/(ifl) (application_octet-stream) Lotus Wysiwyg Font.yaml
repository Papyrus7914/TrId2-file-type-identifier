Name: Lotus Wysiwyg Font
FileNameExtensions: ["ifl"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 2
    AsciiString: "<\0\x02\0\0\0Wysiwyg "
    CaseSensitive: true
  - Pos: 17
    AsciiString: "ont"
    CaseSensitive: true
  - Pos: any
    AsciiString: "WYSIWYG FONT"
    CaseSensitive: false
