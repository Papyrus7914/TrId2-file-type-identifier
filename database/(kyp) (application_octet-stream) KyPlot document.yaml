Name: KyPlot document
Description: https://www.kyenslab.com/
FileNameExtensions: ["kyp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\t\0"
    CaseSensitive: true
  - Pos: 3
    Bytes: [0x05, 0x00]
  - Pos: 7
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PAGE"
    CaseSensitive: false
