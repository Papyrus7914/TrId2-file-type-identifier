Name: Delphi 2009 Compiled Unit
URL: "https://en.wikipedia.org/wiki/Delphi_(software)"
FileNameExtensions: ["dcu"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "9\0\0\x14"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FINALIZATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYSINIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYSTEM"
    CaseSensitive: false
