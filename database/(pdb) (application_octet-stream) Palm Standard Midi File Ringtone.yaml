Name: Palm Standard Midi File Ringtone
FileNameExtensions: ["pdb"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 60
    AsciiString: "smfr"
    CaseSensitive: true
  - Pos: 124
    AsciiString: "MThd"
    CaseSensitive: true
  - Pos: 138
    AsciiString: "MTrk"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MTHD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MTRK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SMFR"
    CaseSensitive: false
