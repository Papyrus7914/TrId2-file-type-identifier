Name: Qt Style Sheet (with rem)
URL: "https://en.wikipedia.org/wiki/Qt_(software)"
FileNameExtensions: ["qss"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "/*"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BACKGROUND-COLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BORDER-RADIUS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BORDER-STYLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-BOTTOM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PADDING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRESSED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-RIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-LEFT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HOVER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "QLINE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOLID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-TOP"
    CaseSensitive: false
