Name: Company Ladder diagram
Description: MS-DOS software to create company organizational charts.
FileNameExtensions: ["lad"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        A
    Bytes: [0x41, 0x00, 0x01, 0x01, 0x01]
  - Pos: 6
    AsciiString: "\x01\x01\x01$\0\0\0\0\x01\x01,\x01."
    CaseSensitive: true
  - Pos: any
    AsciiString: "COMMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
