Name: The Star Commander configuration
Description: DOS file manager by Joe Forster.
FileNameExtensions: ["ini"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "The Star Commander "
    CaseSensitive: true
  - Pos: 20
    AsciiString: "."
    CaseSensitive: true
  - Pos: 23
    AsciiString: " setup file\r\n\x1A"
    CaseSensitive: true
