Name: diagrams.net diagram (with XML prefix)
Description: Was www.draw.io.
URL: "https://www.diagrams.net/"
FileNameExtensions: ["drawio"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DIAGRAM ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MXFILE"
    CaseSensitive: false
