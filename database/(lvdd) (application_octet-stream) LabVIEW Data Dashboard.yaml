Name: LabVIEW Data Dashboard
URL: "https://en.wikipedia.org/wiki/LabVIEW"
FileNameExtensions: ["lvdd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "Image"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DASHBOARD.LVDMPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT.GSDPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMAGE"
    CaseSensitive: false
