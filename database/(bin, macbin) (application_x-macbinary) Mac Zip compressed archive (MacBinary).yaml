Name: Mac Zip compressed archive (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/ZIP_(file_format)"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "ZIP_"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ZIP_"
    CaseSensitive: false
