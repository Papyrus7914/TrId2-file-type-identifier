Name: Korg Style
URL: "https://en.wikipedia.org/wiki/Korg"
FileNameExtensions: ["sty"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x01, 0x00, 0x01, 0x14, 0x00]
  - Pos: 8
    AsciiString: "\x02\0\0\x18\0\0\0\f\v\0\0\0\0\0\0KORF\0\x05"
    CaseSensitive: true
  - Pos: any
    AsciiString: "KBEG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KORF"
    CaseSensitive: false
