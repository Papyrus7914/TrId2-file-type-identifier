Name: Jigsaw Download (ungzipped)
URL: "https://fileformats.archiveteam.org/wiki/Jigdo"
FileNameExtensions: ["jigdo"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "# JigsawDownload\n# See <http"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TEMPLATE-MD5SUM"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".TEMPLATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SERVERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JIGDO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHA1"
    CaseSensitive: false
