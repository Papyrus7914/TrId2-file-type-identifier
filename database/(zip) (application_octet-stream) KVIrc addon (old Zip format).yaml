Name: KVIrc addon (old Zip format)
URL: "https://en.wikipedia.org/wiki/KVIrc"
FileNameExtensions: ["zip"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: ".KVSUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UX\0\0PK"
    CaseSensitive: false
