Name: WhatsUp Gold Virtual Device
URL: "http://www.ipswitch.com/"
FileNameExtensions: ["dse"]
DetectionPatterns:
  - Pos: 0
    #              {     \'
    Bytes: [0xD0, 0x7B, 0x27, 0x04]
  - Pos: 6
    Bytes: [0xFF, 0xFF, 0x02, 0x00]
  - Pos: 11
    AsciiString: "\0C"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CSHAPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CBOX"
    CaseSensitive: false
