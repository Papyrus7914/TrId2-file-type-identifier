Name: TsiLang translation data
URL: "https://www.tsilang.com/"
FileNameExtensions: ["sil"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "["
    CaseSensitive: true
  - Pos: any
    AsciiString: "LANGUAGE NAMES - FOR INTERNAL USE ONLY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DELIMITER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CAPTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRINGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".TFORM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CANCEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIALOG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".IDS_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHECK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HELP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SETS"
    CaseSensitive: false
