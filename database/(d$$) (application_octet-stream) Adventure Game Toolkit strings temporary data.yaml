Name: Adventure Game Toolkit strings temporary data
URL: "https://en.wikipedia.org/wiki/Adventure_Game_Toolkit"
FileNameExtensions: ["d$$"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: " >> Temporary data file of strings for AGT <<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "END OF FILE"
    CaseSensitive: false
