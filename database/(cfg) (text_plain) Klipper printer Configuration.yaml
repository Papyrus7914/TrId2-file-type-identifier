Name: Klipper printer Configuration
URL: "https://github.com/Klipper3d/klipper"
FileNameExtensions: ["cfg"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "["
    CaseSensitive: true
  - Pos: any
    AsciiString: "FILAMENT_DIAMETER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROTATION_DISTANCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NOZZLE_DIAMETER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAX_VELOCITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SENSOR_TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENABLE_PIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEATER_PIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KINEMATICS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MICROSTEPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SENSOR_PIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAX_ACCEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTRUDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAX_TEMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MIN_TEMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STEPPER_"
