    AsciiString: "STEP_PIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTROL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIR_PIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRINTER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONFIG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PID_KD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PID_KI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PID_KP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SERIAL"
    CaseSensitive: false
