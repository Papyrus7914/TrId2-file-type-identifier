Name: VBDOS 1.0 Form
FileNameExtensions: ["frm"]
DetectionPatterns:
  - Pos: 0
    #              \b
    Bytes: [0xFC, 0x08, 0x01, 0x00, 0x0E, 0x00, 0xA8, 0x01]
  - Pos: 9
    #              \t                                              \b    \n
    Bytes: [0x01, 0x09, 0x00, 0x01, 0x02, 0x03, 0x04, 0x06, 0x05, 0x08, 0x0A]
