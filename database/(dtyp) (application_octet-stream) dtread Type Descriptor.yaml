Name: dtread Type Descriptor
Description: Amiga tool for developing DataTypes.
URL: "http://aminet.net/package/util/dtype/dtmake"
FileNameExtensions: ["dtyp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "# Generated by dtread v"
    CaseSensitive: true
  - Pos: 24
    AsciiString: "."
    CaseSensitive: true
  - Pos: any
    AsciiString: "MSI SOFTWARE 1997"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DTNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FLAGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RECOG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CASE"
    CaseSensitive: false
