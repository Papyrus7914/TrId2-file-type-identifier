Name: Ferrite project
URL: "https://wieslawsoltes.github.io/Ferrite/"
FileNameExtensions: ["json"]
MimeType: text/json
DetectionPatterns:
  - Pos: 0
    AsciiString: "{\n  \"format\": \"ferrite-project-v1\",\n  \"files\": {\n    \"Cargo.toml\": \"[package]\\nname = \\\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "FN MAIN() {"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NEDITION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN.RS"
    CaseSensitive: false
