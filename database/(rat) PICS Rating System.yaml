    AsciiString: "(RATING-SYSTEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(PICS-VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(TRANSMIT-AS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(CATEGORY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(LABEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
