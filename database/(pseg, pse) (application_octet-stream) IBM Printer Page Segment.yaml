Name: IBM Printer Page Segment
FileNameExtensions: ["pseg", "pse"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        Z                                               P                                               @                 @                       Z
    Bytes: [0x5A, 0x00, 0x16, 0x00, 0x00, 0x01, 0x00, 0x00, 0x50, 0xE6, 0x99, 0x89, 0xA3, 0xA3, 0x85, 0x95, 0x40, 0x82, 0xA8, 0x40, 0xC7, 0xC2, 0xD4, 0x5A]
