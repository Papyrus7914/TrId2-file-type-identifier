Name: Beam Software SIFF sound
URL: "https://wiki.multimedia.cx/index.php?title=SIFF"
FileNameExtensions: ["son"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SIFF"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "SOUNSHDR"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SOUNSHDR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BODY"
    CaseSensitive: false
