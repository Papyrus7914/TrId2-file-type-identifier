Name: PlanAhead Project
URL: "https://en.wikipedia.org/wiki/Xilinx_ISE"
FileNameExtensions: ["ppr"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DEFAULTPROMOTE DIR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULTLAUNCH DIR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$PROMOTEDIR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$PRUNDIR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAHEAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MINOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PART"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLAN"
    CaseSensitive: false
