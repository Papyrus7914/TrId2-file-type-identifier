Name: 16bit DOS COM The WiZ Cryptor encrypted (v1.00a)
Description: Encryptor by SP0T //UCL.
FileNameExtensions: ["com"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xE9]
  - Pos: any
    AsciiString: "THE WIZ CRYPTOR V1.00A BY SP0T"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XXXXJ"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAME"
    CaseSensitive: false
