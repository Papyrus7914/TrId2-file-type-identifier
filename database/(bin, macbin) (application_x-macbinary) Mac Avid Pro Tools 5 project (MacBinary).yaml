Name: Mac Avid Pro Tools 5 project (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/Pro_Tools"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "PT5S"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PT5S"
    CaseSensitive: false
