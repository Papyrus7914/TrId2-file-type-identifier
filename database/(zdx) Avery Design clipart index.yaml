Name: Avery Design clipart index
URL: "http://www.avery.com/home.html"
FileNameExtensions: ["zdx"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x1AL\0\0\x01\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LASTFILEMARKER"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".JPG"
    CaseSensitive: false
