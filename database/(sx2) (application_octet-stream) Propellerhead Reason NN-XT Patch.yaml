Name: Propellerhead Reason NN-XT Patch
URL: "http://fileformats.archiveteam.org/wiki/Propellerhead_Reason_NN-XT_Patch_File"
FileNameExtensions: ["sx2"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "PTCH"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BODY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARM"
    CaseSensitive: false
