Name: Windows thumbnail Data Base
FileNameExtensions: ["db"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1]
  - Pos: 1024
    AsciiString: "R\0o\0o\0t\0 \0E\0n\0t\0r\0y"
    CaseSensitive: true
  - Pos: any
    AsciiString: "C\0A\0T\0A\0L\0O\0G"
    CaseSensitive: false
