Name: mikroBasic PRO for PIC Projects Group
URL: "https://www.mikroe.com/mikrobasic-pic"
FileNameExtensions: ["mbpigroup"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "[PROJECTS]\r\nCount="
    CaseSensitive: true
  - Pos: any
    AsciiString: "ACTIVEPROJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT0"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".MBPPI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INDEX"
    CaseSensitive: false
