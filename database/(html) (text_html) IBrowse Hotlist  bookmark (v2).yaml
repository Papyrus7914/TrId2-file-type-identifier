  - Pos: any
    AsciiString: "THIS HOTLIST HAS BEEN CREATED USING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.OMNIPRESENCE.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FONT SIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "P ALIGN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "A HREF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
