Name: Dynamix game engine archive
Description: Used for example in Betryal at Krondor.
URL: "https://www.mobygames.com/company/42/dynamix-inc/"
FileNameExtensions: ["sol", "000", "001", "002"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "DISK01DH9"
    CaseSensitive: true
  - Pos: any
    AsciiString: "THE_END"
    CaseSensitive: false
