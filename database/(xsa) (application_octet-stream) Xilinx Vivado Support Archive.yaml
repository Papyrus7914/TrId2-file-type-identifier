Name: Xilinx Vivado Support Archive
URL: "https://en.wikipedia.org/wiki/Vivado"
FileNameExtensions: ["xsa"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "DESIGN_1_WRAPPER.BITPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESIGN_1.HWHPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYSDEF.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XSA.JSONPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XSA.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XSA.XMLU"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".TCLPK"
    CaseSensitive: false
