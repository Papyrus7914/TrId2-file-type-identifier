Name: IFF 12-bit RGB bitmap
Description: Amiga format, used by Impulse's software.
URL: "http://fileformats.archiveteam.org/wiki/ILBM"
FileNameExtensions: ["iff", "rgbn"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "RGBN"
    CaseSensitive: true
