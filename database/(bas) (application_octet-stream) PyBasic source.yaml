Name: PyBasic source
URL: "https://github.com/richpl/PyBasic"
FileNameExtensions: ["bas"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x80\x03}q\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "(CBASICTOKEN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CATEGORYQ"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLUMNQ"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LEXEMEQ"
    CaseSensitive: false
