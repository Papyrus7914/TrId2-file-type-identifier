Name: Disk IMage Archiver self-extracting disk image
Description: Old DOS disk image tool by Ray (Arsen) Arachelian.
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ/\07\0\0\0\x02\0\x94\x03\xFF\xFF1\n\x80\0\0\0\x0E\0\xA6\x06\x1C\0\0\0DIM!"
    CaseSensitive: true
