Name: IFF Outline Font
Description: Used by Amiga's ProVector drawing program.
URL: "http://wiki.amigaos.net/wiki/DR2D_IFF_2-D_Objects#The_OFNT_FORM"
FileNameExtensions: ["ofnt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "OFNTOFHD"
    CaseSensitive: true
