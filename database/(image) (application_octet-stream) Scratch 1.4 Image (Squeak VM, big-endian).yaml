Name: Scratch 1.4 Image (Squeak VM, big-endian)
URL: "https://en.wikipedia.org/wiki/Scratch_(programming_language)"
FileNameExtensions: ["image"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0\x19f\0\0\0@"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOESNOTUNDERSTAND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLATFORM SPECIFIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SQUEAK SMALLTALK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CANNOTRETURN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INITIALIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROCESS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCRATCH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STACK"
    CaseSensitive: false
