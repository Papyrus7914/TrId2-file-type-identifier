Name: Blitz3d object
Description: The Blitz3D file format specifies a format for storing texture, brush and entity descriptions for use with the Blitz3D programming language.
URL: "http://www.blitzbasic.com"
FileNameExtensions: ["b3d"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "BB3D"
    CaseSensitive: true
