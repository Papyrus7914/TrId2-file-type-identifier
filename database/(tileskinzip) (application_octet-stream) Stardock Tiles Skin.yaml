Name: Stardock Tiles Skin
URL: "http://fileformats.archiveteam.org/wiki/Stardock_Tiles_Skin"
FileNameExtensions: ["tileskinzip"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: ".TILESKINPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PNGPK"
    CaseSensitive: false
