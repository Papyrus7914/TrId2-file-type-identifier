Name: Publisher's Type Foundry bitmap Font
Description: Same formate associate with PCPaintbrush and Venutura fonts.
FileNameExtensions: ["xfr"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x02, 0x1A]
  - Pos: 1283
    AsciiString: "HxdpMN"
    CaseSensitive: true
  - Pos: any
    AsciiString: "HXDPMN"
    CaseSensitive: false
