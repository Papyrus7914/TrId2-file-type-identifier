Name: M.O.N New module
Description: Music format created by Charles Deenen and Frederic Hahn, used by the Maniacs of Noise.
URL: "http://www.exotica.org.uk/wiki/M.O.N_New"
FileNameExtensions: ["mon"]
MimeType: audio/x-mod
DetectionPatterns:
  - Pos: 0
    AsciiString: "N\xFA\0"
    CaseSensitive: true
  - Pos: 4
    #        N
    Bytes: [0x4E, 0xFA, 0x01]
  - Pos: 8
    AsciiString: "N\xFA\0"
    CaseSensitive: true
