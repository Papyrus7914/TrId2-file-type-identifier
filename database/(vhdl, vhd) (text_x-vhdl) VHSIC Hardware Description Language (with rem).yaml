Name: VHSIC Hardware Description Language (with rem)
URL: "https://en.wikipedia.org/wiki/VHDL"
FileNameExtensions: ["vhdl", "vhd"]
MimeType: text/x-vhdl
DetectionPatterns:
  - Pos: 0
    AsciiString: "--"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ARCHITECTURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENTITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BEGIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PORT"
    CaseSensitive: false
