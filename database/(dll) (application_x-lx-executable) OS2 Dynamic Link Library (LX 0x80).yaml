Name: OS/2 Dynamic Link Library (LX 0x80)
Description: little endian, module flag xX0Y80zZh (Y=0 or 1, 0~unknown), ESP=0, page size lower 16 MiB, page shift (0 9 12), fixup_cksum=0, loader_cksum=0, cksum_off=0
URL: "https://en.wikipedia.org/wiki/.exe#LX"
FileNameExtensions: ["dll"]
MimeType: application/x-lx-executable
DetectionPatterns:
  - Pos: 0
    AsciiString: "LX\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "\0\x01\0"
    CaseSensitive: true
  - Pos: 17
    Bytes: [0x80]
  - Pos: 32
    AsciiString: "\0\0\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 42
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 45
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 52
    AsciiString: "\0\0\0\0"
    CaseSensitive: true
  - Pos: 60
    AsciiString: "\0\0\0\0"
    CaseSensitive: true
  - Pos: 124
    AsciiString: "\0\0\0\0"
    CaseSensitive: true
  - Pos: 144
