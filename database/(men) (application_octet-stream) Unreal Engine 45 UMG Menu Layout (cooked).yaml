Name: Unreal Engine 4/5 UMG Menu Layout (cooked)
URL: "https://en.wikipedia.org/wiki/Unreal_Engine"
FileNameExtensions: ["men"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "RES "
    CaseSensitive: true
  - Pos: 8
    AsciiString: "MENUHEAD"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MENUHEAD"
    CaseSensitive: false
