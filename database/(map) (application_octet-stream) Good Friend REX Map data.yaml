Name: Good Friend REX Map data
Description: Used in the game Good Friend Rex by KidNkiD - Korea.
FileNameExtensions: ["map"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Crazy Tool of MapFile Ver 1.0\0Crazy Tool CopyRight (R) "
    CaseSensitive: true
  - Pos: any
    AsciiString: "---------- END CUT LINE -----------\0THIS DOWN IS OBJDATA------------CUTLINE-----------START"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THIS DOWN IS MAPDATA------------CUTLINE-----------START"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COBJ.JAF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ITEM.JAF"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".MBF"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".TIL"
    CaseSensitive: false
