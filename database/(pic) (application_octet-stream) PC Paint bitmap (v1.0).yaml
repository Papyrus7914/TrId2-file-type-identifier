Name: PC Paint bitmap (v1.0)
Description: Old DOS paint program.
URL: "https://en.wikipedia.org/wiki/PCPaint"
FileNameExtensions: ["pic"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xFD\0\xB8\0\0\0@"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PCPAINT V1.0"
    CaseSensitive: false
