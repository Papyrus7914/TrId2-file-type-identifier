Name: QWK offline mail packet (ZIP compressed)
URL: "http://en.wikipedia.org/wiki/QWK_(file_format)"
FileNameExtensions: ["qwk"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "MESSAGES.DATPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTROL.DATPK"
    CaseSensitive: false
