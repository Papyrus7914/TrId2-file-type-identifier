Name: PGP message
Description: Pretty Good Privacy (PGP) is a computer program that provides cryptographic privacy and authentication.
URL: "https://en.wikipedia.org/wiki/Pretty_Good_Privacy"
FileNameExtensions: ["asc", "pgp", "txt"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "-----BEGIN PGP MESSAGE-----"
    CaseSensitive: true
  - Pos: any
    AsciiString: "-----END PGP MESSAGE-----"
    CaseSensitive: false
