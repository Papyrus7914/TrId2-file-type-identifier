Name: InDesign Shortcuts set (XML)
URL: "https://en.wikipedia.org/wiki/Adobe_InDesign"
FileNameExtensions: ["indk"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SHORTCUT-SET PLATFORM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPLICATION-VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ACTION-ID VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUILD-NUMBER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE-VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
