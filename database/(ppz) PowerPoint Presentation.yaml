Name: PowerPoint Presentation
URL: "http://en.wikipedia.org/wiki/PowerPoint"
FileNameExtensions: ["ppz"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "MSCF\0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".PPT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MSCF"
    CaseSensitive: false
