Name: LuaRocks Package Specification
URL: "http://luarocks.org/en/Creating_a_rock"
FileNameExtensions: ["rockspec"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "package = "
    CaseSensitive: true
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HOMEPAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUILTIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LICENSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SUMMARY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOURCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUILD"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".LUA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
