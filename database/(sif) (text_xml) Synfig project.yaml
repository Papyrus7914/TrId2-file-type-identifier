Name: Synfig project
URL: "http://fileformats.archiveteam.org/wiki/Synfig"
FileNameExtensions: ["sif"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "CANVAS VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BEGIN-TIME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ANTIALIAS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "END-TIME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIEW-BOX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ACTIVE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XRES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "YRES"
    CaseSensitive: false
