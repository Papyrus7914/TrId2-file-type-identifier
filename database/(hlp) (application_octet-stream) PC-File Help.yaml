Name: PC-File Help
URL: "https://en.wikipedia.org/wiki/PC-File"
FileNameExtensions: ["hlp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x03, 0x00]
  - Pos: 20
    AsciiString: "(C)COPYRIGHT 1982-"
    CaseSensitive: true
  - Pos: 40
    AsciiString: " BY"
    CaseSensitive: true
  - Pos: 44
    AsciiString: "BUTTONWARE.\nALL RIGHTS RESERVED.\n\x01\x05\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ALL RIGHTS RESERVED."
    CaseSensitive: false
  - Pos: any
    AsciiString: "(C)COPYRIGHT 1982-"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BY BUTTONWARE."
    CaseSensitive: false
  - Pos: any
    AsciiString: "RECORDS*"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PRO"
    CaseSensitive: false
