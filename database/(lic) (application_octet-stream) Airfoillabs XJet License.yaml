Name: Airfoillabs XJet License
URL: "https://www.airfoillabs.com/"
FileNameExtensions: ["lic"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xAC\xED\0\x05sr\0 com.airfoillabs.xjet.drm.License"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ENCRYPTEDPASSWORD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SERIALNUMBER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HWHASH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JAVA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LANG"
    CaseSensitive: false
