Name: GAMS Data eXchange
URL: "https://www.gams.com/latest/docs/UG_GDX.html"
FileNameExtensions: ["gdx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x024\x12\x04xV4\x12\b\x18-DT\xFB!\t@{\aGAMSGDX"
    CaseSensitive: true
  - Pos: 31
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 34
    AsciiString: "NGDX Library      "
    CaseSensitive: true
  - Pos: 54
    AsciiString: "."
    CaseSensitive: true
  - Pos: 56
    AsciiString: "."
    CaseSensitive: true
  - Pos: 58
    AsciiString: " "
    CaseSensitive: true
  - Pos: any
    AsciiString: "NGDX LIBRARY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "X86 64BIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GAMSGDX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_ACRO_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_DATA_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_SETT_"
    CaseSensitive: false
