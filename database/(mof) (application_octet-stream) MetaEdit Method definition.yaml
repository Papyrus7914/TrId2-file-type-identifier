Name: MetaEdit Method definition
Description: Multi-method CASE-tool for Windows by MetaCase Consulting Oy.
URL: "https://www.metacase.com/"
FileNameExtensions: ["mof"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        d
    Bytes: [0x64, 0x00, 0xEC, 0x03]
  - Pos: any
    AsciiString: "CENTERED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOLID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DARK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
