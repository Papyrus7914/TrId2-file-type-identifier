Name: WindowBlinds skin-theme
URL: "https://en.wikipedia.org/wiki/WindowBlinds"
FileNameExtensions: ["wba"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "PROGRESS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TASKBAR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOOLBAR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUTTON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCROLL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STATUS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMBO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GROUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RADIO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "START"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRACK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".XPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOWN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MENU"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPIN"
    CaseSensitive: false
