Name: DT-42 drum track
Description: Amiga drum machine by David Olofson.
FileNameExtensions: ["dt42"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "DT42SONG1\nCREATOR:"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".WAV"
    CaseSensitive: false
