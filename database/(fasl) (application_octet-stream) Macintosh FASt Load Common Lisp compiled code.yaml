Name: Macintosh FASt Load Common Lisp compiled code
FileNameExtensions: ["fasl"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xFF\0\0\x01\0\0\0\f\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "*LOADING-FILE-SOURCE-FILE*"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".LISP"
    CaseSensitive: false
