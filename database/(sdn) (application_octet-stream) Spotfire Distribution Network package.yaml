Name: Spotfire Distribution Network package
URL: "https://www.spotfire.com/"
FileNameExtensions: ["sdn"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "Metadata.xml"
    CaseSensitive: true
  - Pos: any
    AsciiString: "METADATA.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PKG0-"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".ZIP"
    CaseSensitive: false
