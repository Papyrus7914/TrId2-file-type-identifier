  - Pos: any
    AsciiString: "REPORT LEVEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONSTRAINTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESIGN FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COPYRIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEVICE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TIMING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COVER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATHS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPEED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRACE"
    CaseSensitive: false
