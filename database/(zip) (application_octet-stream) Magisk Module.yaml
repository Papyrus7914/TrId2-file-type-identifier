Name: Magisk Module
URL: "https://forum.xda-developers.com/apps/magisk"
FileNameExtensions: ["zip"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "UPDATER-SCRIPT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UPDATE-BINARY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODULE.PROP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONFIG.SH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "META-INF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ANDROID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GOOGLE"
    CaseSensitive: false
