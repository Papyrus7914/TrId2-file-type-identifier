Name: Novastorm Sprite sheets
URL: "https://www.mobygames.com/game/271/novastorm/"
FileNameExtensions: ["spr"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SHED"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "EOFL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPHS"
    CaseSensitive: false
