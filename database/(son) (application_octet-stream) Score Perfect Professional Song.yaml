Name: Score Perfect Professional Song
Description: Music software for Atari ST.
FileNameExtensions: ["son"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xF0, 0xEE, 0xED, 0x00]
  - Pos: 5
    AsciiString: "1"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "."
    CaseSensitive: true
