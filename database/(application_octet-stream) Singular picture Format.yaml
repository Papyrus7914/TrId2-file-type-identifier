Name: Singular picture Format
Description: Used in DOS programs by Singular, like GWord.
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SGF"
    CaseSensitive: true
  - Pos: 10
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "\0"
    CaseSensitive: true
