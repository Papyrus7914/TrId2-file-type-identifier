Name: CSV Dialect Description Format
URL: "http://fileformats.archiveteam.org/wiki/CSV_Dialect_Description_Format"
FileNameExtensions: ["json"]
MimeType: text/json
DetectionPatterns:
  - Pos: 0
    AsciiString: "{"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SKIPINITIALSPACE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LINETERMINATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOUBLEQUOTE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DELIMITER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "QUOTECHAR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CSVDDF"
    CaseSensitive: false
