Name: Mozilla startupCache
Description: startupCache.4.little or startupCache.8.little used in Thunderbird, Firefox.
URL: "https://en.wikipedia.org/wiki/Mozilla"
FileNameExtensions: ["little"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "startupcache0002"
    CaseSensitive: true
