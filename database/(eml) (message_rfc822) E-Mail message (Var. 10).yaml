Name: E-Mail message (Var. 10)
URL: "http://fileformats.archiveteam.org/wiki/Internet_e-mail_message_format"
FileNameExtensions: ["eml"]
MimeType: message/rfc822
DetectionPatterns:
  - Pos: 0
    AsciiString: "x-store-info:"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CONTENT-TRANSFER-ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTHENTICATION-RESULTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "X-ORIGINALARRIVALTIME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "X-MESSAGE-DELIVERY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "X-MESSAGE-INFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENT-TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MIME-VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "X-STORE-INFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RETURN-PATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MESSAGE-ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "X-SID-PRA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RECEIVED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SUBJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SENDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DKIM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FROM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NONE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STAT"
    CaseSensitive: false
