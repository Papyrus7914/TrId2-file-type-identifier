Name: MeshCore exported configuration (repeater)
URL: "https://meshcore.io/"
FileNameExtensions: ["json"]
MimeType: text/json
DetectionPatterns:
  - Pos: 0
    AsciiString: "{\n  \"vars\": {\n    \"name\": \""
    CaseSensitive: true
  - Pos: any
    AsciiString: "FLOOD.ADVERT.INTERVAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AGC.RESET.INTERVAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ALLOW.READ.ONLY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIRECT.TXDELAY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GUEST.PASSWORD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH.HASH.MODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOOP.DETECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INT.THRESH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MULTI.ACKS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OWNER.INFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FLOOD.MAX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRV.KEY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RXDELAY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REPEAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RADIO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FREQ"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VARS"
    CaseSensitive: false
