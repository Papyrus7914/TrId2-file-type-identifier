Name: Ghidra project Lock
URL: "https://en.wikipedia.org/wiki/Ghidra"
FileNameExtensions: ["lock"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "#Ghidra Lock File"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ARCHITECTURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TIMESTAMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HOSTNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USERNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "META"
    CaseSensitive: false
