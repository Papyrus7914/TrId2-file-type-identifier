Name: World of Good addin
URL: "http://goofans.com/gootool"
FileNameExtensions: ["goomod"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "ADDIN.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LEVELS"
    CaseSensitive: false
