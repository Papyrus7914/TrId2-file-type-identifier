Name: SymbOS Executable
Description: Advanced multitasking 8bit OS for various Z80 micros.
URL: "https://www.symbos.org/"
FileNameExtensions: ["exe", "com", "ex1", "ex2"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 6
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 47
    AsciiString: "\0SymExe1"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SYMEXE1"
    CaseSensitive: false
