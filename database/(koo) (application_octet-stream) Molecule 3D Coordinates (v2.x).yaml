Name: Molecule 3D Coordinates (v2.x)
Description: Atari ST program by Rainer Paape.
FileNameExtensions: ["koo"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Molek\x81le 3D 2."
    CaseSensitive: true
  - Pos: 16
    AsciiString: "/19"
    CaseSensitive: true
  - Pos: 21
    AsciiString: "\r\nKoordinaten\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "KOORDINATEN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LE 3D 2."
    CaseSensitive: false
