Name: SuperProject Expert Project (v1.x)
Description: Project management software for DOS by Computer Associates Int.
FileNameExtensions: ["pj"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xAA\x82\x80\0(C) 1985 COMPUTER ASSOCIATES    "
    CaseSensitive: true
  - Pos: 59
    AsciiString: "VER: 3.00             \x1A"
    CaseSensitive: true
