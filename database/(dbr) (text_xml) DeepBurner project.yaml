Name: DeepBurner project
URL: "https://www.deepburner.com"
FileNameExtensions: ["dbr"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<DeepBurner_record ver=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "CD_LABEL VER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_CD VER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAYOUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FRONT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BACK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIEW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ZOOM"
    CaseSensitive: false
