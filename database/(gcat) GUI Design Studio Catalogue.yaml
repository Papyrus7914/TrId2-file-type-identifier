Name: GUI Design Studio Catalogue
URL: "http://www.carettasoftware.com/"
FileNameExtensions: ["gcat"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<Catalogue"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ORIGINALPATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ORIGINALROOT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RELATIVEPATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CATALOGUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$PROJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILEINFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NEXTCID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".GUI"
    CaseSensitive: false
