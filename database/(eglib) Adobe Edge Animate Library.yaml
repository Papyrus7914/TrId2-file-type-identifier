Name: Adobe Edge Animate Library
FileNameExtensions: ["eglib"]
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "_EDGEACTIONS.JSPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_EDGE.JSPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".EDGEPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".HTMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".HTMLM"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PNGPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMAGES"
    CaseSensitive: false
