Name: Mathematical Programming System format
URL: "https://en.wikipedia.org/wiki/MPS_(format)"
FileNameExtensions: ["mps"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "NAME"
    CaseSensitive: true
  - Pos: any
    AsciiString: "COLUMNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENDATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROWS"
    CaseSensitive: false
