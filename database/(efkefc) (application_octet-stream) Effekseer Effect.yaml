Name: Effekseer Effect
URL: "http://effekseer.github.io/"
FileNameExtensions: ["efkefc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "EFKE"
    CaseSensitive: true
  - Pos: any
    AsciiString: "EDIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SKFE"
    CaseSensitive: false
