Name: Addict Thesaurus
URL: "http://www.addictivesoftware.com/"
FileNameExtensions: ["adt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "ADDICT "
    CaseSensitive: true
  - Pos: 8
    AsciiString: "."
    CaseSensitive: true
  - Pos: 10
    AsciiString: " - Thesaurus Compiler"
    CaseSensitive: true
