Name: DOS EXE PKLite compressed (+PKHide)
Description: PKHide is an utility from Ken Silverman to hide the PKLite signature.
URL: "http://advsys.net/ken/utils.htm"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 6
    Bytes: [0x01, 0x00]
  - Pos: 9
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "\0\x02\0\0\0\x01\xF0\xFFW\0\0\0\x01"
    CaseSensitive: true
  - Pos: 30
    #        )     #                       l                 R           I                                                     <           \f    >           $     ^     \r                      G                       M           C                                   Z     }     \t    8     %           ]                       e     r     v     e     d     \b
    Bytes: [0x29, 0x23, 0xBE, 0x84, 0xE1, 0x6C, 0xD6, 0xAE, 0x52, 0x90, 0x49, 0xF1, 0xF1, 0xBB, 0xE9, 0xEB, 0xB3, 0xA6, 0xDB, 0x3C, 0x87, 0x0C, 0x3E, 0x99, 0x24, 0x5E, 0x0D, 0x1C, 0x06, 0xB7, 0x47, 0xDE, 0xB3, 0x12, 0x4D, 0xC8, 0x43, 0xBB, 0x8B, 0xA6, 0x1F, 0x03, 0x5A, 0x7D, 0x09, 0x38, 0x25, 0x1F, 0x5D, 0xD4, 0xCB, 0xFC, 0x65, 0x72, 0x76, 0x65, 0x64, 0x08, 0x00, 0x00, 0x00]
  - Pos: any
    AsciiString: "ERVED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NOT ENOUGH MEMORY$"
    CaseSensitive: false
