Name: Quartus Setting File (by Terasic System Builder)
URL: "https://en.wikipedia.org/wiki/Intel_Quartus_Prime"
FileNameExtensions: ["qsf"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "#============================================================"
    CaseSensitive: true
  - Pos: 99
    AsciiString: "=========================================================="
    CaseSensitive: true
  - Pos: any
    AsciiString: "SET_GLOBAL_ASSIGNMENT -NAME PROJECT_CREATION_TIME_DATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SET_GLOBAL_ASSIGNMENT -NAME ORIGINAL_QUARTUS_VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "END OF PIN ASSIGNMENTS BY TERASIC SYSTEM BUILDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SET_GLOBAL_ASSIGNMENT -NAME LAST_QUARTUS_VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SET_GLOBAL_ASSIGNMENT -NAME TOP_LEVEL_ENTITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SET_INSTANCE_ASSIGNMENT -NAME IO_STANDARD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SET_GLOBAL_ASSIGNMENT -NAME DEVICE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SET_GLOBAL_ASSIGNMENT -NAME FAMILY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUILD BY TERASIC SYSTEM BUILDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SET_LOCATION_ASSIGNMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CYCLONE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PACKAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RESET_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLOCK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_MODE"
    CaseSensitive: false
