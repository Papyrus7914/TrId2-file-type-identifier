Name: Prusa SL1S sliced model archive
URL: "https://www.prusa3d.com"
FileNameExtensions: ["sl1s"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "config.ini"
    CaseSensitive: true
  - Pos: any
    AsciiString: "THUMBNAIL400X400.PNGPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THUMBNAIL800X480.PNGPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRUSASLICER.INIPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "00000.PNGPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "00001.PNGPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONFIG.INI"
    CaseSensitive: false
