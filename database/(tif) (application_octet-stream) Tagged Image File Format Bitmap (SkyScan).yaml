Name: Tagged Image File Format Bitmap (SkyScan)
URL: "https://www.bruker.com/en/products-and-solutions/diffractometers-and-x-ray-microscopes/3d-x-ray-microscopes.html"
FileNameExtensions: ["tif"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "II*\0"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "\0SkyScan\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SKYSCAN"
    CaseSensitive: false
