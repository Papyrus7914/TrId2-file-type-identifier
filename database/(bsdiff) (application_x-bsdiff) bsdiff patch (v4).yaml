Name: bsdiff patch (v4)
URL: "http://www.daemonology.net/bsdiff/"
FileNameExtensions: ["bsdiff"]
MimeType: application/x-bsdiff
DetectionPatterns:
  - Pos: 0
    AsciiString: "BSDIFF40"
    CaseSensitive: true
  - Pos: 32
    AsciiString: "BZh"
    CaseSensitive: true
  - Pos: 36
    AsciiString: "1AY"
    CaseSensitive: true
