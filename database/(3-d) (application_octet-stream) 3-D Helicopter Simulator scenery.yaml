Name: 3-D Helicopter Simulator scenery
URL: "https://www.mobygames.com/game/dos/sierras-3-d-helicopter-simulator"
FileNameExtensions: ["3-d"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        =
    Bytes: [0x3D, 0x10]
  - Pos: 49
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 108
    AsciiString: "\0\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 146
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 236
    Bytes: [0xAA, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA, 0xAA]
  - Pos: any
    AsciiString: "W\0U\0U\0U\0U"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UUUUUUUU"
    CaseSensitive: false
