Name: ASEAM 2 Loads Input Screen/Data
Description: A Simplified Energy Analysis Method, for DOS.
FileNameExtensions: ["lis"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "AS2 LOADS INPUT SCREEN/DATA "
    CaseSensitive: true
  - Pos: any
    AsciiString: "AS2 LOADS INPUT SCREEN"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".LIS"
    CaseSensitive: false
