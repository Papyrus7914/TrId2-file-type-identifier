Name: NoX Map
URL: "https://www.mobygames.com/game/865/nox/"
FileNameExtensions: ["map"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        1     #     _     a
    Bytes: [0x31, 0x23, 0x5F, 0x61, 0xF4, 0xE3, 0x1A, 0xA0]
  - Pos: 33
    AsciiString: "rqh6:\xAC\f"
    CaseSensitive: true
  - Pos: any
    AsciiString: "-RQH6"
    CaseSensitive: false
