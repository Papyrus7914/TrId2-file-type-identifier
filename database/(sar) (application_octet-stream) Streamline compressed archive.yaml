Name: Streamline compressed archive
Description: Old MS-DOS archiver by Streamline Design.
FileNameExtensions: ["sar"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 2
    AsciiString: " LH"
    CaseSensitive: true
  - Pos: 6
    AsciiString: " "
    CaseSensitive: true
  - Pos: 10
    AsciiString: "\0"
    CaseSensitive: true
