Name: Go package (Win-64) (v1.x)
URL: "https://en.wikipedia.org/wiki/Go_(programming_language)"
FileNameExtensions: ["a"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "!<arch>\n__.PKGDEF"
    CaseSensitive: true
  - Pos: 67
    AsciiString: "\ngo object windows amd64 go1."
    CaseSensitive: true
  - Pos: any
    AsciiString: "GO OBJECT WINDOWS AMD64 GO1."
    CaseSensitive: false
  - Pos: any
    AsciiString: "GO.CUINFO.PACKAGENAME."
    CaseSensitive: false
  - Pos: any
    AsciiString: "GOFILE..$GOROOT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTOGENERATED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FRAMEPOINTER"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".GOFILE.."
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUILD ID"
    CaseSensitive: false
