Name: Ray Dream Designer scene
Description: Old 3D modeling software, Carrara ancestor.
URL: "http://fileformats.archiveteam.org/wiki/Ray_Dream"
FileNameExtensions: ["rd4"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "3DC {\r"
    CaseSensitive: true
  - Pos: any
    AsciiString: "RAY DREAM DESIGNER("
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNIVERS"
    CaseSensitive: false
