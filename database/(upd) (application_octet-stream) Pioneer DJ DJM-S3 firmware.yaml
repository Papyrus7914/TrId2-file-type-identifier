Name: Pioneer DJ DJM-S3 firmware
URL: "https://www.pioneerdj.com/en/support/software/archive/djm-s3/"
FileNameExtensions: ["upd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "UPD 0100"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "DJM-S3"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DJM-S3"
    CaseSensitive: false
