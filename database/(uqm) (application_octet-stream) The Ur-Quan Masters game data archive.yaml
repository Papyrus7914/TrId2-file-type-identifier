Name: The Ur-Quan Masters game data archive
URL: "https://en.wikipedia.org/wiki/Star_Control_II#The_Ur-Quan_Masters"
FileNameExtensions: ["uqm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "STARBASE."
    CaseSensitive: false
  - Pos: any
    AsciiString: ".RMPPK"
    CaseSensitive: false
