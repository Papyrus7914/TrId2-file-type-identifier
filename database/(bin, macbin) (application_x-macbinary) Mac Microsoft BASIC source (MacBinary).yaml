Name: Mac Microsoft BASIC source (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/Microsoft_BASIC"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "MSBC"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MSBC"
    CaseSensitive: false
