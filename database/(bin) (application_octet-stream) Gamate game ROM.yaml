Name: Gamate game ROM
URL: "https://en.wikipedia.org/wiki/Gamate"
FileNameExtensions: ["bin"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 2
    Bytes: [0x01]
  - Pos: 5
    AsciiString: "COPYRIGHT BIT CORPORATION"
    CaseSensitive: true
  - Pos: 32
    AsciiString: "L"
    CaseSensitive: true
  - Pos: 38
    AsciiString: "L"
    CaseSensitive: true
  - Pos: any
    AsciiString: "COPYRIGHT BIT CORPORATION"
    CaseSensitive: false
