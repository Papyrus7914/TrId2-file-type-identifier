Name: Roblox CDN asset
URL: "https://en.wikipedia.org/wiki/Roblox"
FileNameExtensions: ["rbxh"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "RBXH\x02\0\0\0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "https://"
    CaseSensitive: true
  - Pos: 22
    AsciiString: ".rbxcdn.com/"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".RBXCDN.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTPS"
    CaseSensitive: false
