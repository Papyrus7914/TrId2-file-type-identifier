Name: FastCAD drawing (generic)
URL: "https://en.wikipedia.org/wiki/FastCAD"
FileNameExtensions: ["fcd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FCAD v"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "."
    CaseSensitive: true
  - Pos: 10
    AsciiString: " drawing file: "
    CaseSensitive: true
