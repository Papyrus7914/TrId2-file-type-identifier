Name: Maple XML Worksheet
Description: MW extension is used with file in the new XML format, from Maple 9.
URL: "https://www.maplesoft.com/"
FileNameExtensions: ["mw"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VIEW-PROPERTIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION MAJOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BACKGROUND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXECUTABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FOREGROUND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT-FIELD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WORKSHEET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FAMILY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAYOUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NORMAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROMPT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STYLES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GROUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAPLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MINOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPACE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BOLD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FONT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
