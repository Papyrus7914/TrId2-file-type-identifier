Name: Quartet samples Set
URL: "Tracker for Atari ST by Microdeal."
FileNameExtensions: ["set"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x10]
  - Pos: 2
    AsciiString: " "
    CaseSensitive: true
  - Pos: 7
    AsciiString: " \0 "
    CaseSensitive: true
  - Pos: 14
    AsciiString: " \0 "
    CaseSensitive: true
  - Pos: 21
    AsciiString: " \0 "
    CaseSensitive: true
  - Pos: 28
    AsciiString: " \0 "
    CaseSensitive: true
  - Pos: 222
    AsciiString: "2BIT"
    CaseSensitive: true
  - Pos: any
    AsciiString: "2BIT"
    CaseSensitive: false
