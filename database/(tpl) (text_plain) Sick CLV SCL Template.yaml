    AsciiString: "SCRIPT TEMPLATE $$CREATED_BY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "---------------------------"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCRIPT CLV LANGUAGE"
    CaseSensitive: false
