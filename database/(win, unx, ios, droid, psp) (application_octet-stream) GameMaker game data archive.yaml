Name: GameMaker game data archive
URL: "https://www.archiveteam.org/index.php/GameMaker_Sandbox"
FileNameExtensions: ["win", "unx", "ios", "droid", "psp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "GEN8"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GEN8"
    CaseSensitive: false
