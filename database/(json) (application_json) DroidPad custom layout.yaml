    CaseSensitive: true
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ORIENTATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GRIDSNAP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXTSIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GRIDX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GRIDY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ITEMS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ORDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
