Name: WinDaq waveform data (generic)
URL: "https://www.dataq.com/products/windaq/"
FileNameExtensions: ["wdh", "wdq", "whc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 1
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 4
    AsciiString: "n$"
    CaseSensitive: true
  - Pos: 68
    #                                                  \a    \b    \t    \n    \v    \f    \r
    Bytes: [0x00, 0x01, 0x02, 0x03, 0x04, 0x05, 0x06, 0x07, 0x08, 0x09, 0x0A, 0x0B, 0x0C, 0x0D, 0x0E, 0x0F, 0x10, 0x11, 0x12, 0x13, 0x14, 0x15, 0x16, 0x17, 0x18, 0x19, 0x1A, 0x1B, 0x1C, 0x1D, 0x1E, 0x1F]
  - Pos: any
    AsciiString: "VOLT"
    CaseSensitive: false
