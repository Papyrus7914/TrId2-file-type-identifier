Name: PGP clear text signed message
Description: Pretty Good Privacy (PGP) is a computer program that provides cryptographic privacy and authentication.
URL: "http://en.wikipedia.org/wiki/Pretty_Good_Privacy"
FileNameExtensions: ["asc", "txt"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "-----BEGIN PGP SIGNED MESSAGE-----"
    CaseSensitive: true
  - Pos: any
    AsciiString: "-----BEGIN PGP SIGNATURE-----"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-----END PGP SIGNATURE-----"
    CaseSensitive: false
