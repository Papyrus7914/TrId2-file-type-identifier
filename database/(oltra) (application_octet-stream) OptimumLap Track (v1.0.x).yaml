Name: OptimumLap Track (v1.0.x)
URL: "https://optimumg.com"
FileNameExtensions: ["oltra"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x01\x051.0."
    CaseSensitive: true
  - Pos: any
    AsciiString: "DIRECTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CIRCUIT"
    CaseSensitive: false
