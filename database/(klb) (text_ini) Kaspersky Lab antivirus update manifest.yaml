Name: Kaspersky Lab antivirus update manifest
URL: "https://en.wikipedia.org/wiki/Kaspersky_Lab"
FileNameExtensions: ["klb"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: ";This file was generated for Kaspersky Anti-Virus Update\r\n\r\n[bases]\r\n\r\n0="
    CaseSensitive: true
  - Pos: any
    AsciiString: "0XLSZNPDI71FB300E7UWJ1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BASES"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".SET"
    CaseSensitive: false
