Name: ERG Cycling Workout
URL: "https://support.trainerroad.com/hc/en-us/articles/201944204-Creating-a-Workout-from-an-ERG-or-MRC-File"
FileNameExtensions: ["erg"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "[COURSE HEADER]"
    CaseSensitive: true
  - Pos: any
    AsciiString: "END COURSE HEADER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENGLISH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MINUTES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNITS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WATTS"
    CaseSensitive: false
