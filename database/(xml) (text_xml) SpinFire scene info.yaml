    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "--GEOMETRIES INCLUDED INTO THE SCENE--"
    CaseSensitive: false
  - Pos: any
    AsciiString: "--AUTOMATICALLY GENERATED XML--"
    CaseSensitive: false
  - Pos: any
    AsciiString: "--REFERENCE FRAME LIST--"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BY ACTIFY CORPORATION--"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GEOMETRY ASSEMBLYROOT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PMIDATA LOCATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SF_3DSPACE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNITSMULTIPLIER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.ACTIFY.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XVSCENE XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "--(C)2001-20"
    CaseSensitive: false
  - Pos: any
    AsciiString: "--PMI DATA--"
    CaseSensitive: false
  - Pos: any
    AsciiString: "1.00000000"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAMESPACES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EMBEDDED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPINFIRE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XV_BUILD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFO"
    CaseSensitive: false
