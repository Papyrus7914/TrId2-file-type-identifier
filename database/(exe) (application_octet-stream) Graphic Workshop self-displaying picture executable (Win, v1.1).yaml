Name: Graphic Workshop self-displaying picture executable (Win, v1.1)
URL: "http://fileformats.archiveteam.org/wiki/Graphic_Workshop_self-displaying_picture"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 541
    AsciiString: "GWS/Windows 1.1"
    CaseSensitive: true
  - Pos: any
    AsciiString: "THIS IS A SELF EXECUTING PICTURE CREATED BY GRAPHIC WORKSHOP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$INAPPROPRIATE VIDEO CARD."
    CaseSensitive: false
  - Pos: any
    AsciiString: "NO GRAPHICS CARD AVAILABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MINDWORKS INC."
    CaseSensitive: false
  - Pos: any
    AsciiString: "FROM ALCHEMY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KEY - ALLOWS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WINDOWS 1.1"
    CaseSensitive: false
