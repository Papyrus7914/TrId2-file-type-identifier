Name: Papio-Office Cardex Layout
URL: "https://www.papio-software.com/#cardex"
FileNameExtensions: ["layout"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "# Cardex"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FIELD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
