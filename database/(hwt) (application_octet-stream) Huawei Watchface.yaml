Name: Huawei Watchface
FileNameExtensions: ["hwt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "com.huawei.watchface"
    CaseSensitive: true
  - Pos: any
    AsciiString: "COM.HUAWEI.WATCHFACE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION.XML"
    CaseSensitive: false
