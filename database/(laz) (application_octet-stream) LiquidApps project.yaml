Name: LiquidApps project
URL: "http://liquidapps.harmonia.com/"
FileNameExtensions: ["laz"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "COM.HARMONIA.DAVINCI.SWING.SWINGPLATFORMMANIFEST.PLATFORMPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".REQUIREMENTSPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".LIFECYCLEPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".LIFECYCLEU"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".RESLIBPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".COREPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".COREU"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".UIPK"
    CaseSensitive: false
