Name: Flash Authoring / source material
URL: "http://en.wikipedia.org/wiki/Adobe_Flash"
FileNameExtensions: ["fla"]
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1, 0x00]
  - Pos: any
    AsciiString: "C\0O\0N\0T\0E\0N\0T\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CPICFRAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CPICLAYER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CPICPAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "A\0G\0E"
    CaseSensitive: false
