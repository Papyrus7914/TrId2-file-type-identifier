Name: R Documentation (with rem)
URL: "https://en.wikipedia.org/wiki/R_(programming_language)"
FileNameExtensions: ["rd"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "%"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TITLE{"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME{"
    CaseSensitive: false
