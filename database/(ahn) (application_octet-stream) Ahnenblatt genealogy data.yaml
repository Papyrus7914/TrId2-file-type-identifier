Name: Ahnenblatt genealogy data
URL: "https://www.ahnenblatt.de/"
FileNameExtensions: ["ahn"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "dbk\0"
    CaseSensitive: true
