    AsciiString: "\0Ahnenblatt "
    CaseSensitive: true
  - Pos: any
    AsciiString: "SOFTWARE AHNENBLATT CREATED BY DIRK BOETTCHER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SUBM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SURN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "YYYY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_UID"
    CaseSensitive: false
