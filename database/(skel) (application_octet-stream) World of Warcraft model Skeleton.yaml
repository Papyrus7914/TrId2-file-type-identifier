Name: World of Warcraft model Skeleton
URL: "https://wowdev.wiki/M2/.skel"
FileNameExtensions: ["skel"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SKL1"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SKA1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SKB1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SKS1"
    CaseSensitive: false
