Name: MediaPlayer Classic Playlist (UTF-8)
URL: "http://sourceforge.net/projects/guliverkli/"
FileNameExtensions: ["mpcpl"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xEF\xBB\xBFMPCPLAYLIST\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FILENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
