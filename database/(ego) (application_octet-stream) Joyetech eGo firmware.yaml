Name: Joyetech eGo firmware
Description: Used by various Joyetech/Cuboid devices.
FileNameExtensions: ["ego"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        C                       d                       e                       [
    Bytes: [0x43, 0x01, 0x1E, 0x06, 0x64, 0x89, 0xAD, 0xBB, 0x65, 0xD5, 0xFF, 0xC3, 0x5B, 0x02, 0x00, 0x00, 0x00, 0x00, 0x00, 0x01]
