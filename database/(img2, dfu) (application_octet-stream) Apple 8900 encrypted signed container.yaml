Name: Apple 8900 encrypted signed container
URL: "https://www.theiphonewiki.com/wiki/S5L_File_Formats#8900"
FileNameExtensions: ["img2", "dfu"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "89001.0\x04\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "RELIANCE ON THIS CERTIFICATE BY ANY PARTY ASSUMES ACCEPTANCE OF THE THEN APPLICABLE STANDARD TERMS AND CONDITIONS OF USE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CERTIFICATE POLICY AND CERTIFICATION PRACTICE STATEMENTS."
    CaseSensitive: false
  - Pos: any
    AsciiString: ")APPLE SECURE BOOT CERTIFICATION AUTHORITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPLE CERTIFICATION AUTHORITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "S5L8900 SECURE BOOT0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPLE ROOT CA0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.APPLE.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPLE INC."
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROOT.CRL0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "89001.0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPLECA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTPS"
    CaseSensitive: false
