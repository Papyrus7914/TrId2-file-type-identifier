Name: Extensible 3D vector graphics (XML)
URL: "http://fileformats.archiveteam.org/wiki/X3D"
FileNameExtensions: ["x3d"]
MimeType: model/x3d+xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version="
    CaseSensitive: true
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCENE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "X3D P"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPEC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW."
    CaseSensitive: false
