Name: IGC VM/386 Relocatable Executable
URL: "https://en.wikipedia.org/wiki/VM/386"
FileNameExtensions: ["rex"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MR"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 10
    AsciiString: "\0\0\xFF\xFF\0\0\0\0"
    CaseSensitive: true
  - Pos: 20
    AsciiString: "\0\0\0\0\x1E\0\0\0\x01\0"
    CaseSensitive: true
