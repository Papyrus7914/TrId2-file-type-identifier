Name: PGP signature
Description: Pretty Good Privacy (PGP) is a computer program that provides cryptographic privacy and authentication.
URL: "https://en.wikipedia.org/wiki/Pretty_Good_Privacy"
FileNameExtensions: ["asc"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "-----BEGIN PGP SIGNATURE-----"
    CaseSensitive: true
  - Pos: any
    AsciiString: "-----END PGP SIGNATURE-----"
    CaseSensitive: false
