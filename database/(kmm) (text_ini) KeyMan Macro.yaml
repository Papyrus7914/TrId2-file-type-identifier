Name: KeyMan Macro
Description: Macro tool for Windows by VP-Soft.
FileNameExtensions: ["kmm"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "[General]\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CATEGORY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTROL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DETAILS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOOL"
    CaseSensitive: false
