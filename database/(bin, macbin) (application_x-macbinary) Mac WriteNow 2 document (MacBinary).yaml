Name: Mac WriteNow 2 document (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/WriteNow"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "nX^d"
    CaseSensitive: true
