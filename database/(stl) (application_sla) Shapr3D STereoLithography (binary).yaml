Name: Shapr3D STereoLithography (binary)
URL: "https://dev.opencascade.org/"
FileNameExtensions: ["stl"]
MimeType: application/sla
DetectionPatterns:
  - Pos: 0
    AsciiString: "-----------------------"
    CaseSensitive: true
  - Pos: any
    AsciiString: "----------------------- MADE WITH SHAPR3D"
    CaseSensitive: false
