Name: Teledisk Disk compressed image (normal mode)
Description: TeleDisk is am old DOS utility able to convert any diskette into a compressed file and vice-versa.
URL: "http://fileformats.archiveteam.org/wiki/TD0"
FileNameExtensions: ["td0"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "TD\0"
    CaseSensitive: true
