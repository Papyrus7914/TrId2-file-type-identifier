Name: TI-Nspire CAS OS image
URL: "http://en.wikipedia.org/wiki/Ti-Nspire"
FileNameExtensions: ["tnc"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "TI-Nspire.tnc"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TI-NSPIRE.CER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TI-NSPIRE.IMG"
    CaseSensitive: false
