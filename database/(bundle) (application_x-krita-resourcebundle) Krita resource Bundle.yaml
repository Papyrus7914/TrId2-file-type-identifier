Name: Krita resource Bundle
URL: "https://en.wikipedia.org/wiki/Krita"
FileNameExtensions: ["bundle"]
MimeType: application/x-krita-resourcebundle
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "X-KRITA-RESOURCEBUNDLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPLICATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MIMETYPE"
    CaseSensitive: false
