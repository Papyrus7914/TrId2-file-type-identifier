Name: Winzip Win32 self-extracting archive (generic)
URL: "https://en.wikipedia.org/wiki/WinZip"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: any
    AsciiString: "WINZIP SELF-EXTRACTOR"
    CaseSensitive: false
