Name: AutoCAD drawing lock
URL: "http://en.wikipedia.org/wiki/AutoCAD"
FileNameExtensions: ["dwl2"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\">"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MACHINENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATETIME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FULLNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USERNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WHPROPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
