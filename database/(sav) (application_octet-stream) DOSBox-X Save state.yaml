    AsciiString: "CMOSPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MIDIPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CPUPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DMAPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOSPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EMSPK"
    CaseSensitive: false
  - Pos: any
