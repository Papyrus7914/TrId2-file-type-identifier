Name: Soft-Logik bitmap Font
FileNameExtensions: ["10h", "12h", "14h", "14i", "18h", "24h", "36h", "dmf", "fm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "#i\0"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 44
    AsciiString: "\0"
    CaseSensitive: true
