Name: Microsoft Vista Sidebar Gadget (Zip)
URL: "http://microsoftgadgets.com/"
FileNameExtensions: ["gadget"]
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "GADGET.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".HTML"
    CaseSensitive: false
