Name: Pixelmator Pro image
URL: "https://www.pixelmator.com/pro/"
FileNameExtensions: ["pxd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "METADATA.INFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THUMBNAIL."
    CaseSensitive: false
  - Pos: any
    AsciiString: "QUICKLOOK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ICON."
    CaseSensitive: false
