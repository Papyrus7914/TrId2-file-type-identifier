Name: Alien Trilogy Map
URL: "https://www.mobygames.com/game/1267/alien-trilogy/"
FileNameExtensions: ["map"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "0000MAP0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "0000MAP0"
    CaseSensitive: false
