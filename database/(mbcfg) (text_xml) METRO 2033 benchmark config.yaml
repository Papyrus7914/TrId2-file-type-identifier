Name: METRO 2033 benchmark config
FileNameExtensions: ["mbcfg"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<bench ver=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "TEXTURE_FILTERING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TESSELATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BENCH VER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "QUALITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RES_IDX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DX_API"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FALSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PHYSX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RES_H"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RES_W"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCENE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RUNS"
    CaseSensitive: false
