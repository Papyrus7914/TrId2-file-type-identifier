Name: GeoWorks Writer scrapbook
URL: "https://en.wikipedia.org/wiki/GEOS_(16-bit_operating_system)"
FileNameExtensions: ["000"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xC7E\xCFS\x01\0\0\0"
    CaseSensitive: true
  - Pos: 20
    AsciiString: "scbk\0\0Scrp"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SCBK\0\0SCRP"
    CaseSensitive: false
