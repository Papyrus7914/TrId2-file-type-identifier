Name: OpenIV mod package
URL: "https://github.com/OpenIV-Team/OpenIV-PackageFormat"
FileNameExtensions: ["oiv"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "ASSEMBLY.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENT"
    CaseSensitive: false
