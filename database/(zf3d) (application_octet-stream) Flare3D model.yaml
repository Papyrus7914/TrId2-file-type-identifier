Name: Flare3D model
URL: "https://en.wikipedia.org/wiki/Flare3D"
FileNameExtensions: ["zf3d"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "MAIN.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".VERTEX"
    CaseSensitive: false
