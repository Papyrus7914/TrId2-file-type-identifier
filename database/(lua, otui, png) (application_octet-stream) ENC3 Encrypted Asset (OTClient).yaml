Name: ENC3 Encrypted Asset (OTClient)
Description: Encrypted game asset container used by custom OTClient/OTCv8 game servers.
URL: "https://github.com/OTCv8"
FileNameExtensions: ["lua", "otui", "png"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "ENC3"
    CaseSensitive: true
  - Pos: 14
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 18
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ENC3"
    CaseSensitive: false
