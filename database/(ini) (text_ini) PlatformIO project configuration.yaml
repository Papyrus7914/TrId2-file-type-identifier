Name: PlatformIO project configuration
URL: "https://platformio.org/"
FileNameExtensions: ["ini"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: ";"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PLEASE VISIT DOCUMENTATION FOR THE OTHER OPTIONS AND EXAMPLES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLATFORMIO PROJECT CONFIGURATION FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTRA LIBRARY STORAGES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPEED AND EXTRA FLAGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCS.PLATFORMIO.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CUSTOM UPLOAD PORT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ADVANCED OPTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECTCONF.HTML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTRA SCRIPTING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LIBRARY OPTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UPLOAD OPTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUILD OPTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOURCE FILTER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEPENDENCIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUILD FLAGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FRAMEWORK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BOARD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGE"
    CaseSensitive: false
