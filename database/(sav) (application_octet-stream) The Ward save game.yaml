Name: The Ward save game
URL: "https://www.mobygames.com/game/3255/the-ward/"
FileNameExtensions: ["sav"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "WARD"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\n\0\0"
    CaseSensitive: true
  - Pos: 71
    AsciiString: "\0\0\0\0\0\0\0\0\020010"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SECURITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CARD"
    CaseSensitive: false
