    CaseSensitive: true
  - Pos: any
    AsciiString: "KEYBOARDEVENT DOWN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KEYBOARDEVENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DELAYEVENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FALSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MACRO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRUE"
    CaseSensitive: false
