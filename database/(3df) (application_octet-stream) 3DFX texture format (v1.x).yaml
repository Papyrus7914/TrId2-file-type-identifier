Name: 3DFX texture format (v1.x)
URL: "https://en.wikipedia.org/wiki/3dfx"
FileNameExtensions: ["3df"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "3df v1."
    CaseSensitive: true
  - Pos: any
    AsciiString: "ASPECT RATIO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOD RANGE"
    CaseSensitive: false
