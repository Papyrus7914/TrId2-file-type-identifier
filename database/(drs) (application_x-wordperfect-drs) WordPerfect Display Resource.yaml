Name: WordPerfect Display Resource
URL: "https://github.com/OneWingedShark/WordPerfect/blob/master/doc/SDK_Help/FileFormats/WPFF_DocumentStructure.htm"
FileNameExtensions: ["drs"]
MimeType: application/x-wordperfect-drs
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xFFWPC"
    CaseSensitive: true
  - Pos: 8
    Bytes: [0x01, 0x14]
