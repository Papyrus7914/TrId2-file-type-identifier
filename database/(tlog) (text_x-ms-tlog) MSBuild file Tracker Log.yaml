Name: MSBuild file Tracker Log
URL: "https://docs.microsoft.com/en-us/visualstudio/extensibility/visual-cpp-project-extensibility"
FileNameExtensions: ["tlog"]
MimeType: text/x-ms-tlog
DetectionPatterns:
  - Pos: 0
    #                    ^
    Bytes: [0xFF, 0xFE, 0x5E, 0x00]
  - Pos: 5
    AsciiString: "\0:\0\\\0"
    CaseSensitive: true
