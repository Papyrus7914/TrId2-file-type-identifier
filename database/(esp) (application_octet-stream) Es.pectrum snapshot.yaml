Name: Es.pectrum snapshot
URL: "https://www.habisoft.com/espectrum"
FileNameExtensions: ["esp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "Config.ini"
    CaseSensitive: true
  - Pos: any
    AsciiString: "HARDWARE.INIPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONFIG.INIPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RAM.BINPK"
    CaseSensitive: false
