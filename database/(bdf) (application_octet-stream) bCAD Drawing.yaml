Name: bCAD Drawing
Description: CAD software by ProPro Group, Inc. for DOS and later Windows.
FileNameExtensions: ["bdf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x01\0\0\0"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0\0\0\0"
    CaseSensitive: true
  - Pos: 10
    AsciiString: "\0"
    CaseSensitive: true
