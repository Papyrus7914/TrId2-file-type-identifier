Name: AudoCAD Menu
URL: "https://en.wikipedia.org/wiki/AutoCAD"
FileNameExtensions: ["mnu"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "***"
    CaseSensitive: true
  - Pos: any
    AsciiString: "***BUTTONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "***SCREEN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ZOOM W"
    CaseSensitive: false
