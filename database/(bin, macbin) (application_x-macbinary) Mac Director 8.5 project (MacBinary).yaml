Name: Mac Director 8.5 project (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/Adobe_Director"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "MV85"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MV85"
    CaseSensitive: false
