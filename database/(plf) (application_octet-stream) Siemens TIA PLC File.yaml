Name: Siemens TIA PLC File
FileNameExtensions: ["plf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "@\0"
    CaseSensitive: true
  - Pos: 3
    AsciiString: "\0\x01\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "$$COMMIT$"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLOSE"
    CaseSensitive: false
