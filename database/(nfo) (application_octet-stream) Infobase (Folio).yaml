Name: Infobase (Folio)
URL: "http://fileformats.archiveteam.org/wiki/Folio_Infobase"
FileNameExtensions: ["nfo"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "(c) Folio Corporation 1991-"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ALL RIGHTS RESERVED."
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFOBASE"
    CaseSensitive: false
