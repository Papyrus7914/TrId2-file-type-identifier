Name: TI-Nspire OS image
URL: "http://en.wikipedia.org/wiki/Ti-Nspire"
FileNameExtensions: ["tno"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "TI-Nspire.tno"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TI-NSPIRE.CER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TI-NSPIRE.IMG"
    CaseSensitive: false
