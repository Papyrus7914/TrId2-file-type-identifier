Name: KiCad XML export
URL: "https://en.wikipedia.org/wiki/KiCad"
FileNameExtensions: ["xml"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "EXPORT VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPONENTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LIBRARIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EESCHEMA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LIBPARTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "T NUMBER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TSTAMPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESIGN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOURCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHEET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".SCH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NETS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOOL"
    CaseSensitive: false
