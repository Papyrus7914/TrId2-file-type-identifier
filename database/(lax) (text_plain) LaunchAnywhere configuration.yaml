Name: LaunchAnywhere configuration
URL: "https://docs.revenera.com/installanywhere2013/Content/helplibrary/ia_LaunchAnywhere.htm"
FileNameExtensions: ["lax"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "#"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LAX.STDERR.REDIRECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAX.STDOUT.REDIRECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COM.ZEROG.LAX.LAX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAX.MAIN.METHOD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAX.MAIN.CLASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".APPLICATION."
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAX.VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAUNCHER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INSTALL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DO NOT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAX.C"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RATED"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".DIR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JAVA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THIS"
    CaseSensitive: false
