Name: LaunchAnywhere configuration
URL: "https://docs.revenera.com/installanywhere2013/Content/helplibrary/ia_LaunchAnywhere.htm"
FileNameExtensions: ["lax"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "#"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LAX.NL.JAVA.LAUNCHER.MAIN.METHOD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAX.NL.JAVA.LAUNCHER.MAIN.CLASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAX.COMMAND.LINE.ARGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAX.APPLICATION.NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAX.NL.VALID.VM.LIST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAX.STDERR.REDIRECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAX.STDOUT.REDIRECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAX.STDIN.REDIRECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COM.ZEROG.LAX.LAX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAX.NL.CURRENT.VM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAX.MAIN.METHOD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAX.CLASS.PATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAX.MAIN.CLASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAX.USER.DIR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAX.VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ARGUMENTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".INSTALL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERTY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DO NOT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAX.R"
    CaseSensitive: false
  - Pos: any
    AsciiString: "N.VER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RATED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THIS"
    CaseSensitive: false
