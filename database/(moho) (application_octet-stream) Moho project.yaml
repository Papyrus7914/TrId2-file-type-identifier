Name: Moho project
URL: "https://en.wikipedia.org/wiki/Moho_(software)"
FileNameExtensions: ["moho"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "Project.mohoproj"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PROJECT.MOHOPROJPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PREVIEW.JPGPK"
    CaseSensitive: false
