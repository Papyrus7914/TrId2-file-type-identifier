Name: Xbox Video
URL: "http://wiki.multimedia.cx/index.php?title=XMV"
FileNameExtensions: ["xmv", "fmv", "pss"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 11
    AsciiString: "\0xobX"
    CaseSensitive: true
  - Pos: any
    AsciiString: "XOBX"
    CaseSensitive: false
