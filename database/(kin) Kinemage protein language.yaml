Name: Kinemage protein language
URL: "http://orca.st.usm.edu/~rbateman/kinemage/"
FileNameExtensions: ["kin"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "@text"
    CaseSensitive: true
  - Pos: any
    AsciiString: "KINEMAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GROUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
