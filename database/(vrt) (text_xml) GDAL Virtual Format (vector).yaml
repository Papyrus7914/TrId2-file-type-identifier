Name: GDAL Virtual Format (vector)
URL: "https://gdal.org/drivers/vector/vrt.html"
FileNameExtensions: ["vrt"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "OGRVRTDATASOURCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OGRVRTLAYER NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SRCDATASOURCE"
    CaseSensitive: false
