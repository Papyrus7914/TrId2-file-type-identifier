Name: Nokia Startup Logo Editor bitmap
URL: "http://fileformats.archiveteam.org/wiki/Nokia_Startup_Logo"
FileNameExtensions: ["nsl"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM\x02>VERS\0*Nokia Startup Logo Editor File Version 1.0MODL"
    CaseSensitive: true
  - Pos: 64
    AsciiString: "NSLD"
    CaseSensitive: true
