Name: XNA Framework Content Pipeline Binary (generic)
Description: "Generic XNA game data: fonts, images, sounds, other."
URL: "http://fileformats.archiveteam.org/wiki/Microsoft_XNA_Compiled_Format"
FileNameExtensions: ["xnb"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "XNB"
    CaseSensitive: true
