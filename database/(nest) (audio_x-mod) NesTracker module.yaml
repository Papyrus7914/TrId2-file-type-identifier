Name: NesTracker module
Description: Tracker by Ian Stocker and Kyle Sampson.
FileNameExtensions: ["nest"]
MimeType: audio/x-mod
DetectionPatterns:
  - Pos: 0
    AsciiString: "NEST"
    CaseSensitive: true
  - Pos: 32
    AsciiString: "head"
    CaseSensitive: true
  - Pos: any
    AsciiString: "WAVEFMT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ARR."
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ORDE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RIFF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAMP"
    CaseSensitive: false
