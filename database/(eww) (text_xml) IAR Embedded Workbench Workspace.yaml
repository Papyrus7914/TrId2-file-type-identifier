Name: IAR Embedded Workbench Workspace
URL: "https://en.wikipedia.org/wiki/IAR_Systems"
FileNameExtensions: ["eww"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BATCHBUILD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WORKSPACE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$WS_DIR$"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".EWP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH"
    CaseSensitive: false
