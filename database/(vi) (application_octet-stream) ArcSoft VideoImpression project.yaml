Name: ArcSoft VideoImpression project
URL: "http://en.wikipedia.org/wiki/ArcSoft"
FileNameExtensions: ["vi"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x9D\xDB\xC5&\0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".\0V\0I"
    CaseSensitive: false
