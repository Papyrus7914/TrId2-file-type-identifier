Name: PGP public key block
Description: Pretty Good Privacy (PGP) is a computer program that provides cryptographic privacy and authentication.
URL: "http://en.wikipedia.org/wiki/Pretty_Good_Privacy"
FileNameExtensions: ["asc", "aexpk", "pgp", "pub", "txt"]
MimeType: application/pgp-keys
DetectionPatterns:
  - Pos: 0
    AsciiString: "-----BEGIN PGP PUBLIC KEY BLOCK-----"
    CaseSensitive: true
  - Pos: any
    AsciiString: "-----END PGP PUBLIC KEY BLOCK-----"
    CaseSensitive: false
