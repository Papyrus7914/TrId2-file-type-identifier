    CaseSensitive: true
  - Pos: 48
    AsciiString: "Ge"
    CaseSensitive: true
  - Pos: 61
    AsciiString: " BASBN"
    CaseSensitive: true
  - Pos: 104
    AsciiString: "Ge"
    CaseSensitive: true
  - Pos: 170
    AsciiString: "BP"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BASBN"
    CaseSensitive: false
