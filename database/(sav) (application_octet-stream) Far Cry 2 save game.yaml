Name: Far Cry 2 save game
URL: "https://www.mobygames.com/game/37038/far-cry-2/"
FileNameExtensions: ["sav"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\n\0\0\0\xF3s\xAFc"
    CaseSensitive: true
  - Pos: 20
    AsciiString: "\x06\0\0\0world"
    CaseSensitive: true
  - Pos: any
    AsciiString: "WORLD"
    CaseSensitive: false
