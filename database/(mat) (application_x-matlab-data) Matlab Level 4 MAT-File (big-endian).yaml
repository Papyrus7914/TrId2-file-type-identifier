Name: Matlab Level 4 MAT-File (big-endian)
URL: "http://fileformats.archiveteam.org/wiki/MAT"
FileNameExtensions: ["mat"]
MimeType: application/x-matlab-data
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0\x03"
    CaseSensitive: true
  - Pos: 4
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "\0\0\0"
    CaseSensitive: true
