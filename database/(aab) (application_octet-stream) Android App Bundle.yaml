    CaseSensitive: false
  - Pos: any
    AsciiString: "ANDROID."
    CaseSensitive: false
  - Pos: any
    AsciiString: "ANIMATED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SUPPORT_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSIONP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_RUNTIME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VECTOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_LIVED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_VIEW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BASE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLP"
    CaseSensitive: false
