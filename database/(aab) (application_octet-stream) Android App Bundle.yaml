Name: Android App Bundle
FileNameExtensions: ["aab"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "SUPPORT-CORE-UTILS.VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SUPPORT-CORE-UI.VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LIVEDATA-CORE.VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ANDROIDMANIFEST.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIEWMODEL.VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DRAWABLE.VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FRAGMENT.VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUNDLECONFIG.PB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RUNTIME.VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPAT.VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".ARCH.CORE_"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".LIFECYCLE_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_TRANSITION"
