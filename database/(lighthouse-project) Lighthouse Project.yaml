Name: Lighthouse Project
Description: Lighthouse is a Bitcoin based fund raising platform.
URL: "https://www.vinumeris.com/lighthouse"
FileNameExtensions: ["lighthouse-project"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "_LIGHTHOUSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CROWDFUND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN"
    CaseSensitive: false
