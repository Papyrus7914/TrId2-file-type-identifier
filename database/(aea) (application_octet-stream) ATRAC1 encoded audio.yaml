Name: ATRAC1 encoded audio
URL: "https://en.wikipedia.org/wiki/Adaptive_Transform_Acoustic_Coding"
FileNameExtensions: ["aea"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\b\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DD32"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ETDD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TD33"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UDC3"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UDDD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTDC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VUTD"
    CaseSensitive: false
