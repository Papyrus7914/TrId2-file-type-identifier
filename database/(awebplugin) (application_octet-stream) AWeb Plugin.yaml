Name: AWeb Plugin
URL: "https://en.wikipedia.org/wiki/AWeb"
FileNameExtensions: ["awebplugin"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x00, 0x00, 0x03, 0xF3]
  - Pos: any
    AsciiString: "AWEBSUPPORT.LIBRARY"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".AWEBPLUGIN"
    CaseSensitive: false
