Name: SimCity 2000 save game/map data
Description: Used also in other Maxis games, like SimCopter.
URL: "https://en.wikipedia.org/wiki/SimCity_2000"
FileNameExtensions: ["sc2"]
MimeType: application/octet-stream
DetectionPatterns:
