    CaseSensitive: false
  - Pos: any
    AsciiString: "POINT NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MIDPOINT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OBJECTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HIDDEN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SECOND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TARGET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FIRST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
