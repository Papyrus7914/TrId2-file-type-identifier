Name: Arts and Letters clip art library
URL: "http://fileformats.archiveteam.org/wiki/Arts_%26_Letters_clip_art_library"
FileNameExtensions: ["yal"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "CUSTOM\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 35
    AsciiString: "\n\r"
    CaseSensitive: true
