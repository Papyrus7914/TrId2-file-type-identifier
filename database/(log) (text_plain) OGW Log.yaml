    AsciiString: "PKI-STATE - AUTHORIZEDNOTPROVISIONED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LXOADREVENTSUBSCRIBER RECEIVED DATA"
    CaseSensitive: false
