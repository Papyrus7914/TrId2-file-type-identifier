Name: Ventura Publisher Style sheet (GEM)
Description: Used in the firsts GEM versions.
URL: "https://en.wikipedia.org/wiki/Corel_Ventura"
FileNameExtensions: ["sty"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 9
    AsciiString: ":\\"
    CaseSensitive: true
  - Pos: 18
    AsciiString: "\\OUTPUT.WID\0"
    CaseSensitive: true
  - Pos: 436
    AsciiString: "\xD0\aBody Text\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "OUTPUT.WID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BODY TEXT"
    CaseSensitive: false
