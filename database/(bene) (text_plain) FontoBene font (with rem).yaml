Name: FontoBene font (with rem)
URL: "https://github.com/fontobene/fontobene"
FileNameExtensions: ["bene"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "#"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FORMAT_VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LETTER_SPACING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LINE_SPACING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FONTOBENE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LICENSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTHOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
