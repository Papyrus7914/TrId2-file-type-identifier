Name: Back-It device definition (v4)
Description: Backup software for MS-DOS by Gazelle Systems.
FileNameExtensions: ["cfg"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Gazelle Systems\r\n Backit 4 \r\n Device Definition file\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "COPYRIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".GSD"
    CaseSensitive: false
