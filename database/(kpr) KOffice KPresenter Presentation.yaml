Name: KOffice KPresenter Presentation
URL: "http://www.koffice.org/"
FileNameExtensions: ["kpr"]
DetectionPatterns:
  - Pos: 0
    #                    \b    \b
    Bytes: [0x1F, 0x8B, 0x08, 0x08]
  - Pos: 8
    AsciiString: "\0\x03KOffice application/x-kpresenter"
    CaseSensitive: true
  - Pos: any
    AsciiString: "KOFFICE APPLICATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "X-KPRESENTER"
    CaseSensitive: false
