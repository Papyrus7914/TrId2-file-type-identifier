Name: iMindMap Map
URL: "https://en.wikipedia.org/wiki/Buzan%27s_iMindMap"
FileNameExtensions: ["imx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "MAPAPPMETA.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAPAPPMETA.XMLM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THUMBNAIL.PNGPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAPMETA.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA.XMLPK"
    CaseSensitive: false
