Name: 16bit DOS EXE EXE Manager protected
Description: Exe protector by Professional Division.
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 20
    AsciiString: "\n\0"
    CaseSensitive: true
  - Pos: 25
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 27
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BY SOLAR DESIGNER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COPYRIGHT (C) 199"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXE MANAGER"
    CaseSensitive: false
