Name: vCard - Business Card (v2)
Description: with VERSION:2.1 line
URL: "https://en.wikipedia.org/wiki/VCard"
FileNameExtensions: ["vcf"]
MimeType: text/vcard
DetectionPatterns:
  - Pos: 0
    AsciiString: "BEGIN:VCARD\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VERSION:2.1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BEGIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VCARD"
    CaseSensitive: false
