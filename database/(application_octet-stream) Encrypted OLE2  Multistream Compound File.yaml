Name: Encrypted OLE2 / Multistream Compound File
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1]
  - Pos: any
    AsciiString: "DATAINTEGRITY ENCRYPTEDHMACKEY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCRYPTEDVERIFIERHASHINPUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCRYPTEDVERIFIERHASHVALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCRYPTEDKEY SPINCOUNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCHEMAS.MICROSOFT.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCRYPTEDHMACVALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCRYPTEDKEYVALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCRYPTION XMLNS"
    CaseSensitive: false
