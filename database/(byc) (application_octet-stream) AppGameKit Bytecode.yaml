Name: AppGameKit Bytecode
URL: "https://en.wikipedia.org/wiki/The_Game_Creators#AppGameKit"
FileNameExtensions: ["byc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 1
    AsciiString: "\0\0\0\x01\0\0\0"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 26
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MAIN.AGC"
    CaseSensitive: false
