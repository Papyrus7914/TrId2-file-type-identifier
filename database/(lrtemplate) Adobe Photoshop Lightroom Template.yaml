Name: Adobe Photoshop Lightroom Template
URL: "http://en.wikipedia.org/wiki/Adobe_Photoshop_Lightroom"
FileNameExtensions: ["lrtemplate"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "s = {"
    CaseSensitive: true
  - Pos: any
    AsciiString: "INTERNALNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
