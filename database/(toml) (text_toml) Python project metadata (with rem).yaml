Name: Python project metadata (with rem)
Description: Filename is pyproject.toml
URL: "https://peps.python.org/pep-0621/"
FileNameExtensions: ["toml"]
MimeType: text/toml
DetectionPatterns:
  - Pos: 0
    AsciiString: "#"
    CaseSensitive: true
  - Pos: any
    AsciiString: "REQUIRES-PYTHON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEPENDENCIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "README"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
