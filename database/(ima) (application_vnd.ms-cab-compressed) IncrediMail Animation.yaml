Name: IncrediMail Animation
URL: "http://www.incredimail.com"
FileNameExtensions: ["ima"]
MimeType: application/vnd.ms-cab-compressed
DetectionPatterns:
  - Pos: 0
    AsciiString: "MSCF\0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CONTENT.INI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ANIM.IM3"
    CaseSensitive: false
