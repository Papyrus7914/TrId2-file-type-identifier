Name: Magician raster/printer driver
Description: DOS drawing tool by DR GRAPHIC RESEARCH Pty. Ltd.
FileNameExtensions: ["rdv"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "DR01="
    CaseSensitive: true
  - Pos: any
    AsciiString: "DR 2"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DR 3"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DR 4"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DR 5"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DR 6"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DR11"
    CaseSensitive: false
