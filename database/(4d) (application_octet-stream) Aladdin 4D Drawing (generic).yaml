Name: Aladdin 4D Drawing (generic)
URL: "https://en.wikipedia.org/wiki/Aladdin4D"
FileNameExtensions: ["4d"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "AL"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ALAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NWSP"
    CaseSensitive: false
