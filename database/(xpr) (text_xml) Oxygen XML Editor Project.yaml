Name: Oxygen XML Editor Project
URL: "https://en.wikipedia.org/wiki/Oxygen_XML_Editor"
FileNameExtensions: ["xpr"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FILTERS DIRECTORYPATTERNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POSITIVEFILEPATTERNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECTTREE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHOWHIDDENFILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".XPR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "META"
    CaseSensitive: false
