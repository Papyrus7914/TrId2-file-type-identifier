Name: Spotfire Statistica workspace
URL: "https://www.spotfire.com/"
FileNameExtensions: ["sdm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1]
  - Pos: any
    AsciiString: "R\0O\0O\0T\0 \0E\0N\0T\0R\0Y"
    CaseSensitive: false
  - Pos: any
    AsciiString: "V\0A\0R\0I\0A\0B\0L\0E\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "C\0O\0N\0T\0E\0N\0T\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CANALYSISNUGGET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPECIFICATIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_ISWEBSCRIPT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VARIABLES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREATED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATEMOD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPEOFC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OBJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCHEMA"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".DMI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW."
    CaseSensitive: false
