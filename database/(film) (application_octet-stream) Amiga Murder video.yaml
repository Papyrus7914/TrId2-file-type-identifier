Name: Amiga Murder video
URL: "http://aminet.net/game/demo/"
FileNameExtensions: ["film"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "LIST"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "FILMPROP"
    CaseSensitive: true
  - Pos: 20
    AsciiString: "LISTOPGM"
    CaseSensitive: true
