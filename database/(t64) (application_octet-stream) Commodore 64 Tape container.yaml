Name: Commodore 64 Tape container
URL: "https://ist.uwaterloo.ca/~schepers/formats/T64.TXT"
FileNameExtensions: ["t64"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "C64"
    CaseSensitive: true
  - Pos: 33
    Bytes: [0x01]
  - Pos: 70
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 76
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TAPE"
    CaseSensitive: false
