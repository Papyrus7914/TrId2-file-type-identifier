Name: Plotter3D Light
Description: Amiga 3D data plotter.
FileNameExtensions: ["light"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "LGHTLSP"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LGHTLSP"
    CaseSensitive: false
