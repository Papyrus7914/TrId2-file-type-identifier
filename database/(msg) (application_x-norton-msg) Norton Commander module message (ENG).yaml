Name: Norton Commander module message (ENG)
Description: Message file is used by executable with same main name.
URL: "https://en.wikipedia.org/wiki/Norton_Commander"
FileNameExtensions: ["msg"]
MimeType: application/x-norton-msg
DetectionPatterns:
  - Pos: 0
    AsciiString: "Abort"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ATTEMPT TO WRITE ON WRITE-PROTECTED DISK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DRIVE OR DEVICE NOT READY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRINTER OUT OF PAPER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNKNOWN DISK DRIVE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ERROR ON DEVICE %"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHARING VIOLATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ERROR ON DRIVE %"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SECTOR NOT FOUND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNKNOWN COMMAND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NETWORK ERROR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NON-DOS DISK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BAD REQUEST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WRITE FAULT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA ERROR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "READ FAULT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEEK ERROR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMATTED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ABORT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FROM"
    CaseSensitive: false
