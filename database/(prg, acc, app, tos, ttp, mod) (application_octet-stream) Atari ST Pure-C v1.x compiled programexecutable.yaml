Name: Atari ST Pure-C v1.x compiled program/executable
FileNameExtensions: ["prg", "acc", "app", "tos", "ttp", "mod"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "`\x1A\0"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 10
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 14
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 18
    AsciiString: "\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 26
    AsciiString: "\0\0`"
    CaseSensitive: true
  - Pos: any
    AsciiString: "(C)88-90 BORLAND INTERNATIONAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FOR ATARI-ST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION  1."
    CaseSensitive: false
  - Pos: any
    AsciiString: "PURE-C"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$_NU"
    CaseSensitive: false
