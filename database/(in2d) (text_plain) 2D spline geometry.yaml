Name: 2D spline geometry
FileNameExtensions: ["in2d"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "splinecurves2dv2"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MATERIALS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEGMENTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POINTS"
    CaseSensitive: false
