Name: QuarkXPress Document (v4, var.2)
URL: "https://en.wikipedia.org/wiki/QuarkXPress"
FileNameExtensions: ["qxd"]
MimeType: application/vnd.quark.quarkxpress
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 4
    AsciiString: "XPR"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "A"
    CaseSensitive: true
