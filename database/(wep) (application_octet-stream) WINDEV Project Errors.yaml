Name: WINDEV Project Errors
Description: WINDEV is a RAD tool by PC Soft.
URL: "https://windev.com"
FileNameExtensions: ["wep"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PCS\0\x14\0\0\0\x05\0\f\0\0\0"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "\0\0"
    CaseSensitive: true
