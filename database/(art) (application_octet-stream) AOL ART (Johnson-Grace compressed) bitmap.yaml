Name: AOL ART (Johnson-Grace compressed) bitmap
URL: "http://fileformats.archiveteam.org/wiki/ART_(AOL_compressed_image)"
FileNameExtensions: ["art"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "JG"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0\0"
    CaseSensitive: true
