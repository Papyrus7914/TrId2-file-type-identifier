Name: GPG Keybox database
Description: version 1 and nil RFU; typically inside ~/.gnupg directory found as pubring.kbx; pubring.kbx~ and pubring.kb_ are used for temporarily/backup purposes
URL: "https://git.gnupg.org/cgi-bin/gitweb.cgi?p=gnupg.git;a=blob;f=kbx/keybox-blob.c"
FileNameExtensions: ["kbx", "kbx~", "kb_"]
MimeType: application/x-pgp-keys-database
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0\0 \x01\x01\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "KBXf\0\0\0\0"
    CaseSensitive: true
  - Pos: 24
    AsciiString: "\0\0\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "KBXF"
    CaseSensitive: false
