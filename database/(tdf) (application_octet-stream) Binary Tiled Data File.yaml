Name: Binary Tiled Data File
URL: "http://software.broadinstitute.org/software/igv/igvtools"
FileNameExtensions: ["tdf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "TDF"
    CaseSensitive: true
  - Pos: any
    AsciiString: "USERPERCENTILEAUTOSCALING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "10TH PERCENTILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "90TH PERCENTILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "98TH PERCENTILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHROMOSOMES\0CHR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "2ND PERCENTILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAXIMUM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAXZOOM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MINIMUM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENOME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MEDIAN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FLOAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MEAN"
    CaseSensitive: false
