Name: ArchiCAD Library Object
URL: "https://en.wikipedia.org/wiki/Archicad"
FileNameExtensions: ["gsm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "WW"
    CaseSensitive: true
  - Pos: 40
    AsciiString: "MYSG"
    CaseSensitive: true
  - Pos: 48
    AsciiString: "DAEH"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CSD3WW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DRAPWW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "D2WW"
    CaseSensitive: false
