Name: Duke Nukem 3D Map/level
URL: "https://en.wikipedia.org/wiki/Duke_Nukem"
FileNameExtensions: ["map"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\a\0\0\0"
    CaseSensitive: true
  - Pos: 26
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 30
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 35
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 37
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 55
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 60
    Bytes: [0xFF, 0xFF]
