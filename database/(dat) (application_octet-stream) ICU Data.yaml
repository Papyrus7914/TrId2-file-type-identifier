Name: ICU Data
Description: Typically belong to Chromium apps.
URL: "https://github.com/unicode-org/icu"
FileNameExtensions: ["dat"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 2
    AsciiString: "\xDA'\x14\0\0\0\0\0\x02\0CmnD\x01\0\0\0\x03\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CMND"
    CaseSensitive: false
