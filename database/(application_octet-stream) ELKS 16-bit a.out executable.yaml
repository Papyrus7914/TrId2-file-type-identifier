Name: ELKS 16-bit a.out executable
URL: "https://htmlpreview.github.io/?https://github.com/jbruchon/elks/blob/master/Documentation/html/technical/exe_format.html"
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x01, 0x03]
  - Pos: 3
    AsciiString: "\x04 \0\x01\0"
    CaseSensitive: true
  - Pos: 10
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 14
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 18
    AsciiString: "\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 26
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 30
    AsciiString: "\0\0"
    CaseSensitive: true
