Name: Redumper Log
URL: "https://github.com/superg/redumper/"
FileNameExtensions: ["log"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "=== "
    CaseSensitive: true
  - Pos: 8
    AsciiString: "-"
    CaseSensitive: true
  - Pos: 11
    AsciiString: "-"
    CaseSensitive: true
  - Pos: 14
    AsciiString: " "
    CaseSensitive: true
  - Pos: 17
    AsciiString: ":"
    CaseSensitive: true
  - Pos: 20
    AsciiString: ":"
    CaseSensitive: true
  - Pos: 23
    AsciiString: " ========================================================"
    CaseSensitive: true
  - Pos: any
    AsciiString: "*** END (TIME CHECK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VOLUME IDENTIFIER"
    CaseSensitive: false
