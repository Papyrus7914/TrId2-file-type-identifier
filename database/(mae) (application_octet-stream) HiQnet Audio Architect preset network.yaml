Name: HiQnet Audio Architect preset network
FileNameExtensions: ["mae"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\v\0\0\0\x0F\0\0\0MAE NetworkFile Format 1.0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MAE NETWORKFILE FORMAT 1.0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REALTIME OUTPUTDEFAULT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ADSR ENVELOPEDEFAULT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OSCILLATORDEFAULT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TCONTAINERDEFAULT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MIXERDEFAULT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTROL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EQUENC"
    CaseSensitive: false
