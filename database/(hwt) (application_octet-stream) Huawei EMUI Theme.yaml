Name: Huawei EMUI Theme
FileNameExtensions: ["hwt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "HOME_WALLPAPER_0.JPG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PREVIEW_UNLOCK_0.JPG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PREVIEW_WIDGET_0.JPG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNLOCK_WALLPAPER_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COM.ANDROID."
    CaseSensitive: false
  - Pos: any
    AsciiString: "COM.HUAWEI."
    CaseSensitive: false
  - Pos: any
    AsciiString: "THEME.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DRAWABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WEATHER"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".MEDIA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ICONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PNG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IEND"
    CaseSensitive: false
