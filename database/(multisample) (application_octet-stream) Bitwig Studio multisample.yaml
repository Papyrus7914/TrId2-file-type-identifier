Name: Bitwig Studio multisample
URL: "http://www.bitwig.com/"
FileNameExtensions: ["multisample"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "MULTISAMPLE.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".WAVPK"
    CaseSensitive: false
