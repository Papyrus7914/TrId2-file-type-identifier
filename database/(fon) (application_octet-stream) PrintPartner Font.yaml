Name: PrintPartner Font
Description: Shareware printing software for MS-DOS by Acropolis Software.
URL: "http://fileformats.archiveteam.org/wiki/PrintPartner"
FileNameExtensions: ["fon"]
MimeType: application/octet-stream
DetectionPatterns:
