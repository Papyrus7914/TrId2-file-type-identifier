Name: JAM compressed 16bit DOS executable
URL: "EXE Compressor by Eugen Vasilchenko."
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 6
    Bytes: [0x01, 0x00, 0x02, 0x00]
  - Pos: 17
    AsciiString: "\x04\0\0`\0"
    CaseSensitive: true
  - Pos: 24
    AsciiString: "\x1C\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "JAM"
    CaseSensitive: false
