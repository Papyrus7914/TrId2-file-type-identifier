Name: Mac Flash editor data (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/Adobe_Flash"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "SPA_"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SPA_"
    CaseSensitive: false
