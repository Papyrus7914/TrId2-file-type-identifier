Name: Original Sound Quality audio
Description: A proprietary lossless audio format used in Steinberg Wavelab.
URL: "http://en.wikipedia.org/wiki/Original_Sound_Quality"
FileNameExtensions: ["osq"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "OSQ "
    CaseSensitive: true
  - Pos: 56
    AsciiString: "RIFF"
    CaseSensitive: true
  - Pos: 64
    AsciiString: "WAVEfmt"
    CaseSensitive: true
  - Pos: 92
    AsciiString: "PAD "
    CaseSensitive: true
