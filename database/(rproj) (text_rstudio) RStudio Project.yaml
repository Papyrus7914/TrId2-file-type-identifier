Name: RStudio Project
URL: "https://www.rstudio.com/"
FileNameExtensions: ["rproj"]
MimeType: text/rstudio
DetectionPatterns:
  - Pos: 0
    AsciiString: "Version: 1.0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ENABLECODEINDEXING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ALWAYSSAVEHISTORY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RESTOREWORKSPACE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAVEWORKSPACE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
