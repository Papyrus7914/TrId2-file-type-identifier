Name: Palm JFile database
Description: JFile is a database format and application from Land-J Technologies.
URL: "http://www.land-j.com"
FileNameExtensions: ["pdb"]
DetectionPatterns:
  - Pos: 60
    AsciiString: "JbDbJBas"
    CaseSensitive: true
  - Pos: any
    AsciiString: "JBDBJBAS"
    CaseSensitive: false
