Name: Ardour Mackie device Profile
URL: "https://en.wikipedia.org/wiki/Ardour_(software)"
FileNameExtensions: ["profile"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MACKIEDEVICEPROFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUTTON NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUTTONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLAIN"
    CaseSensitive: false
