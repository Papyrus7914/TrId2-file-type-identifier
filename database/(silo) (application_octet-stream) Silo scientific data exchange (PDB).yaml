Name: Silo scientific data exchange (PDB)
URL: "http://fileformats.archiveteam.org/wiki/Silo"
FileNameExtensions: ["silo"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "!<<PDB:II>>!\n$"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CHAR    **COMP_NAMES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHAR    **PDB_NAMES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INTEGER NCOMPONENTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRUCT-ALIGNMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HAS-DIRECTORIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRIMITIVE-TYPES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHAR    *NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHAR    *TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_MAX_EXTENTS"
    CaseSensitive: false
