    AsciiString: "((:Emap 1)\n\t:version "
    CaseSensitive: true
  - Pos: any
    AsciiString: "BACKGROUND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NEXT_ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
