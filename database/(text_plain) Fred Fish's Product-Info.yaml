Name: Fred Fish's Product-Info
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: ".name\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".DESCRIBED-BY"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".DISTRIBUTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".SUBMITTAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".AUTHOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".SHORT"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".TYPE"
    CaseSensitive: false
