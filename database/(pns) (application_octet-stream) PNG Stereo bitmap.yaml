Name: PNG Stereo bitmap
FileNameExtensions: ["pns"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x89PNG\r\n\x1A\n\0\0\0\rIHDR"
    CaseSensitive: true
  - Pos: any
    AsciiString: "IDAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STER"
    CaseSensitive: false
