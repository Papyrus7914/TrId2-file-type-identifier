Name: VIVA Story
Description: Visual Interfaced Video Authoring, for Amiga.
FileNameExtensions: ["story"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "VIVA AMI  "
    CaseSensitive: true
  - Pos: any
    AsciiString: "*LOGIC_VARIABLE\0\0\0."
    CaseSensitive: false
  - Pos: any
    AsciiString: "LFRAME_VARIABLE\0\0\0."
    CaseSensitive: false
  - Pos: any
    AsciiString: "NCHAPT_VARIABLE\0\0\0."
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODE_VARIABLE\0\0\0\0."
    CaseSensitive: false
  - Pos: any
    AsciiString: "GRAPHICS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HPX1"
    CaseSensitive: false
