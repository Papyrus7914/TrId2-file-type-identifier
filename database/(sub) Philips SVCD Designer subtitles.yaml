Name: Philips SVCD Designer subtitles
FileNameExtensions: ["sub"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "# PHILIPS SVCD DESIGNER 1.5 - 2.0 SUBTITLES FILE\r\n#\r"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FRAMERATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTRAST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEADER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LIST"
    CaseSensitive: false
