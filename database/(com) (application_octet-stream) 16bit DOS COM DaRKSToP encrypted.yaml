Name: 16bit DOS COM DaRKSToP encrypted
Description: DOS encryptor/protector by DaRK DeSTRoYeR.
FileNameExtensions: ["com"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xFA, 0xBD]
  - Pos: 4
    Bytes: [0xFF, 0xE5]
  - Pos: any
    AsciiString: "BGZN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DARK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "V+57"
    CaseSensitive: false
