Name: Simulink Model (with revision)
Description: Simulink is a platform for multidomain simulation and Model-Based Design for dynamic systems.
URL: "https://en.wikipedia.org/wiki/Simulink"
FileNameExtensions: ["mdl"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "# $Revision"
    CaseSensitive: true
  - Pos: any
    AsciiString: "HORIZONTALALIGNMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ANNOTATIONDEFAULTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERTICALALIGNMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAPERORIENTATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BACKGROUNDCOLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FOREGROUNDCOLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$REVISION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POSITION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BLOCKDE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYSTEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOCA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NGLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ORMA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCRE"
    CaseSensitive: false
