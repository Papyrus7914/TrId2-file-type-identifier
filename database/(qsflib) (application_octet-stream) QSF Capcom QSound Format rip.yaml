Name: QSF Capcom QSound Format rip
Description: Contains ripped code + audio data.
URL: "http://fileformats.archiveteam.org/wiki/QSF"
FileNameExtensions: ["qsflib"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PSFA\0\0\0\0"
    CaseSensitive: true
  - Pos: 11
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 16
    #        x
    Bytes: [0x78, 0xDA, 0xEC]
  - Pos: any
    AsciiString: "PSFA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SSSS"
    CaseSensitive: false
