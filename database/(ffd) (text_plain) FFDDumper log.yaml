Name: FFDDumper log
URL: "http://www.neilrichards.net/sharepoint/debugging-fast-for-sharepoint-part-2-%E2%80%93-the-ffdumper-inspecting-crawled-properties"
FileNameExtensions: ["ffd"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "FFD/"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "."
    CaseSensitive: true
