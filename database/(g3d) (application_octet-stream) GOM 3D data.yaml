Name: GOM 3D data
Description: The g3d file format can be used to store several types of 3D data in a file. Used by the GOM Atos 3d scanner.
URL: "https://www.gom.com/3d-software/open-data-formats.html"
FileNameExtensions: ["g3d"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "%GOM-3DH"
    CaseSensitive: true
