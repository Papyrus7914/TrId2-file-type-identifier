Name: Sound Images DOS sound driver
URL: "http://www.vgmpf.com/Wiki/index.php/Sound_Images"
FileNameExtensions: ["bin"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xE8]
  - Pos: 2
    Bytes: [0x00, 0xCB, 0xE8]
  - Pos: 7
    AsciiString: "\xCB\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SOUND IMAGES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$MUSIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PSQRWV"
    CaseSensitive: false
  - Pos: any
    AsciiString: ")---+"
    CaseSensitive: false
