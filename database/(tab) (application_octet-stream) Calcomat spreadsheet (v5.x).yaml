Name: Calcomat spreadsheet (v5.x)
Description: Atari ST spreadsheet by Micro Application.
FileNameExtensions: ["tab"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "JLS v5."
    CaseSensitive: true
  - Pos: 68
    AsciiString: "v5"
    CaseSensitive: true
  - Pos: 72
    AsciiString: "JL"
    CaseSensitive: true
