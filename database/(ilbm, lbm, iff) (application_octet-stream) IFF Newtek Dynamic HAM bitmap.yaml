Name: IFF Newtek Dynamic HAM bitmap
Description: Amiga graphics format.
URL: "http://fileformats.archiveteam.org/wiki/ILBM"
FileNameExtensions: ["ilbm", "lbm", "iff"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "ILBM"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CTBL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DYCP"
    CaseSensitive: false
