Name: "Call of Duty: United Offensive save game"
URL: "https://www.mobygames.com/game/14973/call-of-duty-united-offensive/"
FileNameExtensions: ["svg"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x1B, 0x01, 0x00, 0x00]
  - Pos: any
    AsciiString: "GAME_DIFFICULTY_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GAME_LEVELTIME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GAME_HEALTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAVE"
    CaseSensitive: false
