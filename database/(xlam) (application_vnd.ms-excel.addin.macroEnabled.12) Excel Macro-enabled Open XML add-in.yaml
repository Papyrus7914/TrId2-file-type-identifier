Name: Excel Macro-enabled Open XML add-in
URL: "https://en.wikipedia.org/wiki/Microsoft_Excel"
FileNameExtensions: ["xlam"]
MimeType: application/vnd.ms-excel.addin.macroEnabled.12
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "SHAREDSTRINGS.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WORKBOOK.XML.RELSPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VBAPROJECT.BINPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WORKBOOK.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENT_TYPES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHEET1.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STYLES.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THEME1.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CORE.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WORKSHEETS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APP.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCPROPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_RELS"
    CaseSensitive: false
