Name: KOMPAS Drawing
URL: "https://ascon.net/solutions/kompas_3d/"
FileNameExtensions: ["cdw"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "KF"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GOST TYPE A"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_DI_D"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_KD_I"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".LYT"
    CaseSensitive: false
