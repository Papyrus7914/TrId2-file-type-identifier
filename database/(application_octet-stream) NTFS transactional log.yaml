Name: NTFS transactional log
Description: "Filename: $LogFile"
URL: "https://flatcap.github.io/linux-ntfs/ntfs/files/logfile.html"
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "RSTR"
    CaseSensitive: true
  - Pos: 144
    AsciiString: "N\0T\0F\0S\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "N\0T\0F\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RCRD"
    CaseSensitive: false
