Name: K-3D mesh (XML)
URL: "http://www.k-3d.org/"
FileNameExtensions: ["k3d"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" ?>\n<k3dml>\n\t<mesh_arrays"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MESH_ARRAYS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "K3DML"
    CaseSensitive: false
