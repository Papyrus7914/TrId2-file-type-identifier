Name: Very Ordinary Raster file format bitmap
Description: VORTFILE - A Very Ordinary raster file format library  for the Very Ordinary Rendering Tool Kit
URL: "ftp://gondwana.ecr.mu.oz.au/pub/README.vort"
FileNameExtensions: ["vort"]
