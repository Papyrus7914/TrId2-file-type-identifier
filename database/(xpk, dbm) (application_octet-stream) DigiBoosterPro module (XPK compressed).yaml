Name: DigiBoosterPro module (XPK compressed)
URL: "http://www.digibooster.de/"
FileNameExtensions: ["xpk", "dbm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "XPKF"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "SQSH"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "DBM0"
    CaseSensitive: true
  - Pos: 24
    AsciiString: "NAME"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DBM0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SQSH"
    CaseSensitive: false
