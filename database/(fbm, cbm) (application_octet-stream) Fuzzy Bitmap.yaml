Name: Fuzzy Bitmap
Description: Bitmap file format supported by FBM Library (C) 1989 by Michael Mauldin.
URL: "http://fileformats.archiveteam.org/wiki/FBM_image"
FileNameExtensions: ["fbm", "cbm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "%bitmap"
    CaseSensitive: true
