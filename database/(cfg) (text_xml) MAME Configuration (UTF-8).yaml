Name: MAME Configuration (UTF-8)
URL: "https://en.wikipedia.org/wiki/MAME"
FileNameExtensions: ["cfg"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    #                          <
    Bytes: [0xEF, 0xBB, 0xBF, 0x3C]
  - Pos: any
    AsciiString: "MAMECONFIG VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYSTEM NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
