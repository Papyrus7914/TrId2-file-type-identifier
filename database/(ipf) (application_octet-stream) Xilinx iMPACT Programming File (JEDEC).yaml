Name: Xilinx iMPACT Programming File (JEDEC)
URL: "https://en.wikipedia.org/wiki/Xilinx"
FileNameExtensions: ["ipf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "JedecChain;"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FILEREVISION(JESDXXA)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "P ACTIONCODE(CFG)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "* MODE BSFILE *"
    CaseSensitive: false
  - Pos: any
    AsciiString: "* ACTIVE MODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "* MODE BS *"
    CaseSensitive: false
  - Pos: any
    AsciiString: "* MODE SM *"
    CaseSensitive: false
  - Pos: any
    AsciiString: "* MODE SS *"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARTNAME(XC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHAINEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEVICE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODE *"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XILINX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE("
    CaseSensitive: false
