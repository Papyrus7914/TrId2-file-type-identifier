Name: AProSys composition
Description: Amiga music editor.
URL: "https://www.exotica.org.uk/wiki/AProSys"
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "XPKF"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "NUKE"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "ADRVPACK"
    CaseSensitive: true
