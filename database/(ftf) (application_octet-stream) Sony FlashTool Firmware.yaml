Name: Sony FlashTool Firmware
URL: "http://www.flashtool.net/"
FileNameExtensions: ["ftf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "KERNEL.SINPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOADER.SINPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MANIFEST.MF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "META-INF"
    CaseSensitive: false
