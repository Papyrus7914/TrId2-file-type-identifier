Name: MicroFiche Filer settings
URL: "https://www.retro-commodore.eu/2015/12/26/microfiche-manual-from-software-vision-inc/"
FileNameExtensions: ["prefs"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "VERSION "
    CaseSensitive: true
  - Pos: any
    AsciiString: "CASE_SIGNIFICANT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MEMORY_PARANOID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISP_ALL_FILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISPLAY_ORDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULT_PATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RET_VS_ENTER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUM_COLORS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SORT_ORDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WB_VS_CLI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONFIRM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_PICS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIZE"
    CaseSensitive: false
