    AsciiString: "LWIDTH:"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DECIMAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUMBERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "P_RFORM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "P_DATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TWIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "P_NUM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROUND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "P_BM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "P_LM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "P_TM"
    CaseSensitive: false
