Name: Compiled AppleScript script
Description: AppleScript is Apple's powerful and versatile native language scripting technology for Mac OS X.
URL: "http://developer.apple.com/applescript/"
FileNameExtensions: ["scpt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FasdUAS "
    CaseSensitive: true
