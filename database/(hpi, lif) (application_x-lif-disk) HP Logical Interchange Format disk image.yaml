Name: HP Logical Interchange Format disk image
URL: "https://www.hp9845.net/9845/projects/hpdir/"
FileNameExtensions: ["hpi", "lif"]
MimeType: application/x-lif-disk
DetectionPatterns:
  - Pos: 0
    Bytes: [0x80, 0x00]
  - Pos: 8
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 14
    AsciiString: "\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 20
    AsciiString: "\0"
    CaseSensitive: true
