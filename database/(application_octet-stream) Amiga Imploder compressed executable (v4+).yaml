Name: Amiga Imploder compressed executable (v4+)
URL: "https://en.wikipedia.org/wiki/Amiga_Hunk"
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x00, 0x00, 0x03, 0xF3]
  - Pos: any
    AsciiString: "I NEED EXPLODE.LIBRARY\0 V4+"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOS.LIBRARY\0CON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ERROR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ZP\0C"
    CaseSensitive: false
