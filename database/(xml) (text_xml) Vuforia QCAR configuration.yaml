Name: Vuforia QCAR configuration
URL: "https://en.wikipedia.org/wiki/Vuforia_Augmented_Reality_SDK"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "NONAMESPACESCHEMALOCATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLSCHEMA-INSTANCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMAGETARGET NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "QCAR_CONFIG.XSD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "QCARCONFIG X"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.W3.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRACKING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIZE"
    CaseSensitive: false
