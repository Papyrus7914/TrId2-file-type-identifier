Name: Quadra Composer module
URL: "http://www.exotica.org.uk/wiki/Quadra_Composer"
FileNameExtensions: ["emod"]
MimeType: audio/x-mod
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "EMODEMIC"
    CaseSensitive: true
  - Pos: any
    AsciiString: "8SMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATT"
    CaseSensitive: false
