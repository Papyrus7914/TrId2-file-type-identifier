Name: TorrentZip compressed archive
Description: TorrentZip is a replacement for MameZip.
URL: "http://rescene.wikidot.com/torrentzip"
FileNameExtensions: ["zip"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PK\x03\x04\x14\0\x02\0\b\0\0\xBC\x98!"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TORRENTZIPPED-"
    CaseSensitive: false
