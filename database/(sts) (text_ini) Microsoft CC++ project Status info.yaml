Name: Microsoft C/C++ project Status info
FileNameExtensions: ["sts"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "[shared-]\r\n\t"
    CaseSensitive: true
  - Pos: any
    AsciiString: "USE AUTO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WNDSTATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMAND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHARED-"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEBUG-"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCREEN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TARGET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PMARK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".ASM"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".EXE"
    CaseSensitive: false
