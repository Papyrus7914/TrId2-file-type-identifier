Name: ELSA HXR Font
URL: "https://en.wikipedia.org/wiki/Elsa_Technology"
FileNameExtensions: ["fnt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "ELSA XHR font file:\r\n"
    CaseSensitive: true
  - Pos: 256
    AsciiString: "FONT\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".FNT"
    CaseSensitive: false
