Name: Hedgewars add-on Package (Theme)
URL: "https://www.hedgewars.org/kb/HWPFormat"
FileNameExtensions: ["hwp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "Themes/"
    CaseSensitive: true
  - Pos: any
    AsciiString: "THEME.CFG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ICON.PNG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SKY.PNG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "2X.PNG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THEMES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IDATX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IHDR"
    CaseSensitive: false
