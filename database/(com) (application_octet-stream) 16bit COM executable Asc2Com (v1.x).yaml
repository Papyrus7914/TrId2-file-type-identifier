Name: 16bit COM executable Asc2Com (v1.x)
Description: Convert text to self contained viewer. Utility by MorganSoft.
FileNameExtensions: ["com"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xE8]
  - Pos: 3
    AsciiString: "r*"
    CaseSensitive: true
  - Pos: 18
    #              >
    Bytes: [0x80, 0x3E]
  - Pos: 22
    #              t
    Bytes: [0x00, 0x74, 0x06, 0xE8]
  - Pos: 28
    Bytes: [0xEB, 0x04, 0x90, 0xE8]
  - Pos: 34
    Bytes: [0xE8]
  - Pos: 36
    AsciiString: "\0s"
    CaseSensitive: true
  - Pos: 39
    Bytes: [0xE8]
  - Pos: 41
    Bytes: [0x01]
  - Pos: 44
    Bytes: [0xEB, 0x03, 0x90, 0xB0, 0x01]
  - Pos: any
    AsciiString: "COPYRIGHT 1989 BY MORGANSOFT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATED BY ASC2COM  V1."
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRESS ANY KEY TO CONTINUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WAIT FOR RETRACE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "2170 RAYNOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ESC TO QUIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OR 97302."
    CaseSensitive: false
  - Pos: any
    AsciiString: "COM FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "D OUTPUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ST. SE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYNTAX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USE ST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAUSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SALEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HOME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KEYS"
    CaseSensitive: false
