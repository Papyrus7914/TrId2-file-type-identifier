Name: Quartus Workspace
URL: "http://en.wikipedia.org/wiki/Altera_Quartus"
FileNameExtensions: ["qws"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "[ProjectWorkspace]\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PROJECTWORKSPACE.FRAMES.CHILDFRAMES.DOCUMENT-"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ISACTIVECHILDFRAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCUMENTCLSID"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".VIEWFRAME-0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCPATHNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCUMENT-0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PTN_CHILD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STATEMAP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FALSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRUE"
    CaseSensitive: false
