Name: Maths Helper Plus document/Template
Description: Windows math program by Teachers Choice Software.
FileNameExtensions: ["mhp", "tpl"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0\0\0MATHS HELPER PLUS\x01\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "F - PAGE ("
    CaseSensitive: false
  - Pos: any
    AsciiString: "CEMPTYSET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYMBOL"
    CaseSensitive: false
