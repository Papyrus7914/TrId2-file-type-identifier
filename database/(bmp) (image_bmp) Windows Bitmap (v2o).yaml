Name: Windows Bitmap (v2o)
Description: This variant with 16 byte DIB header instead of the 64 (OS/2 2.x)
URL: "https://en.wikipedia.org/wiki/BMP_file_format"
FileNameExtensions: ["bmp"]
MimeType: image/bmp
DetectionPatterns:
  - Pos: 0
    AsciiString: "BM"
    CaseSensitive: true
  - Pos: 14
    AsciiString: "\x10\0\0\0"
    CaseSensitive: true
