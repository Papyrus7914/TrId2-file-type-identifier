Name: Digitals/Delta Map
URL: "http://www.vingeo.com"
FileNameExtensions: ["dmf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 9
    AsciiString: " "
    CaseSensitive: true
  - Pos: 14
    AsciiString: " Version "
    CaseSensitive: true
  - Pos: 24
    AsciiString: "."
    CaseSensitive: true
  - Pos: 27
    AsciiString: " "
    CaseSensitive: true
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
