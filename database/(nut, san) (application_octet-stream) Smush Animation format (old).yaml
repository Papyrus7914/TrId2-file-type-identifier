Name: Smush Animation format (old)
Description: A LucasArts file format.
URL: "http://wiki.multimedia.cx/index.php?title=Smush"
FileNameExtensions: ["nut", "san"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "ANIM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "AHDR"
    CaseSensitive: true
