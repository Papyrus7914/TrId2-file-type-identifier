    CaseSensitive: true
  - Pos: 9
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 13
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 17
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 21
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 25
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 29
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MILLILITRE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GRAM"
    CaseSensitive: false
