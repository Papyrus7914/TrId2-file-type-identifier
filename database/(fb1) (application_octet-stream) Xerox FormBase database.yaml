Name: Xerox FormBase database
URL: "https://wiki.preterhuman.net/Xerox_FormBase"
FileNameExtensions: ["fb1"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0 "
    CaseSensitive: true
  - Pos: 3
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 26
    AsciiString: "\xFD\0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SYSTEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".FB1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGE"
    CaseSensitive: false
