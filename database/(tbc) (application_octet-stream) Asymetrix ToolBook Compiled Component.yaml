Name: Asymetrix ToolBook Compiled Component
URL: "https://en.wikipedia.org/wiki/ToolBook"
FileNameExtensions: ["tbc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x03CBT\x01\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "HDMEDIAPATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTHOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "*\0N\0K"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BOOK"
    CaseSensitive: false
