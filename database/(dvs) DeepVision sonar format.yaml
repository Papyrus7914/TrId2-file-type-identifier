Name: DeepVision sonar format
URL: "http://deepvision.se"
FileNameExtensions: ["dvs"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x01\0\0\0\xCD\xCCL>\0\0\0\0"
    CaseSensitive: true
  - Pos: 14
    Bytes: [0x00, 0x00, 0x01, 0x01, 0x8A, 0x00]
  - Pos: 26
    #              ?
    Bytes: [0xF0, 0x3F]
  - Pos: 35
    AsciiString: "?"
    CaseSensitive: true
  - Pos: 39
    AsciiString: "?"
    CaseSensitive: true
