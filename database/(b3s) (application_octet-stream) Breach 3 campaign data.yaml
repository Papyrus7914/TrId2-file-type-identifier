Name: Breach 3 campaign data
URL: "https://www.mobygames.com/game/4263/breach-3/"
FileNameExtensions: ["b3s"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x17B3C3\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LEVEL 1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MISSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".SET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "B3G5"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NONE"
    CaseSensitive: false
