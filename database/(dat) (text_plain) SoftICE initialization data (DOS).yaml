Name: SoftICE initialization data (DOS)
URL: "https://en.wikipedia.org/wiki/SoftICE"
FileNameExtensions: ["dat"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "F1 = \""
    CaseSensitive: true
  - Pos: any
    AsciiString: "COLORS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INIT"
    CaseSensitive: false
