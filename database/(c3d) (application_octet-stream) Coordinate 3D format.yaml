Name: Coordinate 3D format
URL: "https://www.c3d.org/HTML/default.htm"
FileNameExtensions: ["c3d"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #              P
    Bytes: [0x02, 0x50]
  - Pos: any
    AsciiString: "DESCRIPTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA_START"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FRAMES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LABELS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POINT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCALE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNITS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USED"
    CaseSensitive: false
