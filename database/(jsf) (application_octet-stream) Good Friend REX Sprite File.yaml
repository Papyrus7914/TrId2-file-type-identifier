Name: Good Friend REX Sprite File
Description: Used in the game Good Friend Rex by KidNkiD - Korea.
FileNameExtensions: ["jsf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "HProject Character Tool Ver 3.0\0-- Sprite File --\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".BMP"
    CaseSensitive: false
