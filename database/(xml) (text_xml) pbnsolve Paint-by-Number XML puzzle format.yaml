    AsciiString: "(C) COPYRIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULTCOLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PBN-0.3.DTD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PUZZLE TYPE"
    CaseSensitive: false
