Name: ThunderByte Antivirus Exact Id/Cleaning Info
URL: "https://en.wikipedia.org/wiki/ThunderByte_Antivirus"
FileNameExtensions: ["eci"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "This file contains Exact identification, the Cleaning driver, and\r\nInformation about the virus.\r\nCopyright "
    CaseSensitive: true
  - Pos: 111
    AsciiString: " Thunderbyte B.V.\r\n\x1A"
    CaseSensitive: true
