Name: Cabrillo Log (v2.0)
URL: "http://www.cqwpx.com/cabrillo.htm"
FileNameExtensions: ["log"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "START-OF-LOG: 2.0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CLAIMED-SCORE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ARRL-SECTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "START-OF-LOG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREATED-BY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "END-OF-LOG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPERATORS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CALLSIGN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CATEGORY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTEST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLUB"
    CaseSensitive: false
