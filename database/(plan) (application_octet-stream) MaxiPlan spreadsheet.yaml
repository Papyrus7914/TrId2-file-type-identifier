Name: MaxiPlan spreadsheet
Description: Spreadsheet for Amiga by Intuitive Technologies.
URL: "https://archive.org/details/MaxiPlan_Plus_v1.9_1988-06_Oxxi"
FileNameExtensions: ["plan"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "GLBL"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CELL"
    CaseSensitive: false
