Name: Flicker animation
Description: Amiga animation format by Silent Software, Inc.
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "LOCK\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "INSTRDIR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHANNEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOUNDFX"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".INSTR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XPOS"
    CaseSensitive: false
