Name: Houdini Random Access Texture
URL: "https://en.wikipedia.org/wiki/Houdini_(software)"
FileNameExtensions: ["rat"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "fbtH\x05\0\0\0"
    CaseSensitive: true
  - Pos: 64
    AsciiString: "x^\xED"
    CaseSensitive: true
