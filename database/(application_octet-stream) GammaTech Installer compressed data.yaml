Name: GammaTech Installer compressed data
Description: The last char of the extensions is a @.
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        N                       N                       N
    Bytes: [0x4E, 0x1B, 0x00, 0x88, 0x4E, 0x1B, 0x00, 0x88, 0x4E, 0x1B, 0x00, 0x88]
