Name: Encrypted Microsoft Office document
Description: Document inside an Office Open XML Encryption Wrapper.
URL: "https://en.wikipedia.org/wiki/Microsoft_Office"
FileNameExtensions: ["docx", "pptx", "xlsx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1]
  - Pos: any
    AsciiString: "M\0I\0C\0R\0O\0S\0O\0F\0T\0 \0E\0N\0H\0A\0N\0C\0E\0D\0 \0R\0S\0A\0 \0A\0N\0D\0 \0A\0E\0S\0 \0C\0R\0Y\0P\0T\0O\0G\0R\0A\0P\0H\0I\0C\0 \0P\0R\0O\0V\0I\0D\0E\0R"
    CaseSensitive: false
  - Pos: any
    AsciiString: "E\0N\0C\0R\0Y\0P\0T\0I\0O\0N\0I\0N\0F\0O"
    CaseSensitive: false
  - Pos: any
    AsciiString: "R\0O\0O\0T\0 \0E\0N\0T\0R\0Y"
    CaseSensitive: false
