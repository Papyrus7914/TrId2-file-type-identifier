Name: dBASE IV Form design
URL: "https://en.wikipedia.org/wiki/Dbase"
FileNameExtensions: ["frm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "dBASE IV Generic Design File Version 1.0\0\x01\a\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PAGENO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "H\0P\0X"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
