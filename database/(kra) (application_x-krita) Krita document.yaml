Name: Krita document
URL: "https://en.wikipedia.org/wiki/Krita"
FileNameExtensions: ["kra"]
MimeType: application/x-krita
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "mimetype"
    CaseSensitive: true
  - Pos: any
    AsciiString: "APPLICATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MIMETYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "X-KRITA"
    CaseSensitive: false
