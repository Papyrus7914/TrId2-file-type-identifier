Name: Oracle Help for Java mapping
URL: "http://web.archive.org/web/19990429001705/http://www.oracle.com/products/tools/ohj/format.htm"
FileNameExtensions: ["oht"]
MimeType: application/octet-stream
DetectionPatterns:
