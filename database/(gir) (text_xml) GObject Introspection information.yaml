Name: GObject Introspection information
URL: "https://wiki.gnome.org/GObjectIntrospection/"
FileNameExtensions: ["gir"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\"?>\n<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NAMESPACE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INTROSPECTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.GTK.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IDENTIFIER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REPOSITORY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CORE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
