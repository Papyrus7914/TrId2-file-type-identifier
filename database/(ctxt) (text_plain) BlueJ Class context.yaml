Name: BlueJ Class context
URL: "http://en.wikipedia.org/wiki/Bluej"
FileNameExtensions: ["ctxt"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "#BlueJ class context"
    CaseSensitive: true
  - Pos: any
    AsciiString: "COMMENT0.TARGET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUMCOMMENTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PARAMS"
    CaseSensitive: false
