Name: Twistpad Syntax highlight script
URL: "https://www.carthagosoft.net/Twistpad.php"
FileNameExtensions: ["sdf"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: ";"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SYNTAX HIGHLIGHT SCRIPT FOR TWISTPAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WHOLEWORDONLY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTENSIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYNTAXNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STARTSTOP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRIORITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPELLING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEADER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FIRST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
