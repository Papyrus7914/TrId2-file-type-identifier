Name: AdLib Visual Composer music
URL: "http://adplug.sourceforge.net/"
FileNameExtensions: ["rol"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0\x04\0"
    CaseSensitive: true
  - Pos: 182
    AsciiString: "Tempo\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VOLUME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PITCH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEMPO"
    CaseSensitive: false
