Name: OpenType Font
URL: "https://en.wikipedia.org/wiki/OpenType"
FileNameExtensions: ["otf"]
MimeType: font/otf
DetectionPatterns:
  - Pos: 0
    AsciiString: "OTTO\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CMAP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAXP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POST"
    CaseSensitive: false
