Name: FlowJo Mac Workspace
URL: "http://www.flowjo.com"
FileNameExtensions: ["jo"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "FlowJo"
    CaseSensitive: true
  - Pos: any
    AsciiString: "STATISTIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FLOWJO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CELLS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
