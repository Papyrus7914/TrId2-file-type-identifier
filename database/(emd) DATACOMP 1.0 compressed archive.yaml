Name: DATACOMP 1.0 compressed archive
Description: Seems to be a compressor by Andrew Kadatch, widely used to compress chess's tablebases
URL: "ftp://ftp.cis.uab.edu/pub/hyatt/TB/"
FileNameExtensions: ["emd"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "Compressed by DATACOMP v 1.0 (c) 1991--1998 Andrew Kadatch\r\n"
    CaseSensitive: true
