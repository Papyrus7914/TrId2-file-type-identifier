Name: Wise script
URL: "http://www.wise.com/"
FileNameExtensions: ["wse"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "Document Type: WSE"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BLOCK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ITEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
