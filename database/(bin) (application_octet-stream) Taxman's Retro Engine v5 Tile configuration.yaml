Name: Taxman's Retro Engine v5 Tile configuration
URL: "https://en.wikipedia.org/wiki/Retro_Engine"
FileNameExtensions: ["bin"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "TIL\0"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0\0\0\x010\0x\x9C\xED"
    CaseSensitive: true
