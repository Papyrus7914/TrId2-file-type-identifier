Name: Puzzle Buster Puzzle
Description: Crosswords resolver for MS-DOS by Greg Duncan.
FileNameExtensions: ["puz"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "EWIN\0"
    CaseSensitive: true
  - Pos: 1062
    AsciiString: "@EWINXCOL\0"
    CaseSensitive: true
  - Pos: 1102
    AsciiString: "@EWINXROW\0"
    CaseSensitive: true
  - Pos: 1142
    #        @
    Bytes: [0x40, 0x1A]
  - Pos: any
    AsciiString: "EWINXCOL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EWINXROW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EWINCOL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EWINROW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EWINGC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EWINGR"
    CaseSensitive: false
