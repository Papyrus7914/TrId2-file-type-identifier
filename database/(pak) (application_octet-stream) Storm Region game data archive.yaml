Name: Storm Region game data archive
Description: Used for example in the game Rush for Berlin.
URL: "https://en.wikipedia.org/wiki/StormRegion"
FileNameExtensions: ["pak"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Sr\x1A\x1C\r\n\x87\n"
    CaseSensitive: true
