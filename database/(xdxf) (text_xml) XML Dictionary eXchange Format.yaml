Name: XML Dictionary eXchange Format
URL: "https://en.wikipedia.org/wiki/XDXF"
FileNameExtensions: ["xdxf"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FROM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LANG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XDXF"
    CaseSensitive: false
