    AsciiString: "20"
    CaseSensitive: true
  - Pos: 4
    AsciiString: "-"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "-"
    CaseSensitive: true
  - Pos: 10
    AsciiString: " "
    CaseSensitive: true
  - Pos: 13
