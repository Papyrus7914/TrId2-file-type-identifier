Name: Mid Night Modeller 3D project (generic)
Description: Drawing tool for DOS by David Taylor.
FileNameExtensions: ["mnm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Mid Night Modeller "
    CaseSensitive: true
  - Pos: any
    AsciiString: "WORK FILE"
    CaseSensitive: false
