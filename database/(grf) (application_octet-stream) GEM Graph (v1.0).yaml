Name: GEM Graph (v1.0)
URL: "https://en.wikipedia.org/wiki/Graphics_Environment_Manager"
FileNameExtensions: ["grf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "+070\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GRAPH.SYM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USMAP.MAP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GRAFMAPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GRAFSYMS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "*.PRN"
    CaseSensitive: false
