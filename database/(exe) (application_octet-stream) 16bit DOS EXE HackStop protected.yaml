Name: 16bit DOS EXE HackStop protected
URL: "http://fileformats.archiveteam.org/wiki/HackStop"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0\0\0\x02\0"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "@\x01\0\0"
    CaseSensitive: true
  - Pos: 25
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "HACKSTOP 1."
    CaseSensitive: false
  - Pos: any
    AsciiString: "REGISTERED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MSDOS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROSE"
    CaseSensitive: false
