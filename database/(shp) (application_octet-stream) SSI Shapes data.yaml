Name: SSI Shapes data
Description: "Used for example in Steel Panthers and World of Aden: Thunderscape."
URL: "https://www.mobygames.com/company/80/strategic-simulations-inc/"
FileNameExtensions: ["shp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "1.10"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 10
    AsciiString: "\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 21
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 35
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 39
    AsciiString: "\0"
    CaseSensitive: true
