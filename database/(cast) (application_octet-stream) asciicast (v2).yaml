Name: asciicast (v2)
URL: "https://asciinema.org/"
FileNameExtensions: ["cast"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "{\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "TIMESTAMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHELL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TERM"
    CaseSensitive: false
