Name: Dynamix game data archive
Description: "Used in games like 3-D Ultra Minigolf, MissionForce: CyberStorm."
URL: "https://en.wikipedia.org/wiki/Dynamix"
FileNameExtensions: ["rbx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #                          \v
    Bytes: [0x9E, 0x9A, 0xA9, 0x0B]
