Name: Sandcastle Help File Builder Project
URL: "https://en.wikipedia.org/wiki/Sandcastle_(software)"
FileNameExtensions: ["shfbproj"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    #                          <
    Bytes: [0xEF, 0xBB, 0xBF, 0x3C]
  - Pos: any
    AsciiString: "-- THE CONFIGURATION AND PLATFORM WILL BE USED TO DETERMINE WHICH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ASSEMBLIES TO INCLUDE FROM SOLUTION AND PROJECT DOCUMENTATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AND ROOTNAMESPACE ARE NOT USED BY SHFB BUT VISUAL"
    CaseSensitive: false
