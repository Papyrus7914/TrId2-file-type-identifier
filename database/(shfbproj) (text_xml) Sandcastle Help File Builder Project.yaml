    AsciiString: "ORDER FOR VISUAL STUDIO TO PERFORM THE BUILD."
    CaseSensitive: false
  - Pos: any
    AsciiString: "-- THERE ARE NO PROPERTIES FOR THESE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-- IMPORT THE SHFB BUILD TARGETS --"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SANDCASTLEHELPFILEBUILDER.TARGETS"
    CaseSensitive: false
  - Pos: any
