Name: CUETools AccuRip log
URL: "http://cue.tools/wiki/CUETools_log"
FileNameExtensions: ["accurip"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "[CUETools log; Date: "
    CaseSensitive: true
  - Pos: any
    AsciiString: "ACCURATERIP ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CUETOOLS LOG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRACK PEAK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CRC32"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NULL"
    CaseSensitive: false
