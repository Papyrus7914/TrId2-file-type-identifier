Name: MatchBox puzzle
Description: Windows 3.x logic game by Bela von Hoffmann.
FileNameExtensions: ["mbx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x80, 0x02, 0x9F, 0x01]
  - Pos: any
    AsciiString: "CITEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MATCH"
    CaseSensitive: false
