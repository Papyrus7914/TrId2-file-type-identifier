Name: SAG game sound data container
Description: "Used in Gex 3D: Enter the Gecko and Hot Wheels: Stunt Track Driver."
FileNameExtensions: ["sag"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SLAG"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "WAVEfmt "
    CaseSensitive: true
  - Pos: 36
    AsciiString: "data"
    CaseSensitive: true
  - Pos: any
    AsciiString: "WAVEFMT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
