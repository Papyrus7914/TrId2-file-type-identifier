Name: CAMtastic Aperture Wizard template
URL: "https://techdocs.altium.com/display/ADRR/CAMtastic"
FileNameExtensions: ["awr"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "[APTWIZ]\r\nExtension="
    CaseSensitive: true
  - Pos: any
    AsciiString: "MOVETOADDITIONAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOTALSHAPES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LINEFORMAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENDSHAPE1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTENSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MULTIPLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEARCH1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SSVAL1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STOPAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EDIT1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCALE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNITS"
    CaseSensitive: false
