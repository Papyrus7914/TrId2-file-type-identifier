Name: GameZ pre-compiled animation definitions
URL: "https://www.pcgamingwiki.com/wiki/Engine:GameZ"
FileNameExtensions: ["zbd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #                          \b
    Bytes: [0x16, 0x06, 0x17, 0x08]
  - Pos: 10
    AsciiString: "\0\0..\\"
    CaseSensitive: true
  - Pos: 96
    AsciiString: "..\\data\\common\\zrdr\\"
    CaseSensitive: true
  - Pos: any
    AsciiString: "RESET_SEQUENCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_ANIMATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_NODE_NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENVMODELS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ACTIVATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CAMERA_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EFFECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FIRST_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCALE_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "START_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_LIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CALL_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MOVE_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_FADE"
    CaseSensitive: false
