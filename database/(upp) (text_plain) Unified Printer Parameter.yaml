Name: Unified Printer Parameter
Description: Configuration file for Uniprint, a printer module used by Ghostscript.
URL: "https://en.wikipedia.org/wiki/Ghostscript"
FileNameExtensions: ["upp"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "-supModel=\""
    CaseSensitive: true
