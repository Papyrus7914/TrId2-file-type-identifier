Name: Minecraft Resource Pack info (UTF-8)
FileNameExtensions: ["mcmeta"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #                          {
    Bytes: [0xEF, 0xBB, 0xBF, 0x7B]
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PACK_FORMAT"
    CaseSensitive: false
