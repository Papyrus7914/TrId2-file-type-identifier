Name: Mac Unix tar archive (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/Tar_(computing)"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "TARF"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TARF"
    CaseSensitive: false
