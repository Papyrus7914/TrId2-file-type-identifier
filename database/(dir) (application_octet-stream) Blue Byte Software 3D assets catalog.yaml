Name: Blue Byte Software 3D assets catalog
Description: Used in games like Extreme Assault, Incubation serie
URL: "https://www.mobygames.com/company/389/ubisoft-dusseldorf/"
FileNameExtensions: ["dir"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "3DI\r\n[DIRECTORY]\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "END3DI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENDDIR"
    CaseSensitive: false
