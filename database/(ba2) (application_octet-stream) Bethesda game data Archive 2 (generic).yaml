Name: Bethesda game data Archive 2 (generic)
Description: Used for example in Fallout 4, Starfield.
URL: "https://en.wikipedia.org/wiki/Bethesda_Softworks"
FileNameExtensions: ["ba2"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "BTDX"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0\0\0"
    CaseSensitive: true
