Name: PSGMOD module
FileNameExtensions: ["psgmod"]
MimeType: audio/x-mod
DetectionPatterns:
  - Pos: 0
    AsciiString: "PSGMOD-2HEAD"
    CaseSensitive: true
  - Pos: any
    AsciiString: "INFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATT"
    CaseSensitive: false
