Name: 16bit Win EXE PACKWIN compressed
URL: "http://fileformats.archiveteam.org/wiki/PACKWIN"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 3
    AsciiString: "\x01\x03\0\0\0\x04\0"
    CaseSensitive: true
  - Pos: 11
    Bytes: [0x00, 0xFF, 0xFF]
  - Pos: 15
    AsciiString: "\0\x80\0\x11e\x10\0"
    CaseSensitive: true
  - Pos: 23
    AsciiString: "\0\x1C\0\x01\0\0\0YRZLITE (C) 1993 WYellow Rose\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "*OLANGLOAD -- ERROR IN LOADING MODULE\0WINDEBUG\0WINNOTIFY\0\0\0\0\0\0\0U"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNKNOWN RELOCATION TYPE FOUND.\0U"
    CaseSensitive: false
  - Pos: any
    AsciiString: "YRZLITE (C) 1993 WYELLOW ROSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KERNEL"
    CaseSensitive: false
