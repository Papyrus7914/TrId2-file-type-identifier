Name: Pileup format
URL: "https://en.wikipedia.org/wiki/Pileup_format"
FileNameExtensions: ["pileup"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "seq"
    CaseSensitive: true
  - Pos: 4
    AsciiString: " "
    CaseSensitive: true
  - Pos: 8
    AsciiString: " "
    CaseSensitive: true
  - Pos: 10
    AsciiString: " "
    CaseSensitive: true
  - Pos: 13
    AsciiString: "  "
    CaseSensitive: true
