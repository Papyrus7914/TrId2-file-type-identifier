Name: nPassword DataBank (w/o password)
Description: Portable assword manger.
URL: "http://zeraha.org/"
FileNameExtensions: ["npw"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version='1.0' encoding='ISO-8859-1' ?>\r\n<dataroot>\r\n  <settings>\r\n    <NextNodeID>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DEFAULTFOLDERIMAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULTDOCIMAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATABASENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LASTPOSITION"
    CaseSensitive: false
