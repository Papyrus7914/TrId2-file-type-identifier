Name: 16bit DOS EXE cIPHATOR protected (v4.6)
Description: DOS Executable protector by MARQUIS DE SOIREE.
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 16
    Bytes: [0x1E, 0x13]
  - Pos: 21
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 25
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CIPHATOR - (C)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TLOSS ERROR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MARQUIS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CIPH46"
    CaseSensitive: false
  - Pos: any
    AsciiString: "1996"
    CaseSensitive: false
