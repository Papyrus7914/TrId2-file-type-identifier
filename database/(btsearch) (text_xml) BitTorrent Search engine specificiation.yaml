Name: BitTorrent Search engine specificiation
URL: "http://www.bittorrent.org/beps/bep_0018.html"
FileNameExtensions: ["btsearch"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "OPENSEARCHDESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "URL TEMPLATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHORTNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TORRENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
