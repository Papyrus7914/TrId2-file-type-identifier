Name: Apple Application Information Table
FileNameExtensions: ["ibcc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "ibcc\f\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "IGNOREANCHORPOINTFORPOSITION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MOUSEENABLED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOUCHENABLED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENTSIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CCLAYER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCALE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IBCC"
    CaseSensitive: false
