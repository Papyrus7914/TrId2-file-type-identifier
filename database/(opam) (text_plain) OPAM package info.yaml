Name: OPAM package info
Description: OCaml Package Manager.
URL: "https://opam.ocaml.org/"
FileNameExtensions: ["opam"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "opam-version: \""
    CaseSensitive: true
  - Pos: any
    AsciiString: "BUG-REPORTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAINTAINER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUILD"
    CaseSensitive: false
