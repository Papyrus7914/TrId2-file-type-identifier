Name: Bitiverse Studio Runtime settings
URL: "https://fortisq.itch.io/bitiverse-studio"
FileNameExtensions: ["json"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "{\r\n  \"runtimeTarget\": {\r\n    \"name\": \""
    CaseSensitive: true
  - Pos: any
    AsciiString: "BITIVERSESTUDIO.RUNTIME.DLL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BITIVERSESTUDIO.STORAGE.DLL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BITIVERSESTUDIO.EXPORT.DLL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BITIVERSESTUDIO.CORE.DLL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LIBRARIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIGNATURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HASHPATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RUNTIMES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PACKAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TARGETS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHA512"
    CaseSensitive: false
