Name: Noteful notes
URL: "https://www.getnoteful.com/"
FileNameExtensions: ["noteful"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #                                                                          ␠
    Bytes: [0xAA, 0xBB, 0xCC, 0xDE, 0x00, 0x01, 0x00, 0x05, 0x00, 0x00, 0x00, 0x20]
  - Pos: 44
    AsciiString: "\0\x02\0\x02\0\0\0\0\0\0\0\0\0\x03\b\x05\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CDEFGHIJSTUVWXYZCDEFGHIJSTUVWXYZ"
    CaseSensitive: false
  - Pos: any
    AsciiString: "8PHOTOSHOP 3.0\08BIM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXIF\0\0MM\0*"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAYER 1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$3BR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JFIF"
    CaseSensitive: false
