Name: Ashampoo products translation
Description: name PRODUCTNAME-LANGUAGEID.ashLang like AutorunEditor-de-de.ashLang used by products like Ashampoo Burning Studio, Ashampoo Media Player to show messages in selected language.
URL: "https://github.com/RealAshampoo/Ashampoo-Translation-Systems/blob/main/README.md"
FileNameExtensions: ["ashlang"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "URESFILE"
    CaseSensitive: true
  - Pos: 11
    AsciiString: "\0\0\0\0\0lang"
    CaseSensitive: true
  - Pos: 21
    AsciiString: "\0\0\0\0\0\0\0\x06\0\0\0"
    CaseSensitive: true
  - Pos: 33
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 35
    AsciiString: "\0-\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "A\0S\0H\0_\0L\0A\0N\0G\0_\0C\0R\0E\0A\0T\0I\0O\0N\0_\0T\0O\0O\0L\0_\0V\0E\0R\0S\0I\0O\0N"
    CaseSensitive: false
  - Pos: any
    AsciiString: "A\0S\0H\0A\0M\0P\0O\0O"
    CaseSensitive: false
  - Pos: any
    AsciiString: "URESFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "C\0O\0M"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LANG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XDID"
    CaseSensitive: false
