Name: Cybiko Application
URL: "https://en.wikipedia.org/wiki/Cybiko"
FileNameExtensions: ["app"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Cy"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ROOT.INF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN.E"
    CaseSensitive: false
