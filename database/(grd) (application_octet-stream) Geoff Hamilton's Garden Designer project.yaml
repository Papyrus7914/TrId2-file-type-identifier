Name: Geoff Hamilton's Garden Designer project
FileNameExtensions: ["grd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1]
  - Pos: any
    AsciiString: "R\0O\0O\0T\0 \0E\0N\0T\0R\0Y"
    CaseSensitive: false
  - Pos: any
    AsciiString: "C\0O\0N\0T\0E\0N\0T\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CGARDENELLIPSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CGARDENCURVE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIBVIDEO"
    CaseSensitive: false
