Name: Psygnosis Video
Description: Used on Bram Stoker's Dracula for the Sega CD console.
URL: "https://wiki.multimedia.cx/index.php?title=VID"
FileNameExtensions: ["vid"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORMPSYGxxxxSANM"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SAUD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SBIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SMAP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPAL"
    CaseSensitive: false
