  - Pos: any
    AsciiString: "(MASTERLAYER 1) LN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%AI5_FILEFORMAT 3"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%AI5_BEGINLAYER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%AI5_ENDLAYER--"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(NEW LAYER) LN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%%BEGINPROLOG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%%BOUNDINGBOX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%%ENDCOMMENTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%%BEGINSETUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%%ENDPROLOG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%%ENDSETUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%%CREATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%%TRAILER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%%EOF"
    CaseSensitive: false
