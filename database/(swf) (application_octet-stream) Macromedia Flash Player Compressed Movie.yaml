Name: Macromedia Flash Player Compressed Movie
Description: Compression has been added as an option since Macromedia Flash MX.
URL: "https://en.wikipedia.org/wiki/Macromedia"
FileNameExtensions: ["swf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "CWS"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "x"
    CaseSensitive: true
