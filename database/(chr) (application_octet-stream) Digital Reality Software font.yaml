Name: Digital Reality Software font
URL: "https://en.wikipedia.org/wiki/Digital_Reality"
FileNameExtensions: ["chr"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "INFO"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "_000.TGA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFO"
    CaseSensitive: false
