Name: Corel Xara Web document
URL: "http://fileformats.archiveteam.org/wiki/Xar_(vector_graphics)"
FileNameExtensions: ["web"]
MimeType: application/vnd.xara
DetectionPatterns:
  - Pos: 0
    AsciiString: "XARA\xA3\xA3\r\n"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "CXW"
    CaseSensitive: true
