Name: Aml Pages Theme/skin
Description: Tree-structured notes manager for Windows by Mazov Gosha.
URL: "https://web.archive.org/web/20120126045920/http://amlpages.com/download.shtml"
FileNameExtensions: ["aptheme"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "SKINDATAUT"
    CaseSensitive: false
