    CaseSensitive: true
  - Pos: any
    AsciiString: "CHRM\0\0Z"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GAMA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IDAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SRGB"
    CaseSensitive: false
