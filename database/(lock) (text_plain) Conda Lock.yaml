Name: Conda Lock
URL: "https://en.wikipedia.org/wiki/Conda_(package_manager)"
FileNameExtensions: ["lock"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "# Generated by conda-lock."
    CaseSensitive: true
  - Pos: any
    AsciiString: "GENERATED BY CONDA-LOCK."
    CaseSensitive: false
  - Pos: any
    AsciiString: ".ANACONDA."
    CaseSensitive: false
  - Pos: any
    AsciiString: "INPUT_HASH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXPLICIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLATFORM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
