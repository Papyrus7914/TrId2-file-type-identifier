Name: LightWave 3D saver Capability info
URL: "https://en.wikipedia.org/wiki/LightWave_3D"
FileNameExtensions: ["cap"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "# Capabilities of the "
    CaseSensitive: true
  - Pos: any
    AsciiString: "ALL RIGHTS RESERVED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LONGMODULENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLORSPACES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ANIMATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COPYRIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTENSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEVICE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ALPHA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FALSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAVER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIZES"
    CaseSensitive: false
