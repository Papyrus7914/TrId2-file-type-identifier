Name: Plugger encoded MP3 audio
FileNameExtensions: ["mp3"]
MimeType: audio/mpeg3
DetectionPatterns:
  - Pos: 0
    Bytes: [0xFF, 0xFB]
  - Pos: 4
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 11
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 19
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 131
    Bytes: [0xFF]
  - Pos: 261
    Bytes: [0xFF]
  - Pos: 392
    Bytes: [0xFF]
  - Pos: 653
    Bytes: [0xFF]
