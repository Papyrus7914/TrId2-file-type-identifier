Name: Zing! directory info
Description: Zing! is an Amiga file manager, using his own .fastdir like files.
FileNameExtensions: ["zing"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "<dir> Creation Date: "
    CaseSensitive: true
  - Pos: 23
    AsciiString: "/"
    CaseSensitive: true
  - Pos: 26
    AsciiString: "/"
    CaseSensitive: true
  - Pos: 29
    AsciiString: " "
    CaseSensitive: true
  - Pos: 32
    AsciiString: ":"
    CaseSensitive: true
  - Pos: 35
    AsciiString: ":"
    CaseSensitive: true
  - Pos: 38
    AsciiString: ".\n"
    CaseSensitive: true
