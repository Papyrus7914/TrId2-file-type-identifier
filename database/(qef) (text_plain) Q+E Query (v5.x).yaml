Name: Q+E Query (v5.x)
Description: Database utility by Pioneer Software.
FileNameExtensions: ["qef"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "Q+E 5."
    CaseSensitive: true
  - Pos: any
    AsciiString: "SELECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FROM"
    CaseSensitive: false
