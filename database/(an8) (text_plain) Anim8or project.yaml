Name: Anim8or project
URL: "http://www.anim8or.com"
FileNameExtensions: ["an8"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "header {"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VERSION {"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUILD {"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NT {"
    CaseSensitive: false
