Name: 256 Color palette
Description: "Used in various games: Dark Legion, Cyclemania."
URL: "https://moddingwiki.shikadi.net/wiki/COL_Format_(Dark_Legions)"
FileNameExtensions: ["col"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\b\x03\0\0#\xB1\0\0"
    CaseSensitive: true
