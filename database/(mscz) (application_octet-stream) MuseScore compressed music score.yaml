Name: MuseScore compressed music score
URL: "http://en.wikipedia.org/wiki/MuseScore"
FileNameExtensions: ["mscz"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "CONTAINER.XMLPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "META-INF"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".MSCXPK"
    CaseSensitive: false
