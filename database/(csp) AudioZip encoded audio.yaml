Name: AudioZip encoded audio
URL: "http://www.rjamorim.com/rrw/audiozip.html"
FileNameExtensions: ["csp"]
DetectionPatterns:
  - Pos: 0
    Bytes: [0x01, 0x01]
  - Pos: 23
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 27
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 31
    AsciiString: "\0"
    CaseSensitive: true
