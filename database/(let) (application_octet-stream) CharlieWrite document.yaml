Name: CharlieWrite document
Description: Part of the Hello Charlie MS-DOS suite by Orion Software.
URL: "https://winworldpc.com/product/hello-charlie/1984"
FileNameExtensions: ["let"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xFF, 0x00]
  - Pos: 31
    AsciiString: "\0d\0d\0d\0B\0\x06\0\x06\0\x01\0\x01\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "D\0D\0D\0B"
    CaseSensitive: false
