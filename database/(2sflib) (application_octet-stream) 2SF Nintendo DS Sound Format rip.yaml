Name: 2SF Nintendo DS Sound Format rip
Description: Contains ripped code + audio data.
URL: "http://fileformats.archiveteam.org/wiki/2SF"
FileNameExtensions: ["2sflib"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PSF$\0\0\0\0"
    CaseSensitive: true
  - Pos: 11
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 16
    #        x
    Bytes: [0x78, 0xDA, 0xEC]
  - Pos: 21
    #        x
    Bytes: [0x78, 0x14]
  - Pos: 24
    Bytes: [0xD6]
