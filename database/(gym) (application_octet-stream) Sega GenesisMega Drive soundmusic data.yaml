Name: Sega Genesis/Mega Drive sound/music data
Description: Format introduced by the Genecyst emulator consisting of a simple raw data log.
URL: "http://fileformats.archiveteam.org/wiki/GYM"
FileNameExtensions: ["gym"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "GYMX"
    CaseSensitive: true
