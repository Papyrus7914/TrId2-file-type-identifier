Name: FDI package
Description: FreeDOS Installer package.
URL: "http://up.lod.bz/FDIMPLES/"
FileNameExtensions: ["zip"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "APPINFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".LSMUT"
    CaseSensitive: false
