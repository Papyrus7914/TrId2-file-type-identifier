Name: KVIrc theme info
URL: "https://www.kvirc.net/"
FileNameExtensions: ["kvc"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "# KVIrc configuration file"
    CaseSensitive: true
  - Pos: any
    AsciiString: "THEMEENGINEVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPLICATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THEMEINFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTHOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
