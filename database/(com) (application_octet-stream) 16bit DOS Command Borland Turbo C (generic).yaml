Name: 16bit DOS Command Borland Turbo C (generic)
URL: "https://en.wikipedia.org/wiki/Borland_Turbo_C"
FileNameExtensions: ["com"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #                    .                                   0           !           .                             ,
    Bytes: [0x8C, 0xCA, 0x2E, 0x89, 0x16, 0xD6, 0x02, 0xB4, 0x30, 0xCD, 0x21, 0x8B, 0x2E, 0x02, 0x00, 0x8B, 0x1E, 0x2C, 0x00, 0x8E, 0xDA, 0xA3]
  - Pos: any
    AsciiString: "TURBO-C - COPYRIGHT (C) 1988 BORLAND INTL.\0DIVIDE ERROR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ABNORMAL PROGRAM TERMINATION"
    CaseSensitive: false
