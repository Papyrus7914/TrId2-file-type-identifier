Name: Multiple Resolution Bitmap
Description: Used in WinHelp files. Often confused with Segmented Hypergraphics (SHG).
URL: "http://fileformats.archiveteam.org/wiki/Segmented_Hypergraphics"
FileNameExtensions: ["mrb"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "lP"
    CaseSensitive: true
