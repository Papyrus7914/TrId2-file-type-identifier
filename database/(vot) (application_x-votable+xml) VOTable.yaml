    CaseSensitive: false
  - Pos: any
    AsciiString: "RESOURCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VOTABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FIELD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
