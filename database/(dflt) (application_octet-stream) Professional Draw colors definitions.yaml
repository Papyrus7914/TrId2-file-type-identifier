Name: Professional Draw colors definitions
Description: Amiga drawing program.
FileNameExtensions: ["dflt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PPCF"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "COLR"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "CNAM"
    CaseSensitive: true
