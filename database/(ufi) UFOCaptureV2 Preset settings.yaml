    AsciiString: "VERSION"
    CaseSensitive: true
  - Pos: 24
    AsciiString: "IF.singlefilemo"
    CaseSensitive: true
  - Pos: 48
    AsciiString: "IF.resize"
    CaseSensitive: true
  - Pos: 72
    AsciiString: "IF.cxin"
    CaseSensitive: true
  - Pos: 96
    AsciiString: "IF.cyin"
    CaseSensitive: true
  - Pos: 120
    AsciiString: "IF.cy"
    CaseSensitive: true
  - Pos: 144
    AsciiString: "IF.cx"
    CaseSensitive: true
  - Pos: 168
    AsciiString: "IF.fps"
    CaseSensitive: true
  - Pos: 196
    AsciiString: "IF.fs_head"
    CaseSensitive: true
  - Pos: 220
    AsciiString: "IF.fs_tail"
    CaseSensitive: true
