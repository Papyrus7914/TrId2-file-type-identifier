Name: Microsoft Developer Studio Project
URL: "https://en.wikipedia.org/wiki/Microsoft_Visual_Studio"
FileNameExtensions: ["mdp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "JSG0\x03\0\x04\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "WATCH1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEBUG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIN32"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".MAK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MLJL"
    CaseSensitive: false
