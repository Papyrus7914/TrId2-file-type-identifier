Name: LocoScript printer Driver
URL: "https://en.wikipedia.org/wiki/LocoScript"
FileNameExtensions: ["drv"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "DRV\x04\x01"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LOCOMOTIVE SOFTWARE LTD."
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRINTER DRIVER"
    CaseSensitive: false
