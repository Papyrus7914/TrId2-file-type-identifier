Name: QSEQ project
Description: Quick SEQuencer, by Hbsk.
URL: "http://hbskmidi.free.fr/"
FileNameExtensions: ["qsq"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "QSEQ"
    CaseSensitive: true
  - Pos: any
    AsciiString: "COMMENTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTHOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DRUM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GEAR"
    CaseSensitive: false
