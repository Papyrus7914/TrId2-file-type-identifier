Name: SuperWorks dictionary
Description: Old DOS office suite by SIBIT / Remarkable Technologies.
FileNameExtensions: ["sw3"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SIBIT DC "
    CaseSensitive: true
  - Pos: 10
    AsciiString: "."
    CaseSensitive: true
