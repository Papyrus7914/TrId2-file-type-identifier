Name: Computer Muzys Font
Description: MIDI sequencer by muon-software / Computer Music Magazine.
FileNameExtensions: ["ift"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "IMS!FONT"
    CaseSensitive: true
  - Pos: 692
    AsciiString: "data"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
