    AsciiString: "AUTO_INDENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FONT_NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FONT_SIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TAB_WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USE_TABS"
    CaseSensitive: false
