    AsciiString: "EDITOR_FONT_NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EDITOR_FONT_SIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHOW_DIAGNOSTICS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTO_COMPLETION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAX_LINE_LENGTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REMEMBER_RECENT"
