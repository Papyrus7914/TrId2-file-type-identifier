Name: SFVManager checksum (v1.x)
URL: "https://en.wikipedia.org/wiki/Simple_file_verification"
FileNameExtensions: ["sfv"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: ";"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GENERATED BY SFVMANAGER V1."
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.TRICEPTUAL.CO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
