  - Pos: any
    AsciiString: "USER_VOLUMEGAIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USER_MODIFIED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USER_OFFSET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAMPLERATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VOLUMEGAIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USER_BPM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OFFSET"
    CaseSensitive: false
