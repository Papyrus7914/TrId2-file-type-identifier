Name: OpenOffice Extension
URL: "http://en.wikipedia.org/wiki/OpenOffice"
FileNameExtensions: ["oxt"]
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "DESCRIPTION.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MANIFEST.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "META-INF"
    CaseSensitive: false
