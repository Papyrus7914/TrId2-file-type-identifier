    AsciiString: "<?xml version=\"1.0\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "ENCRYPTIONMETHOD ALGORITHM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCTYPE DTBOOK SYSTEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCRYPTEDDATA XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML-STYLESHEET TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DAISYTRANSFORM.XSL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DTBOOK-2005-3.DTD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCRYPTEDDATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CIPHERVALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
