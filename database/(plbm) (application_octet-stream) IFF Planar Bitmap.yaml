Name: IFF Planar Bitmap
Description: Obsolete Amiga format, precusor of ILBM.
URL: "https://wiki.multimedia.cx/index.php?title=IFF"
FileNameExtensions: ["plbm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "PLBMBMHD"
    CaseSensitive: true
