Name: Keynote presentation
URL: "http://en.wikipedia.org/wiki/Keynote_(presentation_software)"
FileNameExtensions: ["key"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "BUILDVERSIONHISTORY.PLISTPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERT"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".JPGPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INDEX."
    CaseSensitive: false
  - Pos: any
    AsciiString: "AIL."
    CaseSensitive: false
