Name: Vivid DiffSet (UTF-8)
URL: "https://github.com/oderby/VVD"
FileNameExtensions: ["dsx"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    #                          <
    Bytes: [0xEF, 0xBB, 0xBF, 0x3C]
  - Pos: any
    AsciiString: "NODECHANGE INSTANCEGUID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PORTCHANGE INSTANCEGUID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EDGECHANGE DSTGUID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARENTGUID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIFFSET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SRCGUID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STATUS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ADDED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
