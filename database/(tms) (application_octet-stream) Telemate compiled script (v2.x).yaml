Name: Telemate compiled script (v2.x)
Description: Telemate is a DOS communication program (used for example for accessing a BBS using a modem).
URL: "https://www.thealmightyguru.com/Wiki/index.php?title=Telemate"
FileNameExtensions: ["tms"]
