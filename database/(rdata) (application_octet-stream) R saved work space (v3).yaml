Name: R saved work space (v3)
Description: R is a language and environment for statistical computing and graphics. It is a GNU project which is similar to the S language and environment which was developed at Bell Laboratories.
URL: "https://en.wikipedia.org/wiki/R_(programming_language)"
FileNameExtensions: ["rdata"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "RDX3\n"
    CaseSensitive: true
