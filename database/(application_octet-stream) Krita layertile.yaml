Name: Krita layer/tile
URL: "https://community.kde.org/Krita/Tile_Data_Format"
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "VERSION 2\nTILEWIDTH "
    CaseSensitive: true
  - Pos: any
    AsciiString: "TILEHEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PIXELSIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TILEWIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
