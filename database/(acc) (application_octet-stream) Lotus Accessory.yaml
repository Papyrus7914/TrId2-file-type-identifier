Name: Lotus Accessory
Description: Used by Agenda, Metro, etc.
URL: "https://en.wikipedia.org/wiki/Lotus_Software"
FileNameExtensions: ["acc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "KD"
    CaseSensitive: true
  - Pos: 12
    #        \a
    Bytes: [0x07, 0x00, 0x14, 0x01]
  - Pos: 20
    Bytes: [0xFC, 0xE9]
  - Pos: 24
    Bytes: [0xE9]
  - Pos: any
    AsciiString: "LOTUS DEVELOPMENT CORPORATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COPYRIGHT (C) 1984"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ANY KEY TO CONT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRESS ESC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MENU"
    CaseSensitive: false
  - Pos: any
    AsciiString: "QUIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
