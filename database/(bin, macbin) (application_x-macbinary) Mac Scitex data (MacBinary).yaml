Name: Mac Scitex data (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/Scailex_Corporation"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "..CT"
    CaseSensitive: true
  - Pos: any
    AsciiString: "..CT"
    CaseSensitive: false
