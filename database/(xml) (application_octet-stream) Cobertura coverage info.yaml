Name: Cobertura coverage info
URL: "https://github.com/cobertura/cobertura"
FileNameExtensions: ["xml"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "COBERTURA.SOURCEFORGE.NET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCTYPE COVERAGE SYSTEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONDITION-COVERAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COVERAGE LINE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PACKAGE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BRANCH-RATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LINE NUMBER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "METHOD NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLASS NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPLEXITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COVERAGE-0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LINE-RATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIGNATURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TIMESTAMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PACKAGES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLASSES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "METHODS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOURCES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LINES"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".DTD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HITS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
