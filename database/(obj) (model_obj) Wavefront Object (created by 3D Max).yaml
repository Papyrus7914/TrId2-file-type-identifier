Name: Wavefront Object (created by 3D Max)
URL: "https://en.wikipedia.org/wiki/Wavefront_.obj_file"
FileNameExtensions: ["obj"]
MimeType: model/obj
DetectionPatterns:
  - Pos: 0
    AsciiString: "# Max2Obj Version "
    CaseSensitive: true
  - Pos: 19
    AsciiString: "."
    CaseSensitive: true
  - Pos: any
    AsciiString: "VERTICES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OBJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FACES"
    CaseSensitive: false
