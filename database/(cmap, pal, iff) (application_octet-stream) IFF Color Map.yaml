Name: IFF Color Map
URL: "https://en.wikipedia.org/wiki/Interchange_File_Format"
FileNameExtensions: ["cmap", "pal", "iff"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "ILBMCMAP"
    CaseSensitive: true
