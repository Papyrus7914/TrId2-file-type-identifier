Name: Directory Opus module (Amiga)
URL: "https://en.wikipedia.org/wiki/Directory_Opus"
FileNameExtensions: ["module"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0\x03\xF3\0\0\0\0\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NUDOS.LIBRARY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOPUS"
    CaseSensitive: false
