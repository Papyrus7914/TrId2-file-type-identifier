Name: Jigdo Template
URL: "http://fileformats.archiveteam.org/wiki/Jigdo"
FileNameExtensions: ["template"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "JigsawDownload template "
    CaseSensitive: true
  - Pos: 25
    AsciiString: "."
    CaseSensitive: true
  - Pos: any
    AsciiString: "DESC"
    CaseSensitive: false
