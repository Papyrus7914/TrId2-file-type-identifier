Name: Content Addressable Archive info/layout
URL: "http://fileformats.archiveteam.org/wiki/Content_Addressable_Archive"
FileNameExtensions: ["json"]
MimeType: text/json
DetectionPatterns:
  - Pos: 0
    AsciiString: "{"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BLOCKLENGTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BLOCKOFFSET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BLOCKS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEADER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BYTES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LINKS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROOTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TSIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HASH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
