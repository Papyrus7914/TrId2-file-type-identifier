Name: Citec trend History data (v2)
URL: "https://www.se.com"
FileNameExtensions: ["hst", "000", "001"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "CITECT"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "VERSION 2"
    CaseSensitive: true
  - Pos: 19
    AsciiString: "TREND "
    CaseSensitive: true
  - Pos: any
    AsciiString: "VERSION 2"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TREND"
    CaseSensitive: false
