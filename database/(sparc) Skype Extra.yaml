Name: Skype Extra
Description: Plugin that add extra functionality to Skype.
URL: "https://extras.skype.com/"
FileNameExtensions: ["sparc"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "wwww\x03\0\0\0 \0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "H\0T\0T\0P"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWWW"
    CaseSensitive: false
