Name: 16bit DOS COM EPW password protected (generic)
Description: Password encryption utility for executable files by Alan D. Jones.
FileNameExtensions: ["com"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xE9]
  - Pos: 36
    AsciiString: "Decryptor -Copyright (C) 198"
    CaseSensitive: true
  - Pos: 65
    AsciiString: ", Alan D. Jones"
    CaseSensitive: true
  - Pos: any
    AsciiString: "$PASSWORD IS NOT CORRECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENTER PASSWORD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VURQSP"
    CaseSensitive: false
