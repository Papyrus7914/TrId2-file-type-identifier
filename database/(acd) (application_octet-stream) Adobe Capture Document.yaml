Name: Adobe Capture Document
URL: "http://fileformats.archiveteam.org/wiki/Adobe_Acrobat_Capture"
FileNameExtensions: ["acd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #                    G     G
    Bytes: [0x02, 0x04, 0x47, 0x47, 0xC9, 0x00]
  - Pos: any
    AsciiString: "CAPTURE2"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".ACI"
    CaseSensitive: false
