Name: Scratch 2.0 project
URL: "http://en.wikipedia.org/wiki/Scratch_(programming_language)"
FileNameExtensions: ["sb2"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "project.json"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PROJECT.JSONPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "0.PNGPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IDATX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IHDR"
    CaseSensitive: false
