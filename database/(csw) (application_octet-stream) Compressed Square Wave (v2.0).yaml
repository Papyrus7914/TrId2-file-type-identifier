Name: Compressed Square Wave (v2.0)
Description: CSW files are a way of storing sample data in a compact form.
URL: "http://ramsoft.bbk.org.omegahg.com/csw.html"
FileNameExtensions: ["csw"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Compressed Square Wave\x1A\x02\0"
    CaseSensitive: true
