Name: Mac Claris Draw drawing (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/Claris"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "dDRW"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DDRW"
    CaseSensitive: false
