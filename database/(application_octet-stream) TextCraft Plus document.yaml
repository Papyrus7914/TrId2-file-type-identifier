Name: TextCraft Plus document
Description: Amiga word processor.
URL: "https://www.amigafuture.de/asd.php?asd_id=723"
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "FTXTTCPP"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CHRS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TCPH"
    CaseSensitive: false
