Name: Ulysses Native Format
URL: "http://www.ifbcon.de/software/ulysses/downloads/documents/e_ulysses-speaker-data_unf.pdf"
FileNameExtensions: ["unf"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "Device Class:\tLOUDSPEAKER"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DEVICE CLASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MANUFACTURER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEVICE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOUDSPEAKER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPHERE SIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FREQUENCY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMPEDANCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INCREMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISTANCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UEFF"
    CaseSensitive: false
