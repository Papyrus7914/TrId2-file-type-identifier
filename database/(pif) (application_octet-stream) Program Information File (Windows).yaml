Name: Program Information File (Windows)
URL: "https://en.wikipedia.org/wiki/Program_information_file"
FileNameExtensions: ["pif"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 369
    AsciiString: "MICROSOFT PIFEX"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MICROSOFT PIFEX"
    CaseSensitive: false
