Name: Foltyn Commander Help
Description: Polish Norton Commander clone.
FileNameExtensions: ["hlp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Foltyn Commander "
    CaseSensitive: true
  - Pos: 18
    AsciiString: "."
    CaseSensitive: true
  - Pos: 20
    AsciiString: " Help File\r\nCopyright (C) "
    CaseSensitive: true
  - Pos: 55
    AsciiString: " Foltyn Software\r\n"
    CaseSensitive: true
