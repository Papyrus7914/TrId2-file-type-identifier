Name: Particle Systems 3D Object
Description: Used in Independence War 2.
URL: "https://en.wikipedia.org/wiki/Independence_War_2:_Edge_of_Chaos"
FileNameExtensions: ["pso"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "PSO"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "OHDR"
    CaseSensitive: true
