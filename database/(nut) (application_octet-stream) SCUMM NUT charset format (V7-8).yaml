Name: SCUMM NUT charset format (V7-8)
URL: "https://wiki.scummvm.org/index.php/SCUMM/Technical_Reference/Charset_resources"
FileNameExtensions: ["nut"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "ANIM\0\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "AHDR\0\0\x03"
    CaseSensitive: true
  - Pos: any
    AsciiString: "AHDR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FOBJ"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FRME"
    CaseSensitive: false
