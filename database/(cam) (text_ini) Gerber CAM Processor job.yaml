Name: Gerber CAM Processor job
URL: "https://web.mit.edu/xavid/arch/i386_rhel4/help/109.htm"
FileNameExtensions: ["cam"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "[CAM Processor Job]"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOLERANCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EMULATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SECTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLORS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEVICE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAYERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OFFSET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUTPUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROMPT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FLAGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCALE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEC_1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHEET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WHEEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RACK"
    CaseSensitive: false
