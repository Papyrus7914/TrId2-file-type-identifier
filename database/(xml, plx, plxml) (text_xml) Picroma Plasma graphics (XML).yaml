Name: Picroma Plasma graphics (XML)
URL: "http://fileformats.archiveteam.org/wiki/Picroma_Plasma"
FileNameExtensions: ["xml", "plx", "plxml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"utf-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SMOOTHMESHSHAPE.VERTEXPOSITIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SMOOTHMESHSHAPE.SUBDIVISIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SMOOTHMESHSHAPE.VERTEXCOLORS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SMOOTHMESHSHAPE.WNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ARRAYATTRIBUTE.FRAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SMOOTHMESHSHAPE.FACE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ARRAYATTRIBUTE.SIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLASMAGRAPHICS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "--ROOT NODE--"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NODE.CHILD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NODE.SHAPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NODE.WNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGEHEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGECOLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGEWIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNIT"
    CaseSensitive: false
