Name: Audacity Nyquits plug-in
Description: Nyquist was written by Roger B. Dannenberg and was intended to be used as a complete programming language for audio synthesis and analysis, with support for MIDI, audio recording and playback, file I/O, object-oriented programming, profiling, debugging, and more. Audacity uses only a subset of Nyquist's functionality, allowing you to take simple Nyquist functions and use them to process audio data.
URL: "http://audacity.sourceforge.net/nyquist.php"
FileNameExtensions: ["ny"]
DetectionPatterns:
  - Pos: 0
    AsciiString: ";nyquist plug-in"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
