Name: gEDA Symbol
URL: "https://en.wikipedia.org/wiki/GEDA"
FileNameExtensions: ["sym"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "v 20"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PINNUMBER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEVICE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PINSEQ"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REFDES"
    CaseSensitive: false
