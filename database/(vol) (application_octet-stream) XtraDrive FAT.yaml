Name: XtraDrive FAT
URL: "https://en.wikipedia.org/wiki/Disk_compression#XtraDrive"
FileNameExtensions: ["vol"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "iit"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "INTEGRATED INFORMATION TECHNOLOGY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XTRADRIVE BIOS VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COPYRIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INC."
    CaseSensitive: false
