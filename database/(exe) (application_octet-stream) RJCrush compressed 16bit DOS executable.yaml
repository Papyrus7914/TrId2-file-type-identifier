Name: RJCrush compressed 16bit DOS executable
Description: EXE compressor by Ronald Skinner, RJS Software.
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0\0\x02\0"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 20
    AsciiString: "\0\0\0\0"
    CaseSensitive: true
  - Pos: 25
    AsciiString: "\0\0\0RJS1\x06\xFC\x8C\xC8\xBA"
    CaseSensitive: true
  - Pos: any
    AsciiString: "RJS1"
    CaseSensitive: false
