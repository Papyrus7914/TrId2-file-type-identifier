Name: OpenStreetMap XML Data
URL: "https://en.wikipedia.org/wiki/OpenStreetMap"
FileNameExtensions: ["osm"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version="
    CaseSensitive: true
  - Pos: any
    AsciiString: "OSM VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GENERATOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NODE ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TAG K"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
