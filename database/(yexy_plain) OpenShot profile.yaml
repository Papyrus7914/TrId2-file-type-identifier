Name: OpenShot profile
URL: "http://en.wikipedia.org/wiki/OpenShot_Video_Editor"
MimeType: yexy/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "description="
    CaseSensitive: true
  - Pos: any
    AsciiString: "DISPLAY_ASPECT_DEN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DISPLAY_ASPECT_NUM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAMPLE_ASPECT_DEN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAMPLE_ASPECT_NUM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FRAME_RATE_DEN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FRAME_RATE_NUM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROGRESSIVE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIDTH"
    CaseSensitive: false
