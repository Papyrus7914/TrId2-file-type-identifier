Name: Mendix Project Package
URL: "https://www.mendix.com/"
FileNameExtensions: ["mpk"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "PACKAGE.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MENDIX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIDGET"
    CaseSensitive: false
