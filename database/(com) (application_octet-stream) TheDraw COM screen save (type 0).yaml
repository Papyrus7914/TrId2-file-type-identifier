Name: TheDraw COM screen save (type 0)
Description: Executable screen image.
URL: "https://en.wikipedia.org/wiki/TheDraw"
FileNameExtensions: ["com"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #              =
    Bytes: [0xEB, 0x3D, 0x90]
  - Pos: 6
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "TheDraw COM file Screen Save\x1A"
    CaseSensitive: true
  - Pos: any
    AsciiString: "THEDRAW COM FILE SCREEN SAVE"
    CaseSensitive: false
