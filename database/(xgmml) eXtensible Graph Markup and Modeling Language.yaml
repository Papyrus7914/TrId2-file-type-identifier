Name: eXtensible Graph Markup and Modeling Language
URL: "http://en.wikipedia.org/wiki/XGMML"
FileNameExtensions: ["xgmml"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "WWW.CS.RPI.EDU"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ATT NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GRAPHIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LABEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XGMML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GROU"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
