Name: Greenfoot Project
URL: "http://www.greenfoot.org/"
FileNameExtensions: ["greenfoot"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "#Greenfoot pro"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GREENFOOT.ACTOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GREENFOOT.WORLD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "R.SUPERCLASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLASS."
    CaseSensitive: false
  - Pos: any
    AsciiString: "WORLD."
    CaseSensitive: false
