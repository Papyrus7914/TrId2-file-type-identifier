Name: Zork FileSystem game data archive (v1)
Description: Used in the Zork, the Interstate serie and others.
URL: "https://www.mobygames.com/game/1951/zork-grand-inquisitor/"
FileNameExtensions: ["zfs"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "ZFSF\x01\0\0\0"
    CaseSensitive: true
