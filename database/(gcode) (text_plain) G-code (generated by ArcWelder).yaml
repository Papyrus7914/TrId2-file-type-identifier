Name: G-code (generated by ArcWelder)
URL: "https://github.com/FormerLurker/ArcWelderLib/"
FileNameExtensions: ["gcode"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "; Postprocessed by [ArcWelder]"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DEFAULT_XYZ_PRECISION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULT_E_PRECISION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BRAD HOCHGESANG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH_TOLERANCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ARCWELDERLIB)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COPYRIGHT(C)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMERLURKER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GITHUB.COM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAX_RADIUS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RESOLUTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(HTTPS"
    CaseSensitive: false
