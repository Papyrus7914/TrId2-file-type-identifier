Name: Oberon compressed archive
Description: Compression using LZSS algorithm
URL: "http://www.ethoberon.ethz.ch/ethoberon/tutorial/Compress.html"
FileNameExtensions: ["arc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 6
    AsciiString: "re"
    CaseSensitive: true
  - Pos: 10
    AsciiString: "."
    CaseSensitive: true
  - Pos: any
    AsciiString: "S.MOD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
