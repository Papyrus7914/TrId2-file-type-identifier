Name: Kazaa Playlist
URL: "http://www.kazaa.com/"
FileNameExtensions: ["kpl"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "["
    CaseSensitive: true
  - Pos: any
    AsciiString: "CATEGORY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "METADATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENTRIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ARTIST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ALBUM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENTRY"
    CaseSensitive: false
