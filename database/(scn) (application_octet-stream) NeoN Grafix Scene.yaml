Name: NeoN Grafix Scene
Description: 3D graphics and animation software by Ole Dittmann and Jens Stutte, originally on Atari ST.
FileNameExtensions: ["scn"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "RIP SCN.:\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".BDY"
    CaseSensitive: false
