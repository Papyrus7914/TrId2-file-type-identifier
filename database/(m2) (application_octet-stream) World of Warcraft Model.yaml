Name: World of Warcraft Model
URL: "https://en.wikipedia.org/wiki/World_of_Warcraft"
FileNameExtensions: ["m2"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MD21"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "MD20"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SFID"
    CaseSensitive: false
