Name: Yarn Lock
URL: "https://en.wikipedia.org/wiki/Yarn_(package_manager)"
FileNameExtensions: ["lock"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "# THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY."
    CaseSensitive: true
  - Pos: any
    AsciiString: "YARN LOCKFILE V1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
