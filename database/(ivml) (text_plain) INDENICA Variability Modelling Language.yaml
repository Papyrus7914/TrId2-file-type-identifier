Name: INDENICA Variability Modelling Language
URL: "http://projects.sse.uni-hildesheim.de/easy/docs/ivml_spec.pdf"
FileNameExtensions: ["ivml"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "project "
    CaseSensitive: true
  - Pos: any
    AsciiString: "FREEZE"
    CaseSensitive: false
