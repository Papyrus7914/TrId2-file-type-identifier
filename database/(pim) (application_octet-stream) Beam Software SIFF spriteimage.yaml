Name: Beam Software SIFF sprite/image
URL: "https://wiki.multimedia.cx/index.php/SIFF"
FileNameExtensions: ["pim"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SIFF"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "PXANAHDR"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PXANAHDR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BODY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CMAP"
    CaseSensitive: false
