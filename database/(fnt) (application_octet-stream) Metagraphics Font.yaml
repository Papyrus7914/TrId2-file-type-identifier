Name: Metagraphics Font
URL: "http://www.metagraphics.com/metawindow/fonts/fnt-specs.htm"
FileNameExtensions: ["fnt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 50
    AsciiString: "METAFONT"
    CaseSensitive: true
  - Pos: any
    AsciiString: "METAFONT"
    CaseSensitive: false
