Name: MLT framework AV preset (var.2)
URL: "https://github.com/mltframework/mlt"
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "p"
    CaseSensitive: true
  - Pos: any
    AsciiString: "META.PRESET.EXTENSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VCODEC"
    CaseSensitive: false
