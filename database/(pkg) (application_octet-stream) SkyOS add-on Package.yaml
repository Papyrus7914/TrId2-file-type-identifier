Name: SkyOS add-on Package
URL: "https://en.wikipedia.org/wiki/SkyOS"
FileNameExtensions: ["pkg"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "INSTALL.SIFPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROGRAMS"
    CaseSensitive: false
