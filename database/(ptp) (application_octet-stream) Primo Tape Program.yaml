Name: Primo Tape Program
Description: This file is usable in a Primo emulator, or transferable back to tape.
URL: "http://primo.homeserver.hu"
FileNameExtensions: ["ptp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xFF]
  - Pos: 3
    AsciiString: "U"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0\x83\0"
    CaseSensitive: true
