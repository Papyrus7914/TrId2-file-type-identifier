Name: Reason Remote Mapping (UTF-8)
URL: "https://en.wikipedia.org/wiki/Reason_(software)"
FileNameExtensions: ["remotemap"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xEF\xBB\xBFPropellerhead Remote Mapping File"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PROPELLERHEAD REMOTE MAPPING FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTROL SURFACE MANUFACTURER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTROL SURFACE MODEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE FORMAT VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REASON DOCUMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPELLERHEADS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAP VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCOPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SONIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLAY"
    CaseSensitive: false
