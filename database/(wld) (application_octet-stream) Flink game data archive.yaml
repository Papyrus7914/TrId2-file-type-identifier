Name: Flink game data archive
URL: "https://www.mobygames.com/game/flink"
FileNameExtensions: ["wld"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "WRLD\0\0\0\b\0\a\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NUKE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XPKF"
    CaseSensitive: false
