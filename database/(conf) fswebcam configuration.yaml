Name: fswebcam configuration
URL: "http://www.firestorm.cx/fswebcam/"
FileNameExtensions: ["conf"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "# "
    CaseSensitive: true
  - Pos: any
    AsciiString: "CONFIGURATION FOR FSWEBCAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BANNER-COLOUR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LINE-COLOUR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOP-BANNER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RESOLUTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEVICE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIDEO0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FRAMES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "QUIET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCALE"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PNG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXEC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SKIP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FONT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAVE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JPEG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "X288"
    CaseSensitive: false
