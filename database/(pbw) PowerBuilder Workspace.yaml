Name: PowerBuilder Workspace
URL: "http://en.wikipedia.org/wiki/PowerBuilder"
FileNameExtensions: ["pbw"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "Save Format v3.0(19990112)"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SAVE FORMAT V3.0(19990112)"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BEGIN UNCHECKED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BEGIN TARGETS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PBT"
    CaseSensitive: false
