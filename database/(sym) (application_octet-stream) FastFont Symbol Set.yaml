Name: FastFont Symbol Set
FileNameExtensions: ["sym"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SYMBOL SET ="
    CaseSensitive: true
  - Pos: any
    AsciiString: "FIRST CODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LAST CODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUM CHARS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PCL CHAR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PCL NUM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYMBOLS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
