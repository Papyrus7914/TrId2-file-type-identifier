  - Pos: any
    AsciiString: "PROGRESSBARRECT VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHOWPROGRESSBAR VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHOWTEXTLABEL VALUE"
