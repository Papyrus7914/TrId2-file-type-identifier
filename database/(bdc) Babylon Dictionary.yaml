Name: Babylon Dictionary
URL: "http://www.babylon.com/"
FileNameExtensions: ["bdc"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x124\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GLOSSARY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BABYLON"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".COM"
    CaseSensitive: false
