Name: Golem bank info
Description: Amiga business software.
URL: "https://golem-amiga.sourceforge.net/"
FileNameExtensions: ["golem"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "BANK"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BANK"
    CaseSensitive: false
