Name: CandyFactory Project
Description: Amiga graphics software.
FileNameExtensions: ["cpj", "proj"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "CPRJPHDR"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CPRJPHDR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PBMT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLGT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POMT"
    CaseSensitive: false
