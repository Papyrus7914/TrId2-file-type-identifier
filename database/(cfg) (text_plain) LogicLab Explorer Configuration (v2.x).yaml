Name: LogicLab Explorer Configuration (v2.x)
Description: Circuit board design tool for DOS by K.E. Ayers and Associates.
FileNameExtensions: ["cfg"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "# LogicLab (Ver 2."
    CaseSensitive: true
  - Pos: any
    AsciiString: "CONFIGURATION FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLICK_DELAY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAX_SAMPLES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ASSOCIATES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "K.E. AYERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIRE_COLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR_SET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(C) 1991"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIM_MODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRINTER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPACING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WINDOW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".CKT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GRID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SNAP"
    CaseSensitive: false
