Name: SPI scanner driver
FileNameExtensions: ["sys"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xFF, 0xFF, 0xFF, 0xFF, 0x00, 0xC8]
  - Pos: 10
    AsciiString: "SPI$SCAN"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PRESS ANY KEY TO CONTINUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DRIVER NOT INSTALLED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KYE SYSTEMS CORP."
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHECK HARDWARE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INTERFACE CARD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCANNER DRIVER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COPYRIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SETTINGS."
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPI$SCAN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONFIG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ERROR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BANK"
    CaseSensitive: false
