    CaseSensitive: false
  - Pos: any
    AsciiString: "TRANSPORTDRIVER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WFCLIENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ADDRESS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROGRAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LPRO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WINS"
    CaseSensitive: false
