Name: VisiCalc spreadsheet
Description: The father of all spreadsheets!
URL: "https://en.wikipedia.org/wiki/VisiCalc"
FileNameExtensions: ["vc"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: ">"
    CaseSensitive: true
  - Pos: 3
    AsciiString: ":"
    CaseSensitive: true
