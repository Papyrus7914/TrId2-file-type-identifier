Name: BYOB project
URL: "http://byob.berkeley.edu/"
FileNameExtensions: ["ypr"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "BloxExpV01"
    CaseSensitive: true
  - Pos: 14
    AsciiString: "ObjS\x01Stch"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SCRATCH-VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OS-VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THUMBNAIL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LANGUAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLATFORM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HISTORY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTHOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BYOB"
    CaseSensitive: false
