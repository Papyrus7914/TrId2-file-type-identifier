Name: Code::Blocks Dependencies
URL: "http://en.wikipedia.org/wiki/Code::Blocks"
FileNameExtensions: ["depend"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "# depslib dependency file v1.0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DEPSLIB DEPENDENCY FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOURCE"
    CaseSensitive: false
