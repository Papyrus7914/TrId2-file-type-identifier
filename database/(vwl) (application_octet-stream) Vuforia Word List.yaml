Name: Vuforia Word List
URL: "https://www.qualcomm.com/products/vuforia"
FileNameExtensions: ["vwl"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "VUFORIA_COMPOUND_WORD.BIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COPYRIGHT_NOTICE.TXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WORDLIST.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VUFORIA.BIN"
    CaseSensitive: false
