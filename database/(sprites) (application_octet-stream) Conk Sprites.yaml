    AsciiString: "SPRT"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".SPRITES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONKCMAP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPRT"
    CaseSensitive: false
