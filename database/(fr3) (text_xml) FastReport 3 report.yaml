Name: FastReport 3 report
URL: "https://www.fast-report.com/"
FileNameExtensions: ["fr3"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"utf-8\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "REPORTOPTIONS.DESCRIPTION.TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REPORTOPTIONS.CREATEDATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REPORTOPTIONS.LASTCHANGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TFRXREPORTPAGE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCRIPTTEXT.TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCRIPTLANGUAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BOTTOMMARGIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLUMNWIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAPERHEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RIGHTMARGIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LEFTMARGIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAPERWIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOPTIONS.P"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAPERSIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOPMARGIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIEW NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRINTO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BEGIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
