Name: MATLAB audio data
URL: "https://en.wikipedia.org/wiki/MATLAB"
FileNameExtensions: ["mat"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 20
    AsciiString: "samplingrate\0"
    CaseSensitive: true
  - Pos: 61
    AsciiString: "wavedata\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SAMPLINGRATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WAVEDATA"
    CaseSensitive: false
