Name: Hyperspin DB format
Description: Info for MAME Rom Managers.
FileNameExtensions: ["dat"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "<menu>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GAME NAME"
    CaseSensitive: false
