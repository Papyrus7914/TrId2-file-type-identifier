Name: Learning Mobile Author (LMA) Project
URL: "http://hotlavasoftware.com/"
FileNameExtensions: ["lma"]
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "LMA.DTDPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LMA.XMLPK"
    CaseSensitive: false
