Name: APTCL output data
FileNameExtensions: ["apt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MCS/"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SURFCAM MATERIAL LIBRARY NUMBER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SURFCAM TOOL LIBRARY NUMBER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROGRAMMED TO TIP OF TOOL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SURFCAM TOOL TYPE NUMBER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OFFSET FROM SURFACE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROGRAM UNITS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TAPER ANGLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUM FLUTES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CUTTER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PPRINT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEQNO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FINI"
    CaseSensitive: false
