Name: FreeCAD Document
URL: "https://en.wikipedia.org/wiki/FreeCAD"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version='1.0' encoding='utf-8'?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FREE-CAD.SOURCEFORGE.NET FOR MORE INFORMATION..."
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCUMENT SCHEMAVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FREECAD DOCUMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERTIES COUNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERTY NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FLOAT VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA COUNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERTYP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEE HTTP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHAPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
