Name: NSIS script (with rem)
URL: "https://en.wikipedia.org/wiki/Nullsoft_Scriptable_Install_System"
FileNameExtensions: ["nsi"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: ";"
    CaseSensitive: true
  - Pos: any
    AsciiString: "INSTALLDIRREGKEY HK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SECTIONEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SETOUTPATH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIRECTORY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INSTALLER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INSTFILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$INSTDIR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REGISTRY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOFTWARE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUTFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WINDOWS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DELETE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRING"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".EXE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_DIR"
    CaseSensitive: false
