Name: Supercell SC3D binary model/animation
URL: "https://www.mobygames.com/game/119277/brawl-stars/"
FileNameExtensions: ["scw"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SC3D\0\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "HEAD"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BONE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROOT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WEND"
    CaseSensitive: false
