Name: SAMI captions
Description: SAMI stand for Synchronized Accessible Media Interchang.
URL: "http://en.wikipedia.org/wiki/SAMI"
FileNameExtensions: ["sami", "smi"]
MimeType: text/x-ms-sami
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: 5
    AsciiString: ">"
    CaseSensitive: true
  - Pos: any
    AsciiString: "STYLE TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYNC START"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BODY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FONT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LANG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAMI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
