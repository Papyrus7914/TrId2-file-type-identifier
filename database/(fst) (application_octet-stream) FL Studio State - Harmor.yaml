Name: FL Studio State - Harmor
URL: "https://www.image-line.com/fl-studio-learning/fl-studio-online-manual/html/plugins/Harmor.htm"
FileNameExtensions: ["fst"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FLhd\x06\0\0\0"
    CaseSensitive: true
  - Pos: 14
    AsciiString: "FLdt"
    CaseSensitive: true
  - Pos: any
    AsciiString: "H\0A\0R\0M\0O\0R"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FLDT"
    CaseSensitive: false
