Name: Modem Control File
Description: Standard files used by BBS, terminal emulators, etc.
FileNameExtensions: ["mcf"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "MCF "
    CaseSensitive: true
  - Pos: any
    AsciiString: "OFFHOOK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ANSWER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BAUD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INIT"
    CaseSensitive: false
