Name: DDA2 Self-Extracting-Archive
Description: SFX format used on Mac.
FileNameExtensions: ["sea"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "DDA2\0>\0\x01\0"
    CaseSensitive: true
  - Pos: 62
    AsciiString: "DDA2"
    CaseSensitive: true
  - Pos: any
    AsciiString: "EXPAND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$DDB"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".SEA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DDA2"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DDAP"
    CaseSensitive: false
