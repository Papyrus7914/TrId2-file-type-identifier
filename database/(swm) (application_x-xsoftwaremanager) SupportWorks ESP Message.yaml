Name: SupportWorks ESP Message
URL: "https://support-works.com/"
FileNameExtensions: ["swm"]
MimeType: application/x-xsoftwaremanager
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 46
    AsciiString: ".tmpsw"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".TMPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".TMPSW"
    CaseSensitive: false
