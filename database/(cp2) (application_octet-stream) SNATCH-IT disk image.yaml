Name: SNATCH-IT disk image
Description: Old tool from Software Pirates, INC. to be used with COPY II-PC.
URL: "http://fileformats.archiveteam.org/wiki/CP2"
FileNameExtensions: ["cp2"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SOFTWARE PIRATESRelease "
    CaseSensitive: true
  - Pos: 28
    AsciiString: "$"
    CaseSensitive: true
