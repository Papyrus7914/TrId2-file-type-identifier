Name: Omnifarious Container for eDocuments (generic)
MimeType: application/OCD+ZIP
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "METALAYER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MIMETYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAYLOAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ID-1"
    CaseSensitive: false
