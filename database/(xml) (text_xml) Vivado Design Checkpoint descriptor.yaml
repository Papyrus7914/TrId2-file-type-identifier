    AsciiString: "VHDL_STUB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SW BUILD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOP NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODTIME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIVADO"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".INCR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MINOR"
    CaseSensitive: false
