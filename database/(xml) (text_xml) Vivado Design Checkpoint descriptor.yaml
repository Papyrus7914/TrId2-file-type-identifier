Name: Vivado Design Checkpoint descriptor
URL: "https://en.wikipedia.org/wiki/Vivado"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\"?>\n<Checkpoint Version=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "DISABLEAUTOIOBUFFERS NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IPOOCRUNGENERATED NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHECKPOINT VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUILD_NUMBER NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUTOFCONTEXT NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FULL_BUILD NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HDPLATFORM NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_IN_CONTEXT.XDC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BOARDPART NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XDC_IN_CONTEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRODUCT NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERILOG_STUB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
