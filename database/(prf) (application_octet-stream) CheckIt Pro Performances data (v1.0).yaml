Name: CheckIt Pro Performances data (v1.0)
Description: DOS diagnostic by TouchStone Software Corporation.
FileNameExtensions: ["prf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "# CheckIt Pro 1.0 data file\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VIDEO ADAPTER 0 TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BENCHMARKS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CPU UNITS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAINBOARD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NPU UNITS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CPU TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NOVEMBER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NPU TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VIDEO 0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DIRECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BIOS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TIME"
    CaseSensitive: false
