Name: SMARTBook book (compressed, v4)
Description: Book authoring tool for Windows by Frax Ltd.
FileNameExtensions: ["sbc", "sbw"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "LZSB1.0"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "WORK.DBD\0\xFFV3.00\x1A"
    CaseSensitive: true
  - Pos: 50
    AsciiString: "bo?ok.dat"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PALETTE.DAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BLOB1.DAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MISC1.DAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA MAN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGE.KEY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TREE.KEY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WORK.DBD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USER"
    CaseSensitive: false
