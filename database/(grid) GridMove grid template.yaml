Name: GridMove grid template
URL: "http://www.jgpaiva.dcmembers.com/gridmove.html"
FileNameExtensions: ["grid"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "[Groups]\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NUMBEROFGROUPS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRIGGERBOTTOM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRIGGERRIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRIGGERLEFT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRIGGERTOP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GRIDBOTTOM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GRIDRIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GRIDLEFT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GRIDTOP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MONITOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIDTH"
    CaseSensitive: false
