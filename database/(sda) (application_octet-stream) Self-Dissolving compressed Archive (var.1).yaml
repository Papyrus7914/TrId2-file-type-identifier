Name: Self-Dissolving compressed Archive (var.1)
Description: Old Commodore 64 format.
URL: "http://fileformats.archiveteam.org/wiki/SDA"
FileNameExtensions: ["sda"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x01\b\r\b"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0\x9E(2063)\0\0\0\xA9"
    CaseSensitive: true
  - Pos: any
    AsciiString: "(2063)"
    CaseSensitive: false
