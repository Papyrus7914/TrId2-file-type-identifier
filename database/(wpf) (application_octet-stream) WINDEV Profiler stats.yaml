Name: WINDEV Profiler stats
Description: WINDEV is a RAD tool by PC Soft.
URL: "https://windev.com"
FileNameExtensions: ["wpf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PCS\0\x14\0\0\0\x01\0\x11\0\0\0"
    CaseSensitive: true
  - Pos: 20
    AsciiString: "WDProfile "
    CaseSensitive: true
  - Pos: any
    AsciiString: "EXECUTION COMPLETED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WDPROFILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT"
    CaseSensitive: false
