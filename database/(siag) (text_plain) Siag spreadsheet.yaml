Name: Siag spreadsheet
Description: Siag is a spreadsheet based on X and Scheme.
URL: "https://en.wikipedia.org/wiki/Siag_Office"
FileNameExtensions: ["siag"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: ".sw "
    CaseSensitive: true
  - Pos: any
    AsciiString: "END OF FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LINE"
    CaseSensitive: false
