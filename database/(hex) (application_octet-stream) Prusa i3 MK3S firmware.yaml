Name: Prusa i3 MK3S firmware
URL: "https://help.prusa3d.com/en/downloads/"
FileNameExtensions: ["hex"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: ":100000000C94"
    CaseSensitive: true
  - Pos: any
    AsciiString: "1_75MM_MK3S-EINSY10A-E3DV6FULL"
    CaseSensitive: false
