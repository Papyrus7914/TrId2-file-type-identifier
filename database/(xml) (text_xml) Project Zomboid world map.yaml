    AsciiString: "PROPERTY NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WORLD VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COORDINATES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERTIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FEATURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POINT X"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POLYGON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CELL X"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUE"
    CaseSensitive: false
