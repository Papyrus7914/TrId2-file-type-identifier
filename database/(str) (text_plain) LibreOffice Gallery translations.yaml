Name: LibreOffice Gallery translations
Description: contains translated gallery theme names
URL: "https://en.wikipedia.org/wiki/LibreOffice"
FileNameExtensions: ["str"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "# Translated by desktop-translate and ulfex"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TRANSLATED BY DESKTOP-TRANSLATE AND ULFEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GALLERY_NAMES.ULF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEE EXTRAS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOURCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHARE"
    CaseSensitive: false
