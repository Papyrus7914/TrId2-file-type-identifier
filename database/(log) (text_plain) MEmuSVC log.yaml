Name: MEmuSVC log
URL: "https://www.memuplay.com/"
FileNameExtensions: ["log"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "MemuHyperv COM Server "
    CaseSensitive: true
  - Pos: any
    AsciiString: "MAIN     DMI PRODUCT VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN     DMI PRODUCT NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN     PACKAGE TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NETIFGETBOUNDADAPTERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN     BUILD TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN     EXECUTABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN     LOG OPENED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN     MEMUHYPERV"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN     OS PRODUCT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN     OS RELEASE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN     PROCESS ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INSTALLED DRIVERS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN     HOST RAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HOME DIRECTORY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HOSTDNSMONITOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RELEASE LOG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USBLIBINIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AVAILABLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OBJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOTAL"
    CaseSensitive: false
