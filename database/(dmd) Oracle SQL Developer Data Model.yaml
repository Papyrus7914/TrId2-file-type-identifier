Name: Oracle SQL Developer Data Model
FileNameExtensions: ["dmd"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version = '1.0' encoding = 'UTF-8'?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ORACLE.DBTOOLS.CREST.MODEL.DESIGN.DESIGN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OSDM_DESIGN CLASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OWNERDESIGNNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CAPITALNAMES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREATEDTIME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREATEDBY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESIGNID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FALSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
