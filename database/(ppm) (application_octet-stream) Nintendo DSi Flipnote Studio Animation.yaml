Name: Nintendo DSi Flipnote Studio Animation
URL: "https://github.com/pbsds/hatena-server/wiki/PPM-format"
FileNameExtensions: ["ppm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PARA"
    CaseSensitive: true
  - Pos: 14
    AsciiString: "$\0"
    CaseSensitive: true
