Name: IBM SKF disk image (uncomp)
Description: new uncompressed; possible comment offset is 28h
URL: "http://fileformats.archiveteam.org/wiki/LoadDskF/SaveDskF"
FileNameExtensions: ["dsk"]
MimeType: application/x-ibm-dsk
DetectionPatterns:
  - Pos: 0
    #              Y
    Bytes: [0xAA, 0x59]
  - Pos: 3
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 25
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 27
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 30
    AsciiString: "\0\0\0\0"
    CaseSensitive: true
  - Pos: 36
    AsciiString: "(\0"
    CaseSensitive: true
