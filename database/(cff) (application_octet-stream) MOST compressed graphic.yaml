Name: MOST compressed graphic
URL: "http://fileformats.archiveteam.org/wiki/Most"
FileNameExtensions: ["cff"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "CFF\x01To view pics use MOST V1.0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "R.WYNN"
    CaseSensitive: false
