Name: 16bit DOS EXE EPW password protected (v1.3)
Description: Password encryption utility for executable files by Farpoint Software.
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0\0\x05\0"
    CaseSensitive: true
  - Pos: 16
    Bytes: [0xDF, 0x00]
  - Pos: 20
    #        C
    Bytes: [0x43, 0x01]
  - Pos: 24
    AsciiString: "\x1E\0\0\0\x01\0\0\0"
    CaseSensitive: true
  - Pos: 36
    AsciiString: "Decryptor - (c) 1988, Farpoint Software     MZ"
    CaseSensitive: true
  - Pos: any
    AsciiString: "$PASSWORD IS NOT CORRECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENTER PASSWORD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VURQSP."
    CaseSensitive: false
