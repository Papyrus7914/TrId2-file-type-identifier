Name: RTPACK game data format (uncomp.)
URL: "https://wiki.xentax.com/index.php/Dink_Smallwood_RTFONT_RTTEX"
FileNameExtensions: ["rttex", "rtfont"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "RTPACK"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "\0"
    CaseSensitive: true
