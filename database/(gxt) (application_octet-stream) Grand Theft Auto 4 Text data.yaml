Name: Grand Theft Auto 4 Text data
Description: Used in GTA San Andreas and IV (SA/IV).
URL: "https://gtamods.com/wiki/GXT"
FileNameExtensions: ["gxt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x04\0\b\0TABL"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "\x05\0\0MAIN"
    CaseSensitive: true
