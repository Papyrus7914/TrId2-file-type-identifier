Name: Visual Studio C# Project
URL: "https://en.wikipedia.org/wiki/Microsoft_Visual_Studio"
FileNameExtensions: ["csproj"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PROPERTYGROUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ASSEMBLYNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MICROSOFT."
    CaseSensitive: false
  - Pos: any
    AsciiString: "ITEMGROUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLATFORM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INCLUDE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TARGET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BUILD"
    CaseSensitive: false
