Name: TiEmu keys Maping
URL: "https://en.wikipedia.org/wiki/TiEmu"
FileNameExtensions: ["map"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "Model: TI"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ALPHABETICAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FUNCTIONS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUMERICAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPECIFIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAPPING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ARROWS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PCKEY_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TIKEY_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODEL"
    CaseSensitive: false
