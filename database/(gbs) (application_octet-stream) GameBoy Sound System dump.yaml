Name: GameBoy Sound System dump
Description: Contains ripped code and data from a GameBoy ROM.
URL: "http://fileformats.archiveteam.org/wiki/Game_Boy_Sound"
FileNameExtensions: ["gbs"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "GBS\x01"
    CaseSensitive: true
