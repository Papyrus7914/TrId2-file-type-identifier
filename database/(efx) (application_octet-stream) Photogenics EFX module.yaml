Name: Photogenics EFX module
Description: Amiga image manipulation tool.
URL: "https://en.wikipedia.org/wiki/Photogenics"
FileNameExtensions: ["efx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x00, 0x00, 0x03, 0xF3]
  - Pos: any
    AsciiString: ". ALL RIGHTS RESERVED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ALMATHERA 199"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION 1."
    CaseSensitive: false
  - Pos: any
    AsciiString: "COPYRIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".EFX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "P\0NU"
    CaseSensitive: false
