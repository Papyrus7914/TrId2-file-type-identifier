Name: IFF Sliced HAM bitmap
Description: Amiga graphics format.
URL: "https://en.wikipedia.org/wiki/NewTek"
FileNameExtensions: ["ilbm", "lbm", "iff"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "ILBM"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SHAM"
    CaseSensitive: false
