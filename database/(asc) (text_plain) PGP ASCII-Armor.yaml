Name: PGP ASCII-Armor
Description: Pretty Good Privacy (PGP) is a computer program that provides cryptographic privacy and authentication.
URL: "http://en.wikipedia.org/wiki/Pretty_Good_Privacy"
FileNameExtensions: ["asc"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "-----BEGIN PGP "
    CaseSensitive: true
  - Pos: any
    AsciiString: "-----END PGP"
    CaseSensitive: false
