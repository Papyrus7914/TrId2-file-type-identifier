Name: FigCraft design
URL: "https://getartcraft.com/apps/figcraft"
FileNameExtensions: ["figcraft"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "document.json"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOCUMENT.JSON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THUMBNAIL.PNG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IDATX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IHDR"
    CaseSensitive: false
