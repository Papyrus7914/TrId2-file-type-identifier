Name: Adobe Zipped Extension Package
FileNameExtensions: ["zxp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 29
    AsciiString: "\0mimetype"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VND.ADOBE.AIR-UCF-PACKAGE+ZIPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIGNATURES.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPLICATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "META-INF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MIMETYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLP"
    CaseSensitive: false
