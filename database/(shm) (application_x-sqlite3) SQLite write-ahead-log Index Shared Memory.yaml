Name: SQLite write-ahead-log Index Shared Memory
Description: The suffix is generated by adding 4 byte phrase -shm at name of corresponding SQLite database
URL: "http://www.sqlite.org/draft/walformat.html#walidxfmt"
FileNameExtensions: ["shm"]
MimeType: application/x-sqlite3
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x18\xE2-\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 12
    Bytes: [0x01, 0x00]
  - Pos: 48
    AsciiString: "\x18\xE2-\0\0\0\0\0"
    CaseSensitive: true
  - Pos: 60
    Bytes: [0x01, 0x00]
  - Pos: 100
    AsciiString: "\0\0\0\0"
    CaseSensitive: true
  - Pos: 112
    Bytes: [0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF]
  - Pos: 132
    AsciiString: "\0\0\0\0"
    CaseSensitive: true
