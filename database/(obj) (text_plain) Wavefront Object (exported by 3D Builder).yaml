Name: Wavefront Object (exported by 3D Builder)
URL: "https://en.wikipedia.org/wiki/Wavefront_.obj_file"
FileNameExtensions: ["obj"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "# Exported from 3D Builder\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "O OBJECT.1"
    CaseSensitive: false
