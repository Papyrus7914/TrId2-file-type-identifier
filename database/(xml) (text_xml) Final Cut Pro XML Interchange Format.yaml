Name: Final Cut Pro XML Interchange Format
URL: "https://en.wikipedia.org/wiki/Final_Cut_Pro"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "XMEML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TIMEBASE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MEDIA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RATIO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
