Name: SlickRun MagicWord Pack
Description: SlickRun is a free floating command line utility for Windows.
URL: "http://bayden.com/slickrun/"
FileNameExtensions: ["qrs"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "["
    CaseSensitive: true
  - Pos: any
    AsciiString: "STARTMODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARAMS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NOTES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GUID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH"
    CaseSensitive: false
