Name: ESET Smart Security Quarantine Data
URL: "http://es.wikipedia.org/wiki/ESET_Smart_Security"
FileNameExtensions: ["ndf"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "EQDF\xBB\v\0\0\x01\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "NIWI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EQDF"
    CaseSensitive: false
