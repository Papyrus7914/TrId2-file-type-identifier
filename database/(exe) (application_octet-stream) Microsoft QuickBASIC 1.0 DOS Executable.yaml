Name: Microsoft QuickBASIC 1.0 DOS Executable
URL: "https://en.wikipedia.org/wiki/QuickBASIC"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "\0 \0"
    CaseSensitive: true
  - Pos: 11
    Bytes: [0x01, 0xFF, 0xFF]
  - Pos: 16
    Bytes: [0x00, 0x02]
  - Pos: 20
    AsciiString: "0\0\0\0\x1E\0\0\0\x01\0\x12\0\0\0\x14\0\0\0\x16\0\0\03\0\0\08\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MUST RUN UNDER DOS 2.00 OR LATER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WRONG VERSION OF RUNTIME MODULE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENTER NEW PATH SPECIFICATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MUST LINK WITH BCOM10.LIB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CANNOT FIND BRUN10.EXE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ERROR IN EXE FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROGRAM TOO LARGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$BRUN10.EXE\0PATH"
    CaseSensitive: false
