Name: DCS Mission
URL: "https://en.wikipedia.org/wiki/Digital_Combat_Simulator"
FileNameExtensions: ["miz"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "mission"
    CaseSensitive: true
  - Pos: any
    AsciiString: "WAREHOUSESPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MISSIONPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPTIONSPK"
    CaseSensitive: false
