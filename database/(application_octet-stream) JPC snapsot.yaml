Name: JPC snapsot
Description: JPC is a pure Java x86 emulator.
URL: "https://en.wikipedia.org/wiki/JPC_(emulator)"
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "MONITORPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PCPK"
    CaseSensitive: false
