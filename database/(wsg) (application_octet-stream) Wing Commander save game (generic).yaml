Name: Wing Commander save game (generic)
URL: "https://www.mobygames.com/group/20/wing-commander-series/"
FileNameExtensions: ["wsg"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM\0\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "SAVE"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SAVE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STAT"
    CaseSensitive: false
