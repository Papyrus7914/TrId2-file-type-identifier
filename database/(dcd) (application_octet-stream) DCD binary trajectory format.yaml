Name: DCD binary trajectory format
Description: Standard atomic trajectory format used by molecular dynamics packages (like NAMD, CHARMM, XPlor).
FileNameExtensions: ["dcd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 1
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 4
    AsciiString: "CORD"
    CaseSensitive: true
  - Pos: 180
    AsciiString: "REMARKS "
    CaseSensitive: true
  - Pos: any
    AsciiString: "CREATED BY"
    CaseSensitive: false
