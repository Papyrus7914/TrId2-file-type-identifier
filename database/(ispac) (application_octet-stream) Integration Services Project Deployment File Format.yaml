Name: Integration Services Project Deployment File Format
URL: "https://msdn.microsoft.com/en-us/library/ff952821(v=sql.105).aspx"
FileNameExtensions: ["ispac"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "PROJECT.MANIFESTPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT.PARAMSPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENT_TYPES"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".DTSXPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".XMLPK"
    CaseSensitive: false
