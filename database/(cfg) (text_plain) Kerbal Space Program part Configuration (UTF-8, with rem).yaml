Name: Kerbal Space Program part Configuration (UTF-8, with rem)
URL: "https://en.wikipedia.org/wiki/Kerbal_Space_Program"
FileNameExtensions: ["cfg"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    #                          /     /
    Bytes: [0xEF, 0xBB, 0xBF, 0x2F, 0x2F]
  - Pos: any
    AsciiString: "MANUFACTURER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PART"
    CaseSensitive: false
