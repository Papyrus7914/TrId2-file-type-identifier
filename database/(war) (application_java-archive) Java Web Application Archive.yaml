Name: Java Web Application Archive
URL: "https://java.sun.com/"
FileNameExtensions: ["war"]
MimeType: application/java-archive
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "WEB-INF"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".XMLPK"
    CaseSensitive: false
