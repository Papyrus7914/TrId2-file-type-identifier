Name: EPSILON wavelet Filter
URL: "http://fileformats.archiveteam.org/wiki/EPSILON"
FileNameExtensions: ["filter"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PRIMARY CAUSALITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILTER ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".FILTER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INFO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
