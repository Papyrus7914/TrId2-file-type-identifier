Name: SURFCAM design
Description: A CNC tool.
FileNameExtensions: ["dsn"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #                    -
    Bytes: [0xE5, 0xE5, 0x2D, 0x01]
  - Pos: any
    AsciiString: "AXONOMETRIC VIEW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RIGHT SIDE VIEW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ISOMETRIC VIEW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LEFT SIDE VIEW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BOTTOM VIEW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FRONT VIEW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BACK VIEW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOP VIEW"
    CaseSensitive: false
