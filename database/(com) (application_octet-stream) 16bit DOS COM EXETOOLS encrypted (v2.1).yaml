Name: 16bit DOS COM EXETOOLS encrypted (v2.1)
Description: Executable tools by DISMEMBER.
FileNameExtensions: ["com"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "h\0\x01h0\x01h"
    CaseSensitive: true
  - Pos: 9
    #                                            W                                         Y     ^     _     W                       2                                                                       3                 E     T     2     1
    Bytes: [0xBE, 0x16, 0x01, 0xBF, 0xFF, 0xFE, 0x57, 0xB9, 0x1A, 0x00, 0xF3, 0xA4, 0xC3, 0x59, 0x5E, 0x5F, 0x57, 0xB4, 0x01, 0xAC, 0x32, 0xC4, 0xC0, 0xC4, 0x03, 0x02, 0xE1, 0x02, 0xF0, 0xAA, 0xE2, 0xF3, 0x33, 0xC0, 0xC3, 0x45, 0x54, 0x32, 0x31]
  - Pos: any
    AsciiString: "ET21"
    CaseSensitive: false
