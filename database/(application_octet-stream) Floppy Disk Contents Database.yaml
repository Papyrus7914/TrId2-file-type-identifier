Name: Floppy Disk Contents Database
Description: Amiga disk catalog tool by Amit 'LordBarak' Fridman.
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "FBS1KEYS"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FBS1KEYS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FLPYRCRD"
    CaseSensitive: false
