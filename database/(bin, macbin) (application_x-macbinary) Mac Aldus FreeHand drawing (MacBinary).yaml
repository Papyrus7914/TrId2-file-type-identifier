Name: Mac Aldus FreeHand drawing (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/Adobe_FreeHand"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "acf3"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ACF3"
    CaseSensitive: false
