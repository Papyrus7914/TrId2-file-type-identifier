Name: MAGMAinteract simulation result (Casting)
URL: "https://www.magmasoft.de/"
FileNameExtensions: ["iact"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: ".IACT.UNCOMPRESSEDPK"
    CaseSensitive: false
