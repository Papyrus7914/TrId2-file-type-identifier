Name: Native 32 game assets
URL: "https://bootleggames.fandom.com/wiki/Native_32"
FileNameExtensions: ["smf", "ssl"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "SWFT_YUV"
    CaseSensitive: true
  - Pos: any
    AsciiString: "_YUVGAMEMAKER 1."
    CaseSensitive: false
