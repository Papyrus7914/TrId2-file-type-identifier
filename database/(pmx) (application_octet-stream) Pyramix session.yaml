Name: Pyramix session
URL: "https://www.merging.com/products/pyramix/"
FileNameExtensions: ["pmx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "_TEMPLATE.DEFAULTLIBRARY.PMLUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_TEMPLATE.COMPOSITION.PMLUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_TEMPLATE.AUTOMATION.PADUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_TEMPLATE.PLAYLISTS.PMLUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_TEMPLATE.WORKSPACE.PMWUT"
    CaseSensitive: false
