Name: Truevision3D Model
URL: "https://en.wikipedia.org/wiki/Truevision3D"
FileNameExtensions: ["tvm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "TVMO"
    CaseSensitive: true
  - Pos: any
    AsciiString: ".BMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FULL"
    CaseSensitive: false
