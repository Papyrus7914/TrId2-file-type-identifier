Name: Dark Forces Game data archive
Description: A container format used by various LucasArts games.
URL: "http://wiki.xentax.com/index.php/Star_Wars_-_Dark_Forces"
FileNameExtensions: ["gob"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "GOB\n"
    CaseSensitive: true
