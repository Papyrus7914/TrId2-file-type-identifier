Name: Virtua Fighter 2 - The Screen Saver data
FileNameExtensions: ["ezs"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "EZSAVERDATAv1.00"
    CaseSensitive: true
  - Pos: any
    AsciiString: "AKIRA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "JACKY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SARAH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOUND"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".BMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".WAV"
    CaseSensitive: false
