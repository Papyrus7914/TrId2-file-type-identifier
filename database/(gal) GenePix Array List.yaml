Name: GenePix Array List
URL: "http://www.moleculardevices.com/pages/software/gn_genepix_pro.html"
FileNameExtensions: ["gal"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "ATF\t"
    CaseSensitive: true
  - Pos: any
    AsciiString: "GENEPIX ARRAY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BLOCKCOUNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LIST V"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BLOCK1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLUMN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
