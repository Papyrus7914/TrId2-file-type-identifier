Name: Mac Compact Pro archive
URL: "http://fileformats.archiveteam.org/wiki/Compact_Pro"
FileNameExtensions: ["cpt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CPCT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PACT"
    CaseSensitive: false
