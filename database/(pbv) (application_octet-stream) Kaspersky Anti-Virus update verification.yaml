Name: Kaspersky Anti-Virus update verification
URL: "https://en.wikipedia.org/wiki/Kaspersky_Lab"
FileNameExtensions: ["pbv"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "KLrg\x01"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "KLsw\0\0\xAD\xAD\x01\0\0\0\xFC\x03\0\0\x03"
    CaseSensitive: true
  - Pos: any
    AsciiString: "KLSW"
    CaseSensitive: false
