    CaseSensitive: false
  - Pos: any
    AsciiString: "INTERNALSIGNATURE ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SUBSEQUENCE POSITION"
    CaseSensitive: false
  - Pos: any
