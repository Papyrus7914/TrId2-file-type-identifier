Name: MapViewer Map (v1.0)
Description: Geographic data visualization program for Windows 3.x by Golden Software, Inc.
FileNameExtensions: ["gsm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Map File:  Copyright Golden Software Inc. 1990-"
    CaseSensitive: true
  - Pos: 51
    Bytes: [0x1A]
