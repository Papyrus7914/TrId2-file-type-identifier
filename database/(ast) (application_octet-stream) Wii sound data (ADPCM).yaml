Name: Wii sound data (ADPCM)
URL: "https://wiki.tockdom.com/wiki/AST_(File_Format)"
FileNameExtensions: ["ast"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "STRM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 64
    AsciiString: "BLCK"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BLCK"
    CaseSensitive: false
