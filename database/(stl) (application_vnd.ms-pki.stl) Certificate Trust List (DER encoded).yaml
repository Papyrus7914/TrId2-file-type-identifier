Name: Certificate Trust List (DER encoded)
FileNameExtensions: ["stl"]
MimeType: application/vnd.ms-pki.stl
DetectionPatterns:
  - Pos: 0
    AsciiString: "0"
    CaseSensitive: true
  - Pos: 23
    Bytes: [0x02]
  - Pos: any
    AsciiString: "ROOT CERTIFICATE AUTHORITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".CRL0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
