Name: HOT Pop-Up Program
Description: MS-DOS menu system/utility by Executive Systems.
FileNameExtensions: ["pgm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #              ␠           %           ]
    Bytes: [0xCD, 0x20, 0x03, 0x25, 0x03, 0x5D, 0xC3, 0x00, 0xE8]
  - Pos: any
    AsciiString: "PSQR"
    CaseSensitive: false
