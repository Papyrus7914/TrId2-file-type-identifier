Name: Double Commander highlighters
URL: "https://doublecmd.sourceforge.io/"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "HIGHLIGHTERS VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HIGHLIGHTER TAG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULTFILTER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOUBLECMD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
