Name: FreePascal JSON Resource Strings format (v1)
URL: "https://en.wikipedia.org/wiki/Free_Pascal"
FileNameExtensions: ["rsj"]
MimeType: text/json
DetectionPatterns:
  - Pos: 0
    AsciiString: "{\"version\":1,\"strings\":["
    CaseSensitive: true
  - Pos: any
    AsciiString: "SOURCEBYTES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HASH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
