Name: Code::Blocks lexer
URL: "https://en.wikipedia.org/wiki/Code::Blocks"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOCTYPE CODEBLOCKS_LEXER_PROPERTIES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAMPLECODE VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LEXER NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STYLE NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNDERLINED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHARACTER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILEMASKS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SET INDEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KEYWORDS"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".SAMPLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ITALICS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUMBER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ERROR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BOLD"
    CaseSensitive: false
