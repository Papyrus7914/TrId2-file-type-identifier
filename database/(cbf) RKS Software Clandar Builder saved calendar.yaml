Name: RKS Software Clandar Builder saved calendar
URL: "http://www.rkssoftware.com/calendarbuilder/overview.html"
FileNameExtensions: ["cbf"]
DetectionPatterns:
  - Pos: 0
    Bytes: [0x01, 0x02, 0x04, 0x02, 0x01, 0x02]
  - Pos: 7
    Bytes: [0x02]
  - Pos: any
    AsciiString: "TWPRTFSTORAGE\0\0\0TPF0"
    CaseSensitive: false
