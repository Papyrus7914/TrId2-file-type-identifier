Name: MAGIX Movie Edit Pro project
URL: "https://en.wikipedia.org/wiki/Magix"
FileNameExtensions: ["avd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "RIFF"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "SEKD"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CRSS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LIST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEKD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VDPR"
    CaseSensitive: false
