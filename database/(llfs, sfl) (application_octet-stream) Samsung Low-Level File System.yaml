Name: Samsung Low-Level File System
Description: Log-structured file system designed for NAND flash storage in Samsung devices.
FileNameExtensions: ["llfs", "sfl"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "LLFS"
    CaseSensitive: true
  - Pos: any
    AsciiString: "FL_STOP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FL_WAIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FL_OUT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FL_IN"
    CaseSensitive: false
