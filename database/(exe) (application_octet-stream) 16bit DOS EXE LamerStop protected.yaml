Name: 16bit DOS EXE LamerStop protected
Description: EXE protector by Stefan Esser.
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: 9
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 12
    Bytes: [0xFF, 0xFF]
  - Pos: 17
    Bytes: [0x06]
  - Pos: 20
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 25
    AsciiString: "\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "OBER BUSCHWEG 9A"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REGISTERED TO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "D-50999 K"
    CaseSensitive: false
  - Pos: any
    AsciiString: "N ESSER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ADRESS"
    CaseSensitive: false
