Name: Time Shift Video
Description: DVB recorded video. It's a MPEG Transport Stream. It can be inspected by MediaInfo and viewed with VLC player.
URL: "http://www.filetypeadvisor.com/de/extension/tsv"
FileNameExtensions: ["tsv"]
MimeType: video/x-tsv
DetectionPatterns:
  - Pos: 0
    AsciiString: "TSRF2."
    CaseSensitive: true
