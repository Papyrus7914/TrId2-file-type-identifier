Name: DOS Executable Lattice C (v1.x)
URL: "https://en.wikipedia.org/wiki/Lattice_C"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 12
    Bytes: [0xFF, 0xFF]
  - Pos: any
    AsciiString: "T CREATE STDOUT FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "T OPEN STDIN FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LATTICE C 1."
    CaseSensitive: false
  - Pos: any
    AsciiString: "MEMORY"
    CaseSensitive: false
