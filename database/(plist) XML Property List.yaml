Name: XML Property List
URL: "http://en.wikipedia.org/wiki/Property_list"
FileNameExtensions: ["plist"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOCTYPE PLIST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PLIST VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROPERTYLIST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "APPLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UTF-8"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".DTD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DTDS"
    CaseSensitive: false
