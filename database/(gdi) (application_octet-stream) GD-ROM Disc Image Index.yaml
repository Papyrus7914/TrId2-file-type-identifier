Name: GD-ROM Disc Image Index
URL: "https://www.romhacking.net/utilities/1449/"
FileNameExtensions: ["gdi"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "3\r\n1     0 4 2352 \""
    CaseSensitive: true
  - Pos: any
    AsciiString: "(TRACK 1).BIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(TRACK 2).BIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "(TRACK 3).BIN"
    CaseSensitive: false
