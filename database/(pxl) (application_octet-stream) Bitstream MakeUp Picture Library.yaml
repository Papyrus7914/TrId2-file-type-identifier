Name: Bitstream MakeUp Picture Library
Description: Windows app to create texts with special effects.
FileNameExtensions: ["pxl"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 5
    AsciiString: "\0Compound Object\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "COMPOUND OBJECT"
    CaseSensitive: false
