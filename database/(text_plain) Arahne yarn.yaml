Name: Arahne yarn
URL: "https://www.arahne.si"
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "#Y_DEF="
    CaseSensitive: true
  - Pos: any
    AsciiString: "Y_DIM_FACTOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COUNT_UNIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "Y_TWIST_M"
    CaseSensitive: false
  - Pos: any
    AsciiString: "Y_COLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "Y_COUNT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "Y_MODEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_COLORS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "Y_CODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "Y_END"
    CaseSensitive: false
