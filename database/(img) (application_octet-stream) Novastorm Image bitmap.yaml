Name: Novastorm Image bitmap
URL: "https://www.mobygames.com/game/271/novastorm/"
FileNameExtensions: ["img"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PHED"
    CaseSensitive: true
  - Pos: 6
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "EOFL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PICC"
    CaseSensitive: false
