Name: DITA Map (UTF-8)
URL: "https://en.wikipedia.org/wiki/Darwin_Information_Typing_Architecture"
FileNameExtensions: ["ditamap"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xEF\xBB\xBF<?xml version=\"1.0\" encoding=\"UTF-8\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOCTYPE MAP PUBLIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DTD DITA MAP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAP.DTD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OASIS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOPIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HREF"
    CaseSensitive: false
