Name: Sony PictureGear Studio Binder document
URL: "http://fileformats.archiveteam.org/wiki/Sony_PictureGear_Studio"
FileNameExtensions: ["bxu", "bxt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "8\0\0\0TGBN"
    CaseSensitive: true
  - Pos: 56
    AsciiString: "(\0\0\0ATTR"
    CaseSensitive: true
  - Pos: any
    AsciiString: "(\0\0\0ATTR"
    CaseSensitive: false
