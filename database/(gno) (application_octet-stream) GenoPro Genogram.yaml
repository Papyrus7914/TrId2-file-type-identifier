Name: GenoPro Genogram
URL: "https://genopro.com/"
FileNameExtensions: ["gno"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04, 0x14, 0x00]
  - Pos: 7
    AsciiString: "\0\b\0"
    CaseSensitive: true
  - Pos: 25
    AsciiString: "\0\b\0\0\0Data.xml"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DATA.XMLPK"
    CaseSensitive: false
