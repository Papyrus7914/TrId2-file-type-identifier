Name: MaxonCAD hatch patterns
Description: Old Amiga CAD software.
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MXCDHTCH"
    CaseSensitive: true
  - Pos: 16
    AsciiString: "HTCH"
    CaseSensitive: true
  - Pos: 24
    AsciiString: "NAME"
    CaseSensitive: true
