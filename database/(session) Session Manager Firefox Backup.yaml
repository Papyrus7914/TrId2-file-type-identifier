Name: Session Manager Firefox Backup
Description: Session Manager allows you to save the current state of Firefox (history, text data, cookies) and return to that state at any later moment.
URL: "http://sessionmanager.mozdev.org/index.html"
FileNameExtensions: ["session"]
DetectionPatterns:
