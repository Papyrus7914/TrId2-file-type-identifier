Name: Metasequoia 3D scene
URL: "https://en.wikipedia.org/wiki/Metasequoia_(software)"
FileNameExtensions: ["mqo"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "Metasequoia Document"
    CaseSensitive: true
  - Pos: any
    AsciiString: "OBJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERTEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEAD"
    CaseSensitive: false
