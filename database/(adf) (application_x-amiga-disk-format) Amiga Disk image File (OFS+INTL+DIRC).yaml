Name: Amiga Disk image File (OFS+INTL+DIRC)
Description: Old/Original File System, International Chars, Directory Cache.
URL: "https://en.wikipedia.org/wiki/Amiga_Disk_File"
FileNameExtensions: ["adf"]
MimeType: application/x-amiga-disk-format
DetectionPatterns:
  - Pos: 0
    AsciiString: "DOS\x06"
    CaseSensitive: true
