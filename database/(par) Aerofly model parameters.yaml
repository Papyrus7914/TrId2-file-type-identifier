Name: Aerofly model parameters
URL: "http://www.aerofly.com/"
FileNameExtensions: ["par"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "VERSION 1.0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "AIRPLANE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAIN"
    CaseSensitive: false
