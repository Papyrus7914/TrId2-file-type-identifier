Name: IBM Storyboard bitmap (generic)
URL: "https://en.wikipedia.org/wiki/IBM_Storyboard_Plus"
FileNameExtensions: ["pic"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 2
    Bytes: [0xC1]
  - Pos: 4
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 10
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 127
    AsciiString: "\0"
    CaseSensitive: true
