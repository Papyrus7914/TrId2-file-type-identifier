Name: 3D LUT (Photoshop Export Color Lookup Plugin)
FileNameExtensions: ["3dl"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "#Created by: Adobe Photoshop Export Color Lookup Plugin\n#"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
