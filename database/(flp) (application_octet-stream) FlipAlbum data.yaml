Name: FlipAlbum data
URL: "http://fileformats.archiveteam.org/wiki/FlipAlbum"
FileNameExtensions: ["flp"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "<!-- Version 1."
    CaseSensitive: true
  - Pos: 16
    AsciiString: " -->\r\n\r\n<FLP>\r\n\r\n<HEAD>\r\n{width: "
    CaseSensitive: true
  - Pos: 52
    AsciiString: "; height: "
    CaseSensitive: true
  - Pos: 65
    AsciiString: "}\r\n</HEAD>\r\n\r\n<BODY>\r\n\r\n<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "-- VERSION 1."
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BODY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FLP"
    CaseSensitive: false
