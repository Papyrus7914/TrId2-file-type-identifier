Name: PES game data (generic)
URL: "https://en.wikipedia.org/wiki/Pro_Evolution_Soccer_(video_game)"
FileNameExtensions: ["bin", "model", "mtl"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\x10\x01WESYS"
    CaseSensitive: true
  - Pos: 16
    #        x
    Bytes: [0x78, 0xDA]
