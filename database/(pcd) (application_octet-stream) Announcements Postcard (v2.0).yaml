Name: Announcements Postcard (v2.0)
Description: Printed graphics designer for Windows 3.x by Parsons Technology.
FileNameExtensions: ["pcd"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x01]
  - Pos: 2
    AsciiString: "Announcements V2.0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ANNOUNCEMENTS V2.0"
    CaseSensitive: false
