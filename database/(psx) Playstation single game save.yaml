Name: Playstation single game save
FileNameExtensions: ["psx"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "B"
    CaseSensitive: true
  - Pos: 2
    AsciiString: "S"
    CaseSensitive: true
  - Pos: 5
    AsciiString: "S"
    CaseSensitive: true
  - Pos: 54
    AsciiString: "SC"
    CaseSensitive: true
