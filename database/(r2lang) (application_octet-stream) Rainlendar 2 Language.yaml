Name: Rainlendar 2 Language
URL: "https://en.wikipedia.org/wiki/Rainlendar"
FileNameExtensions: ["r2lang"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "RAINLENDAR2.MOPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RAINLENDAR2.POPK"
    CaseSensitive: false
