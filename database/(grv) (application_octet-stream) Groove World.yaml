Name: Groove World
URL: "https://lostmediawiki.com/3D_Groove_Games_(partially_lost_online_games;_1998-2009)"
FileNameExtensions: ["grv"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "root\0\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LOAD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROOT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
