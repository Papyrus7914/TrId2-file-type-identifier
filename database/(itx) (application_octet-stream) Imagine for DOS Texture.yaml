Name: Imagine for DOS Texture
URL: "https://en.wikipedia.org/wiki/Imagine_(3D_modeling_software)"
FileNameExtensions: ["itx"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MQ"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TEXTURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ITXT"
    CaseSensitive: false
