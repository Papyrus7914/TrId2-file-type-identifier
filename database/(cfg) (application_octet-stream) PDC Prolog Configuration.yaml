Name: PDC Prolog Configuration
URL: "https://en.wikipedia.org/wiki/Visual_Prolog"
FileNameExtensions: ["cfg"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "PDC PROLOG 10"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ERROR EXPLANATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-- LOAD FILE --"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RESIZE   SHIFT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SELECT COLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FAST RESIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NEXT WINDOW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTINUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "END VIEW"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRACE ON"
    CaseSensitive: false
  - Pos: any
    AsciiString: "END\0\0F1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "F10-END"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHIFT-F"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ARROWS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COPY F"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HELP F"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEARCH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "*.CFG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "*.PRJ"
    CaseSensitive: false
  - Pos: any
    AsciiString: "*.PRO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ALT-T"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ALT-X"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CTRL-"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XEDIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GOAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MOVE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAVE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STEP"
    CaseSensitive: false
