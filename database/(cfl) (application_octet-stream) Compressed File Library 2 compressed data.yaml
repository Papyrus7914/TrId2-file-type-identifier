Name: Compressed File Library 2 compressed data
URL: "http://fileformats.archiveteam.org/wiki/CFL"
FileNameExtensions: ["cfl"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "CFL2"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CFL2"
    CaseSensitive: false
