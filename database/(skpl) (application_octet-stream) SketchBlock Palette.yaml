Name: SketchBlock Palette
URL: "https://www.broad.ology.org.uk/amiga/sketchblock/"
FileNameExtensions: ["skpl"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "palette.xml"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PALETTE.XMLPK"
    CaseSensitive: false
