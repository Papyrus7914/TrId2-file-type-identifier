Name: FrameMaker Help
Description: The internal FrameMaker help use FrameMaker document format.
URL: "http://fileformats.archiveteam.org/wiki/FrameMaker"
FileNameExtensions: ["hlp"]
MimeType: application/vnd.framemaker
