Name: Class Diagram (Unicode)
FileNameExtensions: ["cd"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TYPEIDENTIFIER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MINORVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAJORVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLASSDIAGRAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POSITION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLASS NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FONT NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HASHCODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENCODING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIDTH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIZE"
    CaseSensitive: false
