Name: GeneXus Report Viewer
FileNameExtensions: ["gxr"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\x1E\0\0\0\0\0\xFF\xFF\0\0\x0E\0CReportBuilder"
    CaseSensitive: true
  - Pos: 91
    AsciiString: "\0\0\0\tGXPRN.INI"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CREPORTOBJECTTEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREPORTSTARTPAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREPORTBUILDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREPORTENDPAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREPORTENDDOC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GXPRN.INI"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COBJFONT"
    CaseSensitive: false
