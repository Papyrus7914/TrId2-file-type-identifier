Name: Packed Bohemia Object game data archive
Description: Used in various Bohemia Interactive games like the ARMA serie.
URL: "https://en.wikipedia.org/wiki/Bohemia_Interactive"
FileNameExtensions: ["pbo"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0sreV"
    CaseSensitive: true
