Name: Surge (XT) fx preset
URL: "https://surge-synthesizer.github.io/"
FileNameExtensions: ["srgfx"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<single-fx streaming_version=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "SNAPSHOT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
