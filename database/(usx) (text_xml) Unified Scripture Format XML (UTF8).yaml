Name: Unified Scripture Format XML (UTF8)
URL: "http://ebible.org/usfx/"
FileNameExtensions: ["usx"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    #                          <
    Bytes: [0xEF, 0xBB, 0xBF, 0x3C]
  - Pos: any
    AsciiString: "CHAPTER NUMBER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSE NUMBER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USX VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARA STYLE"
    CaseSensitive: false
