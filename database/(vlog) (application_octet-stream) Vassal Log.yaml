Name: Vassal Log
URL: "https://vassalengine.org/"
FileNameExtensions: ["vlog"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "savedGame"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MODULEDATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAVEDGAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAVEDATA"
    CaseSensitive: false
