Name: Windows Desktop Theme
Description: extension "the" is found on install medium or precopy state of Windows 9M and later renamed to "theme" by setup
URL: "https://msdn.microsoft.com/en-us/library/windows/desktop/bb773190(v=vs.85).aspx"
FileNameExtensions: ["theme", "the"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "["
    CaseSensitive: true
  - Pos: any
    AsciiString: "MASTERTHEMESELECTOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTROL PANEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESKTOP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLORS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MTSM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIZE"
    CaseSensitive: false
