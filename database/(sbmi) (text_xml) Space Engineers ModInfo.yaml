Name: Space Engineers ModInfo
URL: "https://en.wikipedia.org/wiki/Space_Engineers"
FileNameExtensions: ["sbmi"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\"?>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MYOBJECTBUILDER_MODINFO XMLNS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XMLSCHEMA-INSTANCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STEAMIDOWNER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WORKSHOPID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WWW.W3.ORG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "2001"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
