Name: OpenToonz cleanup settings
URL: "https://github.com/opentoonz/opentoonz"
FileNameExtensions: ["cln"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<version>"
    CaseSensitive: true
  - Pos: any
    AsciiString: "LINEPROCESSING AUTOADJUST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLOSESTFIELD VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CAMERAXPREVALENCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESPECKLING VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLEANUPPALETTE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRANSFORM YOFF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AAVALUE VALUE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLEANUPCAMERA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INTERESTRECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NOANTIALIAS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CAMERASIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STYLEPAGES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CAMERARES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHARPNESS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHORTCUTS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FDG NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR_0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INDICES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLORS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STYLES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MLAA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH"
    CaseSensitive: false
