Name: STOS Memory Bank (generic)
Description: BASIC dialect for the Atari ST, especially targeted to game creation.
URL: "http://en.wikipedia.org/wiki/STOS_BASIC"
FileNameExtensions: ["mbk"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Lionpoubnk"
    CaseSensitive: true
