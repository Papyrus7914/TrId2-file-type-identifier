Name: Windows driver setup Information (Unicode)
URL: "https://learn.microsoft.com/en-us/windows-hardware/drivers/install/overview-of-inf-files"
FileNameExtensions: ["inf"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xFF\xFE[\0U\0n\0i\0c\0o\0d\0e\0]\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "$\0C\0H\0I\0C\0A\0G\0O\0$"
    CaseSensitive: false
  - Pos: any
    AsciiString: "S\0I\0G\0N\0A\0T\0U\0R\0E"
    CaseSensitive: false
  - Pos: any
    AsciiString: "R\0E\0V\0I\0S\0I\0O\0N"
    CaseSensitive: false
  - Pos: any
    AsciiString: "U\0N\0I\0C\0O\0D\0E"
    CaseSensitive: false
  - Pos: any
    AsciiString: "V\0E\0R\0S\0I\0O\0N"
    CaseSensitive: false
  - Pos: any
    AsciiString: "Y\0E\0S"
    CaseSensitive: false
