Name: Skyland's Star game data
URL: "http://excelsior-rpg.com/ss.htm"
FileNameExtensions: ["txt"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "?cw1 \""
    CaseSensitive: true
  - Pos: any
    AsciiString: "PRINT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERBS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PN 2"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ROOM"
    CaseSensitive: false
