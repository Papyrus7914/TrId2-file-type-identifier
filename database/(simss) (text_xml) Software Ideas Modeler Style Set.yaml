    AsciiString: "\xEF\xBB\xBF<sim-style-set version=\"1.0\" name=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "SIM-STYLE-SET VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STEREOTYPE-COLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STYLE-DEFINITION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STEREOTYPE-FONT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WRAP-OTHER-TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WRAP-NAME-TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULT-STYLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHADOW-COLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHADOW-TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BACKGROUND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME-COLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT-COLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DER-COLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME-FONT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT-FONT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BORDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLOR2"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIDTH"
    CaseSensitive: false
