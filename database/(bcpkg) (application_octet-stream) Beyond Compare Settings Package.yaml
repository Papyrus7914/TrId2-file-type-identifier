Name: Beyond Compare Settings Package
URL: "http://en.wikipedia.org/wiki/Beyond_Compare"
FileNameExtensions: ["bcpkg"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 29
    AsciiString: "\0BC"
    CaseSensitive: true
  - Pos: any
    AsciiString: "S.XML"
    CaseSensitive: false
