    AsciiString: "BORDERCOLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCREENCODES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FRAMEBUFS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHARSET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COLORS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UPPER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WIDTH"
    CaseSensitive: false
