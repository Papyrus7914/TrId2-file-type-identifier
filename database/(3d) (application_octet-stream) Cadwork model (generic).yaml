    AsciiString: "CONTENT_3D.BBK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENT_3D.FDB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENT_3D.SAB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ACTIONMAP.TXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJEKT.XMLM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROJECT.XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHOPDRAWING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MSGMAP.TXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PNG1.PNG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PNG2.PNG"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VARIANTS"
    CaseSensitive: false
