Name: FreeDOS KEYBoard layout collection
Description: created by KLIB from *.KL for FreeDOS keyboard driver KEYB.
URL: "http://help.fdos.org/en/hhstndrd/base/klib.htm"
FileNameExtensions: ["sys"]
MimeType: application/x-fdos-keyb
DetectionPatterns:
  - Pos: 0
    AsciiString: "KCF\0\x01"
    CaseSensitive: true
