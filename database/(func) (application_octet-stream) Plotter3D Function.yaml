Name: Plotter3D Function
Description: Amiga 3D data plotter.
FileNameExtensions: ["func"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "FUNCFDAT"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FUNCFDAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRAN"
    CaseSensitive: false
