Name: TSComp compressed data (single)
Description: Often the archive name is created by changing the last letter of orginal filename extension to $ or ! in case just a name already exist.
URL: "http://fileformats.archiveteam.org/wiki/TSComp"
FileNameExtensions: ["bm$", "st$", "bm!", "cm$", "dl$", "ex$", "fl$", "hl$", "ic$", "in$", "pi$", "sa$", "sm$", "tb$", "vb$", "pf1", "pr$", "sta", "tt$", "ttt"]
MimeType: application/x-tscomp-compressed
DetectionPatterns:
  - Pos: 0
    AsciiString: "e]\x13\x8C\b\x01\x03\0\x01\0\0\0\0\x12"
    CaseSensitive: true
  - Pos: 18
    AsciiString: "\0\0\0\0"
    CaseSensitive: true
  - Pos: 26
    AsciiString: "\0\0"
    CaseSensitive: true
