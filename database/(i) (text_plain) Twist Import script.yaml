Name: Twist Import script
Description: Old Amiga database software.
URL: "https://archive.org/details/Twist_2_1994_HiSoft"
FileNameExtensions: ["i"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "IMPORT "
    CaseSensitive: true
  - Pos: any
    AsciiString: "POSDEPEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMPORT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FIELD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
