Name: Blophome published project
URL: "http://www.blophome.com/"
FileNameExtensions: ["bhw"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "DIIN Project File"
    CaseSensitive: true
  - Pos: 84
    AsciiString: "LSPrev$$$.bmp"
    CaseSensitive: true
  - Pos: 101
    AsciiString: "BM"
    CaseSensitive: true
  - Pos: any
    AsciiString: "HABITACIO"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRINCIPAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".SIM"
    CaseSensitive: false
