Name: Password Boss data
Description: Password Boss is a password keeping tool.
URL: "http://www.ammosoft.com/"
FileNameExtensions: ["pwb"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "PB1."
    CaseSensitive: true
  - Pos: 6
    AsciiString: "1."
    CaseSensitive: true
  - Pos: 9
    AsciiString: "0"
    CaseSensitive: true
