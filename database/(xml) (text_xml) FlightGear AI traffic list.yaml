Name: FlightGear AI traffic list
URL: "https://wiki.flightgear.org/AI_Traffic"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "PERFORMANCE-CLASS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REQUIRED-AIRCRAFT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REGISTRATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TRAFFICLIST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CRUISE-ALT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FLIGHTTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEPARTURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HOME-PORT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CALLSIGN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FLTRULES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AIRLINE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ARRIVAL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ACTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OFFSET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RADIUS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REPEAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HEAVY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODEL"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".XML"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TIME"
    CaseSensitive: false
