Name: Linux Software Map entry (v3)
URL: "https://en.wikipedia.org/wiki/Linux_Software_Map"
FileNameExtensions: ["lsm"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "Begin3"
    CaseSensitive: true
  - Pos: any
    AsciiString: "COPYING-POLICY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAINTAINED-BY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KEYWORDS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "AUTHOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-SITE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
