Name: Microsoft OneNote note
Description: OneNote is a note-taking and management program.
URL: "http://www.microsoft.com/office/onenote"
FileNameExtensions: ["one"]
DetectionPatterns:
  - Pos: 0
    #              R     \\    {                       M                 S     x           )
    Bytes: [0xE4, 0x52, 0x5C, 0x7B, 0x8C, 0xD8, 0xA7, 0x4D, 0xAE, 0xB1, 0x53, 0x78, 0xD0, 0x29, 0x96, 0xD3]
  - Pos: 48
    #        ?                                         I
    Bytes: [0x3F, 0xDD, 0x9A, 0x10, 0x1B, 0x91, 0xF5, 0x49]
