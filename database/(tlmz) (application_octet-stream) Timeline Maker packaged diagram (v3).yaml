Name: Timeline Maker packaged diagram (v3)
URL: "http://fileformats.archiveteam.org/wiki/Timeline_Maker"
FileNameExtensions: ["tlmz"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: ".TLM3PK"
    CaseSensitive: false
