Name: MeshLab mesh
URL: "https://en.wikipedia.org/wiki/MeshLab"
FileNameExtensions: ["obj"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "####"
    CaseSensitive: true
  - Pos: any
    AsciiString: "OBJ FILE GENERATED BY MESHLAB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COORDS TEXTURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "END OF FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERTICES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OBJECT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FACES"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".OBJ"
    CaseSensitive: false
