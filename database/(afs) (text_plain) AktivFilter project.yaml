Name: AktivFilter project
URL: "https://www.aktivfilter.de/"
FileNameExtensions: ["afs"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "*** AktivFilter-Specification ***\r\n\r\n[CREATION]\r\nDESIGNER="
    CaseSensitive: true
  - Pos: any
    AsciiString: "CHARACTERISTIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GAINDISTRIB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CAPACITORS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FREQUENCY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IMPEDANCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RESISTORS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRUCTURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CREATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESIGNER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SEQUENCE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GAIN_DB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OPAMP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ORDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOOL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
