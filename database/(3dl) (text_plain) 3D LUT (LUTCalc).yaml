    CaseSensitive: false
  - Pos: any
    AsciiString: "NUMBER OF NODES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IDENTIFICATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NUMBER OF ROWS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BY BEN TURLEY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUTPUT RANGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INPUT RANGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DATA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USER"
    CaseSensitive: false
