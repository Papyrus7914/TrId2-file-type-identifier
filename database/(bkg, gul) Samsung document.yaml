Name: Samsung document
FileNameExtensions: ["bkg", "gul"]
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1, 0x00]
  - Pos: any
    AsciiString: "S\0U\0M\0M\0A\0R\0Y\0I\0N\0F\0O\0R\0M\0A\0T\0I\0O\0N"
    CaseSensitive: false
  - Pos: any
    AsciiString: "A\0N\0C\0H\0O\0R\0E\0D\0 \0F\0R\0A\0M\0E"
    CaseSensitive: false
  - Pos: any
    AsciiString: "I\0M\0A\0G\0E\0 \0S\0T\0A\0C\0K"
    CaseSensitive: false
  - Pos: any
    AsciiString: "M\0A\0S\0T\0E\0R\0P\0A\0G\0E\00"
    CaseSensitive: false
  - Pos: any
    AsciiString: "R\0O\0O\0T\0 \0E\0N\0T\0R\0Y"
    CaseSensitive: false
  - Pos: any
    AsciiString: "A\0T\0T\0R\0I\0B\0U\0T\0E"
    CaseSensitive: false
  - Pos: any
    AsciiString: "C\0O\0N\0T\0E\0N\0T\0S"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCUMENT FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SAMSUNG"
    CaseSensitive: false
