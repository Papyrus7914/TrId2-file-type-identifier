Name: MLT XML document
URL: "https://mltframework.org/docs/mltxml/"
FileNameExtensions: ["mlt"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "PROPERTY NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MLT_SERVICE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "XML VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRODUCER"
    CaseSensitive: false
