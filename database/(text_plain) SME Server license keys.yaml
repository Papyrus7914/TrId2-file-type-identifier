Name: SME Server license keys
URL: "https://en.wikipedia.org/wiki/Koozali_SME_Server"
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "# DO NOT MODIFY THIS FILE."
    CaseSensitive: true
  - Pos: any
    AsciiString: "THIS FILE IS AUTOMATICALLY MAINTAINED BY THE MITEL NETWORKS SME SERVER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MANUALLY EDITING THIS FILE MAY PUT YOUR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYSTEM IN AN UNKNOWN STATE."
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONFIGURATION SOFTWARE."
    CaseSensitive: false
  - Pos: any
    AsciiString: "LICENSEKEY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYNCEXPIRY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SIGNATURE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VLICENSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UPDATED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REMOTE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USERS"
    CaseSensitive: false
