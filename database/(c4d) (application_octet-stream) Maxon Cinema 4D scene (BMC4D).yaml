Name: Maxon Cinema 4D scene (BMC4D)
URL: "http://fileformats.archiveteam.org/wiki/C4D"
FileNameExtensions: ["c4d"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "BMC4DOBJS"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BMC4DOBJS"
    CaseSensitive: false
