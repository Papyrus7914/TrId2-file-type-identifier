Name: Kat Desktop Search Environment Language Profile
FileNameExtensions: ["klp"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE klp SYSTEM \"klp.dtd\">\n<ngrams>\n <ngram occurrences=\""
    CaseSensitive: true
  - Pos: any
    AsciiString: "DOCTYPE KLP SYSTEM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NGRAM OCCURRENCES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "KLP.DTD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NGRAMS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VALUE"
    CaseSensitive: false
