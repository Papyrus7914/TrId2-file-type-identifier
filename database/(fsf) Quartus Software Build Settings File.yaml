Name: Quartus Software Build Settings File
URL: "http://en.wikipedia.org/wiki/Altera_Quartus"
FileNameExtensions: ["fsf"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "SOFTWARE_SETTINGS\r\n{\r\n\t"
    CaseSensitive: true
  - Pos: any
    AsciiString: "USE_C_PREPROCESSOR_FOR_GNU_ASM_FILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GNUPRO_NIOS_CPP_COMMAND_LINE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GNUPRO_ARM_CPP_COMMAND_LINE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DO_POST_BUILD_COMMAND_LINE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROGRAMMING_FILE_TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NO PROGRAMMING FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOFTWARE_SETTINGS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUTPUT_FILE_NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LITTLE ENDIAN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CUSTOM BUILD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OUTPUT_TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BYTE_ORDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INTEL HEX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TOOLSET"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".HEX"
    CaseSensitive: false
