Name: PowerBackup Job
Description: Used for scheduled backups.
URL: "http://www.cyberlink.com/products/powerbackup/"
FileNameExtensions: ["pbj"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<Project magic=\"{"
    CaseSensitive: true
  - Pos: any
    AsciiString: "BACKUPPROJECTTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BACKUP JOBID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INCLUDERTOOL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COMPRESSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FOLDER NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MEDIAOPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USEPASSWORD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BACKUPMODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILTERTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VOLUMESIZE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXTENSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SPLITMODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESTTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CONTENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERIFY"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".PBF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PATH"
    CaseSensitive: false
