Name: IFF Chunky bitmap
FileNameExtensions: ["ciff"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "FORM"
    CaseSensitive: true
  - Pos: 8
    AsciiString: "CHKYCHHD"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CBDY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CHHD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RGBA"
    CaseSensitive: false
