    CaseSensitive: false
  - Pos: any
    AsciiString: "OPERATION ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "/N OR BLANK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESTINATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERIFY_FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DELTA_COPY"
    CaseSensitive: false
