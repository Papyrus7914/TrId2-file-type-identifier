Name: Macrium Reflect clone definition
URL: "https://en.wikipedia.org/wiki/Macrium_Reflect"
FileNameExtensions: ["xml"]
MimeType: text/xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<?xml version=\"1.0\" encoding=\"UTF-8\"?>\r\n<clone_definition>\r\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "-- ID IS THE DISK SIGNATURE AND IS USED IN PLACE OF THE DISK INDEX IF SPECIFIED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-- OPTIONAL. SEARCH FOR SAME FILE ON DIFFERENT DRIVES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-- DISK IS THE 1 BASED INDEX OF THE DISK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USE THE CHS VALUES FROM THE SOURCE DISK."
    CaseSensitive: false
  - Pos: any
    AsciiString: "-- OPTIONAL. MATCH IMAGE ID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARTITION START_SECTOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-- OPERATION TYPE IS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-- DELETE PARTITION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USE_SOURCE_GEOMETRY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "-- COPY PARTITION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DRIVE_LETTER TYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLONE_DEFINITION"
    CaseSensitive: false
  - Pos: any
