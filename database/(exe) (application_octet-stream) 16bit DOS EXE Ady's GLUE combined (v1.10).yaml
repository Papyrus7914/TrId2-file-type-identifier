Name: 16bit DOS EXE Ady's GLUE combined (v1.10)
URL: "http://fileformats.archiveteam.org/wiki/Ady%27s_GLUE"
FileNameExtensions: ["exe"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "MZ"
    CaseSensitive: true
  - Pos: 16
    #        |
    Bytes: [0x7C, 0x01]
  - Pos: 20
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: 25
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "*69GL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LLPQ"
    CaseSensitive: false
