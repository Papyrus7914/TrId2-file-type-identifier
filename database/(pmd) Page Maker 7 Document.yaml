Name: Page Maker 7 Document
URL: "http://en.wikipedia.org/wiki/Adobe_PageMaker"
FileNameExtensions: ["pmd"]
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1]
  - Pos: any
    AsciiString: "ADOBE COMPATIBILITY CMS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGEMAKER 5.0 CMYK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGEMAKER 5.0 RGB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TIMES NEW ROMAN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PAGEMAKER 7.0"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BODY TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOCUMENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROGRAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INDENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENGL"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ILES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NONE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RSRC"
    CaseSensitive: false
