Name: AmiCAD keys/macro definition (v1.0)
Description: Vector schematic drawing tool for Amiga by Roland Florac.
FileNameExtensions: ["keys"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "AmiCADKeys 1.0\n\n[Macros]\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MACROS"
    CaseSensitive: false
