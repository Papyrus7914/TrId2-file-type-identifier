Name: Shell Scrap object
URL: "http://en.wikipedia.org/wiki/Shell_Scrap_Object_File"
FileNameExtensions: ["shs"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1]
  - Pos: 1024
    AsciiString: "R\0o\0o\0t\0 \0E\0n\0t\0r\0y"
    CaseSensitive: true
  - Pos: 1154
    AsciiString: "I\0T\0E\0M\00\00\00"
    CaseSensitive: true
  - Pos: any
    AsciiString: "I\0T\0E\0M\00\00\00\0F\0M\0T"
    CaseSensitive: false
  - Pos: any
    AsciiString: "O\0L\0E\0P\0R\0E\0S\00\00\00"
    CaseSensitive: false
  - Pos: any
    AsciiString: "R\0O\0O\0T\0 \0E\0N\0T\0R\0Y"
    CaseSensitive: false
