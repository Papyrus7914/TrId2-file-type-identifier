  - Pos: any
    AsciiString: "CUSTOMORGANTREMULANTWAVEFORMSET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "UNIQUEINSTALLATIONPACKAGEID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILEFORMATVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PACKAGESUPPLIERID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CUSTOMORGANRANK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SUPPLIERNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYS_OBJECTID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OBJECTLIST"
    CaseSensitive: false
  - Pos: any
    AsciiString: "OBJECTTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "HAUPTWERK"
    CaseSensitive: false
