Name: FreeMind mind map
Description: FreeMind is a free mind-mapping software written in Java.
URL: "http://freemind.sourceforge.net/wiki/index.php/Main_Page"
FileNameExtensions: ["mm"]
MimeType: application/x-freemind
DetectionPatterns:
  - Pos: 0
    AsciiString: "<map version=\""
    CaseSensitive: true
  - Pos: 15
    AsciiString: "."
    CaseSensitive: true
  - Pos: any
    AsciiString: "MAP VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "POSITION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NODE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
