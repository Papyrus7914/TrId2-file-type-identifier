Name: Capture Classic Filler - Accelio JetForm
URL: "http://www.adobe.com/enterprise/accelio_jetform_notice.html"
FileNameExtensions: ["jdt"]
DetectionPatterns:
  - Pos: 0
    Bytes: [0xD0, 0xCF, 0x11, 0xE0, 0xA1, 0xB1, 0x1A, 0xE1, 0x00]
  - Pos: 1024
    AsciiString: "R\0o\0o\0t\0 \0E\0n\0t\0r\0y"
    CaseSensitive: true
  - Pos: 1152
    AsciiString: "d\0a\0t\0a\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "TRANSACTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ENDSECTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SYMBOLSET"
    CaseSensitive: false
  - Pos: any
    AsciiString: "D\0A\0T\0A"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FIELD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORM"
    CaseSensitive: false
