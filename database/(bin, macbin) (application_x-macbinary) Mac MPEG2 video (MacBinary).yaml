Name: Mac MPEG2 video (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/MPEG-2"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "MPG2"
    CaseSensitive: true
  - Pos: any
    AsciiString: "MPG2"
    CaseSensitive: false
