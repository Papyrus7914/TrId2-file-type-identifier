Name: Super-Card Ami II copier (v4)
URL: "http://amiga.resource.cx/exp/supercardami2"
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0\0\0\x88\0\0\n\xA0"
    CaseSensitive: true
  - Pos: 12
    AsciiString: "JDC1"
    CaseSensitive: true
  - Pos: any
    AsciiString: "JDC1"
    CaseSensitive: false
