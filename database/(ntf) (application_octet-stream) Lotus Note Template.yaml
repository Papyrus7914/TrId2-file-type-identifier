Name: Lotus Note Template
URL: "https://en.wikipedia.org/wiki/HCL_Notes"
FileNameExtensions: ["ntf"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    Bytes: [0x1A, 0x00]
  - Pos: 4
    AsciiString: "\0\0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "$FORMULACLASS$COLLATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$VIEWFORMAT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ICONBITMAP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$CONFLICT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$FORMULA$"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MODIFIED"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NVERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION$"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$TITLE$"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESIGN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DOMAIN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SERVER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "$BODY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LOTUS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NOTES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRIV"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USER"
    CaseSensitive: false
