Name: Ozone GUI executable code
Description: Mutliplatform desktop environment.
URL: "http://ozonegui.sourceforge.net"
FileNameExtensions: ["app", "dl"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "dLnD"
    CaseSensitive: true
  - Pos: 15
    AsciiString: "@"
    CaseSensitive: true
