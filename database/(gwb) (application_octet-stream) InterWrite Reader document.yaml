Name: InterWrite Reader document
FileNameExtensions: ["gwb"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "GWB"
    CaseSensitive: true
  - Pos: 4
    AsciiString: "."
    CaseSensitive: true
  - Pos: 7
    AsciiString: " "
    CaseSensitive: true
  - Pos: any
    AsciiString: "IDATX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GAMA"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IEND"
    CaseSensitive: false
  - Pos: any
    AsciiString: "IHDR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SRGB"
    CaseSensitive: false
