Name: GNU Bison grammar (with rem)
URL: "https://en.wikipedia.org/wiki/GNU_bison"
FileNameExtensions: ["yy"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "/"
    CaseSensitive: true
  - Pos: any
    AsciiString: "DEFINES"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INCLUDE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "%TOKEN"
    CaseSensitive: false
  - Pos: any
    AsciiString: "STRING"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARSE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VOID"
    CaseSensitive: false
