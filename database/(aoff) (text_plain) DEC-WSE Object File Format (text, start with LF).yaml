Name: DEC-WSE Object File Format (text, start with LF)
URL: "http://fileformats.archiveteam.org/wiki/OFF_(DEC-WSE_Object_File_Format)"
FileNameExtensions: ["aoff"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "\n"
    CaseSensitive: true
  - Pos: any
    AsciiString: "POLYGON_COLORS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "INDEXED_POLY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERTEX_ORDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLOCKWISE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "COPYRIGHT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GEOMETRY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DEFAULT"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".GEOM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
