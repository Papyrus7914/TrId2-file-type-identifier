Name: Deep Thought disk Image
Description: Contain a byte-level decoding of disk created by the Deep Thought disk interface for the Jupiter Ace.
URL: "http://www.jupiter-ace.co.uk/hardware_DeepThought.html"
FileNameExtensions: ["dti"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "H2G2"
    CaseSensitive: true
