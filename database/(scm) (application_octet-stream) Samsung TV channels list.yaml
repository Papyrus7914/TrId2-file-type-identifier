Name: Samsung TV channels list
URL: "https://sourceforge.net/projects/samschanneledit/"
FileNameExtensions: ["scm"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "USERTRANSPONDERDATABASE.DATPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FINETUNE_DIGITALPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SERVICEPROVIDERSPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SATDATABASE.DATPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CLONEINFOPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAP-CHKEYPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "RADIOMAPPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MAP-AIR"
    CaseSensitive: false
