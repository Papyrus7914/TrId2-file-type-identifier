Name: TEI document
URL: "https://wiki.tei-c.org/index.php/Main_Page"
FileNameExtensions: ["xml"]
MimeType: application/tei+xml
DetectionPatterns:
  - Pos: 0
    AsciiString: "<"
    CaseSensitive: true
  - Pos: any
    AsciiString: "PUBLICATIONSTMT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOURCEDESC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEIHEADER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TITLESTMT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FILEDESC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EDIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
