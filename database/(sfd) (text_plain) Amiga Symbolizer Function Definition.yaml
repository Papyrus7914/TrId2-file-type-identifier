Name: Amiga Symbolizer Function Definition
FileNameExtensions: ["sfd"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "==id $"
    CaseSensitive: true
  - Pos: any
    AsciiString: "INCLUDE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LIBRARY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PUBLIC"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".SFD"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BASE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BIAS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
