Name: Meson Wrap info
URL: "https://mesonbuild.com/"
FileNameExtensions: ["wrap"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "[wrap-file]"
    CaseSensitive: true
  - Pos: any
    AsciiString: "SOURCE_FILENAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOURCE_HASH"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SOURCE_URL"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".TAR."
    CaseSensitive: false
  - Pos: any
    AsciiString: "HTTP"
    CaseSensitive: false
