Name: OpenVPN profile (with rem)
URL: "https://en.wikipedia.org/wiki/OpenVPN"
FileNameExtensions: ["ovpn"]
MimeType: application/x-openvpn-profile
DetectionPatterns:
  - Pos: 0
    AsciiString: "#"
    CaseSensitive: true
  - Pos: any
    AsciiString: "CLIENT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "REMOTE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "CERT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERB"
    CaseSensitive: false
