Name: S10 WebAlbums project
URL: "http://www.s10soft.com/webalbums.htm"
FileNameExtensions: ["s10w"]
MimeType: text/plain
DetectionPatterns:
  - Pos: 0
    AsciiString: "AlbumsList"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ALBUMSLISTTYPE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PHOTOQUALITY"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FTPFOLDER"
    CaseSensitive: false
  - Pos: any
    AsciiString: "ORIGPATHS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "VERSION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WEBLANG"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".JPG"
    CaseSensitive: false
