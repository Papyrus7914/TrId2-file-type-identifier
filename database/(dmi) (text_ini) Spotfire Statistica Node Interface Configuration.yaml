Name: Spotfire Statistica Node Interface Configuration
URL: "https://www.spotfire.com/"
FileNameExtensions: ["dmi"]
MimeType: text/ini
DetectionPatterns:
  - Pos: 0
    AsciiString: "[NODE]"
    CaseSensitive: true
  - Pos: any
    AsciiString: "ICONANALYSISID"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESCRIPTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "USERACCESS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "READWRITE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHORTDESC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LONGDESC"
    CaseSensitive: false
  - Pos: any
    AsciiString: "LONGNAME"
    CaseSensitive: false
  - Pos: any
    AsciiString: "WEBIMAGE"
    CaseSensitive: false
  - Pos: any
    AsciiString: "NEWTAB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PARAM1"
    CaseSensitive: false
  - Pos: any
    AsciiString: "GROUP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MACRO"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".GIF"
    CaseSensitive: false
  - Pos: any
    AsciiString: ".SVX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TYPE"
    CaseSensitive: false
