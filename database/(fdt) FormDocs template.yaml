Name: FormDocs template
Description: Formdocs is an electronic form design and form filler application.
URL: "http://www.formdocs.com/"
FileNameExtensions: ["fdt"]
DetectionPatterns:
  - Pos: 2
    AsciiString: "\0\0\0\x01"
    CaseSensitive: true
  - Pos: 8
    #                                f     t
    Bytes: [0x10, 0x01, 0x04, 0x01, 0x66, 0x74, 0x04, 0x02, 0x01, 0x05, 0x04, 0x03]
  - Pos: any
    AsciiString: "PRIVATE SUB BTN_"
    CaseSensitive: false
  - Pos: any
    AsciiString: "_CLICK ()"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FORMDOCS"
    CaseSensitive: false
  - Pos: any
    AsciiString: "END SUB"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PROGRAM"
    CaseSensitive: false
  - Pos: any
    AsciiString: "FIELD."
    CaseSensitive: false
  - Pos: any
    AsciiString: "MSGBOX"
    CaseSensitive: false
  - Pos: any
    AsciiString: "THISF"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PTION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "TEXT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "EXIT"
    CaseSensitive: false
  - Pos: any
    AsciiString: "YOUR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "DESI"
    CaseSensitive: false
