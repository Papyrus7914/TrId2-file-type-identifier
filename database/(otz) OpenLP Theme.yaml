Name: OpenLP Theme
URL: "http://openlp.org/"
FileNameExtensions: ["otz"]
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "OUTLINE OUTLINECOLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SHADOW SHADOWCOLOR"
    CaseSensitive: false
  - Pos: any
    AsciiString: "BACKGROUND TYPE"
    CaseSensitive: false
