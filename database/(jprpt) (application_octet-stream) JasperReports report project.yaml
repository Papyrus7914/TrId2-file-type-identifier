Name: JasperReports report project
URL: "https://en.wikipedia.org/wiki/JasperReports"
FileNameExtensions: ["jprpt"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: ".JRXML"
    CaseSensitive: false
