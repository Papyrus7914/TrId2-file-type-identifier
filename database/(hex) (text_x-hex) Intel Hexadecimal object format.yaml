Name: Intel Hexadecimal object format
URL: "https://en.wikipedia.org/wiki/Intel_HEX"
FileNameExtensions: ["hex"]
MimeType: text/x-hex
DetectionPatterns:
  - Pos: 0
    AsciiString: ":"
    CaseSensitive: true
  - Pos: 7
    AsciiString: "0"
    CaseSensitive: true
  - Pos: any
    AsciiString: "00000001FF"
    CaseSensitive: false
