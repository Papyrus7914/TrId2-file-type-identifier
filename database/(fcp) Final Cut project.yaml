Name: Final Cut project
URL: "http://www.finalcut.com"
FileNameExtensions: ["fcp"]
DetectionPatterns:
  - Pos: 0
    AsciiString: "\xA2KeyG\n\r\n"
    CaseSensitive: true
  - Pos: 52
    AsciiString: "subtype"
    CaseSensitive: true
  - Pos: 94
    AsciiString: "RUNTIME"
    CaseSensitive: true
  - Pos: 117
    AsciiString: "viewers"
    CaseSensitive: true
