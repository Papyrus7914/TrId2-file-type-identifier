Name: Zooper Widget template
URL: "https://play.google.com/store/apps/details?id=org.zooper.zwfree"
FileNameExtensions: ["zw"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: any
    AsciiString: "PRESET.JSONPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "SCREEN.PNGPK"
    CaseSensitive: false
  - Pos: any
    AsciiString: "0\0\0\0MODULE."
    CaseSensitive: false
