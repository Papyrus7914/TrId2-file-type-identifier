Name: Paradox Table View
URL: "https://en.wikipedia.org/wiki/Paradox_(database)"
FileNameExtensions: ["tv"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    AsciiString: "Borland Standard File\0"
    CaseSensitive: true
  - Pos: 32
    AsciiString: "\xF0\xDE:WORK:"
    CaseSensitive: true
  - Pos: 48
    AsciiString: ".DB"
    CaseSensitive: true
  - Pos: any
    AsciiString: "WORK"
    CaseSensitive: false
