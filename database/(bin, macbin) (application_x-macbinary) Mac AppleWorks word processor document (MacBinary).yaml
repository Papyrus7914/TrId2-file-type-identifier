Name: Mac AppleWorks word processor document (MacBinary)
Description: MacBinary is a standard for encoding Macintosh files for file transfer.
URL: "https://en.wikipedia.org/wiki/AppleWorks"
FileNameExtensions: ["bin", "macbin"]
MimeType: application/x-macbinary
DetectionPatterns:
  - Pos: 0
    AsciiString: "\0"
    CaseSensitive: true
  - Pos: 65
    AsciiString: "AWWP"
    CaseSensitive: true
  - Pos: any
    AsciiString: "AWWP"
    CaseSensitive: false
