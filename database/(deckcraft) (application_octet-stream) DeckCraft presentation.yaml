Name: DeckCraft presentation
URL: "https://getartcraft.com/"
FileNameExtensions: ["deckcraft"]
MimeType: application/octet-stream
DetectionPatterns:
  - Pos: 0
    #        P     K
    Bytes: [0x50, 0x4B, 0x03, 0x04]
  - Pos: 30
    AsciiString: "mimetypeapplication/vnd.storyteller.deckcraft+zip"
    CaseSensitive: true
  - Pos: 109
    AsciiString: "presentation.json"
    CaseSensitive: true
  - Pos: any
    AsciiString: "VND.STORYTELLER.DECKCRAFT+ZIP"
    CaseSensitive: false
  - Pos: any
    AsciiString: "MIMETYPEAPPLICATION"
    CaseSensitive: false
  - Pos: any
    AsciiString: "PRESENTATION.JSON"
    CaseSensitive: false
